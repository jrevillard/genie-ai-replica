# =============================================================================
# GENIE.AI — OpenTelemetry Collector Configuration
# =============================================================================
# Receives OTLP traces from instrumented services (backend, chatqna, retriever,
# dataprep, reranker) and exports metrics to VictoriaMetrics.
#
# Receivers:
#   - OTLP HTTP (port 4318): standard OTLP/HTTP from SDK auto-instrumentation
#
# Exporters:
#   - prometheusremotewrite (port 8428): exports OTel metrics to VictoriaMetrics
#   - debug: logs traces to collector stdout (debugging / stdout aggregation)
#
# Extensions:
#   - health_check (port 13133): Docker healthcheck endpoint
#
# Pipeline:
#   metrics: otlp → batch → prometheusremotewrite
#   traces:  otlp → batch → debug
#
# Note: VictoriaMetrics is a metrics backend, not a trace store.
# Trace-derived metrics (latency histograms, request counts) are exported.
# Full trace storage (Jaeger/Tempo) is deferred to the MELT initiative.
# =============================================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    timeout: 15s
  debug:
    verbosity: basic

service:
  extensions:
    - health_check
  pipelines:
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - prometheusremotewrite
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - debug
