{{/*
  vLLM OpenAI-compatible chat server (in-cluster GPU mode only; the
  external mode emits no model pods). Image pulled from docker.io
  unconditionally — not mirrored in the GitLab registry; an air-gapped
  site mirrors it and rewrites the reference via insertAgent. Skeleton
  via genieai-umbrella.modelDeployment; this file carries only the
  model-specific args.
*/}}
{{- $opea := .Values.opea | default dict -}}
{{- $opeaGpu := $opea.gpu | default dict -}}
{{- $opeaModels := $opea.models | default dict -}}
{{- $opeaModelsLlm := $opeaModels.llm | default dict -}}

{{- if and $opea.enabled (eq $opeaGpu.mode "in-cluster") -}}
{{- $modelId := $opeaModelsLlm.modelId | default "ibm-granite/granite-4.1-8b" | toString -}}
{{- $llm := $opeaModelsLlm -}}
{{- include "genieai-umbrella.modelDeployment" (dict
      "root" .
      "name" "vllm"
      "image" "docker.io/vllm/vllm-openai:v0.29.0"
      "port" 8000
      "mountPath" "/root/.cache/huggingface"
      "readinessDelay" 30
      "livenessDelay" 60
      "startup" (dict "failureThreshold" 30 "periodSeconds" 10)
      "argsText" (printf "            - --model\n            - \"%s\"\n            - --gpu_memory_utilization\n            - \"%s\"\n            - --served-model-name\n            - \"%s\"\n            - --max_model_len\n            - \"%s\"\n            - --max_num_seqs\n            - \"%s\"\n            - --dtype=%s\n            - --enforce-eager\n            - --port\n            - \"8000\"" $modelId ($llm.gpuUtilization | default "0.55" | toString) $modelId ($llm.maxModelLen | default "65536" | toString) ($llm.maxNumSeqs | default "64" | toString) ($llm.dtype | default "half" | toString))
    ) -}}
{{- end -}}
