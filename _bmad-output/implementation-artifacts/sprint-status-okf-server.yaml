  # ── Publish/ingest cycle defects (2026-10-13/14) — PC-1..PC-8 ──
  # Full write-up: implementation-artifacts/defects-publish-cycle-2026-10-13.md
  pc-1-unstructured-xml-pi-crash: done # [FIXED 2026-10-13 — commits 03e2bc260 + 2f90ae5de on fix/okf-unstructured-remove-pis — NOT DEPLOYED, NOT PUSHED] David's Solar System ingest error "'lxml.etree._ProcessingInstruction' object has no attribute 'is_phrasing'" on pds4-dph-1-26-0-sec99 + sec100. unstructured parser.py:929 builds the only etree.HTMLParser(remove_comments=True); the ElementNamespaceClassLookup at :933 maps classes for _Element SUBCLASSES only, so a PI node falls through to lxml's bare class with no is_phrasing (traversal sites :423/:628/:750). Reachable from ordinary content — partition_md renders markdown to an HTML STRING (md.py:76→78) and Python-Markdown passes a literal <?xml ?> line through unescaped; PDS4_DPH_1.26.0.pdf does that on 13 of 155 pages. FIX = upstream's own remove_pis=True added in 0.27.8 (upstream issue #4358), applied as a build patch because we are pinned to 0.18.32 across a 374-package --require-hashes lock; patching the CONSTRUCTION site means no next unguarded attribute exists for the crash to relocate into. Falsified before fixing: lxml 4.9.4 vs 5.4.0 fail identically (not version skew), boundary sanitisation deletes legitimate fenced-code content (195→164 chars measured), node guards leave 5/13 still crashing, docling drops content (772 vs ~153071 chars). Three outcomes never silent-no-op — a patcher that no-ops is worse than none, so an unrecognised parser.py SystemExits and FAILS THE IMAGE BUILD. 13/13 PI cases pass, 0 changed outputs across a 138-document previously-passing corpus. RE-TEST: rebuild dataprep, re-ingest sec99+sec100 → both status=ingested, plus negative control (a content-free concept must still fail "No valid content extracted").
  pc-2-pii-worker-gil-region-split: done # [FIXED 2026-10-12 — f6ac10c8e serialize + cc19bbe6a respawn-no-permanent-error + 9e434c981 split_regions — DEPLOYED] An 805 KB concept could never publish. The PII sidecar is uvicorn-multiprocess; a single analyze() holds the GIL inside native spaCy/thinc so the child misses its 5s liveness pong and is SIGKILLed mid-scan → ECONNRESET → the fail-closed publish gate records a PERMANENT error state. Recovering needed retract→create version→ingest repeatedly (landed on attempt 5 via the reaper). Fix splits long text into PII_REGION_MAX_CHARS regions (default 50000, env §15, documented to lower on a slower host) so no single analyze() can exceed the supervisor window. MEASURED: an 850 KB page killed the worker 8/8 before, 0/10 after, split into 18 regions; a live 12-region scan gave 4791 hits / 8273 distinct offsets / 0 deaths. RESIDUAL OPEN: 2 post-scan deaths remain, both AFTER scan completion — serialization pressure is a HYPOTHESIS, not a conclusion; needs instrumentation of that window.
  pc-3-pii-bulk-accept-dead-code: done # [FIXED 2026-10-13 — 3b6c17b64 — DEPLOYED — NO PIPELINE] pii-service.js filtered prior resolutions with .filter(r => r.action === 'accept') but the bulk path writes the ACCEPT_ALL_FINDINGS constant, so the filter matched NOTHING and a whole-concept "Accept all" never suppressed the findings it had just resolved. isSuppressingAccept() now takes {accept, ACCEPT_ALL_FINDINGS}; both call sites use it. accept_repo deliberately EXCLUDED — 321 legacy records carry it and must stay inert. Test drives inspectConcept through the REAL call path with persisted findings + ledger, not just the unit; falsified by reverting the filter (2 findings returned instead of 0).
  pc-4-vacuous-offset-translation-test: done # [FIXED 2026-10-13 — 53b731400 — NO PIPELINE] test_offsets_are_absolute_across_regions asserted only 0<=start<=end<=len(text) and end-start==5, both satisfied by the region-LOCAL pair (0,5) — it would have passed with the pc-2 fix REVERTED, which was the test that mattered. Now asserts distinct starts, ascending order, equality with split_regions offsets, and that the spans slice the original text.
  pc-5-retraction-log-asserts-caller-intent: done # [FIXED 2026-10-13 — e96a3f90b — DEPLOYED — NO PIPELINE] The log emitted "Starting retraction analysis..." FIRST and unconditionally, so a curator scanning the bundle's Ingestion Log concluded his data was being deleted and stopped reading. retract_file has three callers — okf-server's defensive pre-POST sweep (the common case, finds 0) plus the CancelledError/generic-Exception rollbacks inside dataprep — and the old wording ("This is the normal pre-ingest cleanup check", "no retraction is in progress") is FALSE on both rollback paths, where the call IS the retraction. Outcome first, intent second; behaviour unchanged (the orphan-cleanup find always runs, the chunk count is still logged, cleanup stays auditable).
  pc-6-wizard-step5-publish-pii-verdict: done # [FIXED 2026-10-13 — c0169886d — DEPLOYED — NO PIPELINE OF ITS OWN] David on step 5 ("it seems redundant… you cannot do anything about the labels displayed") and on the publish gate ("this will obviously NOT work properly with a full end to end test"). Adds the publish-time PII verdict + whole-repo re-scan, PiiReviewSummary / PiiRepoRescan / piiReview.js, a real review verdict surfaced in review, and rewrites the step-4/step-5 narrative in ALL 14 locales; deletes 3 dead i18n keys (add, addConfirm, placeholder) that no component read. CORRECTION 2026-10-14: this entry previously read NOT DEPLOYED, on the evidence that "0 of its 6 new exported identifiers appear in the served bundle". That check was WRONG — it grepped the minified bundle for exported const NAMES (PII_CHECKING, PII_UNREADABLE, …) which Terser renames and inlines, so they could never appear regardless of whether the code shipped. Grepping for i18n key STRINGS instead (they survive minification as literals) finds piiRescan, piiReview, unreadableTitle, progressIdle and stillBlocking all present, and the running frontend image was built 2026-10-13 14:28 UTC — 2h45m AFTER c0169886d landed at 11:43 UTC. PC-6 shipped with the build that followed it. Same class as the sidecar "died" substring false positive.
  pc-7-ansible-env-carried-no-pii-vars: done # [FIXED 2026-10-13 — c22262c89 + 14f2ddfad — NO PIPELINE] Every PII tuning knob existed in docker-compose.yaml and env but NOT in deploy/ansible/templates/env.j2, so an Ansible (cloud) deploy silently dropped the ENTIRE PII configuration — the exact class the config-validator parity tests exist to catch, and they did not cover it. env.j2 additions + parity pinned in config-validation.test.js (51/51).
  pc-8-remove-pis-patcher-would-fail-build: done # [FIXED 2026-10-13 — 2f90ae5de — NOT PUSHED] Found by dry-running the pc-1 patcher against the REAL parser.py copied out of the running image, not against my own fixture. (1) The real constructor sits at COLUMN 0; a literal carrying 4 spaces of assumed indent never matches, the guard fires, and the IMAGE BUILD FAILS — the patcher now matches on content while capturing and reapplying the file's own indentation. (2) read_text/write_text use newline=None, translating LF to os.linesep on write — a Windows dry run turned all 1018 lines CRLF, making a one-line patch look like a whole-file rewrite; now open(..., newline="") on both. (3) The test fixture was CRLF on this host, failing 6 tests while the summary claimed otherwise. Same lesson as pc-4 — exercise a patch against the REAL artefact.
