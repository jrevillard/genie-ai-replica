# Create GitLab Release with changelog content for the tagged version
# Uses GitLab's native `release` keyword — no token/scope setup needed.
# Pin the official release-cli image: the runner does not inject the
# release-cli binary into job containers (observed "release-cli: not found").
release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      VERSION_ESC=$(echo "${VERSION}" | sed 's/\./\\./g')
      echo "Extracting changelog for version ${VERSION}..."
      awk "/^## \[${VERSION_ESC}\]/{p=1; next} /^## \[/{p=0} p" CHANGELOG.md | sed '/^\[/,$d' > release-notes.md
      if [ ! -s release-notes.md ]; then
        echo "WARNING: No changelog content found for ${VERSION}, creating release with tag only."
        echo "Release ${CI_COMMIT_TAG}" > release-notes.md
      fi
    - echo "GitLab Release created for ${CI_COMMIT_TAG}."
  release:
    tag_name: $CI_COMMIT_TAG
    description: release-notes.md
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# --- Lint jobs ---

lint:backend:
  extends: .lint_node
  # sharp's install downloads libvips + its native binary from GitHub release
  # assets, which are unreachable from the CI runner container (connection
  # resets with "socket hang up"). Mirror both to npmmirror (verified reachable
  # from the runner). CI-only: local devs keep the default hosts.
  variables:
    npm_config_sharp_libvips_binary_host: "https://npmmirror.com/mirrors/sharp-libvips"
    npm_config_sharp_binary_host: "https://npmmirror.com/mirrors/sharp"
    # Full-depth fetch (2026-10-19): the default depth-20 fetch on the MR
    # pipeline's reused runner workspace left stale bytes of files UNCHANGED
    # within the shallow window — prettier then linted main's unformatted
    # copies of keycloak-auth-service.js / tracing.js against a branch whose
    # own copies are clean (branch pipeline green, exact docker repro green).
    # A full fetch makes git re-checkout every differing path, so workspace
    # residue from other refs cannot masquerade as this ref's content.
    GIT_DEPTH: 0
  before_script:
    - cd components/gov-chat-backend && npm ci
  script:
    - npm run lint
    - npm run format:check
  cache:
    - key:
        files:
          - components/gov-chat-backend/package-lock.json
        prefix: lint-backend
      paths:
        - components/gov-chat-backend/node_modules/
      fallback_keys:
        - "lint-backend-$CI_DEFAULT_BRANCH"
        - "lint-backend-"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/gov-chat-backend/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

