# issue-sync/sync-scoped.yaml
#
# Purpose: Targeted sync + content-population for a whitelist of sprint keys.
#           Reads scope from BMAD_ISSUE_SYNC_SCOPE env var (comma-separated
#           sprint keys), populate-description toggle from
#           BMAD_ISSUE_SYNC_POPULATE_DESC env var, and comment body from a
#           file path in BMAD_ISSUE_SYNC_COMMENT_FILE env var (the JS
#           orchestrator writes the user-supplied comment to a unique tmp
#           file to avoid shell-injection through env interpolation).
#           Falls back to full sweep when scope is empty.
#
# Input variables (primed by INCLUDE common/check-config below):
#   - platform, git_platform, host, project, project_enc, sep, prd_key
#   - implementation_artifacts, planning_artifacts
# Input variables (env-driven, set by JS orchestrator Skill invocation):
#   - BMAD_ISSUE_SYNC_SCOPE: comma-separated sprint keys (e.g. "1-1-…,epic-2").
#                            Empty/unset = full sweep.
#   - BMAD_ISSUE_SYNC_COMMENT_FILE: path to a tmp file containing the comment
#                                   body to post on every synced issue.
#                                   Empty/unset = no comment.
#   - BMAD_ISSUE_SYNC_POPULATE_DESC: "true" (default) or "false". When "true",
#                                    refresh issue description from spec file
#                                    (stories) or epics.md section (epics).
# Output variables:
#   - sync_created, sync_updated, sync_skipped, sync_closed
#   - comments_posted, descriptions_updated
#     (sync_filtered removed — Python pre-filter drops out-of-scope entries
#      so no in-workflow increment site remained. Re-introduce if a per-entry
#      drop counter is needed.)
# Side effects: creates/updates/closes issues on the tracker; posts comments;
#               writes /tmp/issue-desc-{entry}.md and /tmp/issue-comment-{entry}.md.

# --------------------------------------------------------------------------
# Phase 0: init + read scope/comment/populate from env via python (safe —
# avoids both workflow-engine substitution of literal {var} chars in shell
# strings AND bash command injection through env-var interpolation).
# --------------------------------------------------------------------------
- INCLUDE: common/check-config
- INCLUDE: common/find-prd-key
- SET: { variable: sync_created, value: "0" }
- SET: { variable: sync_updated, value: "0" }
- SET: { variable: sync_skipped, value: "0" }
- SET: { variable: sync_closed, value: "0" }
- SET: { variable: comments_posted, value: "0" }
- SET: { variable: descriptions_updated, value: "0" }
- RUN: uv run --no-project python -c '
import os, sys
scope = os.environ.get("BMAD_ISSUE_SYNC_SCOPE", "").strip()
populate = os.environ.get("BMAD_ISSUE_SYNC_POPULATE_DESC", "true").strip().lower()
comment_file = os.environ.get("BMAD_ISSUE_SYNC_COMMENT_FILE", "").strip()
print("true" if populate != "false" else "false")
'
  STORE: sync_populate_description
- RUN: uv run --no-project python -c '
import os, sys
scope = os.environ.get("BMAD_ISSUE_SYNC_SCOPE", "").strip()
keys = sorted({k.strip() for k in scope.split(",") if k.strip()})
for k in keys:
    print(k)
'
  STORE: entry_filter_lines
- RUN: uv run --no-project python -c '
import os, sys
path = os.environ.get("BMAD_ISSUE_SYNC_COMMENT_FILE", "").strip()
if path and os.path.exists(path):
    with open(path, "r", encoding="utf-8") as f:
        sys.stdout.write(f.read())
'
  STORE: comment_body

# --------------------------------------------------------------------------
# Phase 1: bulk fetch all PRD issues (label diff index)
# --------------------------------------------------------------------------
- RUN: glab api "projects/{project_enc}/issues?labels=prd{sep}{prd_key}&state=all&per_page=100" --hostname {host} --paginate | uv run --no-project python -c "
import json, sys
issues = json.load(sys.stdin)
for i in issues:
    status = next((l for l in i['labels'] if l.startswith('status')), 'none')
    print(str(i['iid']) + '\t' + i['title'] + '\t' + status)
"
  STORE: issue_index
  PLATFORM: gitlab
  EXPECT_EXIT: any
- RUN: gh api "search/issues?q=repo:{project}+label:prd{sep}{prd_key}&per_page=100" --hostname {host} --paginate | uv run --no-project python -c "
import json, sys
data = json.load(sys.stdin)
for item in data.get('items', []):
    status = next((l['name'] for l in item['labels'] if l['name'].startswith('status')), 'none')
    print(str(item['number']) + '\t' + item['title'] + '\t' + status)
"
  STORE: issue_index
  PLATFORM: github
  EXPECT_EXIT: any
- RUN: cat {implementation_artifacts}/sprint-status.yaml | uv run --no-project python -c '
import os, re, sys
scope_env = os.environ.get("BMAD_ISSUE_SYNC_SCOPE", "").strip()
scope_keys = {k.strip() for k in scope_env.split(",") if k.strip()} if scope_env else set()
content = sys.stdin.read()
# Sprint-key chars: letters/digits/dash/dot/colon/plus/underscore. Anything else
# (whitespace, slash, quote, backslash, dollar, backtick, parens) is suspicious —
# likely a tampered file. Drop the entry silently rather than passing
# shell-meta characters into unquoted {entry} substitutions downstream.
key_re = re.compile(r"^[A-Za-z0-9._:+-]+$")
in_block = False
for line in content.splitlines():
    s = line.rstrip()
    if s == "development_status:":
        in_block = True
        continue
    if not in_block:
        continue
    # End of block: any top-level key (no leading whitespace, has colon)
    if s and not s.startswith(" ") and not s.startswith("\t") and ":" in s:
        # Allow empty values, but the line must look like a top-level key
        k = s.split(":", 1)[0].strip()
        if k and not k.startswith("#"):
            in_block = False
            continue
    if not s.startswith(" ") and not s.startswith("\t"):
        continue
    if ":" not in s:
        continue
    key, _, value = s.lstrip().partition(":")
    key = key.strip()
    value = value.strip()
    if not key or not key_re.match(key):
        continue
    if scope_keys and key not in scope_keys:
        continue
    print(key + chr(9) + value)
'
  STORE: filtered_entries

# --------------------------------------------------------------------------
# Phase 3: loop over pre-filtered entries, sync each
# --------------------------------------------------------------------------
- LOOP:
    items: filtered_entries
    as: entry_line
    do:
      # entry_line format: "key<TAB>status". Extract both via python.
      - RUN: uv run --no-project python -c "
import sys
parts = sys.argv[1].split('\t', 1)
print(parts[0] if parts else '')
print(parts[1] if len(parts) > 1 else '')
" {entry_line}
        STORE: entry_status_pair
      - RUN: uv run --no-project python -c "
key, _, _ = sys.argv[1].partition('\t')
print(key)
" {entry_line}
        STORE: entry
      - RUN: uv run --no-project python -c "
parts = sys.argv[1].split('\t', 1)
print(parts[1].strip() if len(parts) > 1 else '')
" {entry_line}
        STORE: entry_status
      # --- Classify entry (epic / story / retrospective) ---
      - RUN: uv run --no-project python -c "
import sys
key = sys.argv[1].strip()
if key.startswith('epic-') and '-retrospective' not in key:
    print('epic')
elif key.endswith('-retrospective'):
    print('retrospective')
else:
    print('story')
" {entry}
        STORE: entry_type
      # --- Extract epic number ---
      - RUN: uv run --no-project python -c "
import sys, re
key = sys.argv[1].strip()
m = re.match(r'epic-(\d+)', key)
if m:
    print(m.group(1))
else:
    parts = key.split('-')
    print(parts[0] if len(parts) >= 2 else '')
" {entry}
        STORE: epic_num
      # --- Extract title ---
      - CHECK: entry_type eq "epic"
        TRUE:
          - RUN: uv run --no-project python -c "
import sys, re
with open(sys.argv[1], 'r', encoding='utf-8') as f:
    content = f.read()
n = sys.argv[2]
sections = list(re.finditer(r'^## Epic ' + n + r':', content, re.MULTILINE))
if not sections:
    print('Epic ' + n)
else:
    start = sections[0].start()
    end = sections[1].start() if len(sections) > 1 else len(content)
    body = content[start:end].strip()
    title_line = ''
    for line in body.split('\n'):
        if line.startswith('#') and not line.startswith('## Epic'):
            title_line = line.lstrip('#').strip()
            break
    print('Epic ' + n + ': ' + title_line if title_line else 'Epic ' + n)
" {planning_artifacts}/epics.md {epic_num}
          STORE: entry_title
          EXPECT_EXIT: any
        FALSE:
          - CHECK: entry_type eq "retrospective"
            TRUE:
              - SET: { variable: entry_title, value: "Retrospective: Epic {epic_num}" }
            FALSE:
              - RUN: uv run --no-project python -c "
import sys, os
path = os.path.join(sys.argv[1], sys.argv[2] + '.md')
if os.path.exists(path):
    with open(path, 'r', encoding='utf-8') as f:
        for line in f:
            if line.startswith('#'):
                heading = line.lstrip('#').strip()
                if heading.startswith('Story '):
                    print(heading)
                else:
                    parts = sys.argv[2].split('-')
                    print('Story ' + parts[0] + '.' + parts[1] + ': ' + heading if len(parts) >= 2 else heading)
                break
else:
    parts = sys.argv[2].split('-')
    if len(parts) >= 2:
        title_part = ' '.join(parts[2:]).title() if len(parts) > 2 else 'Untitled'
        print('Story ' + parts[0] + '.' + parts[1] + ': ' + title_part)
    else:
        print(sys.argv[2])
" {implementation_artifacts} {entry}
              STORE: entry_title
              EXPECT_EXIT: any
      # --- Map legacy status names ---
      - CHECK: entry_status eq "drafted"
        TRUE:
          - SET: { variable: mapped_status, value: "ready-for-dev" }
        FALSE:
          - CHECK: entry_status eq "contexted"
            TRUE:
              - SET: { variable: mapped_status, value: "in-progress" }
            FALSE:
              - SET: { variable: mapped_status, value: "{entry_status}" }
      # --- Find existing issue ---
      - SET: { variable: search_text, value: "{entry}" }
      - INCLUDE: common/find-issue
      # --- Create or update ---
      - CHECK: empty issue_id
        FALSE:
          # --- Issue exists — compare status ---
          # EXPECT_EXIT: any — a transient glab/gh blip during per-entry fetch
          # must NOT halt the whole sync (the orchestrator's outer try/catch
          # catches the halt, but we'd lose partial work for in-scope entries
          # still pending). With EXPECT_EXIT: any, the python parser returns an
          # empty stdout (STORE: current_status_label → ""), the next CHECK sees
          # no status match → unconditional update fires, so the issue stays in
          # the right shape instead of falling behind silently.
          - RUN: glab api "projects/{project_enc}/issues/{issue_id}" --hostname {host} | uv run --no-project python -c "
import json, sys
for l in json.load(sys.stdin)['labels']:
    if l.startswith('status'):
        print(l)
"
            STORE: current_status_label
            PLATFORM: gitlab
            EXPECT_EXIT: any
          - RUN: gh api "repos/{project}/issues/{issue_id}" --hostname {host} --jq '[.labels[] | select(.name | startswith("status:")) | .name][0] // "none"'
            STORE: current_status_label
            PLATFORM: github
            EXPECT_EXIT: any
          - CHECK: current_status_label eq "status{sep}{mapped_status}"
            TRUE:
              - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {sync_skipped}
                STORE: sync_skipped
            FALSE:
              - SET: { variable: new_status, value: "{mapped_status}" }
              - CHECK: mapped_status eq "done"
                TRUE:
                  - SET: { variable: close, value: "true" }
                FALSE:
                  - CHECK: mapped_status eq "closed"
                    TRUE:
                      - SET: { variable: close, value: "true" }
                    FALSE:
                      - CHECK: mapped_status eq "backlog"
                        TRUE:
                          - SET: { variable: close, value: "none" }
                        FALSE:
                          - CHECK: mapped_status eq "deferred"
                            TRUE:
                              - SET: { variable: close, value: "none" }
                            FALSE:
                              - CHECK: mapped_status eq "optional"
                                TRUE:
                                  - SET: { variable: close, value: "none" }
                                FALSE:
                                  - CHECK: mapped_status eq "awaiting-operator"
                                    TRUE:
                                      - SET: { variable: close, value: "none" }
                                    FALSE:
                                      - SET: { variable: close, value: "false" }
              - INCLUDE: common/update-issue-status
              - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {sync_updated}
                STORE: sync_updated
              # Increment sync_closed when an issue is being closed
              - CHECK: close eq "true"
                TRUE:
                  - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {sync_closed}
                    STORE: sync_closed
        TRUE:
          # --- Issue missing — create ---
          - WRITE:
              file: /tmp/issue-desc-{entry}.md
              content: "**Sprint Key:** `{entry}`\n**Epic:** {epic_num}\n**PRD:** {prd_key}\n\n---\n\n{entry_title}"
              mode: overwrite
          - CHECK: entry_type eq "epic"
            TRUE:
              - READ: {planning_artifacts}/epics.md
                STORE: epic_content
                EXPECT_EXIT: any
              - RUN: uv run --no-project python -c "
import sys, re
content = sys.argv[1]
n = sys.argv[2]
sections = list(re.finditer(r'^## Epic ' + n + r':', content, re.MULTILINE))
if sections:
    start = sections[0].start()
    end = sections[1].start() if len(sections) > 1 else len(content)
    print(content[start:end].strip())
else:
    print('')
" {epic_content} {epic_num}
                STORE: epic_body
              - CHECK: empty epic_body
                FALSE:
                  - WRITE:
                      file: /tmp/issue-desc-{entry}.md
                      content: "**Sprint Key:** `{entry}`\n**Epic:** {epic_num}\n**PRD:** {prd_key}\n\n---\n\n{epic_body}"
                      mode: overwrite
          - SET: { variable: title, value: "{entry_title}" }
          - SET: { variable: labels, value: "type{sep}{entry_type}\nstatus{sep}{mapped_status}\nprd{sep}{prd_key}\n{prd_key}{sep}epic-{epic_num}" }
          - SET: { variable: description_file, value: "/tmp/issue-desc-{entry}.md" }
          - INCLUDE: common/create-issue
          - RUN: rm -f /tmp/issue-desc-{entry}.md
          - CHECK: mapped_status eq "done"
            TRUE:
              - SET: { variable: new_status, value: "{mapped_status}" }
              - SET: { variable: close, value: "true" }
              - INCLUDE: common/update-issue-status
              - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {sync_closed}
                STORE: sync_closed
            FALSE:
              - CHECK: mapped_status eq "closed"
                TRUE:
                  - SET: { variable: new_status, value: "{mapped_status}" }
                  - SET: { variable: close, value: "true" }
                  - INCLUDE: common/update-issue-status
                  - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {sync_closed}
                    STORE: sync_closed
          - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {sync_created}
            STORE: sync_created
      # --- Post comment if provided ---
      - CHECK: empty comment_body
        FALSE:
          - WRITE:
              file: /tmp/issue-comment-{entry}.md
              content: "{comment_body}"
              mode: overwrite
          - SET: { variable: comment_file, value: "/tmp/issue-comment-{entry}.md" }
          - INCLUDE: common/post-issue-comment
          - RUN: rm -f /tmp/issue-comment-{entry}.md
          - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {comments_posted}
            STORE: comments_posted
      # --- Refresh description if requested ---
      - CHECK: sync_populate_description eq "true"
        TRUE:
          - CHECK: entry_type eq "story"
            TRUE:
              - RUN: cat {implementation_artifacts}/{entry}.md 2>/dev/null
                STORE: spec_body
                EXPECT_EXIT: any
              - CHECK: empty spec_body
                FALSE:
                  - WRITE:
                      file: /tmp/issue-desc-{entry}.md
                      content: "**Sprint Key:** `{entry}`\n**Epic:** {epic_num}\n**PRD:** {prd_key}\n\n---\n\n{spec_body}"
                      mode: overwrite
                  - SET: { variable: description_file, value: "/tmp/issue-desc-{entry}.md" }
                  - INCLUDE: common/update-issue-description
                  - RUN: rm -f /tmp/issue-desc-{entry}.md
                  - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {descriptions_updated}
                    STORE: descriptions_updated
            FALSE:
              - CHECK: entry_type eq "epic"
                TRUE:
                  - READ: {planning_artifacts}/epics.md
                    STORE: epic_content
                    EXPECT_EXIT: any
                  - RUN: uv run --no-project python -c "
import sys, re
content = sys.argv[1]
n = sys.argv[2]
sections = list(re.finditer(r'^## Epic ' + n + r':', content, re.MULTILINE))
if sections:
    start = sections[0].start()
    end = sections[1].start() if len(sections) > 1 else len(content)
    print(content[start:end].strip())
else:
    print('')
" {epic_content} {epic_num}
                  STORE: epic_body
                  - CHECK: empty epic_body
                    FALSE:
                      - WRITE:
                          file: /tmp/issue-desc-{entry}.md
                          content: "**Sprint Key:** `{entry}`\n**Epic:** {epic_num}\n**PRD:** {prd_key}\n\n---\n\n{epic_body}"
                          mode: overwrite
                      - SET: { variable: description_file, value: "/tmp/issue-desc-{entry}.md" }
                      - INCLUDE: common/update-issue-description
                      - RUN: rm -f /tmp/issue-desc-{entry}.md
                      - RUN: uv run --no-project python -c "
n = int(sys.argv[1]) + 1
print(n)
" {descriptions_updated}
                          STORE: descriptions_updated
