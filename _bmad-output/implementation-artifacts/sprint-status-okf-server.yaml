ntmatter/revert {saved_at} (admin; re-enters update() so revert-of-revert works). Suite payload carries forbidden_snapshot (the forbidden list at generation time — cycle-staleness flag for the UI). FORBIDDEN CEILING 6 -> 24 (47171229 — add-all on a repo with 5 existing tags was a guaranteed 400). FOLLOW-UP 2f1cbd763: veto-impact simulation in the guardrail — a candidate whose cosine vs any of the run's own POSITIVE query vectors >= ROUTE_FORBIDDEN_TAG_MAX (0.55) is rejected with the kill list ("would suppress N positives") — a broad compound tag is a blunt veto and is now caught BEFORE it ships; under_test.max_tag names the nearest forbidden tag on EVERY query (margin-killed positives have attribution). ENV PLUMBING: OKF_GUARD_SELF_SUBJECT + OKF_GUARD_DUPLICATE_FORBIDDEN in env §15 (teaching-loop guardrail block), docker-compose okf-server pipes (empty default = code default), ansible env.j2 parity (default('0.55')/default('0.9')), config-validator Story 1-8d pin block — suite 42/42 green. FRONTEND DELIVERED 2026-10-09 (agent-built 1-8d workflow + advisor wiring 6b1dbab): guardrail rejection chips with reasons, removal chips (buildFrontmatterShape minus-tag), positive-failures block + Explain gate on either failure kind, same-suite positive tripwire (red strip → Revert panel), Revert-tags panel (history + revert + rebuild offer), staleness flag; full 1-8d live smoke 27/27 (scripts/okf-routing-lab/smoke-1-8d.js, incl. the section-13 advisor shape checks). KNOWN TEST DEBT: __tests__/head-test-service.test.js (2 explainRouting) + head-suite-service.test.js (2 explainSuiteFailures) assert the v1 shapes — UPDATE DONE (jest agent, 832/832 at the time; now 838). RESIDUAL moved to 1-8e: apply-flow race (silent stops), the bouncing-scorecard confusion, the one-tag-per-cycle treadmill. Spec §15 (post-mortem §15.1); story-1-8b §9 (cycle outcome + remediation).
