---
# Shared facts for build and deploy plays.
# Included via include_tasks to avoid duplication across tagged plays.

- name: Set swarm registry URL (GitLab Container Registry by default)
  ansible.builtin.set_fact:
    swarm_registry_url: "{{ swarm_registry_url | default('registry.opensource.unicc.org/un/itu/genie-ai') }}"

- name: Set global image tag (promoted CI tag, not git SHA)
  ansible.builtin.set_fact:
    genie_ai_global_tag: "{{ genie_ai_global_tag | default('main') }}"
    # Per-image tag overrides (optional): {genie-ai-frontend: v1.2.3} pins
    #    one image to a specific version; others use genie_ai_global_tag.
    image_tag_overrides: "{{ image_tag_overrides | default({}) }}"

- name: Set genieai_images list (18 custom images — used by env.j2 per-service vars)
  ansible.builtin.set_fact:
    genieai_images:
      - { name: "genie-ai-frontend" }
      - { name: "genie-ai-backend" }
      - { name: "genie-ai-db-migrations" }
      - { name: "genie-ai-document-repository" }
      - { name: "genie-ai-okf-server" }
      - { name: "genie-ai-pii-service" }
      - { name: "genie-ai-nginx" }
      - { name: "genie-ai-kong-config" }
      - { name: "genie-ai-chatqna-server" }
      - { name: "genie-ai-dataprep-arango" }
      - { name: "genie-ai-retriever-arango" }
      - { name: "genie-ai-reranker" }
      - { name: "genie-ai-embedding" }
      - { name: "genie-ai-textgen" }
      - { name: "genie-ai-postgres-init" }
      - { name: "genie-ai-keycloak" }
      - { name: "genie-ai-keycloak-config" }
      - { name: "genie-ai-tempo-proxy" }

# Fail loud instead of silently falling back to genie_ai_global_tag when an
# override key is typo'd or a value is empty — env.j2 would just skip it.
- name: Validate image_tag_overrides keys against known image names
  when: image_tag_overrides | length > 0
  ansible.builtin.assert:
    that:
      - image_tag_overrides.keys() | list | difference(genieai_images | map(attribute='name') | list) | length == 0
      - image_tag_overrides | dict2items | map(attribute='value') | select('string') | map('trim') | select('eq', '') | list | length == 0
      - image_tag_overrides | dict2items | map(attribute='value') | select('string') | list | length == image_tag_overrides | length
    success_msg: "image_tag_overrides validated: {{ image_tag_overrides }}"
    fail_msg: >-
      image_tag_overrides keys must be genieai_images names
      ({{ genieai_images | map(attribute='name') | join(', ') }})
      with non-empty string values; got {{ image_tag_overrides }}.
