# OVERRIDES.yaml — core-layer override audit manifest (architecture pattern 1).
#
# Every intentional deviation of the GENIE.AI overlay from the vendored OPEA
# source is recorded here with a disposition, an owner, and a ticket. Each entry
# must be matched by a `# OVERRIDE <module>.<name> | disposition: ... | reason: ... | test: ...`
# comment record in the source tree (verified by build-patches/lint_overrides.py).
#
# Disposition:
#   - still-needed:        override is still required on the current OPEA version.
#   - re-graft-to-new-API: override must be re-expressed against a newer OPEA API.
#   - obsolete-remove:     override was fixed upstream and can be deleted.
overrides:
  - override: core.constants.ServiceType
    disposition: re-graft-to-new-API
    owner: genie-ai
    ticket: story 2.1
