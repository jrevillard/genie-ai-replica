{{- if .Values.data.arangodb.enabled -}}
{{- $mode := .Values.data.arangodb.mode | default "single" -}}
{{- if and (eq $mode "single") (or (eq .Values.clusterProfile "prod") (eq .Values.clusterProfile "staging")) -}}
{{- $mode = "cluster" -}}
{{- end -}}
{{- if eq $mode "single" -}}
apiVersion: database.arangodb.com/v1
kind: ArangoDeployment
metadata:
  # metadata.name MUST match the DNS name used by the chart + Swarm migration
  # paths. Swarm service is arango-vector-db; we render as arangodb-single to
  # match the chart's existing service consumer namespace, which is
  # downstream-of-here stable.
  name: arangodb-single
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" (deepCopy .Values | merge (dict "component" "data-arangodb"))) | nindent 4 }}
    genieai.io/data-tier: arangodb
spec:
  mode: Single
  # Conditional registry prefix: an air-gapped global.imageRegistry mirror
  # must mirror the docker.io arangodb/arangodb path.
  image: {{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}arangodb/arangodb:3.12.4
  externalAccess:
    type: None
  single:
    args:
      # Vector indexes are required by the ingestion/retrieval pipeline
      # (dataprep creates them; hybrid retrieval returns nothing without
      # the flag). Flag name per ArangoDB 3.12.4.
      - --experimental-vector-index=true
      # NO --server.endpoint: `arangodb://` is not a valid endpoint scheme
      # (arangod accepts tcp:// / ssl://). The operator sets endpoint+advertising
      # itself from the CR; hand-rolling it here breaks pod startup.
    volumeClaimTemplate:
      spec:
        # Render storageClass ONLY when set: empty-string pins
        # storageClassName: "" = "no default SC" and strands the PVC
        # (same trap the CNPG template guards against).
        {{- with .Values.pluggable.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.data.arangodb.storageSize | default "50Gi" }}
  auth:
    jwtSecretName: arango-jwt-secret
  # Root password bootstrap: passwordSecretNames is a map of username to
  # Secret name (kube-arangodb 1.4.5 BootstrapSpec). The referenced Secret
  # must carry basic-auth keys (`username`, `password`); without this wiring
  # the operator leaves the root password EMPTY (default `None`).
  bootstrap:
    passwordSecretNames:
      root: arango-root-secret
{{- else if eq $mode "cluster" -}}
apiVersion: database.arangodb.com/v1
kind: ArangoDeployment
metadata:
  name: arangodb-cluster
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" (deepCopy .Values | merge (dict "component" "data-arangodb"))) | nindent 4 }}
    genieai.io/data-tier: arangodb
spec:
  mode: Cluster
  # Conditional registry prefix: an air-gapped global.imageRegistry mirror
  # must mirror the docker.io arangodb/arangodb path.
  image: {{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}arangodb/arangodb:3.12.4
  externalAccess:
    type: None
  agents:
    count: 3
    args:
      # Vector indexes are required by the ingestion/retrieval pipeline
      # (flag name per ArangoDB 3.12.4; same flag as the single branch).
      - --experimental-vector-index=true
    # Agency state MUST persist across restarts — on emptyDir every pod
    # reschedule loses the cluster configuration.
    volumeClaimTemplate:
      spec:
        {{- with .Values.pluggable.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.data.arangodb.storageSize | default "50Gi" }}
  dbservers:
    count: 3
    args:
      # Vector indexes are required by the ingestion/retrieval pipeline
      # (flag name per ArangoDB 3.12.4; same flag as the single branch).
      - --experimental-vector-index=true
    volumeClaimTemplate:
      spec:
        {{- with .Values.pluggable.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.data.arangodb.storageSize | default "50Gi" }}
  coordinators:
    count: 2
    args:
      # Vector indexes are required by the ingestion/retrieval pipeline
      # (flag name per ArangoDB 3.12.4; same flag as the single branch).
      - --experimental-vector-index=true
  auth:
    jwtSecretName: arango-jwt-secret
  bootstrap:
    passwordSecretNames:
      root: arango-root-secret
{{- end -}}
{{- end -}}
