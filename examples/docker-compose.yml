version: '3.8'

services:
  frontend:
    build: ./gov-chat-frontend
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - chatqna_default

  backend:
    build: ./gov-chat-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - chatqna_default

networks:
  chatqna_default:
    external: true

