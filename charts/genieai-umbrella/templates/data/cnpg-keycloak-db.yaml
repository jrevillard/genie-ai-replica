{{- if .Values.data.postgres.enabled -}}
{{- $instances := .Values.data.postgres.instances | default 1 -}}
{{- if eq .Values.clusterProfile "prod" -}}
{{- $instances = 3 -}}
{{- end -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "data-postgres") | nindent 4 }}
    genieai.io/data-tier: postgresql
    genieai.io/serves: keycloak
spec:
  instances: {{ $instances }}
  # Zero-downtime primary rolling updates: fail over to a replica before
  # updating the primary (enum: switchover | restart, the CNPG default).
  # Distinct from primaryUpdateStrategy (unsupervised | supervised), which
  # only gates whether the operator needs manual approval for the failover.
  primaryUpdateMethod: switchover
  # Hardcoded to ghcr.io/cloudnative-pg/postgresql:16 — never prefixed
  # by the top-level imageRegistry. The GitLab registry mirror at
  # registry.opensource.unicc.org/un/itu/genie-ai does not carry
  # cloudnative-pg/postgresql, so the conditional prefix
  # (`<imageRegistry>/cloudnative-pg/postgresql:16`) was producing
  # `manifest unknown` on every fresh install. Operators air-gapping
  # the cluster must mirror this specific image into their private
  # registry AND override the imageName via a values patch.
  imageName: "ghcr.io/cloudnative-pg/postgresql:16"
  imagePullPolicy: IfNotPresent
  storage:
    size: {{ .Values.data.postgres.storageSize | default "10Gi" }}
    # Render storageClass ONLY when set: an empty-string value would pin
    # storageClassName: "" which means "NO default storage class" and
    # strands the PVC on most clusters.
    {{- with .Values.pluggable.storageClassName }}
    storageClass: {{ . }}
    {{- end }}
    accessModes:
      - ReadWriteOnce
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
  # CNPG publishes 3 Services for this Cluster:
  #   keycloak-db       (RW, points at the current primary; default JDBC target)
  #   keycloak-db-rw    (RW, explicit; the Keycloak CR's spec.db.host uses this name)
  #   keycloak-db-ro    (RO, replicas; for read-heavy reporting)
  # The Keycloak v2beta1 CR's spec.db.host is `<cluster-name>-rw.<ns>.svc.cluster.local`
  # (see keycloak-instance.yaml). Operators changing this Cluster's `metadata.name`
  # MUST also update `data.keycloak.cnpgServiceName` in values.yaml to match.
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      # CNPG expects this Secret to carry BOTH `username` and `password`
      # keys (username-only fails validation). The `keycloak-db-credentials`
      # Secret is operator-provided via their secret backend; the chart
      # does not materialize it.
      secret:
        name: keycloak-db-credentials
  serviceAccountTemplate:
    metadata:
      labels:
        {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "data-postgres") | nindent 8 }}
  # NOTE: no `monitoring.enablePodMonitor` — that emits a Prometheus-operator
  # ServiceMonitor and no Prometheus operator is installed in this stack.
  # Metrics are scraped via VMServiceScrape.
{{- end -}}
