{{- if .Values.services.redisCache.enabled -}}
{{- $svc := .Values.services.redisCache -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "redis-cache") | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      genieai.io/component: redis-cache
  template:
    metadata:
      labels:
        {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "redis-cache") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999                     # redis:7-alpine `redis` account
        runAsGroup: 999
        fsGroup: 999                       # /data writable for AOF
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-cache
          image: "{{ $svc.image.repository | default "redis" }}:{{ $svc.image.tag | default "7-alpine" }}"
          # $(VAR) in args expands against the container env below
          # (Kubernetes native expansion).
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory-policy
            - noeviction
            - --requirepass
            - $(TRANSLATION_CACHE_PASSWORD)
          env:
            # redis-cli consumes REDISCLI_AUTH automatically for the
            # health probes below. The Secret is REQUIRED, not optional:
            # --requirepass is unconditionally set above, and an optional
            # secretKeyRef leaves the literal "$(TRANSLATION_CACHE_PASSWORD)"
            # in the args — redis then runs with an unknown literal password
            # and every probe gets NOAUTH. translation-cache-password is on
            # the chart's required-secrets list; a missing Secret must fail
            # the pod loudly at scheduling, not corrupt auth silently.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: translation-cache-password
                  key: TRANSLATION_CACHE_PASSWORD
            - name: TRANSLATION_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: translation-cache-password
                  key: TRANSLATION_CACHE_PASSWORD
          ports:
            - name: redis
              containerPort: {{ $svc.port | default 6379 }}
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli ping"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
        {{- if $svc.pvc.enabled }}
          persistentVolumeClaim:
            claimName: redis-cache-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        # redis 7 writes cluster-config + RDB snapshots to /tmp at
        # startup; with readOnlyRootFilesystem: true the server
        # exits with "Read-only file system". A tmpfs-backed emptyDir
        # satisfies the writes while keeping the on-disk attack
        # surface limited to /data + /tmp.
        - name: tmp
          emptyDir:
            medium: Memory
{{- if $svc.pvc.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-cache-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "redis-cache") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $svc.pvc.storageSize | default "5Gi" }}
  {{- with .Values.pluggable.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "redis-cache") | nindent 4 }}
spec:
  ports:
    - name: redis
      port: {{ $svc.port }}
  selector:
    {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "redis-cache") | nindent 4 }}
---
# Ingress from backend ONLY (the sole consumer); egress DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "redis-cache") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: redis-cache
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: backend
      ports:
        - protocol: TCP
          port: 6379
    # helm-test reachability probe (component "test").
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: test
      ports:
        - protocol: TCP
          port: 6379
  {{- if .Values.observability.metrics.enabled }}
  # Prometheus scrape peer (VMServiceScrape targets this Service).
  # VictoriaMetrics runs as a vm-operator-managed pod in this namespace;
  # without this peer its scrapes are dropped by the default-deny.
    - from:
        - podSelector:
            matchLabels:
              managed-by: vm-operator
              app.kubernetes.io/instance: vmetrics
      ports:
        - protocol: TCP
          port: 6379
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
{{- end -}}
