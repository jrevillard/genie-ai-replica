stages:
  - lint
  - test
  - build       # publish candidate images to GitLab Container Registry
  - scan        # Trivy gate (HIGH/CRITICAL) + Syft SBOM artifact
  - config
  - e2e
  - promote     # retag tested digests to deployable tags (main/tags only)
  - scheduled
  - manual

variables:
  FLUTTER_VERSION: "3.41.7"
  FLUTTER_ARCHIVE: "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
  # --- Container build/scan/promote pipeline (see docs/adr/0001-gitlab-registry-build-scan-pipeline.md) ---
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_IGNORE_UNFIXED: "true"
  TRIVY_IMAGE_TAG: "aquasec/trivy:0.57.0"
  SYFT_VERSION: "v1.26.0"
  GIT_DEPTH: "0"  # full history needed for CI_COMMIT_SHORT_SHA stability across matrix jobs

# Prevent duplicate branch+MR pipelines — first match wins
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//

# --- Hidden job templates (DRY, reusable by Story 1.3 test stage) ---

.node_base:
  image: node:20-alpine
  interruptible: true

.lint_node:
  extends: .node_base
  stage: lint

.test_node:
  extends: .node_base
  stage: test
  variables:
    NODE_ENV: test
  artifacts:
    when: always
    expire_in: 7 days

.flutter_base:
  image: debian:bookworm-slim
  interruptible: true
  variables:
    PUB_CACHE: $CI_PROJECT_DIR/.pub-cache
  cache:
    - key: "flutter-sdk-${FLUTTER_VERSION}"
      paths:
        - flutter-sdk/
    - key:
        files:
          - mobile/genie_ai_mobile/pubspec.lock
      paths:
        - mobile/genie_ai_mobile/.dart_tool/
        - .pub-cache/
      fallback_keys:
        - "flutter-deps-$CI_DEFAULT_BRANCH"
        - "flutter-deps-"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils python3 python3-venv python3-pip
    - |
      if [ ! -d "flutter-sdk/bin" ]; then
        echo "Installing Flutter ${FLUTTER_VERSION}..."
        curl -fsSL "${FLUTTER_ARCHIVE}" | tar -xJ
        mv flutter flutter-sdk
      fi
    - git config --global --add safe.directory "$PWD/flutter-sdk"
    - export PATH="$PWD/flutter-sdk/bin:$PATH"
    - flutter --version
    - cd mobile/genie_ai_mobile
    - cp patrol_test/e2e_secrets.dart.example patrol_test/e2e_secrets.dart
    - flutter pub get

# --- E2E integration base (shared by e2e:integration + scheduled:integration) ---

.e2e_integration_base:
  image: docker:24
  variables:
    COMPOSE_PROJECT_NAME: "ci-$CI_PIPELINE_ID"
    # Resolve compose `image:` fields to the GitLab registry so E2E pulls
    # the pre-built candidate from build:image instead of rebuilding locally.
    SWARM_REGISTRY_URL: "$CI_REGISTRY_IMAGE"
  allow_failure: false
  tags: [docker]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  before_script:
    - apk add --no-cache docker-cli-compose curl
    # Authenticate to the GitLab registry so `docker compose pull` succeeds
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      for p in $(docker compose ls -q 2>/dev/null | grep '^ci-'); do
        echo "Cleaning up previous project: $p"
        docker compose -p "$p" down -v --remove-orphans 2>/dev/null || true
      done
    - docker network prune -f 2>/dev/null || true
  script:
    - cp env .env
    - |
      while IFS='=' read -r var _; do
        case "$var" in ''|[!A-Z_]*) continue ;; esac
        eval "val=\${$var:-}"
        if [ -n "$val" ]; then
          sed -i "s|^${var}=.*|${var}=${val}|" .env
        fi
      done < env
    - |
      for var in EMAIL_FROM EMAIL_HOST KEYCLOAK_VERIFY_EMAIL; do
        if grep -q "^${var}=$" .env; then
          case "$var" in
            EMAIL_FROM) sed -i "s|^${var}=.*|${var}=noreply@ci-genie-ai.local|" .env ;;
            EMAIL_HOST) sed -i "s|^${var}=.*|${var}=localhost|" .env ;;
            KEYCLOAK_VERIFY_EMAIL) sed -i "s|^${var}=.*|${var}=false|" .env ;;
          esac
        fi
      done
    - |
      # CI runs inside the Docker network — use the nginx service name so
      # Keycloak advertises URLs resolvable from the CI runner container.
      # Mobile tests bypass OIDC discovery (direct token injection) so this
      # only matters for Playwright web E2E.
      echo "NGINX_PUBLIC_DOMAIN=nginx" >> .env
      # Backend must verify JWTs via JWKS at https://nginx/auth/... which uses
      # a self-signed certificate.  Safe for CI — never use in production.
      echo "NODE_TLS_REJECT_UNAUTHORIZED=0" >> .env
    # Pull pre-built candidate images from the GitLab registry so E2E tests run
    # against the exact artifact produced by build:image (not a local rebuild).
    # Candidate tag matches build:image's CANDIDATE_TAG logic.
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        E2E_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        E2E_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${E2E_TAG}|" .env
      echo "E2E pulling candidate images tagged :${E2E_TAG}"
    # Pull all custom services from the registry. `up --no-build` below fails
    # loudly if a build:image job didn't publish its candidate, surfacing the
    # breakage here instead of silently rebuilding a different artifact.
    - docker compose pull frontend backend document-repository nginx kong-config db-migrations keycloak keycloak-config postgres-init || true
    - docker compose up -d --no-build || (docker compose logs --tail=50 > docker-compose-logs.txt 2>&1; cat docker-compose-logs.txt; exit 1)
    - |
      for i in $(seq 1 60); do
        if docker exec "ci-${CI_PIPELINE_ID}-backend-1" curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
          echo "Backend healthy"
          break
        fi
        echo "Waiting for backend... ($i/60)"
        sleep 5
      done
    - docker exec "ci-${CI_PIPELINE_ID}-backend-1" curl -sf http://localhost:3000/api/health || (docker compose logs --tail=50 > docker-compose-logs.txt 2>&1; cat docker-compose-logs.txt; exit 1)
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - docker-compose-logs.txt

# --- Shared: Docker compose network connection + NGINX IP discovery ---
# Used by .e2e_mobile_base and .e2e_web_base to mutualize networking logic.
.connect_compose_network: &connect_compose_network
  - |
    COMPOSE_NET=$(docker network ls --filter "label=com.docker.compose.project=ci-${CI_PIPELINE_ID}" --format '{{.Name}}' | head -1)
    if [ -z "$COMPOSE_NET" ]; then
      COMPOSE_NET="ci-${CI_PIPELINE_ID}_default"
    fi
    echo "Compose network: $COMPOSE_NET"
    CI_CONTAINER_ID=$(docker ps --filter "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" --format '{{.ID}}' | head -1)
    if [ -z "$CI_CONTAINER_ID" ]; then
      CI_CONTAINER_ID=$(docker ps --filter "name=runner" --format '{{.Names}}' | grep "concurrent" | head -1 | sed 's/-predefined$//')
    fi
    echo "CI container: $CI_CONTAINER_ID"
    if docker network inspect "$COMPOSE_NET" >/dev/null 2>&1; then
      docker network connect "$COMPOSE_NET" "$CI_CONTAINER_ID" 2>/dev/null || true
      echo "CI container connected to compose network: $COMPOSE_NET"
    else
      echo "WARNING: Compose network $COMPOSE_NET not found — tests may fail"
    fi
    NGINX_CONTAINER=$(docker ps --filter "name=nginx" --format "{{.Names}}" | grep "ci-" | head -1)
    if [ -n "$NGINX_CONTAINER" ]; then
      NGINX_IP=$(docker inspect "$NGINX_CONTAINER" --format "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}" | awk '{print $1}')
      echo "Nginx container: $NGINX_CONTAINER at $NGINX_IP"
    else
      echo "WARNING: No nginx container found in compose stack"
    fi

# --- E2E mobile base (shared by patrol:e2e + scheduled:e2e-mobile) ---

.e2e_mobile_base:
  extends: .flutter_base
  allow_failure: true
  tags: [kvm]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  variables:
    EMULATOR_IMAGE: "us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2"
    EMULATOR_EXTRA_ARGS: "-memory 2048 -no-snapshot"
  cache:
    - key: "flutter-sdk-${FLUTTER_VERSION}"
      paths:
        - flutter-sdk/
    - key: "android-sdk-36"
      paths:
        - android-sdk/
    - key:
        files:
          - mobile/genie_ai_mobile/android/gradle-wrapper.properties
          - mobile/genie_ai_mobile/pubspec.lock
        prefix: gradle-build
      paths:
        - mobile/genie_ai_mobile/android/.gradle/
        - mobile/genie_ai_mobile/build/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils adb docker.io python3 default-jdk-headless unzip socat
    - |
      if [ ! -d "flutter-sdk/bin" ]; then
        echo "Installing Flutter ${FLUTTER_VERSION}..."
        curl -fsSL "${FLUTTER_ARCHIVE}" | tar -xJ
        mv flutter flutter-sdk
      fi
    - git config --global --add safe.directory "$PWD/flutter-sdk"
    - export PATH="$PWD/flutter-sdk/bin:$PATH"
    - flutter --version
    - cd mobile/genie_ai_mobile
    - flutter pub get
  script:
    - |
      for var in KEYCLOAK_ADMIN_PASSWORD KC_MOBILE_CLIENT_ID KC_MOBILE_REDIRECT_SCHEME; do
        eval "val=\${$var:-}"
        if [ -z "$val" ]; then
          echo "ERROR: Missing CI variable: $var"
          echo "Set it in Settings > CI/CD > Variables"
          exit 1
        fi
      done
    - |
      export JAVA_HOME=$(readlink -f $(which java) | sed 's:/bin/java::')
      echo "JAVA_HOME=$JAVA_HOME"
      if [ ! -d "${CI_PROJECT_DIR}/android-sdk/cmdline-tools/latest/bin" ]; then
        echo "Installing Android SDK command-line tools..."
        ANDROID_SDK="${CI_PROJECT_DIR}/android-sdk"
        mkdir -p "$ANDROID_SDK/cmdline-tools"
        cd /tmp
        curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools "$ANDROID_SDK/cmdline-tools/latest"
        rm -f cmdline-tools.zip
        cd "${CI_PROJECT_DIR}/mobile/genie_ai_mobile"
      else
        echo "Android SDK command-line tools cached"
      fi
      export ANDROID_HOME="${CI_PROJECT_DIR}/android-sdk"
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
      echo "sdkmanager at: $(which sdkmanager)"
      yes | sdkmanager --licenses || true
      echo "Installing Android SDK components..."
      sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      echo "Android SDK ready"
    - *connect_compose_network
    - export PATH="$PATH:$PUB_CACHE/bin:${CI_PROJECT_DIR}/android-sdk/cmdline-tools/latest/bin:${CI_PROJECT_DIR}/android-sdk/platform-tools"
    - export ANDROID_HOME="${CI_PROJECT_DIR}/android-sdk"
    - export GRADLE_OPTS="-Xmx1024m -XX:+HeapDumpOnOutOfMemoryError"
    - |
      cat > "${CI_PROJECT_DIR}/mobile/genie_ai_mobile/android/gradle.properties" << 'GRADLE_PROPS'
      org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
      org.gradle.workers.max=2
      android.useAndroidX=true
      android.enableJetifier=false
      org.gradle.daemon=false
      kotlin.incremental=true
      kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=128m
      GRADLE_PROPS
    - |
      echo "🔑 Generating e2e_secrets.dart from CI variables..."
      KC_PWD="${KEYCLOAK_ADMIN_PASSWORD}"
      cat > patrol_test/e2e_secrets.dart << SECRETS
      // E2E test secrets — generated from CI variables. DO NOT COMMIT.
      class E2eSecrets {
        const E2eSecrets({required this.keycloakAdminPassword});
        final String keycloakAdminPassword;
      }
      const e2eSecrets = E2eSecrets(
        keycloakAdminPassword: r'$KC_PWD',
      );
      SECRETS
    - |
      dart pub global activate patrol_cli 4.3.1
      export PATH="$PATH:$HOME/.pub-cache/bin"
    - |
      EMULATOR_NAME="emulator-${CI_PIPELINE_ID}"
      echo "Starting Android emulator on compose network..."
      docker run -d --name "$EMULATOR_NAME" \
        --device /dev/kvm \
        --network "$COMPOSE_NET" \
        --tmpfs /root:mode=1777 \
        -e EMULATOR_ARGS="$EMULATOR_EXTRA_ARGS" \
        "$EMULATOR_IMAGE"
      EMULATOR_IP=$(docker inspect "$EMULATOR_NAME" --format "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}" | awk '{print $1}')
      EMULATOR_ADDR="${EMULATOR_IP}:5555"
      echo "Emulator at $EMULATOR_ADDR"
      for i in $(seq 1 60); do
        EMU_STATUS=$(docker inspect "$EMULATOR_NAME" --format '{{.State.Status}}' 2>/dev/null || echo "gone")
        if [ "$EMU_STATUS" = "exited" ] || [ "$EMU_STATUS" = "dead" ] || [ "$EMU_STATUS" = "gone" ]; then
          echo "Emulator container crashed (status: $EMU_STATUS)"
          docker logs "$EMULATOR_NAME" --tail 50 2>&1 || true
          exit 1
        fi
        if adb connect "$EMULATOR_ADDR" 2>/dev/null && adb -s "$EMULATOR_ADDR" shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
          echo "Emulator ready"
          break
        fi
        echo "Waiting for emulator... ($i/60)"
        sleep 5
      done
      adb -s "$EMULATOR_ADDR" shell getprop sys.boot_completed | grep -q 1 || {
        echo "Emulator failed to boot"
        docker inspect "$EMULATOR_NAME" --format '{{.State.Status}} (exit code: {{.State.ExitCode}})' 2>/dev/null || true
        docker logs "$EMULATOR_NAME" --tail 50 2>&1 || true
        exit 1
      }
    - |
      if [ -z "$NGINX_IP" ]; then
        echo "❌ Cannot set up port forwarding — NGINX_IP not discovered"
        exit 1
      fi
      echo "🔗 Setting up port forwarding: emulator:8443 → CI runner:18443 → nginx (${NGINX_IP}):443"
      socat TCP-LISTEN:18443,fork,reuseaddr TCP:${NGINX_IP}:443 &
      SOCAT_PID=$!
      sleep 1
      if ! kill -0 "$SOCAT_PID" 2>/dev/null; then
        echo "❌ socat failed to start — cannot forward traffic to nginx"
        exit 1
      fi
      echo "✅ socat forwarding 0.0.0.0:18443 → ${NGINX_IP}:443"
      SOCAT_TEST=$(curl -sk -o /dev/null -w "%{http_code}" https://localhost:18443/auth/realms/genie 2>/dev/null || echo "000")
      echo "socat → nginx test: HTTP ${SOCAT_TEST}"
      adb disconnect "${EMULATOR_ADDR}" 2>/dev/null || true
      sleep 1
      adb connect "${EMULATOR_ADDR}"
      adb -s "${EMULATOR_ADDR}" reverse tcp:8443 tcp:18443
      echo "✅ adb reverse: emulator 127.0.0.1:8443 → host:18443"
      adb -s "${EMULATOR_ADDR}" reverse --list
    - |
      export ADB_DEVICE="$EMULATOR_ADDR"
      echo "ADB_DEVICE=$ADB_DEVICE"

      adb -s "$ADB_DEVICE" shell getprop sys.boot_completed 2>/dev/null | grep -q 1 || {
        echo "❌ Device $ADB_DEVICE not online"
        exit 1
      }
      echo "✅ Device $ADB_DEVICE online and verified"

      adb -s "$ADB_DEVICE" reverse tcp:8443 tcp:18443 2>/dev/null || {
        echo "⚠️  adb reverse failed — reconnecting..."
        adb disconnect "$ADB_DEVICE" 2>/dev/null || true
        sleep 1
        adb connect "$ADB_DEVICE"
        adb -s "$ADB_DEVICE" reverse tcp:8443 tcp:18443
      }
      echo "✅ adb reverse re-confirmed before tests"
      adb -s "$ADB_DEVICE" reverse --list

      export CI_NGINX_URL="https://${NGINX_IP}"
      export ADB_DEVICE="$ADB_DEVICE"
      export EXTRA_DART_DEFINES=$'E2E_KEYCLOAK_URL=https://127.0.0.1:8443/auth\nE2E_REALM=genie\nE2E_CLIENT_ID=genie-mobile-e2e\nE2E_REDIRECT_SCHEME=com.itu.genieai.e2e\nE2E_BACKEND_URL=https://127.0.0.1:8443'
      cd "$CI_PROJECT_DIR"

      # Delegate test execution to patrol-wrapper.sh
      # (keepalive is managed internally — auto-stops after 5 min, during Gradle build only)
      ./mobile/genie_ai_mobile/patrol-wrapper.sh --flavor e2e -d "$ADB_DEVICE"
      exit $?
  after_script:
    - mkdir -p e2e-logs
    - docker inspect "emulator-${CI_PIPELINE_ID}" > e2e-logs/emulator-status.json 2>&1 || true
    - docker logs "emulator-${CI_PIPELINE_ID}" > e2e-logs/emulator.log 2>&1 || true
    - docker rm -f "emulator-${CI_PIPELINE_ID}" 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - e2e-logs/

# --- E2E web base (shared by e2e:playwright + scheduled:e2e-web) ---

.e2e_web_base:
  extends: .node_base
  image: node:20-bookworm-slim
  allow_failure: false
  tags: [docker]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  cache:
    - key:
        files:
          - package-lock.json
        prefix: e2e-playwright
      paths:
        - node_modules/
      fallback_keys:
        - "e2e-playwright-$CI_DEFAULT_BRANCH"
        - "e2e-playwright-"
    - key:
        files:
          - package-lock.json
        prefix: e2e-playwright-browsers
      paths:
        - .cache/ms-playwright/
  before_script:
    - apt-get update && apt-get install -y docker.io curl python3
    - mkdir -p reports
    - npm ci
    - npx playwright install --with-deps chromium
  script:
    - *connect_compose_network
    - |
      # Use Docker service name for Keycloak OIDC compatibility.
      if curl -sk -o /dev/null -w "%{http_code}" https://nginx/api/health 2>/dev/null | grep -qE "^[23]"; then
        echo "Nginx reachable via service name"
        E2E_BASE_URL="https://nginx"
      elif [ -n "$NGINX_IP" ]; then
        echo "Falling back to NGINX_IP: ${NGINX_IP}"
        E2E_BASE_URL="https://${NGINX_IP}"
      else
        echo "ERROR: Cannot reach nginx - neither service name nor IP"
        exit 1
      fi
      for var in KEYCLOAK_ADMIN_PASSWORD; do
        eval "val=\${$var:-}"
        if [ -z "$val" ]; then
          echo "ERROR: Missing CI variable: $var"
          exit 1
        fi
      done
    - |
      # ROPC setup (required by conversation-history tests via getUserToken)
      # All requests go through nginx/Kong — same path as production traffic.
      KC_URL="${E2E_BASE_URL}/auth"
      KC_PWD="${KEYCLOAK_ADMIN_PASSWORD}"
      ADMIN_TOKEN=""
      CLIENT_UUID=""
      for i in $(seq 1 90); do
        if [ -z "$ADMIN_TOKEN" ]; then
          ADMIN_TOKEN=$(curl -sk -X POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
            -d "client_id=admin-cli" -d "username=admin" -d "password=${KC_PWD}" -d "grant_type=password" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" 2>/dev/null)
        fi
        if [ -n "$ADMIN_TOKEN" ]; then
          CLIENT_UUID=$(curl -sk "${KC_URL}/admin/realms/genie/clients?clientId=genie-app" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id']) if d else ''" 2>/dev/null || true)
        fi
        if [ -n "$CLIENT_UUID" ]; then
          echo "Keycloak ready after ${i}s — client UUID: ${CLIENT_UUID}"
          break
        fi
        echo "Waiting for Keycloak via nginx/Kong... ($i/90)"
        sleep 2
      done
      if [ -z "$CLIENT_UUID" ]; then
        echo "ERROR: genie-app client not found via nginx/Kong after 180s"
        exit 1
      fi
      curl -sk -X PUT "${KC_URL}/admin/realms/genie/clients/${CLIENT_UUID}" \
        -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
        -d '{"directAccessGrantsEnabled": true}'
      echo "ROPC enabled for genie-app client"
      # Create test user for E2E tests (required by loginViaUI and getUserToken)
      EXISTING=$(curl -sk "${KC_URL}/admin/realms/genie/users?username=testuser" \
        -H "Authorization: Bearer $ADMIN_TOKEN" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null)
      if [ "${EXISTING:-0}" -eq 0 ]; then
        CREATE_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X POST "${KC_URL}/admin/realms/genie/users" \
          -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
          -d '{"username":"testuser","email":"testuser@e2e.test","emailVerified":true,"firstName":"Test","lastName":"User","enabled":true,"credentials":[{"type":"password","value":"TestPass123!","temporary":false}]}')
        if [ "$CREATE_STATUS" -ne 201 ]; then
          echo "ERROR: testuser creation failed (HTTP $CREATE_STATUS)"
          exit 1
        fi
        echo "testuser created (HTTP $CREATE_STATUS)"
      else
        echo "testuser already exists"
      fi
      # Assign admin realm role to test user (required for document upload/delete)
      USER_ID=$(curl -sk "${KC_URL}/admin/realms/genie/users?username=testuser" \
        -H "Authorization: Bearer $ADMIN_TOKEN" \
        | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])" || true)
      ADMIN_ROLE=$(curl -sk "${KC_URL}/admin/realms/genie/roles" \
        -H "Authorization: Bearer $ADMIN_TOKEN" \
        | python3 -c "import sys,json; roles=[r for r in json.load(sys.stdin) if r['name']=='admin']; print(roles[0]['id'] if roles else '')" || true)
      if [ -n "$ADMIN_ROLE" ] && [ -n "$USER_ID" ]; then
        curl -sk -X POST "${KC_URL}/admin/realms/genie/users/${USER_ID}/role-mappings/realm" \
          -H "Authorization: Bearer $ADMIN_TOKEN" \
          -H "Content-Type: application/json" \
          -d "[{\"id\":\"${ADMIN_ROLE}\",\"name\":\"admin\"}]" && echo "Assigned admin role to testuser" || echo "WARNING: admin role assignment failed"
      else
        echo "WARNING: Could not assign admin role (role or user not found). Document tests may fail."
      fi
      # Save vars for cleanup in after_script
      echo "E2E_BASE_URL=${E2E_BASE_URL}" > .e2e-ropc-env
      echo "ADMIN_TOKEN=${ADMIN_TOKEN}" >> .e2e-ropc-env
      echo "CLIENT_UUID=${CLIENT_UUID}" >> .e2e-ropc-env
    - BASE_URL="${E2E_BASE_URL}" npx playwright test tests/e2e/chatbot/ tests/e2e/documents/ --project=chromium
  after_script:
    - |
      # ROPC cleanup - CRITICAL: always revert, even on test failure
      if [ -f .e2e-ropc-env ]; then
        . ./.e2e-ropc-env
        KC_URL="${E2E_BASE_URL}/auth"
        curl -sk -X PUT "${KC_URL}/admin/realms/genie/clients/${CLIENT_UUID}" \
          -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
          -d '{"directAccessGrantsEnabled": false}' 2>/dev/null && echo "ROPC disabled" || echo "WARNING: ROPC cleanup failed"
        rm -f .e2e-ropc-env
      fi

    - mkdir -p e2e-logs
    - docker compose -p "ci-${CI_PIPELINE_ID}" logs > e2e-logs/docker-compose.log 2>&1 || true
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - e2e-logs/
      - reports/
    reports:
      junit: reports/playwright-report.xml

# --- Container Registry pipeline (build → scan → promote) ---
# Publishes the 16 custom images to the GitLab Container Registry. See
# docs/adr/0001-gitlab-registry-build-scan-pipeline.md for the full architecture.
#
# Flow per image:
#   build:image  →  scan:image  →  [e2e on merge trains]  →  promote:image
#   candidate tag (:pending-<sha> on main/tag, :mr-<iid>-<sha> on MR)
#   is scanned; only its immutable digest is promoted to deployable tags
#   (:main / :main-<sha> / :<vX.Y.Z> / :latest) on main and tags.
#
# Promote ordering note: e2e jobs run only on merge trains, so promote on main/tag
# is gated by scan (stage ordering) and relies on the merge-train e2e having
# already validated the merged content (standard GitLab merge-train design).

# 16 custom images — single source of truth for the build/scan/promote matrix.
.image_matrix: &image_matrix
  - IMAGE_NAME: frontend
    CONTEXT: components/gov-chat-frontend/
    DOCKERFILE: components/gov-chat-frontend/Dockerfile
  - IMAGE_NAME: backend
    CONTEXT: components/
    DOCKERFILE: gov-chat-backend/Dockerfile
  - IMAGE_NAME: db-migrations
    CONTEXT: .
    DOCKERFILE: components/gov-chat-backend/Dockerfile.migrations
  - IMAGE_NAME: document-repository
    CONTEXT: components/
    DOCKERFILE: document-repository/Dockerfile
  - IMAGE_NAME: nginx
    CONTEXT: api-gateway-solution/nginx/
    DOCKERFILE: api-gateway-solution/nginx/Dockerfile
  - IMAGE_NAME: kong-config
    CONTEXT: api-gateway-solution/new-config/
    DOCKERFILE: api-gateway-solution/new-config/Dockerfile
  - IMAGE_NAME: chatqna
    CONTEXT: genie-ai-overlay/chatqna/
    DOCKERFILE: genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
  - IMAGE_NAME: dataprep
    CONTEXT: genie-ai-overlay/dataprep/
    DOCKERFILE: genie-ai-overlay/dataprep/Dockerfile-dataprep_genie-ai
  - IMAGE_NAME: retriever
    CONTEXT: genie-ai-overlay/retriever/
    DOCKERFILE: genie-ai-overlay/retriever/Dockerfile-retriever_genie-ai
  - IMAGE_NAME: reranker
    CONTEXT: genie-ai-overlay/reranker/
    DOCKERFILE: genie-ai-overlay/reranker/Dockerfile-reranker_genie-ai
  - IMAGE_NAME: embedding
    CONTEXT: genie-ai-overlay/embedding/
    DOCKERFILE: genie-ai-overlay/embedding/Dockerfile-embedding_genie-ai
  - IMAGE_NAME: textgen
    CONTEXT: genie-ai-overlay/textgen/
    DOCKERFILE: genie-ai-overlay/textgen/Dockerfile-textgen_genie-ai
  - IMAGE_NAME: postgres-init
    CONTEXT: configs/postgres/
    DOCKERFILE: configs/postgres/Dockerfile
  - IMAGE_NAME: keycloak
    CONTEXT: configs/keycloak/
    DOCKERFILE: configs/keycloak/Dockerfile
  - IMAGE_NAME: keycloak-config
    CONTEXT: configs/keycloak/
    DOCKERFILE: configs/keycloak/Dockerfile.config-cli
  - IMAGE_NAME: tempo-proxy
    CONTEXT: tools/tempo-proxy/
    DOCKERFILE: tools/tempo-proxy/Dockerfile

# Build/scan run on MR, main, and tags. Skip schedules and web pipelines.
.build_rules: &build_rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "web"
    when: never
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Promote only on protected refs (main + tags). MR candidate images are ephemeral
# (:mr-<iid>-<sha>) and never promoted to deployable tags.
.promote_rules: &promote_rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "web"
    when: never
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Diagnostic — confirms BOTH container and daemon can reach the registry, and
# reveals the daemon's proxy config so we know whether the ansible NO_PROXY fix
# (roles/docker) applies. allow_failure so it never blocks the pipeline.
diag:registry-reachability:
  stage: .pre
  image: docker:28
  rules: *build_rules
  allow_failure: true
  script:
    - echo "CI_REGISTRY=$CI_REGISTRY  DOCKER_HOST=$DOCKER_HOST"
    - echo "=== container proxy env ==="
    - env | grep -iE "http_proxy|https_proxy|no_proxy" || echo "(no proxy env in container)"
    - echo "=== container HTTPS reachability ==="
    - wget -q -S -O /dev/null "https://$CI_REGISTRY/v2/" 2>&1 | grep -E "HTTP/|401|403" | head -3 || echo "(container cannot reach registry)"
    - echo "=== daemon proxy config (docker info) ==="
    - docker info 2>/dev/null | grep -iE "http proxy|https proxy|no proxy|registry" || echo "(no proxy shown by daemon)"
    - echo "=== daemon → registry reachability (docker login dry-run via catalog) ==="
    - |
      if docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY" 2>&1 | tee /tmp/login.txt; then
        echo "DAEMON_LOGIN_OK"
      else
        echo "DAEMON_LOGIN_FAILED (proxy block if 403 HTML above)"
      fi

# Diagnostic — gather evidence on WHY `docker build` picks the docker-container
# buildx driver (which fails: privileged mode incompatible with userns-remap).
# In standard docker the "default" builder uses the docker (in-daemon) driver;
# a docker-container builder should only exist if explicitly created. This job
# shows what buildx actually sees so we can fix at the right layer. No fix here.
diag:buildx:
  stage: .pre
  image: docker:28
  rules: *build_rules
  allow_failure: true
  script:
    - echo "=== docker version ==="
    - docker version
    - echo "=== buildx version ==="
    - docker buildx version
    - echo "=== buildx builders (NAME/DRIVER/ENDPOINT) — KEY EVIDENCE ==="
    - docker buildx ls
    - echo "=== docker contexts ==="
    - docker context ls
    - echo "=== relevant env ==="
    - env | grep -iE "BUILDKIT|BUILDX|DOCKER_HOST|DOCKER_CONFIG" || echo "(none)"
    - echo "=== inspect default builder ==="
    - docker buildx inspect default || true
    - echo "=== minimal build test (BuildKit syntax) — which driver + result ==="
    - |
      mkdir -p /tmp/ctx && printf 'FROM busybox\nCOPY --chmod=755 /etc/hostname /tmp/h\n' > /tmp/ctx/Dockerfile
      docker build -t test:buildx-probe /tmp/ctx 2>&1 | head -25 || echo "(build failed — see driver + error above)"

# Build candidate images and push to the GitLab Container Registry. The runner's
# docker-socket-proxy now allows AUTH + DISTRIBUTION (see deploy/ansible/roles/
# docker_socket_proxy), so `docker login` + `docker push` work natively.
build:image:
  stage: build
  image: docker:28
  tags: [docker]
  interruptible: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      REGISTRY_REF="$CI_REGISTRY_IMAGE/$IMAGE_NAME:${CANDIDATE_TAG}"
      echo "Building $IMAGE_NAME → ${REGISTRY_REF}"
    # Pull a previous image as a layer-cache source (no-op on first run).
    - docker pull "$CI_REGISTRY_IMAGE/$IMAGE_NAME:main" 2>/dev/null || docker pull "$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest" 2>/dev/null || true
    # DOCKER_BUILDKIT is intentionally NOT set — the daemon manages it (on by
    # default in Docker 23+, runner pinned to 28.x). Several Dockerfiles use
    # BuildKit syntax (--chmod), which the daemon default handles.
    - docker build --cache-from "$CI_REGISTRY_IMAGE/$IMAGE_NAME:main" -f "$DOCKERFILE" -t "$REGISTRY_REF" "$CONTEXT"
    - docker push "$REGISTRY_REF"
  parallel:
    matrix: *image_matrix
  rules: *build_rules

# Syft SBOM (artifact, 1-year retention for EU CRA audit) + Trivy blocking gate
# on fixable HIGH/CRITICAL CVEs. Trivy DB freshness also gated (>24h = fail).
# NOTE: no `needs:` here — stage ordering (build → scan) gates this. GitLab 17.5
# predates `$[[ matrix.X ]]` expressions (18.6+), so 1:1 matrix deps aren't
# expressible; stage ordering ensures all build:image jobs finish before any
# scan:image starts. Upgrade GitLab to 18.6+ to enable per-image DAG chaining.
scan:image:
  stage: scan
  image: $TRIVY_IMAGE_TAG
  tags: [docker]
  interruptible: true
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache/"
  cache:
    - key: "trivy-db"
      paths: [".trivycache/"]
  before_script:
    # Manual docker config so syft & trivy authenticate when pulling the image
    # over HTTPS from the container. No `docker login` (daemon proxy-blocked);
    # both tools read ~/.docker/config.json and fetch via their own HTTP clients.
    - mkdir -p ~/.docker
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > ~/.docker/config.json
    - wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- "$SYFT_VERSION"
    - trivy image --download-db-only
    - |
      DB="$TRIVY_CACHE_DIR/db/trivy.db"
      [ -f "$DB" ] || { echo "Trivy DB missing"; exit 1; }
      AGE=$(( $(date +%s) - $(stat -c %Y "$DB") ))
      [ "$AGE" -lt 86400 ] || { echo "Trivy DB stale ($AGE s > 86400)"; exit 1; }
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME:${CANDIDATE_TAG}"
      echo "Scanning $IMAGE"
    # 1. SBOM (SPDX JSON) — composition source of truth + audit artifact
    - syft -o spdx-json "$IMAGE" > sbom.spdx.json
    # 2. Non-blocking report for the GitLab Container Scanning UI widget (single
    # line — a bare newline in a `- |` block ends the command)
    - trivy image --severity "$TRIVY_SEVERITY" --ignore-unfixed --format json --output gl-container-scanning-report.json --exit-code 0 "$IMAGE"
    # 3. Blocking gate — fail on fixable HIGH/CRITICAL (honors .trivyignore)
    - trivy image --severity "$TRIVY_SEVERITY" --ignore-unfixed --ignorefile .trivyignore --format table --exit-code 1 "$IMAGE"
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - sbom.spdx.json
    reports:
      container_scanning: gl-container-scanning-report.json
  parallel:
    matrix: *image_matrix
  rules: *build_rules

# Promote the scanned candidate's immutable digest to deployable tags.
# Runs only on main + tags. Phase 2 will add `cosign verify` before retag.
promote:image:
  stage: promote
  image: docker:28
  tags: [docker]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - SRC="$CI_REGISTRY_IMAGE/$IMAGE_NAME:pending-$CI_COMMIT_SHORT_SHA"
    - DIGEST=$(docker buildx imagetools inspect "$SRC" --format '{{.Manifest.Digest}}')
    - echo "Promoting $IMAGE_NAME digest ${DIGEST:0:32}..."
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        FINAL_TAGS="$CI_COMMIT_TAG latest"
      else
        FINAL_TAGS="${CI_COMMIT_BRANCH}-${CI_COMMIT_SHORT_SHA} ${CI_COMMIT_BRANCH}"
      fi
    - |
      for t in $FINAL_TAGS; do
        # Retag by immutable digest, never by the mutable pending tag.
        docker buildx imagetools create -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$t" "$CI_REGISTRY_IMAGE/$IMAGE_NAME@${DIGEST}"
      done
    # Quarantine tag cleanup — promoted digest now lives under final tags
    - docker buildx imagetools rm "$SRC" 2>/dev/null || true
  parallel:
    matrix: *image_matrix
  rules: *promote_rules

# --- Lint jobs ---

lint:backend:
