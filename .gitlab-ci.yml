# Compile-verification for the Patrol E2E suite (patrol_test/).
# patrol is deliberately NOT a dev_dependency in pubspec.yaml: its Android
# wiring is debug-only, so a committed dependency breaks
# `flutter build apk --release` (see commit e80ff6855). The suite is excluded
# from the default `flutter analyze` (analysis_options.yaml) and compiled
# here instead: patrol is injected into the CI workspace only, the exclude
# is stripped, and the suite is analyzed + format-checked. Workspace
# mutations (pub add, sed, secrets copy) are never committed.
# Runtime E2E execution is tracked separately (see the restoration issue).
lint:dart:patrol:
  extends: .flutter_base
  stage: lint
  script:
    - export PATH="$PWD/../../flutter-sdk/bin:$PATH"
    - cp patrol_test/e2e_secrets.dart.example patrol_test/e2e_secrets.dart
    - sed -i '/patrol_test\/\*\*/d' analysis_options.yaml
    - flutter pub add "dev:patrol:4.5.0"
    - flutter analyze patrol_test
    - dart format --output=none --set-exit-if-changed patrol_test/
