apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arango-data-pvc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.labels" . | nindent 4 }}
    app.kubernetes.io/component: arango-storage
    genieai/tier: cpu
spec:
  storageClassName: {{ .Values.storage.arango.storageClass }}
  accessModes:
    - {{ .Values.storage.arango.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.arango.size }}
