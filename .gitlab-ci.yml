test:backend:
  extends: .test_node
  before_script:
    # shared/lib must install too — backend requires shared/lib/victorialogs-transport
    # which requires winston-transport. Without shared/lib/node_modules, the test
    # fails with "Cannot find module 'winston-transport'". Add shared/lib first so
    # its node_modules is in the require-resolution path.
    - cd components/shared/lib && npm ci
    # After cd into shared/lib, `cd components/gov-chat-backend` would resolve
    # to `components/shared/lib/components/gov-chat-backend` (does not exist).
    # Pop back to the worktree root first, then descend into gov-chat-backend.
    - cd - && cd components/gov-chat-backend && npm ci
  script:
    # Same worker-memory cap as test:frontend — see its note there (#1404).
    # --maxWorkers=2 alone left the per-worker heap growth unbounded.
    - npm test -- --maxWorkers=2 --workerIdleMemoryLimit=500MB --coverage --coverageReporters=text-summary --coverageReporters=cobertura
  coverage: '/^Statements\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      junit: components/gov-chat-backend/reports/jest-backend.xml
      coverage_report:
        coverage_format: cobertura
        path: components/gov-chat-backend/coverage/cobertura-coverage.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/gov-chat-backend/**/*"
        - "components/shared/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# The husk report script (scripts/report-husk-user-docs.js) decides which
# user documents the deletion wave removes. The unit suite pins the AQL
# TEMPLATE's substrings and the JS predicate — but a template edit that
# keeps its substrings, or a constant edit BOTH sides share, passes it
# green while the query selects the wrong documents (issue #1501). This job
# runs that AQL against a REAL ArangoDB.
#
# The service container is a throwaway on the runner's private network:
# ARANGO_NO_AUTH gives it no credentials (there is nothing to protect — it
# is discarded with the job) and the suite creates and drops its OWN
# database, so no application database is ever touched.
test:backend-arango:
  extends: .test_node
  services:
    # The engine version TRACKS the production pin (docker-compose.yaml and
    # components/arangodb/compose.yaml): the gate proves the AQL against
    # the engine that will run it, so a production bump must bump this tag
    # too — the two production pin files are in the changes filter below.
    - name: arangodb/arangodb:3.12.4
      alias: arangodb
      variables:
        ARANGO_NO_AUTH: "1"
  variables:
    ARANGO_TEST_URL: "http://arangodb:8529"
    ARANGO_TEST_USER: "root"
    # The script's own operator gate requires a password; this database
    # ignores it (ARANGO_NO_AUTH above).
    ARANGO_TEST_PASSWORD: "ci-husk-gate-placeholder"
    # jest-junit's env options override the package.json ones: the report
    # of THIS job must not overwrite the backend suite's report name.
    JEST_JUNIT_OUTPUT_NAME: "jest-husk-arango.xml"
  before_script:
    # Only the backend: this suite loads the script and the driver, nothing
    # from shared/lib.
    - cd "$CI_PROJECT_DIR/components/gov-chat-backend" && npm ci
  script:
    # before_script and script share one shell; this pins the cwd of the
    # script section explicitly instead of depending on that.
    - cd "$CI_PROJECT_DIR/components/gov-chat-backend"
    - mkdir -p reports
    # The whole integration directory: the husk gate AND the sibling tree
    # suite, which shares the lifecycle scaffolding (helpers/arango.js) and
    # therefore the same wait-for-server safety — at zero extra services.
    - npx jest __tests__/integration --json --outputFile=reports/jest-husk-arango.json
    # The suites SKIPS themselves when ARANGO_TEST_URL is unset: a job that
    # lost the variable would go green having run nothing. The JSON report
    # says how many tests actually ran.
    - node -e "const r = require('./reports/jest-husk-arango.json'); if (!r.numPassedTests) { console.error('no ArangoDB-backed test ran (' + r.numPassedTests + ' passed) — the suite was skipped'); process.exit(1); }"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: components/gov-chat-backend/reports/jest-husk-arango.xml
  rules:
    # MR pipelines: the gate matters when the script, its suite, the driver
    # version, the engine pin or the job itself changes — nothing else can
    # move the AQL's semantics, so other backend MRs skip it.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/gov-chat-backend/scripts/report-husk-user-docs.js"
        - "components/gov-chat-backend/__tests__/integration/**"
        - "components/gov-chat-backend/package.json"
        - "components/gov-chat-backend/package-lock.json"
        - "docker-compose.yaml"
        - "components/arangodb/compose.yaml"
        - ".gitlab-ci.yml"
      when: on_success
    # Branch pipelines (main / release/*): run it on every push, like every
    # sibling test job — the AQL that decides what the deletion wave
    # removes must be green on the ref that ships it, whatever moved.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

test:frontend:
  extends: .test_node
  before_script:
