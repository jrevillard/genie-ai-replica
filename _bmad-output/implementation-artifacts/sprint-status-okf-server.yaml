  1-8b-routing-gate-v2: review  # [VALIDATED + COMMITTED 2026-10-09 — f8ead5de0 (31 files, +1972) on fix/story-1-8b-routing-gate-v2 (cut from feat/okf-server 2e9be556); gate v2 live on the local build; MR → feat/okf-server pending. Validation results at the end of this comment + story §8] David 2026-10-09 rulings: "forbidden is forbidden — that is a hard contract, it should immediately score zero" (the veto); routing must be an AFFIRMATIVE claim — "we must ascertain that there either IS or IS NOT a reason to include any repo in the selected list for any given query… this is a key part of both the RAG accuracy and efficiency goals"; the Lab must TEACH the user how to adjust tags (suppression → which condition + which tag + what to edit); the suite generator must produce MORE RANDOM adversarial negatives. Three-condition claim contract (replaces 1-8a margin-only; margin kept): FLOOR score ≥ RETRIEVER_ROUTE_HEAD_FLOOR 0.55 (unrelated queries score 0.32-0.484 on any head; margin-only let "capital of France" 0.321 claim NCD at +0.012), VETO no single forbidden tag cosine ≥ RETRIEVER_ROUTE_FORBIDDEN_TAG_MAX 0.55 (mixed-subject negatives slip the AVERAGED centroid: genetics 0.617 / epidemiology 0.619 / exercise 0.638 / incidence-trends 0.567 vs their dominant tag; legit claims ≤ 0.529 on any tag), MARGIN score − forbidden-centroid > RETRIEVER_ROUTE_HEAD_MARGIN 0.01. head_claimed = all three; head_claim ∈ {floor, veto, margin, claim} = FIRST failing condition (the teach-the-user hook); head.per_field.forbidden_vectors = [{tag, vector}] per-tag embeddings built at publish (frontmatter-service.buildVectorizedHead; averaged forbidden centroid unchanged — needs a head REBUILD on existing repos); verdict provenance 'head-suppressed (off-domain)' | 'head-suppressed (forbidden: <tag>)' | 'head-suppressed (forbidden/noise)'; fidelity algorithm story-1.3-replay+v2 with all 3 knobs. Retriever parity: _route_graphs head pseudo-row needs floor+veto+margin to enter the top-K pool; counters heads_floored/heads_vetoed/heads_gated; span attrs rag.route.heads_floored/heads_vetoed; log line extended; degradation skips veto without per-tag vectors / skips margin without centroid (never silently suppresses on missing data). Files changed (committed in f8ead5de0 — 31 files, +1972: the 4 core files + suite-generator randomization + HeadTestDialog gate breakdown/teach panels + i18n ×14 + jest +176 / pytest test_fanout.py +287 + env/docker-compose/env.j2/config-validation externalization of the two new knobs). SHIPPED IN THE COMMIT: v2 unit tests; MORE RANDOM adversarial negatives (randomized off-domain + meta classes with deterministic fallbacks); HeadTestDialog teach-the-user (3-check Floor/Forbidden-tags/Margin breakdown, DsPill pass/fail/na from fidelity.knobs; veto + floor teach panels). VALIDATION PASSED (2026-10-09, NCD f043215b local-build cycle): head rebuilt (forbidden_vectors minted) → suite 18/18 PASS at 08:08 (positives claimed, mixed-subject vetoed, off-domain floored; TB 0.509 floor-suppressed); David says "testing is much better". RESIDUAL spun into 1-8c: the HIV/communicable-disease query CLAIMS (head 0.594 > floor 0.55, max tag 0.518 < 0.55, margin +0.049 — all three conditions pass) because communicable-disease is UNDECLARED — a curation gap, not a gate bug; the Lab had no claim-side teaching surface. Story file _bmad-output/implementation-artifacts/story-1-8b-routing-gate-v2.md (§8 = validation results); spec §13-14.
