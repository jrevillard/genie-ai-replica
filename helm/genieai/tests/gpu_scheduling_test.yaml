suite: GPU Scheduling Tests
templates:
  - gpu/vllm-deployment.yaml
  - gpu/vllm-service.yaml
  - gpu/tei-deployment.yaml
  - gpu/tei-service.yaml
  - gpu/tei-reranker-deployment.yaml
  - gpu/tei-reranker-service.yaml
  - gpu/dataprep-deployment.yaml
  - gpu/dataprep-service.yaml
tests:
  # ============================================================
  # vLLM Deployment Tests
  # ============================================================
  - it: vllm deployment should have GPU node affinity
    template: gpu/vllm-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: gpu-pool
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator
          value: In
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: "true"

  - it: vllm deployment should have GPU tolerations
    template: gpu/vllm-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: "nvidia.com/gpu"
      - equal:
          path: spec.template.spec.tolerations[0].value
          value: "present"
      - equal:
          path: spec.template.spec.tolerations[0].effect
          value: "NoSchedule"

  - it: vllm deployment should have GPU resources
    template: gpu/vllm-deployment.yaml
    asserts:
      - isSubset:
          path: spec.template.spec.containers[0].resources.requests
          content:
            nvidia.com/gpu: "1"
      - isSubset:
          path: spec.template.spec.containers[0].resources.limits
          content:
            nvidia.com/gpu: "1"

  - it: vllm deployment should have RollingUpdate strategy
    template: gpu/vllm-deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

