{{- /* The RAGAS judge cache — Compose backs it with a named volume so the
 KG builds survive container recreation (measured ~50 min to rebuild on
 a cold cache). The chart equivalent is a PVC; an emptyDir would only
 cover pod restarts, not the reschedule that actually loses the data. */ -}}
{{- if eq true (index (.Values.okf | default dict) "enabled") -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragas-llm-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ragas-service") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ index (.Values.okf | default dict) "ragasCacheSize" | default "5Gi" }}
{{- end -}}
