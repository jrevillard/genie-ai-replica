plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android" // Changed from "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.genie_ai_mobile"
    ndkVersion = "27.0.12077973"
    compileSdk = 36

    compileOptions {
        // Updated to Java 17 for Gradle 8.5 compatibility
        // Desugaring required by flutter_local_notifications (java.time APIs)
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        // Updated to Java 17
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.example.genie_ai_mobile.debug"
        // Android 10 (API 29) is the supported floor for this deployment
        minSdk = 29
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner = "pl.leancode.patrol.PatrolJUnitRunner"
    }

    testOptions {
        execution = "ANDROIDX_TEST_ORCHESTRATOR"
    }

    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            // Base package (no .dev suffix) so the id matches the Android app
            // registered in the Firebase project (FCM token fetch).
            applicationId = "com.example.genie_ai_mobile"
            manifestPlaceholders = [
                appAuthRedirectScheme: "com.itu.genieai.dev"
            ]
        }
        staging {
            dimension "environment"
            applicationId = "com.example.genie_ai_mobile.staging"
            manifestPlaceholders = [
                appAuthRedirectScheme: "com.itu.genieai.staging"
            ]
        }
        e2e {
            dimension "environment"
            applicationId = "com.example.genie_ai_mobile.e2e"
            manifestPlaceholders = [
                appAuthRedirectScheme: "com.itu.genieai.e2e"
            ]
        }
        itu {
            dimension "environment"
            applicationId = "com.example.genie_ai_mobile"
            manifestPlaceholders = [
                appAuthRedirectScheme: "com.itu.genieai"
            ]
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // PatrolJUnitRunner is added to main APK by Flutter via debugApi.
    // We need it in the androidTest APK too — reference the Gradle subproject directly.
    androidTestImplementation(project(":patrol"))

    androidTestImplementation("androidx.test:core:1.5.0")
    androidTestImplementation("androidx.test:rules:1.2.0")
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.test.services:test-services:1.4.2")
    androidTestUtil("androidx.test:orchestrator:1.5.1")

    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}