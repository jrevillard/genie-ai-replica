{{- /* A pre-install hook that creates the release namespace. Every other
       pre-install hook in the chart (dep-check SA, dep-check Job,
       cluster-profile detect Job) targets this namespace, and helm
       creates the namespace AFTER hooks by default — so without this
       hook the install fails on the very first hook with
       `namespaces "<ns>" not found`.

       The original comment here argued against using an annotation
       because Helm 4's `before-hook-creation` would delete the
       namespace between reinstalls. That argument was wrong:
       `before-hook-creation` only deletes objects whose identity
       matches the same `helm.sh/hook` annotation as some other hook.
       This template only sets `pre-install`, no other template in the
       chart uses ONLY `pre-install`, and `hook-succeeded` would in
       fact delete the namespace between releases (wrong: the next
       release's hooks need it). So the no-delete-policy choice is the
       one that makes both installs and reinstalls work, and the
       original argument was solving a phantom problem.

       Consequence: the chart now self-provisions the namespace; a
       HelmRelease that ALSO sets `install.createNamespace: true` is
       fine (its effect is just a no-op for us), and the README no
       longer requires `helm install --create-namespace`. */ -}}
{{- $componentValues := dict "Chart" .Chart "Release" .Release "Values" "component" "namespace" -}}
{{- $ns := .Release.Namespace -}}
{{- /* Fail fast when the legacy values key diverges from the release
       namespace: later-tier templates still read .Values.namespace, and a
       divergence silently splits the install across two namespaces.
       This guard fires only when the values key is explicitly set AND
       mismatched — values.yaml ships a default so default installs never
       trip it. */ -}}
{{- if and .Values.namespace (ne .Values.namespace .Release.Namespace) -}}
{{- fail (printf "values 'namespace' (%s) must equal the release namespace (%s) — set namespace: %s in your values-override, OR install with -n %s" .Values.namespace .Release.Namespace .Release.Namespace .Release.Namespace) -}}
{{- end -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-100"
    # NO delete-policy: see the comment block at the top. With only
    # `pre-install` here and nothing else pre-install-only in the chart,
    # before-hook-creation has no peer to delete, and hook-succeeded
    # would delete the namespace between releases (wrong: the next
    # release's hooks need it). No delete policy = retain.
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
    genieai.io/cluster-profile: {{ .Values.clusterProfile | default "dev" | quote }}
    app.kubernetes.io/part-of: genieai
    # Advertise K8s Pod Security Standards at the namespace level so admission
    # controllers refuse pods without required securityContext.
    # `baseline` (not `restricted`) because the chart ships 2 services
    # (nginx, frontend) whose images have no non-root USER — their
    # entrypoints write to paths owned by root. `restricted` rejects
    # `runAsNonRoot: false / runAsUser: 0` and strands those pods in
    # ImagePullBackOff. `baseline` still blocks the truly dangerous
    # cases (privileged, host namespaces, root capabilities) and is
    # the right floor for the dev install. Production deploys
    # rebuilding the images with a non-root USER can flip back to
    # `restricted`.
    pod-security.kubernetes.io/enforce: baseline
    # Pin to a specific version rather than `latest`. Across cluster upgrades
    # `latest` silently changes the policy version and may start rejecting
    # pods that previously scheduled without warning.
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.33
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.33
---
# ArgoDB operator in-cluster RBAC. The kube-arangodb operator installed
# by scripts/install-prereqs.sh runs in arango-system with `legacy`
# scope: cluster-wide for core K8s resources (deployments, services,
# PVCs, configmaps) but namespace-scoped for the ArangoDeployment
# custom resource itself. Without an in-namespace RoleBinding the
# operator's informer NEVER sees the ArangoDeployment rendered by
# templates/data/arangodb-deployment.yaml and the deployment stays
# in `Phase: Pending` indefinitely.
#
# The bootstrap operator's `legacy` scope grants CRD-definition
# rights cluster-wide but not the CR instances — that's by design, so
# the operator can be shared across namespaces without each tenant
# getting cluster-wide CR-write access. The fix lives in the chart
# that owns the namespace, not in the bootstrap script: each chart
# that wants ArangoDeployment reconciled in its namespace declares
# this Role+RoleBinding.
#
# The RoleBinding's subject is the operator's ServiceAccount in
# arango-system — that SA exists ONLY if the bootstrap ran. On a
# cluster without kube-arangodb, this binding is harmless (the SA
# is unknown and the role grants nothing).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arango-operator-crd-access
  namespace: {{ $ns }}
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ["database.arangodb.com"]
    resources:
      - arangodeployments
      - arangodeployments/scale
      - arangodeployments/status
      - arangomembers
      - arangomembers/status
      - arangotasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["database.arangodb.com"]
    resources: ["arangodeployments/finalizers"]
    verbs: ["update"]
  # The operator also writes the per-member TLS / JWT plumbing; without
  # secrets + configmaps the member pod never bootstraps.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The operator manages the headless services + member StatefulSets
  # for the ArangoDeployment (and rotates the JWT secret in the
  # auth path). The cluster-wide deployment CRD from the bootstrap
  # covers Deployments; the StatefulSet + Service rules are
  # in-namespace because legacy scope bundles them per-namespace.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arango-operator-crd-access
  namespace: {{ $ns }}
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: arango-kube-arangodb-operator
    namespace: arango-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arango-operator-crd-access

# Cluster-wide ClusterRole + ClusterRoleBinding for the bootstrap
# kube-arangodb operator. The in-namespace Role+RoleBinding above
# is necessary but NOT sufficient: the operator's informers are
# configured at startup from the SA's existing cluster-wide
# permissions, and the legacy-scope ClusterRole the chart ships
# (the one the operator uses to watch CRD *definitions*) does NOT
# include `database.arangodb.com` resources. Without cluster-wide
# cluster-scoped instance access, the operator's deployment
# controller never starts an informer for ArangoDeployment CRs,
# regardless of per-namespace Role grants.
#
# The fix: render a ClusterRole + ClusterRoleBinding here that
# grants the operator SA `get/list/watch/create/update/patch/delete`
# on the ArangoDeployment-family CRs cluster-wide. The legacy
# scope's "limited cluster access" design restricts this; we
# deliberately expand it because the umbrella chart manages
# ArangoDeployment in a namespace the operator was started
# before, so the informer's startup RBAC miss is permanent
# without an explicit cluster-scoped grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arango-operator-crd-access-{{ .Release.Name }}
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ["database.arangodb.com"]
    resources:
      - arangodeployments
      - arangodeployments/scale
      - arangodeployments/status
      - arangomembers
      - arangomembers/status
      - arangotasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["database.arangodb.com"]
    resources: ["arangodeployments/finalizers"]
    verbs: ["update"]
  # The operator also manages per-member core resources
  # (Secrets for JWT, ConfigMaps for cluster config, Services
  # for headless + client endpoints, StatefulSets for the
  # member pods). Legacy scope gives these cluster-wide
  # (the existing `arango-kube-arangodb-operator-arango-system-rbac-deployment`
  # ClusterRole), but with `namespaced: true` the per-namespace
  # binding is required too. Re-declare them here so the
  # in-namespace Role+RoleBinding already covers them.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts", "services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arango-operator-crd-access-{{ .Release.Name }}
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: arango-kube-arangodb-operator
    namespace: arango-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arango-operator-crd-access-{{ .Release.Name }}
