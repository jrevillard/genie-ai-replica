# --- Configuration validation ---

# Verify each overlay module's requirements-cpu.txt is in sync with its
# requirements.in (retriever/reranker). Fails if someone edited a
# requirements.in (or bumped OPEA, or changed the Dockerfile base/apt layer)
# without running `make lock-<module>`. Catches silent lock drift before it
# reaches a build. Split into per-module parallel jobs so a transient PyPI
# failure in one module's tag-pipeline check does not block the other
# (reduced blast radius — DW-29). Dockerfile-* paths are included because
# OPEA_VERSION / apt / base-image bumps are canonical lock-regen triggers.
# Note: dataprep retired from this check (issue-834 lock pipeline retired
# on the v1.5 bump — dataprep no longer ships a requirements.in).
.verify-overlay-lock-base:
  stage: config
  image: python:3.11-slim
  interruptible: true
  variables:
    UV_VERSION: "0.10.6"
  before_script:
    - pip install --no-cache-dir "uv==${UV_VERSION}"
  script:
    - |
      set -e
      cd "${CI_PROJECT_DIR}/genie-ai-overlay/${MOD}"
      # Verify lock is consistent and installable without re-resolving.
      # uv pip sync --dry-run checks every package+hash exists on PyPI;
      # it does NOT re-resolve, so upstream version bumps don't cause
      # spurious failures (only removed packages do).
      uv pip sync requirements-cpu.txt --dry-run --system
      # Cross-check: verify requirements.in is covered by the lock.
      # greps top-level non-comment lines from requirements.in and
      # checks each package name appears in the lock. Missing = user
      # added a dep without regenerating the lock.
      while IFS= read -r line; do
        pkg=$(echo "$line" | sed 's/[<>=!~].*//;s/\[.*//;s/#.*//' | xargs)
        [ -z "$pkg" ] && continue
        norm=$(echo "$pkg" | tr '[:upper:]_' '[:lower:]-')
        if ! grep -q "^${norm}==" requirements-cpu.txt; then
          echo "MISSING from ${MOD} lock: $pkg — run 'make lock-${MOD}'"
          exit 1
        fi
      done < requirements.in
      echo "genie-ai-overlay/${MOD}/requirements-cpu.txt in sync"

verify:overlay-locks:retriever:
  extends: .verify-overlay-lock-base
  variables:
    MOD: retriever
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"

verify:overlay-locks:reranker:
  extends: .verify-overlay-lock-base
  variables:
    MOD: reranker
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"


config:validate:
  extends: .node_base
  stage: config
  before_script:
    - cd tests/config-validator && npm ci
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm ci
  script:
    - cd ${CI_PROJECT_DIR}/tests/config-validator && npm test
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm run test:ci
  cache:
    - key:
        files:
          - tests/config-validator/package-lock.json
        prefix: config-validate
      paths:
        - tests/config-validator/node_modules/
      fallback_keys:
        - "config-validate-$CI_DEFAULT_BRANCH"
        - "config-validate-"
    - key:
        files:
          - api-gateway-solution/new-config/package-lock.json
        prefix: config-kong
      paths:
        - api-gateway-solution/new-config/node_modules/
      fallback_keys:
        - "config-kong-$CI_DEFAULT_BRANCH"
        - "config-kong-"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - tests/config-validator/reports/jest-config.xml
        - api-gateway-solution/new-config/reports/jest-kong-config.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "env"
        - "env.*"
        - "docker-compose.yaml"
        - "docker-compose.gpu.yaml"
        - "tests/config-validator/**/*"
        - "tests/fixtures/config/**/*"
        - "api-gateway-solution/new-config/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Validate CHANGELOG.md has an entry for the version being released
config:changelog:
  stage: config
  image: alpine:3.21
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Checking CHANGELOG.md for version: ${VERSION}"
      if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
        echo "ERROR: CHANGELOG.md has no entry for version ${VERSION}."
        echo "Add a ## [${VERSION}] section before tagging."
        exit 1
      fi
      echo "CHANGELOG.md entry found for ${VERSION}."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# --- Scheduled jobs (nightly via pipeline schedule) ---

# Integration smoke test — runs full core stack via Docker Compose
# Enhanced by stories 1-8, 1-9 (Playwright E2E)
#
# REQUIRED CI Variables (Settings → CI/CD → Variables):
#   ARANGO_PASSWORD, POSTGRES_PASSWORD, KONG_DB_PASSWORD,
#   KEYCLOAK_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD,
#   KEYCLOAK_CLIENT_SECRET, GENIE_ADMIN_PASSWORD,
#   GENIE_ADMIN_EMAIL, KEYCLOAK_PROXY_CLIENT_SECRET,
#   KC_DATAPREP_CLIENT_SECRET, TRANSLATION_CACHE_PASSWORD
#
# CI variables override empty values from the env template (shell env > .env file).
# The env template provides non-secret config (KEYCLOAK_URL, KEYCLOAK_REALM, etc.).
scheduled:integration:
  extends: .e2e_integration_base
  stage: scheduled
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# Mobile E2E tests (Patrol) — shared logic with patrol:e2e via .e2e_mobile_base
# Depends on scheduled:integration (running Docker stack)
# Uses Google's official Android emulator via Docker (requires KVM)
# Networking: socat + adb reverse routes emulator's 127.0.0.1:8443 → nginx:443
scheduled:e2e-mobile:
  extends: .e2e_mobile_base
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# Web frontend E2E tests (Playwright)
# Runs against the Docker stack started by scheduled:integration
scheduled:e2e-web:
  extends: .e2e_web_base
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# MELT correlation tests (Story 7-10)
# Validates observability pipeline: traces, metrics, logs correlation across Victoria* backends.
# Scheduled tier — runs only when ENABLE_OBSERVABILITY=1 (requires observability stack).
# Depends on scheduled:integration for Docker stack + observability profile.
scheduled:melt-correlation:
  image: node:20-alpine
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  variables:
    PROPAGATION_DELAY: "20"
  script:
    - apk add --no-cache bash curl
    - cd tests/melt-correlation
    - bash run-melt-test.sh --skip-chaos --skip-playwright
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/melt-*.xml
    reports:
      junit:
        - reports/melt-correlation-report.xml
        - reports/melt-grafana-report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ENABLE_OBSERVABILITY == "1"
      when: on_success

# MELT chaos resilience tests (Story 7-10, AC#4/#5)
# Separate job — stops/restarts Victoria* backends, requires isolation.
# Runs after melt-correlation (needs baseline data).
scheduled:melt-chaos:
  image: docker:24
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  variables:
    PROPAGATION_DELAY: "20"
    RESTART_TIMEOUT: "90"
  script:
    - apk add --no-cache bash curl nodejs npm
    - npm ci --no-audit --no-fund 2>/dev/null || npm install
    - cd tests/melt-correlation
    - bash run-melt-test.sh --skip-playwright --correlation-only || true
    - node chaos-resilience.test.js
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/melt-chaos-report.xml
    reports:
      junit:
        - reports/melt-chaos-report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ENABLE_OBSERVABILITY == "1"
      when: on_success

# Teardown: clean up compose stack after E2E jobs finish (success or failure).
# Uses .post — GitLab's built-in final stage (always runs, even on failure).
.cleanup_base:
  image: docker:24
  stage: .post
  tags: [docker]
  script:
    - docker compose -p "ci-${CI_PIPELINE_ID}" down -v --remove-orphans 2>/dev/null || true

e2e:cleanup:
  extends: .cleanup_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      when: always

scheduled:cleanup:
  extends: .cleanup_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# --- Manual jobs (on-demand via Run Pipeline → click play) ---

# RAG quality regression — requires GPU runner
# Enhanced by Epic 8 (RAG Quality)
manual:rag-quality:
  image: python:3.11-slim
  stage: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  tags: [gpu]
  timeout: 60m
  before_script:
    - cd genie-ai-overlay
    - if [ ! -d .venv ]; then python -m venv .venv; fi
    - . .venv/bin/activate
    - pip install -e ".[test]"
  script:
    - . .venv/bin/activate
    - |
      if [ -z "$GPU_AVAILABLE" ]; then
        echo "No GPU detected — skipping RAG quality tests"
        exit 0
      fi
    - |
      pytest -m rag-quality --junitxml=reports/rag-quality.xml || echo "WARNING: No rag-quality tests found (Epic 8 placeholder)"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: genie-ai-overlay/reports/rag-quality.xml


# --- Documentation site -> GitLab Pages ---
# Builds the Hugo + Docsy site in site/ and publishes to GitLab Pages.
# Docsy is a Hugo Module (needs Go); assets need Node. hugomods/hugo:exts
# provides all three (latest stable).
pages:
  stage: deploy
  image: docker.io/hugomods/hugo:exts
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - cd site
    - hugo mod tidy
    - hugo --gc --minify --baseURL "$CI_PAGES_URL/" --destination "$CI_PROJECT_DIR/public"
  artifacts:
    paths:
      - public
  rules:
    # Publish to GitLab Pages on the default branch only.
    - if: $CI_COMMIT_BRANCH == "main"
