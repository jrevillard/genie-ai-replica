worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stderr;
  sendfile on;
  client_max_body_size 50m;

  # Non-root (#1227): uid 101 cannot write the compiled-in temp locations
  # under /var/lib/nginx — keep everything nginx writes under /tmp.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen ${NGINX_PORT};

    # Runtime-mounted config: CSS tokens, brand JSON and other operator-editable
    # assets. The ^~ modifier is required to win against the regex location below —
    # without it, /config/theme-variables.css would still get the immutable cache.
    location ^~ /config/ {
      root /app/dist;
      include /etc/nginx/nginx-revalidate-headers.inc;
    }

    # The public gateway (api-gateway-solution nginx) intercepts upstream 404s
    # and serves the SPA index.html instead, so a browser-side onerror fallback
    # never fires behind it. Fall back inside nginx instead: an unseeded or
    # partially seeded /config mount gets the image-baked default tokens, never
    # HTML-as-stylesheet. Exact match wins over the ^~ prefix above.
    location = /config/theme-variables.css {
      root /app/dist;
      try_files $uri @theme_fallback;
      include /etc/nginx/nginx-revalidate-headers.inc;
    }

    location @theme_fallback {
      root /app/dist;
      try_files /theme-fallback.css =404;
      include /etc/nginx/nginx-revalidate-headers.inc;
    }

    # Runtime config generated at container startup into /app/dist/runtime, and the
    # image-baked theme fallback. Both sit outside the read-only /config/ bind mount.
    # Exact-match (=) locations are evaluated before regex locations, so these two
    # are never captured by the ~* \.(js|css|...) immutable rule below.
    location = /runtime/config.js {
      root /app/dist;
      include /etc/nginx/nginx-revalidate-headers.inc;
    }

    location = /theme-fallback.css {
      root /app/dist;
      include /etc/nginx/nginx-revalidate-headers.inc;
    }

    # Cache: immutable for hashed assets (excludes .map source maps)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webmanifest)$ {
      root /app/dist;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }

    # Health endpoint
    location = /health {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      return 200 '{"status":"ok"}';
    }

    # SPA fallback — always revalidate index.html so clients pick up new asset hashes
    location / {
      root /app/dist;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      try_files $uri $uri/ /index.html;
    }
  }
}
