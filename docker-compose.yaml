  arango-vector-db:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    restart: unless-stopped
    image: arangodb/arangodb:3.12.4
    ports:
      - target: 8529
