{{/*
Keycloak Database (PostgreSQL) Service - Data Tier (CPU Node Pool)
*/}}
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "keycloak-db" "tier" "cpu" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "genieai.selectorLabels" (dict "name" "keycloak-db" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.cpu.keycloakDb.port }}
      targetPort: {{ .Values.cpu.keycloakDb.port }}
      protocol: TCP
      name: postgres
