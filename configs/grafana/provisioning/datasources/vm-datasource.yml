apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    uid: victoriametrics
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
    links:
      - title: "View logs"
        type: datasources
        datasourceUid: victoriametrics-logs
        url: "/d/genieai-service-logs/service-logs?var-datasource=victoriametrics-logs&var-service=${__field.labels.service_name}&var-level=%24__all&var-filter=&from=${__from}&to=${__to}"
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    uid: victoriametrics-logs
    editable: false
