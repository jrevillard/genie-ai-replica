      timeout: 6s
    image: ${TEI_EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:1.9.3}
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - gpu-models
    restart: unless-stopped
