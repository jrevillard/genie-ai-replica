    matchLabels:
      app: tei-reranker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: reranker
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-translation-model
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "vllm-translation") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: vllm-translation
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: translation
        - podSelector:
            matchLabels:
              genieai.io/component: chatqna
        # backend BFF: its in-cluster translation endpoint defaults to
        # this Service when services.backend.translation.endpoint is
        # unset; a named translation API is mandatory, so a dropped
        # probe stops the backend from starting.
        - podSelector:
            matchLabels:
              genieai.io/component: backend
      ports:
        - protocol: TCP
          port: 9031
{{- end }}
{{- end -}}{{- /*

The OKF tier's own policies — rendered only when the tier is on, in the
same default-deny-with-allowlists shape the orchestrators carry. The
peers' rules that point INTO the tier (backend egress to okf-server,
dataprep ingress from the ingest worker) live in their own policies,
gated the same way: a tier policy without the peer half (or the other
way round) passes every render gate and silently drops the traffic it
was written to allow.

*/ -}}
{{- if eq true (index (.Values.okf | default dict) "enabled") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: okf-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "okf-server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: okf-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The BFF's retrieval-posture client (OKF_SERVER_URL) and the
    # dataprep worker, which carries the same wiring and kicks the
    # server on ingest completions.
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: backend
        - podSelector:
            matchLabels:
              genieai.io/component: dataprep
      ports:
        - protocol: TCP
          port: 3002
  egress:
    # DNS resolution to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # ArangoDB (concept store), the dataprep ingest endpoint, the RAGAS
    # sidecar, the chatqna serve path, the Keycloak token call (the
    # operator-managed pod labels are outside the genieai.io/component
    # convention — same port-scoped ipBlock the orchestrators carry),
    # and the OTLP exporter.
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: dataprep
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: ragas-service
      ports:
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: chatqna
      ports:
        - protocol: TCP
          port: 8888
    # The document repository (DOCUMENT_REPOSITORY_URL, app default
    # http://document-repository:3001): the ingest worker POSTs bundles
    # to its /api/files/ingest-bundle endpoint and the backing-file
    # service deletes through it — under default-deny a missing rule
    # here stalls the whole OKF ingest lifecycle with no error
    # anywhere. Post-DNAT pod port — services.documentRepository.port.
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: documentRepository
      ports:
        - protocol: TCP
          port: {{ index $appPorts "documentRepository" }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8529
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: {{ include "genieai-umbrella.otlpPort" . }}
    {{- if and (eq $opeaGpu.mode "external") $opeaGpu.nodeHost }}
    {{- include "genieai-umbrella.opeaGpuEgressRule" . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pii-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "pii-service") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: pii-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: okf-server
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ include "genieai-umbrella.otlpPort" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ragas-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ragas-service") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: ragas-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: okf-server
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The judge LLM and the embedding endpoint — both derived from the
    # GPU tier, so the named-destination GPU rule carries them whatever
    # the mode — and the OTLP exporter.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ include "genieai-umbrella.otlpPort" . }}
    {{- if and (eq $opeaGpu.mode "external") $opeaGpu.nodeHost }}
    {{- include "genieai-umbrella.opeaGpuEgressRule" . | nindent 4 }}
    {{- end }}
{{- end -}}
