  1-8g-p-suite-dup-origin-and-selfheal: done # [DONE 2026-10-11] LLM emitted the same query in + and − (pre-1-8g-h suite: one text ×3 in negatives, 16/66 rows duplicated) and the row guards WRITE-LOCKED it — every edit 409'd (logs 17:38-17:39, :922/:929), unfixable through the API. ORIGIN: generation already dedups (1-8g-h assembly filter + per-class loop sets + addQueries — verified); added the suitePrompt UNIQUENESS constraint (unique across the whole response, never two classes, vary substance) so the LLM stops wasting its N-budget. SELF-HEAL (updateSuiteRows): removes/flips take ALL text+kind copies across BOTH arrays (the clicked row represents the TEXT; ambiguous genuine+mislabeled flips now RESOLVE and fix the mislabel); within-kind duplicates normalize ON SAVE (head-suite.rows_normalized); flip-into-genuine → actionable 409; cross-kind contradiction stays hard but escapable. Live repair: suite s1791637021770-ca5aed deduped in DB (66→50 negatives, backup kept), David unblocked. Tests: 4 new + ambiguous-input test rewritten to resolution semantics; 61/61. Defect log §p.
  1-8g-q-serving-head-maintenance: done # [DONE 2026-10-11, David: "a maintenance operation, similar to indexing a database"] Serving repos were FULLY read-only — repository-service.update() 409'd every patch when ingested_at was set (rationale: rename desyncs the versioned graph name) AND assertWritable froze every concept write, so the FrontmatterPanel (head tags) + the whole tune loop were dead on the only repos actually serving. SCOPED fix: update() accepts frontmatter-only patches while serving (audited 'frontmatter_maintenance'; other keys → 409 naming the rule + keys); patchConcept exempts the INDEX concept's markdown write (the head YAML; every other concept + body/label writes stay frozen); FrontmatterPanel unlocked unconditionally; shell pill → "CONTENT READ ONLY — head/tags stay editable" (i18n ×14 codemod); rename stays blocked (still-valid reason); lifecycle transitions write the doc directly — verified untouched. Stale-label note: re-tagging stales chunk labels until the next Ingest (the DB index-rebuild analogy). Tests: +3 route (index maintenance 200 / non-index 409 / label 409 pinned), +2 service (serving frontmatter patch + restamp; rename+studio_step 409), okf-server 870/870, frontend OKF 246/246, localeConsistency 7/7. Defect log §q.
  1-8g-r-suite-cap-generator-parity: done # [DONE 2026-10-11] SUITE_ROW_CAPS (positive 60 / negative 150 — hand-picked pre-1-8f) sat BELOW the generator CLASS_MAX (1000 / 500x4): David's legitimate 100-positive NCD suite (s1791565037101) 409'd on EVERY row edit (7x SUITE_CAP 02:59, logs) — write-lock #2, same class as 1-8g-p. Fix: caps DERIVE from CLASS_MAX (positive 1000; negative = 500x4 classes = 2000) so every generatable suite is editable; the cap rejects only NET GROWTH (pre-edit sizes captured; shrink-always-allowed) so no future cap change can re-lock. No DB repair needed. Tests: +3 (100-positive editable / over-cap shrink / growth 409); 64/64; eslint+prettier clean. Defect log §r.
  1-8g-s-advisor-row-actions: done # [DONE 2026-10-11] 8 near-miss fails, advisor said NOTHING (logs: explain suggested:0, recommend 243->243) — add-LLM correctly refuses near-miss subjects (own vocabulary), removals are loop-only, and byText DROPPED the probe verdict (no row lever existed). Fix: probe rides into the advisor; failing negatives with answerable/weak probes become row_actions [{query, action:'flip', verdict, top_score, reason}] rendered with one-click Flip (normal row endpoint, 1-8g-p semantics); ungrounded negative fails counted honestly (ungrounded_negative_fails + note). i18n advisor.rowActionsTitle/flipToPositive/ungroundedNote ×14. Tests: +2. Defect log §s.
  1-8g-t-suite-delete-confirm: done # [DONE 2026-10-11, David: 'the deletion must be confirmed with a dialog'] The × only ARMS a DsDialog confirm (key + name + irreversible warning; Cancel/Delete); delete fires solely from Confirm. Investigated 'deleted suites were not deleted': all 15 clicked deletes SUCCEEDED (server logs, keys absent) — what remained were 13 LEGACY name:null suites (pre-naming-fix) rendering as blank rows. UX gap, not a delete bug. i18n suites.deleteConfirm* + unnamedFallback ×14. Test rewritten arm→cancel→confirm. Defect log §t.
  1-8g-u-generation-preflight-and-failure: done # [DONE 2026-10-11, David: 'suite <> not found for repo <>' on tag-less Indonesia History] beginSuiteGeneration minted the key + kicked the worker detached; NO_FRONTMATTER killed it in 1ms; .finally() cleared in-flight — the poll 404'd until timeout while the real error only hit the logs. Fix: begin is ASYNC and validates preconditions BEFORE minting (tag-less → immediate 409 NO_FRONTMATTER; UI: 'create tags in the Frontmatter panel (or use Suggest tags), then generate' — David's prescription); async failures recorded per repo → the poll's key answers {status:'failed', error:{code,message}} terminally, cleared on next begin. i18n error.noFrontmatter ×14. Tests: +3, begins updated to async signature. Defect log §u.
  1-8g-v-async-suite-runs: done # [DONE 2026-10-11, David: 'runs like this on a large repo will always take longer than 60 seconds'] A 100+100 run on Indonesia History 504'd at the gateway TWICE while the server COMPLETED it (pass_rate 0.9286, 03:58:09) — results persisted but INVISIBLE (the UI only renders the run response). Fix: the 1-8f2 pattern for runs — beginRunSuite (validate → 409 concurrent → mint → status:'running' placeholder → detached worker; failed worker → status:'failed' doc), GET /:suite_key/runs/:run_key poll/load endpoint, head legs parallelized 4-way (results[i] by index, order-stable), UI onRunSuite 202+poll (~6min) + loadLatestRunForSuite adopts the suite's latest completed run on load/generate (the dashes screenshot cured). Tests: +1 UI poll adoption; okf-server 877/877; dialog 49/49. Defect log §v. NOTE: §v's final persist claimed 'REPLACES the placeholder' but shipped .save() — corrected by 1-8g-w.
  1-8g-w-run-persist-replace: done # [DONE 2026-10-11] EVERY async run died at the final save: beginRunSuite saved a placeholder {_key, status:'running'} and runSuite's persist .save()'d the same _key (INSERT) → 'unique constraint violated' AFTER ~60s of work — Indonesia Suite 1 ×2 (r1791696163542-cb5f41, r1791696474473-b06d04; 154 probes each) destroyed; jest missed it (the sync path mints its own key). Fix: replace when opts.runKey handed in (sync keeps save); persist failure → RUN_PERSIST_FAILED; created_at = MINT time end-to-end; failDoc never leaks the driver's numeric 409 code; RUN_IN_FLIGHT/GENERATION_IN_FLIGHT carry err.details run_key/suite_key (client can adopt — UI = 1-8g-x); boot sweep sweepInterruptedRuns() marks post-restart running orphans RUN_INTERRUPTED + getRunSuite lazy-reaps no-lock running docs (polls terminate); placeholder-save failure cleans the lock (no restart-lock); deleteSuite refuses mid-run; listRuns projects status/error; head-suite.run_started log. Tests: +8 lifecycle (76 file / 885 suite), eslint+prettier clean. Defect log §w.
