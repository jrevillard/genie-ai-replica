emailVerificationSubject=Verify your email - GENIE.AI
emailVerificationBody=Someone has created a {2} account with this email address. If this was you, click the link below to verify your email address\n\n{0}\n\nThis link will expire within {3}.\n\nIf you didn''t create this account, just ignore this message.
emailVerificationBodyHtml=<p>Someone has created a {2} account with this email address. If this was you, click the link below to verify your email address</p><p><a href="{0}" class="button">Verify email</a></p><p>This link will expire within {3}.</p><p>If you didn''t create this account, just ignore this message.</p>
