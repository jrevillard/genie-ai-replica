# =============================================================================
# GENIE.AI — OpenTelemetry Collector Configuration
# =============================================================================
# Receives OTLP traces from instrumented services (backend, chatqna, retriever,
# dataprep, reranker) and exports metrics to VictoriaMetrics.
# Receives container logs via Docker fluentd logging driver and forwards to
# VictoriaLogs.
# Exports traces to VictoriaTraces for distributed trace storage and query.
#
# Receivers:
#   - OTLP HTTP (port 4318): standard OTLP/HTTP from SDK auto-instrumentation
#   - prometheus/collector_self (port 8888): scrapes Collector's own self-telemetry metrics
#   - prometheus/victoriametrics_internal (port 8428): scrapes VictoriaMetrics internal metrics
#   - prometheus/victoriatraces_internal (port 10428): scrapes VictoriaTraces internal metrics
#   - fluent_forward (port 24224): receives logs from Docker fluentd logging driver
#
# Exporters:
#   - prometheusremotewrite (port 8428): exports OTel metrics to VictoriaMetrics
#   - otlp_http/victoriatraces (port 10428): exports traces to VictoriaTraces via OTLP HTTP
#   - otlp_http (port 9428): exports logs to VictoriaLogs via OTLP HTTP
#
# Extensions:
#   - health_check (port 13133): Docker healthcheck endpoint
#   - file_storage (persistent queue for trace export resilience)
#
# Pipeline:
#   metrics: otlp → batch → prometheusremotewrite
#   traces:  otlp → probabilistic_sampler → transform/kong_span_names → batch → victoriatraces
#   logs:    otlp / fluent_forward → resource/stamp_service_name_from_container → transform/stamp_log_metadata_from_msg → transform/normalize_log_body → batch → otlp_http
#
# Note: Docker services use the fluentd logging driver (driver: fluentd)
# configured in docker-compose.yaml. Docker sends container stdout/stderr to
# the collector's fluent_forward receiver on port 24224. Dual logging (Docker
# 20.10+) keeps `docker logs` functional alongside the fluentd driver.
#
# Logs pipeline runs the resource processor BEFORE batch so the
# `service.name` is set on every record before it reaches the exporter.
# The OTel `resource` attribute `service.name` is what VictoriaLogs
# indexes as a stream field (and what Grafana filters on). Without this
# step, fluentd-sourced logs land in VL with no OTel resource and no
# `service.name` — the admin/logs endpoint cannot filter them.
#
# Note: Docker services use the fluentd logging driver (driver: fluentd)
# configured in docker-compose.yaml. Docker sends container stdout/stderr to
# the collector's fluent_forward receiver on port 24224. Dual logging (Docker
# 20.10+) keeps `docker logs` functional alongside the fluentd driver.
# =============================================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/victoriatraces:
    directory: /var/lib/otelcol/file_storage/victoriatraces
    timeout: 10s

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  fluent_forward:
    endpoint: 0.0.0.0:24224

  # Scrape OTel Collector's own self-telemetry metrics (otelcol_*).
  # Requires service.telemetry.metrics.address to be set (see service section).
  prometheus/collector_self:
    config:
      scrape_configs:
        - job_name: "otel-collector"
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

  # Scrape VictoriaMetrics internal metrics (vm_*).
  # VM exposes a Prometheus-compatible /metrics endpoint.
  prometheus/victoriametrics_internal:
    config:
      scrape_configs:
        - job_name: "victoriametrics"
          scrape_interval: 15s
          static_configs:
            - targets: ["victoriametrics:8428"]
          metrics_path: "/metrics"

  # Scrape VictoriaTraces internal metrics (vt_*).
  # Used by alert rules for trace pipeline health monitoring.
  prometheus/victoriatraces_internal:
    config:
      scrape_configs:
        - job_name: "victoriatraces"
          scrape_interval: 15s
          static_configs:
            - targets: ["victoriatraces:10428"]
          metrics_path: "/metrics"

  # Scrape VictoriaLogs internal metrics.
  prometheus/victorialogs_internal:
    config:
      scrape_configs:
        - job_name: "victorialogs"
          scrape_interval: 15s
          static_configs:
            - targets: ["victorialogs:9428"]
          metrics_path: "/metrics"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048
  probabilistic_sampler:
    sampling_percentage: ${OTEL_TRACES_SAMPLER_RATE}
  # Rename Kong spans from hardcoded "kong" to "METHOD /path" using attributes.
  # Kong hardcodes span name as "kong" (instrumentation.lua:252) but sets
  # http.method and http.route attributes — use those for descriptive names.
  transform/kong_span_names:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(name, Concat([attributes["http.method"], " ", attributes["http.route"]], "")) where resource.attributes["service.name"] == "kong-gateway" and attributes["http.method"] != nil and attributes["http.route"] != nil and attributes["http.route"] != ""
          - set(name, Concat([attributes["http.method"], " ", ExtractPatterns(attributes["http.url"], "https?://[^/]+(/[^?]*)")[0]], "")) where resource.attributes["service.name"] == "kong-gateway" and attributes["http.method"] != nil and name == "kong"
  # Stamp `service.name` resource attribute from the Docker Compose
  # service label forwarded by the fluentd driver. Compose auto-labels
  # every container with `com.docker.compose.service=<service-block-name>`
  # (and the `&fluent-logging` anchor in docker-compose.yaml forwards
  # that label via the `labels:` driver option). The transform reads
  # the label and stamps the canonical service-name onto every record
  # — matching the Compose service block name in docker-compose.yaml so
  # downstream `service.name` filters match the same identifier operators
  # see in `docker compose ps`.
  #
  # Idempotent: only sets the attribute when it is currently empty
  # (records that already carry a service.name — from the OTel SDK
  # `otlp` receiver on backend / document-repository — keep their
  # resource intact). The OTel SDK path produces the same value via
  # `OTEL_SERVICE_NAME` (defaults aligned with the Compose block name
  # in docker-compose.yaml), so both ingestion paths land on the same
  # identifier and the admin panel sees one row per container.
  #
  # Records without a forwarded label (e.g. the Collector itself, which
  # has no fluentd driver) are left untouched — they end up with empty
  # `service.name` in VL, which is the existing pre-fix behaviour.
  transform/stamp_service_name_from_container:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # Prefer the forwarded Compose service label (set by the
          # fluentd driver's `labels:` option in `&fluent-logging`).
          - set(resource.attributes["service.name"], attributes["com.docker.compose.service"]) where attributes["com.docker.compose.service"] != nil and attributes["com.docker.compose.service"] != "" and (resource.attributes["service.name"] == nil or resource.attributes["service.name"] == "")
          # Fallback: parse from fluent.tag when the Compose label was not
          # forwarded (older Compose v1.x, custom one-shots, Swarm nodes
          # without the fluentd logging driver's `labels:` option). The
          # label path above is preferred — Compose auto-forwards
          # `com.docker.compose.service`, so these regexes only fire on
          # edge cases.
          #
          # Known limitation: stack-prefixed single-host tags
          # (e.g. `admin-logs-prd-<svc>-1`) cannot be reliably parsed
          # without knowing the project name — `logs-prd-<svc>` and
          # `<svc>` are both valid prefix/svc splits. The label path
          # above is the canonical source for these (Compose forwards
          # `com.docker.compose.service` regardless of the project
          # name); this regex chain is only defence-in-depth for label
          # loss. Operators running a non-default project name should
          # verify the label path covers their stack (it does in any
          # recent Compose v2.x — `&fluent-logging` forwards
          # `com.docker.compose.service` for every project name).
          #
          # Each `set` is guarded by `where` AND by `ExtractPatterns`
          # returning a non-empty capture group — error_mode: ignore on
          # the transform swallows the silent NO MATCH from the wrong
          # format. Statements run in order; the first one that fires
          # sets service.name and the rest short-circuit on the guard.
          - set(resource.attributes["service.name"], ExtractPatterns(attributes["fluent.tag"], "^[a-z0-9_]+_(?P<svc>[a-z0-9]+(?:-[a-z0-9]+)*)\\.\\d+\\.[a-z0-9_-]+$")["svc"]) where attributes["fluent.tag"] != nil and attributes["com.docker.compose.service"] == nil and (resource.attributes["service.name"] == nil or resource.attributes["service.name"] == "")
          - set(resource.attributes["service.name"], ExtractPatterns(attributes["fluent.tag"], "^[a-z0-9-]+?-(?P<svc>[a-z0-9]+(?:-[a-z0-9]+)*)-\\d+$")["svc"]) where attributes["fluent.tag"] != nil and attributes["com.docker.compose.service"] == nil and (resource.attributes["service.name"] == nil or resource.attributes["service.name"] == "")

  # Stamp `severity_text` from the `_msg` payload when the record
  # arrived via the fluentd driver (NOT through the OTel SDK's
  # LoggingHandler, which already sets severity_text at source).
  #
  # Two payload shapes show up in VL under the fluentd path:
  #   1. Winston JSON (Node.js services): `{"level":"info","message":"...",...}`
  #   2. Uvicorn access log (Python services): `INFO: 127.0.0.1:... "GET ..."`
  # The regex below matches BOTH formats via alternation. The captured
  # group is the canonical uppercase form (INFO/WARN/ERROR/DEBUG/FATAL/TRACE)
  # so the admin panel + Grafana dashboards can filter by it directly
  # without re-parsing the JSON envelope client-side.
  #
  # Idempotent: only writes when severity_text is unset or `Unspecified`
  # (the OTel SDK default for fluentd-sourced rows), so records that
  # already carry a proper severity — from the OTel SDK `otlp` receiver —
  # keep their original value.
  #
  # Also extracts the `service` field from the Winston JSON envelope
  # (when present) and stamps `service.name` ONLY if the resource
  # doesn't already have it from the Compose label / fluent.tag path
  # above. This makes the service identifier consistent between the
  # OTel LoggingHandler path (`genie-*`) and the Winston path
  # (`genie-backend`, `genie-document-repository`, …) by preferring
  # whatever the application's own log record declared.
  transform/stamp_log_metadata_from_msg:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # Stamp `severity_text` for fluentd-sourced logs that don't go
          # through an OTel SDK LoggingHandler (which sets severity_text
          # at source). Two payload shapes reach the collector as `body`:
          #
          #   1. Node.js Winston JSON string: `{"level":"info","message":"..."}`
          #      body is a STRING whose first char is `{`. Use ParseJSON to
          #      read the `level` key directly (RE2 + YAML escaping made
          #      regex on the envelope fragile — see commit history).
          #   2. Python uvicorn access log: `INFO: 127.0.0.1:... "GET ..."`
          #      body is a STRING that starts with the uppercase level word
          #      followed by `:` or ` `. Use ExtractPatterns + ToUpperCase.
          #   3. Winston JSON envelope already parsed into a MAP (when the
          #      LogRecord was decoded by the receiver — `body.level` is
          #      the lowercase level). Direct map access.
          #
          # The matched level is always uppercased to canonical OTel form
          # (INFO/WARN/ERROR/DEBUG/FATAL/TRACE) so the admin panel and
          # Grafana dashboards filter consistently without re-parsing.
          #
          # Idempotent: Path 1/2/3 are guarded by IsString/IsMap + Substring
          # so each fires only on its matching payload shape; ExtractPatterns
          # returns an empty map when body doesn't match → `["sev"]` errors
          # silently (error_mode: ignore).
          - 'set(severity_text, ToUpperCase(ParseJSON(body)["level"])) where IsString(body) and Substring(body, 0, 1) == "{"'
          - 'set(severity_text, ToUpperCase(ExtractPatterns(body, "(?i)^(?P<sev>info|warn|warning|error|debug|fatal|trace)[: ]")["sev"])) where IsString(body)'
          - 'set(severity_text, ToUpperCase(body["level"])) where IsMap(body) and IsString(body["level"])'
          # Normalise Winston JSON envelopes: replace `body` with the inner
          # `.message` field so VictoriaLogs `_msg` carries the human-readable
          # log line instead of the JSON envelope. Without this transform the
          # admin /logs search filter `_msg:"DB"` matches every URL fragment
          # containing the search term (the access-log middleware writes the
          # full URL including the query string into its `HTTP_REQUEST:` log
          # line — so searching for `term=DB` finds its OWN prior request
          # rows, drowning out the actual `[DB_CONNECTION]` rows).
          #
          # Cardinality: the inner message becomes the indexed VL field
          # `_msg`, which is full-text searchable but NOT indexed as a
          # stream field — so unbounded message distinctness does NOT
          # blow up the VL stream index the way an indexed `log.message`
          # stream field would. The other envelope fields (`level`,
          # `service`, `trace_id`, `span_id`, ...) are already routed
          # to OTel LogRecord attributes / resource attributes by the
          # SDK + the transforms above, so the envelope structure is
          # preserved for downstream tools that want to inspect it via
          # OTel collector debug exporters / span correlation.
          #
          # Idempotent: only fires when the envelope actually parses
          # AND has a string `.message` field. Plain-text bodies
          # (uvicorn access logs, container startup banners) pass
          # through untouched — `set(body, ...)` would either no-op
          # (when ParseJSON fails) or set body to nil (when the
          # envelope parses but lacks `.message`); the IsString guard
          # filters both cases out.
          - 'set(body, ParseJSON(body)["message"]) where IsString(body) and Substring(body, 0, 1) == "{" and IsString(ParseJSON(body)["message"])'
          - 'set(body, body["message"]) where IsMap(body) and IsString(body["message"])'
          # Stamp `severity_number` alongside `severity_text` — VL's OTLP
          # exporter maps severity_number → severity_text at export time, so
          # leaving severity_number at 0 (the fluentd default) causes VL to
          # overwrite the stamped severity_text back to "Unspecified".
          # Canonical OTel severity numbers (OTel logs data-model spec):
          # TRACE=1, DEBUG=5, INFO=9, WARN=13, ERROR=17, FATAL=21.
          - 'set(severity_number, 9) where severity_text == "INFO"'
          - 'set(severity_number, 13) where severity_text == "WARN"'
          - 'set(severity_number, 17) where severity_text == "ERROR"'
          - 'set(severity_number, 5) where severity_text == "DEBUG"'
          - 'set(severity_number, 21) where severity_text == "FATAL"'
          - 'set(severity_number, 1) where severity_text == "TRACE"'
          # Note: `service.name` is NOT stamped from the Winston JSON
          # envelope's `service` field here. The Compose label
          # transform (`stamp_service_name_from_container`) is the
          # single canonical source — stamping from both produced
  # Normalise the `body` field to a human-readable message and
  # extract structured `http.*` attributes from plain-text access
  # logs (morgan on Node, uvicorn on Python OPEA).
  #
  # Runs AFTER `stamp_log_metadata_from_msg` so severity_text +
  # severity_number are already stamped (the rewrite would otherwise
  # lose the level prefix that the prior transform parsed). Runs
  # AFTER `stamp_service_name_from_container` so the rows are
  # correctly grouped by service before body normalisation.
  #
  # Idempotent: every rule is guarded by an exact-substring check on
  # the body prefix. Rows that don't match ANY of the patterns pass
  # through untouched (tag-prefixed logs, startup banners, Go
  # internal logs from VictoriaMetrics/Logs, etc. — all already
  # human-readable). If the upstream format string changes (morgan
  # version bump, uvicorn config switch) the rule simply no-ops and
  # the row lands in VL with the legacy format — no data loss.
  #
  # NOTE: this collector's RE2 regex parser does NOT accept \?
  # as a literal-question-mark escape (only [?] works in a char
  # class). All morgan status/path patterns below use [?] for the
  # query-string separator instead of \?.
  transform/normalize_log_body:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # ===== Morgan HTTP access logs (Node services) =====
          # body = "HTTP_REQUEST: METHOD PATH[?QUERY] STATUS TIME ms - Headers: CT UA"
          - 'set(severity_text, "INFO") where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - 'set(severity_number, 9) where severity_text == "INFO" and severity_number == 0'
          - 'set(attributes["http.method"], ExtractPatterns(body, "^HTTP_REQUEST: (?P<m>[A-Z]+) ")["m"])
             where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - 'set(attributes["http.path"], ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ (?P<p>[^ ?]+)")["p"])
             where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - 'set(attributes["http.status_code"], ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? (?P<s>[0-9]+) ")["s"])
             where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - 'set(attributes["http.response_time_ms"], ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? [0-9]+ (?P<ms>[0-9.]+) ms")["ms"])
             where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - 'set(attributes["http.user_agent"], ExtractPatterns(body, "Headers:[ ](?:-|[^ ]+)[ ](?P<ua>.+)$")["ua"])
             where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - 'set(body, Concat([
               ExtractPatterns(body, "^HTTP_REQUEST: (?P<m>[A-Z]+) ")["m"], " ",
               ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ (?P<p>[^ ?]+)")["p"], " ",
               ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? (?P<s>[0-9]+) ")["s"], " ",
               ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? [0-9]+ (?P<ms>[0-9.]+) ms")["ms"], " ms"
             ], ""))
             where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'

          # ===== Uvicorn HTTP access logs (Python OPEA services) =====
          # body = 'INFO:     IP:PORT - "METHOD PATH[?QUERY] HTTP/x.x" STATUS [MSG]'
          # `INFO:` prefix is already handled by `stamp_log_metadata_from_msg`.
          # Inner double-quote in regex needs \" escaping so OTTL string
          # parser doesn't terminate early.
          - 'set(attributes["http.client_ip"], ExtractPatterns(body, "(?P<ip>[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+):[0-9]+")["ip"])
             where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
          - 'set(attributes["http.method"], ExtractPatterns(body, "\"(?P<m>[A-Z]+) (?P<p>[^ ?\"]+)")["m"])
             where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
          - 'set(attributes["http.path"], ExtractPatterns(body, "\"(?P<m>[A-Z]+) (?P<p>[^ ?\"]+)")["p"])
             where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
          - 'set(attributes["http.status_code"], ExtractPatterns(body, "\" (?P<s>[0-9]{3}) ")["s"])
             where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
          - 'set(body, Concat([
               ExtractPatterns(body, "\"(?P<m>[A-Z]+) ")["m"], " ",
               ExtractPatterns(body, "\"(?P<m>[A-Z]+) (?P<p>[^ ?\"]+)")["p"], " ",
               ExtractPatterns(body, "\" (?P<s>[0-9]{3}) ")["s"]
             ], ""))
             where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'

          # ===== Kong / db migrations / keycloak-config =====
          # body = "[2026-09-16 10:44:41] MESSAGE"
          # Strip the bracketed ISO timestamp prefix — VL already indexes
          # `_time`, the prefix is redundant. Idempotent: only fires
          # when the body matches the `[TIMESTAMP] ` shape, otherwise
          # pass-through (other `[tag] msg` formats like `[DB_CONNECTION]`
          # are intentionally NOT touched — those prefixes are part of
          # the human-readable message).
          - 'set(body, ExtractPatterns(body, "^\\[[^]]+\\][ ](?P<m>.+)$")["m"])
             where IsString(body) and IsMatch(body, "^\\[[0-9]{4}-[0-9]{2}-[0-9]{2}[ ][0-9]{2}:[0-9]{2}:[0-9]{2}\\][ ]")'


exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    timeout: 15s
  otlp_http/victoriatraces:
    endpoint: http://victoriatraces:10428/insert/opentelemetry
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
      storage: file_storage/victoriatraces
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    timeout: 15s
  otlp_http:
    endpoint: http://victorialogs:9428/insert/opentelemetry
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  extensions:
    - health_check
    - file_storage/victoriatraces
  pipelines:
    metrics:
      receivers:
        - otlp
        - prometheus/collector_self
        - prometheus/victoriametrics_internal
        - prometheus/victoriatraces_internal
        - prometheus/victorialogs_internal
      processors:
        - batch
      exporters:
        - prometheusremotewrite
    traces:
      receivers:
        - otlp
      processors:
        - probabilistic_sampler
        - transform/kong_span_names
        - batch
      exporters:
        - otlp_http/victoriatraces
    logs:
      receivers:
        - otlp
        - fluent_forward
      processors:
        - transform/stamp_service_name_from_container
        - transform/stamp_log_metadata_from_msg
        - transform/normalize_log_body
        - batch
      exporters:
        - otlp_http
