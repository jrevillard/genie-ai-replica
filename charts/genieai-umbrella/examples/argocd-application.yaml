# IMPORTANT: do NOT render — apply manually.
# This file is a literal ArgoCD Application manifest, NOT a Helm template.
# Apply with:
#   kubectl apply -f argocd-application.yaml -n argocd
# Pre-conditions:
#   - ArgoCD installed in the `argocd` namespace
#   - an AppProject named `genieai` exists (spec.project below), e.g.
#     `kubectl apply -f` an AppProject manifest granting the repo + destinations
#   - the target cluster is the current kubectl context
#
# LIMITATION (destructive prune): ArgoCD applies rendered manifests directly
# and never executes Helm lifecycle hooks — including any pre-delete
# confirmation gate the chart may define. An ArgoCD prune deletes the
# Namespace and every PVC inside it with no gate. Destructive-sync protection
# for GitOps-delivered instances must come from an ArgoCD-native mechanism
# (finalizers, preSync hooks, or disabling automated prune on this
# Application); the Helm-hook gate only protects plain `helm uninstall`.
#
# For el-salvador (or other high-customization envs), change:
#   * targetRevision: main  ->  release/<env>
#   * path: deploy/environments/dev/  ->  deploy/environments/<env>/
#   * namespace: genieai  ->  genieai-<env>
#
# The per-env path (deploy/environments/<env>/) hosts the Kustomize overlay
# that composes the umbrella chart with that env's values-override.yaml.
---
# - repoURL uses the scp-like SSH form since GitLab requires auth; the ssh://
#   form needs an explicit numeric port (ssh://git@host:22/un/...) — the
#   `:un` segment of the naive URL parses as a port and breaks.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genieai-dev
  namespace: argocd
spec:
  project: genieai
  source:
    repoURL: git@opensource.unicc.org:un/itu/genie-ai.git
    targetRevision: main    # use release/el-salvador for the el-salvador env
    path: deploy/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: genieai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
