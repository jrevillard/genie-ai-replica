  dataprep-arango-service:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [opea]
    depends_on:
      arango-vector-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/dataprep/Dockerfile-dataprep_genie-ai
    image: ${GENIE_AI_DATAPREP_ARANGO_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-dataprep-arango}:${GENIE_AI_DATAPREP_ARANGO_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    # Internal only
    # ports:
    #   - "5000:5000"
    environment:
      DATAPREP_COMPONENT_NAME: GENIE_DATAPREP_ARANGODB
      # Empty by default: the served model id is DISCOVERED per ingestion job.
      # Services start immediately. Branches while vLLM is still loading:
      # - unpinned, never-probed service: the job FAILS LOUDLY and is rolled
      #   back ("Ingestion Error") — the exception is a stale cached id from
      #   an earlier successful probe, which then degrades instead;
      # - pinned: the job survives on degraded file-level labels, and graph
      #   extraction fails silently — the document stores NO retrievable
      #   chunks ("Ingested with Warnings"). Neither outcome is re-computed
      #   later. Wait for vLLM health before bulk ingesting.
      VLLM_MODEL_ID: ${VLLM_LLM_MODEL_ID:-}
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://vllm:8000}
      # Two names, two consumers, and they are NOT the same knob.
      #
      # MODEL_LLM_TIMEOUT_SECONDS is the budget this repo's own vLLM clients
      # degrade under: every call behind it falls back (batch -> per-chunk ->
      # file labels), so bounding it costs quality, not work, and 180 s is the
      # deliberate default. No client in THIS image reads it yet -- dataprep's
      # SDK client is still unbounded and is the one gap left open.
      # MODEL_LLM_MAX_RETRIES below is unread here for the same reason.
      MODEL_LLM_TIMEOUT_SECONDS: ${MODEL_LLM_TIMEOUT_SECONDS:-180}
      MODEL_LLM_MAX_RETRIES: ${MODEL_LLM_MAX_RETRIES:-2}
      # The service-account token fetch every control-plane write depends on.
      # Single attempt, no retry: 300 s is what aiohttp applied anyway.
      MODEL_AUTH_TIMEOUT_SECONDS: ${MODEL_AUTH_TIMEOUT_SECONDS:-300}
      MODEL_CONNECT_TIMEOUT_SECONDS: ${MODEL_CONNECT_TIMEOUT_SECONDS:-30}
      # The model-id probe behind the TTL cache. 10 s suits a warm endpoint —
      # a vLLM still loading weights answers in minutes, and jobs running in
      # that window fail their LLM step loudly (labeling falls back to
      # file-level labels; there is no configured-id fallback anymore).
      MODEL_PROBE_TIMEOUT_SECONDS: ${MODEL_PROBE_TIMEOUT_SECONDS:-10}
      MODEL_DETECT_TTL: ${MODEL_DETECT_TTL:-60}
      #
      # VLLM_TIMEOUT is deliberately NOT injected here, even though the vendored
      # comps reads it: OpeaArangoDataprep builds its LLMGraphTransformer with
      # ChatOpenAI(timeout=VLLM_TIMEOUT). Injecting it would break that client.
      # comps takes the value straight from os.getenv, so it arrives as the
      # STRING "600"; httpx 0.28 no longer coerces a string timeout, and the
      # request dies with TypeError: 'str' object cannot be interpreted as an
      # integer instead of timing out. _process_batch swallows that, so every
      # batch would fail extraction and the document would still report
      # "Ingested" with an empty knowledge graph.
      #
      # So the graph phase keeps comps' own int 600 s default - what it ran at
      # before this policy, and the right value for a phase with no degradation
      # path. Binding it differently needs a patch to the vendored source,
      # tracked in genie-ai-overlay/OVERRIDES.yaml, not a compose line.
      TEI_EMBEDDING_ENDPOINT: ${EMBEDDING_SERVICE_URL:-http://tei:80}
      GUARDRAIL_URL: http://guardrail:9090/v1/guardrails
      ARANGO_URL: http://arango-vector-db:8529
      ARANGO_DB: ${ARANGO_DB:-genie-ai}
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME:-GRAPH}
      ARANGO_USERNAME: ${ARANGO_USERNAME:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD}
      # IVF lists probed per vector query — sets `defaultNProbe` on the
      # `vector_index` this service maintains (recreated on drift at the next
      # ingest). Default 1 = the legacy langchain-arangodb behavior. Only
      # read by the ANN query path: with the default
      # RETRIEVER_ARANGO_USE_APPROX_SEARCH=false, exact search ignores it —
      # raising this without approx search costs a full index rebuild for a
      # no-op.
      RETRIEVER_ARANGO_NPROBE: ${RETRIEVER_ARANGO_NPROBE:-1}
      DOCUMENT_REPOSITORY_URL: http://document-repository:3001
      BACKEND_SERVICE_URL: http://backend:3000
      # Story 4.8-amend: content-only chunking — OKF concept completion callbacks
      # (dataprep → okf-server internal endpoint) instead of doc-repo. Empty
      # default = fail-closed; the okf-server controller refuses every callback
      # without a matching shared secret, so the .env / deployment MUST set both
      # ends to the same value.
      OKF_SERVER_URL: http://okf-server:3002
      OKF_INTERNAL_SECRET: ${OKF_INTERNAL_SECRET:-}
      KEYCLOAK_URL: https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      # Split-URL OIDC (local builds): when the public KEYCLOAK_URL is
      # unreachable from the container (Docker Desktop WSL2), set
      # KEYCLOAK_INTERNAL_URL (e.g. http://keycloak:8080) to mint the
      # service-account token internally. Empty default — cloud/Swarm use
      # KEYCLOAK_URL unchanged (same pattern as chatqna's validator).
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-}
      KC_REALM: ${KEYCLOAK_REALM:-genie}
      KC_DATAPREP_CLIENT_ID: ${KC_DATAPREP_CLIENT_ID:-dataprep-service-client}
      KC_DATAPREP_CLIENT_SECRET: ${KC_DATAPREP_CLIENT_SECRET:-}
      LABELING_STRATEGY: ${LABELING_STRATEGY:-llm}
      EMBEDDING_LABEL_THRESHOLD: ${EMBEDDING_LABEL_THRESHOLD:-0.75}
      BM25_LABEL_THRESHOLD: ${BM25_LABEL_THRESHOLD:-2.00}
      CONTENT_EXTRACTION_METHOD: ${CONTENT_EXTRACTION_METHOD:-docling}
      DATAPREP_MAX_CONCURRENT_BATCHES: ${DATAPREP_MAX_CONCURRENT_BATCHES:-20}
      # PARALLEL INGEST (David, 2026-09-03): concurrent ingest slots per
      # dataprep container (flock slot pool; 429 only when all busy). Default
      # 1 = the historical single-flight. Pair with okf-server's
      # OKF_INGEST_CONCURRENCY drain lanes.
      DATAPREP_INGEST_CONCURRENCY: ${DATAPREP_INGEST_CONCURRENCY:-1}
      # STUCK-INGEST RECOVERY: the boot-time release of rows left 'Ingesting'
      # by a previous crash. A doc-repo unreachable longer than
      # attempts × seconds skips the recovery until the NEXT dataprep
      # restart — raise the window when doc-repo boots slower than that.
      # 0 attempts = recovery DISABLED (rows stay stuck until the next
      # restart with a fresh setting).
      DATAPREP_RECOVERY_MAX_ATTEMPTS: ${DATAPREP_RECOVERY_MAX_ATTEMPTS:-30}
      DATAPREP_RECOVERY_RETRY_SECONDS: ${DATAPREP_RECOVERY_RETRY_SECONDS:-10}
      # REMOTE-LLM RESILIENCE (David, 2026-09-09): the remote vLLM gateway
      # throws transient 502/503/504 storms — dataprep absorbs them with a
      # per-call retry ladder + shared storm cool-down + one failed-batch
      # retry round. Defaults live in code; override in .env when needed.
      OKF_LLM_RETRY_ATTEMPTS: ${OKF_LLM_RETRY_ATTEMPTS:-5}
      OKF_LLM_RETRY_BASE_MS: ${OKF_LLM_RETRY_BASE_MS:-2000}
      OKF_LLM_RETRY_MAX_MS: ${OKF_LLM_RETRY_MAX_MS:-90000}
      OKF_LLM_STORM_COOLDOWN_S: ${OKF_LLM_STORM_COOLDOWN_S:-20}
      OKF_LLM_STORM_COOLDOWN_MAX_S: ${OKF_LLM_STORM_COOLDOWN_MAX_S:-120}
      OKF_LLM_ROUND2_DELAY_S: ${OKF_LLM_ROUND2_DELAY_S:-45}
      DATAPREP_LLM_LABEL_BATCH_SIZE: ${DATAPREP_LLM_LABEL_BATCH_SIZE:-4}
      DOCLING_DEVICE: ${DOCLING_DEVICE:-cuda}
      DOCLING_ENDPOINT: ${DOCLING_ENDPOINT:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      DATAPREP_CHUNK_SIZE_PDF: ${DATAPREP_CHUNK_SIZE_PDF:-500}
      DATAPREP_CHUNK_SIZE_DOCX: ${DATAPREP_CHUNK_SIZE_DOCX:-1000}
      DATAPREP_CHUNK_SIZE_XLSX: ${DATAPREP_CHUNK_SIZE_XLSX:-1500}
      DATAPREP_CHUNK_SIZE_PPTX: ${DATAPREP_CHUNK_SIZE_PPTX:-500}
      DATAPREP_CHUNK_SIZE_HTML: ${DATAPREP_CHUNK_SIZE_HTML:-500}
      DATAPREP_CHUNK_SIZE_TXT: ${DATAPREP_CHUNK_SIZE_TXT:-500}
      DATAPREP_CHUNK_SIZE_MD: ${DATAPREP_CHUNK_SIZE_MD:-500}
      DATAPREP_CHUNK_OVERLAP: ${DATAPREP_CHUNK_OVERLAP:-50}
      LABEL_SELECTOR_SYSTEM_PROMPT: ${LABEL_SELECTOR_SYSTEM_PROMPT:-}
      CONTEXTUAL_RETRIEVAL_ENABLED: ${CONTEXTUAL_RETRIEVAL_ENABLED:-true}
      DATAPREP_CONTEXTUAL_MODEL: ${DATAPREP_CONTEXTUAL_MODEL:-}
      # 0 = derive from the serving model's window, discovered at runtime from
      # VLLM_ENDPOINT (see genieai_dataprep_arangodb.py). The old literal
      # default of 6000 was sized for the T4 profile's 2048-token window and
      # applied to every deployment, including the default 65536-token one
      # where it used ~4% of the available window.
      DATAPREP_CONTEXTUAL_DOC_BUDGET: ${DATAPREP_CONTEXTUAL_DOC_BUDGET:-0}
      # 0 = discover the served window at runtime. >0 = the deployer states
      # the window the endpoint serves — the only lever on a strict
      # OpenAI-compatible provider (its /v1/models carries no max_model_len).
      DATAPREP_MAX_MODEL_LEN: ${DATAPREP_MAX_MODEL_LEN:-0}
      DATAPREP_CONTEXTUAL_DOC_BUDGET_DOC_LEVEL: ${DATAPREP_CONTEXTUAL_DOC_BUDGET_DOC_LEVEL:-100000}
      DATAPREP_CONTEXTUAL_MAX_TOKENS: ${DATAPREP_CONTEXTUAL_MAX_TOKENS:-512}
      CONTEXTUAL_RETRIEVAL_PROMPT: ${CONTEXTUAL_RETRIEVAL_PROMPT:-}
      # Log level threshold for the OTel Python LoggingHandler installed in
      # setup_logging(). Mirror LOG_LEVEL above (Node side via logger.js).
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONTEXTUAL_STRATEGY: ${CONTEXTUAL_STRATEGY:-per_chunk}
      CONTEXTUAL_LABEL_RAW: ${CONTEXTUAL_LABEL_RAW:-true}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OPEA_SSL_SKIP_VERIFY: ${OPEA_SSL_SKIP_VERIFY:-0}
      # Required by OPEA arangodb _initialize_embeddings() to use remote TEI
      # endpoint instead of downloading a local model (default: BAAI/bge-large-en-v1.5).
      # Without this, TEI_EMBEDDING_ENDPOINT is set but HUGGINGFACEHUB_API_TOKEN
      # is None, so the code falls through to the local model branch.
      HUGGINGFACEHUB_API_TOKEN: ${VLLM_API_KEY:-}

      KEYCLOAK_SSL_SKIP_VERIFY: ${KEYCLOAK_SSL_SKIP_VERIFY:-0}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # Remaining shared model-endpoint budgets (core/model_http_policy.py).
      # The LLM timeout and retry budget are set at the top of this block,
      # where the two-name split is explained.
      MODEL_CONTROL_PLANE_TIMEOUT_SECONDS: ${MODEL_CONTROL_PLANE_TIMEOUT_SECONDS:-30}
      DATAPREP_LLM_PHASE_TIMEOUT_SECONDS: ${DATAPREP_LLM_PHASE_TIMEOUT_SECONDS:-900}
      DATAPREP_LLM_PROGRESS_INTERVAL_SECONDS: ${DATAPREP_LLM_PROGRESS_INTERVAL_SECONDS:-60}
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  retriever-arango-service:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [opea]
    depends_on:
      arango-vector-db:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/retriever/Dockerfile-retriever_genie-ai
    image: ${GENIE_AI_RETRIEVER_ARANGO_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-retriever-arango}:${GENIE_AI_RETRIEVER_ARANGO_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    # Internal only
    # ports:
    #   - "7025:7025"
    environment:
      # ArangoDB connection
      ARANGO_URL: http://arango-vector-db:8529
      ARANGO_DB: ${ARANGO_DB:-genie-ai}
      ARANGO_USERNAME: ${ARANGO_USERNAME:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD}
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME:-GRAPH}
      # Vector search tuning
      RETRIEVER_COMPONENT_NAME: GENIE_RETRIEVER_ARANGODB
      # Retriever query params — INERT in production: chatqna forwards each of
      # these (k, fetch_k, score_threshold, lambda_mult, search_start, traversal_*)
      # in the HTTP request body, so this env block is only reached on direct
      # retriever API calls that bypass chatqna (debugging/probes). Keep defaults
      # identical to the chatqna block to avoid silent drift. The label-filter
      # strategy is not one of them: no request field carries it, so the retriever
      # reads it from this block.
      RETRIEVER_ARANGO_K: ${RETRIEVER_ARANGO_K:-20}
      RETRIEVER_ARANGO_FETCH_K: ${RETRIEVER_ARANGO_FETCH_K:-30}
      RETRIEVER_ARANGO_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_SCORE_THRESHOLD:-0.2}
      RETRIEVER_ARANGO_DISTANCE_THRESHOLD: ${RETRIEVER_ARANGO_DISTANCE_THRESHOLD:-1}
      RETRIEVER_ARANGO_LAMBDA_MULT: ${RETRIEVER_ARANGO_LAMBDA_MULT:-0.5}
      # Fan-out spine knobs (ADR-039 option-d): defaults mirror retriever/config.py —
      # opt-in via RETRIEVER_FANOUT_ENABLED, legacy byte-identical when disabled.
      RETRIEVER_FANOUT_ENABLED: ${RETRIEVER_FANOUT_ENABLED:-true}
      RETRIEVER_FANOUT_MAX_GRAPHS: ${RETRIEVER_FANOUT_MAX_GRAPHS:-5}
      RETRIEVER_FANOUT_PER_GRAPH_TIMEOUT_MS: ${RETRIEVER_FANOUT_PER_GRAPH_TIMEOUT_MS:-8000}
      RETRIEVER_FANOUT_CANDIDATE_CAP_PER_GRAPH: ${RETRIEVER_FANOUT_CANDIDATE_CAP_PER_GRAPH:-50}
      RETRIEVER_FANOUT_CANDIDATE_CAP_GLOBAL: ${RETRIEVER_FANOUT_CANDIDATE_CAP_GLOBAL:-200}
      RETRIEVER_FANOUT_SPINE_MAX_HOPS: ${RETRIEVER_FANOUT_SPINE_MAX_HOPS:-2}
      RETRIEVER_FANOUT_EXTRACTED_HOP_CAP: ${RETRIEVER_FANOUT_EXTRACTED_HOP_CAP:-1}
      # Query-affinity routing knobs (ADR-039): defaults mirror retriever/config.py.
      RETRIEVER_ROUTE_ENABLED: ${RETRIEVER_ROUTE_ENABLED:-true}
      RETRIEVER_ROUTE_TOP_K: ${RETRIEVER_ROUTE_TOP_K:-40}
      RETRIEVER_ROUTE_MIN_CHUNKS: ${RETRIEVER_ROUTE_MIN_CHUNKS:-3}
      RETRIEVER_ROUTE_PROBE_TIMEOUT_MS: ${RETRIEVER_ROUTE_PROBE_TIMEOUT_MS:-2000}
      RETRIEVER_ROUTE_RETRY: ${RETRIEVER_ROUTE_RETRY:-1}
      RETRIEVER_ARANGO_SEARCH_START: ${RETRIEVER_ARANGO_SEARCH_START:-chunk}
      RETRIEVER_ARANGO_SEARCH_MODE: ${RETRIEVER_ARANGO_SEARCH_MODE:-vector}
      RETRIEVER_ARANGO_USE_APPROX_SEARCH: ${RETRIEVER_ARANGO_USE_APPROX_SEARCH:-false}
      # Log level threshold for the OTel Python LoggingHandler installed in
      # setup_logging(). Mirror LOG_LEVEL above (Node side via logger.js).
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RETRIEVER_ARANGO_DISTANCE_STRATEGY: ${RETRIEVER_ARANGO_DISTANCE_STRATEGY:-COSINE}
      RETRIEVER_ARANGO_NUM_CENTROIDS: ${RETRIEVER_ARANGO_NUM_CENTROIDS:-1}
      RETRIEVER_HYBRID_RETRIEVAL_ENABLED: ${RETRIEVER_HYBRID_RETRIEVAL_ENABLED:-true}
      RETRIEVER_HYBRID_RRF_K: ${RETRIEVER_HYBRID_RRF_K:-60}
      RETRIEVER_HYBRID_BM25_CANDIDATES: ${RETRIEVER_HYBRID_BM25_CANDIDATES:-50}
      RETRIEVER_HYBRID_DENSE_WEIGHT: ${RETRIEVER_HYBRID_DENSE_WEIGHT:-1.0}
      RETRIEVER_HYBRID_LEXICAL_WEIGHT: ${RETRIEVER_HYBRID_LEXICAL_WEIGHT:-1.0}
      RETRIEVER_HYBRID_BM25_ANALYZER: ${RETRIEVER_HYBRID_BM25_ANALYZER:-text_en}
      RETRIEVER_ARANGO_FILTER_STRATEGY: ${RETRIEVER_ARANGO_FILTER_STRATEGY:-OR}
      # Reranker strategy — "adaptive" makes the retriever fetch chunk embeddings
      # for the adaptive reranker (keep aligned with chatqna's RERANKING_STRATEGY).
      RERANKING_STRATEGY: ${RERANKING_STRATEGY:-slice}
      RETRIEVER_SUMMARIZER_ENABLED: ${RETRIEVER_SUMMARIZER_ENABLED:-false}
      # Story 1-8 routing head — OKF graph affinity + the forbidden/noise gate
      # (read only by the retriever's graph routing; knob semantics + calibration
      # in genie-ai-overlay/retriever/config.py; rollback: WEIGHT=0.0).
      RETRIEVER_ROUTE_HEAD_WEIGHT: ${RETRIEVER_ROUTE_HEAD_WEIGHT:-1.0}
      RETRIEVER_ROUTE_HEAD_MARGIN: ${RETRIEVER_ROUTE_HEAD_MARGIN:-0.01}
      RETRIEVER_ROUTE_HEAD_FLOOR: ${RETRIEVER_ROUTE_HEAD_FLOOR:-0.55}
      RETRIEVER_ROUTE_FORBIDDEN_TAG_MAX: ${RETRIEVER_ROUTE_FORBIDDEN_TAG_MAX:-0.55}
      RETRIEVER_ROUTE_HEADS_SUPERSEDE: ${RETRIEVER_ROUTE_HEADS_SUPERSEDE:-true}
      # Graph traversal
      RETRIEVER_ARANGO_TRAVERSAL_ENABLED: ${RETRIEVER_ARANGO_TRAVERSAL_ENABLED:-true}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH:-2}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED:-5}
      RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD:-0.7}
      RETRIEVER_ARANGO_TRAVERSAL_CONCURRENT_BATCHES: ${RETRIEVER_ARANGO_TRAVERSAL_CONCURRENT_BATCHES:-10}
      # 1-8g-l — traversal bounds: skip the graph traversal above this many
      # <GRAPH>_LINKS_TO edges (the fused vector results stand alone) and cap
      # per-hop edge visits inside the AQL. Live: Indonesia History (1.05M
      # edges) starved every chat answer inside the 8s leg budget.
      RETRIEVER_ARANGO_TRAVERSAL_MAX_LINKS: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_LINKS:-300000}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_EDGES_PER_NODE: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_EDGES_PER_NODE:-2000}
      # AI services endpoints
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://vllm:8000}
      # Empty by default: the summarizer's model id is DISCOVERED per call.
      # With RETRIEVER_SUMMARIZER_ENABLED=false (the shipped default) the
      # service starts immediately with summarization disabled. Set
      # VLLM_LLM_MODEL_ID to pin a name and skip discovery.
      VLLM_MODEL_ID: ${VLLM_LLM_MODEL_ID:-}
      TEI_EMBEDDING_ENDPOINT: ${EMBEDDING_SERVICE_URL:-http://tei:80}
      HF_TOKEN: ${VLLM_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OPEA_SSL_SKIP_VERIFY: ${OPEA_SSL_SKIP_VERIFY:-0}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

      # Shared model-endpoint HTTP budgets (core/model_http_policy.py).
      # Only the shared name is injected here. VLLM_TIMEOUT is the retriever's
      # historical alias for the same budget (config.py resolves one to the
      # other), so injecting both would put two names for one value in
      # `docker exec ... env` and let an operator edit the one this service
      # never reads. The vendored comps client that reads VLLM_TIMEOUT
      # directly is the dataprep graph transformer, which does not run in this
      # image.
      MODEL_LLM_TIMEOUT_SECONDS: ${MODEL_LLM_TIMEOUT_SECONDS:-180}
      MODEL_PROBE_TIMEOUT_SECONDS: ${MODEL_PROBE_TIMEOUT_SECONDS:-10}
      MODEL_DETECT_TTL: ${MODEL_DETECT_TTL:-60}
      MODEL_LLM_MAX_RETRIES: ${MODEL_LLM_MAX_RETRIES:-2}
      MODEL_EMBEDDING_TIMEOUT_SECONDS: ${MODEL_EMBEDDING_TIMEOUT_SECONDS:-600}
      # 600 is a NEW ceiling, not the openai default kept — langchain-openai
      # forwards request_timeout (default None), so this client was unbounded.
      # Not tightened the way the LLM budgets are: the summarizer has no
      # fallback path, so its timeout becomes a 500 on the chat request.
      # MODEL_LLM_TIMEOUT_SECONDS above reaches only the API-key probe, which
      # needs OPENAI_API_KEY — a variable this service is not given, so on
      # every shipped topology that line is parsed and then unused here.
      MODEL_SUMMARIZER_TIMEOUT_SECONDS: ${MODEL_SUMMARIZER_TIMEOUT_SECONDS:-600}
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  chatqna-xeon-backend-server:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [opea]
    depends_on:
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
    image: ${GENIE_AI_CHATQNA_SERVER_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-chatqna-server}:${GENIE_AI_CHATQNA_SERVER_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    working_dir: /app/ChatQnA
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${OPEA_PORT}:${OPEA_PORT}"
    environment:
      CHATQNA_TYPE: ${CHATQNA_TYPE:-ChatQnA}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # Control-plane budget for the backend / document-repository calls on the
      # chat path (core/model_http_policy.py).
      MODEL_CONTROL_PLANE_TIMEOUT_SECONDS: ${MODEL_CONTROL_PLANE_TIMEOUT_SECONDS:-30}
      MODEL_CONNECT_TIMEOUT_SECONDS: ${MODEL_CONNECT_TIMEOUT_SECONDS:-30}
      # The model-id probe behind the TTL cache, shared with the retriever and
      # dataprep (same knob, same 10 s; the failure consequences differ — see
      # their blocks). Here, with no pinned name, a probe failure propagates:
      # the request fails closed (503) until the endpoint answers.
      MODEL_PROBE_TIMEOUT_SECONDS: ${MODEL_PROBE_TIMEOUT_SECONDS:-10}
      MODEL_DETECT_TTL: ${MODEL_DETECT_TTL:-60}
      MEGA_SERVICE_HOST_IP: chatqna-xeon-backend-server
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMBEDDING_SERVER_HOST_IP: embedding
      EMBEDDING_SERVER_PORT: 6000
      EMBEDDING_SERVER_ENDPOINT: ${EMBEDDING_SERVER_ENDPOINT:-/v1/embeddings}
      RETRIEVER_SERVICE_HOST_IP: retriever-arango-service
      RETRIEVER_SERVICE_PORT: 7000
      RERANK_SERVER_HOST_IP: reranker
      RERANK_SERVER_PORT: 8000
      # chatqna reads these and forwards them in the reranker request; they must live
      # on chatqna (the orchestrator), not only on the reranker service.
      RERANKING_STRATEGY: ${RERANKING_STRATEGY:-slice}
      RERANKING_THRESHOLD: ${RERANKING_THRESHOLD:-0.75}
      RERANKER_TOP_N: ${RERANKER_TOP_N:-3}
      # Retriever query params (forwarded to retriever via the HTTP request body).
      # chatqna is the AUTHORITATIVE source — in production it always sends these,
      # so the retriever service's own RETRIEVER_ARANGO_* env vars are inert for
      # them (OPEA-vendored fallback, only reached on direct retriever API calls
      # that bypass chatqna). The label-filter strategy is the exception: chatqna
      # sends no strategy, so the retriever reads it from its own environment,
      # and it exists in the retriever block only. Defaults of the forwarded
      # params are intentionally kept identical in both blocks to avoid silent
      # drift; tune here and the retriever block tracks them.
      RETRIEVER_ARANGO_K: ${RETRIEVER_ARANGO_K:-20}
      RETRIEVER_ARANGO_FETCH_K: ${RETRIEVER_ARANGO_FETCH_K:-30}
      RETRIEVER_ARANGO_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_SCORE_THRESHOLD:-0.2}
      RETRIEVER_ARANGO_DISTANCE_THRESHOLD: ${RETRIEVER_ARANGO_DISTANCE_THRESHOLD:-1}
      RETRIEVER_ARANGO_LAMBDA_MULT: ${RETRIEVER_ARANGO_LAMBDA_MULT:-0.5}
      RETRIEVER_ARANGO_SEARCH_START: ${RETRIEVER_ARANGO_SEARCH_START:-chunk}
      RETRIEVER_ARANGO_TRAVERSAL_ENABLED: ${RETRIEVER_ARANGO_TRAVERSAL_ENABLED:-true}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH:-2}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED:-5}
      RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD:-0.7}
      LLM_SERVER_HOST_IP: vllm
      LLM_SERVER_PORT: 8000
      VLLM_LLM_ENDPOINT: ${VLLM_ENDPOINT:-}
      VLLM_TRANSLATION_ENDPOINT: ${VLLM_TRANSLATION_ENDPOINT:-}
      # Escape hatch for endpoints whose /v1/models is unreachable while
      # generation works (ACL'd proxies): empty by default, so discovery
      # stays the source of truth; a pinned name bypasses the probe.
      VLLM_MODEL_ID: ${VLLM_LLM_MODEL_ID:-}
      GUARDRAIL_SERVICE_HOST_IP: guardrail
      GUARDRAIL_SERVICE_PORT: 9090
      TRANSLATION_SERVICE_HOST_IP: vllm-translation-guardrail
      TRANSLATION_SERVICE_PORT: 9031
      DOC_REPO_URL: http://document-repository:3001
      BACKEND_SERVICE_URL: http://backend:3000
      KEYCLOAK_URL: https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      # Split-URL OIDC (local builds): internal Keycloak for the JWKS fetch when
      # the public URL is unreachable from the container. Empty default — cloud
      # uses KEYCLOAK_URL unchanged.
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-}
      KC_REALM: ${KEYCLOAK_REALM:-genie}
      KC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-genie-app}
      CHATQNA_SYSTEM_PROMPT: ${CHATQNA_SYSTEM_PROMPT:-}
      CHATQNA_ENFORCE_ABSTENTION: ${CHATQNA_ENFORCE_ABSTENTION:-true}
      # Context-window discovery: the two semantic knobs MUST default to EMPTY
      # here — a non-empty compose default would count as a deployer-set value
      # and silently override discovery (see the env template section for
      # MAX_MODEL_LEN_TEXTGEN).
      MAX_MODEL_LEN_TEXTGEN: ${MAX_MODEL_LEN_TEXTGEN:-}
      MAX_TRANSLATION_CHARS: ${MAX_TRANSLATION_CHARS:-}
      # Confidence scoring — rank-weighted aggregate of calibrated reranker scores.
      CONFIDENCE_RANK_DECAY: ${CONFIDENCE_RANK_DECAY:-0.5}
      RERANKER_SCORE_CALIBRATION: ${RERANKER_SCORE_CALIBRATION:-none}
      RERANKER_SCORE_TEMPERATURE: ${RERANKER_SCORE_TEMPERATURE:-1.0}
      # Opt-in LLM self-grade (off by default; surface only after eval calibration).
      LLM_SELF_CONFIDENCE_ENABLED: ${LLM_SELF_CONFIDENCE_ENABLED:-0}
      OPENAI_API_KEY: ${VLLM_API_KEY:-}
      # Multi-turn vector-space blending (issue #833). Default OFF (no-op).
      MULTI_TURN_BLEND_ENABLED: ${MULTI_TURN_BLEND_ENABLED:-false}
      MULTI_TURN_BLEND_ALPHA: ${MULTI_TURN_BLEND_ALPHA:-0.7}
      MULTI_TURN_HISTORY_TURNS: ${MULTI_TURN_HISTORY_TURNS:-1}
      MULTI_TURN_MODE: ${MULTI_TURN_MODE:-blend}
      MULTI_TURN_CONDENSE_HISTORY_TURNS: ${MULTI_TURN_CONDENSE_HISTORY_TURNS:-8}
      MULTI_TURN_CONDENSE_MAX_TOKENS: ${MULTI_TURN_CONDENSE_MAX_TOKENS:-256}
      MULTI_TURN_CONDENSE_TIMEOUT_SECONDS: ${MULTI_TURN_CONDENSE_TIMEOUT_SECONDS:-5.0}
      MULTI_TURN_CONDENSE_SYSTEM_PROMPT: ${MULTI_TURN_CONDENSE_SYSTEM_PROMPT:-}
      OPEA_SSL_SKIP_VERIFY: ${OPEA_SSL_SKIP_VERIFY:-0}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  # OPEA UI/Nginx - disabled by default via profiles: [opea] (compose up) / replicas: 0 (Swarm).
  # Activate for OPEA debugging: compose up --profile opea / Swarm: change replicas to 1.
  chatqna-xeon-ui-server:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [opea]
    restart: "no"
    image: opea/chatqna-ui:1.5
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${FRONTEND_SERVICE_PORT}:${FRONTEND_SERVICE_PORT}"
    environment:
      UPLOAD_FILE_BASE_URL: http://dataprep-arango-service:5000/v1/dataprep/ingest
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/5173' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  chatqna-xeon-nginx-server:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [opea]
    restart: "no"
    image: opea/nginx:1.5
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${NGINX_PORT}:${NGINX_PORT}"
    environment:
      FRONTEND_SERVICE_IP: chatqna-xeon-ui-server
      FRONTEND_SERVICE_PORT: 5173
      BACKEND_SERVICE_NAME: chatqna-xeon-backend-server
      BACKEND_SERVICE_IP: chatqna-xeon-backend-server
      BACKEND_SERVICE_PORT: 8888
      DATAPREP_SERVICE_IP: dataprep-arango-service
      DATAPREP_SERVICE_PORT: 5000
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/80' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  # PostgreSQL initialization (creates dedicated databases and users for each service)
  postgres-init:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    build: configs/postgres/
    image: ${GENIE_AI_POSTGRES_INIT_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-postgres-init}:${GENIE_AI_POSTGRES_INIT_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-genieai}
      - PGDATABASE=${PGDATABASE:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KONG_DB_PASSWORD=${KONG_DB_PASSWORD}
      - KEYCLOAK_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    entrypoint: ["sh", "/init-databases.sh"]
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Keycloak Identity Provider
  keycloak:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    image: quay.io/keycloak/keycloak:26.7.0
    # The upstream image ships an empty CMD (kc.sh prints its usage and exits
    # without a subcommand). The dropped custom image baked `start` via its
    # Dockerfile; restore that explicit startup for both compose and swarm.
    command: ["start"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=${KC_DB:-postgres}
      # Health and metrics endpoints on the management port 9000
      # (/health, /health/ready, /health/live, /metrics). Upstream Keycloak
      # defaults both to false; they were enabled by the removed
      # configs/keycloak/Dockerfile, so set them here to keep the behavior.
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_DB_URL=${KC_DB_URL:-jdbc:postgresql://postgres:5432/keycloak}
      - KC_DB_USERNAME=${KC_DB_USERNAME:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      # Keycloak behind reverse proxy with /auth path prefix (docs option 1).
      # Partially dynamic URLs: simple hostname (no scheme/port/path),
      # proxy-headers: xforwarded, Kong sends X-Forwarded-Prefix: /auth
      # via request-transformer plugin → Keycloak resolves context-path dynamically.
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=${NGINX_PUBLIC_DOMAIN:-localhost}
      # Enable HTTP — NGINX handles TLS termination, Keycloak only needs HTTP internally
      - KC_HTTP_ENABLED=true
      # SMTP (reuses EMAIL_* from Section 2)
      # EMAIL_SECURE maps to implicit SSL (port 465); STARTTLS is always enabled separately
      # If EMAIL_HOST is empty, SMTP is effectively disabled (Keycloak logs warnings but functions without email)
      - KC_SMTP_HOST=${EMAIL_HOST:-}
      - KC_SMTP_PORT=${EMAIL_PORT:-587}
      - KC_SMTP_SSL=${EMAIL_SECURE:-false}
      # AUTH derived from EMAIL_USER: enabled when user is set, disabled otherwise
      - KC_SMTP_AUTH=${EMAIL_USER:+true}
      # STARTTLS=true for default port 587; ignored when KC_SMTP_SSL=true (port 465)
      - KC_SMTP_STARTTLS=true
      - KC_SMTP_USER=${EMAIL_USER:-}
      - KC_SMTP_PASSWORD=${EMAIL_PASSWORD:-}
      - KC_SMTP_FROM=${EMAIL_FROM:-}
    volumes:
      # Mount the WHOLE themes directory, not a single theme: deployments may
      # ship several themes (e.g. genie + genie-el-salvador) next to each other,
      # and a theme may declare `parent=genie`, which only resolves when both
      # directory names exist under /opt/keycloak/themes. Mounting one theme
      # under a fixed name would make such a theme inherit from itself and
      # wedge Keycloak's theme resolver. Built-in themes (keycloak, keycloak.v2,
      # ...) live inside jars, not in this directory, so the mount cannot
      # shadow them. The active theme is selected by KEYCLOAK_THEME (realm
      # import) or the realm's loginTheme/accountTheme/... settings.
      - ${CONFIG_DIR_KEYCLOAK:-./configs/keycloak/themes}:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # Keycloak realm configuration via keycloak-config-cli (runs once after Keycloak is healthy)
  keycloak-config:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    build:
      context: configs/keycloak/
      dockerfile: Dockerfile.config-cli
    image: ${GENIE_AI_KEYCLOAK_CONFIG_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-keycloak-config}:${GENIE_AI_KEYCLOAK_CONFIG_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - IMPORT_FILES=/config/genie-realm.yaml
      - IMPORT_VARSUBSTITUTION_ENABLED=true
      - IMPORT_CACHE_ENABLED=true
      # Variables referenced in genie-realm.yaml via $(env:VAR) substitution
      - KC_REALM=${KEYCLOAK_REALM:-genie}
      - KC_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
      - GENIE_ADMIN_USERNAME=${GENIE_ADMIN_USERNAME:-genie-admin}
      - GENIE_ADMIN_PASSWORD=${GENIE_ADMIN_PASSWORD}
      - GENIE_ADMIN_EMAIL=${GENIE_ADMIN_EMAIL}
      - KC_PROXY_CLIENT_SECRET=${KEYCLOAK_PROXY_CLIENT_SECRET}
      - KC_DATAPREP_CLIENT_SECRET=${KC_DATAPREP_CLIENT_SECRET}
      - KC_OKF_SERVER_CLIENT_SECRET=${KC_OKF_SERVER_CLIENT_SECRET:-}
      - KC_GRAFANA_CLIENT_ID=${KC_GRAFANA_CLIENT_ID:-grafana}
      - KC_GRAFANA_CLIENT_SECRET=${KC_GRAFANA_CLIENT_SECRET}
      - KC_MOBILE_CLIENT_ID=${KC_MOBILE_CLIENT_ID}
      - KC_MOBILE_REDIRECT_SCHEME=${KC_MOBILE_REDIRECT_SCHEME}
      - KC_PUBLIC_ORIGIN=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}
      # Realm properties (registration, email, security, localization, tokens)
      - KEYCLOAK_REGISTRATION_ENABLED=${KEYCLOAK_REGISTRATION_ENABLED:-true}
      - KEYCLOAK_VERIFY_EMAIL=${KEYCLOAK_VERIFY_EMAIL:-true}
      - KEYCLOAK_RESET_PASSWORD=${KEYCLOAK_RESET_PASSWORD:-true}
      - KEYCLOAK_LOGIN_WITH_EMAIL=${KEYCLOAK_LOGIN_WITH_EMAIL:-true}
      - KEYCLOAK_DUPLICATE_EMAILS=${KEYCLOAK_DUPLICATE_EMAILS:-false}
      - KEYCLOAK_BRUTE_FORCE=${KEYCLOAK_BRUTE_FORCE:-true}
      - KEYCLOAK_PASSWORD_POLICY=${KEYCLOAK_PASSWORD_POLICY:-length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)}
      # The theme the realms are pointed at. Its default must stay the theme
      # the config_bootstrap role protects (keycloak_theme in
      # group_vars/all.yml): the role refuses to mirror a branch that does
      # not ship it.
      - KEYCLOAK_THEME=${KEYCLOAK_THEME:-genie}
      - KEYCLOAK_I18N_ENABLED=${KEYCLOAK_I18N_ENABLED:-true}
      - KEYCLOAK_LOCALE=${KEYCLOAK_LOCALE:-en}
      - KEYCLOAK_SUPPORTED_LOCALES=${KEYCLOAK_SUPPORTED_LOCALES:-["ar","de","en","es","fr","pt","ru","th","zh-Hans"]}
      - KEYCLOAK_ACCESS_TOKEN_LIFESPAN=${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:-300}
      # SMTP (reuses EMAIL_* — required because realm smtpServer overrides server-level KC_SMTP_*)
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_SMTP_AUTH=${EMAIL_USER:+true}
      - EMAIL_SMTP_STARTTLS=true
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/config-done"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10

  # ===========================================================================
  # Observability Stack (node.labels.genieai == true)
  # ===========================================================================
  # Split into an always-on substrate and an opt-in bucket:
  #   no profile       otel-collector-init + otel-collector + victorialogs
  #                    → always-on, admin endpoints stay functional regardless
  #                      of ENABLE_OBSERVABILITY (compose up brings them by
  #                      default; Swarm runs them via deploy.replicas / mode)
  #   [observability]  victoriametrics + victoriatraces + tempo-proxy + grafana
  #                    → optional, gated by ENABLE_OBSERVABILITY in Swarm;
  #                      require --profile observability in compose
  # ===========================================================================

  # One-shot init container: sets otel-queue volume ownership for the nonroot
  # Collector process (UID 10001). Runs before otel-collector in compose mode.
  # In Swarm mode, depends_on is removed by Ansible — the Collector's
  # restart policy handles the race condition until init completes.
  otel-collector-init:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    # Exception: cap_add CHOWN — the init's only job is chown 10001 on /var/lib/otelcol;
    # cap_drop ALL strips CAP_CHOWN, so we add it back scoped to this one-shot init.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    image: busybox:1.38.0
    command: ["sh", "-c", "mkdir -p /var/lib/otelcol/file_storage/victoriatraces && chown -R 10001:10001 /var/lib/otelcol"]
    volumes:
      - otel-queue:/var/lib/otelcol
    networks:
      - genieai_network
    deploy:
      # Global mode: runs once on every Swarm node (matches otel-collector's
      # global placement) to set volume permissions before Collector starts.
      # In compose mode, depends_on ensures ordering instead.
      mode: global
      restart_policy:
        condition: none

  otel-collector:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.152.0
    # Expose fluentforward receiver on localhost so the Docker daemon can
    # send container logs via the fluentd logging driver. Binding to
    # 127.0.0.1 prevents external access (no unauthenticated log injection).
    # Use mode: host so Docker daemon's fluentd driver connects directly to the
    # collector container. Mode: ingress (Swarm routing mesh) breaks fluentd's
    # persistent TCP connections — IPVS terminates and re-opens them, causing
    # CLOSE-WAIT states and data loss.
    ports:
      - target: 24224
        published: 24224
        protocol: tcp
        mode: host
        host_ip: 127.0.0.1
    # Distroless image — no shell/wget for Docker healthcheck.
    # Rely on restart policy + health_check extension (port 13133) for programmatic probes.
    environment:
      - OTEL_TRACES_SAMPLER_RATE=${OTEL_TRACES_SAMPLER_RATE:-100.0}
      # Mirror backend + doc-repo escape hatch on the writer half so a
      # staging-VL override applies to the OTel collector too. The
      # collector does not split `VICTORIALOGS_TENANT_ID` (format
      # `account:project`) for the AccountID/ProjectID HTTP headers —
      # pre-split values are sourced from the .env file (Compose
      # `${VAR%%:*}` syntax is not supported, bash variable expansion
      # happens at .env load time). Operators setting
      # `VICTORIALOGS_TENANT_ID=42:7` MUST also set the matching
      # `VICTORIALOGS_TENANT_ID_ACCOUNT_ID=42` and
      # `VICTORIALOGS_TENANT_ID_PROJECT_ID=7` vars; otherwise writes go
      # to the default 0:0 tenant while backend reads use 42:7.
      - VICTORIALOGS_URL=${VICTORIALOGS_URL:-http://victorialogs:9428}
      - VICTORIALOGS_URL_HOST=${VICTORIALOGS_URL_HOST:-victorialogs}
      - VICTORIALOGS_TENANT_ID_ACCOUNT_ID=${VICTORIALOGS_TENANT_ID_ACCOUNT_ID:-0}
      - VICTORIALOGS_TENANT_ID_PROJECT_ID=${VICTORIALOGS_TENANT_ID_PROJECT_ID:-0}
    volumes:
      - ./configs/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-queue:/var/lib/otelcol
    depends_on:
      otel-collector-init:
        condition: service_completed_successfully
    networks:
      - genieai_network
    deploy:
      # Global mode: one collector per Swarm node. No placement constraint —
      # must run on ALL node types (gateway, genieai, gpu) to collect logs
      # from every service via the fluentd logging driver (localhost:24224).
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  victoriametrics:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    image: victoriametrics/victoria-metrics:v1.138.0
    command:
      - "--storageDataPath=/var/lib/victoria-metrics"
      - "--retentionPeriod=${VICTORIAMETRICS_RETENTION:-30d}"
      - "--httpListenAddr=:8428"
    volumes:
      - vm-data:/var/lib/victoria-metrics
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  victorialogs:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    restart: unless-stopped
    image: victoriametrics/victoria-logs:v1.50.0
    command:
      - "--storageDataPath=/var/lib/victoria-logs"
      - "--retentionPeriod=${VICTORIALOGS_RETENTION:-30d}"
      - "--httpListenAddr=:9428"
    volumes:
      - vlogs-data:/var/lib/victoria-logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9428/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - genieai_network
    deploy:
      # Always-on core: pinned to 1 replica so admin endpoints stay functional regardless of ENABLE_OBSERVABILITY.
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  victoriatraces:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    image: victoriametrics/victoria-traces:v0.9.2
    command:
      - "--storageDataPath=/var/lib/victoria-traces"
      - "--retentionPeriod=${VICTORIATRACES_RETENTION:-30d}"
      - "--httpListenAddr=:10428"
    volumes:
      - vtraces-data:/var/lib/victoria-traces
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:10428/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  tempo-proxy:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    build:
      context: ./tools/tempo-proxy
      dockerfile: Dockerfile
    image: ${GENIE_AI_TEMPO_PROXY_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-tempo-proxy}:${GENIE_AI_TEMPO_PROXY_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - VICTORIATRACES_URL=http://victoriatraces:10428
      - PORT=10429
    depends_on:
      victoriatraces:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10429/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
  grafana:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    image: grafana/grafana:12.4
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
      victoriatraces:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_CSRF_TRUSTED_ORIGINS=https://${NGINX_PUBLIC_DOMAIN:-localhost}:${NGINX_HTTPS_PORT:-443}
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SERVER_HTTP_PORT=3000
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/service-health.json
      - GF_PLUGINS_PREINSTALL_SYNC=victoriametrics-logs-datasource
      - GF_SERVER_ROOT_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${KC_GRAFANA_CLIENT_ID:-grafana}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${KC_GRAFANA_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email roles
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'
      # Auth URL: browser redirect (external, through nginx/Kong)
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth/realms/${KEYCLOAK_REALM:-genie}/protocol/openid-connect/auth
      # Token/API URLs: Grafana backend calls (internal Docker network, bypasses nginx)
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/realms/${KEYCLOAK_REALM:-genie}/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak:8080/realms/${KEYCLOAK_REALM:-genie}/protocol/openid-connect/userinfo
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    # Grafana is now accessible only via Kong route (/grafana/).
    # For local debugging, uncomment the port mapping below:
    # ports:
    #   - "${GRAFANA_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

networks:
  genieai_network:
    attachable: true
