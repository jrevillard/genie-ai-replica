---
# Populates the host directories that docker-compose bind-mounts for runtime
# theme assets. A bind mount never falls back to the image contents: an empty
# or missing host directory shadows everything under the mount point, so the
# assets must actually be copied onto every node that runs the stack.
#
# Defaults are fetched from GitLab at repo_branch rather than from playbook_dir.
# The playbook never clones the repo onto the node, and the documented workflow
# runs it from a local checkout that may sit on a different branch than the one
# being deployed — seeding from the local checkout would write the wrong theme
# assets, and the mirror below would then push that mistake to every host.

- name: Ensure rsync is available on the target
  become_user: root
  ansible.builtin.package:
    name: rsync
    state: present
  when: config_bootstrap_sync_enabled | bool

# diffutils provides the diff the verification below runs. The role
# installs its own tools rather than assuming the host has them: a
# minimal or air-gapped node is exactly where a missing binary turns a
# deploy into "diff: command not found".
- name: Ensure diffutils is available on the target
  become_user: root
  ansible.builtin.package:
    name: diffutils
    state: present
  when: config_bootstrap_sync_enabled | bool

# Root is needed to create {{ config_dir }} itself on a host that does not have
# it yet (the play runs on `all`, including GPU nodes), mirroring the deploy
# play's "Ensure deploy directory exists" task for the same tree. The
# directories stay root-owned, consistent with the rest of the playbook: the
# rsync below runs under the play's become, so it writes into them as root.
- name: Ensure runtime config directories exist
  become_user: root
  ansible.builtin.file:
    path: "{{ config_dir }}/{{ item.dest_subdir }}"
    state: directory
    mode: "0755"
  loop: "{{ config_bootstrap_pairs }}"
  loop_control:
    label: "{{ item.dest_subdir }}"

# Same endpoint shape the Grafana provisioning download uses in deploy.yml:
# a whole-directory archive at the pinned branch, with --strip-components=1
# to drop the archive's top-level <branch>-<sha>-<short>/ prefix. The archive
# preserves the full repo-relative path, so item.src is still present as a
# subdirectory of the extraction root.
- name: Download theme config archive at {{ repo_branch }}
  ansible.builtin.get_url:
    url: "{{ repo_url | regex_replace('\\.git$', '') }}/-/archive/{{ repo_branch }}/genieai-config.tar.gz?path={{ item.src }}"
    dest: "{{ config_bootstrap_tmp_root }}-{{ repo_branch | replace('/', '-') }}-{{ item.dest_subdir | replace('/', '-') }}.tar.gz"
    force: true
    mode: '0644'
  loop: "{{ config_bootstrap_pairs }}"
  loop_control:
    label: "{{ item.src }}"
  when: config_bootstrap_sync_enabled | bool

# The scratch tree is rebuilt from the archive on every run, so it must
# start empty. A run that aborted between extraction and cleanup left
# its leftovers behind, and the next run of a DIFFERENT branch extracted
# into that dirty tree: files the new branch no longer ships stayed
# there, were copied to the host, and the verification below then
# compared the host against the same contaminated tree and passed.
- name: Remove the extraction scratch directory before extracting
  become_user: root
  ansible.builtin.file:
    path: "{{ config_bootstrap_tmp_root }}"
    state: absent

# unarchive requires its dest to exist; a fresh host (or a changed dest_subdir)
# has neither the scratch root nor the per-pair extraction directory.
- name: Create the scratch extraction directory for each pair
  become_user: root
  ansible.builtin.file:
    path: "{{ config_bootstrap_tmp_root }}/{{ item.dest_subdir | replace('/', '-') }}"
    state: directory
    mode: "0755"
  loop: "{{ config_bootstrap_pairs }}"
  loop_control:
    label: "{{ item.dest_subdir }}"
  when: config_bootstrap_sync_enabled | bool

- name: Extract theme config archive at {{ repo_branch }}
  ansible.builtin.unarchive:
    src: "{{ config_bootstrap_tmp_root }}-{{ repo_branch | replace('/', '-') }}-{{ item.dest_subdir | replace('/', '-') }}.tar.gz"
    dest: "{{ config_bootstrap_tmp_root }}/{{ item.dest_subdir | replace('/', '-') }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
  loop: "{{ config_bootstrap_pairs }}"
  loop_control:
    label: "{{ item.src }}"
  when: config_bootstrap_sync_enabled | bool

# Guard: a wrong branch, a truncated download or a changed archive layout must
# fail the deploy here, before anything is synced into the mount source. Checking
# one well-known entrypoint asset per pair catches both an empty extraction and a
# silently reshaped tree.
- name: Stat the expected asset in each extracted archive
  ansible.builtin.stat:
    path: "{{ config_bootstrap_tmp_root }}/{{ item.dest_subdir | replace('/', '-') }}/{{ item.src }}/{{ item.expect }}"
  loop: "{{ config_bootstrap_pairs }}"
  loop_control:
    label: "{{ item.expect }}"
  register: config_bootstrap_extract_check
  when: config_bootstrap_sync_enabled | bool

- name: Fail when an extracted archive is missing its expected asset
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      config_bootstrap: the archive for {{ item.item.dest_subdir }} does not contain
      {{ item.item.src }}/{{ item.item.expect }}. Check that repo_branch
      ({{ repo_branch }}) really ships those assets before deploying.
    success_msg: "config_bootstrap: {{ item.item.expect }} found for {{ item.item.dest_subdir }}"
  loop: "{{ config_bootstrap_extract_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item.expect | default('unknown') }}"
  when:
    - config_bootstrap_sync_enabled | bool
    - not ansible_check_mode | default(false) | bool

# The host copy is a MIRROR of the branch: rsync --archive --delete
# overwrites the files the branch changed and removes the ones it no
# longer ships. Preserving whatever sat on the host (--ignore-existing)
# let the runtime config drift away from the branch it is validated
# against: a stale genie-ai-config.json kept the schema it was written
# with, while the frontend validates the served file against the schema
# the branch ships — the app then refuses to mount, and the symptom is a
# white page in production behind a deploy that reported success. The
# branch is the single source of truth for the runtime config; anything
# an operator wants changed belongs in the repository, in the flavour's
# config file, not on the host.
#
# --checksum: rsync's default quick check compares size and mtime, so a
# file whose bytes changed but whose size and mtime did not would be
# skipped and stay stale on the host. Comparing content is the only
# check that matches the claim this task makes.
#
# The trailing slash on src is load-bearing twice over: without it rsync
# copies the source directory *by name* (an extra level under dest) and,
# with --delete in play, removes everything else in dest — the whole
# host config tree. The slash is what keeps --delete scoped to the
# config tree.
#
# The task name is unchanged from the --ignore-existing era on purpose:
# it is the addressing key for `ansible-playbook --start-at-task`, and
# renaming it breaks any runbook that resumes the play at it. The
# semantics it names have changed; the comment above is the contract.
#
# ansible.posix.synchronize is deliberately NOT used here: it runs rsync on the
# Ansible controller and treats src as a controller-local path, while these
# archives were downloaded and extracted on the target host. Plain rsync under
# the play's become runs on the target, where the data actually is, and writes
# into the root-owned config_dir without any --rsync-path sudo games.
- name: Rsync branch defaults to host runtime config dir (preserve manual edits)
  ansible.builtin.command:
    argv:
      - rsync
      - --archive
      - --checksum
      - --delete
      - --out-format=%i
      - "{{ config_bootstrap_tmp_root }}/{{ item.dest_subdir | replace('/', '-') }}/{{ item.src }}/"
      - "{{ config_dir }}/{{ item.dest_subdir }}/"
  register: config_bootstrap_rsync
  changed_when: config_bootstrap_rsync.stdout | trim | length > 0
  loop: "{{ config_bootstrap_pairs }}"
  loop_control:
    label: "{{ item.dest_subdir }}"
  when: config_bootstrap_sync_enabled | bool

# The mirror is the claim; this is the proof. A host that still serves a
# file the branch does not ship — or one whose content differs — must
# fail the deploy here, not in the browser. diff -r compares content, so
# a stale file and a hand-edited one are both caught.
#
# What this does NOT prove: that the shipped file passes the frontend's
# own schema validation. That is a property of the file's content, and
# it is checked where the content is written — a test asserts every
# runtime config satisfies the schema it declares, and the app renders a
# configuration error screen when one does not.
- name: Diff the host runtime config against the branch copy
  ansible.builtin.command:
    argv:
      - diff
      - -r
      - -q
      - "{{ config_bootstrap_tmp_root }}/{{ item.dest_subdir | replace('/', '-') }}/{{ item.src }}/"
      - "{{ config_dir }}/{{ item.dest_subdir }}/"
  register: config_bootstrap_diff
  changed_when: false
  # rc 1 = the trees differ; rc 2 = diff could not read one of them. Both
  # fail the deploy, but the message says which.
  failed_when: false
  loop: "{{ config_bootstrap_pairs }}"
  loop_control:
    label: "{{ item.dest_subdir }}"
  when:
    - config_bootstrap_sync_enabled | bool
    - not ansible_check_mode | default(false) | bool

- name: Fail when the host runtime config does not match the branch
  ansible.builtin.assert:
    that:
      - item.config_bootstrap_diff.rc == 0
    fail_msg: >-
      The host runtime config does not match the branch ({{ repo_branch }}).
      diff exited {{ item.config_bootstrap_diff.rc }}
      ({{ 'the trees differ' if item.config_bootstrap_diff.rc == 1 else 'diff could not read one of the trees' }}).
      {{ item.config_bootstrap_diff.stdout | default('') }}
    success_msg: "config_bootstrap: the host runtime config matches the branch"
  loop: "{{ config_bootstrap_diff.results | default([]) }}"
  loop_control:
    label: "{{ item.item.dest_subdir | default('unknown') }}"
  when:
    - config_bootstrap_sync_enabled | bool
    - not ansible_check_mode | default(false) | bool

# A wrong-branch deploy is now destructive: --delete removes what the
# branch does not ship. The deployment's own Keycloak theme names the
# branch it needs — main ships only the genie theme, while an
# el-salvador deployment runs on genie-el-salvador — so the branch is
# checked for it BEFORE anything is synced. A branch that does not ship
# the deployment's theme is the wrong branch for this host.
- name: Stat the deployment's Keycloak theme in the extracted branch
  ansible.builtin.stat:
    path: >-
      {{ config_bootstrap_tmp_root }}/{{ item.dest_subdir | replace('/', '-') }}/{{ item.src }}/{{ keycloak_theme }}
  register: config_bootstrap_theme_stat
  loop: "{{ config_bootstrap_pairs | selectattr('dest_subdir', 'match', '^keycloak/') | list }}"
  loop_control:
    label: "{{ item.dest_subdir }}"
  when:
    - keycloak_theme is defined
    - config_bootstrap_sync_enabled | bool
    - not ansible_check_mode | default(false) | bool

- name: Fail when the branch does not ship the deployment's Keycloak theme
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      The branch ({{ repo_branch }}) does not ship the Keycloak theme
      {{ keycloak_theme }} that this deployment uses (keycloak_theme in the
      group vars). Deploying it would delete that theme from the host and
      the realms would fall back to the built-in Keycloak theme. Check
      repo_branch against the branch this host is deployed from.
    success_msg: "config_bootstrap: the branch ships the {{ keycloak_theme }} Keycloak theme"
  loop: "{{ config_bootstrap_theme_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item.dest_subdir | default('unknown') }}"
  when:
    - keycloak_theme is defined
    - config_bootstrap_sync_enabled | bool
    - not ansible_check_mode | default(false) | bool

- name: Remove extraction scratch directory
  ansible.builtin.file:
    path: "{{ config_bootstrap_tmp_root }}"
    state: absent

# Derives each archive name with the same expression as the download task, so
# adding or renaming a config_bootstrap_pairs entry cleans up after itself.
- name: Remove downloaded per-pair archives
  ansible.builtin.file:
    path: "{{ config_bootstrap_tmp_root }}-{{ repo_branch | replace('/', '-') }}-{{ item.dest_subdir | replace('/', '-') }}.tar.gz"
    state: absent
  loop: "{{ config_bootstrap_pairs }}"
  loop_control:
    label: "{{ item.dest_subdir }}"
