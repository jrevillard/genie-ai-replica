worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stderr;
  sendfile on;
  client_max_body_size 50m;

  server {
    listen ${NGINX_PORT};

    # Cache: immutable for hashed assets (Vite emits content-hashed filenames).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webmanifest)$ {
      root /app/dist;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }

    # Health endpoint (used by docker-compose healthcheck).
    location = /health {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      return 200 '{"status":"ok"}';
    }

    # SPA fallback: serve index.html for any unknown route so Vue Router can
    # resolve client-side paths (e.g. /signin, /dashboard).
    location / {
      root /app/dist;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      try_files $uri $uri/ /index.html;
    }
  }
}
