apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "rbac") | nindent 4 }}
  annotations:
    # Hook-owned (pre-install,pre-upgrade) so the dep-check Job
    # (weight -5) finds the SA at job-creation time. Regular
    # resources render AFTER all hooks, so a non-hook SA would be
    # absent when the Job tries to schedule — symptom: `serviceaccount
    # "X-dep-check" not found` at the very first Job event.
    #
    # The SA targets the release namespace, so the namespace must exist
    # before the hook that consumes it runs. Both supported install paths
    # guarantee that: `helm install --create-namespace` creates the
    # namespace in RunWithContext BEFORE any pre-install hook executes
    # (helm v3.16.3 pkg/action/install.go — the CreateNamespace block
    # precedes performInstall's execHook PreInstall), and the Flux path's
    # HelmRelease sets `install.createNamespace: true`, so Flux creates
    # the namespace before it runs helm at all. templates/namespace.yaml
    # renders the in-namespace ArangoDB RBAC, not a Namespace object —
    # neither path relies on the chart for the namespace itself.
    #
    # hook-weight -11 sits BEFORE the pre-upgrade clusterprofile-detect
    # Job (weight -10), whose pod's serviceAccountName is this SA. At an
    # equal weight Helm tie-breaks by template FILE PATH, and
    # templates/hooks/ sorts before templates/rbac/ — the Job would be
    # created first. That only works while a previous revision's SA
    # survives; a release whose SA was removed out of band would abort
    # every upgrade at the Job with "serviceaccount not found", the
    # repairing hook ordered after it and never run. -11 removes the
    # tie-break from the contract. Still after the Role/RoleBinding
    # (-30, which need only the namespace) and before the dep-check Job
    # (-5, which consumes the SA).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    # Same delete policy as the Role + RoleBinding: survive past
    # install so the helm-test pod (which reuses this SA after
    # install) can still bind to it. Deleted only on the next
    # install, before the new hook runs.
    "helm.sh/hook-delete-policy": before-hook-creation
