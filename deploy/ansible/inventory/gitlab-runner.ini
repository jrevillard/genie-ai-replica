# GENIE.AI - GitLab Runner Inventory
#
# Usage:
#   ansible-playbook -i inventory/gitlab-runner.ini gitlab-runner.yml --vault-id gitlab@prompt
#
# After first setup, encrypt the vault:
#   ansible-vault encrypt group_vars/gitlab_runners/vault.yml --vault-id gitlab@prompt
#
# Per-host config lives in host_vars/<hostname>.yml:
#   - gitlab_runner_tokens dict (one glrt- per host) in group_vars/gitlab_runners/vault.yml
#   - runner/docker overrides in host_vars/<hostname>.yml

[gitlab_runners]
genieai-runner ansible_host=10.0.0.100
genieai-runner-gpu ansible_host=10.0.0.110

[all:vars]
ansible_user=govstack
