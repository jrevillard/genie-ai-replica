apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-data-storage
    genieai/tier: cpu
spec:
  storageClassName: {{ .Values.storage.redisData.storageClass }}
  accessModes:
    - {{ .Values.storage.redisData.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.redisData.size }}
