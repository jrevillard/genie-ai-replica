contract:chatqna-server:
  <<: *contract_template
  needs:
    - job: build:chatqna-server
  variables:
    IMAGE_NAME: "genie-ai-chatqna-server"
    # Chatqna-shaped wire contract, run in the chatqna image. The retriever job
    # runs the same file, but against the RETRIEVER's vendored comps — this one
    # proves the image carrying the chat orchestrator builds a real
    # ServiceOrchestrator graph and registers all four services.
    #
    # NOT `test_contract_mock_reality_parity.py`, tempting though it looks: it
    # reads `../tests/conftest.py` for its stub inventory, and the template only
    # docker-cp's `contracts/` into the container. With no conftest present the
    # inventory is empty, every real comps module reads as a "missing stub", and
    # the test fails for a reason that has nothing to do with the image.
    CONTRACT_TEST_PATTERN: "test_contract_orchestrator_wire.py test_contract_llm_stream_offloop.py test_contract_nfrp_budgets.py::test_wire_latency_within_budget"
  rules:
    - *train_skip
    # The monthly forced rebuild is the event most likely to shift the base
    # image or the comps layout the /home/user/comps import path rests on —
    # the contract lane must run then, not only on path-matching MRs.
    - if: $FORCE_IMAGE_REBUILD == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    # One source of truth for the paths: the same anchor the build job uses,
    # so a path addition cannot drift between "rebuild the image" and "run
    # the contract lane" again (configs/ssl/**/* already did).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *chatqna_server_source_changes
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: *chatqna_server_source_changes
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths: *chatqna_server_source_changes

# Pure contract tests — repo-side, no built image needed (run in a plain venv).
# These validate the harness logic + telemetry assertions against the repo's
# dashboards (which live in the checkout, not in the module images). They never
# skip: the harness dev-env tests pass here (real comps absent), and the
# telemetry tests scan the repo dashboards available in the CI checkout.
contract:unit:
  stage: contract-in-image
  image: python:3.11-slim
  tags: [docker]
  interruptible: true
  before_script:
    - pip install --no-cache-dir pytest pytest-asyncio
  script:
    - cd genie-ai-overlay/contracts
    - mkdir -p ../../reports
    - python -m pytest test_contract_harness.py test_contract_telemetry.py test_contract_http_budget.py test_contract_e2e_pipeline.py::test_streaming_metadata_event_shape test_contract_e2e_pipeline.py::test_label_filter_contract_roundtrip test_contract_e2e_pipeline.py::test_label_filter_contract_empty_is_noop -p no:cacheprovider --junitxml=../../reports/contract-report.xml
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: reports/contract-report.xml
    paths:
      - reports/contract-report.xml
  rules:
    - *train_skip
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: ["genie-ai-overlay/contracts/**/*", "docker-compose.yaml", "genie-ai-overlay/dataprep/**/*", ".gitlab-ci.yml"]
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: ["genie-ai-overlay/contracts/**/*", "docker-compose.yaml", "genie-ai-overlay/dataprep/**/*", ".gitlab-ci.yml"]
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths: ["genie-ai-overlay/contracts/**/*", "docker-compose.yaml", "genie-ai-overlay/dataprep/**/*", ".gitlab-ci.yml"]

