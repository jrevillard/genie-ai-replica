# AMINA Care — compose override
# ==============================
# Bind-mounts the additive guard + training-consent + literacy files
# into haystack-chatqna without rebuilding the image, and swaps the
# uvicorn entry point to the combined shim.
#
# Layers installed by this override:
#   1. Overflow guard   — pre-trim + retry-on-overflow for OpenAI clients
#   2. Training consent — consent store + export endpoints
#   3. Literacy mode    — education-level verification + 3 literacy modes
#   4. Arcade db issues - error handling for DHIS2 and supply ledger + caregiver inbox
# Persistent host dirs:
#   ./training_exports   → /app/training/collected   (JSONL exports)
#   ./education_certs    → /app/data/education_certs (uploaded certs)
#
# Entry:
#   src.main_with_rag_tuning:app   (replaces src.main:app)

services:
  voice-stt:
    # --threads 4 matches the 4-CPU cap below. Doubled from the
    # original 2/2 config to roughly halve transcription latency
    # without changing the model.
    # Switched from small.en (488 MB, ~5.3 s for 1 s audio) to
    # base.en (148 MB, ~1.5–2 s for 1 s audio) on 2026-04-30 to
    # cut perceived voice-input latency. Accuracy hit is small for
    # conversational health questions; trade-off chosen for UX.
    # Compression-bomb attacks are blocked upstream by stt_upload_guard
    # (8 MB) + stt_duration_guard (6 min) + rate_limiter (30/min/IP),
    # so the larger CPU surface area cannot be weaponized.
    command: ["/app/build/bin/whisper-server", "-m", "/models/ggml-base.en.bin", "--host", "0.0.0.0", "--port", "8080", "--threads", "6"]
    # BUG-038 fix: cap raised from 4 to 6 CPUs (and threads to match).
    # Whisper base.en spikes to 6+ CPUs on long audio; the previous
    # 4-CPU cap caused concurrent voice + PDF ingest to OOM-kill.
    # 6 CPUs leaves 10 CPUs on a 16-core host for the rest of the
    # stack -- still bounded, just less likely to be the bottleneck.
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 4G
  voice-tts:
    # Cap TTS at 1 CPU/1GB — long synthesis spikes shouldn't starve others.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  voice-tts-mnk:
    volumes:
      - ./tts-mms-service/server.py:/app/server.py:ro
    # 2026-05-02: CPU bumped 1 -> 4 and torch thread count pinned to
    # match. Previously torch auto-detected 8 threads inside a 1-CPU
    # cgroup, so 8 threads fought over one core -- ~110 s for a
    # 1300-char Mandinka reply. With 4 dedicated cores AND thread
    # count matching, per-chunk synth time drops roughly 3x.
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TORCH_NUM_THREADS: "4"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
  dataprep-worker:
    # PDF/docling ingestion can spike CPU on large documents.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
  arcadedb:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
  haystack-chatqna:
    # Phase 1: cap the heavy hitter at 6 CPUs / 5GB. Allows 4 uvicorn
    # workers room to breathe while leaving headroom for voice-stt + TTS
    # + dataprep on the 16-core host.
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 5G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      PYTHONPATH: /app/src
      REDIS_HOST: amina-redis
      # LLM fallback policy (see services/llm_provider_policy.py)
      LLM_FALLBACK_MODE:        ${LLM_FALLBACK_MODE:-warn}
      SHOW_LLM_PROVIDER_BADGE:  ${SHOW_LLM_PROVIDER_BADGE:-true}
      AMINA_REQUIRE_LORA:       ${AMINA_REQUIRE_LORA:-false}
      AMINA_REQUIRE_LORA_FOR_GUEST: ${AMINA_REQUIRE_LORA_FOR_GUEST:-false}
      # LoRA is disabled for maintenance — its cloudflared tunnel is down
      # and waiting for the LoRA timeout adds 10-15s per turn before
      # falling back. Hard-coded to "false" (no ${...} substitution) so
      # this override beats whatever haystack-stack/.env says. Re-enable
      # by flipping back to "true" here AND putting amina-lora back
      # in LLM_FALLBACK_CHAIN once the LoRA endpoint is healthy.
      USE_FINETUNED_MODEL:      "false"
      LLM_FALLBACK_CHAIN:       "mistral,groq,gemini,base"
      # Mistral AI (OpenAI-compatible API). Set MISTRAL_API_KEY in your
      # .env to activate. open-mistral-7b is free-tier and fast.
      MISTRAL_API_KEY:          ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL:         ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_MODEL:            ${MISTRAL_MODEL:-open-mistral-7b}
      # AMINA Mistral -- locally fine-tuned Mistral-7B-Instruct-v0.3 served
      # by vLLM on the GPU box (e.g. amina-a40), exposed via Tailscale Funnel.
      # When AMINA_MISTRAL_BASE_URL is unset the client is not initialised
      # and model_preference="amina-mistral" falls through to the standard
      # fallback chain. Set in haystack-stack/.env once vLLM is up.
      AMINA_MISTRAL_API_KEY:    ${AMINA_MISTRAL_API_KEY:-}
      AMINA_MISTRAL_BASE_URL:   ${AMINA_MISTRAL_BASE_URL:-}
      AMINA_MISTRAL_MODEL:      ${AMINA_MISTRAL_MODEL:-amina-mistral}
      # Agent Platform v1 — DEFAULT IS OFF.
      # Recommended staged rollout (see docs/AGENT_PLATFORM_V1.md):
      #   1. AMINA_AGENTIC_MODE=shadow  + MODES_ALLOWED=advanced  (observe 2-4w)
      #   2. AMINA_AGENTIC_MODE=assist  + MODES_ALLOWED=advanced  (advanced only)
      #   3. expand MODES_ALLOWED=advanced,basic later if metrics support it
      AMINA_AGENTIC_MODE:           ${AMINA_AGENTIC_MODE:-off}
      AMINA_AGENTIC_MODES_ALLOWED:  ${AMINA_AGENTIC_MODES_ALLOWED:-advanced}
      AMINA_AGENTIC_MAX_TOOL_CALLS: ${AMINA_AGENTIC_MAX_TOOL_CALLS:-3}
      AMINA_AGENTIC_MAX_PLANNING_ROUNDS: ${AMINA_AGENTIC_MAX_PLANNING_ROUNDS:-1}
      AMINA_AGENTIC_TRACE_ENABLED:  ${AMINA_AGENTIC_TRACE_ENABLED:-true}
      AMINA_AGENTIC_FAIL_OPEN:      ${AMINA_AGENTIC_FAIL_OPEN:-true}
      AMINA_AGENTIC_PROVIDER:       ${AMINA_AGENTIC_PROVIDER:-auto}
      # Phase 2: native function-calling. DEFAULT IS OFF.
      # Phase 4 staging recipe (set via env or .env, do not hard-code here):
      #   AMINA_AGENTIC_MODE=shadow
      #   AMINA_AGENTIC_NATIVE_TOOLS=true
      #   AMINA_AGENTIC_NATIVE_FORMAT=openai
      AMINA_AGENTIC_NATIVE_TOOLS:   ${AMINA_AGENTIC_NATIVE_TOOLS:-false}
      AMINA_AGENTIC_NATIVE_FORMAT:  ${AMINA_AGENTIC_NATIVE_FORMAT:-auto}
      # Evidence Layer — DEFAULT IS OFF (admin must toggle ON via UI).
      # See docs/EVIDENCE_LAYER.md for the full lifecycle.
      AMINA_EVIDENCE_LAYER_DEFAULT: ${AMINA_EVIDENCE_LAYER_DEFAULT:-off}
      AMINA_EVIDENCE_TRACE_ENABLED: ${AMINA_EVIDENCE_TRACE_ENABLED:-true}
      AMINA_EVIDENCE_EVAL_ENABLED:  ${AMINA_EVIDENCE_EVAL_ENABLED:-true}
      AMINA_EVIDENCE_FAIL_OPEN:     ${AMINA_EVIDENCE_FAIL_OPEN:-true}
      AMINA_EVIDENCE_STORE:         ${AMINA_EVIDENCE_STORE:-redis}
      AMINA_EVIDENCE_HASH_SALT:     ${AMINA_EVIDENCE_HASH_SALT:-amina-evidence-v1}
      AMINA_EVIDENCE_REPORTS_DIR:   ${AMINA_EVIDENCE_REPORTS_DIR:-/app/reports/evidence}
      AMINA_EVIDENCE_EVAL_TIMEOUT_S: ${AMINA_EVIDENCE_EVAL_TIMEOUT_S:-30}
      AMINA_EVIDENCE_EVAL_CONCURRENCY: ${AMINA_EVIDENCE_EVAL_CONCURRENCY:-2}
      # Meta channels (WhatsApp Business Cloud + Facebook Messenger).
      # All defaults are empty → routes mount in DEMO MODE (signature
      # verification bypassed, no outbound replies). Layer the
      # docker-compose.meta-channels.yml override (or set these in
      # your .env) to bring the channels live with real credentials.
      MESSENGER_PAGE_ACCESS_TOKEN: ${MESSENGER_PAGE_ACCESS_TOKEN:-}
      MESSENGER_VERIFY_TOKEN:      ${MESSENGER_VERIFY_TOKEN:-amina_health_2026}
      MESSENGER_APP_SECRET:        ${MESSENGER_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN:       ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID:    ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN:       ${WHATSAPP_VERIFY_TOKEN:-amina_health_2026}
      WHATSAPP_APP_SECRET:         ${WHATSAPP_APP_SECRET:-}
      META_GRAPH_VERSION:          ${META_GRAPH_VERSION:-v19.0}
      # Twilio WhatsApp Sandbox MVP adapter (independent of Meta WhatsApp).
      # Sandbox doesn't require auth-token for inbound TwiML reply; only
      # set these when you flip TWILIO_VALIDATE_SIGNATURE=true.
      TWILIO_AUTH_TOKEN:           ${TWILIO_AUTH_TOKEN:-}
      # ACCOUNT_SID enables async-via-REST mode (recommended): on inbound
      # webhook we ack with empty TwiML in <100ms and POST the actual
      # reply to Twilio's REST API. Sidesteps Twilio's 15s webhook
      # timeout (error 11200) on slow agent turns. Without ACCOUNT_SID
      # the route falls back to sync TwiML mode (timeout-prone).
      TWILIO_ACCOUNT_SID:          ${TWILIO_ACCOUNT_SID:-}
      TWILIO_VALIDATE_SIGNATURE:   ${TWILIO_VALIDATE_SIGNATURE:-false}
      # Agent-call shaping: match the response style web "Advanced mode"
      # produces. Without these, inbound gets the guest greeting path.
      TWILIO_AGENT_USER_ROLE:        ${TWILIO_AGENT_USER_ROLE:-patient}
      # Default flipped from amina-lora -> mistral while LoRA is in
      # maintenance. Set explicitly via .env once LoRA endpoint is back.
      TWILIO_AGENT_MODEL_PREFERENCE: ${TWILIO_AGENT_MODEL_PREFERENCE:-mistral}
      TWILIO_AGENT_CHANNEL:          ${TWILIO_AGENT_CHANNEL:-twilio_whatsapp}
      # Caregiver-privacy enforcement flags (Phase 5/6.7/7).
      # Default: REQUIRED=false (gate dependency runs but transparently
      # passes), WARN_ONLY=true (Phase 5 middleware emits the
      # `X-Caregiver-Privacy-Stale` header + structured warn log on
      # stale, never blocks). Promote to REQUIRED=true for dev/staging
      # validation via:
      #   AMINA_CAREGIVER_PRIVACY_REQUIRED=true docker compose up -d \
      #     --force-recreate --no-deps haystack-chatqna
      # Rollback (canonical one-liner):
      #   AMINA_CAREGIVER_PRIVACY_REQUIRED=false docker compose up -d \
      #     --force-recreate --no-deps haystack-chatqna
      AMINA_CAREGIVER_PRIVACY_REQUIRED: ${AMINA_CAREGIVER_PRIVACY_REQUIRED:-false}
      AMINA_CAREGIVER_PRIVACY_WARN_ONLY: ${AMINA_CAREGIVER_PRIVACY_WARN_ONLY:-true}
    volumes:
      # ── Overflow guard ───────────────────────────────────────────────
      - ./haystack-chatqna/src/services/overflow_guard.py:/app/src/services/overflow_guard.py:ro
      - ./haystack-chatqna/src/services/overflow_guard_patch.py:/app/src/services/overflow_guard_patch.py:ro
      - ./haystack-chatqna/src/main_with_guard.py:/app/src/main_with_guard.py:ro
      # ── Training consent + export ────────────────────────────────────
      - ./haystack-chatqna/src/services/training_consent.py:/app/src/services/training_consent.py:ro
      - ./haystack-chatqna/src/services/training_export.py:/app/src/services/training_export.py:ro
      - ./haystack-chatqna/src/api/training_routes.py:/app/src/api/training_routes.py:ro
      - ./haystack-chatqna/src/main_with_training.py:/app/src/main_with_training.py:ro
      # ── Literacy mode + verification ─────────────────────────────────
      - ./haystack-chatqna/src/services/literacy_service.py:/app/src/services/literacy_service.py:ro
      - ./haystack-chatqna/src/services/certificate_storage.py:/app/src/services/certificate_storage.py:ro
      - ./haystack-chatqna/src/api/literacy_routes.py:/app/src/api/literacy_routes.py:ro
      - ./haystack-chatqna/src/main_with_literacy.py:/app/src/main_with_literacy.py:ro
      # ── Care routes (supply + dual-path role rules + dev override) ──
      # Added 2026-04-30 so role-rule changes (CAREPATH_WRITE_ROLES,
      # CARE_TRUST_BODY_ROLE) take effect on restart without rebuilding
      # the haystack-chatqna image.
      - ./haystack-chatqna/src/api/care_routes.py:/app/src/api/care_routes.py:ro
      - ./haystack-chatqna/src/api/supply_ledger_routes.py:/app/src/api/supply_ledger_routes.py:ro
      - ./haystack-chatqna/src/api/dualpath_ledger_routes.py:/app/src/api/dualpath_ledger_routes.py:ro
      # ── DHIS2 routes (DHIS2_DEV_ADMIN_BYPASS) ────────────────────────
      - ./haystack-chatqna/src/api/dhis2_routes.py:/app/src/api/dhis2_routes.py:ro
      - ./haystack-chatqna/src/api/dhis2_history_routes.py:/app/src/api/dhis2_history_routes.py:ro
      # ── Phase 5: caregiver privacy warn-only middleware (new file)
      - ./haystack-chatqna/src/services/caregiver_privacy_warn.py:/app/src/services/caregiver_privacy_warn.py:ro
      # ── Phase 6.5: enforcement readiness fixes
      #   - caregiver_routes.py: JWT mint adds caregiver_role claim
      #   - caregiver_privacy_routes.py: /privacy/status returns full safe receipt
      - ./haystack-chatqna/src/api/caregiver_routes.py:/app/src/api/caregiver_routes.py:ro
      - ./haystack-chatqna/src/api/caregiver_privacy_routes.py:/app/src/api/caregiver_privacy_routes.py:ro
      # ── Guest / free-tier chat gating + translator doc i18n ─────────
      - ./haystack-chatqna/src/api/agent_routes.py:/app/src/api/agent_routes.py:ro
      # Production-aware secret/flag config (BUG-003/004/006/007 fixes)
      - ./haystack-chatqna/src/config.py:/app/src/config.py:ro
      # Translation v3.5 / v4.2 -- whole directory mounted as one
      # read-only volume so the [6/8] verify block + canary + baseline
      # script all see the same source tree the host has.
      - ./haystack-chatqna/src/translation_v4:/app/src/translation_v4:ro
      # MMS TTS client -- adaptive timeout (scales with text length)
      # so long-form Mandinka clinical responses don't trip the old
      # fixed 30 s ceiling. See tts_mms.py:_adaptive_timeout.
      - ./haystack-chatqna/src/services/tts_mms.py:/app/src/services/tts_mms.py:ro
      # admin_routes.py: BUG-002 hmac.compare_digest, BUG-009 admin auth
      # gate, plus a9d74b19's cleanup-tracking + JSON-parse logging fixes.
      - ./haystack-chatqna/src/api/admin_routes.py:/app/src/api/admin_routes.py:ro
      - ./haystack-chatqna/src/services/document_gen.py:/app/src/services/document_gen.py:ro
      - ./haystack-chatqna/src/services/translator.py:/app/src/services/translator.py:ro
      - ./haystack-chatqna/src/services/repetition_guard.py:/app/src/services/repetition_guard.py:ro
      - ./haystack-chatqna/src/agent/amina_agent.py:/app/src/agent/amina_agent.py:ro
      # ── Intent router + learner + conversational pacer + gap-closers ─
      - ./haystack-chatqna/src/services/intent_router.py:/app/src/services/intent_router.py:ro
      - ./haystack-chatqna/src/services/intent_learner.py:/app/src/services/intent_learner.py:ro
      - ./haystack-chatqna/src/services/conversational_pacer.py:/app/src/services/conversational_pacer.py:ro
      - ./haystack-chatqna/src/services/stance_classifier.py:/app/src/services/stance_classifier.py:ro
      - ./haystack-chatqna/src/services/intent_pattern_graph.py:/app/src/services/intent_pattern_graph.py:ro
      - ./haystack-chatqna/src/services/four_layer_router.py:/app/src/services/four_layer_router.py:ro
      - ./haystack-chatqna/src/services/density_compressor.py:/app/src/services/density_compressor.py:ro
      - ./haystack-chatqna/src/services/response_shaper.py:/app/src/services/response_shaper.py:ro
      - ./haystack-chatqna/src/services/safety_contract.py:/app/src/services/safety_contract.py:ro
      # ── Caregiver intelligence pipeline ──────────────────────────────
      - ./haystack-chatqna/src/services/caregiver_amina_service.py:/app/src/services/caregiver_amina_service.py:ro
      - ./haystack-chatqna/src/services/caregiver_alert_chat.py:/app/src/services/caregiver_alert_chat.py:ro
      # ── Admin + Gov materialized-view routes ───────────────────────
      - ./haystack-chatqna/src/api/admin_mv_routes.py:/app/src/api/admin_mv_routes.py:ro
      # ── Patient AMINA ID routes ────────────────────────────────────
      - ./haystack-chatqna/src/api/patient_id_routes.py:/app/src/api/patient_id_routes.py:ro
