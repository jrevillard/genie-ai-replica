  vllm:
    command: '--model ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct} --gpu_memory_utilization ${VLLM_GPU_UTILIZATION:-0.55} --served-model-name ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      --max_model_len ${VLLM_MAX_MODEL_LEN:-65536} --max_num_seqs ${VLLM_MAX_NUM_SEQS:-64} --dtype=${VLLM_DTYPE:-half} --enforce-eager

