apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" (deepCopy .Values | merge (dict "component" "rbac"))) | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "genieai-common.fullname" . }}-dep-check
subjects:
  - kind: ServiceAccount
    name: {{ include "genieai-common.fullname" . }}-dep-check
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" (deepCopy .Values | merge (dict "component" "rbac"))) | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    # hook-succeeded (unlike the namespaced RoleBinding above): Helm never
    # runs delete hooks on uninstall, so a cluster-scoped binding with only
    # before-hook-creation survives forever — namespace deletion does not
    # reap it. Removed on success, recreated before each hook phase; a
    # failed attempt keeps it around for debugging until the next try's
    # before-hook-creation replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "genieai-common.fullname" . }}-dep-check
subjects:
  - kind: ServiceAccount
    name: {{ include "genieai-common.fullname" . }}-dep-check
    namespace: {{ .Values.namespace }}
