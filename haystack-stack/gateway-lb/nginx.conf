# AMINA Gateway Load Balancer
# ============================================================================
# Sits in front of amina-gateway (instance 1) + amina-gateway-2 (instance 2).
# Cloudflared tunnel ingress points at this nginx, NOT at a single gateway,
# so a routine recreation of either gateway is invisible to end users.
#
# Failure handling:
#   * Round-robin between both upstreams (default nginx behaviour)
#   * Passive health check: 2 failures in 10s -> upstream marked dead
#                            for 10s, requests routed to the survivor
#   * On a per-request 5xx/timeout/connection-refused, nginx retries
#     the OTHER upstream before returning to the caller (proxy_next_upstream)
#
# SSE / streaming:
#   * proxy_buffering off  -> SSE chat-stream chunks reach the client
#                              as they arrive, no nginx-side buffering
#   * proxy_request_buffering off -> upstream sees POST body
#                                     immediately, no upload-side buffer

events { }

http {
    # Don't reveal nginx version in error pages or Server header.
    server_tokens off;

    # Pre-resolve upstream hostnames at start; if both are missing,
    # nginx will refuse to start and surface the error loudly.
    upstream amina_gateways {
        # Fail-fast tuning (tightened 2026-05-09 after rolling-restart test):
        #   max_fails=1: ONE failure (connect-refused / 5xx) marks the
        #     upstream dead, so the very next request goes to the survivor.
        #     With max_fails=2 the first 2 requests after a stop both
        #     suffered the 5s connect timeout before nginx caught on.
        #   fail_timeout=5s: shorter mark-dead window so a recovered
        #     upstream returns to rotation quickly after restart.
        server amina-gateway:8443    max_fails=1 fail_timeout=5s;
        server amina-gateway-2:8443  max_fails=1 fail_timeout=5s;
        # Keep a small pool of warm connections to each backend so
        # SSE handshakes don't pay TCP+TLS setup time per request.
        keepalive 32;
    }

    # Standard log format that includes which upstream served + retry trail.
    log_format upstream_aware
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        'upstream=$upstream_addr ut=$upstream_response_time '
        'tries=$upstream_status';
    access_log /var/log/nginx/access.log upstream_aware;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Liveness for docker healthcheck (not the gateway's /health,
        # which we forward — this returns immediately even if both
        # gateways are dead, so docker doesn't kill the LB during
        # a transient outage).
        location = /lb-health {
            access_log off;
            return 200 "lb-ok\n";
            add_header Content-Type text/plain;
        }

        # Everything else is forwarded to one of the two gateway
        # instances, with automatic failover if one is restarting.
        location / {
            proxy_pass         http://amina_gateways;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host                 $host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
            # Pass cloudflared's CF-Connecting-IP through unchanged so
            # the gateway's audit log records the real client.
            proxy_set_header   CF-Connecting-IP     $http_cf_connecting_ip;

            # SSE-friendly: no buffering on either side.
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_cache              off;

            # Failover: if upstream A returns connect-refused / 5xx /
            # timeout, retry upstream B once before failing the request.
            # This is the bridge that hides routine gateway restarts
            # from end users.
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 5s;

            # Connection lifecycle:
            #   * 1s connect timeout (fail fast on TCP refused — was 5s,
            #     too slow when one upstream is down: a fresh request
            #     would wait 5s before nginx marked it dead and tried
            #     the survivor. 1s gets us "blip then full recovery"
            #     instead of "5+ seconds of per-request stall")
            #   * 120s read timeout (covers long SSE chat-stream sessions)
            proxy_connect_timeout 1s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
        }
    }
}
