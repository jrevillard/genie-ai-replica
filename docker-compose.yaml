    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3} --max-batch-tokens ${TEI_RERANKING_MAX_BATCH_TOKENS:-1024} --max-concurrent-requests
      ${TEI_RERANKING_MAX_CONCURRENT_REQUESTS:-8} --auto-truncate"
    environment:
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - RUST_BACKTRACE=${RUST_BACKTRACE:-}
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    healthcheck:
      interval: 10s
      retries: 48
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/health
      timeout: 6s
    image: ${TEI_RERANKING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:1.9.3}
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - gpu-models
    restart: unless-stopped
    volumes:
    - ${DATA_DIR:-./data}/huggingface:/data
  tempo-proxy:
    build:
      context: ./tools/tempo-proxy
