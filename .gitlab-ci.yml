test:ragas-service:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r components/ragas-service/requirements.txt "ruff==${RUFF_VERSION}" "pytest==${PYTEST_VERSION}"
  script:
    - cd components/ragas-service
    - ruff check app.py ragas_engine.py xlsx_io.py tests/
    - python -m pytest tests/ -q --junitxml=reports/pytest-report.xml
  artifacts:
    when: always
    reports:
