{{- if .Values.secrets.sealedSecrets.enabled -}}
{{- /*
  SealedSecret templates for the ArangoDeployment bootstrap credentials.
  kube-arangodb expects a specific key per reference: the
  `rootPasswordSecretName` Secret must carry `password`, and the
  `jwtSecretName` Secret must carry `jwt` — each encryptedData below
  carries the key its operator reference requires.

  The encryptedData values are the base64 sentinel `UExBQ0VIT0xERVIr`
  (decodes to the string "PLACEHOLDER+"). The sealed-secrets controller
  cannot decrypt a sentinel — it marks the SealedSecret
  `status.conditions[type=Synced].status=False` (reason ErrorDecrypt) —
  so the underlying K8s Secret never materializes until an operator
  re-seals real values with kubeseal against the cluster's public cert:
      kubeseal --fetch-cert --context=cluster --kubeconfig=kubeconfig \
        | kubeseal --cert pub-cert.pem --scope cluster-wide \
          --secret-name <name> --name <kss-name>
  Replace each sentinel with the kubeseal output before `helm install` —
  CI (conftest) fails release branches that still carry a sentinel.

  For dev clusters, the chart may ship a `KubernetesSecret`-shaped bootstrap
  by setting `secrets.sealedSecrets.bootstrap: true` in values-override —
  the controller creates real K8s `Secret` resources on first sync. Out of
  scope here; documented with the CI policies.
*/ -}}
{{- range $secretName := list "arango-root-secret" "arango-jwt-secret" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" $.Chart "Release" $.Release "Values" (deepCopy $.Values | merge (dict "component" "sealed-secret"))) | nindent 4 }}
    app.kubernetes.io/component: arangodb
spec:
  {{- if eq $secretName "arango-root-secret" }}
  encryptedData:
    password: UExBQ0VIT0xERVIr     # PLACEHOLDER+ — RE-SEAL before helm install
  {{- else if eq $secretName "arango-jwt-secret" }}
  encryptedData:
    jwt: UExBQ0VIT0xERVIr           # PLACEHOLDER+ — RE-SEAL before helm install
  {{- end }}
{{- end -}}
{{- end -}}
