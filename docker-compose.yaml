  # ===========================================================================
  # GPU Model Services (profile: gpu-models, node.labels.gpu == true)
  # Skip with: Compose --profile opea only, or Swarm GPU_MODEL_REPLICAS=0
  # ===========================================================================

  vllm:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [gpu-models]
    restart: unless-stopped
    image: vllm/vllm-openai:v0.29.0
    # Swarm: internal only - access via Kong or docker exec
    # ports:
    #   - "${LLM_SERVER_PORT:-8000}:8000"
    command: >
      --model ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      --gpu_memory_utilization ${VLLM_GPU_UTILIZATION:-0.55}
      --served-model-name ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      --max_model_len ${VLLM_MAX_MODEL_LEN:-65536}
      --max_num_seqs ${VLLM_MAX_NUM_SEQS:-16}
      --dtype=${VLLM_DTYPE:-half}
      --enforce-eager
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      replicas: ${GPU_MODEL_REPLICAS:-${DEPLOY_OPEA:-1}}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
