---
# GENIE.AI - Shared configuration (all environments)
# Environment-specific config goes in group_vars/<env>.yml
# Environment-specific secrets go in group_vars/<env>.vault (Ansible Vault encrypted)

# =============================================================================
# DEPLOYMENT PATHS
# =============================================================================
deploy_dir: /opt/genieai
data_dir: ./data

# Runtime theme config directory on the host, bind-mounted read-only into the
# frontend and Keycloak containers. Promoted to group_vars so both the
# config_bootstrap role AND the deploy play (which renders env.j2) see the same
# value — role defaults are scoped to the role's own plays and would render as
# an empty string in env.j2.
#
# Derived from deploy_dir rather than an inventory group name so the path is
# stable no matter how the inventory orders a host's groups, and so operators
# find the editable theme files inside the deploy directory they already know.
config_dir: "{{ deploy_dir }}/config"

# =============================================================================
# DOCKER / NVIDIA — VERSION PINNING
# =============================================================================
# Packages are held via dpkg --set-selections to prevent accidental upgrades.
# To upgrade: change the pin, unhold, run apt upgrade, re-hold.
docker_version_pin: "5:28.5.*"
docker_hold_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - docker-ce-rootless-extras
nvidia_version_pin: "1.18.*"
nvidia_hold_packages:
  - nvidia-container-toolkit
  - nvidia-container-toolkit-base
  - libnvidia-container-tools
  - libnvidia-container1

# =============================================================================
# STACK CONFIGURATION
# =============================================================================
stack_name: genieai
compose_file: docker-compose.yaml
deploy_stabilization_timeout: 900
deploy_opea: "1"
enable_observability: "0"
# OKF feature flag (2026-10-21): 0 parks the OKF stack (containers, Kong
# route, UI). Deployments running OKF (el-salvador, the local build) override
# to "1" in their group_vars.
okf_enabled: "0"
grafana_admin_user: "admin"
victoriametrics_retention: "30d"
victorialogs_retention: "30d"
victoriatraces_retention: "30d"
otel_traces_sampler_rate: "100.0"
grafana_alert_webhook_url: ""
grafana_alert_email: ""
# =============================================================================
# REPOSITORY
# =============================================================================
repo_url: https://opensource.unicc.org/un/itu/genie-ai.git
repo_branch: main

# =============================================================================
# API GATEWAY (defaults)
# =============================================================================
nginx_public_domain: "localhost"
nginx_http_port: "80"
nginx_https_port: "443"
nginx_permissions_policy: "camera=(), microphone=(), geolocation=()"

# Kong trusted IPs for X-Forwarded-* header passthrough.
# Kong must trust nginx (on the Docker network) to pass through X-Forwarded-Proto,
# X-Forwarded-Host, X-Forwarded-Port, and X-Forwarded-Prefix headers set by nginx.
# Kong is NOT exposed to the host — only containers on the internal Docker network can reach it,
# so IP spoofing from outside is not possible regardless of the CIDR range.
# Docker Compose (bridge networks): 172.16.0.0/12 (covers 172.16-172.31)
# Docker Swarm (overlay networks): 10.0.0.0/8 (default overlay subnet range)
# Restrict further with: docker network inspect <network> to find the exact subnet.
kong_trusted_ips: "10.0.0.0/8"

# =============================================================================
# SSL CERTIFICATES
# =============================================================================
# self_signed_certs: true   -> generate self-signed certs if none exist
# self_signed_certs: false  -> fail if no certs provided in files/certificates/<env>/
self_signed_certs: true

# =============================================================================
# TEARDOWN OPTIONS
# =============================================================================
teardown_remove_volumes: false
teardown_remove_registry: false

# =============================================================================
# GITLAB RUNNER
# =============================================================================
# gitlab_url is the GitLab instance URL used in config.toml.
# gitlab_runner_tokens (dict keyed by inventory hostname) MUST be set in
# environment-specific vault files — one glrt- token per runner host.
#
# To disable the socket proxy (mount docker.sock directly):
#   gitlab_runner_use_socket_proxy: false
#   in group_vars/gitlab_runners/vars.yml
gitlab_url: "https://opensource.unicc.org"

# =============================================================================
# GPU NODE (defaults — override in group_vars/<env>/vars.yml)
# =============================================================================
gpu_deploy_dir: /opt/genieai-gpu
gpu_data_dir: ./data
gpu_generated_dir: configs/nginx-gpu

gpu_public_domain: gpu.example.com
gpu_https_port: "443"
gpu_self_signed_certs: true
gpu_env_file: ""
nvidia_visible_devices: "all"

# Remote GPU node (set in group_vars/<env>/vars.yml to route AI services to a dedicated GPU host)
gpu_node_host: ""
vllm_api_key: ""

# OPEA runtime patches (set in group_vars/<env>/vars.yml when needed)
# These are independent of gpu_node_host. For example:
#   - Remote GPU node with Let's Encrypt: no need to set opea_ssl_skip_verify
#   - Remote GPU node with self-signed cert: set opea_ssl_skip_verify = "1"
# REQUIRED, not implied, when gpu_node_host is set AND gpu_self_signed_certs is
# true (which is this file's default): the GPU node's certificate is then
# self-signed by construction, and OPEA-side verification is opt-in. Before the
# verify=False gating, the bypass was implied by setting VLLM_API_KEY; now that
# it is explicit, such a deployment passes `ansible-playbook` and fails at its
# first model call with CERTIFICATE_VERIFY_FAILED. Set "1" there. It is NOT
# derived automatically from the two variables above: silently turning off
# certificate verification is not a decision a template should make.
opea_ssl_skip_verify: ""

# Keycloak SSL verification (independent of OPEA settings)
# Set to "1" when Keycloak uses a self-signed certificate.
# Only affects dataprep's Keycloak service account token fetch.
keycloak_ssl_skip_verify: ""

# The Keycloak theme this deployment serves. ONE declaration feeds every
# consumer: templates/env.j2 renders it into KEYCLOAK_THEME, the realm
# (configs/keycloak/genie-realm.yaml) points its four theme settings at it,
# and the config_bootstrap role refuses to mirror a branch that does not ship
# it. It lives here — in the vars every host of the inventory gets — because
# role defaults are scoped to the role's own plays (the same reason config_dir
# above is promoted here): a role default would be invisible to the .env-
# rendering play, and the theme the guard checks and the theme the realm
# serves would be two literals in two files.
#
# A flavour overrides it in group_vars/<environment>/vars.yml (e.g.
# genie-el-salvador); the value must name a theme the deployed branch ships
# under configs/keycloak/themes/.
keycloak_theme: genie

# Dataprep LLM labeling tuning (defaults live in code; set in group_vars/<env>/vars.yml to override).
# LLM labeling is the dominant document-ingestion cost (one vLLM call per chunk).
#   dataprep_max_concurrent_batches: 20  # concurrent LLM label calls (code default 20; was 5)
#   dataprep_llm_label_batch_size: 4     # chunks per LLM call (code default 4); raise to 8 on
#                                        #   capable models (e.g. granite-4.1-8b). Batches fall
#                                        #   back to per-chunk on parse failure.
# Contextual Retrieval (ON by default) — per-chunk LLM doc-context prefix
# prepended before embedding (Anthropic-style). Adds one vLLM call per batch at
# ingest; never blocks ingestion (raw-chunk fallback). Labels run on the raw
# chunk regardless — contextual_label_raw decouples the two.
#
# Every one of these is emitted by env.j2 with the compose default, so you only
# need to set one when you are deliberately changing it. config-validator (AC8)
# fails if compose and env.j2 disagree.
#
#   contextual_retrieval_enabled: false   # true (default). false is a true no-op
#   dataprep_contextual_model: ""         # empty = auto-detect the served model;
#                                         #   must support guided JSON (response_format=json_object)
#   dataprep_max_model_len: 0             # 0 (default) = discover the served context window at
#                                         #   runtime (from VLLM_ENDPOINT). Set >0 to state the
#                                         #   window the endpoint serves — the only lever on a
#                                         #   strict OpenAI-compatible provider (its /v1/models
#                                         #   carries no max_model_len) and the way to state the
#                                         #   window of a dataprep_contextual_model that is not
#                                         #   the model the endpoint lists first.
#   dataprep_contextual_doc_budget: 0     # 0 (default) = DERIVED from the window the endpoint
#                                         #   SERVES, discovered at runtime from VLLM_ENDPOINT.
#                                         #   (vllm_max_model_len is the vLLM-side knob only.)
#                                         #   The context call carries the system prompt +
#                                         #   document context + the batch's chunk text and
#                                         #   reserves max_tokens per chunk in the batch; all of
#                                         #   that is subtracted from the window and the remainder
#                                         #   is the budget. Leave this at 0 unless you have a
#                                         #   reason — a budget copied from a deployment with a
#                                         #   larger window overflows this one, and the rejected
#                                         #   calls fall back to raw chunks SILENTLY.
#   dataprep_contextual_max_tokens: 512   # max OUTPUT tokens PER CHUNK in the batch.
#                                         #   200 truncated the JSON under load → raw-chunk fallback;
#                                         #   512 = safe margin (model stops early ~196).
#                                         #   A batch of 4 therefore reserves 2048 output tokens,
#                                         #   which is why vllm_max_model_len=2048 (env.t4) cannot
#                                         #   run contextualization at all.
#   contextual_strategy: per_chunk        # per_chunk (default, Anthropic recipe — one context
#                                         #   per chunk, section-tailored) | doc_level (one call
#                                         #   per document, same context on every chunk, N× cheaper)
#   contextual_label_raw: true            # true (default): label the RAW chunk, embed the
#                                         #   contextualized one. Keeps label precision while
#                                         #   propagating the document subject via the vector.
#
# Model-endpoint HTTP budgets. Defaults live in code (core/model_http_policy.py);
# override here if a model is slower than the default budget allows. A request
# that misses its budget falls back (file labels, raw chunk) rather than
# blocking, so a budget set too low degrades quality instead of stalling.
#   model_llm_timeout_seconds: 180        # vLLM chat completions. Raise if
#                                         #   labelling exceeds it on a slow model
#                                         #   — but see dataprep_llm_phase_timeout_seconds
#                                         #   below: the phase ceiling must stay
#                                         #   above (1 + retries) x this.
#   model_llm_max_retries: 2              # SDK retries on 5xx / connection
#                                         #   errors. Raising it raises what
#                                         #   the phase ceiling must outlast:
#                                         #   3 retries x 180s needs 720s, which
#                                         #   still fits under the 900s default
#                                         #   below; it is raising the PER-CALL
#                                         #   budget that crosses it (300s/call
#                                         #   needs 1200s of waves).
#   model_summarizer_timeout_seconds: 600 # retriever summarizer. No fallback
#                                         #   path, so a tighter budget turns a
#                                         #   slow success into a 500 on the chat
#                                         #   request. The client was unbounded;
#                                         #   600 matches the openai SDK default so
#                                         #   this is the least likely ceiling to
#                                         #   break a working deployment.
#   model_embedding_timeout_seconds: 600 # the retriever's embedding client,
#                                         #   OpenAI-API branch ONLY. A NEW
#                                         #   ceiling: langchain-openai forwards
#                                         #   request_timeout (default None),
#                                         #   which overrides the openai SDK
#                                         #   default, so the call was unbounded.
#                                         #   Lowering it yields a silently empty
#                                         #   retrieval — the retriever's except
#                                         #   clause returns [] ahead of the
#                                         #   hybrid/BM25 leg. The TEI branch
#                                         #   (TEI_EMBEDDING_ENDPOINT and
#                                         #   HF_TOKEN) is deliberately unbudgeted
#                                         #   — and that is the REMOTE-GPU branch,
#                                         #   so this knob does not reach it.
#   model_connect_timeout_seconds: 30    # the CONNECT ceiling for the two aiohttp
#                                         #   clients this policy budgeted. aiohttp's
#                                         #   default session carried 30 s; an explicit
#                                         #   ClientTimeout(total=...) drops it and
#                                         #   None means no limit, so bounding those
#                                         #   calls would have removed a ceiling
#                                         #   rather than added one. Raise for slow
#                                         #   DNS or a routed mesh.
#   model_probe_timeout_seconds: 10       # the /v1/models model-id probe.
#                                         #   Degrades to the configured model
#                                         #   id on failure, but a vLLM still
#                                         #   loading weights answers in minutes,
#                                         #   not seconds — and the fallback then
#                                         #   silently picks the wrong id.
#                                         #   Raise it on a remote GPU node.
#   model_detect_ttl: 60                  # TTL of the /v1/models model-id
#                                         #   cache (seconds) — shared by the
#                                         #   Python services and the OKF Node
#                                         #   services. Lower = fresher model
#                                         #   ids, more probes.
#   model_rerank_timeout_seconds: 300     # TEI rerank — no fallback path, so a
#                                         #   tighter budget turns slow successes
#                                         #   into 500s on the chat request
#   model_auth_timeout_seconds: 300    # dataprep's Keycloak service-account
#                                         #   token fetch. NOT the control-plane
#                                         #   30 s: every control-plane write waits
#                                         #   on this token, one attempt, no retry,
#                                         #   no fallback. Already 300 (aiohttp's
#                                         #   default), so this changes nothing —
#                                         #   it makes the value explicit.
#   model_control_plane_timeout_seconds: 30  # doc-repo calls, ingestion-log writes
#   dataprep_llm_phase_timeout_seconds: 900   # wall clock for a whole LLM phase;
#                                         #   must cover the document's WAVES
#                                         #   CONSTRAINT: must stay above BOTH
#                                         #   waves x model_llm_timeout_seconds
#                                         #   (4 x 180 = 720 s at the defaults
#                                         #   above — a 260-chunk document is 65
#                                         #   batches at concurrency 20 = 4 waves
#                                         #   sharing one ceiling, which is what
#                                         #   usually binds) AND
#                                         #   (1 + model_llm_max_retries) x
#                                         #   model_llm_timeout_seconds (540 s).
#                                         #   Below either, chunks fall back per
#                                         #   chunk and the document lands as
#                                         #   'Ingested with Warnings'. That reads
#                                         #   as a labelling-quality regression
#                                         #   rather than a misconfiguration, so
#                                         #   dataprep warns at startup naming both.
#   dataprep_llm_progress_interval_seconds: 60  # how often a phase reports to the
#                                         #   document ingestion log the admin UI reads
#
# There is deliberately no `vllm_timeout` knob, and there must not be one added
# back. The vendored comps graph transformer reads VLLM_TIMEOUT verbatim from
# os.getenv, so a value reaches httpx as a string; httpx 0.28 does not coerce it
# and the client raises TypeError instead of timing out. The graph phase keeps
# comps' own int 600 s default. No template line can reach it in any case —
# compose forwards only keys a service declares in `environment:` — so a knob
# here would be rendered and silently dropped.
# Contextual Retrieval (default ON since v1.5) — per-chunk LLM doc-context prefix
# prepended before embedding + labeling (Anthropic-style). Adds one vLLM
# call/chunk at ingest; never blocks ingestion (raw-chunk fallback). Override in
# group_vars/<env>/vars.yml:
#   contextual_retrieval_enabled: false   # opt-in; flag-off is a true no-op
#   dataprep_contextual_model: ""         # empty = reuse vllm_llm_model_id; must support
#                                         #   guided JSON (response_format=json_object)
#   dataprep_contextual_doc_budget: 100000  # max chars of doc text fed to the context LLM
#   dataprep_contextual_max_tokens: 512   # max OUTPUT tokens for the context LLM (doc-level + per-chunk).
#                                         #   200 truncated the JSON under load → raw-chunk fallback; 512 = safe margin (model stops early ~196).
#   contextual_strategy: doc_level        # doc_level (one call/doc, cheaper) | per_chunk (default — Anthropic recipe)
#                                         #   (one call/doc, N× cheaper, same context on all chunks)
#   contextual_label_raw: false           # decoupled: label RAW chunk, context for embedding only (recommended)

vllm_llm_image: vllm/vllm-openai:v0.29.0
vllm_translation_image: vllm/vllm-openai:v0.29.0
tei_embedding_image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
tei_reranker_image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
docling_serve_image: ghcr.io/docling-project/docling-serve:v1.21.0
nginx_image: nginx:1.28-alpine

# Leave vllm_llm_model_id UNDEFINED for auto-discovery (recommended): the
# services discover whatever model the LLM endpoint serves at /v1/models.
# CAUTION: with the var undefined, the GPU overlay starts the vLLM
# container on its OWN template default, ibm-granite/granite-3.3-2b-instruct
# (docker-compose.gpu.yaml.j2) — a different, smaller model than the
# previously shipped group_vars default (granite-4.1-8b). Set the var to
# pin a name (it must match what the GPU actually serves, or every LLM
# call 404s).
# vllm_llm_model_id: ibm-granite/granite-4.1-8b
vllm_translation_model_id: google/gemma-3-4b-it
embedding_model_id: BAAI/bge-large-en-v1.5
#   (empty = reuse the discovered LLM model, see vllm_llm_model_id above)
# Per-deployer query-instruction overrides for contrastive / instruction-tuned
# embedding models (issue #1035). Built-in table covers BAAI/bge en+zh-v1.5,
# hkunlp/instructor, and nomic-ai/nomic-embed. Use this var to:
#   (a) override a built-in entry, or
#   (b) add a finetune / non-built-in model that needs a custom prefix.
# Comma-separated `substring=instruction` pairs; substring is matched
# case-insensitively against TEI_EMBED_MODEL. Trailing spaces inside the
# instruction value are preserved. Commas inside the instruction value are
# NOT supported (the entry is truncated at the first comma).
# Example: add a Chinese-prefix override for a deployer-specific finetune.
# embedding_query_instructions: "my-org/bge-finetune=Custom instruction: "
reranker_model_id: BAAI/bge-reranker-v2-m3
# --- Reranker strategy defaults ---
#   reranking_strategy: slice           # slice (default; top-N by TEI score) | threshold | adaptive | knee_threshold | slice_threshold
#   reranker_top_n: 3                   # chunks kept for slice/slice_threshold strategies
