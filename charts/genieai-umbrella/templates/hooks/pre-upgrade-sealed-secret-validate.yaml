{{- if .Values.secrets.sealedSecrets.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "genieai-common.fullname" . }}-sealed-secret-validate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" (deepCopy .Values | merge (dict "component" "sealed-secret-validate"))) | nindent 4 }}
  annotations:
    # Pre-upgrade ONLY. A pre-install leg would be vacuous: SealedSecrets
    # are REGULAR resources, applied AFTER every hook — `kubectl get
    # sealedsecret` during pre-install returns an empty list and the
    # hook would exit 0 having checked nothing. Fresh-install sentinel
    # detection instead lives in the chart's helm test, which runs
    # post-install and waits for the K8s Secrets to materialize
    # (sentinel blobs never do — the controller marks the SealedSecret
    # status.conditions[type=Synced].status=False (reason ErrorDecrypt)
    # and CNPG/ArangoDeployment pods hang in `Waiting for secret`; the
    # test's materialization timeout catches it).
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validate
          # Drift check via the K8s API. The bitnami sealed-secrets
          # controller signals an undecryptable SealedSecret via
          # `conditions[type=Synced].status="False"` (reason ErrorDecrypt)
          # — NOT via the `sealedsecrets.bitnami.com/invalid` annotation
          # (that annotation does not exist in the upstream controller).
          # Reading the right field is the difference between a real
          # drift check and a decorative hook that always passes.
          #
          # For each SealedSecret resource the chart rendered:
          #   kubectl get sealedsecret <name> -o json
          #   jq -e '.status.conditions[] |
          #          select(.type=="Synced" and .status=="False")'
          #
          # If any SealedSecret is undecryptable, the controller has
          # refused to materialise the underlying K8s Secret — pods
          # referencing that Secret will start failing. We exit 1 so
          # the upgrade is blocked and the operator re-encrypts
          # (or the PLACEHOLDER sentinels are replaced with real
          # values) before re-running.
          image: bitnami/kubectl:1.33
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ns="{{ .Values.namespace }}"
              invalid=0
              total=0
              # A failed `kubectl get sealedsecret` list must not degrade
              # into a vacuous PASS — capture stderr and exit 1 so the
              # upgrade blocks on an unreadable API instead of skipping
              # the drift check.
              if ! names=$(kubectl get sealedsecret -n "$ns" \
                  -o jsonpath='{.items[*].metadata.name}' 2>&1); then
                echo "FAIL: cannot list SealedSecrets in namespace $ns"
                echo "$names"
                exit 1
              fi
              # The controller signals an undecryptable SealedSecret via
              # conditions[type=Synced].status=False (reason ErrorDecrypt)
              # — the `sealedsecrets.bitnami.com/invalid` annotation does
              # not exist upstream and grepping it matches nothing.
              for name in $names; do
                total=$((total+1))
                # Upstream sealed-secrets API defines ONE condition type:
                # Synced. Undecryptable secrets surface as
                # conditions[type=Synced].status=False (reason ErrorDecrypt).
                cond=$(kubectl get sealedsecret "$name" -n "$ns" \
                  -o jsonpath='{range .status.conditions[?(@.type=="Synced")]}{.status}{end}' 2>/dev/null || true)
                if [ "$cond" = "False" ]; then
                  echo "DRIFT: $name undecryptable (cluster key rotated or sentinel blob; re-encrypt with current public key)"
                  invalid=$((invalid+1))
                fi
              done
              if [ "$total" -eq 0 ]; then
                echo "FAIL: no SealedSecrets found in namespace $ns (expected at least the chart-rendered ones)"
                exit 1
              fi
              if [ "$invalid" -gt 0 ]; then
                echo "FAIL: $invalid SealedSecret resources drifted (of $total total)"
                echo "FAIL: kubeseal --fetch-cert + re-encrypt + commit + push + re-upgrade required"
                exit 1
              fi
              echo "PASS: no drift detected across $total SealedSecret resources"
{{- end -}}
