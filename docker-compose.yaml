# =============================================================================
# GENIE.AI - Docker Compose File (dual-mode: compose up + Swarm)
# =============================================================================
#
# This single compose file supports two deployment modes:
#
# 1. Single-node (docker compose up):
#      docker compose up -d                    # Core services only (no OPEA)
#      docker compose --profile opea --profile gpu-models up -d  # Full stack with OPEA/GPU
#      docker compose --profile observability up -d  # Core + Observability stack
#
# 2. Docker Swarm (docker stack deploy):
#      docker stack deploy -c <resolved> <stack>
#      OPEA services controlled by DEPLOY_OPEA env var (default: 1).
#      Placement constraints require node labels (see below).
#
# Dual-mode notes:
#   - deploy sections (replicas, placement, restart_policy) are Swarm-only;
#     docker compose up ignores them entirely
#   - depends_on is for compose up ordering; Swarm ignores it
#   - restart: is for compose up; Swarm uses deploy.restart_policy
#   - profiles: [opea] controls OPEA orchestrator services in compose up; Swarm ignores profiles
#   - profiles: [gpu-models] controls GPU-heavy services (vllm, tei, tei_reranker,
#     nllb-translate); compose up with --profile gpu-models starts them
#   - Local GPU: --profile opea --profile gpu-models; Remote GPU: --profile opea only
#   - GPU_MODEL_REPLICAS: set to 0 to skip GPU-heavy containers in Swarm (remote GPU node)
#   - Orchestrator endpoints use ${VAR:-default} pattern; override from .env for remote GPU
#   - profiles: [observability] controls Observability stack in compose up; Swarm ignores
#     them and uses ENABLE_OBSERVABILITY env var instead (default: 0 = disabled)
#   - build: enables local builds (docker compose up); Swarm ignores it and uses image:
#   - GPU access via NVIDIA_VISIBLE_DEVICES env var (no runtime: nvidia)
#
# Swarm prerequisites:
#   1. Swarm initialized: docker swarm init
#   2. Node labels: docker node update --label-add gpu=true <gpu-node>
#                docker node update --label-add gateway=true <gateway-node>
#                docker node update --label-add genieai=true <genieai-node>
#   3. Docker login to GitLab Container Registry (all nodes that pull images)
#   4. Images pre-built by CI and pulled from registry automatically
#   5. .env configured (see env template)
# =============================================================================

# Required directories on each target node (create before deploy):
#
# All nodes:
#   ./data/logs/kong            (Kong gateway logs)
#   ./data/logs/backend         (Backend API logs)
#   ./data/logs/doc-repo        (Document Repository logs)
#   ./data/database_backups     (Backend DB dumps)
#   ./data/huggingface          (TEI model cache, GPU nodes only)
#   ./secrets/ssl/              (server.crt, server.key)

volumes:
  kong_data:
  keycloak_data:
  redis_data:
  doc_repo_uploads:
  arango_data: {}
  hf_cache:
  backend_model_cache:
  backend_uploads:
  backend_data:
  certbot-webroot:
  certbot-etc:
  vm-data:
  grafana-data:
  vlogs-data:
  vtraces-data:
  otel-queue:

# Fluentd logging driver configuration for centralized log aggregation.
# All services forward stdout/stderr to the OTel Collector's fluentforward
# receiver (port 24224). Docker dual logging (20.10+) keeps `docker logs`
# functional alongside the fluentd driver. When observability is disabled,
# the collector is not running; fluentd-async prevents container startup
# failures and Docker silently retries in the background.
x-logging: &fluent-logging
  driver: fluentd
  options:
    fluentd-address: "localhost:24224"
    fluentd-async: "true"
    tag: "genie.{{.Name}}"

services:

  # ===========================================================================
  # API Gateway Stack (node.labels.gateway == true)
  # ===========================================================================

  # Kong database (Agrivisory two-postgres layout)
  kong-database:
    logging: *fluent-logging
    image: postgres:16
    networks:
      - genieai_network
    environment:
      - POSTGRES_USER=kong
      - POSTGRES_DB=kong
      - POSTGRES_PASSWORD=${KONG_DB_PASSWORD}
    # Internal only - no external access needed
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong", "-d", "kong"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # Kong database migrations (one-shot init, runs automatically on first start)
  kong-migrations:
    logging: *fluent-logging
    image: kong:3.9.3
    restart: "no"
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - genieai_network
    environment:
      - KONG_DATABASE=${KONG_DATABASE:-postgres}
      - KONG_PG_HOST=${KONG_PG_HOST:-kong-database}
      - KONG_PG_USER=${KONG_PG_USER:-kong}
      - KONG_PG_PASSWORD=${KONG_DB_PASSWORD}
    command: >
      bash -c "
        echo 'Waiting for PostgreSQL...' &&
        for i in $$(seq 1 30); do pg_isready -h ${KONG_PG_HOST:-kong-database} -U ${KONG_PG_USER:-kong} -q 2>/dev/null && break; sleep 2; done &&
        kong migrations bootstrap 2>/dev/null ||
        kong migrations up &&
        kong migrations finish
      "
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Kong routes/services/plugins configuration (one-shot init, runs after Kong is ready)
  kong-config:
    logging: *fluent-logging
    restart: "no"
    depends_on:
      kong:
        condition: service_healthy
    # Mount (not bake) the config: restore PUT-reconciles by name, so a stale
    # image layer silently reverted route changes (strip_path incident, S2)
    volumes:
      - ./api-gateway-solution/new-config/kong_config.json:/opt/kong-config/kong_config.json:ro
    build: api-gateway-solution/new-config/
    image: ${GENIE_AI_KONG_CONFIG_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-kong-config}:${GENIE_AI_KONG_CONFIG_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    networks:
      - genieai_network
    environment:
      - KONG_ADMIN_URL=http://kong:8001
      - KONG_PUBLIC_URL=http://kong:8000
      - TARGET_HOST=backend
      - TARGET_PORT=3000
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
    command: ["-b", "/opt/kong-config/kong_config.json"]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  kong:
    logging: *fluent-logging
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    image: kong:3.9.3
    environment:
      - KONG_DATABASE=${KONG_DATABASE:-postgres}
      - KONG_PG_HOST=${KONG_PG_HOST:-kong-database}
      - KONG_PG_USER=${KONG_PG_USER:-kong}
      - KONG_PG_PASSWORD=${KONG_DB_PASSWORD}
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=${KONG_ADMIN_LISTEN:-0.0.0.0:8001, 0.0.0.0:8444 ssl}
      - KONG_DNS_RESOLVER=${KONG_DNS_RESOLVER:-127.0.0.11}
      - KONG_DNS_ORDER=${KONG_DNS_ORDER:-LAST,A,AAAA,CNAME}
      - KONG_DNS_STALE_TTL=${KONG_DNS_STALE_TTL:-5}
      - KONG_NGINX_DAEMON=off
      - KONG_TRACING_INSTRUMENTATIONS=${KONG_TRACING_INSTRUMENTATIONS:-request}
      - KONG_TRACING_SAMPLING_RATE=${KONG_TRACING_SAMPLING_RATE:-1.0}
      # Trust nginx (Docker network) to send correct X-Forwarded-* headers.
      # Kong is internal-only; nginx on the same network is the TLS termination layer.
      # Restrict to Docker bridge subnet to prevent header spoofing from outside.
      - KONG_TRUSTED_IPS=${KONG_TRUSTED_IPS:-172.16.0.0/12}
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - genieai_network
    # Kong proxy - internal only. All external traffic routes through nginx:80/443.
    # Uncomment for debugging direct Kong access (bypasses nginx security):
    # ports:
    #   - "${KONG_PROXY_PORT:-8000}:8000"
    #   - "${KONG_HTTPS_PORT:-8443}:8443"
    # Kong admin API - internal only (accessible via docker exec for post-deploy config)
    # ports:
    #   - "8001:8001"
    volumes:
      - "${DATA_DIR:-./data}/logs/kong:/var/log/kong"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  nginx:
    logging: *fluent-logging
    depends_on:
      kong:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    build: api-gateway-solution/nginx/
    image: ${GENIE_AI_NGINX_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-nginx}:${GENIE_AI_NGINX_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    ports:
      - target: 80
        published: ${NGINX_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${NGINX_HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    environment:
      - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
      - NGINX_CERT_MODE=${NGINX_CERT_MODE:-selfsigned}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-443}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
      - KONG_PROXY_HOST=${KONG_PROXY_HOST:-kong}
      - NGINX_FRONTEND_HOST=${NGINX_FRONTEND_HOST:-frontend}
      - NGINX_FRONTEND_PORT=${NGINX_FRONTEND_PORT:-8090}
      - NGINX_PERMISSIONS_POLICY=${NGINX_PERMISSIONS_POLICY:-camera=(), microphone=(), geolocation=()}
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost/ | grep -qE '^[23]' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./secrets/ssl:/etc/nginx/ssl:ro  # directory mount — tracks inode changes from certbot renewals
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # ===========================================================================
  # Let's Encrypt Certificate Management (optional)
  # ===========================================================================
  # Activated via: --profile letsencrypt (compose up) or CERTBOT_REPLICAS=1 (Swarm)
  # Requires: CERTBOT_EMAIL set in .env

  certbot:
    logging: *fluent-logging
    profiles: [letsencrypt]
    restart: unless-stopped
    image: certbot/certbot:v5.7.0
    entrypoint: ["/certbot-entrypoint.sh"]
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-false}
    volumes:
      - ./api-gateway-solution/certbot/entrypoint.sh:/certbot-entrypoint.sh:ro
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
      - ./secrets/ssl:/secrets/ssl:rw
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - genieai_network
    deploy:
      replicas: ${CERTBOT_REPLICAS:-0}
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
  # ===========================================================================

  frontend:
    logging: *fluent-logging
    restart: unless-stopped
    # No build args: auth/API endpoints are runtime config (docker-entrypoint.sh
    # writes /app/dist/config.js from the environment below) — upstream v2.0.1 shape
    build: components/gov-chat-frontend/
    image: ${GENIE_AI_FRONTEND_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-frontend}:${GENIE_AI_FRONTEND_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - PORT=8090
      - VUE_APP_API_URL=${VUE_APP_API_URL:-/api}
      - VUE_PROXY_HOST=${VUE_PROXY_HOST:-localhost}
      - VUE_APP_CSP_CONNECT_SRC=${VUE_APP_CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
      - VUE_APP_AVAILABLE_LOCALES=${VUE_APP_AVAILABLE_LOCALES:-}
      - VUE_APP_KEYCLOAK_URL=${VUE_APP_KEYCLOAK_URL:-https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth}
      - VUE_APP_KEYCLOAK_REALM=${KEYCLOAK_REALM:-agrivisory}
      - VUE_APP_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-itu-agrivisory-client}
    # Port 8090 is internal only - outer nginx on 80/443 is the public entry point
    # ports:
    #   - "${FRONTEND_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  redis-cache:
    logging: *fluent-logging
    restart: unless-stopped
    image: redis:7-alpine
    # Internal only - no host port mapping needed
    # ports:
    #   - "${TRANSLATION_CACHE_PORT:-6379}:6379"
    environment:
      - REDISCLI_AUTH=${TRANSLATION_CACHE_PASSWORD}
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${TRANSLATION_CACHE_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  db-migrations:
    logging: *fluent-logging
    restart: "no"
    depends_on:
      arango-vector-db:
        condition: service_healthy
    build:
      context: .
      dockerfile: components/gov-chat-backend/Dockerfile.migrations
    image: ${GENIE_AI_DB_MIGRATIONS_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-db-migrations}:${GENIE_AI_DB_MIGRATIONS_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    networks:
      - genieai_network
    environment:
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  backend:
    logging: *fluent-logging
    depends_on:
      arango-vector-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    build:
      context: components/
      dockerfile: gov-chat-backend/Dockerfile
    image: ${GENIE_AI_BACKEND_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-backend}:${GENIE_AI_BACKEND_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    # Swarm: internal only - access via Kong proxy
    # ports:
    #   - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - "${DATA_DIR:-./data}/database_backups:/app/database_backups"
      - "${DATA_DIR:-./data}/logs/backend:/app/logs"
      - backend_data:/app/data
      - backend_uploads:/app/Uploads
      # D4b: persistent NLLB/transformers.js model cache (dedicated volume — NOT
      # hf_cache, which the GPU services share; teardown/prune of one tenant
      # must not evict the other's)
      - backend_model_cache:/cache/models
      # K.1: runtime-editable pipeline settings — backend is the WRITER (rw);
      # chatqna/retriever/reranker mount the same dir :ro. Lives under ./data
      # so prepare-tag rsync (--exclude=data) never clobbers admin edits.
      # Plain local compose runs: cp configs/pipeline/*.seed.json
      # data/pipeline-settings/ first (the deploy's prepare tag does this on
      # the box; locally it is your one manual step).
      - ${DATA_DIR:-./data}/pipeline-settings:/configs/pipeline
    # Allow backend to resolve NGINX_PUBLIC_DOMAIN (e.g. localhost) to the Docker host,
    # so OIDC discovery and JWKS fetches reach NGINX (which publishes 80/443 via mode: host).
    extra_hosts:
      - "${NGINX_PUBLIC_DOMAIN:-localhost}:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      # Secrets (required, no defaults in code)
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_USER=${ARANGO_USER:-root}
      # Keycloak OIDC discovery — must use the public URL (via NGINX proxy),
      # not the internal Docker URL, so the issuer matches the JWT's iss claim.
      - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-agrivisory}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-itu-agrivisory-client}
      # Additional Keycloak realms for multi-realm token validation (JSON map: {"realm":"client-id"})
      # NOTE: Docker Swarm ${VAR:-{}} breaks due to nested braces. Use env file or set empty string.
      - KEYCLOAK_ADDITIONAL_REALMS
      # Keycloak proxy service account — restricted permissions for user/role management
      - KEYCLOAK_PROXY_CLIENT_ID=genie-proxy-client
      - KEYCLOAK_PROXY_CLIENT_SECRET=${KEYCLOAK_PROXY_CLIENT_SECRET}
      # TLS verification for backend → NGINX OIDC discovery/JWKS fetches.
      # Default: 1 (strict, for production). Set to 0 in .env for dev with self-signed certs.
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      # Translation cache (required, no default in code)
      - TRANSLATION_CACHE=${TRANSLATION_CACHE:-on}
      - TRANSLATION_CACHE_HOST=${TRANSLATION_CACHE_HOST:-redis-cache}
      - TRANSLATION_CACHE_PORT=${TRANSLATION_CACHE_PORT:-6379}
      - TRANSLATION_CACHE_PASSWORD=${TRANSLATION_CACHE_PASSWORD}
      # Translation backend model ID — facebook/nllb-200-3.3B drives the dedicated
      # nllb-translate sidecar (DEC-25); also displayed on the admin dashboard.
      - VLLM_TRANSLATION_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-facebook/nllb-200-3.3B}
      # NLLB sidecar (GPU batch translation); auto mode falls back to CPU Xenova
      # when the sidecar is down at backend init (init-time selection only)
      - NLLB_TRANSLATE_URL=${NLLB_TRANSLATE_URL:-http://nllb-translate:9201}
      # Remote GPU node translation endpoint override (empty in local mode)
      - VLLM_TRANSLATION_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT:-}
      # Stream the target-language translation during chat (#829): stream the UI
      # language while generating instead of English-then-flip. 0 = current behavior.
      - STREAMING_TRANSLATION_ENABLED=${STREAMING_TRANSLATION_ENABLED:-0}
      # OPEA runtime patches for remote GPU node (SSL bypass)
      - OPEA_SSL_SKIP_VERIFY=${OPEA_SSL_SKIP_VERIFY:-}
      # GPU node API key for Authorization: Bearer (translation, vLLM calls)
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      # Email configuration (required)
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE:-}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # OPEA AI/ML service override (code default is deployment-specific: 'e2e-109-198')
      - OPEA_HOST=${OPEA_HOST:-chatqna-xeon-backend-server}
      # Conversation mode: conversation-with-context-labels (full context) or single-message (legacy)
      - CONTEXT_OPTION=${CONTEXT_OPTION:-conversation-with-context-labels}
      # Logging (error, warn, info, debug)
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # CORS (deployment-specific, localhost defaults)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8090,http://127.0.0.1:8090,https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
      # Agrivisory product additions (consumed by replica backend code)
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-genie-ai}
      # A5: the A3 stopgaps (KEYCLOAK_JWKS_URI / KEYCLOAK_TOKEN_URL / KEYCLOAK_EXTERNAL_URL)
      # are retired — the jose verifier reaches discovery via KEYCLOAK_URL (public door,
      # extra_hosts host-gateway below; self-signed local stacks set NODE_TLS_REJECT_UNAUTHORIZED=0).
      # A5 also retired KEYCLOAK_INTERNAL_URL and the local-password signing/expiry/session
      # secrets — every consumer died with auth-service/keycloak-auth-routes (the
      # jose verifier needs no shared secret; chatqna/dataprep keep their own internal URLs).
      - USER_APPROVAL_REQUIRED=${USER_APPROVAL_REQUIRED:-true}
      - SESSION_EXPIRATION_TIME=${SESSION_EXPIRATION_TIME:-1800000}
      - APP_NAME=${APP_NAME:-Agrivisory}
      - BACKEND_PORT=3000
      - API_PREFIX=${API_PREFIX:-/api}
      - NODE_ENV=${NODE_ENV:-production}
      - MAX_SOCKETS=${MAX_SOCKETS:-100}
      - MAX_FREE_SOCKETS=${MAX_FREE_SOCKETS:-50}
      - UV_THREADPOOL_SIZE=${UV_THREADPOOL_SIZE:-128}
      - BACKUP_DIR=${BACKUP_DIR:-./database_backups}
      - MAX_BACKUPS=${MAX_BACKUPS:-5}
      - BACKUP_FORMAT=${BACKUP_FORMAT:-json}
      - COMPRESS_BACKUPS=${COMPRESS_BACKUPS:-true}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8090}
      # NLLB CPU translation (Sesotho)
      - TRANSLATION_BACKEND=${TRANSLATION_BACKEND:-auto}
      - TRANSLATION_CPU_MODEL_ID=${TRANSLATION_CPU_MODEL_ID:-Xenova/nllb-200-distilled-600M}
      - TRANSLATION_THREADS=${TRANSLATION_THREADS:-4}
      - TRANSLATION_BATCHES=${TRANSLATION_BATCHES:-5}
      - TRANSLATION_SERVICE_HOST_IP=${TRANSLATION_SERVICE_HOST_IP:-vllm}
      - TRANSLATION_SERVICE_PORT=${TRANSLATION_SERVICE_PORT:-8000}
      # Weather-aware RAG (Open-Meteo)
      - WEATHER_AUGMENTATION_ENABLED=${WEATHER_AUGMENTATION_ENABLED:-true}
      - WEATHER_DEFAULT_LATITUDE=${WEATHER_DEFAULT_LATITUDE:--29.3167}
      - WEATHER_DEFAULT_LONGITUDE=${WEATHER_DEFAULT_LONGITUDE:-27.4833}
      - WEATHER_CACHE_TTL_SECONDS=${WEATHER_CACHE_TTL_SECONDS:-900}
      - WEATHER_FORECAST_DAYS=${WEATHER_FORECAST_DAYS:-7}
      # Admin dashboard GPU probe (product code reads VLLM_GPU_UTIL)
      - VLLM_GPU_UTIL=${VLLM_GPU_UTIL:-0.9}
      # Audit F7: the admin AI-config card + persisted-query llmModel read
      # these — the backend container never received them ("Not configured"
      # + llmModel 'unknown' while the models ran fine). Defaults = the
      # local single-box topology; .env overrides flow for remote-GPU mode.
      - VLLM_LLM_MODEL_ID=${VLLM_LLM_MODEL_ID:-ibm-granite/granite-4.1-8b}
      - VLLM_ENDPOINT=${VLLM_ENDPOINT:-http://vllm:8000}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-65536}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      - TEI_EMBEDDING_ENDPOINT=${TEI_EMBEDDING_ENDPOINT:-http://tei:80}
      - RERANKER_MODEL_ID=${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      - RERANKER_SERVER_HOST_IP=${RERANKER_SERVER_HOST_IP:-tei_reranker}
      - RERANKER_SERVER_PORT=${RERANKER_SERVER_PORT:-80}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # K.1: pipeline settings file paths (file = SSOT once seeded; env names
      # the file only) — written by this service, read by the pipeline below.
      - LLM_SETTINGS_CONFIG=/configs/pipeline/llm-settings.json
      - RAG_TUNING_CONFIG=/configs/pipeline/rag-tuning.json
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  document-repository:
    logging: *fluent-logging
    depends_on:
      arango-vector-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: components/
      dockerfile: document-repository/Dockerfile
    image: ${GENIE_AI_DOCUMENT_REPOSITORY_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-document-repository}:${GENIE_AI_DOCUMENT_REPOSITORY_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      # Secrets (required, no defaults in code)
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_URL=http://arango-vector-db:8529
      - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      - KC_REALM=${KEYCLOAK_REALM:-agrivisory}
      - KC_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-itu-agrivisory-client}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # TLS verification for document-repository → NGINX OIDC discovery/JWKS fetches.
      # Default: 1 (strict, for production). Set to 0 in .env for dev with self-signed certs.
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      # Agrivisory product additions (consumed by replica doc-repo code)
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-genie-ai}
      # A5: doc-repo verifies tokens via Keycloak JWKS
      # (src/middlewares/keycloak-auth-middleware.js) using KEYCLOAK_URL/KC_REALM above.
      - DOC_REPO_PORT=${DOC_REPO_PORT:-3001}
      - DOC_REPO_URL=${DOC_REPO_URL:-http://document-repository:3001}
      - DOCUMENT_INGESTION_LANGUAGE=${DOCUMENT_INGESTION_LANGUAGE:-en}
      - DATAPREP_HOST=${DATAPREP_HOST:-http://dataprep-arango-service}
      - DATAPREP_PORT=${DATAPREP_PORT:-5000}
      - MAX_FILES_UPLOAD=${MAX_FILES_UPLOAD:-10}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-10}
      - LOG_FILE=${LOG_FILE:-app.log}
      - VIRUS_SCANNING=${VIRUS_SCANNING:-true}
      - CLAMSCAN_REMOVE_INFECTED=${CLAMSCAN_REMOVE_INFECTED:-false}
      - CLAMSCAN_QUARANTINE_INFECTED=${CLAMSCAN_QUARANTINE_INFECTED:-false}
      - CLAMSCAN_DEBUG_MODE=${CLAMSCAN_DEBUG_MODE:-false}
      - CLAMSCAN_SOCKET=${CLAMSCAN_SOCKET:-false}
      - CLAMSCAN_HOST=${CLAMSCAN_HOST:-clamav}
      - CLAMSCAN_PORT=${CLAMSCAN_PORT:-3310}
      - CLAMSCAN_TIMEOUT=${CLAMSCAN_TIMEOUT:-60000}
      - CLAMSCAN_LOCAL_FALLBACK=${CLAMSCAN_LOCAL_FALLBACK:-true}
      - CLAMSCAN_PATH=${CLAMSCAN_PATH:-/usr/bin/clamdscan}
      - CLAMSCAN_ACTIVE=${CLAMSCAN_ACTIVE:-true}
      - CRAWLER_POLL_INTERVAL_MS=${CRAWLER_POLL_INTERVAL_MS:-5000}
      - CRAWLER_MAX_PAGES=${CRAWLER_MAX_PAGES:-5000}
      - CRAWLER_WORKER_CONCURRENCY=${CRAWLER_WORKER_CONCURRENCY:-10}
    # Allow document-repository to resolve NGINX_PUBLIC_DOMAIN (e.g. localhost) to the
    # Docker host, so OIDC discovery and JWKS fetches reach NGINX for JWT validation.
    extra_hosts:
      - "${NGINX_PUBLIC_DOMAIN:-localhost}:host-gateway"
    # Internal only - no host port mapping needed
    # ports:
    #   - "${DOC_REPO_PORT:-3001}:3001"
    networks:
      - genieai_network
    volumes:
      - "${DATA_DIR:-./data}/logs/doc-repo:/app/logs"
      - doc_repo_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  clamav:
    logging: *fluent-logging
    restart: unless-stopped
    image: clamav/clamav:stable-debian
    # Internal only
    # ports:
    #   - "3310:3310"
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3310 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  arango-vector-db:
    logging: *fluent-logging
    restart: unless-stopped
    image: arangodb/arangodb:3.12.4
    ports:
      - target: 8529
        published: ${ARANGO_PORT:-8529}
        protocol: tcp
        mode: host
        # Audit F6: loopback-bound by default — the DB must not answer the
        # internet (live-confirmed reachable on :8529). Override ARANGO_BIND_IP
        # only with a firewall in front of it.
        host_ip: ${ARANGO_BIND_IP:-127.0.0.1}
    volumes:
      - arango_data:/var/lib/arangodb3
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    command: ["--experimental-vector-index=true"]
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.username root --server.password \"${ARANGO_PASSWORD}\" --javascript.execute-string \"db._version();\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10


  # ===========================================================================
  # GPU Model Services (profile: gpu-models, node.labels.gpu == true)
  # Skip with: Compose --profile opea only, or Swarm GPU_MODEL_REPLICAS=0
  # ===========================================================================

  vllm:
    logging: *fluent-logging
    profiles: [gpu-models]
    restart: unless-stopped
    image: ${VLLM_LLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    # Swarm: internal only - access via Kong or docker exec
    # ports:
    #   - "${LLM_SERVER_PORT:-8000}:8000"
    command: >
      --model ${VLLM_LLM_MODEL_ID:-ibm-granite/granite-4.1-8b}
      --gpu_memory_utilization ${VLLM_GPU_UTILIZATION:-0.80}
      --served-model-name ${VLLM_LLM_MODEL_ID:-ibm-granite/granite-4.1-8b}
      --max_model_len ${VLLM_MAX_MODEL_LEN:-65536}
      --max_num_seqs ${VLLM_MAX_NUM_SEQS:-64}
      --dtype=${VLLM_DTYPE:-half}
      --enforce-eager
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      replicas: ${GPU_MODEL_REPLICAS:-${DEPLOY_OPEA:-1}}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  textgen:
    logging: *fluent-logging
    profiles: [opea]
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/textgen/Dockerfile-textgen_genie-ai
    image: ${GENIE_AI_TEXTGEN_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-textgen}:${GENIE_AI_TEXTGEN_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - LLM_ENDPOINT=${VLLM_ENDPOINT:-http://vllm:8000}
      - LLM_MODEL_ID=${VLLM_LLM_MODEL_ID:-ibm-granite/granite-4.1-8b}
      - OPEA_SSL_SKIP_VERIFY=${OPEA_SSL_SKIP_VERIFY:-0}

    # Internal only
    # ports:
    #   - "9000:9000"
    networks:
      - genieai_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  # NLLB-200 GPU translation sidecar (DEC-25/F6): dedicated transformers service —
  # NLLB selects target language via FLORES-200 codes (src_lang/forced_bos_token_id),
  # which the OpenAI-compatible vLLM API cannot express, and vLLM 0.30 deterministically
  # hangs after multimodal warmup for every translation model tried on this box (F14).
  # Local build (DEC-9 pattern): base image carries the Blackwell sm_120 torch pin.
  nllb-translate:
    logging: *fluent-logging
    profiles: [gpu-models]
    restart: unless-stopped
    build: genie-ai-overlay/nllb-translate/
    image: ${GENIE_AI_NLLB_TRANSLATE_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-nllb-translate}:${GENIE_AI_NLLB_TRANSLATE_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    # Internal only
    # ports:
    #   - "9201:9201"
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - genieai_network
    healthcheck:
      # /health answers 503 until the model finishes loading (lazy-load thread)
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9201/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      # first boot downloads ~6.6 GB; warm starts load in ~1-2 min
      start_period: 600s
    deploy:
      replicas: ${GPU_MODEL_REPLICAS:-${DEPLOY_OPEA:-1}}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  translation:
    logging: *fluent-logging
    profiles: [opea]
    restart: unless-stopped
    image: opea/translation:1.3
    environment:
      - LLM_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT:-http://vllm-translation-guardrail:9031}
      - LLM_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-qvac/TranslatePsy-AfriSLM-4B}
    # Internal only
    # ports:
    #   - "8888:8888"
    networks:
      - genieai_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${GPU_MODEL_REPLICAS:-${DEPLOY_OPEA:-1}}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  guardrail:
    logging: *fluent-logging
    profiles: [opea]
    restart: unless-stopped
    image: opea/guardrails:1.5
    environment:
      - LLM_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT:-http://vllm-translation-guardrail:9031}
      - LLM_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-qvac/TranslatePsy-AfriSLM-4B}
      - SAFETY_GUARD_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-qvac/TranslatePsy-AfriSLM-4B}
      - GUARDRAILS_COMPONENT_NAME=OPEA_LLM_GUARD
    # Internal only
    # ports:
    #   - "${GUARDRAIL_SERVICE_PORT}:${GUARDRAIL_SERVICE_PORT}"
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  tei:
    logging: *fluent-logging
    profiles: [gpu-models]
    restart: unless-stopped
    image: ${TEI_EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:120-1.9}
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${EMBEDDING_MODEL_ID:-BAAI/bge-m3} --auto-truncate"
    # Internal only
    # ports:
    #   - "${TEI_EMBEDDING_PORT:-7000}:80"
    volumes:
      - "${DATA_DIR:-./data}/huggingface:/data"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 6s
      retries: 48
    networks:
      - genieai_network
    deploy:
      replicas: ${GPU_MODEL_REPLICAS:-${DEPLOY_OPEA:-1}}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  embedding:
    logging: *fluent-logging
    profiles: [opea]
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/embedding/Dockerfile-embedding_genie-ai
    image: ${GENIE_AI_EMBEDDING_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-embedding}:${GENIE_AI_EMBEDDING_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - EMBEDDING_MODEL_ENDPOINT=${EMBEDDING_SERVICE_URL:-http://tei:80}
      - TEI_EMBEDDING_ENDPOINT=${EMBEDDING_SERVICE_URL:-http://tei:80}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      - HF_TOKEN=${VLLM_API_KEY:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - OPEA_SSL_SKIP_VERIFY=${OPEA_SSL_SKIP_VERIFY:-0}

    # Internal only
    # ports:
    #   - "6000:6000"
    networks:
      - genieai_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6000/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  tei_reranker:
    logging: *fluent-logging
    profiles: [gpu-models]
    restart: unless-stopped
    image: ${TEI_RERANKING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:120-1.9}
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3} --max-batch-tokens ${TEI_RERANKING_MAX_BATCH_TOKENS:-1024} --max-concurrent-requests ${TEI_RERANKING_MAX_CONCURRENT_REQUESTS:-128} --auto-truncate"
    # Internal only
    # ports:
    #   - "7100:80"
    volumes:
      - "${DATA_DIR:-./data}/huggingface:/data"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 6s
      retries: 48
    networks:
      - genieai_network
    deploy:
      replicas: ${GPU_MODEL_REPLICAS:-${DEPLOY_OPEA:-1}}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  reranker:
    logging: *fluent-logging
    profiles: [opea]
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/reranker/Dockerfile-reranker_genie-ai
    image: ${GENIE_AI_RERANKER_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-reranker}:${GENIE_AI_RERANKER_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - TEI_RERANKING_ENDPOINT=${RERANKER_SERVICE_URL:-http://tei_reranker:80}
      - RERANK_COMPONENT_NAME=GENIE_TEI_RERANKING
      - HF_TOKEN=${VLLM_API_KEY:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - OPEA_SSL_SKIP_VERIFY=${OPEA_SSL_SKIP_VERIFY:-0}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # Adaptive utility-cost selection (K.3: seed tier — rag-tuning.json owns
      # the runtime values; only used when RERANKING_STRATEGY=adaptive)
      - NOVELTY_SIGMOID_A=${NOVELTY_SIGMOID_A:-20.0}
      - NOVELTY_SIGMOID_B=${NOVELTY_SIGMOID_B:-0.25}
      - CONTEXT_DECAY_FACTOR=${CONTEXT_DECAY_FACTOR:-0.0025}
      - MIN_VALUE_THRESHOLD=${MIN_VALUE_THRESHOLD:--1.0}
      # K.1: runtime-editable RAG tuning (read-only reader; backend writes).
      - RAG_TUNING_CONFIG=/configs/pipeline/rag-tuning.json

    # Internal only
    # ports:
    #   - "6100:8000"
    volumes:
      # K.1: shared pipeline-settings dir, read-only for pipeline readers.
      - ${DATA_DIR:-./data}/pipeline-settings:/configs/pipeline:ro
    networks:
      - genieai_network
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  dataprep-arango-service:
    logging: *fluent-logging
    profiles: [opea]
    depends_on:
      arango-vector-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/dataprep/Dockerfile-dataprep_genie-ai
    image: ${GENIE_AI_DATAPREP_ARANGO_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-dataprep-arango}:${GENIE_AI_DATAPREP_ARANGO_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    # Internal only
    # ports:
    #   - "5000:5000"
    environment:
      DATAPREP_COMPONENT_NAME: GENIE_DATAPREP_ARANGODB
      VLLM_MODEL_ID: ${VLLM_LLM_MODEL_ID:-ibm-granite/granite-4.1-8b}
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://vllm:8000}
      GPU_NODE_HOST: ${GPU_NODE_HOST:-}
      TEI_EMBEDDING_ENDPOINT: ${EMBEDDING_SERVICE_URL:-http://tei:80}
      GUARDRAIL_URL: http://guardrail:9090/v1/guardrails
      ARANGO_URL: http://arango-vector-db:8529
      ARANGO_DB: ${ARANGO_DB:-genie-ai}
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME:-GRAPH}
      ARANGO_USERNAME: ${ARANGO_USERNAME:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD}
      DOCUMENT_REPOSITORY_URL: http://document-repository:3001
      BACKEND_SERVICE_URL: http://backend:3000
      KEYCLOAK_URL: https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KC_REALM: ${KEYCLOAK_REALM:-agrivisory}
      KC_DATAPREP_CLIENT_ID: ${KC_DATAPREP_CLIENT_ID:-dataprep-service-client}
      KC_DATAPREP_CLIENT_SECRET: ${KC_DATAPREP_CLIENT_SECRET:-}
      LABELING_STRATEGY: ${LABELING_STRATEGY:-llm}
      EMBEDDING_LABEL_THRESHOLD: ${EMBEDDING_LABEL_THRESHOLD:-0.75}
      BM25_LABEL_THRESHOLD: ${BM25_LABEL_THRESHOLD:-2.00}
      CONTENT_EXTRACTION_METHOD: ${CONTENT_EXTRACTION_METHOD:-docling}
      DATAPREP_MAX_CONCURRENT_BATCHES: ${DATAPREP_MAX_CONCURRENT_BATCHES:-20}
      # I.3: ONE chunk-size knob for all file types (code inherits it per-extension).
      DATAPREP_CHUNK_SIZE: ${DATAPREP_CHUNK_SIZE:-3000}
      DATAPREP_CHUNK_OVERLAP: ${DATAPREP_CHUNK_OVERLAP:-300}
      DATAPREP_LLM_LABEL_BATCH_SIZE: ${DATAPREP_LLM_LABEL_BATCH_SIZE:-4}
      DOCLING_DEVICE: ${DOCLING_DEVICE:-cpu}
      DOCLING_ENDPOINT: ${DOCLING_ENDPOINT:-}
      LABEL_SELECTOR_SYSTEM_PROMPT: ${LABEL_SELECTOR_SYSTEM_PROMPT:-}
      CONTEXTUAL_RETRIEVAL_ENABLED: ${CONTEXTUAL_RETRIEVAL_ENABLED:-true}
      DATAPREP_CONTEXTUAL_MODEL: ${DATAPREP_CONTEXTUAL_MODEL:-}
      DATAPREP_CONTEXTUAL_DOC_BUDGET: ${DATAPREP_CONTEXTUAL_DOC_BUDGET:-6000}
      DATAPREP_CONTEXTUAL_DOC_BUDGET_DOC_LEVEL: ${DATAPREP_CONTEXTUAL_DOC_BUDGET_DOC_LEVEL:-100000}
      DATAPREP_CONTEXTUAL_MAX_TOKENS: ${DATAPREP_CONTEXTUAL_MAX_TOKENS:-512}
      CONTEXTUAL_RETRIEVAL_PROMPT: ${CONTEXTUAL_RETRIEVAL_PROMPT:-}
      CONTEXTUAL_STRATEGY: ${CONTEXTUAL_STRATEGY:-doc_level}
      CONTEXTUAL_LABEL_RAW: ${CONTEXTUAL_LABEL_RAW:-true}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OPEA_SSL_SKIP_VERIFY: ${OPEA_SSL_SKIP_VERIFY:-0}
      # Required by OPEA arangodb _initialize_embeddings() to use remote TEI
      # endpoint instead of downloading a local model (default: BAAI/bge-m3).
      # F3: dataprep/retriever now use TEI unconditionally (no token gate); this token
      # is only the front-door API key for remote-GPU topology (gpu-proxy auth).
      # is None, so the code falls through to the local model branch.
      HUGGINGFACEHUB_API_TOKEN: ${VLLM_API_KEY:-}

      KEYCLOAK_SSL_SKIP_VERIFY: ${KEYCLOAK_SSL_SKIP_VERIFY:-0}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # K.2: ingest prompts (label selector, contextual retrieval) read the
      # admin-editable LLM settings file at ingest time.
      LLM_SETTINGS_CONFIG: /configs/pipeline/llm-settings.json
    # K.1/K.2: shared pipeline-settings dir, read-only for pipeline readers
    # (the backend mounts it rw and is the only writer). Plain `docker compose
    # up` without the ansible seed step starts with an empty dir → readers WARN
    # once and use their coded defaults (by design, K.1 law).
    volumes:
      - ${DATA_DIR:-./data}/pipeline-settings:/configs/pipeline:ro
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  retriever-arango-service:
    logging: *fluent-logging
    profiles: [opea]
    depends_on:
      arango-vector-db:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/retriever/Dockerfile-retriever_genie-ai
    image: ${GENIE_AI_RETRIEVER_ARANGO_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-retriever-arango}:${GENIE_AI_RETRIEVER_ARANGO_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    # Internal only
    # ports:
    #   - "7025:7025"
    environment:
      # ArangoDB connection
      ARANGO_URL: http://arango-vector-db:8529
      ARANGO_DB: ${ARANGO_DB:-genie-ai}
      ARANGO_USERNAME: ${ARANGO_USERNAME:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD}
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME:-GRAPH}
      # Vector search tuning
      RETRIEVER_COMPONENT_NAME: GENIE_RETRIEVER_ARANGODB
      # Retriever query params — INERT in production: chatqna forwards each of
      # these (k, fetch_k, score_threshold, lambda_mult, search_start, traversal_*)
      # in the HTTP request body, so this env block is only reached on direct
      # retriever API calls that bypass chatqna (debugging/probes). Keep defaults
      # identical to the chatqna block to avoid silent drift.
      RETRIEVER_ARANGO_K: ${RETRIEVER_ARANGO_K:-20}
      RETRIEVER_ARANGO_FETCH_K: ${RETRIEVER_ARANGO_FETCH_K:-30}
      RETRIEVER_ARANGO_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_SCORE_THRESHOLD:-0.2}
      RETRIEVER_ARANGO_DISTANCE_THRESHOLD: ${RETRIEVER_ARANGO_DISTANCE_THRESHOLD:-1}
      RETRIEVER_ARANGO_LAMBDA_MULT: ${RETRIEVER_ARANGO_LAMBDA_MULT:-0.5}
      RETRIEVER_ARANGO_SEARCH_START: ${RETRIEVER_ARANGO_SEARCH_START:-chunk}
      RETRIEVER_ARANGO_SEARCH_MODE: ${RETRIEVER_ARANGO_SEARCH_MODE:-vector}
      RETRIEVER_ARANGO_USE_APPROX_SEARCH: ${RETRIEVER_ARANGO_USE_APPROX_SEARCH:-false}
      RETRIEVER_ARANGO_DISTANCE_STRATEGY: ${RETRIEVER_ARANGO_DISTANCE_STRATEGY:-COSINE}
      RETRIEVER_ARANGO_NUM_CENTROIDS: ${RETRIEVER_ARANGO_NUM_CENTROIDS:-1}
      RETRIEVER_HYBRID_RETRIEVAL_ENABLED: ${RETRIEVER_HYBRID_RETRIEVAL_ENABLED:-true}
      RETRIEVER_HYBRID_RRF_K: ${RETRIEVER_HYBRID_RRF_K:-60}
      RETRIEVER_HYBRID_BM25_CANDIDATES: ${RETRIEVER_HYBRID_BM25_CANDIDATES:-50}
      RETRIEVER_HYBRID_DENSE_WEIGHT: ${RETRIEVER_HYBRID_DENSE_WEIGHT:-1.0}
      RETRIEVER_HYBRID_LEXICAL_WEIGHT: ${RETRIEVER_HYBRID_LEXICAL_WEIGHT:-1.0}
      RETRIEVER_HYBRID_BM25_ANALYZER: ${RETRIEVER_HYBRID_BM25_ANALYZER:-text_en}
      RETRIEVER_ARANGO_FILTER_STRATEGY: ${RETRIEVER_ARANGO_FILTER_STRATEGY:-OR}
      # Reranker strategy — "adaptive" makes the retriever fetch chunk embeddings
      # for the adaptive reranker (keep aligned with chatqna's RERANKING_STRATEGY).
      RERANKING_STRATEGY: ${RERANKING_STRATEGY:-slice}
      RETRIEVER_SUMMARIZER_ENABLED: ${RETRIEVER_SUMMARIZER_ENABLED:-false}
      # Graph traversal
      RETRIEVER_ARANGO_TRAVERSAL_ENABLED: ${RETRIEVER_ARANGO_TRAVERSAL_ENABLED:-true}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH:-2}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED:-5}
      RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD:-0.7}
      # K.3: was 10 — a lie (the retriever hard-caps at 4 and logged an ERROR
      # on every boot). Effective value always was 4; the seed carries 4.
      RETRIEVER_ARANGO_TRAVERSAL_CONCURRENT_BATCHES: ${RETRIEVER_ARANGO_TRAVERSAL_CONCURRENT_BATCHES:-4}
      # AI services endpoints
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://vllm:8000}
      TEI_EMBEDDING_ENDPOINT: ${EMBEDDING_SERVICE_URL:-http://tei:80}
      HF_TOKEN: ${VLLM_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OPEA_SSL_SKIP_VERIFY: ${OPEA_SSL_SKIP_VERIFY:-0}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

      GPU_NODE_HOST: ${GPU_NODE_HOST:-}
      # K.1: runtime-editable RAG tuning (read-only reader; backend writes).
      RAG_TUNING_CONFIG: /configs/pipeline/rag-tuning.json
    volumes:
      # K.1: shared pipeline-settings dir, read-only for pipeline readers.
      - ${DATA_DIR:-./data}/pipeline-settings:/configs/pipeline:ro
    networks:
      - genieai_network
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  chatqna-xeon-backend-server:
    logging: *fluent-logging
    profiles: [opea]
    depends_on:
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
    image: ${GENIE_AI_CHATQNA_SERVER_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-chatqna-server}:${GENIE_AI_CHATQNA_SERVER_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    working_dir: /app/ChatQnA
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${OPEA_PORT}:${OPEA_PORT}"
    environment:
      CHATQNA_TYPE: ${CHATQNA_TYPE:-ChatQnA}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      MEGA_SERVICE_HOST_IP: chatqna-xeon-backend-server
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMBEDDING_SERVER_HOST_IP: embedding
      EMBEDDING_SERVER_PORT: 6000
      EMBEDDING_SERVER_ENDPOINT: ${EMBEDDING_SERVER_ENDPOINT:-/v1/embeddings}
      RETRIEVER_SERVICE_HOST_IP: retriever-arango-service
      RETRIEVER_SERVICE_PORT: 7000
      RERANK_SERVER_HOST_IP: reranker
      RERANK_SERVER_PORT: 8000
      # chatqna reads these and forwards them in the reranker request; they must live
      # on chatqna (the orchestrator), not only on the reranker service.
      RERANKING_STRATEGY: ${RERANKING_STRATEGY:-slice}
      RERANKING_THRESHOLD: ${RERANKING_THRESHOLD:-0.75}
      RERANKER_TOP_N: ${RERANKER_TOP_N:-3}
      # Retriever query params (forwarded to retriever via the HTTP request body).
      # chatqna is the AUTHORITATIVE source — in production it always sends these,
      # so the retriever service's own RETRIEVER_ARANGO_* env vars are inert
      # (OPEA-vendored fallback, only reached on direct retriever API calls that
      # bypass chatqna). Defaults are intentionally kept identical in both blocks
      # to avoid silent drift; tune here and the retriever block tracks it.
      RETRIEVER_ARANGO_K: ${RETRIEVER_ARANGO_K:-20}
      RETRIEVER_ARANGO_FETCH_K: ${RETRIEVER_ARANGO_FETCH_K:-30}
      RETRIEVER_ARANGO_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_SCORE_THRESHOLD:-0.2}
      RETRIEVER_ARANGO_DISTANCE_THRESHOLD: ${RETRIEVER_ARANGO_DISTANCE_THRESHOLD:-1}
      RETRIEVER_ARANGO_LAMBDA_MULT: ${RETRIEVER_ARANGO_LAMBDA_MULT:-0.5}
      RETRIEVER_ARANGO_SEARCH_START: ${RETRIEVER_ARANGO_SEARCH_START:-chunk}
      RETRIEVER_ARANGO_TRAVERSAL_ENABLED: ${RETRIEVER_ARANGO_TRAVERSAL_ENABLED:-true}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH:-2}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED:-5}
      RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD:-0.7}
      LLM_SERVER_HOST_IP: vllm
      LLM_SERVER_PORT: 8000
      # The chatqna wrapper reads LLM_MODEL (genieai_chatqna.py:148); its code
      # default is the stale granite-3.3-2b id → vLLM 404 model-not-found →
      # silent-empty SSE stream (D4). textgen keeps its own var name (LLM_MODEL_ID).
      LLM_MODEL: ${VLLM_LLM_MODEL_ID:-ibm-granite/granite-4.1-8b}
      VLLM_LLM_ENDPOINT: ${VLLM_ENDPOINT:-}
      # Translation pipeline env (F4/F6): genieai_chatqna.py reads these.
      # facebook/nllb-200-3.3B routes _is_nllb() → POSTs the nllb-translate
      # sidecar in FLORES-200 codes (the vLLM translation guardrail is deleted —
      # vLLM 0.30 hangs on this box and can't express src_lang/target anyway).
      # VLLM_TRANSLATION_ENDPOINT is the remote-GPU-node override only (empty here).
      VLLM_TRANSLATION_MODEL_ID: ${VLLM_TRANSLATION_MODEL_ID:-facebook/nllb-200-3.3B}
      NLLB_TRANSLATE_URL: ${NLLB_TRANSLATE_URL:-http://nllb-translate:9201}
      VLLM_TRANSLATION_ENDPOINT: ${VLLM_TRANSLATION_ENDPOINT:-}
      GPU_NODE_HOST: ${GPU_NODE_HOST:-}
      GUARDRAIL_SERVICE_HOST_IP: guardrail
      GUARDRAIL_SERVICE_PORT: 9090
      DOC_REPO_URL: http://document-repository:3001
      BACKEND_SERVICE_URL: http://backend:3000
      # Agrivisory product additions (weather-aware RAG, PII sanitize)
      SENSITIVE_KEYS: ${SENSITIVE_KEYS:-email,phone,currentAddress,ip_address,ssn,ssb,dob,credit_card,password,encPassword,salt,location,accessToken,refreshToken,_rev,_key}
      MAX_MODEL_LEN_TEXTGEN: ${MAX_MODEL_LEN_TEXTGEN:-8192}
      WEATHER_AUGMENTATION_ENABLED: ${WEATHER_AUGMENTATION_ENABLED:-true}
      WEATHER_DEFAULT_LATITUDE: ${WEATHER_DEFAULT_LATITUDE:--29.3167}
      WEATHER_DEFAULT_LONGITUDE: ${WEATHER_DEFAULT_LONGITUDE:-27.4833}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-900}
      KEYCLOAK_URL: https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KC_REALM: ${KEYCLOAK_REALM:-agrivisory}
      KC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-itu-agrivisory-client}
      CHATQNA_SYSTEM_PROMPT: ${CHATQNA_SYSTEM_PROMPT:-}
      CHATQNA_ENFORCE_ABSTENTION: ${CHATQNA_ENFORCE_ABSTENTION:-true}
      # G.3 (FR7): SSOT default for the anti-repetition decode knob —
      # handle_request fills it into LLMParams when the request carries none.
      CHATQNA_REPETITION_PENALTY: ${CHATQNA_REPETITION_PENALTY:-1.03}
      # Confidence scoring — rank-weighted aggregate of calibrated reranker scores.
      CONFIDENCE_RANK_DECAY: ${CONFIDENCE_RANK_DECAY:-0.5}
      RERANKER_SCORE_CALIBRATION: ${RERANKER_SCORE_CALIBRATION:-sigmoid}
      RERANKER_SCORE_TEMPERATURE: ${RERANKER_SCORE_TEMPERATURE:-1.0}
      # Opt-in LLM self-grade (off by default; surface only after eval calibration).
      LLM_SELF_CONFIDENCE_ENABLED: ${LLM_SELF_CONFIDENCE_ENABLED:-0}
      OPENAI_API_KEY: ${VLLM_API_KEY:-}
      # Multi-turn vector-space blending (issue #833). ON since K.7 (10-06):
      # under strict grounding, retrieval is the model's only knowledge source,
      # so prompt-history alone cannot ground a follow-up — the query embedding
      # must blend the prior turn to retrieve the right chunks.
      # ${MULTI_TURN_BLEND_ENABLED:-true} is the LOCAL-DEV fallback; the deployed
      # value homes in group_vars → env.j2 (B5 single-homing).
      MULTI_TURN_BLEND_ENABLED: ${MULTI_TURN_BLEND_ENABLED:-true}
      MULTI_TURN_BLEND_ALPHA: ${MULTI_TURN_BLEND_ALPHA:-0.7}
      MULTI_TURN_HISTORY_TURNS: ${MULTI_TURN_HISTORY_TURNS:-1}
      # K.7b conversational query reformulation: with history, one small granite
      # call rewrites the follow-up into a self-contained retrieval query (both
      # retrieval legs + the KB question line). ${QUERY_REFORMULATION_ENABLED:-true}
      # is the LOCAL-DEV fallback; the deployed value homes in group_vars →
      # env.j2 (B5 single-homing). Kill-switch: false = raw-query K.7 behavior.
      QUERY_REFORMULATION_ENABLED: ${QUERY_REFORMULATION_ENABLED:-true}
      OPEA_SSL_SKIP_VERIFY: ${OPEA_SSL_SKIP_VERIFY:-0}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # K.1: runtime-editable pipeline settings (read-only reader; backend
      # writes). chatqna consumes both files (prompts/generation + RAG tuning).
      LLM_SETTINGS_CONFIG: /configs/pipeline/llm-settings.json
      RAG_TUNING_CONFIG: /configs/pipeline/rag-tuning.json

    volumes:
      # K.1: shared pipeline-settings dir, read-only for pipeline readers.
      - ${DATA_DIR:-./data}/pipeline-settings:/configs/pipeline:ro
    networks:
      - genieai_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  # OPEA UI/Nginx - disabled by default via profiles: [opea] (compose up) / replicas: 0 (Swarm).
  # Activate for OPEA debugging: compose up --profile opea / Swarm: change replicas to 1.
  chatqna-xeon-ui-server:
    logging: *fluent-logging
    profiles: [opea]
    restart: "no"
    image: opea/chatqna-ui:1.5
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${FRONTEND_SERVICE_PORT}:${FRONTEND_SERVICE_PORT}"
    environment:
      UPLOAD_FILE_BASE_URL: http://dataprep-arango-service:5000/v1/dataprep/ingest
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/5173' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  chatqna-xeon-nginx-server:
    logging: *fluent-logging
    profiles: [opea]
    restart: "no"
    image: opea/nginx:1.5
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${NGINX_PORT}:${NGINX_PORT}"
    environment:
      FRONTEND_SERVICE_IP: chatqna-xeon-ui-server
      FRONTEND_SERVICE_PORT: 5173
      BACKEND_SERVICE_NAME: chatqna-xeon-backend-server
      BACKEND_SERVICE_IP: chatqna-xeon-backend-server
      BACKEND_SERVICE_PORT: 8888
      DATAPREP_SERVICE_IP: dataprep-arango-service
      DATAPREP_SERVICE_PORT: 5000
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/80' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  # PostgreSQL initialization (creates dedicated databases and users for each service)
  # Keycloak database (Agrivisory two-postgres layout)
  keycloak-db:
    logging: *fluent-logging
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # Keycloak Identity Provider (Agrivisory: stock image, root context — ported from
  # upstream v2.0.1 compose ~:1315; dedicated keycloak-db kept per DEC-5).
  # Realm is applied as code by the keycloak-config sidecar below — no --import-realm.
  keycloak:
    logging: *fluent-logging
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "/opt/keycloak/bin/kc.sh build && /opt/keycloak/bin/kc.sh start --optimized"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      # DEC-32c: agrivisory login theme (Keletso style; realm
      # loginTheme=agrivisory). The stock quay.io/keycloak:26.7.2 image
      # ships /opt/keycloak/themes EMPTY (built-ins live in
      # keycloak-themes jars on the classpath — verified 10-06), so mounting
      # here is safe. NB: the dir-flag route KC 26 actually offers is
      # --spi-theme-folderDir=<dir>; the shorter theme-dir flag does NOT
      # exist in KC 26 ("Unknown option" → crash loop), and would be needed
      # only if a themes-baked base image ever replaced the stock pin.
      - ./configs/keycloak/themes:/opt/keycloak/themes:ro
    environment:
      - KC_LOG_LEVEL=INFO,org.keycloak.events:DEBUG
      - KC_HOSTNAME=${KC_HOSTNAME:-${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}}
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_DB=postgres
      - KC_DB_URL_HOST=keycloak-db
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # SMTP (reuses EMAIL_* — empty EMAIL_HOST disables)
      - KC_SMTP_HOST=${EMAIL_HOST:-}
      - KC_SMTP_PORT=${EMAIL_PORT:-587}
      - KC_SMTP_SSL=${EMAIL_SECURE:-false}
      - KC_SMTP_AUTH=${EMAIL_USER:+true}
      - KC_SMTP_STARTTLS=true
      - KC_SMTP_USER=${EMAIL_USER:-}
      - KC_SMTP_PASSWORD=${EMAIL_PASSWORD:-}
      - KC_SMTP_FROM=${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # Keycloak realm configuration via keycloak-config-cli (runs once after Keycloak is healthy)
  # Ported from upstream v2.0.1 compose ~:1366; local defaults: agrivisory realm/client,
  # DEC-4 SSO knobs, DEC-5 stock keycloak theme, DEC-3 registration/reset enabled.
  keycloak-config:
    logging: *fluent-logging
    build:
      context: configs/keycloak/
      dockerfile: Dockerfile.config-cli
    image: ${GENIE_AI_KEYCLOAK_CONFIG_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-keycloak-config}:${GENIE_AI_KEYCLOAK_CONFIG_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_USER=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - IMPORT_FILES=/config/genie-realm.yaml
      - IMPORT_VARSUBSTITUTION_ENABLED=true
      - IMPORT_CACHE_ENABLED=true
      # Variables referenced in genie-realm.yaml via $(env:VAR) substitution
      - KC_REALM=${KEYCLOAK_REALM:-agrivisory}
      - KC_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-itu-agrivisory-client}
      - GENIE_ADMIN_USERNAME=${GENIE_ADMIN_USERNAME:-genie-admin}
      - GENIE_ADMIN_PASSWORD=${GENIE_ADMIN_PASSWORD}
      - GENIE_ADMIN_EMAIL=${GENIE_ADMIN_EMAIL}
      - KC_PROXY_CLIENT_SECRET=${KEYCLOAK_PROXY_CLIENT_SECRET}
      - KC_DATAPREP_CLIENT_SECRET=${KC_DATAPREP_CLIENT_SECRET}
      - KC_GRAFANA_CLIENT_ID=${KC_GRAFANA_CLIENT_ID:-grafana}
      - KC_GRAFANA_CLIENT_SECRET=${KC_GRAFANA_CLIENT_SECRET}
      - KC_MOBILE_CLIENT_ID=${KC_MOBILE_CLIENT_ID:-agrivisory-mobile}
      - KC_MOBILE_REDIRECT_SCHEME=${KC_MOBILE_REDIRECT_SCHEME:-agrivisory}
      - KC_PUBLIC_ORIGIN=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}
      # Realm properties (registration, email, security, localization, tokens)
      - KEYCLOAK_REGISTRATION_ENABLED=${KEYCLOAK_REGISTRATION_ENABLED:-true}
      - KEYCLOAK_VERIFY_EMAIL=${KEYCLOAK_VERIFY_EMAIL:-true}
      - KEYCLOAK_RESET_PASSWORD=${KEYCLOAK_RESET_PASSWORD:-true}
      - KEYCLOAK_LOGIN_WITH_EMAIL=${KEYCLOAK_LOGIN_WITH_EMAIL:-true}
      - KEYCLOAK_DUPLICATE_EMAILS=${KEYCLOAK_DUPLICATE_EMAILS:-false}
      - KEYCLOAK_BRUTE_FORCE=${KEYCLOAK_BRUTE_FORCE:-true}
      - KEYCLOAK_PASSWORD_POLICY=${KEYCLOAK_PASSWORD_POLICY:-length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)}
      # DEC-12: remember-me checkbox (deliberate upstream divergence)
      - KEYCLOAK_REMEMBER_ME=${KEYCLOAK_REMEMBER_ME:-true}
      - KEYCLOAK_THEME=${KEYCLOAK_THEME:-keycloak}
      - KEYCLOAK_I18N_ENABLED=${KEYCLOAK_I18N_ENABLED:-true}
      - KEYCLOAK_LOCALE=${KEYCLOAK_LOCALE:-en}
      - KEYCLOAK_SUPPORTED_LOCALES=${KEYCLOAK_SUPPORTED_LOCALES:-["ar","de","en","es","fr","pt","ru","th","zh-Hans"]}
      - KEYCLOAK_ACCESS_TOKEN_LIFESPAN=${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:-300}
      # DEC-4 session lifespans (new knobs, not upstream): idle 8h / max 12h
      - KEYCLOAK_SSO_IDLE=${KEYCLOAK_SSO_IDLE:-28800}
      - KEYCLOAK_SSO_MAX=${KEYCLOAK_SSO_MAX:-43200}
      # SMTP (reuses EMAIL_* — required because realm smtpServer overrides server-level KC_SMTP_*)
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_SMTP_AUTH=${EMAIL_USER:+true}
      - EMAIL_SMTP_STARTTLS=${EMAIL_SMTP_STARTTLS:-true}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/config-done"]
      interval: 10s
      timeout: 5s
      retries: 3
      # 240s covers the script's own worst case: 10 retries × (10s delay + run time) ≈ 140s+
      start_period: 240s
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10

  # ===========================================================================
  # Observability Stack (node.labels.genieai == true)
  # ===========================================================================
  # Disabled by default. Enable via:
  #   docker compose: --profile observability flag
  #   Docker Swarm:   ENABLE_OBSERVABILITY=1 in .env
  # ===========================================================================

  # One-shot init container: sets otel-queue volume ownership for the nonroot
  # Collector process (UID 10001). Runs before otel-collector in compose mode.
  # In Swarm mode, depends_on is removed by Ansible — the Collector's
  # restart policy handles the race condition until init completes.
  otel-collector-init:
    profiles: [observability]
    image: busybox:1.38.0
    command: ["sh", "-c", "mkdir -p /var/lib/otelcol/file_storage/victoriatraces && chown -R 10001:10001 /var/lib/otelcol"]
    volumes:
      - otel-queue:/var/lib/otelcol
    networks:
      - genieai_network
    deploy:
      # Global mode: runs once on every Swarm node (matches otel-collector's
      # global placement) to set volume permissions before Collector starts.
      # In compose mode, depends_on ensures ordering instead.
      mode: global
      restart_policy:
        condition: none

  otel-collector:
    profiles: [observability]
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.152.0
    # Expose fluentforward receiver on localhost so the Docker daemon can
    # send container logs via the fluentd logging driver. Binding to
    # 127.0.0.1 prevents external access (no unauthenticated log injection).
    # Use mode: host so Docker daemon's fluentd driver connects directly to the
    # collector container. Mode: ingress (Swarm routing mesh) breaks fluentd's
    # persistent TCP connections — IPVS terminates and re-opens them, causing
    # CLOSE-WAIT states and data loss.
    ports:
      - target: 24224
        published: 24224
        protocol: tcp
        mode: host
        host_ip: 127.0.0.1
    # Distroless image — no shell/wget for Docker healthcheck.
    # Rely on restart policy + health_check extension (port 13133) for programmatic probes.
    environment:
      - OTEL_TRACES_SAMPLER_RATE=${OTEL_TRACES_SAMPLER_RATE:-100.0}
    volumes:
      - ./configs/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-queue:/var/lib/otelcol
    depends_on:
      otel-collector-init:
        condition: service_completed_successfully
    networks:
      - genieai_network
    deploy:
      # Global mode: one collector per Swarm node. No placement constraint —
      # must run on ALL node types (gateway, genieai, gpu) to collect logs
      # from every service via the fluentd logging driver (localhost:24224).
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  victoriametrics:
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    image: victoriametrics/victoria-metrics:v1.138.0
    command:
      - "--storageDataPath=/var/lib/victoria-metrics"
      - "--retentionPeriod=${VICTORIAMETRICS_RETENTION:-30d}"
      - "--httpListenAddr=:8428"
    volumes:
      - vm-data:/var/lib/victoria-metrics
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  victorialogs:
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    image: victoriametrics/victoria-logs:v1.50.0
    command:
      - "--storageDataPath=/var/lib/victoria-logs"
      - "--retentionPeriod=${VICTORIALOGS_RETENTION:-30d}"
      - "--httpListenAddr=:9428"
    volumes:
      - vlogs-data:/var/lib/victoria-logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9428/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  victoriatraces:
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    image: victoriametrics/victoria-traces:v0.9.2
    command:
      - "--storageDataPath=/var/lib/victoria-traces"
      - "--retentionPeriod=${VICTORIATRACES_RETENTION:-30d}"
      - "--httpListenAddr=:10428"
    volumes:
      - vtraces-data:/var/lib/victoria-traces
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:10428/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  tempo-proxy:
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    build:
      context: ./tools/tempo-proxy
      dockerfile: Dockerfile
    image: ${GENIE_AI_TEMPO_PROXY_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-tempo-proxy}:${GENIE_AI_TEMPO_PROXY_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - VICTORIATRACES_URL=http://victoriatraces:10428
      - PORT=10429
    depends_on:
      victoriatraces:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10429/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
  grafana:
    logging: *fluent-logging
    profiles: [observability]
    restart: unless-stopped
    image: grafana/grafana:12.4
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
      victoriatraces:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_CSRF_TRUSTED_ORIGINS=https://${NGINX_PUBLIC_DOMAIN:-localhost}:${NGINX_HTTPS_PORT:-443}
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SERVER_HTTP_PORT=3000
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/service-health.json
      - GF_PLUGINS_PREINSTALL_SYNC=victoriametrics-logs-datasource
      - GF_SERVER_ROOT_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${KC_GRAFANA_CLIENT_ID:-grafana}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${KC_GRAFANA_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email roles
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'
      # Auth URL: browser redirect (external, through nginx/Kong)
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth/realms/${KEYCLOAK_REALM:-agrivisory}/protocol/openid-connect/auth
      # Token/API URLs: Grafana backend calls (internal Docker network, bypasses nginx)
      # Keycloak serves root context (A3 flip) — internal URLs carry no /auth prefix
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak:8080/realms/${KEYCLOAK_REALM:-agrivisory}/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak:8080/realms/${KEYCLOAK_REALM:-agrivisory}/protocol/openid-connect/userinfo
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    # Grafana is now accessible only via Kong route (/grafana/).
    # For local debugging, uncomment the port mapping below:
    # ports:
    #   - "${GRAFANA_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - genieai_network
    deploy:
      replicas: ${ENABLE_OBSERVABILITY:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

networks:
  genieai_network:
    attachable: true
