---
# GENIE.AI - Docker Swarm Deployment Playbook
#
# Usage (per environment):
#   ansible-playbook -i inventory/test.ini deploy.yml --vault-id test@prompt
#   ansible-playbook -i inventory/production.ini deploy.yml --vault-id production@prompt
#
# With password files:
#   ansible-playbook -i inventory/test.ini deploy.yml --vault-id test@.vault-pass-test
#
# Tagged re-runs:
#   ansible-playbook -i inventory/test.ini deploy.yml --tags install --vault-id test@prompt
#   ansible-playbook -i inventory/test.ini deploy.yml --tags build,deploy --vault-id test@prompt
#   ansible-playbook -i inventory/test.ini deploy.yml --tags deploy --vault-id test@prompt
#
# Tags:
#   install  - Docker, NVIDIA toolkit, Swarm init, registry
#   prepare  - Git clone, directories, SSL certs
#   build    - Build and push images to local registry
#   deploy   - Generate .env, validate, deploy stack, verify

- name: GENIE.AI - Detect environment
  hosts: all
  gather_facts: false
  tasks:
    - name: Display deployment environment
      ansible.builtin.debug:
        msg: "Deploying to {{ inventory_hostname }} (groups: {{ group_names | join(', ') }})"

- name: GENIE.AI - System preparation and Docker installation
  hosts: all
  tags: [install]
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - gnupg2
          - ca-certificates
          - python3-pip
          - git
          - apt-transport-https
        state: present

    - name: Install python3-docker (for ansible docker modules)
      ansible.builtin.apt:
        name: python3-docker
        state: present

    - name: Ensure Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: Ensure Docker repository (DEB822 format)
      ansible.builtin.copy:
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_lsb.codename }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
          Architectures: amd64
        dest: /etc/apt/sources.list.d/docker.sources
        mode: '0644'

    - name: Pin Docker package versions
      ansible.builtin.copy:
        content: |
          Package: docker-ce docker-ce-cli docker-ce-rootless-extras
          Pin: version {{ docker_version_pin }}
          Pin-Priority: 900
        dest: /etc/apt/preferences.d/docker-pin
        mode: '0644'

    - name: Check if Docker packages are up-to-date
      ansible.builtin.shell: |
        for pkg in docker-ce docker-ce-cli containerd.io docker-compose-plugin; do
          installed=$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null)
          candidate=$(apt-cache policy "$pkg" | grep 'Candidate:' | awk '{print $2}')
          if [ "$installed" != "$candidate" ]; then
            echo "upgrade"
            exit 0
          fi
        done
        echo "ok"
      register: docker_upgrade_check
      changed_when: false

    - name: Unhold Docker packages (allow upgrade)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop: "{{ docker_hold_packages }}"
      when: docker_upgrade_check.stdout == "upgrade"

    - name: Install Docker Engine (pinned version)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        update_cache: true
        state: latest
      when: docker_upgrade_check.stdout == "upgrade"

    - name: Hold Docker packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ docker_hold_packages }}"
      when: docker_upgrade_check.stdout == "upgrade"

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ansible_user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

- name: GENIE.AI - NVIDIA Container Toolkit (GPU nodes)
  hosts: gpu_nodes
  tags: [install]
  become: true
  tasks:
    - name: Skip NVIDIA toolkit when deploy_opea is 0
      ansible.builtin.debug:
        msg: "DEPLOY_OPEA=0 — skipping NVIDIA Container Toolkit installation"
      when: deploy_opea == "0"

    - block:
        - name: Ensure NVIDIA Container Toolkit GPG key
          ansible.builtin.get_url:
            url: https://nvidia.github.io/libnvidia-container/gpgkey
            dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
            mode: '0644'
            force: true

        - name: Ensure NVIDIA Container Toolkit repository (DEB822 format)
          ansible.builtin.copy:
            content: |
              Types: deb
              URIs: https://nvidia.github.io/libnvidia-container/stable/deb/amd64
              Suites: /
              Components:
              Signed-By: /etc/apt/keyrings/nvidia-container-toolkit.asc
            dest: /etc/apt/sources.list.d/nvidia-container-toolkit.sources
            mode: '0644'

        - name: Pin NVIDIA toolkit package versions
          ansible.builtin.copy:
            content: |
              Package: nvidia-container-toolkit nvidia-container-toolkit-base libnvidia-container-tools libnvidia-container1
              Pin: version {{ nvidia_version_pin }}
              Pin-Priority: 900
            dest: /etc/apt/preferences.d/nvidia-toolkit-pin
            mode: '0644'

        - name: Check if NVIDIA toolkit packages are up-to-date
          ansible.builtin.shell: |
            for pkg in nvidia-container-toolkit nvidia-container-toolkit-base libnvidia-container-tools libnvidia-container1; do
              installed=$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null)
              candidate=$(apt-cache policy "$pkg" | grep 'Candidate:' | awk '{print $2}')
              if [ "$installed" != "$candidate" ]; then
                echo "upgrade"
                exit 0
              fi
            done
            echo "ok"
          register: nvidia_upgrade_check
          changed_when: false

        - name: Unhold NVIDIA toolkit packages (allow upgrade)
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: install
          loop: "{{ nvidia_hold_packages }}"
          when: nvidia_upgrade_check.stdout == "upgrade"

        - name: Install NVIDIA Container Toolkit (pinned version)
          ansible.builtin.apt:
            name: nvidia-container-toolkit
            update_cache: true
            state: latest
          when: nvidia_upgrade_check.stdout == "upgrade"

        - name: Hold NVIDIA toolkit packages
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: hold
          loop: "{{ nvidia_hold_packages }}"
          when: nvidia_upgrade_check.stdout == "upgrade"

        - name: Configure Docker daemon for NVIDIA runtime
          block:
            - name: Read existing daemon.json
              ansible.builtin.slurp:
                src: /etc/docker/daemon.json
              register: daemon_json_existing
              failed_when: false

            - name: Set daemon.json content (merge NVIDIA config)
              ansible.builtin.set_fact:
                daemon_json_final: >-
                  {{ (daemon_json_existing.content | b64decode | from_json
                      if daemon_json_existing is succeeded else {})
                    | combine({'runtimes': {'nvidia': {
                      'path': 'nvidia-container-runtime',
                      'runtimeArgs': []
                    }}, 'default-runtime': 'nvidia'}) }}

            - name: Write merged daemon.json
              ansible.builtin.copy:
                content: "{{ daemon_json_final | to_nice_json }}"
                dest: /etc/docker/daemon.json
                mode: '0644'
              notify: Restart Docker

        - name: Enable NVIDIA GPU access for unprivileged containers (Swarm)
          ansible.builtin.lineinfile:
            path: /etc/nvidia-container-runtime/config.toml
            regexp: '^#?accept-nvidia-visible-devices-envvar-when-unprivileged'
            line: accept-nvidia-visible-devices-envvar-when-unprivileged = true
            state: present
          notify: Restart Docker

        - name: Verify NVIDIA runtime
          ansible.builtin.command: docker info --format '{{ "{{" }}.Runtimes{{ "}}" }}'
          register: nvidia_verify
          failed_when: "'nvidia' not in nvidia_verify.stdout"
          changed_when: false

      when: deploy_opea != "0"

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: GENIE.AI - Swarm initialization and node labeling
  hosts: swarm_managers
  tags: [install]
  become: true
  tasks:
    - name: Check if Swarm is already active
      ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
      register: swarm_status
      changed_when: false
      failed_when: false

    - name: Initialize Docker Swarm
      ansible.builtin.command: docker swarm init --advertise-addr {{ ansible_host }}
      when: swarm_status.stdout != "active"
      changed_when: true

    - name: Get node hostname
      ansible.builtin.command: hostname
      register: node_hostname
      changed_when: false

    - name: Get current node labels
      ansible.builtin.command: docker node inspect {{ node_hostname.stdout }} --format '{{ "{{" }}.Spec.Labels{{ "}}" }}'
      register: node_labels
      changed_when: false

    - name: Add gpu=true label
      ansible.builtin.command: docker node update --label-add gpu=true {{ node_hostname.stdout }}
      when: node_labels.stdout is not search('gpu:')
      changed_when: true

    - name: Add gateway=true label
      ansible.builtin.command: docker node update --label-add gateway=true {{ node_hostname.stdout }}
      when: node_labels.stdout is not search('gateway:')
      changed_when: true

    - name: Add genieai=true label
      ansible.builtin.command: docker node update --label-add genieai=true {{ node_hostname.stdout }}
      when: node_labels.stdout is not search('genieai:')
      changed_when: true

- name: GENIE.AI - Local Docker registry
  hosts: swarm_managers
  tags: [install]
  become: true
  tasks:
    - name: Set swarm registry URL from port
      ansible.builtin.set_fact:
        swarm_registry_url: "{{ swarm_registry_url | default('localhost:' + (registry_port | default('5000'))) }}"

    - name: Check if registry container exists
      community.docker.docker_container_info:
        name: registry
      register: registry_info

    - name: Start local Docker registry
      community.docker.docker_container:
        name: registry
        image: registry:2
        ports:
          - "{{ registry_port }}:5000"
        restart_policy: unless-stopped
        state: started

    - name: Wait for registry to be ready
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ registry_port }}"
        timeout: 60

    - name: Verify registry is responding
      ansible.builtin.uri:
        url: "http://localhost:{{ registry_port }}/v2/_catalog"
        method: GET
        return_content: true
      register: registry_check
      until: registry_check.status == 200
      retries: 5
      delay: 3

- name: GENIE.AI - Project sync and directories
  hosts: swarm_managers
  tags: [prepare]
  vars_prompt:
    - name: git_username
      prompt: "Git username"
      private: false
    - name: git_token
      prompt: "Git personal access token"
      private: true
  become: true
  become_user: "{{ ansible_user }}"
  tasks:
    - name: Set repo URL with credentials
      ansible.builtin.set_fact:
        repo_url_with_credentials: >-
          {{ repo_url | regex_replace('^https://', 'https://' + git_username + ':' + git_token + '@') }}
      no_log: true
      when: not (skip_git_sync | default(false) | bool)

    - name: Check if git repository exists
      ansible.builtin.stat:
        path: "{{ deploy_dir }}/.git"
      register: git_dir
      when: not (skip_git_sync | default(false) | bool)

    - name: Remove stale deploy directory (exists but no .git)
      become_user: root
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: absent
      when:
        - not (skip_git_sync | default(false) | bool)
        - git_dir.stat is defined and not git_dir.stat.exists

    # Skipped when skip_git_sync (code delivered via the S3 artifact, not git).
    - name: Clone or update project repository
      become_user: root
      when: not (skip_git_sync | default(false) | bool)
      block:
        - name: Clone project repository
          ansible.builtin.git:
            repo: "{{ repo_url_with_credentials }}"
            dest: "{{ deploy_dir }}"
            version: "{{ repo_branch }}"
            accept_hostkey: true
            depth: 1
          when: not git_dir.stat.exists

        - name: Pull latest changes
          ansible.builtin.git:
            repo: "{{ repo_url_with_credentials }}"
            dest: "{{ deploy_dir }}"
            version: "{{ repo_branch }}"
            force: true
          when: git_dir.stat.exists

        - name: Fix ownership to ansible_user
          ansible.builtin.file:
            path: "{{ deploy_dir }}"
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            recurse: true

    - name: Ensure deploy directories exist with correct ownership
      become_user: root
      block:
        - name: Create deploy directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
          loop:
            - "{{ deploy_dir }}/secrets/ssl"

    - name: Check if SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ deploy_dir }}/secrets/ssl/{{ item }}"
      register: ssl_files
      loop:
        - server.crt
        - server.key
      failed_when: false

    - name: Generate self-signed SSL certificate
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout {{ deploy_dir }}/secrets/ssl/server.key
        -out {{ deploy_dir }}/secrets/ssl/server.crt
        -subj "/CN={{ nginx_public_domain | default('localhost') }}"
      when:
        - self_signed_certs | default(false) | bool
        - not ssl_files.results[0].stat.exists or not ssl_files.results[1].stat.exists
      changed_when: true

    - name: Assert SSL certificates exist (self-signed disabled)
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          Missing SSL certificate: {{ item.item }}.
          Place server.crt and server.key in files/certificates/{{ group_names[0] }}/
          or set self_signed_certs: true in group_vars.
        quiet: true
      loop: "{{ ssl_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not (self_signed_certs | default(false) | bool)

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ deploy_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ data_dir }}/logs/kong"
        - "{{ data_dir }}/logs/backend"
        - "{{ data_dir }}/logs/doc-repo"
        - "{{ data_dir }}/database_backups"
        - "{{ data_dir }}/huggingface"
        # Bind-mount source for tts-piper. Swarm rejects the task outright if
        # this is missing — the service never even starts a container.
        - "{{ data_dir }}/piper-voices"
        - secrets/ssl

    # Voice / LID model assets. See group_vars/all.yml for why these are fetched
    # here instead of being baked into the images. Both are `force: false`, so a
    # redeploy re-checks presence without re-downloading ~1.8 GB every time.
    - name: Download Piper TTS voices
      ansible.builtin.get_url:
        url: >-
          {{ piper_voices_base_url }}/{{ item.0.split('-')[0].split('_')[0] }}/{{ item.0.split('-')[0] }}/{{ item.0.split('-')[1] }}/{{ item.0.split('-')[2] }}/{{ item.0 }}.{{ item.1 }}
        dest: "{{ deploy_dir }}/{{ data_dir }}/piper-voices/{{ item.0 }}.{{ item.1 }}"
        mode: "0644"
        force: false
        timeout: 120
      loop: "{{ piper_voices | product(['onnx', 'onnx.json']) | list }}"
      loop_control:
        label: "{{ item.0 }}.{{ item.1 }}"

    # lid reads a named volume rather than a bind mount, so the file has to be
    # placed inside the volume. Creating it here is safe: `docker volume create`
    # is idempotent, and Swarm reuses an existing volume of the same name rather
    # than making a second one.
    - name: Ensure the lid model volume exists
      become_user: root
      ansible.builtin.command: "docker volume create {{ lid_volume_name }}"
      register: _lid_volume
      changed_when: false

    - name: Resolve the lid model volume mountpoint
      become_user: root
      ansible.builtin.command: >
        docker volume inspect {{ lid_volume_name }}
        --format {{ '{{' }}.Mountpoint{{ '}}' }}
      register: _lid_mountpoint
      changed_when: false

    - name: Download the fastText language-identification model
      become_user: root
      ansible.builtin.get_url:
        url: "{{ lid_model_url }}"
        dest: "{{ _lid_mountpoint.stdout | trim }}/lid.bin"
        mode: "0644"
        force: false
        timeout: 300

- name: GENIE.AI - Copy SSL certificates
  hosts: swarm_managers
  tags: [prepare]
  tasks:
    - name: Check if local certificate files exist
      become: false
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/files/certificates/{{ group_names[0] }}/{{ item }}"
      register: local_certs
      delegate_to: localhost
      loop:
        - server.crt
        - server.key
      failed_when: false

    - name: Copy SSL certificate
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/certificates/{{ group_names[0] }}/{{ item.item }}"
        dest: "{{ deploy_dir }}/secrets/ssl/{{ item.item }}"
        mode: '0600'
        owner: "{{ ansible_user }}"
      loop: "{{ local_certs.results }}"
      when: item.stat.exists
      loop_control:
        label: "{{ item.item }}"

- name: GENIE.AI - Build and push images
  hosts: swarm_managers
  tags: [build]
  become: true
  tasks:
    # `watch` lists the paths whose changes should trigger a rebuild of THIS image.
    # It defaults to [dockerfile, context] and only needs setting where the build
    # context is broader than what the Dockerfile actually COPYs — notably the five
    # images with `context: .`, which would otherwise rebuild on any repo change.
    # Keep these in sync with the COPY lines in the corresponding Dockerfile.
    - name: Define image build list
      ansible.builtin.set_fact:
        genieai_images:
          - name: frontend
            dockerfile: components/genie-ai-frontend-v2/Dockerfile
            context: components/genie-ai-frontend-v2/
            source_tag: genieai_mvp_frontend:latest
            registry_tag: genie-ai-frontend:latest
            opea: false
          - name: backend
            dockerfile: components/gov-chat-backend/Dockerfile
            context: components
            # COPYs gov-chat-backend/ and shared/lib — not all of components/
            watch:
              - components/gov-chat-backend
              - components/shared/lib
            source_tag: genieai_mvp_backend:latest
            registry_tag: genie-ai-backend:latest
            opea: false
          - name: document-repository
            dockerfile: components/document-repository/Dockerfile
            context: components
            # COPYs document-repository/ and shared/lib — not all of components/
            watch:
              - components/document-repository
              - components/shared/lib
            source_tag: genieai_mvp_document-repository:latest
            registry_tag: genie-ai-document-repository:latest
            opea: false
          - name: nginx
            dockerfile: api-gateway-solution/nginx/Dockerfile
            context: api-gateway-solution/nginx/
            source_tag: genie-ai-nginx:latest
            registry_tag: genie-ai-nginx:latest
            opea: false
          - name: kong-config
            dockerfile: api-gateway-solution/new-config/Dockerfile
            context: api-gateway-solution/new-config/
            source_tag: genie-ai-kong-config:latest
            registry_tag: genie-ai-kong-config:latest
            opea: false
          - name: postgres-init
            dockerfile: configs/postgres/Dockerfile
            context: configs/postgres/
            source_tag: genie-ai-postgres-init:latest
            registry_tag: genie-ai-postgres-init:latest
            opea: false
          - name: keycloak
            dockerfile: configs/keycloak/Dockerfile
            context: configs/keycloak/
            source_tag: genie-ai-keycloak:latest
            registry_tag: genie-ai-keycloak:latest
            opea: false
          - name: keycloak-config
            dockerfile: configs/keycloak/Dockerfile.config-cli
            context: configs/keycloak/
            source_tag: genie-ai-keycloak-config:latest
            registry_tag: genie-ai-keycloak-config:latest
            opea: false
          - name: db-migrations
            dockerfile: components/gov-chat-backend/Dockerfile.migrations
            context: .
            # Only COPYs the migrations scripts, despite the repo-wide context.
            watch:
              - components/gov-chat-backend/scripts/migrations
            source_tag: genie-ai-db-migrations:latest
            registry_tag: genie-ai-db-migrations:latest
            opea: false
          - name: dataprep-arango
            dockerfile: genie-ai-overlay/dataprep/Dockerfile-dataprep_genie-ai
            context: .
            watch:
              - genie-ai-overlay/dataprep
              - genie-ai-overlay/core/genieai_api_protocol.py
              - genie-ai-overlay/build-patches
            source_tag: genie-ai-dataprep-arango:latest
            registry_tag: genie-ai-dataprep-arango:latest
            opea: true
          - name: retriever-arango
            dockerfile: genie-ai-overlay/retriever/Dockerfile-retriever_genie-ai
            context: .
            watch:
              - genie-ai-overlay/retriever
              - genie-ai-overlay/core/genieai_api_protocol.py
              - genie-ai-overlay/build-patches
            source_tag: genie-ai-retriever-arango:latest
            registry_tag: genie-ai-retriever-arango:latest
            opea: true
          - name: chatqna-server
            dockerfile: genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
            context: .
            watch:
              - genie-ai-overlay/chatqna
              - genie-ai-overlay/core
            source_tag: genie-ai-chatqna-server:latest
            registry_tag: genie-ai-chatqna-server:latest
            opea: true
          - name: reranker
            dockerfile: genie-ai-overlay/reranker/Dockerfile-reranker_genie-ai
            context: .
            watch:
              - genie-ai-overlay/reranker
              - genie-ai-overlay/build-patches
            source_tag: genie-ai-reranker:latest
            registry_tag: genie-ai-reranker:latest
            opea: true

          # --- Voice / messaging services -------------------------------------
          # These were missing from this list while docker-compose.yaml referenced
          # their images, so Swarm rejected them indefinitely with
          # "No such image: localhost:5000/genie-ai-<name>:latest" — voice-bridge
          # had been in that state for four weeks. Because the post-deploy health
          # check requires every non-excluded service to reach its replica count,
          # that drift made EVERY deploy fail verification regardless of what else
          # was true. Compose referenced 19 local-registry images; this list had 13.
          - name: asr-whisper
            dockerfile: genie-ai-overlay/asr-whisper/Dockerfile-asr_genie-ai
            context: .
            watch:
              - genie-ai-overlay/asr-whisper
            source_tag: genie-ai-asr-whisper:latest
            registry_tag: genie-ai-asr-whisper:latest
            opea: false
          - name: http-service
            dockerfile: genie-ai-overlay/http-service/Dockerfile
            context: .
            watch:
              - genie-ai-overlay/http-service
            source_tag: genie-ai-http-service:latest
            registry_tag: genie-ai-http-service:latest
            opea: false
          - name: tts-piper
            dockerfile: genie-ai-overlay/tts-piper/Dockerfile-tts_genie-ai
            context: .
            watch:
              - genie-ai-overlay/tts-piper
            source_tag: genie-ai-tts-piper:latest
            registry_tag: genie-ai-tts-piper:latest
            opea: false
          - name: voice-bridge
            dockerfile: genie-ai-overlay/voice-bridge/Dockerfile-voicebridge_genie-ai
            context: .
            watch:
              - genie-ai-overlay/voice-bridge
              - genie-ai-overlay/core/appointment_guard.py
            source_tag: genie-ai-voice-bridge:latest
            registry_tag: genie-ai-voice-bridge:latest
            opea: false
          - name: whatsapp
            dockerfile: genie-ai-overlay/whatsapp/Dockerfile-whatsapp_genie-ai
            context: .
            watch:
              - genie-ai-overlay/whatsapp
            source_tag: genie-ai-whatsapp:latest
            registry_tag: genie-ai-whatsapp:latest
            opea: false
          # lid carries `profiles: [opea]` in compose, so it follows DEPLOY_OPEA.
          - name: lid
            dockerfile: genie-ai-overlay/lid/Dockerfile-lid_genie-ai
            context: .
            watch:
              - genie-ai-overlay/lid
            source_tag: genie-ai-lid:latest
            registry_tag: genie-ai-lid:latest
            opea: true

    # Per-image source SHA: the last commit that touched THIS image's Dockerfile or
    # its watched paths.
    #
    # This replaces a single repo-wide `git rev-parse HEAD`. That old scheme
    # compared one global SHA against every image's git_sha label, so ANY commit
    # invalidated ALL ~13 labels — every deploy rebuilt everything, pushed 13 new
    # digests, and Swarm consequently restarted every service. A one-line frontend
    # change cost a full-stack restart (~40 min, including a vLLM model reload).
    #
    # Keying on the image's own inputs means unchanged images keep their existing
    # digest, so Swarm leaves those services running untouched. That removes most
    # of the downtime, not just most of the build time.
    #
    # It also makes a no-op redeploy genuinely free: redeploy.sh commits with
    # --allow-empty so HEAD always moves, but an empty commit touches no path, so
    # `git log -1 -- <paths>` still resolves to the earlier commit and nothing is
    # rebuilt.
    - name: Compute per-image source SHA
      ansible.builtin.command:
        cmd: >-
          git log -1 --format=%H --
          {{ ([item.dockerfile] + (item.watch | default([item.context]))) | map('quote') | join(' ') }}
        chdir: "{{ deploy_dir }}"
      register: image_src_sha
      changed_when: false
      # Never abort the deploy on a git hiccup (shallow clone, path not yet in
      # history, etc). A non-zero rc leaves stdout empty, and the build condition
      # below treats an empty SHA as "rebuild" — degrade to doing more work, not
      # to skipping work or failing the run.
      failed_when: false
      loop: "{{ genieai_images }}"
      when: not item.opea or deploy_opea != "0"
      loop_control:
        label: "{{ item.name }}"

    # Flatten {image, sha} into one list so the later loops stay one level deep.
    - name: Assemble build plan
      ansible.builtin.set_fact:
        build_plan: >-
          {{ (build_plan | default([])) + [item.item | combine({'sha': item.stdout | trim})] }}
      loop: "{{ image_src_sha.results }}"
      when: item.skipped is not defined
      loop_control:
        label: "{{ item.item.name }}"

    - name: Check if images need rebuild
      ansible.builtin.command: >
        docker image inspect --format '{{ '{{' }}.Config.Labels.git_sha{{ '}}' }}'
        {{ swarm_registry_url }}/{{ item.registry_tag }}
      register: image_inspect
      changed_when: false
      failed_when: false
      loop: "{{ build_plan }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Build image (only when its own sources changed)
      ansible.builtin.shell: >
        docker build
        -f {{ deploy_dir }}/{{ item.item.dockerfile }}
        -t {{ item.item.source_tag }}
        --label git_sha={{ item.item.sha }}
        {{ deploy_dir }}/{{ item.item.context }}
      loop: "{{ image_inspect.results }}"
      # Rebuild when: the image is absent (rc != 0), its label differs from the
      # source SHA, or the SHA is empty (paths not in history yet — fail safe by
      # rebuilding rather than silently skipping).
      when: >
        item.rc != 0
        or item.item.sha == ''
        or (item.stdout | trim) != item.item.sha
      loop_control:
        label: "{{ item.item.name }}"
      register: build_results
      # OPEA images (torch/CUDA, cold build) can take well over 5 min on a fresh
      # box; a 30-min ceiling avoids a premature async timeout aborting the play.
      async: 1800
      poll: 30

    - name: Tag image for registry
      ansible.builtin.command: >
        docker tag {{ item.item.item.source_tag }}
        {{ swarm_registry_url }}/{{ item.item.item.registry_tag }}
      loop: "{{ build_results.results }}"
      when: item.skipped is not defined
      loop_control:
        label: "{{ item.item.item.name }}"

    - name: Push image to registry
      ansible.builtin.command: >
        docker push {{ swarm_registry_url }}/{{ item.item.item.registry_tag }}
      loop: "{{ build_results.results }}"
      when: item.skipped is not defined
      loop_control:
        label: "{{ item.item.item.name }}"

    # Publish {registry_tag: sha} so the redeploy path can verify what shipped.
    #
    # redeploy.sh cannot recompute these itself: the SHA is per-image, derived from
    # `git log -1 -- <that image's watch paths>`, and duplicating the image table
    # from "Define image build list" into bash guarantees the two drift apart. It
    # must not compare against a global `git rev-parse HEAD` either — unchanged
    # images deliberately keep an older SHA, so every one of them would look stale.
    #
    # Written outside {{ deploy_dir }} on purpose: redeploy.sh runs `git add -A`
    # over that tree, and a file regenerated on every deploy has no business
    # entering the repo history.
    - name: Ensure the state directory exists
      ansible.builtin.file:
        path: /var/lib/genieai
        state: directory
        mode: "0755"

    - name: Record the per-image build plan for post-deploy verification
      ansible.builtin.copy:
        content: "{{ build_plan | items2dict(key_name='registry_tag', value_name='sha') | to_nice_json }}"
        dest: /var/lib/genieai/build-plan.json
        mode: "0644"

- name: GENIE.AI - Generate .env and deploy stack
  hosts: swarm_managers
  tags: [deploy]
  become: true
  tasks:
    - name: Validate required vault variables
      ansible.builtin.assert:
        that:
          - arango_password is defined and arango_password | length > 0
          - translation_cache_password is defined and translation_cache_password | length > 0
          - postgres_password is defined and postgres_password | length > 0
          - kong_db_password is defined and kong_db_password | length > 0
          - keycloak_admin_password is defined and keycloak_admin_password | length > 0
          - genie_admin_password is defined and genie_admin_password | length > 0
          - genie_admin_email is defined and genie_admin_email | length > 0
          - keycloak_db_password is defined and keycloak_db_password | length > 0
          - keycloak_client_secret is defined and keycloak_client_secret | length > 0
          - keycloak_proxy_client_secret is defined and keycloak_proxy_client_secret | length > 0
          - kc_dataprep_client_secret is defined and kc_dataprep_client_secret | length > 0
        fail_msg: >-
          Missing required vault variable(s).
          Edit the vault file for your environment (group_vars/&lt;env&gt;.vault) and set all secrets:
          arango_password, translation_cache_password,
          postgres_password,
          kong_db_password, keycloak_admin_password, genie_admin_password, genie_admin_email,
          keycloak_db_password, keycloak_client_secret, keycloak_proxy_client_secret,
          kc_dataprep_client_secret.
        quiet: true

    - name: Set swarm registry URL
      ansible.builtin.set_fact:
        swarm_registry_url: "{{ swarm_registry_url | default('localhost:' + (registry_port | default('5000'))) }}"

    - name: Generate .env file from template
      ansible.builtin.template:
        src: env.j2
        dest: "{{ deploy_dir }}/.env"
        mode: '0600'
        owner: "{{ ansible_user }}"

    - name: Build docker compose profiles list
      ansible.builtin.set_fact:
        _compose_profiles: >-
          {% if deploy_opea is not defined or deploy_opea != '0' %}--profile opea {% endif %}
          {% if certbot_replicas is defined and certbot_replicas != '0' %}--profile letsencrypt {% endif %}

    - name: Validate compose configuration
      ansible.builtin.shell: >
        docker compose
        {% if gpu_env_file and gpu_env_file | length > 0 %}--env-file {{ deploy_dir }}/{{ gpu_env_file }}{% endif %}
        --env-file {{ deploy_dir }}/.env
        {{ _compose_profiles }}
        -f {{ deploy_dir }}/{{ compose_file }} config --quiet
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_validate
      changed_when: false

    - name: Verify critical environment variables in .env file
      ansible.builtin.shell: |
        # Verify critical variables exist and are non-empty in .env
        for var in ARANGO_PASSWORD POSTGRES_PASSWORD KC_DATAPREP_CLIENT_SECRET; do
          value=$(grep "^${var}=" {{ deploy_dir }}/.env | cut -d'=' -f2-)
          if [ -z "$value" ]; then
            echo "ERROR: $var is not set or empty in .env file!"
            exit 1
          fi
          echo "✓ $var is set"
        done
      args:
        executable: /bin/bash
        chdir: "{{ deploy_dir }}"

    - name: Generate resolved docker-compose file with substituted variables
      ansible.builtin.shell: |
        # Generate resolved compose with docker compose, then fix port types
        # (docker compose config converts port integers to strings, which
        # docker stack deploy rejects — see docker/cli#1073)
        docker compose \
          {% if gpu_env_file and gpu_env_file | length > 0 %}--env-file {{ deploy_dir }}/{{ gpu_env_file }}{% endif %}
          --env-file {{ deploy_dir }}/.env \
          {{ _compose_profiles }} \
          -f {{ deploy_dir }}/{{ compose_file }} config > {{ deploy_dir }}/docker-compose.yaml.tmp

        # Fix port types: convert quoted port numbers to bare integers
        sed -i 's/published: "\([0-9]*\)"/published: \1/g' {{ deploy_dir }}/docker-compose.yaml.tmp

        # Remove 'name' properties not supported by docker stack deploy
        sed -i '/^[[:space:]]*name:/d' {{ deploy_dir }}/docker-compose.yaml.tmp

        # Remove 'profiles' blocks not supported by docker stack deploy
        # (profiles is a multi-line YAML block: 'profiles:' + '- xxx' items)
        awk '/^[[:space:]]*profiles:/{match($0,/^[[:space:]]*/);n=RLENGTH;next} n{match($0,/^[[:space:]]*/);if(RLENGTH<=n)n=0} !n' \
          {{ deploy_dir }}/docker-compose.yaml.tmp > {{ deploy_dir }}/docker-compose.yaml.tmp2
        mv {{ deploy_dir }}/docker-compose.yaml.tmp2 {{ deploy_dir }}/docker-compose.yaml.tmp

        # Remove depends_on blocks (not supported by docker stack deploy)
        # docker compose config normalizes depends_on to mapping format which
        # Swarm rejects. Startup ordering relies on healthchecks + restart policy.
        awk '/^[[:space:]]*depends_on:/{match($0,/^[[:space:]]*/);n=RLENGTH;next} n{match($0,/^[[:space:]]*/);if(RLENGTH<=n)n=0} !n' \
          {{ deploy_dir }}/docker-compose.yaml.tmp > {{ deploy_dir }}/docker-compose.yaml.tmp2
        mv {{ deploy_dir }}/docker-compose.yaml.tmp2 {{ deploy_dir }}/docker-compose.yaml.tmp

        # Check if changed and atomically replace
        if ! diff -q {{ deploy_dir }}/docker-compose.yaml.tmp {{ deploy_dir }}/docker-compose.yaml > /dev/null 2>&1; then
          mv {{ deploy_dir }}/docker-compose.yaml.tmp {{ deploy_dir }}/docker-compose.yaml
          echo "COMPOSE_CHANGED"
        else
          rm {{ deploy_dir }}/docker-compose.yaml.tmp
          echo "COMPOSE_UNCHANGED"
        fi
      args:
        executable: /bin/bash
        chdir: "{{ deploy_dir }}"
      register: resolved_compose
      changed_when: "'COMPOSE_CHANGED' in resolved_compose.stdout"

    - name: Set permissions on resolved compose file (contains secrets)
      ansible.builtin.file:
        path: "{{ deploy_dir }}/docker-compose.yaml"
        mode: '0600'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Deploy Docker stack
      ansible.builtin.shell: |
        docker stack deploy -c {{ deploy_dir }}/docker-compose.yaml {{ stack_name }}
      args:
        chdir: "{{ deploy_dir }}"
      register: stack_deploy
      changed_when: "'Creating' in stack_deploy.stderr or 'Updating' in stack_deploy.stderr"
      when: "'COMPOSE_CHANGED' in resolved_compose.stdout"

    - name: Stack deploy output
      ansible.builtin.debug:
        var: stack_deploy.stdout_lines
      when: "'COMPOSE_CHANGED' in resolved_compose.stdout"

- name: GENIE.AI - Post-deploy verification
  hosts: swarm_managers
  tags: [deploy]
  become: true
  vars:
    _compose_changed: "{{ resolved_compose is skipped or 'COMPOSE_CHANGED' in resolved_compose.stdout }}"
  tasks:
    - name: Wait for services to stabilize
      ansible.builtin.command: docker service ls --filter label=com.docker.stack.namespace={{ stack_name }} --format "{{ '{{' }}.Name{{ '}}' }}"
      register: service_list
      until: service_list.stdout_lines | length > 0
      retries: "{{ (deploy_stabilization_timeout | int) // 10 }}"
      delay: 10
      changed_when: false
      when: _compose_changed | bool

    - name: Show running services
      ansible.builtin.command: docker service ls
      register: services_output
      changed_when: false
      when: _compose_changed | bool

    - name: Service list
      ansible.builtin.debug:
        var: services_output.stdout_lines
      when: _compose_changed | bool

    - name: Verify all running services are healthy
      # Three independent signals. Replica counts alone give a false green, which is
      # how the 2026-08-19 deploy passed this gate and then failed the backend smoke
      # test below: the gateway tier was being recreated, Kong was 5.5 minutes from
      # ready, and `docker service ls` reported kong 1/1 the whole time because the
      # outgoing task lingers and is counted. Swarm keeps a task whose healthcheck has
      # not passed OUT of its internal DNS, so nginx got NXDOMAIN for `kong` and 502'd
      # every /api request — including real user logins — while this gate said healthy.
      #
      # Prints one line per unconverged thing; empty stdout means converged.
      #
      # Exemptions live in group_vars/all.yml (deploy_health_exempt) — see the note
      # there for why the voice tier is not on the list.
      ansible.builtin.shell:
        # Explicit `cmd:` rather than free-form. Ansible splits a free-form shell body
        # using shell quoting rules and has no idea `#` starts a comment, so one stray
        # apostrophe in the prose below ("the stack prefix's underscore") makes the
        # whole playbook fail to load with "unbalanced jinja2 block or quotes". `cmd:`
        # is passed through untouched. Verified with `ansible-playbook --syntax-check`.
        cmd: |
          ns='com.docker.stack.namespace={{ stack_name }}'
          # Exact service names, matched together with the leading underscore of the
          # stack prefix so that `_kong-config` does not also match the `kong` service.
          exempt='_({{ deploy_health_exempt | join("|") }})'

          # (1) Replica counts — catches a service that never started at all. The
          # patterns are anchored on a leading space so that a service scaled above 9
          # replicas is not misread: "10/10" contains the substring "0/1", which an
          # unanchored search would flag as permanently unhealthy. ' 0/0' is a service
          # deliberately scaled to zero, not a failure.
          docker service ls --filter "label=${ns}" \
            --format '{{ "{{" }}.Name{{ "}}" }} {{ "{{" }}.Replicas{{ "}}" }}' \
            | grep -Ev "${exempt} " | grep -v ' 0/0' | grep ' 0/' \
            | sed 's/^/NO_REPLICAS /' || true

          # (2) Rolling updates still in flight — the signal that was missing. Only
          # `updating` and `rollback_started` mean Swarm is actively replacing tasks and
          # the service DNS is therefore in flux; those are worth waiting on.
          #
          # `paused` and `rollback_paused` are NOT waited on. They do not mean "in
          # progress" — they mean a rollout hit update_config.failure_action=pause and
          # stopped, and that state then persists until the next update. Both vllm
          # services sat in `paused` from 2026-08-19 (first replacement task exited 1, a
          # later one came up healthy), so waiting on it would spin the full
          # stabilization timeout and fail every deploy on stale state. A paused rollout
          # that actually left something broken is still caught by (1) and (3) below;
          # "Report stalled rolling updates" prints the rest for the record.
          #
          # An empty UpdateStatus means the service was never updated.
          for svc in $(docker service ls --filter "label=${ns}" \
                         --format '{{ "{{" }}.Name{{ "}}" }}' | grep -Ev "${exempt}$"); do
            state=$(docker service inspect "${svc}" --format \
              '{{ "{{" }}with .UpdateStatus{{ "}}" }}{{ "{{" }}.State{{ "}}" }}{{ "{{" }}end{{ "}}" }}')
            case "${state}" in
              updating|rollback_started) echo "UPDATING ${svc} ${state}" ;;
            esac
          done

          # (3) Containers up but not yet passing their healthcheck — the same blind
          # spot seen from the container side. Containers without a healthcheck report a
          # bare "Up ..." and are correctly ignored.
          #
          # NOTE: `docker ps` is node-local, so on a multi-node swarm this covers only
          # the manager. (1) and (2) go through the swarm API and are cluster-wide, so
          # they remain the backbone; treat (3) as extra cover on single-node installs
          # like aws_dev rather than a cluster-wide health check.
          docker ps --filter "label=${ns}" \
            --format '{{ "{{" }}.Names{{ "}}" }} {{ "{{" }}.Status{{ "}}" }}' \
            | grep -Ev "${exempt}\." \
            | grep -E 'health: starting|\(unhealthy\)' \
            | sed 's/^/UNHEALTHY /' || true
        executable: /bin/bash
      register: replica_check
      until: (replica_check.stdout | trim) == ''
      retries: "{{ (deploy_stabilization_timeout | int) // 30 }}"
      delay: 30
      changed_when: false
      when: _compose_changed | bool

    - name: Report stalled rolling updates
      # Deliberately not fatal and not retried — see the note in the gate above. A
      # rollout that paused but left the service running and healthy is benign, and
      # the state sticks around until the next update, so failing on it would block
      # deploys on history. Printing it keeps it out of the silent-failure category.
      ansible.builtin.shell:
        # Explicit `cmd:` for the same reason as the gate above.
        cmd: |
          # One-shot jobs are excluded: a task that runs to completion IS an "early
          # termination" to Swarm, so kong-migrations and friends report `paused` after
          # every single deploy. Listing them would be pure noise.
          for svc in $(docker service ls \
                         --filter "label=com.docker.stack.namespace={{ stack_name }}" \
                         --format '{{ "{{" }}.Name{{ "}}" }}' \
                         | grep -Ev '_({{ deploy_health_exempt | join("|") }})$'); do
            state=$(docker service inspect "${svc}" --format \
              '{{ "{{" }}with .UpdateStatus{{ "}}" }}{{ "{{" }}.State{{ "}}" }}{{ "{{" }}end{{ "}}" }}')
            case "${state}" in
              paused|rollback_paused|rollback_completed)
                echo "${svc}: ${state} — $(docker service inspect "${svc}" --format \
                  '{{ "{{" }}with .UpdateStatus{{ "}}" }}{{ "{{" }}.Message{{ "}}" }}{{ "{{" }}end{{ "}}" }}')" ;;
            esac
          done
        executable: /bin/bash
      register: stalled_updates
      changed_when: false
      when: _compose_changed | bool

    - name: Stalled rolling updates
      ansible.builtin.debug:
        msg: >-
          {{ stalled_updates.stdout_lines if (stalled_updates.stdout | trim) != ''
             else 'none — every service rollout reached a clean terminal state' }}
      when: _compose_changed | bool

    - name: Smoke test - backend health
      ansible.builtin.uri:
        url: "https://localhost:{{ nginx_https_port | default('443') }}/api/health"
        method: GET
        validate_certs: false
        return_content: true
      register: health_check
      until: health_check.status == 200
      # Budget the same wall clock the rest of the deploy gets, rather than a
      # hard-coded count. The old 6 x 15s = 90s was shorter than a gateway-tier
      # restart: on 2026-08-19 Kong needed 5.5 minutes to converge, every attempt got
      # nginx's 502 ("kong could not be resolved"), and CI failed a deploy that was
      # already healthy 4 minutes later.
      retries: "{{ (deploy_stabilization_timeout | int) // 15 }}"
      delay: 15
      when: _compose_changed | bool

    - name: Smoke test - frontend
      ansible.builtin.uri:
        url: "https://localhost:{{ nginx_https_port | default('443') }}/"
        method: GET
        validate_certs: false
        return_content: true
      register: frontend_check
      until: frontend_check.status == 200
      # Same reasoning as the backend smoke test: nginx resolves `frontend` lazily too,
      # so 3 x 10s = 30s was shorter than a frontend task replacement.
      retries: "{{ (deploy_stabilization_timeout | int) // 10 }}"
      delay: 10
      when: _compose_changed | bool

    - name: Deployment summary
      ansible.builtin.shell: |
        echo ""
        echo "============================================="
        echo "GENIE.AI deployment complete"
        echo "============================================="
        echo "Stack: {{ stack_name }}"
        echo "Services: {{ service_list.stdout_lines | length }}"
        echo "Backend health: {{ health_check.status }}"
        echo "Frontend: {{ frontend_check.status }}"
        echo "Access: https://{{ nginx_public_domain | default('localhost') }}/"
        echo "============================================="
        echo ""
      changed_when: false
      when: _compose_changed | bool

    - name: Skip deployment notice
      ansible.builtin.shell: |
        echo ""
        echo "============================================="
        echo "GENIE.AI - No changes detected, skipping deployment."
        echo "============================================="
        echo ""
      changed_when: false
      when: not (_compose_changed | bool)

