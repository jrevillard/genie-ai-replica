  allowCrossNamespaceImport: true
  interval: 60s
  rules:
    - annotations:
        description: OTel Collector transform processor `transform/stamp_service_name_from_container`
          is dropping records OR has not accepted any in 15 min. Every fluentd-sourced
          log will then have empty `service.name` in VictoriaLogs — admin/logs filtering
          and dual-emit dedup break. Check Collector config in `configs/otel/otel-collector-config.yaml`
          (regex syntax, fluentd label forwarding in `docker-compose.yaml`'s `&fluent-logging`).
        summary: service.name stamping broken in VictoriaLogs
      condition: C
      data:
      - datasourceUid: victoriametrics
        model:
          expr: rate(otelcol_processor_dropped_log_records_total{processor="transform/stamp_service_name_from_container"}[5m])
            > 0
          instant: true
          intervalMs: 1000
          refId: A
        refId: A
        relativeTimeRange:
          from: 600
          to: 0
      - datasourceUid: victoriametrics
        model:
          expr: increase(otelcol_processor_accepted_log_records_total{processor="transform/stamp_service_name_from_container"}[15m])
            == 0
          instant: true
          intervalMs: 1000
          refId: B
        refId: B
        relativeTimeRange:
          from: 900
          to: 0
      - datasourceUid: __expr__
        model:
          expression: $A || $B
          refId: C
          type: math
        refId: C
      execErrState: Alerting
      for: 10m
      labels:
        component: otel-collector
        pipeline: logs
        severity: critical
      noDataState: OK
      title: OTel Collector — stamp_service_name_from_container processor failing
      uid: otel-stamp-service-name-fail
    - annotations:
        description: OTel Collector transform processor `transform/pii_redact` is dropping
          records OR has not accepted any in 15 min. PII may leak to VictoriaLogs unredacted.
          Check Collector config in `configs/otel/otel-collector-config.yaml` (regex syntax,
          PII key list at `configs/otel/pii-key-list.md`).
        summary: PII redactor transform broken or silent
      condition: C
      data:
      - datasourceUid: victoriametrics
        model:
          expr: rate(otelcol_processor_dropped_log_records_total{processor="transform/pii_redact"}[5m])
            > 0
          instant: true
          intervalMs: 1000
          refId: A
        refId: A
        relativeTimeRange:
          from: 600
          to: 0
      - datasourceUid: victoriametrics
        model:
          expr: increase(otelcol_processor_accepted_log_records_total{processor="transform/pii_redact"}[15m])
            == 0
          instant: true
          intervalMs: 1000
          refId: B
        refId: B
        relativeTimeRange:
          from: 900
          to: 0
      - datasourceUid: __expr__
        model:
          expression: $A || $B
          refId: C
          type: math
        refId: C
      execErrState: Alerting
      for: 10m
      labels:
        component: otel-collector
        pipeline: logs
        severity: critical
      noDataState: OK
      title: OTel Collector — pii_redact transform failing
      uid: otel-pii-redact-fail
