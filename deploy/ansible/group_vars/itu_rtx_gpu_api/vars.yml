---
# ITU RTX GPU API Node — environment-specific overrides
# Defaults live in group_vars/all.yml (GPU section)

gpu_public_domain: ai.assembly.govstack.global
gpu_https_port: "444"
certbot_email: admin@assembly.govstack.global

# TEI reranker concurrency inherited from docker-compose.gpu.yaml.j2 default (32).
# Bench-validated on .110 (shared RTX 6000 Ada 24GB): concurrent=32 uses ~250 MiB
# additional VRAM at 78 rps @ 500-char docs. Override here only if VRAM budget
# tighter (lower) or higher throughput needed (raise). Historical note — was 128
# pre-MR !510, raised to handle k=20 batch saturation under old --max-batch-tokens=1024
# cap; with the new --max-batch-tokens=8192 + --auto-truncate=false the saturation
# pattern differs (4xx oversize → typed exception path, no permit starvation).
