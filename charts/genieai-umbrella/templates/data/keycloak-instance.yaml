{{- if .Values.data.keycloak.enabled -}}
{{- $instances := .Values.data.keycloak.instances | default 1 -}}
{{- if eq .Values.clusterProfile "prod" -}}
{{- $instances = 2 -}}
{{- end -}}
apiVersion: keycloak.org/v1alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "identity") | nindent 4 }}
    # Selected by the realm CR's `instanceSelector.matchLabels` (see
    # keycloak-realm-import.yaml). v1alpha1 binds the realm to a
    # Keycloak instance by label selector rather than the older
    # `spec.keycloakCRName` reference.
    app: keycloak
    genieai.io/data-tier: identity
spec:
  instances: {{ $instances }}
  # v1alpha1 only exposes the external-DB flag — host/database/user/password
  # come from a Secret named `<keycloak-cr-name>-db-secret` (here:
  # `keycloak-db-secret`) in this namespace, with the fixed keys
  # POSTGRES_HOST / POSTGRES_DATABASE / POSTGRES_USER / POSTGRES_PASSWORD.
  # The chart's pre-existing `keycloak-db-credentials` Secret must be
  # mirrored under that name (e.g. an additional SealedSecret or a
  # template that re-exports the same data) before the operator can
  # provision the StatefulSet.
  externalDatabase:
    enabled: true
  # Operator-managed Ingress/Route is OFF: TLS + the public hostname
  # are bound at the edge (Envoy Gateway) which fronts the Keycloak
  # Service. Letting the operator create an Ingress would shadow that.
  # v1alpha1 has no `spec.http` block — the HTTP endpoint inside the
  # pod is unconditionally served; the v2alpha1 `http.httpEnabled` field
  # was removed by the upstream operator migration.
  externalAccess:
    enabled: false
{{- end -}}
