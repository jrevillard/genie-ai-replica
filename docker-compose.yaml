      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  chatqna-xeon-backend-server:
    profiles: [opea]
    depends_on:
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-chatqna-server:${OPEA_VERSION:-latest}
    working_dir: /app/ChatQnA
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${OPEA_PORT}:${OPEA_PORT}"
    environment:
      CHATQNA_TYPE: ${CHATQNA_TYPE:-ChatQnA}
      MEGA_SERVICE_HOST_IP: chatqna-xeon-backend-server
      EMBEDDING_SERVER_HOST_IP: embedding
      EMBEDDING_SERVER_PORT: 6000
      EMBEDDING_SERVER_ENDPOINT: ${EMBEDDING_SERVER_ENDPOINT:-/v1/embeddings}
      RETRIEVER_SERVICE_HOST_IP: retriever-arango-service
      RETRIEVER_SERVICE_PORT: 7000
      RERANK_SERVER_HOST_IP: reranker
      RERANK_SERVER_PORT: 8000
      LLM_SERVER_HOST_IP: vllm
      LLM_SERVER_PORT: 8000
      GUARDRAIL_SERVICE_HOST_IP: guardrail
      GUARDRAIL_SERVICE_PORT: 9090
      TRANSLATION_SERVICE_HOST_IP: vllm-translation-guardrail
      TRANSLATION_SERVICE_PORT: 9031
      DOC_REPO_URL: http://document-repository:3001
      BACKEND_SERVICE_URL: http://backend:3000
      KEYCLOAK_URL: https://${NGINX_PUBLIC_DOMAIN:-localhost}/auth
      KC_REALM: ${KEYCLOAK_REALM:-genie}
      KC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-genie-app}
      CHATQNA_SYSTEM_PROMPT: ${CHATQNA_SYSTEM_PROMPT:-}
      CHATQNA_ENFORCE_ABSTENTION: ${CHATQNA_ENFORCE_ABSTENTION:-true}
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  # OPEA UI/Nginx - disabled by default via profiles: [opea] (compose up) / replicas: 0 (Swarm).
  # Activate for OPEA debugging: compose up --profile opea / Swarm: change replicas to 1.
  chatqna-xeon-ui-server:
    profiles: [opea]
    restart: "no"
    image: opea/chatqna-ui:latest
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${FRONTEND_SERVICE_PORT}:${FRONTEND_SERVICE_PORT}"
    environment:
      UPLOAD_FILE_BASE_URL: http://dataprep-arango-service:5000/v1/dataprep/ingest
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/5173' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  chatqna-xeon-nginx-server:
    profiles: [opea]
    restart: "no"
    image: opea/nginx:latest
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${NGINX_PORT}:${NGINX_PORT}"
    environment:
      FRONTEND_SERVICE_IP: chatqna-xeon-ui-server
      FRONTEND_SERVICE_PORT: 5173
      BACKEND_SERVICE_NAME: chatqna-xeon-backend-server
      BACKEND_SERVICE_IP: chatqna-xeon-backend-server
      BACKEND_SERVICE_PORT: 8888
      DATAPREP_SERVICE_IP: dataprep-arango-service
      DATAPREP_SERVICE_PORT: 5000
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/80' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  # PostgreSQL initialization (creates dedicated databases and users for each service)
  postgres-init:
    build: configs/postgres/
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-postgres-init:latest
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-genieai}
      - PGDATABASE=${PGDATABASE:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KONG_DB_PASSWORD=${KONG_DB_PASSWORD}
      - KEYCLOAK_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    entrypoint: ["sh", "/init-databases.sh"]
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Keycloak Identity Provider
  keycloak:
    build: configs/keycloak/
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-keycloak:latest
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=${KC_DB:-postgres}
      - KC_DB_URL=${KC_DB_URL:-jdbc:postgresql://postgres:5432/keycloak}
      - KC_DB_USERNAME=${KC_DB_USERNAME:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=https://${NGINX_PUBLIC_DOMAIN:-localhost}/auth
      # Enable HTTP — NGINX handles TLS termination, Keycloak only needs HTTP internally
      - KC_HTTP_ENABLED=true
      # SMTP (reuses EMAIL_* from Section 2)
      # EMAIL_SECURE maps to implicit SSL (port 465); STARTTLS is always enabled separately
      # If EMAIL_HOST is empty, SMTP is effectively disabled (Keycloak logs warnings but functions without email)
      - KC_SMTP_HOST=${EMAIL_HOST:-}
      - KC_SMTP_PORT=${EMAIL_PORT:-587}
      - KC_SMTP_SSL=${EMAIL_SECURE:-false}
      # AUTH derived from EMAIL_USER: enabled when user is set, disabled otherwise
      - KC_SMTP_AUTH=${EMAIL_USER:+true}
      # STARTTLS=true for default port 587; ignored when KC_SMTP_SSL=true (port 465)
      - KC_SMTP_STARTTLS=true
      - KC_SMTP_USER=${EMAIL_USER:-}
      - KC_SMTP_PASSWORD=${EMAIL_PASSWORD:-}
      - KC_SMTP_FROM=${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # Keycloak realm configuration via keycloak-config-cli (runs once after Keycloak is healthy)
  keycloak-config:
    build:
      context: configs/keycloak/
      dockerfile: Dockerfile.config-cli
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-keycloak-config:latest
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - IMPORT_FILES=/config/genie-realm.yaml
      - IMPORT_VARSUBSTITUTION_ENABLED=true
      - IMPORT_CACHE_ENABLED=true
      # Variables referenced in genie-realm.yaml via $(env:VAR) substitution
      - KC_REALM=${KEYCLOAK_REALM:-genie}
      - KC_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
      - GENIE_ADMIN_USERNAME=${GENIE_ADMIN_USERNAME:-genie-admin}
      - GENIE_ADMIN_PASSWORD=${GENIE_ADMIN_PASSWORD}
      - GENIE_ADMIN_EMAIL=${GENIE_ADMIN_EMAIL}
      - KC_PROXY_CLIENT_SECRET=${KEYCLOAK_PROXY_CLIENT_SECRET}
      - KC_DATAPREP_CLIENT_SECRET=${KC_DATAPREP_CLIENT_SECRET}
      - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
      # Realm properties (registration, email, security, localization, tokens)
      - KEYCLOAK_REGISTRATION_ENABLED=${KEYCLOAK_REGISTRATION_ENABLED:-true}
      - KEYCLOAK_VERIFY_EMAIL=${KEYCLOAK_VERIFY_EMAIL:-true}
      - KEYCLOAK_RESET_PASSWORD=${KEYCLOAK_RESET_PASSWORD:-true}
      - KEYCLOAK_LOGIN_WITH_EMAIL=${KEYCLOAK_LOGIN_WITH_EMAIL:-true}
      - KEYCLOAK_DUPLICATE_EMAILS=${KEYCLOAK_DUPLICATE_EMAILS:-false}
      - KEYCLOAK_BRUTE_FORCE=${KEYCLOAK_BRUTE_FORCE:-true}
      - KEYCLOAK_PASSWORD_POLICY=${KEYCLOAK_PASSWORD_POLICY:-"length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)"}
      - KEYCLOAK_THEME=${KEYCLOAK_THEME:-genie}
      - KEYCLOAK_I18N_ENABLED=${KEYCLOAK_I18N_ENABLED:-true}
      - KEYCLOAK_LOCALE=${KEYCLOAK_LOCALE:-en}
      - KEYCLOAK_ACCESS_TOKEN_LIFESPAN=${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:-300}
      # SMTP (reuses EMAIL_* — required because realm smtpServer overrides server-level KC_SMTP_*)
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_SMTP_AUTH=${EMAIL_USER:+true}
      - EMAIL_SMTP_STARTTLS=true
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/config-done"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10

networks:
  genieai_network:
    attachable: true
