{{- if .Values.ingress.enabled -}}
{{- /*
  Edge routing: the Gateway owns the hostname and TLS, this route owns
  the path matrix. Gateway API resolves rule matches by rule-list order
  (first match wins — NOT longest-prefix), so the more-specific paths
  (/api/files, /api/labels) are listed before /api/ itself; keep that
  ordering when adding rules. Matches within a single rule are OR-ed.
  Envoy sets Host and
  X-Forwarded-* on upstream calls natively — Keycloak needs both to derive
  its issuer from the public origin instead of the in-cluster service name.

  backend / document-repository / keycloak / frontend Services are the
  only upstreams; chat SSE streams pass through unbuffered by default.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: genieai
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ingress") | nindent 4 }}
spec:
  parentRefs:
    - name: genieai
      # Bind to the https listener when TLS is on, http otherwise — the
      # Gateway renders the https listener conditionally, so sectionName
      # must name the listener that actually exists.
      sectionName: {{ if .Values.ingress.tls.enabled }}https{{ else }}http{{ end }}
  hostnames:
    # Port-free hostname — a port on ingress.host is legal for the public
    # origin (issuer, redirects) but forbidden in HTTPRoute hostnames.
    - {{ include "genieai-umbrella.ingressHostname" . | quote }}
  rules:
    {{- /* document-repository API paths: longest-prefix exceptions that beat the /api/ rule below.
       A rule whose backend Service is not rendered must not be rendered at all: a
       backendRef to a Service that does not exist leaves the whole HTTPRoute
       with ResolvedRefs=False, and the edge answers 500 on every path it
       carries — including the ones that are fine. */}}
    {{- if .Values.services.documentRepository.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /api/files
      backendRefs:
        - name: document-repository
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/labels
      backendRefs:
        - name: document-repository
          port: 80
    {{- end }}
    {{- /* Backend BFF: /api + swagger. The chat SSE stream lives here:
           Envoy's default route timeout kills long streams mid-flight
           (live-observed: backend finished in 20s, browser got a 504 at
           52s). The BACKEND owns the real stream budget
           (CHATQNA_STREAM_TIMEOUT, default 3600s) and aborts on its own;
           the edge sits above it so the application timeout governs —
           1h10m = the backend default + margin. */}}
    {{- if .Values.services.backend.enabled }}
    - matches:
        # PathPrefix "/api/" does not match the bare "/api" (the prefix
        # includes the slash) — real flows always carry subpaths, but the
        # bare form gets the same backend instead of falling through to
        # the SPA catch-all. Exact (not PathPrefix) on the bare forms: a
        # PathPrefix "/api" would also swallow "/apifoo".
        - path:
            type: PathPrefix
            value: /api/
        - path:
            type: Exact
            value: /api
        # swagger-ui is served at the bare "/api-docs"; "/api-docs/" (the
        # redirect target) must land on the backend too, not on the SPA
        # catch-all.
        - path:
            type: Exact
            value: /api-docs
        - path:
            type: PathPrefix
            value: /api-docs/
      timeouts:
        backendRequest: 1h10m
      backendRefs:
        - name: backend
          port: 80
    {{- end }}
    {{- /* Keycloak OIDC endpoints, same-origin with the SPA. The /auth
           prefix reaches Keycloak as-is (its http-relative-path is
           /auth). Envoy's upstream request carries the Host without the
           port, and Keycloak (backchannelDynamic) rebuilds the discovery
           document's token/jwks/userinfo URLs from the forwarded host —
           portless backchannel URLs the SPA then fails to reach. The
           RequestHeaderModifier re-pins X-Forwarded-Host to the full
           public origin (ingress.host, port included) so every URL in
           the discovery document matches the issuer's origin. */}}
    {{- if .Values.data.keycloak.enabled }}
    - matches:
        # Both forms: like /api, PathPrefix "/auth/" misses the bare
        # "/auth" some OIDC clients request.
        - path:
            type: PathPrefix
            value: {{ include "genieai-umbrella.keycloakContextPath" . }}/
        - path:
            type: Exact
            value: {{ include "genieai-umbrella.keycloakContextPath" . }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Host
                value: {{ .Values.ingress.host | quote }}
      backendRefs:
        - name: keycloak-service
          port: 8080
    {{- end }}
    {{- /* Grafana (opt-in tier). Before the SPA catch-all: /grafana
           would otherwise be served by the frontend. The Service name is
           pinned by spec.service.metadata.name in the Grafana CR, so this
           backendRef and the operator agree by construction. */ -}}
    {{- if .Values.observability.grafana.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: genieai-grafana
          port: 80
    {{- end }}
    {{- /* Frontend SPA catch-all. */}}
    {{- if .Values.services.frontend.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
    {{- end }}
{{- end -}}
