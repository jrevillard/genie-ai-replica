# TARGET-STATE EXAMPLE — as written, this Application CANNOT sync from a
# plain repo clone: ArgoCD does not run `helm dependency build`, and the
# vendored genieai-common tarball (charts/genieai-umbrella/charts/*.tgz)
# is deliberately gitignored (regenerated via `make deps` in charts/).
# The manifest illustrates the target state once the chart publishes to a
# registry (OCI artifact or a Helm repo) — sync from a repo `path:` only
# works after the dependency tarball exists in the cloned tree.
#
# IMPORTANT: do NOT render — apply manually.
# This file is a literal ArgoCD Application manifest, NOT a Helm template.
# Apply with:
#   kubectl apply -f argocd-application.yaml -n argocd
# Pre-conditions:
#   - ArgoCD installed in the `argocd` namespace
#   - an AppProject named `genieai` exists (spec.project below), e.g.
#     `kubectl apply -f` an AppProject manifest granting the repo + destinations
#   - the target cluster is the current kubectl context
#
# HELM HOOKS UNDER ARGOCD: ArgoCD does run them. It maps the helm.sh/hook
# types `pre-install` and `pre-upgrade` to its PreSync phase, and
# `post-install` and `post-upgrade` to PostSync. So all three of this
# chart's hooks DO run under ArgoCD: the pre-upgrade drift Jobs
# (dependency check, cluster-profile detect) as PreSync, and the realm
# convergence Job as PostSync.
#
# Two consequences worth stating plainly:
#   - They re-run on every sync, not only when what they watch changed.
#     ArgoCD has no change-gating for hooks, so the convergence Job
#     reconciles the realm on every ArgoCD sync, not only on a release
#     that changed it.
#   - `post-rollback` is not in ArgoCD's hook map. ArgoCD has no
#     distinct rollback phase; a "rollback" is a resync to a prior SHA,
#     which re-fires PostSync. Convergence still happens there.
#
# LIMITATION (destructive prune): ArgoCD deletes rendered resources
# directly when pruning. An automated prune of this Application removes
# the Namespace and every PVC inside it with no confirmation gate,
# because Helm lifecycle hooks do not run on prune. Protect
# GitOps-delivered instances with an ArgoCD-native mechanism
# (sync-options disabling automated prune, or finalizers), not with a
# Helm hook — a Helm hook only protects `helm uninstall`.
#
# Per-env overlays under deploy/environments/<env>/ land with the
# environment-tier work — until then this example installs the umbrella
# chart DIRECTLY from its repo path (ArgoCD auto-detects the Helm chart via
# the Chart.yaml in the path; no valueFiles are set, so chart defaults
# apply). When the overlays exist, point path at
# deploy/environments/<env>/ (the Kustomize overlay composing the chart
# with that env's values), and for el-salvador-style envs also change
# targetRevision: HEAD -> release/<env> and namespace: genieai ->
# genieai-<env>.
---
# - repoURL uses the scp-like SSH form since GitLab requires auth; the ssh://
#   form needs an explicit numeric port (ssh://git@host:22/un/...) — the
#   `:un` segment of the naive URL parses as a port and breaks.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: genieai-dev
  namespace: argocd
spec:
  project: genieai
  source:
    repoURL: git@opensource.unicc.org:un/itu/genie-ai.git
    targetRevision: HEAD
    # The chart itself, not a per-env overlay — see the comment block above.
    path: charts/genieai-umbrella
  destination:
    server: https://kubernetes.default.svc
    namespace: genieai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
