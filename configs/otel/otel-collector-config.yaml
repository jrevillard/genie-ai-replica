# =============================================================================
# GENIE.AI — OpenTelemetry Collector Configuration
# =============================================================================
# Receives OTLP traces from instrumented services (backend, chatqna, retriever,
# dataprep, reranker) and exports metrics to VictoriaMetrics.
# Receives container logs via Docker fluentd logging driver and forwards to
# VictoriaLogs.
# Exports traces to VictoriaTraces for distributed trace storage and query.
#
# Receivers:
#   - OTLP HTTP (port 4318): standard OTLP/HTTP from SDK auto-instrumentation
#   - fluent_forward (port 24224): receives logs from Docker fluentd logging driver
#
# Exporters:
#   - prometheusremotewrite (port 8428): exports OTel metrics to VictoriaMetrics
#   - victoriatraces (port 10428): exports traces to VictoriaTraces via OTLP HTTP
#   - otlphttp (port 9428): exports logs to VictoriaLogs via OTLP HTTP
#
# Extensions:
#   - health_check (port 13133): Docker healthcheck endpoint
#
# Pipeline:
#   metrics: otlp → batch → prometheusremotewrite
#   traces:  otlp → probabilistic_sampler → batch → victoriatraces
#   logs:    fluent_forward → batch → otlphttp
#
# Note: Docker services use the fluentd logging driver (driver: fluentd)
# configured in docker-compose.yaml. Docker sends container stdout/stderr to
# the collector's fluent_forward receiver on port 24224. Dual logging (Docker
# 20.10+) keeps `docker logs` functional alongside the fluentd driver.
# =============================================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  fluent_forward:
    endpoint: 0.0.0.0:24224

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048
  probabilistic_sampler:
    sampling_percentage: ${OTEL_TRACES_SAMPLER_RATE:1.0}

exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    timeout: 15s
  victoriatraces:
    traces_endpoint: http://victoriatraces:10428/insert/opentelemetry/v1/traces
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
      storage: file
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    timeout: 15s
  otlp_http:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

service:
  extensions:
    - health_check
  pipelines:
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - prometheusremotewrite
    traces:
      receivers:
        - otlp
      processors:
        - probabilistic_sampler
        - batch
      exporters:
        - victoriatraces
    logs:
      receivers:
        - fluent_forward
      processors:
        - batch
      exporters:
        - otlp_http
