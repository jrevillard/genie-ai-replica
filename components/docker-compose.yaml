version: '3.8'

services:
  frontend:
    build: ./gov-chat-frontend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=production
      - VUE_APP_API_URL=https://e2e-82-109.ssdcloudindia.net:443/api
    depends_on:
      - backend
    networks:
      - chatqna_default

  backend:
    build:
      context: .
      dockerfile: gov-chat-backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./database_backups:/app/database_backups
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gov-chat-backend/Uploads:/app/Uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PREFIX=/api
      - UPLOAD_DIR=./Uploads
      - MAX_FILE_SIZE=5242880
      - SESSION_SECRET=${SESSION_SECRET:-default-session-secret}
      - SESSION_EXPIRATION_TIME=1800000
      - CORS_ORIGIN=https://e2e-82-109.ssdcloudindia.net/
      - EMAIL_HOST=in-V3.mailjet.com
      - EMAIL_PORT=587
      - EMAIL_SECURE=false
      - EMAIL_USER=187ad3288090609e6e282b07f359acd4
      - EMAIL_PASSWORD=6615d81ddd46faab7e69eb6710ac364a
      - EMAIL_FROM=fordendk@gmail.com
      - APP_NAME=Huduma AI
      - FRONTEND_URL=https://e2e-82-109.ssdcloudindia.net/
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_DB=node-services
      - ARANGO_USER=root
      - ARANGO_PASSWORD=${ARANGO_PASSWORD:-default-arango-password}
      - BACKUP_DIR=./database_backups
      - MAX_BACKUPS=5
      - BACKUP_FORMAT=json
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret}
      - JWT_EXPIRES_IN=24h
      - LOG_LEVEL=debug
      - OPEA_HOST=e2e-109-198
      - OPEA_PORT=8888
      - CONTEXT_OPTION=single-message
    env_file:
      - ./gov-chat-backend/.env
    networks:
      - chatqna_default

networks:
  chatqna_default:
    external: true
