{{- /* The convergence block is CLEARABLE: a cleared block means "no
convergence" (the same as enabled: false), not a nil-pointer crash. */ -}}
{{- $assets := index .Subcharts "genieai-assets" -}}
{{- $data := .Values.data | default dict -}}
{{- $keycloak := $data.keycloak | default dict -}}
{{- $convergence := $keycloak.convergence | default dict -}}
{{- if and $keycloak.enabled $convergence.enabled -}}
{{- /*
The realm body is a chart file, not rendered from values: it already
carries 32 distinct `$(env:VAR)` placeholders (40 occurrences) covering every per-deployment
value, so templating it here would mean re-inventing a realm-authoring
engine to reproduce a file that is already parameterised.

Rendered into a Secret rather than a ConfigMap because the CONVERGENCE
JOB mounts it and the file is the only place the realm body lives. The
body is UNRESOLVED: it still carries the `$(env:VAR)` placeholders, and
the secret VALUES (client secrets, admin password) live only in the
Job's environment, injected from the operator-provided Secrets the Job
lists in data.keycloak.convergence.envSecrets. Nothing in this Secret
is a credential — kcc substitutes at import time, and does not write
back, so this is a mount-only read.

The placeholder-completeness assertion lives in the Job template, not
here: it must compare the realm's placeholders against the env that
template actually emits, and a hand-maintained list here could drift
from that env block without failing anything.
*/ -}}
{{- $realmFile := $assets.Files.Get "files/genie-realm.yaml" -}}
{{- if not $realmFile -}}
{{- fail "files/genie-realm.yaml is missing from the chart; the convergence Job has nothing to apply" -}}
{{- end -}}
{{- $ns := .Values.namespace -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-keycloak-realm" (include "genieai-common.fullname" .) }}
  namespace: {{ $ns }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "identity") | nindent 4 }}
    genieai.io/data-tier: identity
type: Opaque
stringData:
  genie-realm.yaml: |
{{ $realmFile | indent 4 }}
{{- end -}}
