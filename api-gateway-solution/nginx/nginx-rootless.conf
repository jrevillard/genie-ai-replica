# Non-root nginx entry configuration (#1227). The edge runs as uid 101
# (the image's nginx user), so every path nginx writes lives under /tmp and
# the rendered server block is included from /tmp/rendered-default.conf —
# /etc/nginx/conf.d/ carries only static snippet/data files the rendered
# config references by absolute path, never an included server block.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    include /tmp/rendered-default.conf;
}
