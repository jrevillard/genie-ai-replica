{{/*
Hostname without any port. ingress.host MAY carry a public port (e.g.
genieai.local:4443 when a non-privileged local forward fronts the edge);
the OIDC issuer and KC_PUBLIC_ORIGIN keep the port, but Gateway API
hostnames, certificate dnsNames and SAN-derived secret names must not —
HTTPRoute hostname validation rejects ports, and hostname matching
strips the port from the Host header anyway.

An IPv6 literal ("[2001:db8::1]:4443") cannot be split on ":" — every
derivation below would produce garbage (hostname "[2001", and
"db8" | int = 8 for the port), so both helpers fail the render instead.
An ingress fronting IPv6 still serves hosts by DNS name.
*/}}
{{- define "genieai-umbrella.ingressHost" -}}
{{- $host := .Values.ingress.host | required "ingress.host is required — supply the public hostname (may carry :port) in the environment overlay" -}}
{{- if contains "[" $host -}}
{{- fail (printf "ingress.host must be a DNS hostname optionally followed by :port — an IPv6 literal (%s) cannot be split; use a hostname" $host) -}}
{{- end -}}
{{- $host -}}
{{- end -}}
{{- define "genieai-umbrella.ingressHostname" -}}
{{- (include "genieai-umbrella.ingressHost" . | splitList ":" | first) -}}
{{- end -}}
{{/*
The PUBLIC port from ingress.host — the single derivation site for the
https listener port and the HTTPRoute redirect port. Bare host → 443.

The port is VALIDATED here. Sprig's `int` is lenient: "443x" converts to
0, and the render then carries `port: 0` — the API server rejects the
Gateway with "spec.listeners[1].port: Invalid value: 0", a message that
names a CR field instead of the values key the operator typed. The IPv6
sibling of this guard fails the render by name; this one does the same.
*/}}
{{- define "genieai-umbrella.ingressPublicPort" -}}
{{- $parts := include "genieai-umbrella.ingressHost" . | splitList ":" -}}
{{- $port := "443" -}}
{{- if gt (len $parts) 1 -}}
{{- $port = index $parts 1 -}}
{{- if not (regexMatch "^[0-9]{1,5}$" $port) -}}
{{- fail (printf "ingress.host carries an invalid port %q: the port must be numeric (a value like \"genieai.local:443x\" renders port 0 and the API server rejects the Gateway listener)" $port) -}}
{{- end -}}
{{- if or (lt (int $port) 1) (gt (int $port) 65535) -}}
{{- fail (printf "ingress.host carries an out-of-range port %q: a TCP port is between 1 and 65535" $port) -}}
{{- end -}}
{{- end -}}
{{- $port | int -}}
{{- end -}}
{{/*
Canonical TLS Secret name. Precedence:
  1. ingress.tls.secretName — operator pre-baked certificate (sovereign
     deployments that manage keys outside cert-manager). Setting it also
     suppresses the chart's Certificate CR.
  2. <host>-tls — matches the cert-manager Certificate CR this chart
     renders (its secretName uses this same helper).
The Gateway listener's certificateRefs and the Certificate CR both call
this helper — a second derivation site would let the two drift and leave
the https listener waiting on a Secret nobody writes.
*/}}
{{- define "genieai-umbrella.tlsSecretName" -}}
{{- .Values.ingress.tls.secretName | default (printf "%s-tls" (include "genieai-umbrella.ingressHostname" .)) -}}
{{- end -}}
{{- if .Values.ingress.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: genieai
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ingress") | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.ingress.className | default "envoy" | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- /*
      The https listener renders ONLY when ingress.tls.enabled — Gateway
      API rejects `tls: {mode: Terminate}` without a certificateRefs
      entry, so the listener is rendered fully or not at all. The http
      listener stays for the cert-manager http01 bootstrap path and for
      HTTP→HTTPS redirect, which the operator expresses as an HTTPRoute
      with a requestRedirect filter attached to the http listener.
    */ -}}
    {{- if .Values.ingress.tls.enabled }}
    - name: https
      protocol: HTTPS
      # The listener binds the PUBLIC port — the one ingress.host carries
      # (443 when bare). Envoy derives X-Forwarded-Port from the listener
      # and Keycloak (backchannelDynamic) builds the discovery document's
      # token/jwks/userinfo URLs from those headers; a listener on 443
      # behind a port-bearing origin serves portless backchannel URLs and
      # the SPA's token exchange fails. Single source of truth: the port
      # in ingress.host.
      port: {{ include "genieai-umbrella.ingressPublicPort" . }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "genieai-umbrella.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end -}}
