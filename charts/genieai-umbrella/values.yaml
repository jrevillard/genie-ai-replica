# GENIE.AI umbrella chart — foundation values.
# The keys below are the ones the current template surface consumes. Service
# tiers (services.*, observability.*, data.*, ingress.*, gpu.*, migration.*)
# and the pluggability surface (secretsBackend / ingressClassName /
# storageClassName / containerRuntime) are added together with the templates
# that consume them — keys no template reads are not declared here.

# Target namespace for tier templates that spell one out. MUST equal the
# release namespace (-n) — the chart fails the render otherwise (the
# Namespace resource and test pod follow .Release.Namespace).
namespace: genieai

global:
  imageRegistry: ""
  imagePullSecrets: []
  # Hook + test-pod init containers curl-download kubectl + jq from the
  # public releases. In air-gapped environments set this to an
  # internal mirror URL (no scheme) so the init container hits a
  # local proxy; the paths /release/v1.33.0/bin/linux/amd64/kubectl
  # and /jq/releases/download/jq-1.7.1/jq-linux-amd64 are appended
  # automatically. Default = empty (use the public URLs).
  kubeletToolsMirror: ""

# Drives chart-derived defaults (replica counts, data-tier topology,
# observability). dev | staging | prod (sovereign is reserved — its branches
# land with the sovereign deployment tier; it is rejected until then).
clusterProfile: dev

# data layer values

# Declared alongside the templates that dereference them:
# the data-tier PVCs read `pluggable.storageClassName`, the realm-import
# redirect URLs read `ingress.host`. Helm nil-pointer-evaluates
# a missing parent map even under `with`/`default` guards — the keys must
# exist in values.yaml before any template reads them.
# Per-environment overrides elaborate both blocks; do not duplicate them here.
pluggable:
  storageClassName: ""                # "" = cluster default storage class

ingress:
  host: genieai.local                 # public hostname for redirect URLs

data:
  # The `enabled` toggles gate the custom resources only; the operator
  # controllers that reconcile them (CNPG, kube-arangodb, keycloak-operator)
  # are cluster bootstrap prerequisites — see the README's Cluster
  # prerequisites section.
  # The services tier's enabled toggles are added with the service-tier plan
  # (Plan 3); until then the dep-check validates only the data tier
  # (default). The dep-check loop iterates both `services` and `data`
  # tiers but reads `false` for every services.* key until those toggles
  # land — the service→data validation half is therefore decorative today.
  postgres:
    enabled: true
    # CNPG Cluster resources for the keycloak-db (the only Postgres; the edge
    # tier is Envoy Gateway, not Kong).
    instances: 1                       # 3 on prod via clusterProfile (staging keeps 1; the Arango tier promotes to cluster on both prod and staging — Postgres HA is prod-only)
    storageSize: 10Gi
  arangodb:
    enabled: true
    # Arango deployment mode. THIS VALUE IS THE ONLY SOURCE OF TRUTH for
    # the rendered ArangoDeployment mode — the chart does NOT auto-promote
    # on clusterProfile changes (kube-arangodb requires fresh uninstall+install
    # for mode switches; see docs/charts/arangodb-mode-migration.md). Operators
    # switch by editing this value, then running helm uninstall + helm install.
    mode: single
    storageSize: 50Gi
    agentsStorageSize: 2Gi             # cluster-mode Agency volume — config state (MBs), not document data
  keycloak:
    # Gates the Keycloak + KeycloakRealmImport CRs. The operator
    # itself is a cluster bootstrap prerequisite — NOT a chart dependency.
    enabled: true
    instances: 1                      # 2 on prod via clusterProfile
    realmImport: true
    adminEmail: genie-admin@genieai.local
    # Gates the new-user email-verification flow; requires smtp to be set
    # when true (Keycloak rejects verification emails without a server).
    verifyEmail: false
    # Realm password policy; empty = no `passwordPolicy` field rendered;
    # Keycloak's built-in default applies (no length/charcase/digit/special
    # requirements). For a strong policy set the same value as the Swarm
    # export: `length(12) and upperCase(1) and lowerCase(1) and digits(1)
    # and specialChars(1)`.
    passwordPolicy: ""
    # Login-page locales; empty = default 9-locale list.
    supportedLocales: []
    # Access-token TTL in seconds (compose parity).
    accessTokenLifespan: 300
    # Confidential-client secrets rendered into the realm import — these
    # values feed the KeycloakRealmImport CR directly (it cannot read
    # Kubernetes Secrets; operators supply the real values at install time
    # via values override, never committed). The SealedSecrets carrying
    # the same values for the backend/dataprep/grafana consumers arrive
    # with their service tiers.
    clientSecrets:
      proxyClient: change-me-proxy-client
      dataprep: change-me-dataprep-client
      grafana: change-me-grafana-client
    # Fail the render when any clientSecrets value is still a change-me
    # placeholder. Default is TRUE so a default install with
    # `change-me-*` client secrets now FAILS the render; opt back to
    # false only in dev/kind where the placeholder is acceptable.
    failOnPlaceholderSecrets: true
    # SMTP for email verification — leave null to disable (no smtpServer
    # block renders); set all fields in the environment override when used.
    smtp: null
    mobileClientId: genie-mobile          # Flutter OIDC client (public, PKCE)
    mobileRedirectScheme: genieai         # <scheme>://callback redirect

# service ↔ data dependency graph (used by pre-install hook).
# Read by the dependency-check hook Job; values are intentionally declarative
# to keep the static analysis simple (no chart-template evaluation at
# Job runtime).
#
# Each key maps a component to the list of components it requires. The Job
# fails the install if a service is enabled but any of its listed targets
# is not.
dependencyGraph:
  services:
    backend:
      - keycloak
      - arangodb
      - redisCache
    redisCache: []
    frontend:
      - backend
    documentRepository:
      - backend
    clamav: []
  data:
    postgres:
      - ""                                # no deps; lowest tier
    arangodb:
      - ""
    keycloak:
      - postgres

secrets:
  sealedSecrets:
    enabled: true                      # default; alternative secrets backends plug in here (ESO / SecretProviderClass)
  eso:
    enabled: false                     # plug-point; ESO controller installs separately
  secretProviderClass:
    enabled: false                     # plug-point; SecretProviderClass resources managed externally

# Stateless application tier. Each entry drives a per-service Deployment
# rendered by the corresponding template under templates/services/.
#
# Per-service entry shape:
#   enabled: master toggle for the rendered resource
#   replicas: pod count baseline; prod/staging overrides in clusterProfileReplicas
#   image.repository / image.tag: container image pulled at deploy time
#   port: container port (also the Service port)
#   resources: k8s requests + limits (CPU + memory)
#   env: raw env entries appended to the rendered Deployment
#   secrets: K8s Secret refs consumed via envFrom (each entry: {name: <secret-name>};
#            the whole Secret is mounted — every key in the Secret becomes an env var)
#   pvc: optional PersistentVolumeClaim spec for stateful services
#   volumes: optional PodSpec volumes (PVC, ConfigMap, emptyDir, ...)
#   volumeMounts: optional container volumeMounts (subPath supported)
#   probes: readiness/liveness/startup probe definitions
#   podDisruptionBudget: optional PDB; null disables
#   serviceMonitor: opt-in Prometheus scrape; gated by observability.enabled
services:
  backend:
    enabled: true
    replicas: 1
    image: { repository: registry.example.org/genie-ai-backend, tag: "1.0.0" }
    port: 3000
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 1Gi } }
    env: []
    secrets:
      - name: keycloak-client-secret
      - name: huggingface-hub-token
      - name: email-password
      - name: translation-cache-password
    pvc: null
    probes:
      readiness: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10 }
      liveness:  { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 30, periodSeconds: 30 }
      startup:   { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 5, failureThreshold: 12 }
    podDisruptionBudget: { minAvailable: 1 }
    serviceMonitor: false

  frontend:
    enabled: true
    replicas: 1
    image: { repository: registry.example.org/genie-ai-frontend, tag: "1.0.0" }
    port: 8090
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
    env: []
    secrets: []
    pvc: null
    probes:
      readiness: { httpGet: { path: /health, port: 8090 }, initialDelaySeconds: 5, periodSeconds: 10 }
      liveness:  { httpGet: { path: /health, port: 8090 }, initialDelaySeconds: 30, periodSeconds: 30 }
    podDisruptionBudget: null
    serviceMonitor: false

  documentRepository:
    enabled: true
    replicas: 1
    image: { repository: registry.example.org/genie-ai-document-repository, tag: "1.0.0" }
    port: 3001
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 1Gi } }
    env: []
    secrets: []
    pvc:
      enabled: true                     # rendered as PVC by the doc-repo template
      storageSize: 20Gi
    volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: document-repository-uploads
    volumeMounts:
      - name: uploads
        mountPath: /app/uploads
    probes:
      readiness: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 10, periodSeconds: 10 }
      liveness:  { tcpSocket: { port: 3001 }, initialDelaySeconds: 30, periodSeconds: 30 }
    podDisruptionBudget: null
    serviceMonitor: false

  nginx:
    enabled: true
    replicas: 1
    # The stock image's baked nginx config proxies /api to the Kong gateway,
    # which is no longer deployed. The edge tier mounts a ConfigMap over
    # the upstream template so this image can serve the SPA + backend proxy.
    image: { repository: registry.example.org/genie-ai-nginx, tag: "1.0.0" }
    port: 8080
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
    env: []
    secrets: []
    pvc: null
    # The genie-ai-nginx entrypoint envsubst-renders default.conf FROM its
    # baked template AT STARTUP; mounting a read-only subPath OVER the
    # rendered file would fail with EROFS. Mount the ConfigMap over the
    # template PATH so envsubst reads the override and emits a writable
    # default.conf.
    volumes:
      - name: conf
        configMap:
          name: nginx-override
          defaultMode: 0o444
    volumeMounts:
      - name: conf
        mountPath: /etc/nginx/conf.d/default.conf.template
        subPath: default.conf.template
    probes:
      readiness: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
      liveness:  { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 30 }
    podDisruptionBudget: null
    serviceMonitor: false

  clamav:
    enabled: true
    replicas: 1
    image: { repository: clamav/clamav, tag: "1.3" }
    port: 3310
    # The shared per-service template applies a default non-root
    # securityContext; this service requires a fully-restated block
    # because runAsUser must match the upstream image's clamav account
    # (uid 100).
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
    resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: 1, memory: 1Gi } }
    env: []
    secrets: []
    pvc: null
    probes:
      readiness: { tcpSocket: { port: 3310 }, initialDelaySeconds: 60, periodSeconds: 30 }
      liveness:  { tcpSocket: { port: 3310 }, initialDelaySeconds: 120, periodSeconds: 60, failureThreshold: 5 }
    podDisruptionBudget: null
    serviceMonitor: false

  redisCache:
    enabled: true
    replicas: 1
    image: { repository: redis, tag: "7-alpine" }
    port: 6379
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 250m, memory: 512Mi } }
    pvc:
      enabled: true                          # appendonly persistence
      storageSize: 5Gi
    podDisruptionBudget: null
    serviceMonitor: false

# clusterProfile-driven replica overrides. prod runs multiple replicas per
# stateless service for zero-downtime rolling updates; staging runs a
# reduced subset; sovereign matches dev (single replica).
clusterProfileReplicas:
  prod:
    backend: 3
    frontend: 2
    documentRepository: 2
  staging:
    backend: 2
    frontend: 2
    documentRepository: 1
  sovereign:
    backend: 1
    frontend: 1
    documentRepository: 1
