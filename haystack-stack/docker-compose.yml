services:
  # ArcadeDB (knowledge graph + vector store)
  arcadedb:
    image: arcadedata/arcadedb:latest  # 26.x — supports VECTOR indexes
    container_name: arcadedb
    restart: unless-stopped
    ports:
      - "2480:2480"
      - "2424:2424"
      - "5433:5432" #Added for connection to apache superset
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD:-genieRoot123}
        -Darcadedb.server.defaultDatabases=${ARCADEDB_DB:-genie}[root]
        -Darcadedb.server.plugins=Postgres:com.arcadedb.postgres.PostgresProtocolPlugin
      rootPassword: ${ARCADEDB_ROOT_PASSWORD:-genieRoot123}
    volumes:
      # OLD (named volume — data lived in Docker Desktop VM on C:):
      # - arcadedb_data:/home/arcadedb/databases
      # NEW (bind mount to E: drive under project tree):
      # BUG-039: explicit :rw so the intent is documented; prevents an
      # accidental read-only override from breaking schema migrations.
      - ./data/arcadedb:/home/arcadedb/databases:rw
    # BUG-024 fix: was just `wget /api/v1/ready` which only proves the
    # HTTP server is bound. A wedged DB (locked, OOM, schema corrupt)
    # would still respond OK and dependents (haystack-chatqna,
    # dataprep-worker) would proceed thinking the database is fine.
    # The new test asks ArcadeDB to LIST its databases via the
    # authenticated /api/v1/databases endpoint -- this requires the
    # query engine to be alive. If the engine is wedged, this fails.
    #
    # 2026-05-01 fix: the outer single quotes around the --header value
    # silently broke the $(printf ... | base64) substitution. /bin/sh
    # does not expand $(...) inside single quotes, so wget sent the
    # literal string "Basic $(printf '%s' \"root:...\" | base64 -w0)"
    # as the header and ArcadeDB returned 403 Forbidden on every probe.
    # Switching to double quotes lets the substitution run; the inner
    # printf args are now single-quoted literals so they pass cleanly
    # through the outer double-quoting layer. Verified locally with
    # ``curl -u root:$ARCADEDB_ROOT_PASSWORD`` -> HTTP 200.
    healthcheck:
      test: ["CMD-SHELL",
             "wget -qO- --header=\"Authorization: Basic $$(printf '%s' 'root:${ARCADEDB_ROOT_PASSWORD:-genieRoot123}' | base64 -w0)\" http://127.0.0.1:2480/api/v1/databases | grep -q '\"result\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - chatqna_default
  # Whisper.cpp (STT)
  voice-stt:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: voice-stt
    entrypoint: []
    command: ["/app/build/bin/whisper-server", "-m", "/models/ggml-base.en.bin", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ../components/voice-gateway/infra/whispercpp/models:/models:ro
    ports:
      - "8087:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chatqna_default
  # Piper TTS (Text-to-Speech)
  voice-tts:
    build:
      context: ./tts-service
    container_name: voice-tts
    restart: unless-stopped
    environment:
      PIPER_MODEL_PATH: /models/piper/en_US-lessac-medium.onnx
    volumes:
      - ../components/voice-gateway/infra/piper/models:/models/piper:ro
    ports:
      - "5500:5500"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5500/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chatqna_default

  # Mandinka TTS (MMS — facebook/mms-tts-mnk)
  # Sibling to voice-tts/Piper above. Same HTTP contract (/v1/tts, /v1/tts/ogg)
  # so the chatqna client is a line-for-line mirror of tts_piper.py.
  # Model weights are baked into the image via the PREWARM build arg; the
  # HuggingFace cache volume below keeps runtime downloads persistent if the
  # pre-warm is disabled for a faster image build.
  voice-tts-mnk:
    build:
      context: ./tts-mms-service
    container_name: voice-tts-mnk
    restart: unless-stopped
    environment:
      MMS_MODEL_ID:   facebook/mms-tts-mnk
      MMS_DEVICE:     cpu
      MMS_LANG_LABEL: mandinka
      # Was 2000 -- bumped on 2026-05-02 because the server-side
      # chunker (CHUNK_MAX_CHARS=250) handles long inputs by splitting
      # into sentence chunks. The outer cap is now just an abuse
      # bound; a typical multi-day clinical reply is ~1500-2500 chars.
      MMS_MAX_CHARS:  "8000"
    volumes:
      # BUG-039: HF cache is writable by design (model downloads).
      - ./data/huggingface-cache:/root/.cache/huggingface:rw
    ports:
      - "5501:5500"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5500/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - chatqna_default

  # Redis (working memory / session cache)
  redis:
    image: redis:7-alpine
    container_name: amina-redis
    # Port 6379 not exposed externally (multichannel-redis already uses it)
    # Accessible internally on chatqna_default network as redis:6379
    volumes:
      # OLD (named volume — data lived in Docker Desktop VM on C:):
      # - redis_data:/data
      # NEW (bind mount to E: drive under project tree):
      # BUG-039: AOF persistence requires :rw; explicit so a future
      # override cannot accidentally make Redis read-only.
      - ./data/redis:/data:rw
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatqna_default

  #Haystack DataPrep and Ingetion Pipeline
  dataprep-worker:
    build:
      context: ./haystack-dataprep
    container_name: dataprep-worker
    restart: unless-stopped
    ports:
      - "${DATAPREP_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}

      # ArcadeDB connection
      ARCADEDB_HOST: arcadedb
      ARCADEDB_PORT: 2480
      ARCADEDB_DB: ${ARCADEDB_DB:-genie}
      ARCADEDB_USER: root
      ARCADEDB_PASSWORD: ${ARCADEDB_ROOT_PASSWORD:-genieRoot123}
    depends_on:
      - arcadedb
    networks:
      - chatqna_default
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  # Haystack ChatQnA (RAG + LLM - the brain)
  haystack-chatqna:
    build:
      context: ./haystack-chatqna
    container_name: haystack-chatqna
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ARCADEDB_HOST: arcadedb
      ARCADEDB_PORT: 2480
      ARCADEDB_URL: http://arcadedb:2480
      ARCADEDB_DB: ${ARCADEDB_DB:-genie}
      ARCADEDB_USER: root
      ARCADEDB_PASSWORD: ${ARCADEDB_ROOT_PASSWORD:-genieRoot123}
      WHISPER_URL: http://voice-stt:8080
      TTS_URL: http://voice-tts:5500
      MMS_TTS_URL: http://voice-tts-mnk:5500
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Translation v4.2 / v4.2.1 -- compose-level defaults so a team
      # .env that pre-dates v4 still gets the new pipeline. Demo mode
      # already has these in .env.defaults; this guarantees parity.
      AMINA_TRANSLATION_V4_ENABLED: ${AMINA_TRANSLATION_V4_ENABLED:-true}
      NLLB_ENABLED: ${NLLB_ENABLED:-true}
      NLLB_API_URL: ${NLLB_API_URL:-http://nllb-translate:7860}
      NLLB_TIMEOUT_MS: ${NLLB_TIMEOUT_MS:-10000}
      BAMBARA_ADAPTER_ENABLED: ${BAMBARA_ADAPTER_ENABLED:-true}
      V4_BACK_TRANSLATION_ENABLED: ${V4_BACK_TRANSLATION_ENABLED:-true}
      V4_BACK_TRANSLATION_PREFER_NLLB: ${V4_BACK_TRANSLATION_PREFER_NLLB:-true}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    depends_on:
      arcadedb:
        condition: service_healthy
      redis:
        condition: service_healthy
      voice-stt:
        condition: service_started
      voice-tts:
        condition: service_started
      voice-tts-mnk:
        condition: service_started
    networks:
      - chatqna_default
    
  superset:
    build:
      context: ../components/apache-superset
    container_name: amina-superset
    ports:
      - "8080:8088"
    environment:
      # Defaults match haystack-stack/.env.defaults so a fresh team
      # checkout (no .env or partial .env without superset entries)
      # does not emit the "variable not set, defaulting to blank string"
      # warning that confused UNICC testers. Override via .env when
      # deploying anywhere that isn't a local demo.
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-amina_demo_superset_secret}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-admin}
      - ARCADEDB_ROOT_PASSWORD=${ARCADEDB_ROOT_PASSWORD}
      - ARCADEDB_DB=${ARCADEDB_DB}
    volumes:
      # OLD (named volume — data lived in Docker Desktop VM on C:):
      # - superset_data:/app/superset_home
      # NEW (bind mount to E: drive under project tree):
      # BUG-039: superset writes its sqlite metadata DB into this dir.
      - ./data/superset:/app/superset_home:rw
      # init script is read-only -- container should not modify the host file
      - ../components/apache-superset/super-init.sh:/app/superset-init.sh:ro
    depends_on:
      arcadedb:
        condition: service_healthy
    networks:
      - chatqna_default
    command: /bin/bash /app/superset-init.sh

# OLD named-volume declarations (kept for reference — no longer used after switching to bind mounts on E:):
# volumes:
#   arcadedb_data:
#   redis_data:
#   superset_data:
networks:
  chatqna_default:
    driver: bridge