{{- /*
  GatewayClass binding the chart's Gateway to the Envoy Gateway
  controller installed by the envoyGateway dependency. Rendered only when
  that dependency is enabled: with envoyGateway.enabled=false another
  controller owns the class (its own install provides it), and rendering
  a class pointing at Envoy's controller name would claim Gateways nobody
  reconciles.
*/ -}}
{{- if and .Values.ingress.enabled .Values.envoyGateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.ingress.className | default "envoy" }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ingress") | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gateway-class-controller
{{- end -}}
