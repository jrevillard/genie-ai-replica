---
# config_dir is NOT defined here. It lives in group_vars/all.yml because the
# docker-compose bind mounts are rendered by the separate `deploy` play, which
# does not include this role — role defaults are scoped to the role's own plays
# and would render as an empty string there.

# Whether to actually seed the host config dirs from the repo. Operators can set
# false to skip when they want to manage the host directory entirely by hand.
config_bootstrap_sync_enabled: true

# Whether a branch that carries a different app.title than the host serves may
# be mirrored onto it. The default is false: re-branding a deployment is a
# decision to make in the repository, not a side effect of deploying another
# branch by mistake. Set it to true when the re-brand is the point of the
# deploy.
config_bootstrap_allow_rebrand: false

# List of (source, destination) pairs.
#   src        - repo-relative directory. Used two ways: as the `?path=` argument
#                of the GitLab archive endpoint (so the assets come from
#                repo_branch, matching how the rest of the playbook obtains
#                deployed content), and as the relative subpath the archive
#                unpacks to after --strip-components=1.
#   dest_subdir - subdirectory of config_dir to seed, matching the host paths
#                rendered as CONFIG_DIR_FRONTEND / CONFIG_DIR_KEYCLOAK.
#   expect      - files that MUST exist in the extracted archive. Checked before
#                anything is synced, so a wrong branch or a failed extraction
#                fails the deploy instead of silently seeding a broken mount.
#                The runtime config JSON is in the list because it is the file
#                the frontend fetches and validates at boot: a branch whose
#                config directory does not carry it would mirror that absence
#                onto the host, and the mount would serve a 404 for it.
#   brand_file  - the file inside the pair that carries the deployment's brand
#                (its app.title). Exactly one pair must declare it: the role
#                compares the branch's copy with the host's copy and refuses to
#                mirror a branch that would re-brand the deployment. Declared
#                here rather than hardcoded in the role so that changing a
#                pair's src or dest_subdir cannot leave the check reading a
#                path that no longer exists.
config_bootstrap_pairs:
  - src: "components/gov-chat-frontend/public/config"
    dest_subdir: "frontend"
    expect:
      - "theme-variables.css"
      - "genie-ai-config.json"
    brand_file: "genie-ai-config.json"
  # Seed the whole themes tree, not one theme: additional themes (e.g.
  # genie-el-salvador with parent=genie) must sit next to genie under the
  # mounted directory, or their parent reference cannot resolve. The mount
  # target in docker-compose.yaml is /opt/keycloak/themes (the root).
  - src: "configs/keycloak/themes"
    dest_subdir: "keycloak/themes"
    expect:
      - "genie/login/theme.properties"
