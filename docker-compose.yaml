networks:
  genieai_network:
    attachable: true
services:
  arango-vector-db:
    command:
    - --experimental-vector-index=true
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 30s
      test:
      - CMD-SHELL
      - arangosh --server.endpoint tcp://127.0.0.1:8529 --server.username root --server.password "${ARANGO_PASSWORD}" --javascript.execute-string "db._version();"
      timeout: 10s
    image: arangodb/arangodb:3.12.4
    logging: &id001
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: 'true'
        tag: genie.{{.Name}}
    networks:
    - genieai_network
    ports:
    - mode: host
      protocol: tcp
      published: ${ARANGO_PORT:-8529}
      target: 8529
    restart: unless-stopped
    volumes:
    - arango_data:/var/lib/arangodb3
  backend:
    build:
      context: components/
      dockerfile: gov-chat-backend/Dockerfile
    depends_on:
      arango-vector-db:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      keycloak-config:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    environment:
    - ARANGO_PASSWORD=${ARANGO_PASSWORD}
    - ARANGO_DB=${ARANGO_DB:-genie-ai}
    - ARANGO_URL=http://arango-vector-db:8529
    - ARANGO_USER=${ARANGO_USER:-root}
    - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
    - KEYCLOAK_REALM=${KEYCLOAK_REALM:-genie}
    - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
    - KEYCLOAK_ADDITIONAL_REALMS
    - KEYCLOAK_PROXY_CLIENT_ID=genie-proxy-client
    - KEYCLOAK_PROXY_CLIENT_SECRET=${KEYCLOAK_PROXY_CLIENT_SECRET}
    - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    - TRANSLATION_CACHE=${TRANSLATION_CACHE:-on}
    - TRANSLATION_CACHE_HOST=${TRANSLATION_CACHE_HOST:-redis-cache}
    - TRANSLATION_CACHE_PORT=${TRANSLATION_CACHE_PORT:-6379}
    - TRANSLATION_CACHE_PASSWORD=${TRANSLATION_CACHE_PASSWORD}
    - VLLM_TRANSLATION_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
    - VLLM_TRANSLATION_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT:-http://vllm-translation-guardrail:9031}
    - STREAMING_TRANSLATION_ENABLED=${STREAMING_TRANSLATION_ENABLED:-0}
    - OPEA_SSL_SKIP_VERIFY=${OPEA_SSL_SKIP_VERIFY:-}
    - VLLM_API_KEY=${VLLM_API_KEY:-}
    - EMAIL_HOST=${EMAIL_HOST}
    - EMAIL_PORT=${EMAIL_PORT}
    - EMAIL_SECURE=${EMAIL_SECURE:-}
    - EMAIL_USER=${EMAIL_USER}
    - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    - EMAIL_FROM=${EMAIL_FROM}
    - OPEA_HOST=${OPEA_HOST:-chatqna-xeon-backend-server}
    - CONTEXT_OPTION=${CONTEXT_OPTION:-conversation-with-context-labels}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8090,http://127.0.0.1:8090,https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}}
    - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
    - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
    - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    extra_hosts:
    - ${NGINX_PUBLIC_DOMAIN:-localhost}:host-gateway
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 90s
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/health
      timeout: 5s
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-backend:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    restart: unless-stopped
    volumes:
    - ${DATA_DIR:-./data}/database_backups:/app/database_backups
    - ${DATA_DIR:-./data}/logs/backend:/app/logs
    - backend_data:/app/data
    - backend_uploads:/app/Uploads
  certbot:
    depends_on:
      nginx:
        condition: service_healthy
    deploy:
      placement:
        constraints:
        - node.labels.gateway == true
      replicas: ${CERTBOT_REPLICAS:-0}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
    entrypoint:
    - /certbot-entrypoint.sh
    environment:
    - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
    - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
    - CERTBOT_STAGING=${CERTBOT_STAGING:-false}
    image: certbot/certbot:latest
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - letsencrypt
    restart: unless-stopped
    volumes:
    - ./api-gateway-solution/certbot/entrypoint.sh:/certbot-entrypoint.sh:ro
    - certbot-webroot:/var/www/certbot
    - certbot-etc:/etc/letsencrypt
    - ./secrets/ssl:/secrets/ssl:rw
  chatqna-xeon-backend-server:
    build:
      context: .
      dockerfile: genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
    depends_on:
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: ${DEPLOY_OPEA:-1}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30
    environment:
      BACKEND_SERVICE_URL: http://backend:3000
      CHATQNA_ENFORCE_ABSTENTION: ${CHATQNA_ENFORCE_ABSTENTION:-true}
      CHATQNA_SYSTEM_PROMPT: ${CHATQNA_SYSTEM_PROMPT:-}
      CHATQNA_TYPE: ${CHATQNA_TYPE:-ChatQnA}
      CONFIDENCE_RANK_DECAY: ${CONFIDENCE_RANK_DECAY:-0.5}
      DOC_REPO_URL: http://document-repository:3001
      EMBEDDING_SERVER_ENDPOINT: ${EMBEDDING_SERVER_ENDPOINT:-/v1/embeddings}
      EMBEDDING_SERVER_HOST_IP: embedding
      EMBEDDING_SERVER_PORT: 6000
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-0}
      GPU_NODE_HOST: ${GPU_NODE_HOST:-}
      GUARDRAIL_SERVICE_HOST_IP: guardrail
      GUARDRAIL_SERVICE_PORT: 9090
      KC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-genie-app}
      KC_REALM: ${KEYCLOAK_REALM:-genie}
      KEYCLOAK_URL: https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      LLM_SELF_CONFIDENCE_ENABLED: ${LLM_SELF_CONFIDENCE_ENABLED:-0}
      LLM_SERVER_HOST_IP: vllm
      LLM_SERVER_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEGA_SERVICE_HOST_IP: chatqna-xeon-backend-server
      OPEA_SSL_SKIP_VERIFY: ${OPEA_SSL_SKIP_VERIFY:-0}
      OPENAI_API_KEY: ${VLLM_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      RERANKER_SCORE_CALIBRATION: ${RERANKER_SCORE_CALIBRATION:-none}
      RERANKER_SCORE_TEMPERATURE: ${RERANKER_SCORE_TEMPERATURE:-1.0}
      RERANKER_TOP_N: ${RERANKER_TOP_N:-2}
      RERANKING_STRATEGY: ${RERANKING_STRATEGY:-adaptive}
      RERANKING_THRESHOLD: ${RERANKING_THRESHOLD:-0.5}
      RERANK_SERVER_HOST_IP: reranker
      RERANK_SERVER_PORT: 8000
      RETRIEVER_ARANGO_DISTANCE_THRESHOLD: ${RETRIEVER_ARANGO_DISTANCE_THRESHOLD:-1}
      RETRIEVER_ARANGO_FETCH_K: ${RETRIEVER_ARANGO_FETCH_K:-20}
      RETRIEVER_ARANGO_K: ${RETRIEVER_ARANGO_K:-4}
      RETRIEVER_ARANGO_LAMBDA_MULT: ${RETRIEVER_ARANGO_LAMBDA_MULT:-0.5}
      RETRIEVER_ARANGO_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_SCORE_THRESHOLD:-0.1}
      RETRIEVER_ARANGO_SEARCH_START: ${RETRIEVER_ARANGO_SEARCH_START:-chunk}
      RETRIEVER_ARANGO_TRAVERSAL_ENABLED: ${RETRIEVER_ARANGO_TRAVERSAL_ENABLED:-false}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_DEPTH:-1}
      RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED: ${RETRIEVER_ARANGO_TRAVERSAL_MAX_RETURNED:-3}
      RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD: ${RETRIEVER_ARANGO_TRAVERSAL_SCORE_THRESHOLD:-0.5}
      RETRIEVER_SERVICE_HOST_IP: retriever-arango-service
      RETRIEVER_SERVICE_PORT: 7000
      TRANSLATION_SERVICE_HOST_IP: vllm-translation-guardrail
      TRANSLATION_SERVICE_PORT: 9031
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_LLM_ENDPOINT: ${VLLM_ENDPOINT:-}
      VLLM_TRANSLATION_ENDPOINT: ${VLLM_TRANSLATION_ENDPOINT:-}
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 120s
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8888/health || exit 1
      timeout: 10s
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-chatqna-server:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - opea
    restart: unless-stopped
    working_dir: /app/ChatQnA
  chatqna-xeon-nginx-server:
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: 0
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30
    environment:
      BACKEND_SERVICE_IP: chatqna-xeon-backend-server
      BACKEND_SERVICE_NAME: chatqna-xeon-backend-server
      BACKEND_SERVICE_PORT: 8888
      DATAPREP_SERVICE_IP: dataprep-arango-service
      DATAPREP_SERVICE_PORT: 5000
      FRONTEND_SERVICE_IP: chatqna-xeon-ui-server
      FRONTEND_SERVICE_PORT: 5173
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD-SHELL
      - timeout 5 bash -c 'echo > /dev/tcp/localhost/80' || exit 1
      timeout: 5s
    image: opea/nginx:latest
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - opea
    restart: 'no'
  chatqna-xeon-ui-server:
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: 0
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30
    environment:
      UPLOAD_FILE_BASE_URL: http://dataprep-arango-service:5000/v1/dataprep/ingest
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 10s
      test:
      - CMD-SHELL
      - timeout 5 bash -c 'echo > /dev/tcp/localhost/5173' || exit 1
      timeout: 5s
    image: opea/chatqna-ui:latest
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - opea
    restart: 'no'
  clamav:
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 300s
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 3310 || exit 1
      timeout: 10s
    image: clamav/clamav
    logging: *id001
    networks:
    - genieai_network
    restart: unless-stopped
  dataprep-arango-service:
    build:
      context: .
      dockerfile: genie-ai-overlay/dataprep/Dockerfile-dataprep_genie-ai
    depends_on:
      arango-vector-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: ${DEPLOY_OPEA:-1}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30
    environment:
      ARANGO_DB: ${ARANGO_DB:-genie-ai}
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME:-GRAPH}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD}
      ARANGO_URL: http://arango-vector-db:8529
      ARANGO_USERNAME: ${ARANGO_USERNAME:-root}
      BACKEND_SERVICE_URL: http://backend:3000
      BM25_LABEL_THRESHOLD: ${BM25_LABEL_THRESHOLD:-2.00}
      CONTENT_EXTRACTION_METHOD: ${CONTENT_EXTRACTION_METHOD:-docling}
      CONTEXTUAL_LABEL_RAW: ${CONTEXTUAL_LABEL_RAW:-true}
      CONTEXTUAL_RETRIEVAL_ENABLED: ${CONTEXTUAL_RETRIEVAL_ENABLED:-true}
      CONTEXTUAL_RETRIEVAL_PROMPT: ${CONTEXTUAL_RETRIEVAL_PROMPT:-}
      CONTEXTUAL_STRATEGY: ${CONTEXTUAL_STRATEGY:-doc_level}
      DATAPREP_CHUNK_SIZE_DOCX: ${DATAPREP_CHUNK_SIZE_DOCX:-1000}
      DATAPREP_CHUNK_SIZE_HTML: ${DATAPREP_CHUNK_SIZE_HTML:-500}
      DATAPREP_CHUNK_SIZE_MD: ${DATAPREP_CHUNK_SIZE_MD:-500}
      DATAPREP_CHUNK_SIZE_PDF: ${DATAPREP_CHUNK_SIZE_PDF:-500}
      DATAPREP_CHUNK_SIZE_PPTX: ${DATAPREP_CHUNK_SIZE_PPTX:-500}
      DATAPREP_CHUNK_SIZE_TXT: ${DATAPREP_CHUNK_SIZE_TXT:-500}
      DATAPREP_CHUNK_SIZE_XLSX: ${DATAPREP_CHUNK_SIZE_XLSX:-1500}
      DATAPREP_COMPONENT_NAME: GENIE_DATAPREP_ARANGODB
      DATAPREP_CONTEXTUAL_DOC_BUDGET: ${DATAPREP_CONTEXTUAL_DOC_BUDGET:-6000}
      DATAPREP_CONTEXTUAL_DOC_BUDGET_DOC_LEVEL: ${DATAPREP_CONTEXTUAL_DOC_BUDGET_DOC_LEVEL:-100000}
      DATAPREP_CONTEXTUAL_MAX_TOKENS: ${DATAPREP_CONTEXTUAL_MAX_TOKENS:-512}
      DATAPREP_CONTEXTUAL_MODEL: ${DATAPREP_CONTEXTUAL_MODEL:-}
      DATAPREP_LLM_LABEL_BATCH_SIZE: ${DATAPREP_LLM_LABEL_BATCH_SIZE:-4}
      DATAPREP_MAX_CONCURRENT_BATCHES: ${DATAPREP_MAX_CONCURRENT_BATCHES:-20}
      DOCLING_DEVICE: ${DOCLING_DEVICE:-cuda}
      DOCLING_ENDPOINT: ${DOCLING_ENDPOINT:-}
      DOCUMENT_REPOSITORY_URL: http://document-repository:3001
      EMBEDDING_LABEL_THRESHOLD: ${EMBEDDING_LABEL_THRESHOLD:-0.75}
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-0}
      GPU_NODE_HOST: ${GPU_NODE_HOST:-}
      GUARDRAIL_URL: http://guardrail:9090/v1/guardrails
      HUGGINGFACEHUB_API_TOKEN: ${VLLM_API_KEY:-}
      KC_DATAPREP_CLIENT_ID: ${KC_DATAPREP_CLIENT_ID:-dataprep-service-client}
      KC_DATAPREP_CLIENT_SECRET: ${KC_DATAPREP_CLIENT_SECRET:-}
      KC_REALM: ${KEYCLOAK_REALM:-genie}
      KEYCLOAK_SSL_SKIP_VERIFY: ${KEYCLOAK_SSL_SKIP_VERIFY:-0}
      KEYCLOAK_URL: https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      LABELING_STRATEGY: ${LABELING_STRATEGY:-llm}
      LABEL_SELECTOR_SYSTEM_PROMPT: ${LABEL_SELECTOR_SYSTEM_PROMPT:-}
      OPEA_SSL_SKIP_VERIFY: ${OPEA_SSL_SKIP_VERIFY:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      TEI_EMBEDDING_ENDPOINT: ${EMBEDDING_SERVICE_URL:-http://tei:80}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://vllm:8000}
      VLLM_MODEL_ID: ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
    extra_hosts:
    - localhost:host-gateway
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 120s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5000/health
      timeout: 10s
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-dataprep-arango:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - opea
    restart: unless-stopped
  db-migrations:
    build:
      context: .
      dockerfile: components/gov-chat-backend/Dockerfile.migrations
    depends_on:
      arango-vector-db:
        condition: service_healthy
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
    - ARANGO_URL=http://arango-vector-db:8529
    - ARANGO_DB=${ARANGO_DB:-genie-ai}
    - ARANGO_USER=${ARANGO_USER:-root}
    - ARANGO_PASSWORD=${ARANGO_PASSWORD}
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-db-migrations:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    restart: 'no'
  document-repository:
    build:
      context: components/
      dockerfile: document-repository/Dockerfile
    depends_on:
      arango-vector-db:
        condition: service_healthy
      keycloak-config:
        condition: service_healthy
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    environment:
    - ARANGO_PASSWORD=${ARANGO_PASSWORD}
    - ARANGO_DB=${ARANGO_DB:-genie-ai}
    - ARANGO_URL=http://arango-vector-db:8529
    - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
    - KC_REALM=${KEYCLOAK_REALM:-genie}
    - KC_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    extra_hosts:
    - ${NGINX_PUBLIC_DOMAIN:-localhost}:host-gateway
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3001/health
      timeout: 5s
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-document-repository:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    restart: unless-stopped
    volumes:
    - ${DATA_DIR:-./data}/logs/doc-repo:/app/logs
    - doc_repo_uploads:/app/uploads
  embedding:
    build:
      context: .
      dockerfile: genie-ai-overlay/embedding/Dockerfile-embedding_genie-ai
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: ${DEPLOY_OPEA:-1}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30
    environment:
    - EMBEDDING_MODEL_ENDPOINT=${EMBEDDING_SERVICE_URL:-http://tei:80}
    - TEI_EMBEDDING_ENDPOINT=${EMBEDDING_SERVICE_URL:-http://tei:80}
    - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-BAAI/bge-base-en-v1.5}
    - HF_TOKEN=${VLLM_API_KEY:-}
    - VLLM_API_KEY=${VLLM_API_KEY:-}
    - OPEA_SSL_SKIP_VERIFY=${OPEA_SSL_SKIP_VERIFY:-0}
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 120s
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:6000/health', timeout=3)" || exit 1
      timeout: 10s
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-embedding:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - opea
    restart: unless-stopped
  frontend:
    build: components/gov-chat-frontend/
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    environment:
    - PORT=8090
    - VUE_APP_API_URL=${VUE_APP_API_URL:-/api}
    - VUE_PROXY_HOST=${VUE_PROXY_HOST:-localhost}
    - VUE_APP_CSP_CONNECT_SRC=${VUE_APP_CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
    - VUE_APP_AVAILABLE_LOCALES=${VUE_APP_AVAILABLE_LOCALES:-}
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 60s
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://127.0.0.1:8090/health || exit 1
      timeout: 5s
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-frontend:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    restart: unless-stopped
  grafana:
    depends_on:
      victorialogs:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
      victoriatraces:
        condition: service_healthy
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: ${ENABLE_OBSERVABILITY:-0}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    environment:
    - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
