# --- Configuration validation ---

# Verify each overlay module's requirements-cpu.txt is in sync with its
# requirements.in (retriever/reranker). Fails if someone edited a
# requirements.in (or bumped OPEA, or changed the Dockerfile base/apt layer)
# without running `make lock-<module>`. Catches silent lock drift before it
# reaches a build. Split into per-module parallel jobs so a transient PyPI
# failure in one module's tag-pipeline check does not block the other
# (reduced blast radius — DW-29). Dockerfile-* paths are included because
# OPEA_VERSION / apt / base-image bumps are canonical lock-regen triggers.
# Note: dataprep retired from this check (issue-834 lock pipeline retired
# on the v1.5 bump — dataprep no longer ships a requirements.in).
.verify-overlay-lock-base:
  stage: config
  image: python:3.11-slim
  interruptible: true
  # The lock check is self-contained (uv sync --dry-run + grep against the
  # checked-out files) — it must not pull upstream artifacts. Without this,
  # GitLab's default makes the job download EVERY test-stage artifact (scan
  # reports, JUnit XML), so an unrelated artifact-download failure kills the
  # lock check before its script even runs (2026-09-02: instance artifact
  # downloads 403'd pipeline-wide while uploads succeeded).
  dependencies: []
  variables:
    UV_VERSION: "0.10.6"
  before_script:
    - pip install --no-cache-dir "uv==${UV_VERSION}"
  script:
    - |
      set -e
      cd "${CI_PROJECT_DIR}/genie-ai-overlay/${MOD}"
      # Verify lock is consistent and installable without re-resolving.
      # uv pip sync --dry-run checks every package+hash exists on PyPI;
      # it does NOT re-resolve, so upstream version bumps don't cause
      # spurious failures (only removed packages do).
      uv pip sync requirements-cpu.txt --dry-run --system
      # Cross-check: verify requirements.in is covered by the lock.
      # greps top-level non-comment lines from requirements.in and
      # checks each package name appears in the lock. Missing = user
      # added a dep without regenerating the lock.
      while IFS= read -r line; do
        pkg=$(echo "$line" | sed 's/[<>=!~].*//;s/\[.*//;s/#.*//' | xargs)
        [ -z "$pkg" ] && continue
        norm=$(echo "$pkg" | tr '[:upper:]_' '[:lower:]-')
        if ! grep -q "^${norm}==" requirements-cpu.txt; then
          echo "MISSING from ${MOD} lock: $pkg — run 'make lock-${MOD}'"
          exit 1
        fi
      done < requirements.in
      echo "genie-ai-overlay/${MOD}/requirements-cpu.txt in sync"

verify:overlay-locks:retriever:
  extends: .verify-overlay-lock-base
  variables:
    MOD: retriever
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"

verify:overlay-locks:reranker:
  extends: .verify-overlay-lock-base
  variables:
    MOD: reranker
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"


config:validate:
  extends: .node_base
  stage: config
  # Self-contained env-coverage checks (npm test on the checkout) — no
  # upstream artifacts needed: the default artifact coupling made this
  # job 403-flake with the 2026-09-02/03 instance artifact-download problem.
  dependencies: []
  before_script:
    - cd tests/config-validator && npm ci
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm ci
    - cd ${CI_PROJECT_DIR}/components/gov-chat-frontend && npm ci
  script:
    - cd ${CI_PROJECT_DIR}/tests/config-validator && npm test
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm run test:ci
    # Each shipped config is validated against the schema it embeds. The
    # frontend's parity suite checks the asset keys agree across the seven
    # files; it never checks a file's data against its own schema, so a
    # mistyped value or a dropped required key ships otherwise.
    - cd ${CI_PROJECT_DIR}/components/gov-chat-frontend && npm run validate:config
  cache:
    - key:
        files:
          - tests/config-validator/package-lock.json
        prefix: config-validate
      paths:
        - tests/config-validator/node_modules/
      fallback_keys:
        - "config-validate-$CI_DEFAULT_BRANCH"
        - "config-validate-"
    - key:
        files:
          - api-gateway-solution/new-config/package-lock.json
        prefix: config-kong
      paths:
        - api-gateway-solution/new-config/node_modules/
      fallback_keys:
        - "config-kong-$CI_DEFAULT_BRANCH"
        - "config-kong-"
    - key:
        files:
          - components/gov-chat-frontend/package-lock.json
        prefix: config-frontend
      paths:
        - components/gov-chat-frontend/node_modules/
      fallback_keys:
        - "config-frontend-$CI_DEFAULT_BRANCH"
        - "config-frontend-"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - tests/config-validator/reports/jest-config.xml
        - api-gateway-solution/new-config/reports/jest-kong-config.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "env"
        - "env.*"
        - "docker-compose.yaml"
        - "docker-compose.gpu.yaml"
        - "genie-ai-overlay/retriever/**/*"
        - "genie-ai-overlay/chatqna/**/*"
        - "deploy/ansible/**/*"
        - "tests/config-validator/**/*"
        - "tests/fixtures/config/**/*"
        - "api-gateway-solution/new-config/**/*"
        - "components/gov-chat-frontend/public/config/genie-ai-config*.json"
        - "components/gov-chat-frontend/scripts/validate-config-schema.js"
        - "configs/keycloak/themes/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Validate the internal links of the documentation site.
#
# Hugo rewrites Markdown links that point at a content path, but never
# rewrites raw-HTML href attributes, and it keeps the old URL of a moved page
# alive as a redirect.  A link that only resolves through a redirect still
# works, but the reader lands on a redirect hop and the URL bar shows a path
# that is not the page's address -- the defect this guard was written for.
# The checker also refuses a `slug:` on a section, because Hugo's handling of
# a section slug depends on the Hugo version and the site is built from a
# floating Hugo image.
config:docs-links:
  extends: .node_base
  stage: config
  script:
    - cd ${CI_PROJECT_DIR}/site && node --test scripts/check-links.test.mjs
    - cd ${CI_PROJECT_DIR}/site && node scripts/check-links.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "site/content/**/*"
        - "site/scripts/**/*"
        - "site/hugo.toml"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Validate CHANGELOG.md has an entry for the version being released
config:changelog:
  stage: config
  image: alpine:3.21
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Checking CHANGELOG.md for version: ${VERSION}"
      if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
        echo "ERROR: CHANGELOG.md has no entry for version ${VERSION}."
        echo "Add a ## [${VERSION}] section before tagging."
        exit 1
      fi
      echo "CHANGELOG.md entry found for ${VERSION}."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# --- Scheduled jobs (nightly via pipeline schedule) ---

# Integration smoke test — runs full core stack via Docker Compose
# Enhanced by stories 1-8, 1-9 (Playwright E2E)
#
# REQUIRED CI Variables (Settings → CI/CD → Variables):
#   ARANGO_PASSWORD, POSTGRES_PASSWORD, KONG_DB_PASSWORD,
#   KEYCLOAK_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD,
