# translation (port 9031). Ingress: chatqna. Egress: OTLP, external
# GPU node when in external mode.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: translation
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "translation") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: translation
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # chatqna: history/answer translation.
        - podSelector:
            matchLabels:
              genieai.io/component: chatqna
        # backend BFF: dials the OPEA translation Service when
        # services.backend.translation.endpoint points at it — a named
        # translation API is mandatory, so a dropped probe stops the
        # backend from starting. (The backend's DEFAULT in-cluster
        # endpoint is the vllm-translation model Service, which this
        # policy does not select: the backend's own egress carries the
        # peer for it.)
        - podSelector:
            matchLabels:
              genieai.io/component: backend
      ports:
        # Post-DNAT pod port; the Service maps 9031 to 8888.
        - protocol: TCP
          port: 8888
  {{- if $obsMetrics.enabled }}
  # vm-operator scrape peer — PRE-WIRED, INERT TODAY: the chart's
  # VMServiceScrape CRs match nothing on purpose (VMSingle carries no
  # serviceScrapeSelector — see templates/observability/vmsingle.yaml)
  # and no workload here exposes a Prometheus surface (they export over
  # OTLP). The peer exists so that enabling a real scrape surface later
  # does not silently time out against the default-deny.
    - from:
        - podSelector:
            matchLabels:
              managed-by: vm-operator
              app.kubernetes.io/instance: vmetrics
      ports:
        - protocol: TCP
          port: 8888
  {{- end }}
  egress:
    # DNS resolution to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # OTLP exporter.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ include "genieai-umbrella.otlpPort" . }}
    {{- if and (eq $opeaGpu.mode "external") $opeaGpu.nodeHost }}
{{- include "genieai-umbrella.opeaGpuEgressRule" . | nindent 4 }}
    {{- end }}
    {{- if eq $opeaGpu.mode "in-cluster" }}
    # In-cluster GPU model (LLM_ENDPOINT).
    - to:
        - podSelector:
            matchLabels:
              app: vllm-translation
      ports:
        - protocol: TCP
          port: 9031
    {{- end }}
---
{{- /* Model-pod ingress policies (in-cluster mode). Without them the GPU
inference endpoints are reachable from every pod that can route to the
namespace — free GPU spend for anything compromised in-cluster. Egress
stays open: model pods pull weights from HF and answer DNS. */ -}}
{{- if eq $opeaGpu.mode "in-cluster" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-model
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "vllm") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: chatqna
        - podSelector:
            matchLabels:
              genieai.io/component: retriever
        - podSelector:
            matchLabels:
              genieai.io/component: dataprep
        # The translation model's wait-for-vllm initContainer curls
        # vllm:8000/health before starting: without this peer the init is
        # blocked by the very policy that guards the vLLM pods, and the
        # translation model never starts (an Init:0/1 loop with nothing
        # in the vLLM logs to explain it).
        - podSelector:
            matchLabels:
              app: vllm-translation
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tei-model
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "tei") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: tei
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: embedding
        - podSelector:
            matchLabels:
              genieai.io/component: retriever
        - podSelector:
            matchLabels:
              genieai.io/component: dataprep
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tei-reranker-model
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "tei-reranker") | nindent 4 }}
spec:
