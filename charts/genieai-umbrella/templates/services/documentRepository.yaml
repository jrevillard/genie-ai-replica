{{- /*
  documentRepository depends on:
    - the ArangoDB Service from the data tier (kube-arangodb operator owns
      the Service name — the hostname comes from the arangoHost helper
      which honors .Values.data.arangodb.mode)
    - the `arango-root-secret` Secret in this namespace, operator-provided
      via their secret backend of choice; supplies ARANGO_PASSWORD via
      secretKeyRef below
  Both prerequisites are required for this Deployment's pods to schedule
  and become ready.
*/ -}}
{{- if .Values.services.documentRepository.enabled -}}
{{- $ns := .Values.namespace -}}
{{- $arangoHost := include "genieai-umbrella.arangoHost" . -}}
{{- $vals := deepCopy .Values -}}
{{- /* VIRUS_SCANNING is the app-side switch, not the operator's: a scan
step with no scanner behind it fails every upload, so the ClamAV tier
being off forces it off. `services.documentRepository.virusScanning`
still turns it off on its own. */ -}}
{{- $virusScanning := .Values.services.clamav.enabled -}}
{{- if kindIs "bool" .Values.services.documentRepository.virusScanning -}}
{{- $virusScanning = and $virusScanning .Values.services.documentRepository.virusScanning -}}
{{- end -}}
{{- /* The chart owns `document-repository-uploads` only while
`services.documentRepository.pvc.enabled` is true. With it off, a volume
row still naming that claim leaves the pod in ContainerCreating forever
(kubelet waits on a claim nobody creates), so the chart-owned rows are
dropped here. Operator-supplied volumes and mounts are left untouched:
turning the PVC off means "ephemeral /app/uploads, or bring your own
volume". */ -}}
{{- if not .Values.services.documentRepository.pvc.enabled -}}
{{- $ownedClaim := "document-repository-uploads" -}}
{{- $keptVolumes := list -}}
{{- range $v := ($vals.services.documentRepository.volumes | default list) -}}
{{- if ne (dig "persistentVolumeClaim" "claimName" "" $v) $ownedClaim -}}
{{- $keptVolumes = append $keptVolumes $v -}}
{{- end -}}
{{- end -}}
{{- /* Mounts follow their volumes: a mount row survives iff a KEPT
volume carries its name. Filtering mounts by a hardcoded name instead
kept the chart's mount name alive against an operator's own `uploads`
volume (their volume survived the claim filter, their mount was
dropped) and would drop the chart's mount against a kept volume of the
same name. The join by name is the only predicate both sides share. */ -}}
{{- $keptNames := dict -}}
{{- range $v := $keptVolumes -}}
{{- $_ := set $keptNames (get $v "name") true -}}
{{- end -}}
{{- $keptMounts := list -}}
{{- range $m := ($vals.services.documentRepository.volumeMounts | default list) -}}
{{- if get $keptNames (get $m "name") -}}
{{- $keptMounts = append $keptMounts $m -}}
{{- end -}}
{{- end -}}
{{- $_ := set $vals.services.documentRepository "volumes" $keptVolumes -}}
{{- $_ := set $vals.services.documentRepository "volumeMounts" $keptMounts -}}
{{- end -}}
{{- /* KEYCLOAK_EXPECTED_ISSUER: tokens carry the public issuer pinned on the
Keycloak CR (hostname v2); JWKS keeps resolving in-cluster through
KEYCLOAK_URL. Without the override the service derives the expected
issuer from the in-cluster URL and rejects every browser token. */ -}}
{{- /* Dataprep URL parts are explicit. The service's own default host
names a service absent here, and DATAPREP_PORT collides with
the Kubernetes-injected connection env for the dataprep Service
(tcp://<ip>:5000) — the controller concatenates host:port into a URL, so
both rows must be set explicitly. */ -}}
{{- $urls := list
    (dict "name" "KEYCLOAK_URL" "value" (include "genieai-umbrella.keycloakInternalURL" .))
    (dict "name" "KC_REALM" "value" (.Values.data.keycloak.realm | default "genie"))
    (dict "name" "KEYCLOAK_EXPECTED_ISSUER" "value" (printf "%s/realms/%s" (include "genieai-umbrella.keycloakPublicIssuer" .) (.Values.data.keycloak.realm | default "genie")))
    (dict "name" "ARANGO_URL" "value" (include "genieai-umbrella.arangoURL" .))
    (dict "name" "ARANGO_DB" "value" (.Values.data.arangodb.database | default "_system" | toString))
    (dict "name" "DATAPREP_HOST" "value" "http://dataprep")
    (dict "name" "DATAPREP_PORT" "value" "5000")
    (dict "name" "CLAMSCAN_HOST" "value" .Values.services.documentRepository.clamavHost)
    (dict "name" "CLAMSCAN_PORT" "value" (.Values.services.documentRepository.clamavPort | toString))
    (dict "name" "VIRUS_SCANNING" "value" ($virusScanning | toString))
    (dict "name" "OTEL_EXPORTER_OTLP_ENDPOINT" "value" (include "genieai-umbrella.otlpEndpoint" .))
    (dict "name" "ENABLE_OBSERVABILITY" "value" (ternary "1" "0" (or .Values.observability.logs.enabled .Values.observability.metrics.enabled .Values.observability.traces.enabled)))
-}}
{{- /* Admin logs UI data source — the vmoperator-managed VLSingle
Service, same address the backend is given. */ -}}
{{- if .Values.observability.logs.enabled -}}
{{- $urls = concat $urls (list (dict "name" "VICTORIALOGS_URL" "value" (printf "http://vlsingle-victorialogs.%s.svc.cluster.local:9428" $ns))) -}}
{{- end }}
{{- $secretEnv := list (include "genieai-umbrella.secretKeyRefEnv" (dict "var" "ARANGO_PASSWORD" "secret" "arango-root-secret" "key" "password" "optional" true) | fromJson) -}}
{{- $existingEnv := index $vals.services.documentRepository "env" | default dict -}}
{{- $existingRows := include "genieai-umbrella.envMapRows" $existingEnv | fromJsonArray -}}
{{- /* The operator's rows come LAST: a container env list applies in
order, so the last row for a name wins and the operator's value
overrides the one the chart derives. */ -}}
{{- $_ := set $vals.services.documentRepository "env" (concat $urls $secretEnv $existingRows) -}}
{{- $ctx := dict "name" "documentRepository" "component" "documentRepository" "Values" $vals "Chart" .Chart "Release" .Release -}}
{{- include "genieai-umbrella.serviceDeployment" $ctx }}
---
apiVersion: v1
kind: Service
metadata:
  name: document-repository
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "documentRepository") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "documentRepository") | nindent 4 }}
---
# Default-deny with ingress from the BFF and egress scoped to the
# BFF, the ClamAV scanner, and the OTLP collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: document-repository
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "documentRepository") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: documentRepository
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The Envoy Gateway data plane (edge routing: /api/files, /api/labels,
    # /uploads) and the backend (file references) on the container port
    # (post-DNAT).
    {{- if .Values.ingress.enabled }}
    - from:
        {{- include "genieai-umbrella.ingressDataPlanePeer" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 3001
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: backend
      ports:
        - protocol: TCP
          port: 3001
    # dataprep: PATCH /api/files/<id>/status is how an ingest reports
    # completion (genieai_dataprep_arangodb.py _update_doc_status).
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: dataprep
      ports:
        - protocol: TCP
          port: 3001
    # chatqna: reads file metadata for citation provenance
    # (genieai_chatqna.py, the sources shown next to an answer).
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: chatqna
      ports:
        - protocol: TCP
          port: 3001
    # helm-test reachability probe (component "test").
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: test
      ports:
        - protocol: TCP
          port: 3001
  {{- if .Values.observability.metrics.enabled }}
  # Prometheus scrape peer (VMServiceScrape targets this Service).
  # VictoriaMetrics runs as a vm-operator-managed pod in this namespace;
  # without this peer its scrapes are dropped by the default-deny.
    - from:
        - podSelector:
            matchLabels:
              managed-by: vm-operator
              app.kubernetes.io/instance: vmetrics
      ports:
        - protocol: TCP
          port: 3001
  {{- end }}
  egress:
    # DNS resolution to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Backend BFF. Post-DNAT pod port (3000).
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: backend
      ports:
        - protocol: TCP
          port: 3000
    # ClamAV scanner. Post-DNAT pod port (3310); the Service port is
    # identical, but pod-to-pod peers must use the container port.
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: clamav
      ports:
        - protocol: TCP
          port: 3310
    # Data tier: ArangoDB (8529) — pending verified peer labels.
    # Same port-scoped pattern as the backend's data-tier egress.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8529
    {{- /* Web-crawler egress: POST /api/files/crawl/schedule fetches
    arbitrary user-supplied URLs (and every redirect hop). NetworkPolicy
    peers cannot express a domain, so this is a port-scoped ipBlock over
    80/443 — the same approximation the ClamAV signature-update rule
    documents. Empty list = allow every IPv4 destination on the HTTP(S)
    ports, matching the compose deployment's unrestricted network. */}}
    - to:
        {{- range $cidr := .Values.services.documentRepository.crawlAllowedCIDRs }}
        - ipBlock:
            cidr: {{ $cidr }}
        {{- end }}
        {{- if not .Values.services.documentRepository.crawlAllowedCIDRs }}
        - ipBlock:
            cidr: 0.0.0.0/0
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Ingestion trigger: POST /api/files/<id>/ingest calls the dataprep
    # Service directly (fileController _ingestFileById).
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: dataprep
      ports:
        - protocol: TCP
          port: 5000
    # Remote JWKS fetch (jose createRemoteJWKSet) on the first
    # authenticated request — KEYCLOAK_URL points at keycloak-service.
    # The Keycloak pod is operator-managed and carries no
    # genieai.io/component label; these are its real pod labels (verified
    # live, and the same pair templates/data/keycloak-networkpolicy.yaml
    # selects on).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak
              app.kubernetes.io/managed-by: keycloak-operator
      ports:
        - protocol: TCP
          port: 8080
    # OTLP exporter. Required for the observability pipeline; without
    # this port the default-deny policy drops document-repository
    # telemetry.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.observability.collectorPort | default 4318 }}
    {{- if .Values.observability.logs.enabled }}
    # VictoriaLogs read path. The chart renders VICTORIALOGS_URL for this
    # pod whenever the logs tier is on; an env var pointing at a
    # destination the pod's own policy forbids fails as a connection
    # error the day a consumer lands, instead of as a config error now.
    # Same peer the backend's policy selects (vmoperator-stamped labels).
    - to:
        - podSelector:
            matchLabels:
              managed-by: vm-operator
              app.kubernetes.io/instance: victorialogs
      ports:
        - protocol: TCP
          port: 9428
    {{- end }}
{{- end -}}
