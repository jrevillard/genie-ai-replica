# Source: genieai-umbrella/templates/observability/grafana.yaml
# VictoriaTraces datasource — the datasource talks to the VTSingle
# Service directly: VictoriaTraces serves the Jaeger HTTP API
# natively on port 10428, no intermediary proxy.
# Type "jaeger" per the dashboard datasource contract.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriatraces
  namespace: genieai
  labels:
    e2170.genieai.io/run: "2170"
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: "0.2.184"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: "observability"
    genieai.io/component: "observability"
    genieai.io/managed-by: helm
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  allowCrossNamespaceImport: true
  datasource:
    name: VictoriaTraces
    type: jaeger
    access: proxy
    # /select/jaeger is REQUIRED: Grafana's Jaeger datasource appends
    # /api/* to this base, and VictoriaTraces serves the HTTP Jaeger API
    # under the Victoria prefix (live: /api/services answers 400 without
    # it, /select/jaeger/api/services answers 200). Same role tempo-proxy
    # played in Swarm, which is why removing the proxy obliges this path.
    url: http://vtsingle-vtraces.genieai.svc.cluster.local:10428/select/jaeger
    uid: victoriatraces
    editable: false
