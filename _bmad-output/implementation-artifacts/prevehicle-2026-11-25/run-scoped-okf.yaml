# Run-scoped OKF tier for the #2170 pre-vehicle validation campaign.
#
# WHY it is deployed at all (the campaign's central finding):
#   the BFF builds the agent run's CallerContext from the SHARED fan-out
#   posture (query-service.js:837 _fanoutGraphSet): with the OKF tier parked
#   (the baseline), mode is "legacy" and the authorized graph set is EMPTY.
#   The agent's capability contract treats an empty authorized set as
#   "nothing is reachable" (capabilities/executor.py:111 — fail-closed, the
#   inner port is never consulted), so EVERY agentic answer on a venue
#   without the OKF fan-out engaged is the insufficiency statement. The
#   agentic path is therefore COUPLED to the OKF tier: the flag alone does
#   not make it work. Deploying the tier is the deployment-level remedy the
#   campaign applies; the coupling itself is filed as a finding.
#
# The tier is deployed RUN-SCOPED (run-prefixed ownership label, no Helm
# ownership annotations) because the chart's tier cannot be flipped on the
# shared venue: the chart's observability tier (same release) renders the
# VTSingle storage field vm-operator rejects (issue #2172), so the release
# cannot be upgraded with the tiers on.
#
# Images: the umbrella tip's promoted CI builds (pipeline 19392 =
# refs/merge-requests/938/merge @ a2db5f7d; that merge's tree equals
# d1648d17f's tree).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragas-llm-cache
  namespace: genieai
  labels:
    e2170.genieai.io/run: "2170"
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: 0.2.184
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ragas-service
    genieai.io/component: ragas-service
    genieai.io/managed-by: helm
    e2170.genieai.io/run: '2170'
  annotations: {}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ramdisk
---
