{{- /* The PVC block is OPTIONAL (the per-service shape block says so): a cleared block means "no chart-owned claim", not a nil-pointer crash. */ -}}
{{- $pvc := .Values.services.documentRepository.pvc | default dict -}}
{{- if and .Values.services.documentRepository.enabled $pvc.enabled -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-repository-uploads
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.pluggable.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pvc.storageSize | default "20Gi" }}
{{- end -}}
