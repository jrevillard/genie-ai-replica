apiVersion: v1
kind: Service
metadata:
  name: chatqna-xeon-nginx-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "chatqna-xeon-nginx-server" "tier" "cpu" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "genieai.selectorLabels" (dict "name" "chatqna-xeon-nginx-server" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.cpu.chatqnaXeonNginxServer.port }}
      targetPort: {{ .Values.cpu.chatqnaXeonNginxServer.port }}
      protocol: TCP
      name: http
