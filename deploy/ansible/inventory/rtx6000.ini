# RTX PRO 6000 Blackwell (Server Edition, 96 GB) — WHOLE machine (whole GPU, not vGPU)
# -> standard NVIDIA drivers work: ubuntu-drivers / NVIDIA apt repo, any 570+ (580 recommended).
#    Verify BEFORE the playbook: nvidia-smi shows the card.
# Blackwell (sm_120): needs 570+ driver; images in all.yml must be CUDA 12.8+ builds.
[agrivisory_rtx6000]
rtx6000 ansible_host=151.185.34.95 ansible_user=ubuntu

[swarm_managers]
rtx6000

[gpu_nodes]
rtx6000

[all:vars]
ansible_ssh_private_key_file=~/.ssh/deploy-key
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
