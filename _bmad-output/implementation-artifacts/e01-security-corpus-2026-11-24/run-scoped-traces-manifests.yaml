apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-gateway
  namespace: genieai
  labels:
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: 0.2.184
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
    genieai.io/component: observability
    genieai.io/managed-by: helm
    e2148.genieai.io/run: '2148'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: opentelemetry-operator
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: genieai-obs
    ports:
    - protocol: TCP
      port: 4318
    - protocol: TCP
      port: 4317
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          managed-by: vm-operator
          app.kubernetes.io/instance: victorialogs
    ports:
    - protocol: TCP
      port: 9428
  - to:
    - podSelector:
        matchLabels:
          managed-by: vm-operator
          app.kubernetes.io/instance: vtraces
    ports:
    - protocol: TCP
      port: 10428
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-agent
  namespace: genieai-obs
  labels:
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: 0.2.184
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
    genieai.io/component: observability
    genieai.io/managed-by: helm
    e2148.genieai.io/run: '2148'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: opentelemetry-operator
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: genieai
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: opentelemetry-operator
    ports:
    - protocol: TCP
      port: 4318
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: genieai-collector
  namespace: genieai
  labels:
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: 0.2.184
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
    genieai.io/component: observability
    genieai.io/managed-by: helm
    e2148.genieai.io/run: '2148'
spec:
  mode: deployment
  ports:
  - name: otlp-http
    port: 4318
    protocol: TCP
    targetPort: 4318
  - name: otlp-grpc
    port: 4317
    protocol: TCP
    targetPort: 4317
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      transform/pii_redact:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - replace_pattern(body, "(?i)\"((?:password|api[_-]?key|apikey|session[_-]?id|user[_-]?id|email|mail|auth[_-]?token|bearer[_-]?token|authorization|token|secret|api[_-]?secret|credential(?:_id|s|)|openai[_-]?api[_-]?key|anthropic[_-]?api[_-]?key|private[_-]?key|secret[_-]?value|user[_-]?query|llm[_-]?response|document[_-]?text))\"\\s*[:=]\\s*\"[^\"]*\"",
            "\"$1\":\"[REDACTED]\"") where IsString(body)
          - replace_pattern(body, "(?i)bearer\\s+[a-z0-9\\-_]{20,}", "bearer [REDACTED_BEARER]")
            where IsString(body)
          - replace_pattern(body, "sk-[a-z0-9]{20,}", "[REDACTED_APIKEY]") where IsString(body)
          - replace_pattern(body, "eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+",
            "[REDACTED_JWT]") where IsString(body)
          - replace_pattern(body, "(?i)[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}", "[REDACTED_EMAIL]")
            where IsString(body)
        - context: log
          statements:
          - replace_all_patterns(attributes, "value", "(?i)(?<p>(?:^|[^A-Za-z0-9]))(?<t>eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+|sk-[A-Za-z0-9]{16,}|pk-[A-Za-z0-9]{16,}|gho_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{16,}|xox[abprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}|[A-Za-z0-9_=-]{40,})(?<s>(?:$|[^A-Za-z0-9]))",
            "${p}[REDACTED]${s}") where IsMap(attributes)
      transform/extract_envelope_trace_context:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - 'set(trace_id, TraceID(ExtractPatterns(body, "trace_id[\": ]+(?P<tid>[0-9a-f]{32})")["tid"]))
            where IsString(body) and IsMatch(body, "trace_id[\": ]+[0-9a-f]{32}")'
          - 'set(span_id, SpanID(ExtractPatterns(body, "span_id[\": ]+(?P<sid>[0-9a-f]{16})")["sid"]))
            where IsString(body) and IsMatch(body, "span_id[\": ]+[0-9a-f]{16}")'
      transform/stamp_log_metadata_from_msg:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - set(severity_text, ToUpperCase(ParseJSON(body)["level"])) where (severity_text
            == "" or severity_text == nil) and IsString(body) and Substring(body,
            0, 1) == "{"
          - 'set(severity_text, ToUpperCase(ExtractPatterns(body, "(?i)^(?P<sev>info|warn|warning|error|debug|fatal|trace)[:
            ]")["sev"])) where (severity_text == "" or severity_text == nil) and IsString(body)
            and IsMatch(body, "(?i)^(info|warn|warning|error|debug|fatal|trace)[:
            ]")'
          - set(severity_text, ToUpperCase(body["level"])) where (severity_text ==
            "" or severity_text == nil) and IsMap(body) and IsString(body["level"])
          - set(body, ParseJSON(body)["message"]) where IsString(body) and Substring(body,
            0, 1) == "{" and IsString(ParseJSON(body)["message"])
          - set(body, body["message"]) where IsMap(body) and IsString(body["message"])
          - set(severity_number, 9) where severity_text == "INFO"
          - set(severity_number, 13) where severity_text == "WARN"
          - set(severity_number, 13) where severity_text == "WARNING"
          - set(severity_number, 17) where severity_text == "ERROR"
          - set(severity_number, 5) where severity_text == "DEBUG"
          - set(severity_number, 21) where severity_text == "FATAL"
          - set(severity_number, 1) where severity_text == "TRACE"
          - set(severity_number, 21) where severity_text == "FATAL"
          - set(severity_number, 1) where severity_text == "TRACE"
      transform/normalize_log_body:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - set(severity_text, "INFO") where IsString(body) and Substring(body, 0,
            13) == "HTTP_REQUEST:"
          - set(severity_number, 9) where severity_text == "INFO" and severity_number
            == 0
          - 'set(attributes["http.method"], ExtractPatterns(body, "^HTTP_REQUEST:
            (?P<m>[A-Z]+) ")["m"]) where IsString(body) and Substring(body, 0, 13)
            == "HTTP_REQUEST:"'
          - 'set(attributes["http.path"], ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+
            (?P<p>[^ ?]+)")["p"]) where IsString(body) and Substring(body, 0, 13)
            == "HTTP_REQUEST:"'
          - 'set(attributes["http.status_code"], ExtractPatterns(body, "^HTTP_REQUEST:
            [A-Z]+ [^ ]+( [?] [^ ]*)? (?P<s>[0-9]+) ")["s"]) where IsString(body)
            and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - 'set(attributes["http.response_time_ms"], ExtractPatterns(body, "^HTTP_REQUEST:
            [A-Z]+ [^ ]+( [?] [^ ]*)? [0-9]+ (?P<ms>[0-9.]+) ms")["ms"]) where IsString(body)
            and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - set(attributes["http.user_agent"], ExtractPatterns(body, "Headers:[ ](?:-|[^
            ]+)[ ](?P<ua>.+)$")["ua"]) where IsString(body) and Substring(body, 0,
            13) == "HTTP_REQUEST:"
          - 'set(body, Concat([ExtractPatterns(body, "^HTTP_REQUEST: (?P<m>[A-Z]+)
            ")["m"], " ", ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ (?P<p>[^ ?]+)")["p"],
            " ", ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? (?P<s>[0-9]+)
            ")["s"], " ", ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?]
            [^ ]*)? [0-9]+ (?P<ms>[0-9.]+) ms")["ms"], " ms"], "")) where IsString(body)
            and Substring(body, 0, 13) == "HTTP_REQUEST:"'
          - set(attributes["http.client_ip"], ExtractPatterns(body, "(?P<ip>[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+):[0-9]+")["ip"])
            where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body,
            "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")
          - set(attributes["http.method"], ExtractPatterns(body, "\" (?P<m>[A-Z]+)
            (?P<p>[^ ?\"]+)")["m"]) where IsString(body) and Substring(body, 0, 5)
            == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")
          - set(attributes["http.path"], ExtractPatterns(body, "\" (?P<m>[A-Z]+) (?P<p>[^
            ?\"]+)")["p"]) where IsString(body) and Substring(body, 0, 5) == "INFO:"
            and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")
          - set(attributes["http.status_code"], ExtractPatterns(body, "\" (?P<s>[0-9]{3})
            ")["s"]) where IsString(body) and Substring(body, 0, 5) == "INFO:" and
            IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")
          - set(body, Concat([ExtractPatterns(body, "\" (?P<m>[A-Z]+) ")["m"], " ",
            ExtractPatterns(body, "\" (?P<m>[A-Z]+) (?P<p>[^ ?\"]+)")["p"], " ", ExtractPatterns(body,
            "\" (?P<s>[0-9]{3}) ")["s"]], "")) where IsString(body) and Substring(body,
            0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")
          - set(body, ExtractPatterns(body, "^\\[[^]]+\\][ ](?P<m>.+)$")["m"]) where
            IsString(body) and IsMatch(body, "^\\[[0-9]{4}-[0-9]{2}-[0-9]{2}[ ][0-9]{2}:[0-9]{2}:[0-9]{2}\\][
            ]")
      transform/strip_python_log_prefix:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - 'set(body, ExtractPatterns(body, "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)[:
            ]+(?P<m>.*)$")["m"]) where IsString(body) and IsMatch(body, "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)[:
            ]+")'
    exporters:
      otlphttp/victorialogs:
        endpoint: http://vlsingle-victorialogs.genieai.svc.cluster.local:9428/insert/opentelemetry
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
      nop: {}
      otlphttp/victoriatraces:
        endpoint: http://vtsingle-vtraces.genieai.svc.cluster.local:10428/insert/opentelemetry
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        timeout: 15s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions:
      - health_check
      telemetry:
        metrics:
          level: detailed
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
      pipelines:
        logs:
          receivers:
          - otlp
          processors:
          - transform/pii_redact
          - transform/extract_envelope_trace_context
          - transform/stamp_log_metadata_from_msg
          - transform/normalize_log_body
          - transform/strip_python_log_prefix
          - memory_limiter
          - batch
          exporters:
          - otlphttp/victorialogs
        metrics:
          receivers:
          - otlp
          processors:
          - memory_limiter
          exporters:
          - nop
        traces:
          receivers:
          - otlp
          processors:
          - memory_limiter
          - batch
          exporters:
          - otlphttp/victoriatraces
---
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: vtraces
  namespace: genieai
  labels:
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: 0.2.184
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
    genieai.io/component: observability
    genieai.io/managed-by: helm
    e2148.genieai.io/run: '2148'
spec:
  retentionPeriod: 30d
  removePvcAfterDelete: false
  storage:
    storageClassName: local-path
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
  replicaCount: 1
  extraArgs:
    fs.disableMmap: 'true'
