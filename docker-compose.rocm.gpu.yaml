# ROCm overlay for the standalone GPU-node stack (docker-compose.gpu.yaml).
#
# Layer it ON TOP of the base file — the base file is never edited:
#   docker compose --env-file env.strixhalo \
#     -f docker-compose.gpu.yaml -f docker-compose.rocm.gpu.yaml up -d
#
# `-f` order matters: this file must come last. Only the keys a ROCm host
# needs change: image pins (env.strixhalo), GPU device access for the three
# vLLM instances, neutralization of the NVIDIA env var (compose merges
# `environment:` BY KEY — `void` is ignored by ROCm containers and claims
# no GPU even on an NVIDIA host), and two venue accommodations commented
# below. Everything else merges from the base file.
#
# The TEI services run the CPU image (the ROCm TEI build fails on gfx1151;
# see the spike results) and need NO device access. docling-serve stays
# CPU (the ROCm path has no docling GPU support; DOCLING_DEVICE=cpu in
# env.strixhalo governs dataprep's callers).

services:
  vllm-llm:
    image: ${VLLM_ROCM_IMAGE}
    # The ROCm image has no serving entrypoint (default CMD is /bin/bash);
    # the base file's `command: > --model ...` form cannot run there.
    # Restated as an explicit `vllm serve` invocation with IDENTICAL flags.
    command: >
      vllm serve
      --model ${VLLM_LLM_MODEL_ID:-ibm-granite/granite-3.1-2b-instruct}
      --gpu_memory_utilization ${VLLM_GPU_UTILIZATION:-0.55}
      --served-model-name ${VLLM_LLM_MODEL_ID:-ibm-granite/granite-3.1-2b-instruct}
      --max_model_len ${VLLM_MAX_MODEL_LEN:-65536}
      --max_num_seqs ${VLLM_MAX_NUM_SEQS:-16}
      --dtype=${VLLM_DTYPE:-half}
      --enforce-eager
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=void
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-990}" # render — distro-specific; `getent group render`
      - "${VIDEO_GID:-44}"   # video

  vllm-translation:
    image: ${VLLM_ROCM_IMAGE}
    command: >
      vllm serve
      --model ${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      --gpu_memory_utilization ${VLLM_TRANSLATION_GPU_UTILIZATION:-0.3}
      --served-model-name ${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      --max_model_len ${VLLM_TRANSLATION_MAX_MODEL_LEN:-8192}
      --dtype=${VLLM_TRANSLATION_DTYPE:-auto}
      --port 8000
      --no-enable-chunked-prefill
      --max-num-seqs ${VLLM_TRANSLATION_MAX_NUM_SEQS:-16}
      --chat-template-content-format openai
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=void
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-990}" # render
      - "${VIDEO_GID:-44}"   # video

  tei-embedding:
    image: ${TEI_ROCM_EMBEDDING_IMAGE}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-}
      - NVIDIA_VISIBLE_DEVICES=void

  tei-reranker:
    image: ${TEI_ROCM_RERANKING_IMAGE}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-}
      - NVIDIA_VISIBLE_DEVICES=void

  # Task 14 — GPU reranker on the split node, same shape as the
  # single-server overlay's vllm-reranker. The MAIN stack's reranker
  # wrapper reaches it in split deployments through nginx-gpu (the
  # /v1/rerank proxy route), so RERANKER_VLLM_ENDPOINT on the main stack
  # points at the node's published address, not this container name.
  vllm-reranker:
    image: ${VLLM_ROCM_IMAGE}
    # No profiles key — the GPU-node stack's model services (vllm-llm,
    # tei-embedding, …) carry none either; this standalone stack is the
    # GPU tier.
    command: >
      vllm serve
      --model ${VLLM_RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      --gpu_memory_utilization ${VLLM_RERANKER_GPU_UTILIZATION:-0.05}
      --served-model-name ${VLLM_RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      --max_model_len ${VLLM_RERANKER_MAX_MODEL_LEN:-8192}
      --enforce-eager
      --port 8000
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=void
    # Base-file discipline (kics scan wave, 2026-11-19): overlay-only
    # service (the gpu-node stack has no other vLLM pooling instance to
    # merge from), so it restates cap_drop / security_opt / healthcheck —
    # the same values the single-server overlay's vLLM instances carry.
    # The ROCm image ships curl (the merged base healthcheck passes on the
    # venue's vLLM containers).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-990}" # render — distro-specific; `getent group render`
      - "${VIDEO_GID:-44}"   # video
    # Same overlay rule: attach to the stack's model network explicitly
    # (docker-compose.gpu.yaml defines gpu_network and every sibling
    # service names it).
    volumes:
      # Same cache as the base vLLM services — without it every recreate
      # re-downloads the ~1.2 GB cross-encoder from HF.
      - hf_cache:/root/.cache/huggingface
    networks:
      - gpu_network

  docling-serve:
    environment:
      - NVIDIA_VISIBLE_DEVICES=void

  nginx-gpu:
    # ports: !override — REPLACE the base file's 80:80 instead of unioning
    # with it (compose merges ports sequences by union; the un-tagged list
    # left the hardcoded 80:80 alive and the clash this block exists to
    # avoid still happened — code review finding 2, verified empirically
    # 2026-11-18). Plain-expansion fallback (no merge tag) would still
    # union. env.strixhalo / group_vars pick free ports.
    ports: !override
      - "${GPU_HTTPS_PORT:-443}:443"
      - "${GPU_HTTP_PORT:-80}:80"
