test:python:
  image: python:3.10-slim
  stage: test
  interruptible: true
  before_script:
    - cd genie-ai-overlay
    - if [ ! -d .venv ]; then python -m venv .venv; fi
    - . .venv/bin/activate
    - pip install -e ".[test]"
  script:
    - . .venv/bin/activate
    - mkdir -p reports
    - pytest --junitxml=reports/pytest-report.xml
  cache:
    key:
      files:
        - genie-ai-overlay/pyproject.toml
      prefix: test-python
    paths:
      - genie-ai-overlay/.venv/
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: genie-ai-overlay/reports/pytest-report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "genie-ai-overlay/**/*.py"
        - "genie-ai-overlay/pyproject.toml"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# --- Existing jobs (unchanged) ---

# Unit tests — runs on every PR touching mobile/
# Downloads Flutter SDK from official archive with caching
flutter:test:
  extends: .flutter_base
  stage: test
  script:
    - export PATH="$PWD/../../flutter-sdk/bin:$PATH"
    - dart pub global activate junitreport_maintained
    - export PATH="$PATH:$PUB_CACHE/bin"
    - mkdir -p reports
    - flutter test --machine | tojunit --output reports/flutter-report.xml
    - flutter test --coverage
  artifacts:
    reports:
      junit: mobile/genie_ai_mobile/reports/flutter-report.xml
    paths:
      - mobile/genie_ai_mobile/coverage/
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "mobile/genie_ai_mobile/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# Patrol E2E tests — requires Android SDK + emulator runner
# Self-hosted runner tagged 'android-emulator' provides Android SDK and emulator
# No Docker image specified — runner provides the environment
patrol:e2e:
  stage: e2e
  cache:
    key:
      files:
        - mobile/genie_ai_mobile/pubspec.lock
    paths:
      - mobile/genie_ai_mobile/.dart_tool/
      - .pub-cache/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - mobile/genie_ai_mobile/**
  before_script:
    - cd mobile/genie_ai_mobile
    - flutter pub get
    - dart pub global activate patrol_cli
    - export PATH="$PATH:$HOME/.pub-cache/bin"
  script:
    - bash patrol-wrapper.sh --flavor e2e
  artifacts:
    when: always
    paths:
      - mobile/genie_ai_mobile/test_failure/
    expire_in: 7 days
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  tags:
    - android-emulator

# --- Configuration validation ---

config:validate:
  extends: .node_base
  stage: config
  before_script:
    - cd tests/config-validator && npm ci
  script:
    - npm test
  cache:
    key:
      files:
        - tests/config-validator/package-lock.json
      prefix: config-validate
    paths:
      - tests/config-validator/node_modules/
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: tests/config-validator/reports/jest-config.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "env"
        - "env.*"
        - "docker-compose.yaml"
        - "tests/config-validator/**/*"
        - "tests/fixtures/config/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
