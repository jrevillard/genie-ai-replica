{{/*
  reranker OPEA orchestrator. TEI_RERANKING_ENDPOINT resolves to the gpu-path for
  `reranker`; HF_TOKEN + VLLM_API_KEY from the vllm-api-key Secret; the
  OTel exporter + LOG_LEVEL + the four adaptive-utility tuning knobs
  (NOVELTY_SIGMOID_*, CONTEXT_DECAY_FACTOR, MIN_VALUE_THRESHOLD) carry
  defaults overridable via .Values.opea.reranker.* (camelCase).
  Container/listen port 8000.
*/}}
{{- if .Values.opea.enabled -}}
{{- $vals := deepCopy .Values -}}
{{- $urls := list
    (dict "name" "TEI_RERANKING_ENDPOINT" "value" (include "genieai-umbrella.opeaGpuEndpoint" (dict "root" . "path" "reranker")))
    (dict "name" "OPEA_SSL_SKIP_VERIFY" "value" (include "genieai-umbrella.opeaSslSkipVerify" .))
    (dict "name" "ENABLE_OBSERVABILITY" "value" (include "genieai-umbrella.observabilityEnabledFlag" .))
    (dict "name" "OTEL_EXPORTER_OTLP_ENDPOINT" "value" (include "genieai-umbrella.otlpEndpoint" .))
    (dict "name" "LOG_LEVEL" "value" (.Values.opea.reranker.logLevel | default "info"))
    (dict "name" "NOVELTY_SIGMOID_A" "value" (.Values.opea.reranker.noveltySigmoidA | default "20.0" | toString))
    (dict "name" "NOVELTY_SIGMOID_B" "value" (.Values.opea.reranker.noveltySigmoidB | default "0.25" | toString))
    (dict "name" "CONTEXT_DECAY_FACTOR" "value" (.Values.opea.reranker.contextDecayFactor | default "0.0025" | toString))
    (dict "name" "MIN_VALUE_THRESHOLD" "value" (.Values.opea.reranker.minValueThreshold | default "-1.0" | toString))
-}}
{{- $secretEnv := include "genieai-umbrella.gpuApiKeyEnv" (dict "keys" (list "HF_TOKEN" "VLLM_API_KEY")) | fromJsonArray -}}
{{- /* opea.reranker.env: see the parity gate. */ -}}
{{- $opeaEnvRows := include "genieai-umbrella.envMapRows" (.Values.opea.reranker.env | default dict) | fromJsonArray -}}
{{- $svcVals := dict
    "image" (dict "repository" "genie-ai-reranker" "tag" "main")
    "port" 8000
    "resources" (dict "requests" (dict "cpu" "200m" "memory" "256Mi") "limits" (dict "cpu" "2" "memory" "2Gi"))
    "env" (concat $urls $secretEnv $opeaEnvRows)
    "probes" (dict
      "readiness" (dict "tcpSocket" (dict "port" 8000) "initialDelaySeconds" 30 "periodSeconds" 15)
      "liveness"  (dict "tcpSocket" (dict "port" 8000) "initialDelaySeconds" 60 "periodSeconds" 30)
    )
-}}
{{- $_ := set $vals.services "reranker" $svcVals -}}
{{- $ctx := dict "name" "reranker" "component" "reranker" "Values" $vals "Chart" .Chart "Release" .Release -}}
{{- include "genieai-umbrella.serviceDeployment" $ctx }}
---
apiVersion: v1
kind: Service
metadata:
  name: reranker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "reranker") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "reranker") | nindent 4 }}
{{- end -}}
