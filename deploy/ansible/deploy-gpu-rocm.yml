---
# GENIE.AI - ROCm GPU Node Deployment Playbook (AMD Strix Halo / gfx1151 class)
#
# Parallel to deploy-gpu.yml (NVIDIA) — NO NVIDIA Container Toolkit plays,
# NO daemon.json changes. ROCm containers need no host userland: the
# kernel driver (in-tree amdgpu, /dev/kfd + /dev/dri) plus container-side
# device passthrough and group_add are everything.
#
# Usage:
#   ansible-playbook -i inventory/rocm_gpu.ini deploy-gpu-rocm.yml
#
# Tagged re-runs:
#   ansible-playbook -i inventory/rocm_gpu.ini deploy-gpu-rocm.yml --tags install
#   ansible-playbook -i inventory/rocm_gpu.ini deploy-gpu-rocm.yml --tags prepare
#   ansible-playbook -i inventory/rocm_gpu.ini deploy-gpu-rocm.yml --tags deploy
#
# Tags:
#   install  - Docker + ROCm device access verification (amdgpu, /dev/kfd)
#   prepare  - Directories, template rendering (nginx config, API keys,
#              compose + ROCm overlay + sizing env)
#   deploy   - Compose up (base + ROCm overlay), smoke tests
#
# The GPU tier on this host runs via the standalone GPU-node compose stack
# — docker stack deploy does not pass compose `devices:` on ROCm (see
# docs/superpowers/specs/2026-11-11-rocm-gpu-tier-spike-results.md), so
# swarm-based GPU service placement is not available here.

- name: ROCm GPU Node - Detect environment
  hosts: rocm_gpu_nodes
  gather_facts: false
  tasks:
    - name: Display ROCm GPU node deployment target
      ansible.builtin.debug:
        msg: "ROCm GPU Node: {{ inventory_hostname }} ({{ ansible_host | default('localhost') }})"

- name: ROCm GPU Node - Docker installation
  hosts: rocm_gpu_nodes
  tags: [install]
  become: true
  roles:
    - role: docker

- name: ROCm GPU Node - Device access verification
  hosts: rocm_gpu_nodes
  tags: [install]
  become: true
  tasks:
    - name: Assert amdgpu kernel module loaded
      ansible.builtin.stat:
        path: /sys/module/amdgpu
      register: amdgpu_module
      failed_when: not amdgpu_module.stat.exists

    - name: Assert /dev/kfd present
      ansible.builtin.stat:
        path: /dev/kfd
      register: kfd_dev
      failed_when: not kfd_dev.stat.exists

    - name: Assert /dev/dri/renderD128 present
      ansible.builtin.stat:
        path: /dev/dri/renderD128
      register: render_dev
      failed_when: not render_dev.stat.exists

    - name: Read render and video group GIDs
      ansible.builtin.command: "getent group {{ item }}"
      loop: [render, video]
      register: gpu_groups
      changed_when: false
      # NO custom failed_when: inside a loop, `register` binds the PER-ITEM
      # result to the variable, so `gpu_groups.results` does not exist yet —
      # the old expression raised "object of type 'dict' has no attribute
      # 'results'" and failed this task on EVERY host, whatever getent
      # returned (and `item.item` was invalid for the same reason: `item`
      # IS the group name). `ansible.builtin.command` already fails the task
      # on a non-zero rc — getent exits 2 for an unknown group — and the
      # reporting task below reads `gpu_groups.results` correctly once the
      # loop has finished.

    - name: Report measured GIDs (must match RENDER_GID/VIDEO_GID in the sizing env)
      ansible.builtin.debug:
        msg: "{{ item.item }}={{ item.stdout.split(':')[2] }}"
      loop: "{{ gpu_groups.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: ROCm GPU Node - Project preparation and template rendering
  hosts: rocm_gpu_nodes
  tags: [prepare]
  become: true
  tasks:
    - name: Validate required vault variables
      ansible.builtin.assert:
        that:
          - hugging_face_hub_token is defined and hugging_face_hub_token | length > 0
          - gpu_api_keys is defined and gpu_api_keys | length > 0
          # The certificate task renders `-subj "/CN={{ gpu_public_domain }}"`
          # — an empty value makes openssl exit 1 without writing server.crt
          # and the SAN render as `DNS:` (empty). Without this assert the
          # operator gets an opaque openssl error instead of the remedy.
          - gpu_public_domain is defined and gpu_public_domain | length > 0
        fail_msg: >-
          Missing required variable(s).
          This group has NO vault.yml in the repository — every other
          environment's vault.yml is committed encrypted, but the ROCm
          group's secrets are per-GPU-node and were never committed, so
          the file is created by the operator:
          ansible-vault create group_vars/rocm_gpu_nodes/vault.yml
          (if you already created that file under the group's former
          name, MOVE it into the directory named above — ansible resolves
          a vault by the GROUP name, so a vault.yml sitting in any other
          directory is silently ignored.)
          In it set: hugging_face_hub_token, gpu_api_keys.
          In group_vars/rocm_gpu_nodes/vars.yml set gpu_public_domain
          (the host's public domain — the TLS certificate task writes
          /CN={{ gpu_public_domain }}).
        quiet: true

    - name: Ensure project directories exist
      ansible.builtin.file:
        path: "{{ gpu_deploy_dir }}/{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      loop:
        - "{{ gpu_data_dir }}"
        - "{{ gpu_data_dir }}/huggingface"
        - "{{ gpu_generated_dir }}"
        - ssl

    - name: Generate self-signed SSL certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout {{ gpu_deploy_dir }}/ssl/server.key
          -out {{ gpu_deploy_dir }}/ssl/server.crt
          -subj "/CN={{ gpu_public_domain }}"
          -addext "subjectAltName={{ gpu_public_domain | regex_search('^(\\d+\\.){3}\\d+$') | ternary('IP', 'DNS') }}:{{ gpu_public_domain }}"
        creates: "{{ gpu_deploy_dir }}/ssl/server.crt"
      register: rocm_self_signed
      when: gpu_self_signed_certs | default(true)

    - name: Copy SSL certificates to Docker volume path
      ansible.builtin.copy:
        src: "{{ gpu_deploy_dir }}/ssl/{{ item }}"
        dest: "{{ gpu_deploy_dir }}/ssl/{{ item }}"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        remote_src: true
      loop:
        - server.crt
        - server.key

    - name: Render nginx proxy configuration
      ansible.builtin.template:
        src: templates/gpu-proxy.conf.j2
        dest: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/gpu-proxy.conf"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      notify: Reload nginx-gpu

    - name: Render API keys map
      ansible.builtin.template:
        src: templates/api_keys.map.j2
        dest: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/api_keys.map"
        mode: '0600'
        owner: root
        group: root
      notify: Reload nginx-gpu
      no_log: true

    - name: Render docker-compose.gpu.yaml from template (ROCm image pins)
      ansible.builtin.template:
        src: templates/docker-compose.gpu.yaml.j2
        dest: "{{ gpu_deploy_dir }}/docker-compose.gpu.yaml"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy the ROCm GPU-node overlay from the repo checkout
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker-compose.rocm.gpu.yaml"
        dest: "{{ gpu_deploy_dir }}/docker-compose.rocm.gpu.yaml"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy the Strix Halo sizing env from the repo checkout
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../env.strixhalo"
        dest: "{{ gpu_deploy_dir }}/env.strixhalo"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Render host-specific env overrides (GIDs, ports)
      ansible.builtin.copy:
        content: |
          RENDER_GID={{ rocm_render_gid | default(990) }}
          VIDEO_GID={{ rocm_video_gid | default(44) }}
        dest: "{{ gpu_deploy_dir }}/rocm-host.env"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

  handlers:
    - name: Reload nginx-gpu
      ansible.builtin.shell: >
        docker compose
        --env-file {{ gpu_deploy_dir }}/env.strixhalo
        --env-file {{ gpu_deploy_dir }}/rocm-host.env
        -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml
        -f {{ gpu_deploy_dir }}/docker-compose.rocm.gpu.yaml
        exec -T nginx-gpu nginx -s reload
      changed_when: true
      # Silently skip if container not running yet (first deploy)
      failed_when: false

- name: ROCm GPU Node - Deploy services
  hosts: rocm_gpu_nodes
  tags: [deploy]
  become: true
  tasks:
    - name: Validate ROCm GPU compose configuration
      ansible.builtin.shell: >
        docker compose
        --env-file {{ gpu_deploy_dir }}/env.strixhalo
        --env-file {{ gpu_deploy_dir }}/rocm-host.env
        -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml
        -f {{ gpu_deploy_dir }}/docker-compose.rocm.gpu.yaml
        config --quiet
      args:
        chdir: "{{ gpu_deploy_dir }}"
      register: rocm_compose_validate
      changed_when: false
      failed_when: rocm_compose_validate.rc != 0

    - name: Deploy ROCm GPU node services
      ansible.builtin.shell: >
        docker compose
        --env-file {{ gpu_deploy_dir }}/env.strixhalo
        --env-file {{ gpu_deploy_dir }}/rocm-host.env
        -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml
        -f {{ gpu_deploy_dir }}/docker-compose.rocm.gpu.yaml
        up -d
      args:
        chdir: "{{ gpu_deploy_dir }}"
      register: rocm_compose_deploy
      changed_when: "'Started' in rocm_compose_deploy.stdout or 'Created' in rocm_compose_deploy.stdout"

    - name: Stat ROCm GPU node SSL and api_keys files before normalization
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: rocm_node_files_pre
      loop:
        - { path: "{{ gpu_deploy_dir }}/ssl/server.crt" }
        - { path: "{{ gpu_deploy_dir }}/ssl/server.key" }
        - { path: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/api_keys.map" }
      failed_when: false

    # Same cap-dropped nginx container constraint as the NVIDIA playbook:
    # re-own so the container (root, no DAC_OVERRIDE) can read them.
    - name: Normalize ROCm GPU node file ownership for the cap-dropped nginx-gpu container
      become: true
      become_user: root
      become_method: sudo
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: file
        owner: root
        group: root
        mode: >-
          {{ '0644' if (item.item.path.endswith('server.crt') or item.item.path.endswith('api_keys.map')) else '0600' }}
      loop: "{{ rocm_node_files_pre.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when:
        - item.stat.exists
        - (item.stat.pw_name != 'root')

    - name: Deploy output
      ansible.builtin.debug:
        var: rocm_compose_deploy.stdout_lines

- name: ROCm GPU Node - Smoke tests (path-based routing on port {{ gpu_https_port | default('443') }})
  hosts: rocm_gpu_nodes
  tags: [deploy]
  become: true
  tasks:
    - name: Wait for vLLM LLM health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/llm/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_llm
      until: rocm_health_llm.status == 200
      retries: 30
      delay: 15

    - name: Wait for vLLM Translation health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/translation/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_translation
      until: rocm_health_translation.status == 200
      retries: 30
      delay: 15

    - name: Wait for TEI Embedding health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/embed/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_embedding
      until: rocm_health_embedding.status == 200
      retries: 30
      delay: 15

    - name: Wait for TEI Reranker health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/rerank/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_reranker
      until: rocm_health_reranker.status == 200
      retries: 30
      delay: 15

    - name: Wait for docling-serve health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/docling/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_docling
      until: rocm_health_docling.status == 200
      retries: 30
      delay: 15

    - name: Verify 401 rejection without API key
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/llm/health"
        method: GET
        validate_certs: false
      register: rocm_auth_reject
      failed_when: rocm_auth_reject.status != 401

    - name: Deployment summary
      ansible.builtin.shell: |
        echo ""
        echo "============================================="
        echo "ROCm GPU Node deployment complete"
        echo "============================================="
        echo "vLLM LLM:         {{ rocm_health_llm.status }}"
        echo "vLLM Translation: {{ rocm_health_translation.status }}"
        echo "TEI Embedding:    {{ rocm_health_embedding.status }}"
        echo "TEI Reranker:     {{ rocm_health_reranker.status }}"
        echo "docling-serve:    {{ rocm_health_docling.status }}"
        echo "Auth (401 test):  {{ rocm_auth_reject.status }}"
        echo "Domain:           {{ gpu_public_domain }}"
        echo "============================================="
        echo ""
      changed_when: false
