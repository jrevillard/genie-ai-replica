---
# no-root-data-migration (#1227) — shared by the manager play and the
# swarm_workers play in deploy.yml via import_tasks. One doctrine, two
# placements: the tasks below create the backend backup directory as the
# backend uid (1000) and hand every mis-owned file inside it to that uid
# — TARGETED, never wholesale, and never destructive.
#
# Scope note: the legacy data/logs tree is deliberately NOT handled here
# — nothing has mounted it since #1227 (every service logs to stdout),
# the runtime gate prunes it from its sweep (not a bind source), and it
# can be removed at will.
# data_dir / deploy_dir come from group_vars; both plays run these with
# the same variable surface. NOTE on privilege surfaces: every task here
# escalates to root — an unprivileged find exits nonzero on a 0700
# uid-1000 subdir (EACCES the chown cannot fix, which would churn the
# handover 'changed' forever), and a foreign-uid chown is EPERM for the
# play's unprivileged ansible_user. There is no unprivileged surface left
# in this file by design.

# The effective data directory is data_dir_resolved (group_vars/all.yml —
# the ONE join/normalize formula; env.j2 ships an absolute override
# VERBATIM, so the stack's bind sources live at <resolved>/database_backups).
# A `~`-rooted inventory override is NOT supported: the three contexts
# involved cannot agree on what ~ means — the file module below expands it
# as the become user (root → /root), the command-module find probes never
# expand it at all, and compose would expand it as the invoking
# ansible_user. Spell the override absolute.

- name: Compute the data-dir escape guard once (#1227)
  # ONE definition for BOTH guarded tasks below (handover + backup-dir):
  # the guard was duplicated verbatim per task and the copies could drift
  # — one running against '/' or a deploy_dir ancestor while the other
  # skips, reintroducing the stray-chown class by maintenance.
  # data_dir_resolved renders '.' for data_dir: '/' (the formula strips
  # the slash then normpath('') = '.') — hence the dot in the skip list.
  ansible.builtin.set_fact:
    _data_dir_escaped: >-
      {{ data_dir_resolved in ['/', '.']
         or (deploy_dir_resolved is match(data_dir_resolved | regex_escape ~ '/')) }}

- name: Build the data-dir exclusion chain (shared derivation)
  # The manager play imports this BEFORE its payload pass; the worker
  # path needs it here. Idempotent: re-setting the same fact.
  ansible.builtin.import_tasks: tasks/compute-ancestors.yml

- name: Fail loud on a parent-relative data_dir override (#1227)
  # A '../'-prefixed spelling resolves through the formula to a host path
  # OUTSIDE deploy_dir (../data -> <parent>/data) that is neither '/' nor
  # '.' nor a deploy_dir ancestor — the escape guard lets it pass and the
  # root tasks below would chown/create on an UNMANAGED host path on
  # every deploy, silently. A one-character typo away from './data'; the
  # supported overrides are absolute (or the ./data default), so this
  # spelling is always a mistake — fail loud like the '~' assert above.
  ansible.builtin.assert:
    # ANY '..' PATH COMPONENT escapes deploy_dir through normpath, not
    # just a leading one: './../data' and 'x/../../y' resolve outside too
    # (verified) — the prefix-only '^\.\.' matcher once let them through
    # to the root tasks below.
    # search (NOT match): re.match anchors at position 0 and a leading
    # './' hides the '/..' component from it
    that: data_dir is not search('(^|/)\.\.(/|$)')
    fail_msg: >-
      data_dir must be absolute (or the default ./data): a '..' path
      component escapes deploy_dir and would make the root tasks act on
      an unmanaged host path.
    quiet: true

- name: Fail loud on an unsupported ~-rooted data_dir override (#1227)
  # The header documents that ~ is NOT supported; without this assertion
  # it degraded SILENTLY: '~/genieai-data' fails the absolute test and
  # joins literally to deploy_dir/~  /genieai-data — the playbook would
  # create, hand over and ship a directory literally named '~'. The other
  # misconfigured spellings ('/', an ancestor, '..'-escaping chains,
  # trailing slashes, the degenerate '.') all have explicit guards; this
  # one gets the same loud failure instead of a wrong-path deploy.
  ansible.builtin.assert:
    that: data_dir is not match('^~')
    fail_msg: >-
      data_dir must be an absolute path: a '~'-rooted override is not
      supported (the file module expands it as the become user, the find
      probes never expand it, and compose would expand it as the invoking
      ansible_user). Spell the override absolute.
    quiet: true

- name: Hand the data directory itself to ansible_user (depth 0, #1227)
  # Runs BEFORE the backup-dir creation below on BOTH placements, and it
  # must: the file module applies the leaf's owner to every MISSING
  # PARENT it creates (verified in the module source — each created level
  # gets set_fs_attributes_if_different with the same args), so without
  # this task a worker whose data/ tree does not exist yet would get the
  # data dir itself created uid-1000-owned by the backup-dir task — a
  # different doctrine than the manager's ansible_user-owned data root.
  # The manager play also runs the create-dirs step before this import;
  # there this task is the (idempotent) re-own of a possibly root-created
  # tree — the payload passes exclude the data tree DELIBERATELY, and the
  # deleted recurse:true chowns were otherwise the only step re-owning a
  # ROOT-ERA data/ directory. Depth 0 only — nothing recurses INTO the
  # tree: its contents stay the migration's business.
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ data_dir_resolved }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  # NO mode: key — the operator's 0700/0750 hardening of the data
  # dir must survive every deploy (ownership only, never widened).
  # Escape guard: a MISCONFIGURED inventory (data_dir: / or an ANCESTOR
  # of deploy_dir, e.g. data_dir: .. resolving to /opt) would make this
  # depth-0 task hand the filesystem root — or deploy_dir's parent — to
  # ansible_user on every deploy (rendered and confirmed for / and /opt).
  # Note this is NOT the external-override case: an absolute data_dir
  # OUTSIDE deploy_dir that is not its ancestor (/srv/genieai-data) is a
  # supported spelling and still passes (it is neither '/' nor a parent).
  when: not _data_dir_escaped

- name: Hand the data directory's intermediate ancestors to ansible_user (depth 0, #1227)
  # For a nested override (data_dir: /opt/genieai/state/data) the chain
  # between deploy_dir and the data dir (state/) needs the same depth-0
  # handover: a FRESH deploy creates the ancestors with the leaf's owner
  # anyway (see above), but a ROOT-ERA existing ancestor would stay
  # root-owned forever — the payload probe/heal prunes the whole ancestor
  # chain (the heal must not chown -R across the data handover), so
  # depth-0 here is the ONLY layer that can re-own an existing ancestor.
  # KNOWN ENFORCEMENT GAP, accepted: sibling content a previous era left
  # UNDER an ancestor (deploy_dir/state/other) is never probed, healed or
  # swept — the ancestor's own ownership is enforced here, its other
  # children are the operator's tree.
  # The loop slices the SHARED derivation (tasks/compute-ancestors.yml,
  # imported above): [0:-1] = every prefix except the LAST, which IS the
  # data dir already handed over above; for a top-level or degenerate
  # data dir the chain renders one/zero entries and the slice is empty.
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  # An override OUTSIDE deploy_dir renders ..-prefixed chain entries; the
  # prune builder treats them as harmless no-op find patterns, but THIS
  # task acts through the file module, which NORMALIZES the joins —
  # without this guard it would chown /opt, / and /srv to ansible_user
  # (rendered and confirmed). parts[0] == '..' means EVERY entry escapes
  # deploy_dir: skip the whole loop.
  when: _rel_parts[0] != '..'
  vars:
    _rel_parts: "{{ (data_dir_resolved | relpath(deploy_dir_resolved)) | split('/') | list }}"
  loop: "{{ _fix_payload_data_chain[0:-1] }}"

- name: Create the backend backup directory as the backend uid (#1227)
  # Pinned to the backend uid AT CREATION: a fresh dir left
  # ansible_user-owned would never pass the handover probe below, and
  # the uid-1000 backend would get EACCES on its own dumps. Escalate to
  # root — a foreign-uid chown (or a dir pre-existing root-owned from a
  # bare-docker root-era install) is EPERM for the play's unprivileged
  # ansible_user.
  # Same escape guard as the handover above: a '/' or ancestor data_dir
  # must not get a /database_backups — or a handover — either.
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ data_dir_resolved }}/database_backups"
    state: directory
    # NO mode: key — the operator's 0700 hardening of this dump dir must
    # survive every deploy (ownership only, never widened), same doctrine
    # as the depth-0 data-dir handover in deploy.yml.
    owner: "1000"
    group: "1000"
  when: not _data_dir_escaped

- name: Hand the backup directory to the backend uid (#1227)
  # The probe matches EVERY uid != 1000, not just root: the manager play's
  # payload-ownership pass (tasks/payload-ownership-pass.yml) re-labels the
  # deploy payload around this import, so a uid-0-only probe would never
  # fire on the manager path (dead code by pre-emption). This directory is
  # the backend's dump target — the backend (uid 1000) must own every file
  # in it, and anything else is either root-era or mis-owned. (The deploy
  # recursions exclude data/ entirely, so on converged deployments this
  # probe is empty and the handover skips — the tasks converge instead of
  # churning every deploy.)
  # The probe/heal/warn skeleton itself lives ONCE in
  # tasks/ownership-probe-heal.yml; only the commands differ here.
  ansible.builtin.import_tasks: tasks/ownership-probe-heal.yml
  vars:
    # -H: the data dir is commonly a SYMLINK (a small /opt pointing at a
    # bigger volume — check-runtime.sh documents and resolves the same
    # layout); without it find lstats the symlink inode only, the probe
    # sees nothing, and the root-era tree at the target stays invisible
    # while the runtime gate (which readlink -f's the path) keeps failing
    # red with no playbook rerun able to green it. Symlinks INSIDE the
    # tree are still not followed (-H follows only the starting path).
    _trio_probe_cmd: >-
      find -H "{{ data_dir_resolved }}/database_backups" ! -uid 1000 -print -quit
    _trio_heal_cmd: >-
      find -H "{{ data_dir_resolved }}/database_backups" ! -uid 1000
      -print -exec chown -h 1000:1000 {} +
    _trio_label: backup-dir handover
