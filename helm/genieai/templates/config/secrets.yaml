apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: genieai-azure-keyvault
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "genieai-secrets" "tier" "cpu" "context" .) | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.secrets.azureKeyVault.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.secrets.azureKeyVault.keyvaultName | quote }}
    cloudName: ""
    tenantId: {{ .Values.secrets.azureKeyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: arango-root-password
          objectType: secret
        - |
          objectName: kong-pg-password
          objectType: secret
        - |
          objectName: keycloak-db-password
          objectType: secret
        - |
          objectName: keycloak-admin-password
          objectType: secret
        - |
          objectName: hf-token
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: encryption-key
          objectType: secret
  secretObjects:
    - secretName: genieai-secrets
      type: Opaque
      data:
        - objectName: arango-root-password
          key: ARANGO_ROOT_PASSWORD
        - objectName: kong-pg-password
          key: KONG_PG_PASSWORD
        - objectName: keycloak-db-password
          key: KEYCLOAK_DB_PASSWORD
        - objectName: keycloak-admin-password
          key: KEYCLOAK_ADMIN_PASSWORD
        - objectName: hf-token
          key: HF_TOKEN
        - objectName: jwt-secret
          key: JWT_SECRET
        - objectName: encryption-key
          key: ENCRYPTION_KEY
