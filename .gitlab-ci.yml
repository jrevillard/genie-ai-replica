stages:
  - lint
  - test
  - contract
  - config
  - e2e

variables:
  FLUTTER_VERSION: "3.41.7"
  FLUTTER_ARCHIVE: "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"

# --- Hidden job templates (DRY, reusable by Story 1.3 test stage) ---

.node_base:
  image: node:20-alpine
  interruptible: true

.lint_node:
  extends: .node_base
  stage: lint

.test_node:
  extends: .node_base
  stage: test
  variables:
    NODE_ENV: test
  artifacts:
    when: always
    expire_in: 7 days

.contract_node:
  extends: .node_base
  stage: contract
  variables:
    NODE_ENV: test
  artifacts:
    when: always
    expire_in: 7 days

.flutter_base:
  image: debian:bookworm-slim
  interruptible: true
  variables:
    PUB_CACHE: $CI_PROJECT_DIR/.pub-cache
  cache:
    - key: "flutter-sdk-${FLUTTER_VERSION}"
      paths:
        - flutter-sdk/
    - key:
        files:
          - mobile/genie_ai_mobile/pubspec.lock
      paths:
        - mobile/genie_ai_mobile/.dart_tool/
        - .pub-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils
    - |
      if [ ! -d "flutter-sdk/bin" ]; then
        echo "Installing Flutter ${FLUTTER_VERSION}..."
        curl -fsSL "${FLUTTER_ARCHIVE}" | tar -xJ
        mv flutter flutter-sdk
      fi
    - git config --global --add safe.directory "$PWD/flutter-sdk"
    - export PATH="$PWD/flutter-sdk/bin:$PATH"
    - flutter --version
    - cd mobile/genie_ai_mobile
    - cp patrol_test/e2e_secrets.dart.example patrol_test/e2e_secrets.dart
    - flutter pub get

# --- Lint jobs ---

lint:backend:
  extends: .lint_node
  before_script:
    - cd components/gov-chat-backend && npm ci
  script:
    - npm run lint
    - npm run format:check
  cache:
    key:
      files:
        - components/gov-chat-backend/package-lock.json
      prefix: lint-backend
    paths:
      - components/gov-chat-backend/node_modules/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/gov-chat-backend/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

lint:frontend:
  extends: .lint_node
  before_script:
    - cd components/gov-chat-frontend && npm ci
  script:
    - npm run lint
    - npm run format:check
  cache:
    key:
      files:
        - components/gov-chat-frontend/package-lock.json
      prefix: lint-frontend
    paths:
      - components/gov-chat-frontend/node_modules/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/gov-chat-frontend/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

lint:doc-repo:
  extends: .lint_node
  before_script:
    - cd components/document-repository && npm ci
  script:
    - npm run lint
    - npm run format:check
  cache:
    key:
      files:
        - components/document-repository/package-lock.json
      prefix: lint-doc-repo
    paths:
      - components/document-repository/node_modules/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/document-repository/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

lint:python:
  image: python:3.10-slim
  stage: lint
  interruptible: true
  before_script:
    - pip install ruff
  script:
    - ruff check genie-ai-overlay/
    - ruff format --check genie-ai-overlay/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "genie-ai-overlay/**/*.py"
        - "genie-ai-overlay/pyproject.toml"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

lint:dart:
  extends: .flutter_base
  stage: lint
  script:
    - export PATH="$PWD/../../flutter-sdk/bin:$PATH"
    - flutter analyze
    - dart format --output=none --set-exit-if-changed lib/ test/ patrol_test/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "mobile/genie_ai_mobile/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

