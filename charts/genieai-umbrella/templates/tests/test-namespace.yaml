{{- /* Component label context, same pattern as templates/namespace.yaml. */ -}}
{{- $componentValues := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "test" -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "genieai-common.fullname" . }}-test-namespace
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" $componentValues | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  # The hook-owned dep-check SA (read-only ClusterRole grant on
  # `namespaces`/get) — the same SA the pre-upgrade hooks and the
  # data-deps test pod use. Reused here because the new assertion
  # queries `kubectl get ns`, which is NOT a noop: it requires both
  # the kubectl binary (alpine lacks it) and an SA-bound RBAC grant.
  serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # Required by PSA restricted.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  # `registry.k8s.io/kubectl` is distroless (no /bin/sh), so this Pod
  # ships kubectl via an init container that downloads the static binary
  # into the shared `tools` emptyDir. The main container is alpine
  # (sh is built in); kubectl is picked up via the PATH env, which
  # prepends /tools/bin.
  volumes:
    - name: tools
      emptyDir: {}
  initContainers:
    - name: tools
      # curlimages/curl: sh + curl in one tiny image, no apk layer.
      # Pulls the upstream kubectl release binary and makes it executable
      # in /tools/bin for the main container.
      image: docker.io/curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tools
          mountPath: /tools
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          mkdir -p /tools/bin
          curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl -o /tools/bin/kubectl
          chmod +x /tools/bin/kubectl
  containers:
    - name: test
      # SA = the hook-owned dep-check SA (read-only ClusterRole on namespaces).
      image: "{{ .Values.global.imageRegistry | default "docker.io" }}/library/alpine:3.20"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      env:
        - name: PATH
          # Prepend /tools/bin so kubectl (downloaded by the `tools` init
          # container) is discoverable by the script.
          value: /tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: EXPECTED_PROFILE
          value: {{ .Values.clusterProfile | default "dev" | quote }}
      volumeMounts:
        - name: tools
          mountPath: /tools
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          ns="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
          echo "test Pod running in namespace: $ns"
          # Read-only assertion via kubectl (read-only RBAC in
          # charts/genieai-umbrella/templates/rbac/): the release namespace
          # must carry the chart's PSA labels and the genieai.io/cluster-profile
          # label (set by templates/namespace.yaml; read by the clusterprofile-detect hook).
          enforce=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}' 2>/dev/null || true)
          enforce_ver=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce-version}' 2>/dev/null || true)
          cluster_profile=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.genieai\.io/cluster-profile}' 2>/dev/null || true)
          [ -n "$enforce" ] \
            || { echo "FAIL: pod-security.kubernetes.io/enforce missing (got: '$enforce')"; exit 1; }
          [ "$enforce" = "restricted" ] \
            || { echo "FAIL: pod-security.kubernetes.io/enforce != restricted (got: '$enforce')"; exit 1; }
          [ -n "$enforce_ver" ] \
            || { echo "FAIL: pod-security.kubernetes.io/enforce-version missing (got: '$enforce_ver')"; exit 1; }
          # Fail if the label is absent, then compare its value to EXPECTED_PROFILE.
          if [ -z "$cluster_profile" ]; then
            echo "FAIL: genieai.io/cluster-profile label is absent (expected: '$EXPECTED_PROFILE')"
            exit 1
          fi
          if [ "$cluster_profile" != "$EXPECTED_PROFILE" ]; then
            echo "FAIL: genieai.io/cluster-profile mismatch — got '$cluster_profile', expected '$EXPECTED_PROFILE'"
            exit 1
          fi
          echo "PASS"
{{- /* Gated on SealedSecrets AND at least one data tier rendering them —
       the test asserts the tier-specific Secrets exist, so a release with
       secrets (or all data tiers) disabled has nothing to check. */ -}}
{{- if and .Values.secrets.sealedSecrets.enabled (or .Values.data.arangodb.enabled (or .Values.data.keycloak.enabled .Values.data.postgres.enabled)) }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "genieai-common.fullname" . }}-test-data-deps
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "test") | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  # `registry.k8s.io/kubectl` is distroless (no /bin/sh), so this Pod
  # ships kubectl via an init container that downloads the static binary
  # into the shared `tools` emptyDir. The main container is alpine
  # (sh is built in); kubectl is picked up via the PATH env, which
  # prepends /tools/bin.
  volumes:
    - name: tools
      emptyDir: {}
  initContainers:
    - name: tools
      # curlimages/curl: sh + curl in one tiny image, no apk layer.
      # Pulls the upstream kubectl release binary and makes it executable
      # in /tools/bin for the main container.
      image: docker.io/curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tools
          mountPath: /tools
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          mkdir -p /tools/bin
          curl -fsSL https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl -o /tools/bin/kubectl
          chmod +x /tools/bin/kubectl
  containers:
    - name: t
      # SA = the hook-owned dep-check SA (persists between hook fires via
      # before-hook-creation).
      image: "{{ .Values.global.imageRegistry | default "docker.io" }}/library/alpine:3.20"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      env:
        - name: PATH
          # Prepend /tools/bin so kubectl (downloaded by the `tools` init
          # container) is discoverable by the script.
          value: /tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: tools
          mountPath: /tools
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          ns="{{ .Values.namespace }}"
          echo "test Pod checking SealedSecret materialization"
          # SealedSecret → Secret is eventually consistent: the controller
          # unseals asynchronously after the SealedSecret is applied. A
          # still-encrypted sentinel NEVER materializes (controller marks
          # the SealedSecret Synced=False, reason ErrorDecrypt) and runs out
          # of retries below. Poll each expected Secret up to 30 × 2s.
          check_secret() {
            name="$1"
            i=0
            while [ "$i" -lt 30 ]; do
              if kubectl get secret "$name" -n "$ns" >/dev/null 2>&1; then
                echo "OK: K8s Secret materialized: $name"
                return 0
              fi
              i=$((i+1))
              sleep 2
            done
            echo "FAIL: K8s Secret never materialized: $name (SealedSecret sentinel not re-sealed, or controller down)"
            return 1
          }
          failed=0
          {{- if .Values.data.arangodb.enabled }}
          check_secret arango-jwt-secret || failed=1
          check_secret arango-root-secret || failed=1
          {{- end }}
          {{- if or .Values.data.keycloak.enabled .Values.data.postgres.enabled }}
          # keycloak-db-credentials is rendered by the Postgres tier (the
          # Keycloak CR consumes it); either tier enabled means it must exist.
          check_secret keycloak-db-credentials || failed=1
          {{- end }}
          if [ "$failed" -ne 0 ]; then
            echo "FAIL: expected K8s Secrets did not materialize in 60s"
            exit 1
          fi
          echo "PASS"
{{- end }}
