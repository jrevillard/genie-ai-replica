# GENIE.AI umbrella chart — foundation values.
# The keys below are the ones the current template surface consumes. Service
# tiers (services.*, observability.*, data.*, ingress.*, gpu.*, migration.*)
# and the pluggability surface (secretsBackend / ingressClassName /
# storageClassName / containerRuntime) are added together with the templates
# that consume them — keys no template reads are not declared here.

# Target namespace for tier templates that spell one out. MUST equal the
# release namespace (-n) — the chart fails the render otherwise (the
# Namespace resource and test pod follow .Release.Namespace).
namespace: genieai

global:
  # imagePullSecrets — a list of {name: <Secret>} refs wired into every
  # service pod's spec.imagePullSecrets, for a registry that requires
  # authentication. The registry the images are pulled FROM is the
  # top-level imageRegistry (which prefixes every image.repository) —
  # this knob is only about the PULL CREDENTIALS.
  imagePullSecrets: []
  # Architecture for the tooling images the hooks/test pods download
  # (kubectl, jq). Clusters running arm64 nodes set arm64.
  toolingArch: "amd64"
  # Registry for Helm hook Jobs and test pods that pull public Docker
  # Hub images (alpine, python, curlimages/curl). Separate from the
  # top-level `imageRegistry`, which scopes service images to the GitLab
  # Container Registry; tooling images are not republished there, so
  # they must keep their public registry. Empty = docker.io.
  toolingImageRegistry: ""
  # Hook + test-pod init containers curl-download kubectl + jq from the
  # public releases. In air-gapped environments set this to an
  # internal mirror URL (no scheme) so the init container hits a
  # local proxy; the paths /release/v1.33.0/bin/linux/amd64/kubectl
  # and /jq/releases/download/jq-1.7.1/jq-linux-amd64 are appended
  # automatically. Default = empty (use the public URLs).
  kubeletToolsMirror: ""
  # Global pull-policy override for the service images. Leave empty: the
  # default follows the tag (mutable tags — main, latest, stable* — pull
  # Always; a pinned tag pulls IfNotPresent), and a per-service
  # services.<svc>.image.pullPolicy beats both.
  imagePullPolicy: ""

# Drives chart-derived defaults (replica counts, data-tier topology,
# observability). dev | staging | prod (sovereign is reserved (rejected by values.schema.json's clusterProfile enum until the sovereign profile lands — its branches
# land with the sovereign deployment tier; it is rejected until then).
clusterProfile: dev

# Observability. Per-component flags — there is intentionally NO
# master `enabled` switch. VictoriaLogs is the baseline: the admin
# logs UI reads it, so `logs.enabled` defaults TRUE (VLSingle + OTel
# collector gateway + filelog DaemonSet agent). Metrics, traces and
# Grafana are opt-in (default FALSE) per environment via the deploy
# repo overlay ConfigMap.
#
# Operator controllers (vmoperator, opentelemetry-operator,
# grafana-operator) are cluster bootstrap prerequisites — installed
# via genie-ai-deploy (Flux HelmReleases) or
# genie-ai/scripts/install-prereqs.sh; the chart renders only the CRs.
observability:
  logs:
    enabled: true
    # VLSingle retention period (30d default).
    retentionPeriod: "30d"
    storageSize: 20Gi
  metrics:
    enabled: false
    # VMSingle retention period.
    retentionPeriod: "30d"
    storageSize: 20Gi
  traces:
    enabled: false
    # VTSingle retention period.
    retentionPeriod: "30d"
    storageSize: 20Gi
  grafana:
    enabled: false
    # The Grafana admin USERNAME. The operator writes it into
    # genieai-grafana-admin-credentials on every reconcile and it wins
    # over any user an operator-provided Secret carried; the PASSWORD is
    # always the operator's (generated once, kept across reconciles).
    # Leave "admin" unless the site pins a different console user.
    adminUser: admin
  # OTel operator collector CR name; the in-cluster Service is named
  # <cr>-collector (see templates/_lib/_observability.tpl).
  collectorCRName: genieai-collector
  # Collector OTLP/HTTP listener port. Default 4318 matches the
  # OpenTelemetry Operator's default `spec.ports[0].port`. Override
  # when the cluster-side Collector Service exposes a non-default
  # port (e.g. port collisions on a shared node).
  collectorPort: 4318
  # Collector image for the GATEWAY, applied only when the metrics tier
  # is on: it is the one signal that needs prometheusremotewrite, and the
  # operator's default image (the `k8s` distribution) has no prometheus
  # exporter — the collector then refuses to start and the logs and
  # traces pipelines die with it. The filelog agent keeps the operator
  # default: it only forwards over otlphttp.
  collectorImage: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0"
  # The filelog agent's k8sattributes processor needs the Kubernetes API.
  # A NetworkPolicy cannot name the API server (it is not a pod), so the
  # peer is a CIDR: list the control plane's address range here.
  #
  # Empty (the default) means the CNI's own default applies. That works
  # on Calico and kube-router, whose failsafe ports include the API
  # server's; it is NOT guaranteed. A CNI that denies host-to-pod by
  # default (Cilium with --allow-localhost=policy, a hardened Calico
  # with a global default-deny) drops the agent's watch, and the
  # symptom is silent and narrow: logs still arrive, every row just
  # loses its k8s.pod.name / service.name. Check it after installing on
  # a new cluster:
  #   kubectl -n genieai-obs logs deploy/genieai-agent --tail=50 | grep -i error
  collectorAgent:
    apiServerCIDRs: []

# data layer values

# Declared alongside the templates that dereference them:
# the data-tier PVCs read `pluggable.storageClassName`, the convergence
# Job derives KC_PUBLIC_ORIGIN from `ingress.host`. Helm nil-pointer-evaluates
# a missing parent map even under `with`/`default` guards — the keys must
# exist in values.yaml before any template reads them.
# Per-environment overrides elaborate both blocks; do not duplicate them here.
# Registry prefix for the genie-ai-* service images. Deliberately NOT
# under `global.`: `global.imageRegistry` is a Helm-wide convention that
# every subchart consumes (gateway-helm rewrites its images through it),
# and this registry only mirrors GENIE.AI images — subchart images
# (Envoy Gateway) must keep their upstream registry.
imageRegistry: "registry.opensource.unicc.org/un/itu/genie-ai"

pluggable:
  storageClassName: ""                # "" = cluster default storage class

# Envoy Gateway controller (chart dependency). On by default — the edge
# tier couples 1:1 with the Gateway/HTTPRoute resources the chart renders.
# false = another controller owns the `ingress.className` GatewayClass
# (chart still renders the controller-agnostic Gateway API resources).
# An off-cluster edge does NOT disable this: it forwards to the in-cluster
# Envoy data plane, which stays the single path router. See
# site/content/en/docs/deploy/ for the exposure topologies.
envoyGateway:
  enabled: true

ingress:
  # Create the cluster-scoped GatewayClass. Cluster-scoped singleton:
  # Envoy Gateway documents creating it once per cluster out of band, so
  # an install into a cluster that already has it fails with "already
  # exists", and uninstalling this release would delete a class other
  # Gateways depend on. Default false — set true only in an environment
  # where this release owns it (single-stack dev cluster), or pre-create
  # the class yourself.
  createGatewayClass: false
  #
  # Multiple GENIE releases on one cluster: supported, with three
  # requirements — distinct release names, distinct namespaces, distinct
  # ingress hosts. Every cluster-scoped resource the chart owns carries
  # the release name or the namespace, EXCEPT the GatewayClass, which is
  # a deliberate per-cluster singleton both releases share (that is why
  # createGatewayClass defaults to false: pre-create it once, or let each
  # environment opt in). CI asserts this per render — a cluster-scoped
  # name carrying neither is a second-release collision waiting to happen.
  # The operator dependencies (kube-arangodb, CNPG, keycloak-operator,
  # cert-manager, vmoperator, otel-operator) are cluster-wide by nature:
  # install them ONCE and share them.
  # Public hostname (may carry :port, e.g. genieai.local:4443) — the OIDC
  # issuer, redirect URLs and TLS dnsNames all derive from it. Deployment
  # data, supplied per environment; no chart default.
  host: ""
  # Scheme of the public origin. Feeds KC_PUBLIC_ORIGIN (realm
  # redirectUris/webOrigins): a port-forward demo serves plain HTTP, so
  # the overlay sets http:// there or every login redirect mismatches.
  scheme: https
  # Gateway API tier (Plan 6 Phase 2). Off by default: the laptop overlay
  # reaches the stack through `kubectl port-forward` of the Envoy
  # data-plane Service, which needs no Gateway. Turn this on when an
  # Envoy Gateway (or any controller implementing the `envoy` class)
  # fronts the release.
  enabled: false
  # GatewayClass the Gateway binds to. The controller that owns the class
  # is a cluster prerequisite (scripts/install-prereqs.sh installs Envoy
  # Gateway); the chart never installs it.
  className: envoy
  tls:
    # HTTPS listener + cert-manager Certificate. Requires an Issuer the
    # operator created beforehand (issuerName); a pre-baked Secret
    # (secretName) skips the Certificate CR entirely — sovereign
    # deployments that manage keys outside cert-manager.
    enabled: false
    issuerName: ""
    # ClusterIssuer (cluster-scoped) or Issuer (namespace-scoped).
    issuerKind: ClusterIssuer
    secretName: ""
  # Namespace of the Envoy data plane. Empty = the Gateway's own
  # namespace (EG 1.x default — the proxy pods carry
  # gateway.envoyproxy.io/owning-gateway-* labels there). Set only when
  # an EnvoyProxy CR moves the data plane elsewhere.
  dataplaneNamespace: ""
  # Cross-origin API access. Empty list = no CORS SecurityPolicy rendered
  # (same-origin deployments — the default topology — need none).
  cors:
    allowOrigins: []

data:
  # The `enabled` toggles gate the custom resources only; the operator
  # controllers that reconcile them (CNPG, kube-arangodb, keycloak-operator)
  # are cluster bootstrap prerequisites — see the README's Cluster
  # prerequisites section.
  # `dependencyGraph` drives the pre-install dep-check for both tiers:
  # the hook exports one toggle per graph key into enabled.json and
  # refuses an install whose enabled component depends on a disabled
  # one. A component absent from the graph exports nothing, so its
  # dependencies go unchecked — add the entry alongside the component.
  postgres:
    enabled: true
    # CNPG Cluster resources for the keycloak-db (the only Postgres; the edge
    # tier is Envoy Gateway, not Kong).
    instances: 1                       # 3 on prod via clusterProfile (staging keeps 1). ArangoDB does NOT follow: data.arangodb.mode is the only source of truth for its topology, on every profile
    storageSize: 10Gi
  arangodb:
    enabled: true
    # Arango deployment mode. THIS VALUE IS THE ONLY SOURCE OF TRUTH for
    # the rendered ArangoDeployment mode — the chart does NOT auto-promote
    # on clusterProfile changes (kube-arangodb requires fresh uninstall+install
    # for mode switches; see docs/charts/arangodb-mode-migration.md). Operators
    # switch by editing this value, then running helm uninstall + helm install.
    mode: single
    # The database every service connects to (ARANGO_DB). `_system` is
    # ArangoDB's own database and always exists, which is why the chart
    # defaults to it; a dedicated database would have to be created and,
    # for an existing deployment, migrated collection by collection.
    # Compose uses `genie-ai` (docker-compose.yaml) — an intentional
    # divergence, declared in scripts/config-parity-allowlist.json.
    database: _system
    storageSize: 50Gi
    agentsStorageSize: 2Gi             # cluster-mode Agency volume — config state (MBs), not document data
  keycloak:
    # Gates the Keycloak CR. The operator itself is a cluster
    # bootstrap prerequisite — NOT a chart dependency.
    enabled: true
    instances: 1                      # 2 on prod via clusterProfile
    # Operator contact email for the genie-admin realm user — deployment
    # data, supplied per environment. No chart default: the render fails
    # loudly when it is missing.
    adminEmail: ""
    # Realm and client identifiers the convergence Job exports for the
    # realm file's $(env:VAR) placeholders. These must match the
    # clientIds consumers use; changing one after install does not
    # rename the client in Keycloak.
    realm: genie
    webClientId: genie-app
    grafanaClientId: grafana
    adminUsername: genie-admin
    defaultLocale: en
    # Login/account/admin/email theme name, exported as KEYCLOAK_THEME.
    # The `genie` theme source lives at configs/keycloak/themes (the
    # same source the compose path bind-mounts since #998). The chart
    # ships it as files/keycloak-themes.tgz (regenerate with
    # `make keycloak-theme` — CI fails on drift), unpacked into
    # /opt/keycloak/themes/<theme> by an initContainer because the
    # Keycloak CR has no volume surface. MUST match the theme directory
    # at the tarball root (themes/<theme>/) — a rename here without
    # regenerating the tarball from a matching tree leaves Keycloak
    # theme-less.
    theme: genie
    # Image that unpacks the theme tarball in the Keycloak pod's
    # initContainer. Needs tar(1) with gzip + --strip-components
    # (busybox qualifies). Override for air-gapped clusters with a
    # mirrored image.
    themeUnpackImage: busybox:1.36
    # Self-registration ("Register" link on the login page). Mirrors the
    # compose default (KEYCLOAK_REGISTRATION_ENABLED:-true).
    registrationAllowed: true
    # "Forgot password?" link on the login page. Defaults to the compose
    # default (KEYCLOAK_RESET_PASSWORD:-true): a deployment that has a mail
    # server gets the feature, and one that has none says so explicitly by
    # setting this false. The render FAILS when it is true without
    # data.keycloak.smtp — a sentinelled smtpServer would swallow the mail
    # and leave the user staring at a reset form that never answers.
    resetPasswordAllowed: true
    # Four realm knobs the convergence Job always exports. Defaults are
    # the Swarm export's effective values: brute force protection, login
    # by email and i18n on, duplicate emails off.
    bruteForceProtected: true
    loginWithEmailAllowed: true
    internationalizationEnabled: true
    duplicateEmailsAllowed: false
    # Email verification on new accounts. Same SMTP dependency as
    # resetPasswordAllowed, same default as compose
    # (KEYCLOAK_VERIFY_EMAIL:-true). `smtp` being null in the values is a
    # value like any other, not a statement that a deployment has no mail
    # server: an environment that genuinely sends no mail turns this off on
    # purpose, in its overlay, where the choice is visible.
    verifyEmail: true
    # Realm password policy — defaults to the Swarm export value
    # (public-sector baseline). Non-empty on purpose: an empty value
    # would be dropped from the convergence Job's env (K8s omitempty),
    # and kcc fails the import on the missing variable. Any
    # GENIE_ADMIN_PASSWORD must satisfy the policy or the realm import
    # rejects the credential.
    passwordPolicy: length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)
    # Login-page locales; empty = default 9-locale list.
    supportedLocales: []
    # Access-token TTL in seconds.
    accessTokenLifespan: 300
    # Confidential-client secrets. These values are read ONLY by the
    # render-time guard below: the chart renders no secret, and kcc
    # receives the real values through `convergence.envSecrets` rows that
    # reference operator-provided Secrets via `valueFrom.secretKeyRef`.
    # Keeping them here is what lets the render fail loudly when a client
    # secret is still a placeholder, instead of creating an OIDC client
    # whose secret no consumer in the cluster holds.
    # These values are NOT what reaches Keycloak. Setting them satisfies
    # the guard below; the actual secrets are the `envSecrets` rows.
    clientSecrets:
      proxyClient: change-me-proxy-client
      dataprep: change-me-dataprep-client
      grafana: change-me-grafana-client
    # Fail the render when any clientSecrets value is still a change-me
    # placeholder. Default is TRUE so a default install with
    # `change-me-*` client secrets now FAILS the render; opt back to
    # false where the placeholder is acceptable — that is CI's
    # `chart:lint` render (it supplies no envSecrets rows) and dev/kind.
    failOnPlaceholderSecrets: true
    # SMTP for email verification and password reset. `smtp: null` is a
    # value like any other, not a statement that the deployment has no
    # mail server: the realm's smtpServer block always renders (the kcc
    # substitution of `$(env:EMAIL_*)` is unconditional), and with no
    # server declared it carries sentinel values that dial nothing. A
    # deployment that sends no mail turns verifyEmail and
    # resetPasswordAllowed off on purpose, in its overlay, where the
    # choice is visible. A deployment that does send mail names its
    # server here. The render FAILS when either flag is true and this is
    # null — a sentinelled smtpServer would swallow the mail and leave
    # the user staring at a form that never answers.
    smtp: null
    mobileClientId: genie-mobile          # Flutter OIDC client (public, PKCE)
    mobileRedirectScheme: genieai         # <scheme>://callback redirect
    # ── Keycloak 26 v2beta1 connection + behavior knobs ──
    # CNPG Cluster name (its Read-Write Service is "<cnpgServiceName>-rw").
    # The chart names the CNPG Cluster after it and points the Keycloak CR
    # at "<cnpgServiceName>-rw.<namespace>.svc.cluster.local" — one knob,
    # one name, so the two cannot drift.
    cnpgServiceName: keycloak-db
    # Database connection secret (the chart does NOT materialize it — operator
    # wires it from their secret backend; the secret MUST carry both
    # `username` and `password` keys for CNPG to bootstrap).
    db:
      secretName: keycloak-db-credentials
      vendor: postgres
      port: 5432
      database: keycloak
    # HTTP listener (TLS terminates at Envoy Gateway, not here).
    # Context path Keycloak serves under (the operator CR's
    # http-relative-path). Single source: the internal/public URL helpers
    # and the HTTPRoute /auth rules all derive from it.
    httpRelativePath: /auth
    http:
      httpEnabled: true
    # Hostname strict mode: false for lab/staging (Envoy rewrites the public
    # hostname via proxy headers); true in prod via spec.hostname.hostname.
    hostname:
      strict: false
    # Trust X-Forwarded-* from Envoy Gateway. KC_PROXY=edge env was removed
    # in KC 24+; spec.proxy.headers is the only path.
    proxy:
      headers: xforwarded
    # Keycloak start mode. The stock quay.io/keycloak image has no
    # pre-built server: `start --optimized` aborts on first boot
    # ("use 'kc.sh build' first"). Pre-built custom images set true.
    startOptimized: false
    # Image-bump requires single-replica mode (DB migrations need exclusive
    # access). Chart's instances=1 by default; prod bumps to 2 + manual drain.
    update:
      strategy: RecreateOnImageChange
    # ── Realm convergence (keycloak-config-cli) ──
    # The realm is created and then converged on every release by a Helm
    # post-install/post-upgrade/post-rollback hook Job. This chart renders
    # no realm-import CR — keycloak-config-cli is the realm's only owner.
    convergence:
      enabled: true
      # kcc waits for Keycloak itself via KEYCLOAK_AVAILABILITYCHECK_*,
      # so retries here cover genuine failures, not startup.
      backoffLimit: 2
      # Secret-backed realm parameters. One row per `$(env:VAR)` in
      # files/genie-realm.yaml whose value is a secret. The chart wires
      # `valueFrom.secretKeyRef`; it never renders the value.
      #
      # The five the realm actually needs — worked mapping:
      #   clientSecrets.proxyClient -> KC_PROXY_CLIENT_SECRET
      #   clientSecrets.dataprep    -> KC_DATAPREP_CLIENT_SECRET
      #   clientSecrets.grafana     -> KC_GRAFANA_CLIENT_SECRET
      #   (admin)                   -> GENIE_ADMIN_PASSWORD
      #   (mail)                    -> EMAIL_PASSWORD
      envSecrets: []
    # Name of the operator-provided Secret holding `username` +
    # `password` for the master-realm administrator the Keycloak
    # operator creates. The convergence Job authenticates with it.
    # The chart references the Secret by name; it never reads it.
    # Upstream ignores this stanza when a master realm already exists.
    bootstrapAdmin:
      userSecret: keycloak-admin-credentials

# service ↔ data dependency graph (used by pre-install hook).
# Read by the dependency-check hook Job; values are intentionally declarative
# to keep the static analysis simple (no chart-template evaluation at
# Job runtime).
#
# Each key maps a component to the list of components it requires. The Job
# fails the install if a service is enabled but any of its listed targets
# is not.
dependencyGraph:
  # Edges are unconditional: a node's deps are checked whenever the node is
  # on. A dependency that only exists in some profiles (the backend reaching
  # chatqna, which only exists with the OPEA tier) is deliberately NOT an
  # edge — declaring it would fail the install of every API-only deployment
  # that runs with the tier off. The dangling URL such a deployment carries
  # is inherited from Compose, which has the same shape.
  services:
    backend:
      - keycloak
      - arangodb
      - redisCache
    redisCache: []
    frontend:
      - backend
      - keycloak                         # the /auth/ proxy terminates at Keycloak
    documentRepository:
      - keycloak
      - arangodb
      - clamav
    clamav: []
  data:
    postgres:
      - ""                                # no deps; lowest tier
    arangodb:
      - ""
    keycloak:
      - postgres
  # One switch renders all six orchestrators, so every node below is on
  # exactly when opea.enabled is. Edges are the in-cluster Services each
  # orchestrator dials, read off its rendered env rows.
  opea:
    chatqna:
      - documentRepository
      - backend
      - keycloak
      - retriever
      - reranker
    dataprep:
      - documentRepository
      - backend
      - keycloak
      - arangodb
      - embedding
    retriever:
      - arangodb
      - embedding
    reranker: []                          # the model endpoint is the GPU node, off-cluster
    embedding: []                         # ditto
    translation: []                       # ditto

# Stateless application tier. Each entry drives a per-service Deployment
# rendered by the corresponding template under templates/services/.
#
# Per-service entry shape:
#   enabled: master toggle for the rendered resource
#   replicas: pod count baseline; prod/staging overrides in clusterProfileReplicas
#   image.repository / image.tag: container image pulled at deploy time
#   port: the CONTAINER port. The Service always listens on 80 and
#     forwards to it; the probes read it too.
#   resources: k8s requests + limits (CPU + memory)
#   env: raw env entries appended to the rendered Deployment
#   secrets: K8s Secret refs consumed via envFrom (each entry: {name: <secret-name>};
#            the whole Secret is mounted — every key in the Secret becomes an env var)
#   pvc: optional PersistentVolumeClaim spec for stateful services
#   volumes: optional PodSpec volumes (PVC, ConfigMap, emptyDir, ...)
#   volumeMounts: optional container volumeMounts (subPath supported)
#   probes: readiness/liveness/startup probe definitions
#   podDisruptionBudget: optional PDB; null disables
services:
  backend:
    enabled: true
    replicas: 1
    image: { repository: genie-ai-backend, tag: "main" }
    # One-shot migrations Job (post-install/post-upgrade hook) that
    # creates the ArangoDB collections; same registry/tag conventions
    # as the service images.
    migrationsImage: { repository: genie-ai-db-migrations, tag: "main" }
    # Remote translation API (OpenAI-compatible vLLM). endpoint empty is
    # NOT automatically the CPU model: with the OPEA tier on, the
    # endpoint derives from opea.gpu (the nodeHost in external mode, the
    # in-cluster model Service in in-cluster mode) exactly the way the
    # orchestrators' endpoints do — and a named API, derived or explicit,
    # is mandatory: the backend waits for it at startup and refuses to
    # come up without it. The CPU model translates only when NO endpoint
    # exists at all — opea disabled AND this empty. Set it to target a
    # GPU node's translation API directly, independent of the OPEA tier.
    translation:
      endpoint: ""
      modelId: ""
      # Stream the target-language chat translation during generation
      # (issue #829) instead of an English-only stream. The frontend
      # translates only the right-sidebar content client-side; chat
      # answers are translated exclusively by this backend flag, so
      # with it off the streamed answer stays English for non-English
      # UI languages. Defaults ON.
      streamingEnabled: true
      # Which backend translates the answer.
      #
      # The application decides this on the endpoint, not on this knob: a
      # deployment that NAMED a translation API always uses it, whatever
      # this is set to, and the backend refuses to start when that API
      # does not answer — it will not translate with a model the
      # deployment did not ask for. So this value is only consulted when
      # no endpoint is configured, where the in-process CPU model
      # (Xenova/nllb-200-distilled-600M, ~6 Gi at ONNX load) is the
      # only outcome.
      #
      # `cpu` is therefore refused at render time when an endpoint IS
      # configured: the application would ignore it and use the GPU
      # anyway, and a chart that advertised the CPU model while the
      # deployment used the GPU is exactly the silent mismatch this
      # knob must not create.
      backend: gpu
      # Budget for the startup probe of the configured translation API.
      # Failing it stops the backend — the API is mandatory once named —
      # so it has to cover a cold TLS handshake to a remote GPU node
      # that is busy serving another workload.
      probeTimeoutSeconds: 30
    # OPEA chat pipeline host (chatqna service). Empty = the code's
    # image default — set it to the chatqna Service when the OPEA
    # chart (in-cluster Service name).
    opeaHost: ""
    port: 3000
    # Image USER is `node` (uid 1000). PSA `restricted` requires
    # runAsNonRoot: true and the namespace PSA accepts non-root UIDs.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
    # The backend loads the Xenova nllb-200-distilled-600M translation
    # model in-process (CPU worker) when the GPU translation endpoint
    # is unreachable — 4 threads, 5 batches. The ONNX load (weights +
    # arena + per-thread copies) peaks ABOVE 8 Gi: measured on the
    # laptop, an 8 Gi limit ended in OOMKill (exit 137) mid-load, and
    # on a node whose own memory is close to the limit, that OOM
    # reached the node and took the control plane down with it. A
    # limit below the peak turns a degraded translation into a
    # crash-looping backend. The compose path imposes no limit at all,
    # so this one is a chart-only constraint.
    resources: { requests: { cpu: 100m, memory: 1Gi }, limits: { cpu: 1, memory: 12Gi } }
    # Environment rows the chart adds to the backend, beyond the ones its
    # templates derive. Docker Compose sets the same variables on the
    # `backend` service, and the two must stay in step: the parity gate
    # (scripts/config-parity-check.py) fails the build when Compose names
    # a variable the chart does not, or when the two disagree on a value
    # that is not a Kubernetes address. Keep the values here identical to
    # the Compose defaults.
    #
    # A MAP, not a list: Helm merges maps key by key, so an overlay that
    # sets one variable keeps every default declared here beside it. A
    # list would be replaced wholesale and one overlay value would
    # silently drop the rest.
    env:
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: backend
      # Which retrieval context the chat assembles.
      CONTEXT_OPTION: conversation-with-context-labels
      # The service account the admin API proxy authenticates as.
      KEYCLOAK_PROXY_CLIENT_ID: genie-proxy-client
      # Multi-realm authentication: a JSON array of secondary realm
      # descriptors the backend also trusts. Unset = the primary realm
      # only (the same empty-array default Compose leaves it at).
      #   KEYCLOAK_ADDITIONAL_REALMS: '[{"issuer":"...","clientId":"..."}]'
      # TLS verification towards the model endpoints. 1 = verify (the
      # default here and in Compose); a deployment whose GPU node serves
      # a self-signed certificate sets 0, exactly as Compose does.
      NODE_TLS_REJECT_UNAUTHORIZED: "1"
      # VictoriaLogs tenancy and query budget for the admin log views.
      VICTORIALOGS_TENANT_ID: "0:0"
      VL_QUERY_TIMEOUT_MS: "30000"
    secrets:
      # KEYCLOAK_PROXY_CLIENT_SECRET for the genie-proxy-client service
      # account (the realm's admin-API proxy). The value reaches the
      # convergence Job through `convergence.envSecrets` — point
      # `envSecrets[].secretName` at this Secret and the chart never reads
      # it. The matching `data.keycloak.clientSecrets.proxyClient` is what
      # the render-time placeholder guard checks, not what is sent.
      - name: keycloak-proxy-client-secret
      - name: huggingface-hub-token
      - name: email-password
      - name: translation-cache-password
      # ARANGO_PASSWORD is wired explicitly via secretKeyRef in
      # templates/services/backend.yaml; listing arango-root-secret here
      # would envFrom-mount the whole Secret and duplicate the var.
    pvc: null
    probes:
      readiness: { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
      liveness:  { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
      startup:   { httpGet: { path: /api/health, port: http }, initialDelaySeconds: 5, failureThreshold: 12 }
    podDisruptionBudget: { minAvailable: 1 }

  frontend:
    enabled: true
    replicas: 1
    image: { repository: genie-ai-frontend, tag: "main" }
    port: 8090
    # Image USER is root (uid 0). The entrypoint writes
    # /app/dist/runtime/config.js at startup (the runtime writer moved
    # out of /app/dist/config, which is a mount point for
    # operator-editable theme assets) — /app/dist is owned by root in
    # the image, so the pod must run as root or the write fails with
    # EACCES. The theme assets themselves are baked into the image; a
    # ConfigMap mounted at /app/dist/config overrides them at runtime.
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      allowPrivilegeEscalation: false
      # Drop only the cap that grants raw-socket access. We KEEP
      # CAP_CHOWN, CAP_FOWNER, CAP_DAC_OVERRIDE, CAP_SETUID,
      # CAP_SETGID: the entrypoint runs chown at startup, which
      # needs CAP_CHOWN. Dropping ALL also drops CHOWN and the
      # chown fails with EPERM even when running as root — every
      # previous 0.1.x install hit this with the same `Operation
      # not permitted` chown error in the pod's stderr.
      capabilities:
        drop: ["NET_RAW"]
    # The genie-ai-frontend image embeds nginx (it serves the SPA +
    # the rendered config.js). Same writable paths as the standalone
    # nginx image: the entrypoint chowns /var/cache/nginx to uid 101
    # and writes temp files to /tmp + /var/run. Without these emptyDir
    # mounts the chown fails with 'Operation not permitted'.
    volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
    volumeMounts:
      - name: nginx-cache
        mountPath: /var/cache/nginx
      - name: nginx-run
        mountPath: /var/run
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
    # Extra origins for the SPA's Content-Security-Policy connect-src
    # (beyond 'self', the public origin and the Keycloak internal URL the
    # template derives). Empty = the derived set only. Rendered as
    # VUE_APP_CSP_CONNECT_SRC into the runtime config.js.
    cspConnectSrc: ""
    # Empty by default: the entrypoint injects every VUE_APP_* row into
    # /app/dist/runtime/config.js (window.APP_CONFIG) at startup, and the
    # code defaults cover the knobs Compose leaves empty. The one the
    # operator is most likely to tune —
    #   VUE_APP_STREAM_IDLE_TIMEOUT_MS
    # the chat-stream idle watch (the SPA aborts the stream when no frame
    # arrives for this long and reports the timeout). Default 300000 (5
    # min); it must outlast the backend's LLM budget (180 s) plus
    # retrieval, or a slow-but-healthy answer is abandoned client-side.
    #   env:
    #     VUE_APP_STREAM_IDLE_TIMEOUT_MS: "600000"
    # (a bare "" is the default; the SPA falls back to 300000 on any
    # non-numeric value.)
    #   VUE_APP_AVAILABLE_LOCALES — comma-separated whitelist of active
    #     UI locales (e.g. "en,es,fr"); unset/empty = every locale the
    #     build ships. The Keycloak login-page side of the same knob is
    #     data.keycloak.supportedLocales.
    env: {}
    secrets: []
    pvc: null
    probes:
      readiness: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
      liveness:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
    podDisruptionBudget: null

  documentRepository:
    enabled: true
    replicas: 1
    image: { repository: genie-ai-document-repository, tag: "main" }
    port: 3001
    # The image has no USER directive, so the default would be root.
    # Pin to uid 1000 (matches backend's node user) so the PVC mounts
    # at /app/uploads and /app/data (kubelet-created dirs at
    # root:root 0755) are writable by the application.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
    # fsGroup: 1000 — without this, the kubelet creates the PVC
    # mountpoint at /app/uploads as root:root 0755 and uid 1000
    # cannot write there. fsGroup makes kubelet chown the mount
    # to 1000:1000 on first attach. The image USER being root
    # makes the kubelet default 0755 ownership; only fsGroup
    # overrides it.
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    # ClamAV service discovery. Defaults assume the in-cluster
    # Service rendered by charts/genieai-umbrella/templates/services/clamav.yaml;
    # operators with an external ClamAV (separate namespace, dedicated
    # cluster) override `clamavHost` with the FQDN/hostname the
    # documentRepository pod can resolve (e.g. clamav.corp.example.com
    # or clamav.<other-namespace>.svc.cluster.local).
    clamavHost: clamav
    clamavPort: 3310
    # Toggles the doc-repo virus-scan step (CLAMSCAN_* wiring above).
    virusScanning: true
    # Web-crawler egress (POST /api/files/crawl/schedule fetches
    # arbitrary user-supplied URLs + redirect hops). NetworkPolicy peers
    # cannot express a domain, so the rule is port-scoped over 80/443:
    # pin resolved CIDRs here (dig +short <site> against the operators'
    # authoritative resolver) to restrict it, or leave empty for the
    # compose-equivalent open egress on the HTTP(S) ports.
    crawlAllowedCIDRs: []
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 1Gi } }
    # Environment rows the chart adds to the document-repository, beyond
    # the ones its template derives. Docker Compose sets the same
    # variables on the `document-repository` service; the parity gate
    # (scripts/config-parity-check.py) keeps the two in step. A MAP, not a
    # list: Helm merges maps key by key, so an overlay that sets one
    # variable keeps every default declared here beside it.
    env:
      # The client the service validates the browser's token against.
      KC_CLIENT_ID: genie-app
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: document-repository
      # TLS verification towards the model endpoints. 1 = verify (the
      # default here and in Compose); a deployment whose GPU node serves
      # a self-signed certificate sets 0, exactly as Compose does.
      NODE_TLS_REJECT_UNAUTHORIZED: "1"
      # VictoriaLogs tenancy and query budget for the admin log views.
      VICTORIALOGS_TENANT_ID: "0:0"
      VL_QUERY_TIMEOUT_MS: "30000"
    secrets: []
    pvc:
      enabled: true                     # rendered as PVC by the doc-repo template
      storageSize: 20Gi
    volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: document-repository-uploads
    volumeMounts:
      - name: uploads
        mountPath: /app/uploads
    # The image's CMD is `bash /app/clamav-node.sh` which starts a
    # local clamd in the container, runs freshclam (150-200 MB
    # signature download on cold cache), and waits for the local
    # clamd to be reachable before exec'ing the Node server. The
    # Node app, however, never uses the local clamd: it connects to
    # the cluster clamav Service at CLAMAV_HOST=clamav:3310 — the
    # local clamd is a dead-weight entrypoint gate. Override the
    # command to launch the Node server directly, skipping the
    # freshclam download, the local clamd spawn, and the
    # `clamdscan --version` polling that made the script appear to
    # work in 0.1.15-0.1.16 despite the local clamav being broken.
    # K8s `command:` replaces the image ENTRYPOINT, so the
    # docker-entrypoint.sh wrapper is bypassed entirely.
    command: ["node"]
    args: ["src/server.js"]
    probes:
      readiness: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
      liveness:  { tcpSocket: { port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
    podDisruptionBudget: null

  clamav:
    cache:
      enabled: true
      size: 2Gi
    enabled: true
    replicas: 1
    # Tag: `stable-debian`. The chart
    # used `1.3` historically, but Docker Hub's clamav/clamav 1.x line
    # only ships `1.4+`; the operator logs `manifest unknown` and the
    # pod stays in ImagePullBackOff. `stable-debian` is a moving tag
    # — re-pin to a digest before any production rollout.
    image: { repository: clamav/clamav, tag: "stable-debian" }
    port: 3310
    # securityContext / volumes / volumeMounts / PVC are NOT values
    # here: templates/services/clamav.yaml is a hand-written Deployment
    # that owns them (uid 1000 rationale, /run/clamav tmpfs, signature
    # cache). Edit the template, not this block.
    resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: 1, memory: 1Gi } }
    env: []
    probes:
      readiness: { tcpSocket: { port: 3310 }, initialDelaySeconds: 60, periodSeconds: 30 }
      liveness:  { tcpSocket: { port: 3310 }, initialDelaySeconds: 120, periodSeconds: 60, failureThreshold: 5 }
    podDisruptionBudget: null
    # Egress to the ClamAV signature-distribution network on 80/443.
    # `database.clamav.net` is a CNAME-to-A round-robin and the IP set
    # shifts; pin resolved IPs in this list (run `dig +short
    # database.clamav.net` against the operators' authoritative resolver
    # and replace quarterly). Empty = fall back to the network-policy
    # wildcard `0.0.0.0/0`, which permits every IPv4 destination on the
    # CVD ports — only acceptable for dev clusters or when running
    # behind a private ClamAV mirror.
    cvdAllowedCIDRs: []

  redisCache:
    enabled: true
    replicas: 1
    image: { repository: redis, tag: "7-alpine" }
    port: 6379
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 250m, memory: 512Mi } }
    pvc:
      enabled: true                          # appendonly persistence
      storageSize: 5Gi
    podDisruptionBudget: null

# OPEA AI/ML tier. Disabled by default; enabling renders the six
# OPEA services (chatqna, retriever, dataprep, reranker, embedding,
# translation). The per-service templates carry the defaults for
# chart-specific tuning (RERANKING_*, RETRIEVER_*, CHATQNA_*, etc.).
opea:
  enabled: false
  gpu:
    # external: model endpoints live on a remote GPU node (nodeHost + paths).
    # in-cluster: vLLM/TEI Deployments are rendered by this chart and the
    # endpoint URLs point at the in-cluster Service names instead.
    mode: external
    # e.g. https://10.0.0.110:444 — empty disables endpoint rendering
    # (callers receive an empty string and gate accordingly).
    nodeHost: ""
    # Disables TLS verification towards the model endpoints
    # (OPEA_SSL_SKIP_VERIFY=1 on the six orchestrators). Default false,
    # which is what Compose does, and it is NOT inferred from `nodeHost`:
    # an https:// endpoint says nothing about whether its certificate is
    # trusted, and turning verification off is not a decision a chart
    # should make on the operator's behalf. Set it when the GPU node
    # serves a certificate the trust store does not carry.
    skipTlsVerify: false
    # Egress CIDRs the orchestrators may reach the GPU node on. A
    # NetworkPolicy cannot express a hostname, so a nodeHost that is a DNS
    # name needs one here; an IPv4 literal becomes its own /32 and needs
    # nothing. Empty with a DNS name falls back to 0.0.0.0/0 on the port
    # from the URL — the same approximation the crawler tier documents.
    allowedCIDRs: []
    paths:
      llm: /llm
      embedding: /embed
      reranker: /rerank
      translation: /translation
      docling: /docling
  chatqna:
    # CHATQNA_*, RERANKING_*, MULTI_TURN_*, prompts — defaults in templates
    #
    # Boolean realm-adjacent knobs the template exports as env strings.
    # Declared (not left implicit) so the values-schema bools gate types
    # them like every other boolean leaf.
    chatqnaEnforceAbstention: true
    retrieverArangoTraversalEnabled: true
    # `env` carries the variables the chart must configure the way Compose
    # configures them. The parity gate (scripts/config-parity-check.py)
    # keeps the two in step. A MAP, not a list: Helm merges maps key by
    # key, so an overlay that sets one variable keeps every default
    # declared here beside it.
    env:
      # Path the embedding endpoint is called on.
      EMBEDDING_SERVER_ENDPOINT: /v1/embeddings
      # Model-endpoint HTTP budgets, resolved by the shared policy module
      # (genie-ai-overlay/core/model_http_policy.py).
      MODEL_CONNECT_TIMEOUT_SECONDS: "30"
      MODEL_CONTROL_PLANE_TIMEOUT_SECONDS: "30"
      MODEL_PROBE_TIMEOUT_SECONDS: "10"
      # Multi-turn rewrite: `blend` mixes the history into the query,
      # `condense` rewrites the history into a standalone query.
      MULTI_TURN_MODE: blend
      MULTI_TURN_CONDENSE_HISTORY_TURNS: "8"
      MULTI_TURN_CONDENSE_MAX_TOKENS: "256"
      MULTI_TURN_CONDENSE_TIMEOUT_SECONDS: "5.0"
      # Override knobs the chart leaves unset on purpose (the code
      # defaults cover them; Compose leaves them empty too):
      #   MAX_MODEL_LEN_TEXTGEN / MAX_TRANSLATION_CHARS — hard model
      #     context caps; 0/unset = the vLLM-served model's own limit.
      #     Set them only when a shared GPU model is loaded with a
      #     SMALLER max len than the requests this service builds.
      #   MULTI_TURN_CONDENSE_SYSTEM_PROMPT — replaces the built-in
      #     condense-rewrite prompt (must still demand JSON-only output).
      #   OPENAI_API_KEY — the GPU node key; the chart delivers it as
      #     VLLM_API_KEY from the vllm-api-key Secret, which the code
      #     accepts on the same paths.
  retriever:
    # RETRIEVER_* tuning — defaults in templates
    #
    # Boolean knobs the template exports as env strings (typed by the
    # bools gate — see the chatqna note).
    retrieverArangoTraversalEnabled: true
    retrieverHybridRetrievalEnabled: true
    # `env` carries the variables the chart must configure the way Compose
    # configures them (see the parity gate).
    env:
      MODEL_EMBEDDING_TIMEOUT_SECONDS: "600"
      MODEL_LLM_MAX_RETRIES: "2"
      MODEL_LLM_TIMEOUT_SECONDS: "180"
      MODEL_PROBE_TIMEOUT_SECONDS: "10"
      MODEL_SUMMARIZER_TIMEOUT_SECONDS: "600"
  dataprep:
    # chunking / labeling / contextual retrieval — defaults in templates
    #
    # Boolean knobs the template exports as env strings (typed by the
    # bools gate — see the chatqna note).
    contextualRetrievalEnabled: true
    contextualLabelRaw: true
    # `env` carries the variables the chart must configure the way Compose
    # configures them (see the parity gate).
    env:
      # Ceiling for the LLM phase. The label batches and the contextual
      # retrieval calls run inside it, so raising the per-call budgets
      # without raising this one makes dataprep warn at startup.
      DATAPREP_LLM_PHASE_TIMEOUT_SECONDS: "900"
      # How often the phase reports its progress.
      DATAPREP_LLM_PROGRESS_INTERVAL_SECONDS: "60"
      # Model-endpoint HTTP budgets, resolved by the shared policy module.
      MODEL_AUTH_TIMEOUT_SECONDS: "300"
      MODEL_CONNECT_TIMEOUT_SECONDS: "30"
      MODEL_CONTROL_PLANE_TIMEOUT_SECONDS: "30"
      MODEL_LLM_MAX_RETRIES: "2"
      MODEL_LLM_TIMEOUT_SECONDS: "180"
      MODEL_PROBE_TIMEOUT_SECONDS: "10"
  reranker:
    # Adaptive-utility tuning knobs read at reranker startup; only used
    # when RERANKING_STRATEGY=adaptive. Rendered as the
    # NOVELTY_SIGMOID_*/CONTEXT_DECAY_FACTOR/MIN_VALUE_THRESHOLD env rows
    # in templates/opea/reranker.yaml.
    noveltySigmoidA: "20.0"
    noveltySigmoidB: "0.25"
    contextDecayFactor: "0.0025"
    minValueThreshold: "-1.0"
    logLevel: info
    # `env` carries the variables the chart must configure the way Compose
    # configures them (see the parity gate).
    env:
      MODEL_CONNECT_TIMEOUT_SECONDS: "30"
      MODEL_RERANK_TIMEOUT_SECONDS: "300"
      # The component name the reranker reports in its spans.
      RERANK_COMPONENT_NAME: GENIE_TEI_RERANKING
  embedding:
    modelId: BAAI/bge-large-en-v1.5
  translation:
    modelId: google/gemma-3-4b-it
  models:
    # in-cluster mode only.
    llm:
      modelId: ibm-granite/granite-4.1-8b
    reranker:
      # TEI reranker model. The embedding model reads from
      # opea.embedding.modelId; the LLM from opea.models.llm.modelId;
      # only the reranker model needed a new key.
      modelId: BAAI/bge-reranker-v2-m3
    # Shared model-weights cache mounted by all four model Deployments.
    # HF weights are 4-16 GB per model; without a persistent cache every
    # pod restart re-downloads them. ReadWriteOnce — assumes all model
    # pods on the single gpu=true node; multi-GPU clusters need RWX or
    # per-model claims.
    cache:
      enabled: true
      storageClassName: ""
      size: 100Gi
    # resources for ALL FOUR model Deployments (llm, reranker, embedding,
    # translation) — one shared dict, NOT per-model. Empty = no explicit
    # requests/limits (the pods share one GPU via utilization args; see
    # the model-deployment template note).
    resources: {}

# clusterProfile-driven replica overrides. prod runs multiple replicas per
# stateless service for zero-downtime rolling updates; staging runs a
# reduced subset. dev has no entry — every service falls back to its own
# `services.<name>.replicas` (default 1).
clusterProfileReplicas:
  prod:
    backend: 3
    frontend: 2
    documentRepository: 2
  staging:
    backend: 2
    frontend: 2
    documentRepository: 1
