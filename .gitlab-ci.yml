        - "mobile/genie_ai_mobile/android/app/build.gradle"
        - "mobile/genie_ai_mobile/ios/Flutter/*-*.xcconfig"
        - "env"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# --- Docs/Deploy validation ---

# Validates Ansible playbooks (syntax) and YAML linting for deployment docs.
# Covers MRs that only modify deploy/ansible/, docs/, or root-level files
# where no component lint/test job would otherwise trigger.
docs:validate:
  image: python:3.11-slim
  stage: lint
  before_script:
    - pip install ansible-core yamllint
    - ansible-galaxy collection install -r deploy/ansible/requirements.yml
  script:
    - ansible-playbook --syntax-check deploy/ansible/deploy.yml
    - ansible-playbook --syntax-check deploy/ansible/deploy-gpu.yml
    - yamllint -c deploy/ansible/.yamllint deploy/ansible/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "deploy/**/*"
        - "docs/**/*"
        - "CLAUDE.md"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# --- Test jobs ---

test:backend:
  extends: .test_node
  # sharp's install downloads libvips + its native binary from GitHub release
  # assets, which are unreachable from the CI runner container (connection
  # resets with "socket hang up"). Mirror both to npmmirror (verified reachable
  # from the runner). CI-only: local devs keep the default hosts.
  variables:
    npm_config_sharp_libvips_binary_host: "https://npmmirror.com/mirrors/sharp-libvips"
    npm_config_sharp_binary_host: "https://npmmirror.com/mirrors/sharp"
  before_script:
    # shared/lib must install too — backend requires shared/lib/victorialogs-transport
    # which requires winston-transport. Without shared/lib/node_modules, the test
    # fails with "Cannot find module 'winston-transport'". Add shared/lib first so
    # its node_modules is in the require-resolution path.
    - cd components/shared/lib && npm ci
    # After cd into shared/lib, `cd components/gov-chat-backend` would resolve
    # to `components/shared/lib/components/gov-chat-backend` (does not exist).
    # Pop back to the worktree root first, then descend into gov-chat-backend.
    - cd - && cd components/gov-chat-backend && npm ci
  script:
    # --maxWorkers=2 caps concurrent jest workers: the runner cgroup OOMs
