---
# no-root-data-migration (#1227) — shared by the manager play and the
# swarm_workers play in deploy.yml via import_tasks. One doctrine, two
# placements: the tasks below create the backend backup directory as the
# backend uid (1000) and hand every mis-owned file inside it to that uid
# — TARGETED, never wholesale, and never destructive.
#
# Scope note: the legacy data/logs tree is deliberately NOT handled here
# — nothing has mounted it since #1227 (every service logs to stdout),
# the runtime gate prunes it from its sweep (not a bind source), and it
# can be removed at will.
# data_dir / deploy_dir come from group_vars; both plays run these with
# the same variable surface. NOTE on privilege surfaces: every task here
# escalates to root — an unprivileged find exits nonzero on a 0700
# uid-1000 subdir (EACCES the chown cannot fix, which would churn the
# handover 'changed' forever), and a foreign-uid chown is EPERM for the
# play's unprivileged ansible_user. There is no unprivileged surface left
# in this file by design.

# The effective data directory is data_dir_resolved (group_vars/all.yml —
# the ONE join/normalize formula; env.j2 ships an absolute override
# VERBATIM, so the stack's bind sources live at <resolved>/database_backups).
# A `~`-rooted inventory override is NOT supported: the three contexts
# involved cannot agree on what ~ means — the file module below expands it
# as the become user (root → /root), the command-module find probes never
# expand it at all, and compose would expand it as the invoking
# ansible_user. Spell the override absolute.

- name: Create the backend backup directory as the backend uid (#1227)
  # Pinned to the backend uid AT CREATION: a fresh dir left
  # ansible_user-owned would never pass the handover probe below, and
  # the uid-1000 backend would get EACCES on its own dumps. Escalate to
  # root — a foreign-uid chown (or a dir pre-existing root-owned from a
  # bare-docker root-era install) is EPERM for the play's unprivileged
  # ansible_user.
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ data_dir_resolved }}/database_backups"
    state: directory
    mode: '0755'
    owner: "1000"
    group: "1000"

- name: Hand the backup directory to the backend uid (#1227)
  # The probe matches EVERY uid != 1000, not just root: the manager play's
  # payload-ownership pass (tasks/payload-ownership-pass.yml) re-labels the
  # deploy payload around this import, so a uid-0-only probe would never
  # fire on the manager path (dead code by pre-emption). This directory is
  # the backend's dump target — the backend (uid 1000) must own every file
  # in it, and anything else is either root-era or mis-owned. (The deploy
  # recursions exclude data/ entirely, so on converged deployments this
  # probe is empty and the handover skips — the tasks converge instead of
  # churning every deploy.)
  # The probe/heal/warn skeleton itself lives ONCE in
  # tasks/ownership-probe-heal.yml; only the commands differ here.
  ansible.builtin.import_tasks: tasks/ownership-probe-heal.yml
  vars:
    # -H: the data dir is commonly a SYMLINK (a small /opt pointing at a
    # bigger volume — check-runtime.sh documents and resolves the same
    # layout); without it find lstats the symlink inode only, the probe
    # sees nothing, and the root-era tree at the target stays invisible
    # while the runtime gate (which readlink -f's the path) keeps failing
    # red with no playbook rerun able to green it. Symlinks INSIDE the
    # tree are still not followed (-H follows only the starting path).
    _trio_probe_cmd: >-
      find -H "{{ data_dir_resolved }}/database_backups" ! -uid 1000 -print -quit
    _trio_heal_cmd: >-
      find -H "{{ data_dir_resolved }}/database_backups" ! -uid 1000
      -exec chown -h 1000:1000 {} +
    _trio_label: backup-dir handover
