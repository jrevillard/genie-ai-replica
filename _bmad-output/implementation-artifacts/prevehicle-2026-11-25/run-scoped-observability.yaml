# Source: genieai-umbrella/templates/observability/grafana-dashboards.yaml
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: victoriametrics-single-node
  namespace: genieai
  labels:
    e2170.genieai.io/run: "2170"
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: "0.2.184"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: "dashboards"
    genieai.io/component: "dashboards"
    genieai.io/managed-by: helm
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  folderRef: genieai-observability
  allowCrossNamespaceImport: true
  # resyncPeriod, not resyncInterval: the GrafanaDashboard CRD has
  # no `resyncInterval`, and grafana-operator decodes strictly —
  # one unknown field rejects every dashboard.
  resyncPeriod: 30s
  datasources:
    - datasourceName: victoriametrics
      inputName: DS_VICTORIAMETRICS
