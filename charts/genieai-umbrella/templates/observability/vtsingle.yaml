{{- $obs := .Values.observability | default dict -}}
{{- $pluggable := .Values.pluggable | default dict -}}
{{- $obsTraces := $obs.traces | default dict -}}
{{- if $obsTraces.enabled }}
{{- /*
  VTSingle CR — single-node VictoriaTraces.
  apiVersion: vmoperator v0.75.0 places VTSingle under
  operator.victoriametrics.com/v1 (the same group as VLSingle). Earlier
  releases exposed it under a separate victoriametrics.com/v1beta1
  group that is no longer served by the current CRD. Validation
  deferred to first reconcile — the operator is not installed locally.

  The operator creates the in-cluster Service <kind>-<metadata.name>
  ("vtsingle-vtraces"). VictoriaTraces runs single-port
  (-httpListenAddr=:10428): the Jaeger query API AND OTLP ingest
  (/insert/opentelemetry/v1/...) both live on 10428 — what the
  collector gateway exports to and what Grafana's jaeger datasource
  reads. No tempo-proxy needed: the query API is native.
*/}}
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: vtraces
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "observability") | nindent 4 }}
spec:
  retentionPeriod: {{ $obsTraces.retentionPeriod | quote }}
  removePvcAfterDelete: false
  storage:
    {{- /* Same chart-wide storage-class hook every PVC reads
    (pluggable.storageClassName) — a venue that points the data tier at
    a fast or tmpfs-backed StorageClass must reach the observability
    tier too. Omitted when unset: the operator then creates the PVC
    against the cluster default class. */ -}}
    {{- with ($obsTraces.storageClassName | default $pluggable.storageClassName) }}
    className: {{ . }}
    {{- end }}
    resources:
      requests:
        storage: {{ $obsTraces.storageSize | quote }}
  replicaCount: 1
{{- end }}
