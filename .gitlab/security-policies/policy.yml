# GitLab Security Orchestration Policies for GENIE.AI.
#
# Stored in the project's own security policy project
# (un/itu/genie-ai-security-policy-project), file
# .gitlab/security-policies/policy.yml in that project's default branch.
# Policies are versioned here, reviewed via MR, enforced by GitLab.
#
# GitLab validates this file against
# ee/app/validators/json_schemas/security_orchestration_policy.json.
# A single schema violation invalidates the WHOLE file: GitLab then reports
# "policy.yml file has syntax errors" and enforces NO policy at all.
#
# See docs/adr/0001-gitlab-registry-build-scan-pipeline.md for context.

---
approval_policy:
  # 1. Block merge on HIGH/CRITICAL security findings (all scanners).
  #    Enforces the advisory container_scanning/SAST/dep/secret jobs that have
  #    allow_failure:true — a HIGH/CRITICAL finding now blocks the MR (requires
  #    approval) instead of being advisory-only.
  - name: Require approval on HIGH/CRITICAL vulnerabilities
    description: |
      Blocks merge when any HIGH or CRITICAL vulnerability is found by container
      scanning, SAST, dependency scanning, or secret detection. The finding must
      be triaged (fixed or added to the relevant allowlist) before the MR can merge.
    enabled: true
    rules:
      - type: scan_finding
        branch_type: protected
        scanners:
          - container_scanning
          - sast
          - dependency_scanning
          - secret_detection
        severity_levels:
          - critical
          - high
        vulnerabilities_allowed: 0
        vulnerability_states:
          # new_needs_triage = vulnerabilities introduced by the MR that are not
          # yet present on the target branch. Pre-existing findings are ignored,
          # otherwise every MR would be blocked by the known CVE backlog.
          - new_needs_triage
    actions:
      - type: require_approval
        approvals_required: 1
        role_approvers:
          - maintainer

  # 2. DPG license compliance — deny strong copyleft + non-OSI licenses.
  #    GENIE.AI is a DPG-compliant public-sector project; strong copyleft
  #    (AGPL/GPL) can be infectious for downstream, and SSPL/BUSL are not OSI-
  #    approved. Permissive (MIT/Apache/BSD) + weak copyleft (MPL/LGPL) allowed.
  - name: DPG license compliance (deny strong copyleft + non-OSI)
    description: |
      Requires approval when a strong-copyleft (AGPL, GPL) or non-OSI license
      (SSPL, BUSL, Commons Clause) is detected in dependencies. Permissive and
      weak-copyleft licenses (MIT, Apache-2.0, BSD, ISC, MPL, LGPL) are allowed
      without approval.
    enabled: true
    rules:
      - type: license_finding
        branch_type: protected
        license_states:
          # newly_detected = a new package, or a new license for an existing
          # package, introduced by the MR.
          - newly_detected
        license_types:
          # SPDX identifiers and the matching SPDX names: GitLab documents
          # license names, but a report may carry the identifier only.
          - AGPL-1.0
          - Affero General Public License v1.0
          - AGPL-3.0
          - Affero General Public License v3.0
          - GPL-2.0
          - GNU General Public License v2.0 only
          - GPL-3.0
          - GNU General Public License v3.0 only
          - SSPL
          - Server Side Public License, v 1
          - BUSL-1.1
          - Business Source License 1.1
          - Commons-Clause
          - LicenseRef-Commons-Clause
        match_on_inclusion_license: false
    actions:
      - type: require_approval
        approvals_required: 1
        role_approvers:
          - maintainer
