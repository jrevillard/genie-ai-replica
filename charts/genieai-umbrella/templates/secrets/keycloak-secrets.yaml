{{- if and .Values.secrets.sealedSecrets.enabled .Values.data.keycloak.enabled -}}
{{- /* Keycloak-bootstrap secrets needed by the CNPG Cluster (keycloak-db-
       credentials) and the KeycloakRealmImport job (genie-admin-credentials).
       The remaining Keycloak-connected secrets (keycloakClientSecret,
       keycloakProxyClientSecret, kcDataprepClientSecret, kcGrafanaClientSecret)
       are added together with the components that consume them.

       Inside `range`, dot is the loop string — use `$` for the root context;
       plain `.Values` would read a field off the STRING and error at render. */ -}}
{{- range $secretName := list "keycloak-db-credentials" "genie-admin-credentials" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" $.Chart "Release" $.Release "Values" (deepCopy $.Values | merge (dict "component" "sealed-secret"))) | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  encryptedData:
    {{- if eq $secretName "keycloak-db-credentials" }}
    # CNPG initdb.secret requires BOTH keys. PLACEHOLDER+ sentinels (valid
    # base64 of "PLACEHOLDER+"); conftest fails release branches that ship
    # them. Re-seal with kubeseal before helm install.
    username: UExBQ0VIT0xERVIr
    password: UExBQ0VIT0xERVIr
    {{- else }}
    password: UExBQ0VIT0xERVIr
    {{- end }}
{{- end -}}
{{- end -}}
