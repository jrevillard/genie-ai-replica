apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "kong" "tier" "cpu" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.cpu.kong.replicas }}
  selector:
    matchLabels:
      {{- include "genieai.selectorLabels" (dict "name" "kong" "context" .) | nindent 6 }}
  {{- include "genieai.rollingUpdate" . | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "genieai.componentLabels" (dict "name" "kong" "tier" "cpu" "context" .) | nindent 8 }}
    spec:
      {{- include "genieai.cpuAffinity" . | nindent 6 }}
      containers:
        - name: kong
          image: {{ .Values.cpu.kong.image }}
          ports:
            - containerPort: {{ .Values.cpu.kong.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cpu-services-config
          {{- include "genieai.cpuResources" .Values.cpu.kong.resources | nindent 10 }}
          {{- include "genieai.tcpReadinessProbe" (dict "port" .Values.cpu.kong.port "settings" .Values.cpuProbes.readiness) | nindent 10 }}
          {{- include "genieai.tcpLivenessProbe" (dict "port" .Values.cpu.kong.port "settings" .Values.cpuProbes.liveness) | nindent 10 }}
