  # ============================================================
  # GPU Service Tests
  # ============================================================
  - it: vllm service should be ClusterIP on port 8000
    template: gpu/vllm-service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8000
      - equal:
          path: spec.ports[0].targetPort
          value: 8000

  - it: vllm service selector should match deployment labels
    template: gpu/vllm-service.yaml
    asserts:
      - isSubset:
          path: spec.selector
          content:
            app.kubernetes.io/name: vllm

