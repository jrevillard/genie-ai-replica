# OVERRIDES.yaml — core-layer override audit manifest (architecture pattern 1).
#
# Every intentional deviation of the GENIE.AI overlay from the vendored OPEA
# source is recorded here with a disposition, an owner, and a justification.
# Each entry must be matched by a `# OVERRIDE <module>.<name> | disposition: ...`
# comment record in the source tree (core/*.py and build-patches/*), and the
# record's disposition agrees with the manifest entry.
#
# Disposition:
#   - still-needed:        override is still required on the current OPEA version.
#   - re-graft-to-new-API: override must be re-expressed against a newer OPEA API.
#   - obsolete-remove:     override was fixed upstream and can be deleted.
#
# Schema:
#   - override:        dotted path to the overridden module/class/function
#   - disposition:     one of still-needed | re-graft-to-new-API | obsolete-remove
#   - owner:           team or project responsible (genie-ai)
#   - justification:   technical rationale — WHY this override exists (durable, not a PM reference)
#   - added_in:        OPEA version when override was first introduced (v1.3, v1.5, etc.)
#   - last_validated:  OPEA version when override was last re-confirmed necessary
#   - test:            (optional) pytest path that validates the override still works
overrides:
  - override: core.constants.ServiceType
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: TRANSLATOR service type appended at v1.5 tail slot 29 (upstream ends at 28). The slot is kept for the MegaService translation node, but no graph registers one — the chatqna alignment handler for the type was dropped with the language boundary, because it put the requested language into a translation prompt. A graph that registers a translator node has to restore that handler.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.k
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Retriever top-k parameter — upstream OPEA v1.5 ChatCompletionRequest lacks this field. GENIE adds it to pass retrieval count from chatqna → retriever.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.fetch_k
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Retriever fetch-k (pre-rerank candidate count) — upstream lacks this field. Controls how many chunks retriever pulls before reranker trims to top-k.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.lambda_mult
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Hybrid retrieval weighting (vector vs BM25) — upstream lacks this field. lambda_mult=0.0 → pure vector, 1.0 → pure BM25, 0.5 → balanced RRF fusion.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.score_threshold
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Retriever minimum similarity score filter — upstream lacks this field. Drops chunks below threshold before returning to chatqna (reduces noise).
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.max_tokens
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Pydantic v2 field mirroring — upstream OPEA v1.5 ChatCompletionRequest lacks these fields. GENIE mirrors OpenAI-compatible request schema for LLM guardrail/validation.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.n
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Number of completions to generate — upstream lacks this field. GENIE exposes OpenAI-compatible 'n' parameter for multi-sample generation.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.seed
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Reproducible generation seed — upstream lacks this field. Enables deterministic LLM output for testing and debugging.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.temperature
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Sampling temperature — upstream lacks this field. Controls LLM output randomness (0.0 = greedy, 1.0 = full sampling).
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.top_p
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Nucleus sampling threshold — upstream lacks this field. Limits token selection to cumulative probability mass (0.0-1.0).
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.best_of
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Best-of-N sampling — upstream lacks this field. Generates N completions server-side, returns best (by logprob).
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.repetition_penalty
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Repetition penalty — upstream lacks this field. Penalizes tokens already in context/output (reduces looping).
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.top_k
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Top-k sampling — upstream lacks this field. Limits token selection to k most likely tokens.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.timeout
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Request timeout — upstream lacks this field. Prevents hanging on slow LLM endpoints (seconds).
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.top_n
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Top-n filtering (reranker) — upstream lacks this field. Reranker returns top-n results after scoring.
    added_in: v1.3
    last_validated: v1.5
  - override: core.genieai_api_protocol.ChatCompletionRequest.include_contexts
    disposition: still-needed
    owner: genie-ai
    justification: Benchmark opt-in field absent upstream — okf-server's RAGAS serve mode sets it so chatqna attaches each served chunk's text to its source document in the SSE metadata event (citizen payloads never set it; responses are otherwise byte-identical).
    added_in: v1.5
    last_validated: v1.5
  - override: core.genieai_api_protocol.RequestContext.categoryLabel
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Upstream RequestContext declares categoryLabels only; Pydantic's extra='ignore' default drops the singular categoryLabel the backend sends and chatqna reads, so category-level filtering never reached the retriever.
    added_in: v1.5
    last_validated: v1.5
    test: tests/test_request_context.py
  - override: build-patches.docarray_alias_shim
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Prevents vendored comps/cores/proto/docarray.py from shadowing real PyPI docarray. Manipulates sys.path at site-init to ensure correct import resolution.
    added_in: v1.3
    last_validated: v1.5
  - override: build-patches.install_site_startup
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Site-startup hook installer — copies genie_ssl_patch.py + docarray_alias_shim.py into site-packages and wires via .pth mechanism (replaces hardcoded sitecustomize.py).
    added_in: v1.3
    last_validated: v1.5
  - override: contracts._harness.import_docarray
    disposition: re-graft-to-new-API
    owner: genie-ai
    justification: Contract test harness — dynamic docarray import with version-aware fallback. Handles docarray API changes between v1.3 and v1.5 (SearchedDoc, LLMParams).
    added_in: v1.5
    last_validated: v1.5
  - override: core.constants.MCPFuncType
    disposition: still-needed
    owner: genie-ai
    justification: MCP function type enum — not present in upstream OPEA v1.5 constants.py. GENIE adds TOOL/RESOURCE/PROMPT enums for Model Context Protocol support (agentic-enablement initiative).
    added_in: v1.5
    last_validated: v1.5
    test: tests/test_core.py::TestMCPFuncType
  - override: build-patches.unstructured_html_pi_patch
    disposition: still-needed
    owner: genie-ai
    justification: "XML processing instructions crash unstructured 0.18.32 partition_html (upstream issue #4358): parser.py:929 builds the package's only etree.HTMLParser(remove_comments=True) and the ElementNamespaceClassLookup at :933 maps custom classes for _Element subclasses only, so a PI node falls through to a class with no is_phrasing. Measured 2026-10-13 on the local stack - two concepts (438 and 231890 chars) from a PDF that teaches XML prologs silently never reached RAG. Upstream added remove_pis=True to that constructor in 0.27.8; the pin is 0.18.32 and the upgrade spans 9 minor releases across a 374-package --require-hashes lock, so we apply the single constructor argument. Patching the construction site (not the three traversal sites at :423/:628/:750) makes the module correct by construction; the patcher aborts the BUILD if the line is absent, so it can never silently ship a crashing image."
    added_in: v1.5
    last_validated: v1.5
    test: tests/test_unstructured_pi_patch.py
  - override: comps.dataprep.integrations.arangodb.llm_transformer
    disposition: still-needed
    owner: genie-ai
    justification: The vendored LLM graph-transformer and TEI embedder build their own HTTP clients, so core/model_http_policy cannot reach them. Its own ChatOpenAI budget reads VLLM_TIMEOUT, but that variable cannot be used from the environment: comps takes it verbatim from os.getenv, httpx 0.28 does not coerce a string timeout, and socket.create_connection raises TypeError instead of timing out - and _process_batch swallows that, so the phase would fail extraction silently on every document. It therefore keeps comps' own int default, and closing this entry needs a patch to the vendored source. It emits no span or progress line either, and the chatqna orchestrator graph, the embedding client and the upstream opea/embedding + opea/llm-textgen images have no configurable budget at all (2000 s and 600 s hardcoded). Tracked so the gap has a named owner; see build-patches/comps_http_budget_debt.py for the closing routes.
    added_in: v1.5
    last_validated: v1.5
    test: contracts/test_contract_http_budget.py::test_the_vendored_graph_transformer_reads_vllm_timeout
  - override: build-patches.comps_llm_stream_offloop_patch
    disposition: still-needed
    owner: genie-ai
    justification: "The vendored v1.5 orchestrator runs the streaming LLM POST synchronously on the uvicorn event loop (execute(), streaming branch: requests.post(..., stream=True, timeout=2000) with the loop thread pinned until vLLM returns first response headers - 60-90 s on a shared GPU). While pinned, uvicorn cannot read any socket, so the comps-served /health (async def) cannot answer and the HTTP liveness probe killed the pod mid-stream (exit 137, measured 2026-10-25 on the k8s dev cluster). A three-arm uvicorn repro (2026-10-30) showed /health times out under the pinned loop with an async handler AND with a threadpool handler - only moving the blocking call itself off the loop restores availability. The patch wraps the two streaming call sites in a module-level helper awaiting asyncio.to_thread(requests.post, ...): retrieval/reranking (aiohttp), the non-streaming LLM branch (aiohttp) and token generation (StreamingResponse threadpool) already leave the loop free; the two res = requests.post( sites inside the generate() generator already run off-loop and stay untouched. Residual on-loop blocks are the bounded probes (tokenize, model discovery - 10 s budget, below the liveness threshold). Disclosed trade-off: asyncio.to_thread is uncancellable, so an abandoned query's POST keeps its executor thread until the upstream 2000 s requests budget - bounded by the default executor size, never the whole loop as before, and /health stays alive throughout; the same residency reaches graceful shutdown (uvicorn joins the default executor, so a stop while a query waits on a wedged upstream stalls until the termination grace period SIGKILLs the pod - the same bound the pre-patch loop pin imposed on every restart, now limited to restarts that coincide with an in-flight query). A second recorded trade-off: the patcher is content-anchored fail-loud machinery (~200 lines with its guards) where a whole-file overlay of a vendored orchestrator copy would be smaller - the content patch was chosen over a vendored copy because a copied file silently masks upstream changes (no anchor fails when upstream moves), and the guard cost is the price of reflow tolerance; if upstream ever lands the fix, delete the whole entry. Closing this entry needs upstream comps to take the streaming POST off the loop."
    added_in: v1.5
    last_validated: v1.5
    test: tests/test_comps_llm_stream_offloop_patch.py
