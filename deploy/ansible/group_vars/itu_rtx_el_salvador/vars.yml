---
# GENIE.AI - El Salvador environment (RTX server)
# Non-secret settings specific to this environment.

# =============================================================================
# DEPLOYMENT OPTIONS
# =============================================================================
deploy_dir: /opt/genieai-el-salvador
stack_name: genieai-el-salvador
repo_branch: el-salvador-contextual
genie_ai_global_tag: el-salvador-contextual
arango_db: el-salvador

# Remote GPU node (vLLM, TEI run on 10.0.0.110)
gpu_node_host: "10.0.0.110"

# =============================================================================
# OBSERVABILITY (Section 12C)
# =============================================================================
enable_observability: "1"
gpu_https_port: "444"

# Self-signed certificates (IP-based access, no domain/Let's Encrypt)
self_signed_certs: true

# SSL verification — self-signed certs on both app node and remote GPU node
node_tls_reject_unauthorized: "0"
opea_ssl_skip_verify: "1"
keycloak_ssl_skip_verify: "1"

# KEYCLOAK THEME
keycloak_theme: genie-el-salvador
# Supported locales for Keycloak login/account pages (JSON array; envsubst into the realm)
keycloak_supported_locales: '["en","es"]'

# MOBILE OIDC CLIENT
kc_mobile_client_id: genie-mobile-el-salvador
kc_mobile_redirect_scheme: sv.gov.agrogenio

# =============================================================================
# API GATEWAY
# =============================================================================
nginx_public_domain: "10.0.0.102"

# =============================================================================
# FRONTEND
# =============================================================================
vue_app_api_url: "https://10.0.0.102/api"
vue_app_csp_connect_src: "'self' https://10.0.0.102 https://10.0.0.110 https://api.worldbank.org http://localhost:8010 https://localhost:8010 http://localhost:8090 https://localhost:8090 ws://localhost:8090 wss://localhost:8090 https://genie-ai.itu.int https://*.ssdcloudindia.net"
# Available UI locales — El Salvador serves English + Spanish only (all 14 source locale files stay in the repo)
vue_app_available_locales: "en,es"

# =============================================================================
# BACKEND
# =============================================================================
cors_allowed_origins: 'https://10.0.0.102,http://localhost,https://localhost,http://localhost:8090,https://localhost:8090,https://genie-ai.itu.int,/^https?:\/\/.*\.ssdcloudindia\.net$$/'
csp_connect_src: "'self' https://10.0.0.102 https://10.0.0.110 https://api.worldbank.org http://localhost https://localhost http://localhost:8010 https://localhost:8010 ws://localhost:8090 wss://localhost:8090 https://genie-ai.itu.int https://*.ssdcloudindia.net"
nginx_permissions_policy: "camera=(), microphone=()"
# Stream the target-language translation during chat (#829): stream Spanish
# during generation instead of English-then-flip. Set "0" to revert.
streaming_translation_enabled: "1"

# Multi-turn vector-space blending (issue #833 / MR !232). Blends the query
# embedding with the previous N turns (V = α·EQ + (1-α)·EH) so pronoun-heavy
# follow-ups retrieve the prior turn's subject. Only the dense leg is blended.
multi_turn_blend_enabled: "true"
multi_turn_blend_alpha: "0.7"
multi_turn_history_turns: "2"

# =============================================================================
# EMAIL (non-secret)
# =============================================================================
email_host: "smtp.itu.ch"
email_port: "587"
email_secure: "false"
email_user: "genie-ai"
email_from: "noreply@genie-ai.itu.int"

# =============================================================================
# LET'S ENCRYPT (automatic SSL certificates)
# =============================================================================
certbot_email: "admin@assembly.govstack.global"
certbot_replicas: "0"  # self-signed certs — Let's Encrypt disabled on IP-based deployment
# certbot_staging: "false"  # Set to "true" to use Let's Encrypt staging (avoids rate limits)

# =============================================================================
# OPEA / AI SERVICES
# =============================================================================
arango_graph_name: "GRAPH_TEST"
retriever_arango_traversal_enabled: "true"
retriever_arango_traversal_max_depth: "2"
retriever_arango_traversal_max_returned: "5"
retriever_arango_traversal_score_threshold: "0.7"
retriever_arango_traversal_concurrent_batches: "10"
retriever_arango_k: "20"
retriever_arango_fetch_k: "30"
retriever_arango_score_threshold: "0.2"
reranking_threshold: "0.6"

# Adaptive reranker calibration (offline-calibrated via tests/rag-benchmarks/eval/calibrate.py
# against the instrumented anchor report; baseline replay reproduces live recall exactly).
# Lowered CONTEXT_DECAY_FACTOR 0.0025 -> 0.0008 (chunks are ~700 tokens; 0.0025 overcharged
# cost ~1.75, dropping strong top chunks on ~30% of queries). MIN_VALUE_THRESHOLD -1.0 -> -0.5
# (slightly stricter, trims noise). Confusion formula unchanged. Predicted offline:
# recall 0.385 -> 0.474 (+23%), precision 0.438 -> 0.423, empty_queries 10 -> 6.
context_decay_factor: "0.0008"
min_value_threshold: "-0.5"

# Contextual Retrieval strategy: per_chunk (Anthropic recipe) — one LLM call
# per chunk generates a section-specific context prefix. Diversifies chunk
# embeddings (doc_level gave every chunk the same prefix → embedding flooding,
# ~13/20 candidate slots consumed by near-duplicate doc-summary chunks; the
# semantic eval couldn't even calibrate a threshold — chunk-vs-own-passage < 0.72,
# chunk-vs-different-doc-chunk > 0.55, no clean separation).
# Cost: ~142 LLM calls (granite-4.1-8b) for this corpus — acceptable.
# Re-ingest REQUIRED after this change (only new ingests get per-chunk context).
# Backup of GRAPH_TEST_SOURCE taken before re-ingest:
#   ~/Téléchargements/GRAPH_TEST_SOURCE_backup_20260704_081707.json
contextual_strategy: "per_chunk"

# Per-chunk doc-context budget (chars of doc text fed to the context-gen LLM).
# Default 6000 was tuned for doc_level and is far too small for per_chunk: it
# shows the LLM only ~5% of the document, so it can't place each chunk → generic
# prefixes ("This chunk covers pest management...") → embeddings still cluster
# (median pairwise cosine 0.70 after first per_chunk attempt). Raised to 100000
# (matches the doc_level budget; granite-4.1-8b context window handles ~32k
# tokens of doc + chunk easily). The Anthropic per_chunk recipe needs the FULL
# document visible per chunk for section-tailored context.
dataprep_contextual_doc_budget: "100000"

# Dataprep LLM labeling: granite-4.1-8b handles 8-chunk batches reliably
# (validated), cutting label-call round-trips to the remote vLLM ~8x.
# Lowered to 4 (code default): with the 100k doc-context budget, larger batches
# see more cross-chunk pollution in the generated context (one chunk's section
# bleeds into another's prefix) AND trigger more partial-response omissions
# (recovered via per-chunk fallback, but wasteful). Batch=4 = less inter-chunk
# contamination + fewer omissions. Re-validate: does embedding diversity
# improve (chunk context more section-specific)?
dataprep_llm_label_batch_size: 4

# Reranker strategy + top-N. Switched from `adaptive` to `slice` (simple top-N
# by TEI cross-encoder score) after offline strategy sweep proved adaptive's
# novelty cliff drops high-relevance gold chunks (TEI 0.93 dropped despite being
# 3rd-best). `slice top-3` offline: recall 0.77, precision 0.56 (vs adaptive
# 0.69/0.54) — dominates adaptive on both. The multiplicative novelty formula
# (relevance × sigmoid(novelty)) is non-standard and structurally flawed (a
# high-relevance chunk can be zeroed by low novelty); standard MMR is additive.
# slice top-3 is the balanced pick (top-2 = precision king, top-5 = recall king).
# Live validation pending.
reranking_strategy: "slice"
reranker_top_n: "3"

# Chunking configuration. Values are character counts — dataprep uses LangChain's
# RecursiveCharacterTextSplitter, which measures chunk length in characters.
# 2000 chars ≈ 500 tokens and 300 chars ≈ 75 tokens for the embedding tokenizer.
dataprep_chunk_size_md: 2000
dataprep_chunk_overlap: 300
vllm_llm_model_id: ibm-granite/granite-3.3-2b-instruct
vllm_max_model_len: "16384"
vllm_gpu_utilization: "0.35"
vllm_translation_model_id: google/gemma-3-4b-it
vllm_translation_max_model_len: "8192"
vllm_translation_dtype: bfloat16
vllm_translation_gpu_utilization: "0.35"
vllm_translation_kv_cache_dtype: auto
vllm_max_num_seqs: "1024"
vllm_translation_max_num_seqs: "32"
embedding_model_id: BAAI/bge-base-en-v1.5
reranker_model_id: BAAI/bge-reranker-v2-m3
chatqna_enforce_abstention: "false"
# Opt-in LLM self-grade: the model appends [[CONF:<0-100>]] rating how well the
# retrieved docs support its answer; chatqna strips it before the user/translation
# and exposes it as `self_confidence` in the metadata. Enabled on el-salvador to
# collect real self_confidence values for the calibration eval — NOT yet surfaced
# to end users (frontend does not render the field). Expect some null values: the
# 2B model may not always emit the sentinel in the exact format.
llm_self_confidence_enabled: "1"
chatqna_system_prompt: |-
  <INSTRUCTIONS>You are a friendly and polite information assistant. Your task is to answer the user's latest question using only the content provided from the knowledge base. Do not invent or assume information; if the answer is not in the provided content, inform the user that the information is unavailable. Use the user's name, gender, age, preferences, and chat history to tailor and personalise your responses. Keep answers informative but concise; provide detailed explanations only when necessary or explicitly requested.</INSTRUCTIONS>CRITICAL LANGUAGE REQUIREMENTS:You MUST respond in the same language as the user's question. If the user asks in English, respond in English. If the user asks in Spanish, respond in Spanish.If any retrieved content from the knowledge base is in a different language than the user's question, you MUST translate that content to match the user's language before using it in your response.NEVER mix languages in your response. Your entire response must be in the same language as the user's question.If the user's language is unclear from the question, default to English.In line with the above instructions, generate a reply to the user's latest message in the chat history based on the relevant content provided.

label_selector_system_prompt: |-
  You are a RULE-BASED CLASSIFIER, not a creative model.

  Your ONLY job is to select 1–4 labels STRICTLY from the allowed list based on the semantic meaning of the text chunk.

  ### HARD RULES (Granite MUST obey)
  1. You MUST output ONLY valid JSON in this exact format:
     {"labels": ["Label1", "Label2"]}

  2. You MUST choose ONLY from the provided labels list. NO new labels. NO substitutions. NO synonyms.

  3. You MUST select between 1 and 4 labels. NEVER output 0 labels.

  4. You MUST ignore all information not directly relevant to the core semantic meaning of the text chunk.

  5. BROAD labels take priority over specific ones.

  6. If multiple labels could fit, choose the MOST semantically dominant themes.

  7. YOU MUST perform the following internal steps before output (but NEVER show them):
     - Step A: Identify the 1–4 strongest semantic concepts in the chunk.
     - Step B: Match each concept to the CLOSEST label from the allowed list.
     - Step C: Remove any labels not strongly supported by the chunk.
     - Step D: Verify ALL labels belong to the allowed list.
     - Step E: Verify JSON format EXACTLY.

  ### ALLOWED LABELS (use ONLY these):
  '{labels_list}'

  ### REQUIRED OUTPUT (NO narration, NO explanation)
  Return ONLY this JSON structure:
  {"labels": ["Label1", "Label2"]}
log_level: DEBUG   # TEMPORARY diagnostic — revert to INFO after
