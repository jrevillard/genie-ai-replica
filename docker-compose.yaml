# =============================================================================
# GENIE.AI - Docker Compose File (dual-mode: compose up + Swarm)
# =============================================================================
#
# This single compose file supports two deployment modes:
#
# 1. Single-node (docker compose up):
#      docker compose up -d                    # Core services only (no OPEA)
#      docker compose --profile opea up -d     # Full stack with OPEA/GPU
#
# 2. Docker Swarm (docker stack deploy):
#      docker stack deploy -c <resolved> <stack>
#      OPEA services controlled by DEPLOY_OPEA env var (default: 1).
#      Placement constraints require node labels (see below).
#
# Dual-mode notes:
#   - deploy sections (replicas, placement, restart_policy) are Swarm-only;
#     docker compose up ignores them entirely
#   - depends_on is for compose up ordering; Swarm ignores it
#   - restart: is for compose up; Swarm uses deploy.restart_policy
#   - profiles: [opea] controls OPEA services in compose up; Swarm ignores profiles
#   - build: enables local builds (docker compose up); Swarm ignores it and uses image:
#   - GPU access via NVIDIA_VISIBLE_DEVICES env var (no runtime: nvidia)
#
# Swarm prerequisites:
#   1. Swarm initialized: docker swarm init
#   2. Node labels: docker node update --label-add gpu=true <gpu-node>
#                docker node update --label-add gateway=true <gateway-node>
#                docker node update --label-add genieai=true <genieai-node>
#   3. Local registry: docker run -d -p 5000:5000 --name registry registry:2
#   4. Images pre-built and pushed to registry
#   5. .env configured (see env template)
# =============================================================================

# Required directories on each target node (create before deploy):
#
# All nodes:
#   ./data/logs/kong            (Kong gateway logs)
#   ./data/logs/backend         (Backend API logs)
#   ./data/logs/doc-repo        (Document Repository logs)
#   ./data/database_backups     (Backend DB dumps)
#   ./data/huggingface          (TEI model cache, GPU nodes only)
#   ./secrets/ssl/              (server.crt, server.key)

volumes:
  postgres_data:
  redis_data:
  doc_repo_uploads:
  arango_data: {}
  hf_cache:
  backend_uploads:
  backend_data:
  certbot-webroot:
  certbot-etc:

services:

  # ===========================================================================
  # API Gateway Stack (node.labels.gateway == true)
  # ===========================================================================

  postgres:
    image: postgres:13
    networks:
      - genieai_network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-genieai}
      - POSTGRES_DB=${POSTGRES_DB:-kong}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # PostgreSQL internal only - no external access needed
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-genieai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # Kong database migrations (one-shot init, runs automatically on first start)
  kong-migrations:
    image: kong:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - genieai_network
    environment:
      - KONG_DATABASE=${KONG_DATABASE:-postgres}
      - KONG_PG_HOST=${KONG_PG_HOST:-postgres}
      - KONG_PG_USER=${KONG_PG_USER:-kong}
      - KONG_PG_PASSWORD=${KONG_DB_PASSWORD}
    command: >
      bash -c "
        echo 'Waiting for PostgreSQL...' &&
        for i in $$(seq 1 30); do pg_isready -h ${KONG_PG_HOST:-postgres} -U ${KONG_PG_USER:-kong} -q 2>/dev/null && break; sleep 2; done &&
        kong migrations bootstrap 2>/dev/null ||
        kong migrations up &&
        kong migrations finish
      "
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Kong routes/services/plugins configuration (one-shot init, runs after Kong is ready)
  kong-config:
    restart: "no"
    depends_on:
      kong:
        condition: service_healthy
    build: api-gateway-solution/new-config/
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-kong-config:latest
    networks:
      - genieai_network
    environment:
      - KONG_ADMIN_URL=http://kong:8001
      - KONG_PUBLIC_URL=http://kong:8000
      - TARGET_HOST=backend
      - TARGET_PORT=3000
    command: ["-b", "/opt/kong-config/kong_config.json"]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  kong:
    depends_on:
      postgres:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    image: kong:latest
    environment:
      - KONG_DATABASE=${KONG_DATABASE:-postgres}
      - KONG_PG_HOST=${KONG_PG_HOST:-postgres}
      - KONG_PG_USER=${KONG_PG_USER:-kong}
      - KONG_PG_PASSWORD=${KONG_DB_PASSWORD}
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=${KONG_ADMIN_LISTEN:-0.0.0.0:8001, 0.0.0.0:8444 ssl}
      - KONG_DNS_RESOLVER=${KONG_DNS_RESOLVER:-127.0.0.11}
      - KONG_DNS_ORDER=${KONG_DNS_ORDER:-LAST,A,AAAA,CNAME}
      - KONG_DNS_STALE_TTL=${KONG_DNS_STALE_TTL:-5}
      - KONG_NGINX_DAEMON=off
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - genieai_network
    # Kong proxy - internal only. All external traffic routes through nginx:80/443.
    # Uncomment for debugging direct Kong access (bypasses nginx security):
    # ports:
    #   - "${KONG_PROXY_PORT:-8000}:8000"
    #   - "${KONG_HTTPS_PORT:-8443}:8443"
    # Kong admin API - internal only (accessible via docker exec for post-deploy config)
    # ports:
    #   - "8001:8001"
    volumes:
      - "${DATA_DIR:-./data}/logs/kong:/var/log/kong"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  nginx:
    depends_on:
      kong:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    build: api-gateway-solution/nginx/
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-nginx:latest
    ports:
      - target: 80
        published: ${NGINX_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${NGINX_HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    environment:
      - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
      - KONG_PROXY_HOST=${KONG_PROXY_HOST:-kong}
      - NGINX_FRONTEND_HOST=${NGINX_FRONTEND_HOST:-frontend}
      - NGINX_FRONTEND_PORT=${NGINX_FRONTEND_PORT:-8090}
      - NGINX_PERMISSIONS_POLICY=${NGINX_PERMISSIONS_POLICY:-camera=(), microphone=(), geolocation=()}
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost/ | grep -qE '^[23]' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./secrets/ssl/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./secrets/ssl/server.key:/etc/nginx/ssl/server.key:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # ===========================================================================
  # Let's Encrypt Certificate Management (optional)
  # ===========================================================================
  # Activated via: --profile letsencrypt (compose up) or CERTBOT_REPLICAS=1 (Swarm)
  # Requires: CERTBOT_EMAIL set in .env

  certbot:
    profiles: [letsencrypt]
    restart: unless-stopped
    image: certbot/certbot:latest
    entrypoint: ["/certbot-entrypoint.sh"]
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-false}
    volumes:
      - ./api-gateway-solution/certbot/entrypoint.sh:/certbot-entrypoint.sh:ro
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
      - ./secrets/ssl:/secrets/ssl:rw
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - genieai_network
    deploy:
      replicas: ${CERTBOT_REPLICAS:-0}
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
  # ===========================================================================

  frontend:
    restart: unless-stopped
    build: components/gov-chat-frontend/
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-frontend:latest
    environment:
      - PORT=8090
      - VUE_APP_API_URL=${VUE_APP_API_URL:-/api}
      - VUE_PROXY_HOST=${VUE_PROXY_HOST:-localhost}
      - VUE_APP_CSP_CONNECT_SRC=${VUE_APP_CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
    # Port 8090 is internal only - outer nginx on 80/443 is the public entry point
    # ports:
    #   - "${FRONTEND_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  redis-cache:
    restart: unless-stopped
    image: redis:7-alpine
    # Internal only - no host port mapping needed
    # ports:
    #   - "${TRANSLATION_CACHE_PORT:-6379}:6379"
    environment:
      - REDISCLI_AUTH=${TRANSLATION_CACHE_PASSWORD}
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${TRANSLATION_CACHE_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  db-migrations:
    restart: "no"
    depends_on:
      arango-vector-db:
        condition: service_healthy
    build:
      context: .
      dockerfile: components/gov-chat-backend/Dockerfile.migrations
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-db-migrations:latest
    networks:
      - genieai_network
    environment:
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  backend:
    depends_on:
      arango-vector-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      keycloak-config:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    build:
      context: components/
      dockerfile: gov-chat-backend/Dockerfile
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-backend:latest
    # Swarm: internal only - access via Kong proxy
    # ports:
    #   - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - "${DATA_DIR:-./data}/database_backups:/app/database_backups"
      - "${DATA_DIR:-./data}/logs/backend:/app/logs"
      - backend_data:/app/data
      - backend_uploads:/app/Uploads
    # Allow backend to resolve NGINX_PUBLIC_DOMAIN (e.g. localhost) to the Docker host,
    # so OIDC discovery and JWKS fetches reach NGINX (which publishes 80/443 via mode: host).
    extra_hosts:
      - "${NGINX_PUBLIC_DOMAIN:-localhost}:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      # Secrets (required, no defaults in code)
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_USER=${ARANGO_USER:-root}
      # Keycloak OIDC discovery — must use the public URL (via NGINX proxy),
      # not the internal Docker URL, so the issuer matches the JWT's iss claim.
      - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}/auth
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-genie}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
      # Additional Keycloak realms for multi-realm token validation (JSON map: {"realm":"client-id"})
      # NOTE: Docker Swarm ${VAR:-{}} breaks due to nested braces. Use env file or set empty string.
      - KEYCLOAK_ADDITIONAL_REALMS
      # Keycloak proxy service account — restricted permissions for user/role management
      - KEYCLOAK_PROXY_CLIENT_ID=genie-proxy-client
      - KEYCLOAK_PROXY_CLIENT_SECRET=${KEYCLOAK_PROXY_CLIENT_SECRET}
      # TLS verification for backend → NGINX OIDC discovery/JWKS fetches.
      # Default: 1 (strict, for production). Set to 0 in .env for dev with self-signed certs.
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      # Translation cache (required, no default in code)
      - TRANSLATION_CACHE=${TRANSLATION_CACHE:-on}
      - TRANSLATION_CACHE_HOST=${TRANSLATION_CACHE_HOST:-redis-cache}
      - TRANSLATION_CACHE_PORT=${TRANSLATION_CACHE_PORT:-6379}
      - TRANSLATION_CACHE_PASSWORD=${TRANSLATION_CACHE_PASSWORD}
      # Email configuration (required)
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE:-}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # OPEA AI/ML service override (code default is deployment-specific: 'e2e-109-198')
      - OPEA_HOST=${OPEA_HOST:-chatqna-xeon-backend-server}
      # Conversation mode: conversation-with-context-labels (full context) or single-message (legacy)
      - CONTEXT_OPTION=${CONTEXT_OPTION:-conversation-with-context-labels}
      # CORS (deployment-specific, localhost defaults)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8090,http://127.0.0.1:8090,https://localhost,http://localhost}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  document-repository:
    depends_on:
      arango-vector-db:
        condition: service_healthy
      keycloak-config:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: components/
      dockerfile: document-repository/Dockerfile
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-document-repository:latest
    environment:
      # Secrets (required, no defaults in code)
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_URL=http://arango-vector-db:8529
      - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}/auth
      - KC_REALM=${KEYCLOAK_REALM:-genie}
      - KC_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
    # Internal only - no host port mapping needed
    # ports:
    #   - "${DOC_REPO_PORT:-3001}:3001"
    networks:
      - genieai_network
    volumes:
      - "${DATA_DIR:-./data}/logs/doc-repo:/app/logs"
      - doc_repo_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  clamav:
    restart: unless-stopped
    image: clamav/clamav
    # Internal only
    # ports:
    #   - "3310:3310"
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3310 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  arango-vector-db:
    restart: unless-stopped
    image: arangodb/arangodb:3.12.4
    ports:
      - target: 8529
        published: ${ARANGO_PORT:-8529}
        protocol: tcp
        mode: host
    volumes:
      - arango_data:/var/lib/arangodb3
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    command: ["--experimental-vector-index=true"]
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.username root --server.password \"${ARANGO_PASSWORD}\" --javascript.execute-string \"db._version();\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10


  # ===========================================================================
  # OPEA/GPU Stack (node.labels.gpu == true)
  # ===========================================================================

  vllm:
    profiles: [opea]
    restart: unless-stopped
    image: vllm/vllm-openai:latest
    # Swarm: internal only - access via Kong or docker exec
    # ports:
    #   - "${LLM_SERVER_PORT:-8000}:8000"
    command: >
      --model ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      --gpu_memory_utilization ${VLLM_GPU_UTILIZATION:-0.4}
      --served-model-name ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      --max_model_len ${VLLM_MAX_MODEL_LEN:-2048}
      --max_num_seqs ${VLLM_MAX_NUM_SEQS:-64}
      --dtype=${VLLM_DTYPE:-half}
      --enforce-eager
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  textgen:
    profiles: [opea]
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    image: opea/llm-textgen:latest
    environment:
      - LLM_ENDPOINT=http://vllm:8000
      - LLM_MODEL_ID=${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
    # Internal only
    # ports:
    #   - "9000:9000"
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30

  vllm-translation-guardrail:
    profiles: [opea]
    restart: unless-stopped
    image: vllm/vllm-openai:latest
    # Internal only
    # ports:
    #   - "9031:9031"
    command: >
      --model ${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      --gpu_memory_utilization ${VLLM_TRANSLATION_GPU_UTILIZATION:-0.3}
      --served-model-name ${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      --max_model_len ${VLLM_TRANSLATION_MAX_MODEL_LEN:-2048}
      --kv-cache-dtype=${VLLM_TRANSLATION_KV_CACHE_DTYPE:-fp8}
      --dtype=${VLLM_TRANSLATION_DTYPE:-half}
      --port ${VLLM_TRANSLATION_SERVICE_PORT:-9031}
      --no-enable-chunked-prefill
      --max-num-seqs ${VLLM_TRANSLATION_MAX_NUM_SEQS:-16}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - genieai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9031/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s
    deploy:
      replicas: ${DEPLOY_OPEA:-1}
      placement:
        constraints:
          - node.labels.gpu == true
