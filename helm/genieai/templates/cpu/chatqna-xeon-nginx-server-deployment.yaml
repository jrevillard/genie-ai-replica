apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatqna-xeon-nginx-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "chatqna-xeon-nginx-server" "tier" "cpu" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.cpu.chatqnaXeonNginxServer.replicas }}
  selector:
    matchLabels:
      {{- include "genieai.selectorLabels" (dict "name" "chatqna-xeon-nginx-server" "context" .) | nindent 6 }}
  {{- include "genieai.rollingUpdate" . | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "genieai.componentLabels" (dict "name" "chatqna-xeon-nginx-server" "tier" "cpu" "context" .) | nindent 8 }}
    spec:
      {{- include "genieai.cpuAffinity" . | nindent 6 }}
      containers:
        - name: chatqna-xeon-nginx-server
          image: {{ .Values.cpu.chatqnaXeonNginxServer.image }}
          ports:
            - containerPort: {{ .Values.cpu.chatqnaXeonNginxServer.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cpu-services-config
          {{- include "genieai.cpuResources" .Values.cpu.chatqnaXeonNginxServer.resources | nindent 10 }}
          {{- include "genieai.httpReadinessProbe" (dict "path" .Values.cpu.chatqnaXeonNginxServer.healthPath "port" .Values.cpu.chatqnaXeonNginxServer.port "settings" .Values.cpuProbes.readiness) | nindent 10 }}
          {{- include "genieai.httpLivenessProbe" (dict "path" .Values.cpu.chatqnaXeonNginxServer.healthPath "port" .Values.cpu.chatqnaXeonNginxServer.port "settings" .Values.cpuProbes.liveness) | nindent 10 }}
