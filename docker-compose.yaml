# =============================================================================
# GENIE.AI - Docker Compose File (dual-mode: compose up + Swarm)
# =============================================================================
#
# This single compose file supports two deployment modes:
#
# 1. Single-node (docker compose up):
#      docker compose up -d                    # Core services only (no OPEA)
#      docker compose --profile opea --profile gpu-models up -d  # Full stack with OPEA/GPU
#      docker compose --profile observability up -d  # Core + Observability stack
#
# 2. Docker Swarm (docker stack deploy):
#      docker stack deploy -c <resolved> <stack>
#      OPEA services controlled by DEPLOY_OPEA env var (default: 1).
#      Placement constraints require node labels (see below).
#
# Dual-mode notes:
#   - deploy sections (replicas, placement, restart_policy) are Swarm-only;
#     docker compose up ignores them entirely
#   - depends_on is for compose up ordering; Swarm ignores it
#   - restart: is for compose up; Swarm uses deploy.restart_policy
#   - profiles: [opea] controls OPEA orchestrator services in compose up; Swarm ignores profiles
#   - profiles: [gpu-models] controls GPU-heavy services (vllm, tei, tei_reranker,
#     vllm-translation-guardrail); compose up with --profile gpu-models starts them
#   - Local GPU: --profile opea --profile gpu-models; Remote GPU: --profile opea only
#   - GPU_MODEL_REPLICAS: set to 0 to skip GPU-heavy containers in Swarm (remote GPU node)
#   - Orchestrator endpoints use ${VAR:-default} pattern; override from .env for remote GPU
#   - profiles: [observability] controls the optional Observability stack
#     (VictoriaMetrics, VictoriaTraces, tempo-proxy, Grafana) in compose up;
#     Swarm ignores profiles and uses ENABLE_OBSERVABILITY env var instead
#     (default: 0 = disabled)
#   - the admin-logs substrate (VictoriaLogs + OTel Collector + otel-collector-init)
#     is always-on — no profile label, starts by default in compose up and runs
#     unconditionally in Swarm so admin endpoints stay functional regardless of
#     ENABLE_OBSERVABILITY
#   - build: enables local builds (docker compose up); Swarm ignores it and uses image:
#   - GPU access via NVIDIA_VISIBLE_DEVICES env var (no runtime: nvidia)
#
# Swarm prerequisites:
#   1. Swarm initialized: docker swarm init
#   2. Node labels: docker node update --label-add gpu=true <gpu-node>
#                docker node update --label-add gateway=true <gateway-node>
#                docker node update --label-add genieai=true <genieai-node>
#   3. Docker login to GitLab Container Registry (all nodes that pull images)
#   4. Images pre-built by CI and pulled from registry automatically
#   5. .env configured (see env template)
# =============================================================================

# Required directories on each target node (create before deploy):
#
# All nodes:
#   ./data/logs/kong            (Kong gateway logs)
#   ./data/database_backups     (Backend DB dumps)
#   ./data/huggingface          (TEI model cache, GPU nodes only)
#   ./secrets/ssl/              (server.crt, server.key)

volumes:
  postgres_data:
  redis_data:
  doc_repo_uploads:
  arango_data: {}
  hf_cache:
  backend_uploads:
  backend_data:
  certbot-webroot:
  certbot-etc:
  vm-data:
  ragas_llm_cache:
  grafana-data:
  vlogs-data:
  vtraces-data:
  otel-queue:

# Fluentd logging driver configuration for centralized log aggregation.
# All services forward stdout/stderr to the OTel Collector's fluentforward
# receiver (port 24224). Docker dual logging (20.10+) keeps `docker logs`
# functional alongside the fluentd driver. When observability is disabled,
# the collector is not running; fluentd-async prevents container startup
# failures and Docker silently retries in the background.
x-logging: &fluent-logging
  driver: fluentd
  options:
    fluentd-address: "localhost:24224"
    fluentd-async: "true"
    fluentd-buffer-limit: 8MB       # was implicit 1MB default; bumped because single-channel load
    fluentd-max-retries: 5          # was implicit 1 retry
    fluentd-retry-wait: 2s          # was implicit 1s
    tag: "genie.{{.Name}}"
    # Forward the Compose-managed `com.docker.compose.service` label as a
    # log attribute. The OTel Collector then reads it to stamp the
    # canonical `service.name` on every fluentd-sourced log record.
    # Without this, the collector must regex-parse `<service>` from the
    # project-prefixed container name (which embeds the deployment
    # project — `admin-logs-prd-document-repository` instead of just
    # `document-repository`).
    labels: "com.docker.compose.service,com.docker.compose.project"

services:

  # ===========================================================================
  # API Gateway Stack (node.labels.gateway == true)
  # ===========================================================================

  postgres:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    image: postgres:16
    networks:
      - genieai_network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-genieai}
      - POSTGRES_DB=${POSTGRES_DB:-kong}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # PostgreSQL internal only - no external access needed
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-genieai}", "-d", "${POSTGRES_DB:-kong}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # Kong database migrations (one-shot init, runs automatically on first start)
  kong-migrations:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    image: kong:3.9.3
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - genieai_network
    environment:
      - KONG_DATABASE=${KONG_DATABASE:-postgres}
      - KONG_PG_HOST=${KONG_PG_HOST:-postgres}
      - KONG_PG_USER=${KONG_PG_USER:-kong}
      - KONG_PG_PASSWORD=${KONG_DB_PASSWORD}
    command: >
      bash -c "
        echo 'Waiting for PostgreSQL...' &&
        for i in $$(seq 1 30); do pg_isready -h ${KONG_PG_HOST:-postgres} -U ${KONG_PG_USER:-kong} -q 2>/dev/null && break; sleep 2; done &&
        kong migrations bootstrap 2>/dev/null ||
        kong migrations up &&
        kong migrations finish
      "
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # Kong routes/services/plugins configuration (one-shot init, runs after Kong is ready)
  kong-config:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    restart: "no"
    depends_on:
      kong:
        condition: service_healthy
    build: api-gateway-solution/new-config/
    image: ${GENIE_AI_KONG_CONFIG_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-kong-config}:${GENIE_AI_KONG_CONFIG_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    networks:
      - genieai_network
    environment:
      - KONG_ADMIN_URL=http://kong:8001
      - KONG_PUBLIC_URL=http://kong:8000
      - TARGET_HOST=backend
      - TARGET_PORT=3000
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
      # OKF feature flag: 0 strips the okf-server service + /api/okf route
      # from the declarative apply (and deletes any existing okf entities).
      - OKF_ENABLED=${OKF_ENABLED:-0}
    command: ["-b", "/opt/kong-config/kong_config.json"]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5

  kong:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    depends_on:
      postgres:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    image: kong:3.9.3
    environment:
      - KONG_DATABASE=${KONG_DATABASE:-postgres}
      - KONG_PG_HOST=${KONG_PG_HOST:-postgres}
      - KONG_PG_USER=${KONG_PG_USER:-kong}
      - KONG_PG_PASSWORD=${KONG_DB_PASSWORD}
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=${KONG_ADMIN_LISTEN:-0.0.0.0:8001, 0.0.0.0:8444 ssl}
      - KONG_DNS_RESOLVER=${KONG_DNS_RESOLVER:-127.0.0.11}
      - KONG_DNS_ORDER=${KONG_DNS_ORDER:-LAST,A,AAAA,CNAME}
      - KONG_DNS_STALE_TTL=${KONG_DNS_STALE_TTL:-5}
      - KONG_NGINX_DAEMON=off
      - KONG_TRACING_INSTRUMENTATIONS=${KONG_TRACING_INSTRUMENTATIONS:-request}
      - KONG_TRACING_SAMPLING_RATE=${KONG_TRACING_SAMPLING_RATE:-1.0}
      # Trust nginx (Docker network) to send correct X-Forwarded-* headers.
      # Kong is internal-only; nginx on the same network is the TLS termination layer.
      # Restrict to Docker bridge subnet to prevent header spoofing from outside.
      - KONG_TRUSTED_IPS=${KONG_TRUSTED_IPS:-172.16.0.0/12}
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - genieai_network
    # Kong proxy - internal only. All external traffic routes through nginx:80/443.
    # Uncomment for debugging direct Kong access (bypasses nginx security):
    # ports:
    #   - "${KONG_PROXY_PORT:-8000}:8000"
    #   - "${KONG_HTTPS_PORT:-8443}:8443"
    # Kong admin API - internal only (accessible via docker exec for post-deploy config)
    # ports:
    #   - "8001:8001"
    volumes:
      - "${DATA_DIR:-./data}/logs/kong:/var/log/kong"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  nginx:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    depends_on:
      kong:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    build: api-gateway-solution/nginx/
    image: ${GENIE_AI_NGINX_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-nginx}:${GENIE_AI_NGINX_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    ports:
      - target: 80
        published: ${NGINX_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${NGINX_HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    environment:
      - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-443}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
      - KONG_PROXY_HOST=${KONG_PROXY_HOST:-kong}
      - NGINX_FRONTEND_HOST=${NGINX_FRONTEND_HOST:-frontend}
      - NGINX_FRONTEND_PORT=${NGINX_FRONTEND_PORT:-8090}
      - NGINX_PERMISSIONS_POLICY=${NGINX_PERMISSIONS_POLICY:-camera=(), microphone=(), geolocation=()}
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost/ | grep -qE '^[23]' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./secrets/ssl:/etc/nginx/ssl:ro  # directory mount — tracks inode changes from certbot renewals
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # ===========================================================================
  # Let's Encrypt Certificate Management (optional)
  # ===========================================================================
  # Activated via: --profile letsencrypt (compose up) or CERTBOT_REPLICAS=1 (Swarm)
  # Requires: CERTBOT_EMAIL set in .env

  certbot:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    profiles: [letsencrypt]
    restart: unless-stopped
    image: certbot/certbot:v5.7.0
    entrypoint: ["/certbot-entrypoint.sh"]
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-false}
    volumes:
      - ./api-gateway-solution/certbot/entrypoint.sh:/certbot-entrypoint.sh:ro
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
      - ./secrets/ssl:/secrets/ssl:rw
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - genieai_network
    deploy:
      replicas: ${CERTBOT_REPLICAS:-0}
      placement:
        constraints:
          - node.labels.gateway == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
  # ===========================================================================

  frontend:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    restart: unless-stopped
    build: components/gov-chat-frontend/
    image: ${GENIE_AI_FRONTEND_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-frontend}:${GENIE_AI_FRONTEND_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      - PORT=8090
      - VUE_APP_API_URL=${VUE_APP_API_URL:-/api}
      - VUE_PROXY_HOST=${VUE_PROXY_HOST:-localhost}
      - VUE_APP_CSP_CONNECT_SRC=${VUE_APP_CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
      - VUE_APP_AVAILABLE_LOCALES=${VUE_APP_AVAILABLE_LOCALES:-}
      # OKF feature flag (2026-10-21): the entrypoint writes it into
      # window.APP_CONFIG.okfEnabled; the Admin Dashboard hides the OKF
      # Studio and Models tabs (and their sidebar entries) when '0'.
      # Same variable that parks the okf containers and the Kong route.
      - VUE_APP_OKF_ENABLED=${OKF_ENABLED:-0}
      - VUE_APP_STREAM_IDLE_TIMEOUT_MS=${VUE_APP_STREAM_IDLE_TIMEOUT_MS:-}
    volumes:
      - ${CONFIG_DIR_FRONTEND:-./components/gov-chat-frontend/public/config}:/app/dist/config:ro
    # Port 8090 is internal only - outer nginx on 80/443 is the public entry point
    # ports:
    #   - "${FRONTEND_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  redis-cache:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    restart: unless-stopped
    image: redis:7-alpine
    # Internal only - no host port mapping needed
    # ports:
    #   - "${TRANSLATION_CACHE_PORT:-6379}:6379"
    environment:
      - REDISCLI_AUTH=${TRANSLATION_CACHE_PASSWORD}
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${TRANSLATION_CACHE_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      # redis-cli exits 0 on EVERY server error reply (-LOADING while the
      # AOF loads after a restart, NOAUTH, ...) — assert the reply, not the
      # exit code, or the cache reports healthy while it rejects every GET.
      test: ["CMD", "sh", "-c", "test \"$$(redis-cli ping)\" = PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  db-migrations:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    restart: "no"
    depends_on:
      arango-vector-db:
        condition: service_healthy
    build:
      context: .
      dockerfile: components/gov-chat-backend/Dockerfile.migrations
    image: ${GENIE_AI_DB_MIGRATIONS_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-db-migrations}:${GENIE_AI_DB_MIGRATIONS_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    networks:
      - genieai_network
    environment:
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  backend:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    depends_on:
      arango-vector-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      keycloak-config:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    build:
      context: components/
      dockerfile: gov-chat-backend/Dockerfile
    image: ${GENIE_AI_BACKEND_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-backend}:${GENIE_AI_BACKEND_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    # Swarm: internal only - access via Kong proxy
    # ports:
    #   - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - "${DATA_DIR:-./data}/database_backups:/app/database_backups"
      - backend_data:/app/data
      - backend_uploads:/app/Uploads
    # Allow backend to resolve NGINX_PUBLIC_DOMAIN (e.g. localhost) to the Docker host,
    # so OIDC discovery and JWKS fetches reach NGINX (which publishes 80/443 via mode: host).
    extra_hosts:
      - "${NGINX_PUBLIC_DOMAIN:-localhost}:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      # Secrets (required, no defaults in code)
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_USER=${ARANGO_USER:-root}
      # Keycloak OIDC discovery — must use the public URL (via NGINX proxy),
      # not the internal Docker URL, so the issuer matches the JWT's iss claim.
      - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      # Split-URL OIDC: KEYCLOAK_PUBLIC_URL aliases the browser-facing issuer to
      # the same JWKS when discovery is fetched via a different (internal) URL;
      # KEYCLOAK_JWKS_URL pins the JWKS fetch host; KEYCLOAK_BROWSER_ISSUER adds
      # a second accepted issuer alongside it. No-op when unset (cloud) —
      # mirrors the okf-server block.
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-}
      - KEYCLOAK_BROWSER_ISSUER=${KEYCLOAK_BROWSER_ISSUER:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-genie}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
      # Additional Keycloak realms for multi-realm token validation (JSON map: {"realm":"client-id"})
      # NOTE: Docker Swarm ${VAR:-{}} breaks due to nested braces. Use env file or set empty string.
      - KEYCLOAK_ADDITIONAL_REALMS
      # Keycloak proxy service account — restricted permissions for user/role management
      - KEYCLOAK_PROXY_CLIENT_ID=genie-proxy-client
      - KEYCLOAK_PROXY_CLIENT_SECRET=${KEYCLOAK_PROXY_CLIENT_SECRET}
      # TLS verification for backend → NGINX OIDC discovery/JWKS fetches.
      # Default: 1 (strict, for production). Set to 0 in .env for dev with self-signed certs.
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      # Translation cache (required, no default in code)
      - TRANSLATION_CACHE=${TRANSLATION_CACHE:-on}
      - TRANSLATION_CACHE_HOST=${TRANSLATION_CACHE_HOST:-redis-cache}
      - TRANSLATION_CACHE_PORT=${TRANSLATION_CACHE_PORT:-6379}
      - TRANSLATION_CACHE_PASSWORD=${TRANSLATION_CACHE_PASSWORD}
      # Translation backend model ID — must match the model loaded in vllm-translation-guardrail
      - VLLM_TRANSLATION_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      # Remote GPU node translation endpoint override
      - VLLM_TRANSLATION_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT:-http://vllm-translation-guardrail:9031}
      # "A GPU API is configured" — the backend needs this to decide whether the
      # GPU translation endpoint is mandatory or one candidate among two. Without
      # it the backend cannot tell a remote GPU node from the in-cluster worker,
      # and would quietly fall back to CPU whenever a configured endpoint stops
      # answering. The backend is its only reader: the Python services discover
      # their model id and endpoints at runtime.
      - GPU_NODE_HOST=${GPU_NODE_HOST:-}
      # Backend preference. `auto` (default) probes once and commits; `cpu` and
      # `gpu` skip the probe. Ignored when a GPU API is configured — see above.
      - TRANSLATION_BACKEND=${TRANSLATION_BACKEND:-auto}
      # Budget for the startup translation probe. Failing it stops the service,
      # so it must cover a cold TLS handshake to a remote GPU node.
      - TRANSLATION_PROBE_TIMEOUT_SECONDS=${TRANSLATION_PROBE_TIMEOUT_SECONDS:-30}
      # Stream the target-language translation during chat (#829): stream the UI
      # language while generating instead of English-then-flip. 0 = current behavior.
      - STREAMING_TRANSLATION_ENABLED=${STREAMING_TRANSLATION_ENABLED:-0}
      # OPEA runtime patches for remote GPU node (SSL bypass)
      - OPEA_SSL_SKIP_VERIFY=${OPEA_SSL_SKIP_VERIFY:-}
      # GPU node API key for Authorization: Bearer (translation, vLLM calls)
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      # Email configuration (required)
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE:-}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # OPEA AI/ML service (the code default is the same service name)
      - OPEA_HOST=${OPEA_HOST:-chatqna-xeon-backend-server}
      # Story 1.1 (BFF fan-out wire-up): okf-server internal endpoint for the
      # retrieval posture + per-caller authz graph resolution. Code default
      # matches (http://okf-server:3002); the entry exists so an operator can
      # override it without an image rebuild.
      - OKF_SERVER_URL=${OKF_SERVER_URL:-http://okf-server:3002}
      # OKF feature flag: must reach the backend explicitly (no .env passthrough)
      # — a parked deployment (0) short-circuits the retrieval-config client to
      # the legacy default instead of timing out against a zero-replica okf-server.
      - OKF_ENABLED=${OKF_ENABLED:-0}
      # The legacy graph name the BFF prepends in hybrid mode — MUST match the
      # retriever's ARANGO_GRAPH_NAME or the legacy leg diverges.
      - ARANGO_GRAPH_NAME=${ARANGO_GRAPH_NAME:-GRAPH}
      # Story 1.1 cache tuning (code defaults 30000/3000; clamped ≥1000/≥100):
      # the posture/authz window and per-call timeout. Defaults mirror the
      # authz-resolver's SERVING_TTL_MS — override only for latency tuning.
      - OKF_RETRIEVAL_CONFIG_TTL_MS=${OKF_RETRIEVAL_CONFIG_TTL_MS:-30000}
      - OKF_RETRIEVAL_CONFIG_TIMEOUT_MS=${OKF_RETRIEVAL_CONFIG_TIMEOUT_MS:-3000}
      # Conversation mode: conversation-with-context-labels (full context) or single-message (legacy)
      - CONTEXT_OPTION=${CONTEXT_OPTION:-conversation-with-context-labels}
      # Logging (error, warn, info, debug)
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - VL_QUERY_TIMEOUT_MS=${VL_QUERY_TIMEOUT_MS:-30000}
      # Forwarded so operator overrides in .env (or Ansible group_vars via
      # env.j2 lines 243-244) actually reach the container — without
      # these entries, shared/lib/melt/victorialogs-client.js silently
      # falls back to the code defaults `http://victorialogs:9428` and
      # tenant `0:0`, defeating staging-VL routing.
      - VICTORIALOGS_URL=${VICTORIALOGS_URL:-http://victorialogs:9428}
      - VICTORIALOGS_TENANT_ID=${VICTORIALOGS_TENANT_ID:-0:0}
      # CORS (deployment-specific, localhost defaults)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8090,http://127.0.0.1:8090,https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # OTel Resource `service.name` is HARDCODED in tracing.js + logger.js
      # to match the Compose block name (`backend`). The OTel-standard
      # `OTEL_SERVICE_NAME` env var also picks up `backend` here so the
      # shared `logger.js` service label and the OTel meter scope
      # (`metrics.js` getMeter) both resolve to the right service, instead
      # of the hardcoded `'genie-backend'` that mis-attributed doc-repo's
      # HTTP metrics to the backend.
      - OTEL_SERVICE_NAME=backend
      # Operators who want a different name for a canary should rename
      # the Compose block AND the source-code constants together.
    networks:
      - genieai_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  okf-server:
    # OKF feature flag (merge prep 2026-10-21): OKF_ENABLED=1 activates the OKF
    # stack. Off = parked — compose mode needs --profile okf to start it, swarm
    # runs 0 replicas, Kong gets no /api/okf route, the frontend hides the OKF
    # surfaces. Same variable gates all four (env template documents it).
    profiles: ["okf"]
    logging: *fluent-logging
    # Harden: no privilege escalation from the container — the file's
    # convention (37 existing services set it; kics Security Opt Not Set).
    security_opt:
      - no-new-privileges:true
    depends_on:
      keycloak-config:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: components/
      dockerfile: okf-server/Dockerfile
    image: ${GENIE_AI_OKF_SERVER_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-okf-server}:${GENIE_AI_OKF_SERVER_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - "${DATA_DIR:-./data}/logs/okf-server:/app/logs"
    # Allow okf-server to resolve NGINX_PUBLIC_DOMAIN to the Docker host so OIDC
    # discovery/JWKS fetches (KEYCLOAK_URL → public NGINX) reach the host-published 80/443.
    extra_hosts:
      - "${NGINX_PUBLIC_DOMAIN:-localhost}:host-gateway"
    environment:
      - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-genie}
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - SERVICE_NAME=genie-okf-server
      - NODE_ENV=production
      # Split-URL OIDC: KEYCLOAK_PUBLIC_URL aliases the browser-facing issuer to the same JWKS;
      # KEYCLOAK_JWKS_URL pins the JWKS fetch host; KEYCLOAK_BROWSER_ISSUER adds a second accepted
      # issuer alongside it. No-op in cloud (equals KEYCLOAK_URL); active where internal/public
      # issuers differ (local build).
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-}
      - KEYCLOAK_BROWSER_ISSUER=${KEYCLOAK_BROWSER_ISSUER:-}
      # Service-account mints (okf-server → doc-repo/dataprep) are server-to-server:
      # prefer the container-reachable INTERNAL Keycloak; the browser-facing public
      # alias stays only a late fallback. Mirrors the dataprep block.
      - KEYCLOAK_INTERNAL_URL=${KEYCLOAK_INTERNAL_URL:-}
      # TLS verification for okf-server → NGINX OIDC discovery/JWKS fetches.
      # Default 1 (strict, production); set 0 in .env for dev with self-signed certs.
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # The env judge the ragas sidecar uses (RAGAS_JUDGE_* is also wired into
      # the sidecar). okf-server needs it for the run's FIDELITY block: without
      # it every default-judged run recorded judge {model: null} while the
      # sidecar judged with the env model (2026-10-21 review F10).
      - RAGAS_JUDGE_BASE_URL=${RAGAS_JUDGE_BASE_URL:-http://vllm:8000/v1}
      # NO model default here: the deployment's model name must never be
      # sent to a judge base that serves another model. Unset = the served
      # model is DISCOVERED on the judge base (the !631 policy); the pin
      # applies only when the judge base IS the deployment endpoint (#1181).
      - RAGAS_JUDGE_MODEL=${RAGAS_JUDGE_MODEL:-}
      # ArangoDB — same database as the graphs (ADR-okf-018); direct arangojs, no ORM.
      - ARANGO_URL=${ARANGO_URL:-http://arango-vector-db:8529}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      # Repository soft-delete grace window (hours) before hard delete (sweep deferred to Story 4.6).
      - OKF_DELETE_GRACE_HOURS=${OKF_DELETE_GRACE_HOURS:-168}
      # Bundle-store POST timeout during publish (large bundles + ClamAV scan)
      - OKF_BUNDLE_STORE_TIMEOUT_MS=${OKF_BUNDLE_STORE_TIMEOUT_MS:-300000}
      # Story 6.1 (RFC 8707): activate audience binding by setting e.g. okf-server.
      # Empty default = off (deployments without the audience mapper keep working).
      - OKF_AUDIENCE=${OKF_AUDIENCE:-}
      # DEFAULT-OPEN OKF read authorization (product decision 2026-10-16):
      # 'open' (default) — a caller with NO okf:* scopes is authorized for ALL
      # serving repos, so any regular user's chat query can reach every
      # ingested+published repo. 'closed' — the historical default-deny
      # (nothing granted = nothing authorized). Any granted scope still
      # restricts to its exact list; the WRITE side is closed in both modes.
      # Unset-only default (`-`, not `:-`): an explicitly EMPTY value must
      # reach the container as explicit garbage and degrade to closed (with
      # a warning), per the env-file contract — not silently become open.
      - OKF_SCOPE_MODE=${OKF_SCOPE_MODE-open}
      # Story 2.9.1: service-account credentials for okf-server → doc-repo HTTP
      # (the okf-server Keycloak client provisioned by Story 6.1). Empty = calls
      # go unauthenticated and doc-repo rejects them (loud one-time warning).
      - KC_OKF_SERVER_CLIENT_ID=${KC_OKF_SERVER_CLIENT_ID:-okf-server}
      - KC_OKF_SERVER_CLIENT_SECRET=${KC_OKF_SERVER_CLIENT_SECRET:-}
      # Story 6-1c: credentials for the OKF access-control GRANT/REVOKE facility
      # (Keycloak Admin API via the genie-proxy-client service account). Empty
      # secret = the facility answers 503 ACCESS_CONTROL_UNCONFIGURED; the
      # read-path RESTRICTION enforcement needs no Keycloak and keeps working.
      - KC_OKF_ACCESS_CLIENT_ID=${KC_OKF_ACCESS_CLIENT_ID:-genie-proxy-client}
      - KC_OKF_ACCESS_CLIENT_SECRET=${KC_OKF_ACCESS_CLIENT_SECRET:-}
      # Story 2.9.4: the ingestion worker (crawlWorker pattern — poll loop over
      # Pending OKF files docs; sequential by design, dataprep is single-flight).
      - OKF_INGEST_WORKER_ENABLED=${OKF_INGEST_WORKER_ENABLED:-true}
      - OKF_INGEST_WORKER_INTERVAL_MS=${OKF_INGEST_WORKER_INTERVAL_MS:-15000}
      - OKF_INGEST_WORKER_SWEEP_INTERVAL_MS=${OKF_INGEST_WORKER_SWEEP_INTERVAL_MS:-3600000}
      - OKF_INGEST_CONCURRENCY=${OKF_INGEST_CONCURRENCY:-1}
      # Max characters in ONE concept document. A document larger than this has
      # its deep chunks embedded against a description of its start (the
      # Contextual Retrieval document context is truncated to the same budget),
      # so imports split such a document rather than storing it degraded.
      # The default is sized for the 65536-token compose window (~250k chars).
      # It is a STATIC literal, while dataprep's document-context budget now
      # follows the window the endpoint serves at runtime (discovered at
      # VLLM_ENDPOINT) — so the two must be kept in step BY HAND when the
      # served window changes. AC8 in tests/config-validator only checks that
      # compose and env.j2 agree on the literal.
      - OKF_MAX_CONCEPT_DOC_CHARS=${OKF_MAX_CONCEPT_DOC_CHARS:-250000}
      # Lane cool-down after a dataprep 429 (slot busy): without it a saturated
      # queue hot-loops at ~1 claim/sec (incident 2026-09-28 — 434 rows bouncing
      # while one slot was held for hours during a vLLM outage). Rows never
      # park; only the lane pauses before the next claim.
      - OKF_KICK_429_COOLDOWN_MS=${OKF_KICK_429_COOLDOWN_MS:-15000}
      # D-B curation engine (8f46b3345): okf-server owns the vLLM client
      # (DP-8 deviation). Empty values = engine fail-softs to heuristics;
      # a deployment opts IN by setting VLLM_ENDPOINT + VLLM_API_KEY and a
      # guided-JSON-capable chat model (VLLM_LLM_MODEL_ID preferred).
      - VLLM_ENDPOINT=${VLLM_ENDPOINT:-}
      # The pin spellings pass through RAW — envPin() (vllm-model-cache.js)
      # owns the precedence (VLLM_LLM_MODEL_ID first). A raw VLLM_MODEL_ID
      # is the escape hatch for a deployment whose OKF legs talk to ANOTHER
      # server (a proxy whose /v1/models is not readable): it wins only
      # while VLLM_LLM_MODEL_ID is unset and must name a model the CALLED
      # endpoint serves (#1181).
      - VLLM_MODEL_ID=${VLLM_MODEL_ID:-}
      # The LLM spelling reaches okf-server too (#1181): the serve-mode
      # fidelity label mirrors chatqna's pin precedence, and chatqna only
      # ever receives THIS spelling.
      - VLLM_LLM_MODEL_ID=${VLLM_LLM_MODEL_ID:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      # Discovery knobs (#1181) — the same names and defaults as the OPEA
      # blocks, so one .env line tunes both worlds. The TTL is the model-id
      # cache window; the probe timeout bounds the /v1/models probe (raise
      # it when vLLM is still loading weights — see the dataprep block).
      - MODEL_DETECT_TTL=${MODEL_DETECT_TTL:-60}
      - MODEL_PROBE_TIMEOUT_SECONDS=${MODEL_PROBE_TIMEOUT_SECONDS:-10}
      # Judge key: EXPLICIT only (no VLLM_API_KEY default here — the
      # deployment bearer must not be manufactured for a judge base the
      # operator may point anywhere; the service only sends it when the
      # judge base IS the deployment endpoint).
      - RAGAS_JUDGE_API_KEY=${RAGAS_JUDGE_API_KEY:-}
      # Model-endpoint externalization (David 2026-10-08: all OKF env vars
      # live in .env with documented defaults — compose is only the pipe).
      # TEI embed base for tag embedding + vectorized-head build + the
      # Story 1-8 head tests (frontmatter-service appends /embed). Same
      # host:port as the inference server; unset = local full-stack TEI.
      - TEI_EMBED_HOST=${TEI_EMBED_HOST:-http://tei:80}
      # Embedding model id — keys the BGE query-instruction prefix for
      # the head-test query embeds (production chatqna parity). Unset =
      # no prefix, honestly reported by the lab as "unknown (no prefix)".
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-}
      # Story 1-8d teaching-loop guardrail — mechanical rejection of suggested
      # forbidden tags that are self-forbidding (cosine vs the repo's OWN
      # topic/entity/keyword vectors >= threshold; the 2026-10-09 poisoning
      # forbade 'lung-cancer', the repo's own entity tag) or near-duplicates
      # of already-forbidden tags. Defaults live in the service (0.55 / 0.9).
      - OKF_GUARD_SELF_SUBJECT=${OKF_GUARD_SELF_SUBJECT:-}
      - OKF_GUARD_DUPLICATE_FORBIDDEN=${OKF_GUARD_DUPLICATE_FORBIDDEN:-}
      # Story 1-8g — the Lab click-test reranks a query against the repo
      # corpus through the SAME TEI /rerank the pipeline grounds on. Empty =
      # the probe reports verdict unknown with an honest note.
      - OKF_RERANK_ENDPOINT=${OKF_RERANK_ENDPOINT:-}
      - OKF_RERANK_TOKEN=${OKF_RERANK_TOKEN:-}
      # Story 8-6 — the RAGAS benchmark sidecar. URL of the ragas-service
      # container; the suite/run/explain/xlsx routes degrade to honest 503
      # RAGAS_UNAVAILABLE when it is unreachable. Concurrency/size knobs
      # bound LLM cost on the shared GPU (defaults live in the service).
      - OKF_RAGAS_URL=${OKF_RAGAS_URL:-http://ragas-service:8090}
      - RAGAS_INTERNAL_SECRET=${RAGAS_INTERNAL_SECRET:-${OKF_INTERNAL_SECRET:-}}
      - OKF_RAGAS_TESTSET_SIZE_DEFAULT=${OKF_RAGAS_TESTSET_SIZE_DEFAULT:-20}
      - OKF_RAGAS_MAX_ENTRIES=${OKF_RAGAS_MAX_ENTRIES:-200}
      - OKF_RAGAS_RUN_CONCURRENCY=${OKF_RAGAS_RUN_CONCURRENCY:-2}
      # Benchmark rerank batch concurrency (2026-10-23). Batch calls are
      # independent and scores are identical at any concurrency — transport
      # only. 1 = sequential; default 3 overlaps a 6-batch pool into ~2 waves
      # (~3x faster retrieval leg). Global in-flight ceiling is
      # OKF_RAGAS_RUN_CONCURRENCY x this value.
      - OKF_RAGAS_RERANK_CONCURRENCY=${OKF_RAGAS_RERANK_CONCURRENCY:-3}
      # SERVE mode (the default): the benchmark answers via the SAME chatqna
      # pipeline citizens use. 'whatif' runs ignore this and replay retrieval
      # in-process.
      - OKF_RAGAS_SERVE_URL=${OKF_RAGAS_SERVE_URL:-http://chatqna-xeon-backend-server:8888/v1/chatqna}
      # Declared serve posture, forwarded so every run doc can RECORD the
      # retrieval configuration it measured (fidelity.retrieval.posture).
      # chatqna remains the AUTHORITATIVE reader — okf-server only snapshots
      # these for the record. Keep the interpolation defaults identical to
      # the chatqna block to avoid silent drift (same convention as the
      # retriever block's inert copies). The record exists because a
      # configuration change (RETRIEVER_ARANGO_K=54, 2026-10-27) can silence
      # the whole pipeline (reranker per-batch token cap) — a run that
      # abstains 100% must name the posture it ran with.
      - RETRIEVER_ARANGO_K=${RETRIEVER_ARANGO_K:-20}
      - RETRIEVER_ARANGO_FETCH_K=${RETRIEVER_ARANGO_FETCH_K:-30}
      - RETRIEVER_ARANGO_SCORE_THRESHOLD=${RETRIEVER_ARANGO_SCORE_THRESHOLD:-0.2}
      - RETRIEVER_ARANGO_DISTANCE_THRESHOLD=${RETRIEVER_ARANGO_DISTANCE_THRESHOLD:-1}
      - RETRIEVER_ARANGO_LAMBDA_MULT=${RETRIEVER_ARANGO_LAMBDA_MULT:-0.5}
      - RERANKING_STRATEGY=${RERANKING_STRATEGY:-slice}
      - RERANKER_TOP_N=${RERANKER_TOP_N:-3}
      - RERANKING_THRESHOLD=${RERANKING_THRESHOLD:-0.75}
      - CHATQNA_ENFORCE_ABSTENTION=${CHATQNA_ENFORCE_ABSTENTION:-true}
      # The answer leg's INITIAL token budget. It was hardcoded to 800, and a
      # reasoning-capable model burns 400-700 tokens before writing a word --
      # every answer hit the length cap, was thrown away, and was re-called at
      # 3200 by the adaptive ladder: two calls per question, the first one
      # entirely wasted. max_tokens is a CAP, not a reservation, so a model
      # that needs less never pays for it.
      - OKF_RAGAS_ANSWER_MAX_TOKENS=${OKF_RAGAS_ANSWER_MAX_TOKENS:-5000}
      # Liveness horizon (NOT a job deadline): a reachable running job is
      # never timed out; this bounds only the unreachable-sidecar retries.
      # Cancel is the user's call (David 2026-10-18).
      - OKF_RAGAS_LONG_TIMEOUT_MS=${OKF_RAGAS_LONG_TIMEOUT_MS:-3600000}
      - OKF_RAGAS_JOB_POLL_MS=${OKF_RAGAS_JOB_POLL_MS:-3000}
      # The benchmark answer leg serves with the deployment's chat contract:
      # a pinned CHATQNA_SYSTEM_PROMPT must reach okf-server too, or the
      # run scores a different answerer than the one users get (2026-10-19).
      - CHATQNA_SYSTEM_PROMPT=${CHATQNA_SYSTEM_PROMPT:-}
      - OKF_CURATION_TIMEOUT_MS=${OKF_CURATION_TIMEOUT_MS:-}
      - OKF_CURATION_LANES=${OKF_CURATION_LANES:-}
      # Story 1-8g-p: whole-corpus TOPIC-LINK AUTHORING. The import wizard runs
      # it automatically and the editor re-runs it on demand; it authors the
      # cross-links a corpus that never cites itself is born without. Generic
      # by construction (no domain lexicon), so it behaves identically for any
      # subject matter. Set OKF_TOPIC_LINK_ENABLED=0 to skip the import-time
      # pass (the LLM cost is the reason to switch it off).
      - OKF_TOPIC_LINK_ENABLED=${OKF_TOPIC_LINK_ENABLED:-true}
      - OKF_TOPIC_LINK_TIMEOUT_MS=${OKF_TOPIC_LINK_TIMEOUT_MS:-}
      - OKF_TOPIC_LINK_LANES=${OKF_TOPIC_LINK_LANES:-}
      - OKF_TOPIC_LINK_BATCH=${OKF_TOPIC_LINK_BATCH:-}
      - OKF_TOPIC_LINK_MAX_PER_CONCEPT=${OKF_TOPIC_LINK_MAX_PER_CONCEPT:-}
      # Stuck-parsed reaper signals (claim-stamp semantics): a claimed row with
      # no terminal callback after REAP_GRACE_MS, or one claimed too many
      # times, is dead-lettered. WAITING rows are never reaped.
      - OKF_INGEST_WORKER_REAP_GRACE_MS=${OKF_INGEST_WORKER_REAP_GRACE_MS:-3600000}
      - OKF_INGEST_WORKER_MAX_CLAIMS=${OKF_INGEST_WORKER_MAX_CLAIMS:-8}
      # Story 4.8-amend: content-only chunking — the worker POSTs the concept's
      # markdown DIRECTLY to dataprep (no doc-repo files doc). Empty default =
      # fail-closed; the controller refuses every callback without a secret
      # configured, so the .env / deployment MUST set both ends to the same value.
      - DATAPREP_URL=${DATAPREP_URL:-http://dataprep-arango-service:5000}
      - OKF_INTERNAL_SECRET=${OKF_INTERNAL_SECRET:-}
      # Server-side crawl→OKF conversion: max crawled-source file size (MB).
      # Authoritative pre-flight against doc-repo Content-Length. Default
      # 10240 (10 GB) in the service when unset.
      - OKF_MAX_CRAWL_SOURCE_MB=${OKF_MAX_CRAWL_SOURCE_MB:-}
      # Fine-grained per-page/per-flush conversion logging when =1.
      - OKF_CONVERSION_DEBUG=${OKF_CONVERSION_DEBUG:-}
      # Import pipeline parallelism (perf 2026-09-05): per-concept import
      # lanes in ingest-service. PAIRED with the pii-service's
      # PII_WEB_CONCURRENCY — import lanes above the sidecar's worker count
      # queue instead of adding throughput (!1080). Both ≈ min(16, cores/2);
      # 4/4 is a floor for a 24-core host, which measured ~18% utilisation.
      # Every import logs the capacity it got ("OKF import lane capacity").
      - OKF_IMPORT_CONCURRENCY=${OKF_IMPORT_CONCURRENCY:-4}
      # ================================================================
      # !1073 — the knobs `env` documents as operator-facing but never
      # actually reached a container. There is NO env_file: anywhere in this
      # file, so a variable absent from a service's environment: block is
      # unreachable by definition: setting it in .env did nothing, silently.
      # All 26 below are read by okf-server (grep-verified against the code,
      # not inferred from the name). Defaults are the SERVICE's own defaults,
      # repeated here so `env` and compose cannot disagree.
      #
      # The 27th and 28th documented OKF_* vars — OKF_SEARCH_STYLE and
      # OKF_FRONTMATTER_TAG_BATCH_SIZE — are deliberately NOT wired: nothing
      # in the codebase reads either (spec 1-6 assigns OKF_SEARCH_STYLE to the
      # retriever, but the overlay never reads it). Wiring them would put a
      # live-looking variable in the container that changes nothing, which is
      # worse than the current honest absence. Filed as unimplemented.
      # ================================================================
      # --- ingest-worker timing (workers/ingestWorker.js) ---
      - OKF_INGEST_WORKER_JOB_POLL_MS=${OKF_INGEST_WORKER_JOB_POLL_MS:-5000}
      - OKF_INGEST_WORKER_JOB_TIMEOUT_MS=${OKF_INGEST_WORKER_JOB_TIMEOUT_MS:-1800000}
      - OKF_INGEST_WORKER_CYCLE_TIMEOUT_MS=${OKF_INGEST_WORKER_CYCLE_TIMEOUT_MS:-1800000}
      - OKF_INGEST_WORKER_SWEEP_GRACE_MS=${OKF_INGEST_WORKER_SWEEP_GRACE_MS:-3600000}
      # --- size-adaptive job windows (spec #1020 §5.9) ---
      - OKF_JOB_WINDOW_ADAPTIVE=${OKF_JOB_WINDOW_ADAPTIVE:-false}
      - OKF_JOB_WINDOW_FLOOR_MS=${OKF_JOB_WINDOW_FLOOR_MS:-1800000}
      - OKF_JOB_WINDOW_MAX_MS=${OKF_JOB_WINDOW_MAX_MS:-21600000}
      - OKF_JOB_WINDOW_SEC_PER_CHUNK_MS=${OKF_JOB_WINDOW_SEC_PER_CHUNK_MS:-5000}
      # --- claim / scheduling (fair claim, spec #1020 §5.2) ---
      - OKF_CLAIM_STRATEGY=${OKF_CLAIM_STRATEGY:-fifo}
      - OKF_REPO_INGEST_CAP=${OKF_REPO_INGEST_CAP:-0}
      # --- 5xx kick backoff (spec #1020 §5.5) ---
      - OKF_KICK_BACKOFF_BASE_MS=${OKF_KICK_BACKOFF_BASE_MS:-0}
      - OKF_KICK_BACKOFF_MAX_MS=${OKF_KICK_BACKOFF_MAX_MS:-900000}
      # --- import caps (ingest-service / converters) ---
      - OKF_INGEST_MAX_CONCEPTS=${OKF_INGEST_MAX_CONCEPTS:-1000}
      - OKF_INGEST_MAX_ZIP_BYTES=${OKF_INGEST_MAX_ZIP_BYTES:-268435456}
      - OKF_MAX_CONCURRENT_CONVERSIONS=${OKF_MAX_CONCURRENT_CONVERSIONS:-2}
      - OKF_XLSX_ROWS_PER_CONCEPT=${OKF_XLSX_ROWS_PER_CONCEPT:-200}
      - OKF_CSV_ROWS_PER_CONCEPT=${OKF_CSV_ROWS_PER_CONCEPT:-200}
      # --- retrieval routing (config.js) ---
      - OKF_RETRIEVAL_MODE=${OKF_RETRIEVAL_MODE:-legacy}
      - OKF_RETRIEVAL_MAX_FANOUT_GRAPHS=${OKF_RETRIEVAL_MAX_FANOUT_GRAPHS:-5}
      - OKF_RETRIEVAL_SPINE_MAX_HOPS=${OKF_RETRIEVAL_SPINE_MAX_HOPS:-2}
      - OKF_RETRIEVAL_EXTRACTED_HOP_CAP=${OKF_RETRIEVAL_EXTRACTED_HOP_CAP:-1}
      - OKF_RETRIEVAL_CANDIDATE_CAP_PER_GRAPH=${OKF_RETRIEVAL_CANDIDATE_CAP_PER_GRAPH:-50}
      - OKF_RETRIEVAL_CANDIDATE_CAP_GLOBAL=${OKF_RETRIEVAL_CANDIDATE_CAP_GLOBAL:-200}
      # --- frontmatter (frontmatter-service / retrieval-config-service) ---
      - OKF_FRONTMATTER_VALIDATE_BATCH_SIZE=${OKF_FRONTMATTER_VALIDATE_BATCH_SIZE:-4}
      # --- ingest settle lease (lifecycle-service) ---
      - OKF_SETTLE_LEASE_MS=${OKF_SETTLE_LEASE_MS:-600000}
    networks:
      - genieai_network
    deploy:
      replicas: ${OKF_ENABLED:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  pii-service:
    # OKF feature flag: parked with the okf-server (see okf-server block).
    profiles: ["okf"]
    logging: *fluent-logging
    # Harden: no privilege escalation (same convention; kics Security Opt Not Set).
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      # uvicorn worker processes (GIL-bound NER needs processes, not threads;
      # raise on many-core deployments)
      - PII_WEB_CONCURRENCY=${PII_WEB_CONCURRENCY:-4}
      # Max chars per analyze() call. Bounds how long ONE scan holds the GIL,
      # which is what starves uvicorn's supervisor into SIGKILLing the worker
      # (measured 2026-10-13: an 850 KB page killed the worker 8/8 times).
      # Sized so a region stays under the supervisor's 5 s liveness ping;
      # lower it on a slower host, raise it only if a region is provably <5 s.
      - PII_REGION_MAX_CHARS=${PII_REGION_MAX_CHARS:-50000}
    build:
      context: components/pii-service/
      dockerfile: Dockerfile
    image: ${GENIE_AI_PII_SERVICE_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-pii-service}:${GENIE_AI_PII_SERVICE_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    # Internal only (never publicly routed) — the okf-server calls it
    # container-to-container on genieai_network, same as doc-repo -> dataprep.
    # Healthcheck hits /ready (not /health) so the spaCy model loads at startup,
    # not on the first scan request (code-review #9).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - genieai_network
    deploy:
      replicas: ${OKF_ENABLED:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  # Story 8-6 (ADR-okf-043) — RAGAS benchmarking sidecar. Stateless Python
  # (ragas 0.4.3, deps frozen to the tests/rag-benchmarks runner's pins):
  # testset generation, metric evaluation, and xlsx serialization. INTERNAL
  # only — the okf-server calls it container-to-container on genieai_network
  # (like pii-service); the Lab degrades to honest 503 RAGAS_UNAVAILABLE
  # when it is absent. Judge/embedder point at the deployment's local
  # vLLM/TEI (RAGAS_JUDGE_* / RAGAS_EMBED_* below); NO feature is indexed
  # on a specific model — minimums live in the spec's model-requirements.
  ragas-service:
    # OKF feature flag: parked with the okf-server (see okf-server block).
    profiles: ["okf"]
    logging: *fluent-logging
    # Harden: no privilege escalation from the container — the file's
    # convention (kics Security Opt Not Set).
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      # Shared secret with okf-server (fail-closed when unset). Defaults to
      # the dataprep-callback secret — one deployment-wide internal secret.
      - RAGAS_INTERNAL_SECRET=${RAGAS_INTERNAL_SECRET:-${OKF_INTERNAL_SECRET:-}}
      # Judge LLM (OpenAI-compatible) — defaults inherit the deployment's
      # LLM config; override per endpoint freely (model-requirements minimums).
      - RAGAS_JUDGE_BASE_URL=${RAGAS_JUDGE_BASE_URL:-http://vllm:8000/v1}
      - RAGAS_JUDGE_MODEL=${RAGAS_JUDGE_MODEL:-${VLLM_LLM_MODEL_ID:-}}
      - RAGAS_JUDGE_API_KEY=${RAGAS_JUDGE_API_KEY:-${VLLM_API_KEY:-}}
      # The judge's context window — RAGAS sizes its KG-input cap from it
      # ('auto': pair-safe derivation, see ragas_engine._doc_char_cap), so
      # transform prompts always fit whatever model is selected.
      - RAGAS_JUDGE_CONTEXT_TOKENS=${RAGAS_JUDGE_CONTEXT_TOKENS:-${VLLM_MAX_MODEL_LEN:-65536}}
      # Embedder (answer_relevancy + testset KG transforms). Default
      # dialect is TEI-native ({base}/embed, the project's TEI-behind-
      # nginx contract); RAGAS_EMBED_API=openai switches to any
      # OpenAI-compatible embeddings endpoint (/embeddings).
      - RAGAS_EMBED_BASE_URL=${RAGAS_EMBED_BASE_URL:-http://tei-embedding-server:80}
      - RAGAS_EMBED_MODEL=${RAGAS_EMBED_MODEL:-${EMBEDDING_MODEL_ID:-}}
      - RAGAS_EMBED_API=${RAGAS_EMBED_API:-tei}
      # Disk judge cache (2026-10-18): responses keyed by prompt+params
      # persist on the ragas_llm_cache VOLUME — repeat generations of the
      # same repos skip the whole KG phase and suite re-runs re-judge only
      # what changed, surviving container recreates. 0 disables; the dir is
      # best-effort only.
      - RAGAS_LLM_CACHE=${RAGAS_LLM_CACHE:-1}
      - RAGAS_LLM_CACHE_DIR=${RAGAS_LLM_CACHE_DIR:-/tmp/ragas-llm-cache}
      # Migration switch for the 2026-10-21 cache-key fix (the judge identity
      # in the key now carries the endpoint). 1 lets a deployment whose judge
      # has NOT been repointed replay the entries the previous key wrote, and
      # migrates each one to the new key on read. 0 = strict (default).
      - RAGAS_LLM_CACHE_LEGACY=${RAGAS_LLM_CACHE_LEGACY:-0}
      # Judge call discipline (2026-10-21): the upstream answered 82 of ~500
      # synthesis calls with 429 and 35 questions were dropped. The client
      # now caps its own concurrency and retries a 429 with jitter.
      - RAGAS_LLM_MAX_CONCURRENCY=${RAGAS_LLM_MAX_CONCURRENCY:-8}
      - RAGAS_LLM_MAX_RETRIES=${RAGAS_LLM_MAX_RETRIES:-5}
      # ragas's usage telemetry (2026-10-26). ragas 0.4.3 POSTs every prompt's
      # usage event to https://t.explodinggradients.com from INSIDE the async
      # prompt path, with a 1 s timeout — so it blocks the event loop and the
      # configured concurrency never overlaps. Measured here: a warm CACHE HIT
      # (no model call at all) cost 0.79 s, and 0.008 s with this off — the
      # tax alone was ~50 min of Solar System's ~3,800-prompt graph build. It
      # is also a sovereignty leak: a public-sector deployment must not ship
      # per-call usage telemetry to a third-party endpoint outside it.
      - RAGAS_DO_NOT_TRACK=${RAGAS_DO_NOT_TRACK:-true}
      # Scoring-leg throughput (2026-10-22). The leg used to be hardcoded to
      # ragas's max_workers=8 with one row per evaluate(), so a row's ~13
      # judge calls could never fill the pool: 5.4 min per row, ~8 h for 100.
      # MAX_WORKERS and BATCH_ROWS have to move together — a single row only
      # has ~13 calls to offer the pool. TIMEOUT_SECONDS bounds a stuck
      # judge call; a call that exceeds it scores NULL for that row
      # (raise_exceptions=False), which is silent.
      - RAGAS_EVAL_MAX_WORKERS=${RAGAS_EVAL_MAX_WORKERS:-8}
      - RAGAS_EVAL_BATCH_ROWS=${RAGAS_EVAL_BATCH_ROWS:-1}
      - RAGAS_EVAL_TIMEOUT_SECONDS=${RAGAS_EVAL_TIMEOUT_SECONDS:-600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ragas_llm_cache:/tmp/ragas-llm-cache
    build:
      context: components/ragas-service/
      dockerfile: Dockerfile
    image: ${GENIE_AI_RAGAS_SERVICE_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-ragas-service}:${GENIE_AI_RAGAS_SERVICE_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - genieai_network
    deploy:
      replicas: ${OKF_ENABLED:-0}
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  document-repository:
    # least-privilege hardening (SAST wave-4): no capabilities beyond those listed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging: *fluent-logging
    depends_on:
      arango-vector-db:
        condition: service_healthy
      keycloak-config:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: components/
      dockerfile: document-repository/Dockerfile
    image: ${GENIE_AI_DOCUMENT_REPOSITORY_IMAGE:-${GENIE_AI_REGISTRY:-registry.opensource.unicc.org/un/itu/genie-ai}/genie-ai-document-repository}:${GENIE_AI_DOCUMENT_REPOSITORY_IMAGE_TAG:-${GENIE_AI_GLOBAL_TAG:-latest}}
    environment:
      # Secrets (required, no defaults in code)
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_URL=http://arango-vector-db:8529
      - KEYCLOAK_URL=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}/auth
      # Split-URL OIDC: KEYCLOAK_PUBLIC_URL overrides the expected issuer when
      # JWKS is fetched via a different (internal) URL; KEYCLOAK_JWKS_URL pins
      # the JWKS fetch host; KEYCLOAK_BROWSER_ISSUER adds another accepted
      # issuer alongside it. No-op when unset (cloud).
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-}
      - KEYCLOAK_BROWSER_ISSUER=${KEYCLOAK_BROWSER_ISSUER:-}
      - KC_REALM=${KEYCLOAK_REALM:-genie}
      - KC_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - VL_QUERY_TIMEOUT_MS=${VL_QUERY_TIMEOUT_MS:-30000}
      # Mirrors the backend block — same operator-override path for
      # VICTORIALOGS_URL + VICTORIALOGS_TENANT_ID so a staging-VL override
      # applies to both services that read from the MELT seam.
      - VICTORIALOGS_URL=${VICTORIALOGS_URL:-http://victorialogs:9428}
      - VICTORIALOGS_TENANT_ID=${VICTORIALOGS_TENANT_ID:-0:0}
      # OKF publish bundle-ingest body cap (base64-in-JSON, 10× the app's 10mb
      # JSON cap — see upload.bundleMaxBodyMb in src/config/appConfig.js)
      - OKF_BUNDLE_MAX_MB=${OKF_BUNDLE_MAX_MB:-100}
      # TLS verification for document-repository → NGINX OIDC discovery/JWKS fetches.
      # Default: 1 (strict, for production). Set to 0 in .env for dev with self-signed certs.
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      # OpenTelemetry — SDK is no-op when ENABLE_OBSERVABILITY != 1. Both
      # flags must mirror the backend block; the doc-repo Winston VL
      # transport depends on the OTel LoggerProvider being initialised or
      # it pushes to a null sink. The Collector's fluentd receiver still
      # ships the doc-repo stdout regardless (resource processor on the
      # Collector side stamps service.name from container attributes).
      - ENABLE_OBSERVABILITY=${ENABLE_OBSERVABILITY:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # OTel Resource `service.name` is HARDCODED in tracing.js to match
      # the Compose block name (`document-repository`). The
      # OTel-standard `OTEL_SERVICE_NAME` env var mirrors it so the
      # shared `logger.js` OTel meter resolves to the right scope.
      - OTEL_SERVICE_NAME=document-repository
      # Source code constants are the single source of truth; renaming
      # requires updating the Compose block AND the tracing.js constant
      # together.
    # Allow document-repository to resolve NGINX_PUBLIC_DOMAIN (e.g. localhost) to the
    # Docker host, so OIDC discovery and JWKS fetches reach NGINX for JWT validation.
    extra_hosts:
      - "${NGINX_PUBLIC_DOMAIN:-localhost}:host-gateway"
    # Internal only - no host port mapping needed
    # ports:
    #   - "${DOC_REPO_PORT:-3001}:3001"
    networks:
      - genieai_network
    volumes:
      - doc_repo_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.genieai == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

