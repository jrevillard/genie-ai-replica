worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stderr;
  sendfile on;
  client_max_body_size 50m;

  server {
    listen ${NGINX_PORT};

    # Runtime-mounted config: CSS tokens, brand JSON, runtime-generated config.js
    # The ^~ modifier is required to win against the regex location below —
    # without it, /config/theme-variables.css would still get the immutable cache.
    location ^~ /config/ {
      root /app/dist;
      add_header Cache-Control "no-cache, must-revalidate" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }

    # Cache: immutable for hashed assets (excludes .map source maps)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webmanifest)$ {
      root /app/dist;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }

    # Health endpoint
    location = /health {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      return 200 '{"status":"ok"}';
    }

    # SPA fallback — always revalidate index.html so clients pick up new asset hashes
    location / {
      root /app/dist;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      try_files $uri $uri/ /index.html;
    }
  }
}
