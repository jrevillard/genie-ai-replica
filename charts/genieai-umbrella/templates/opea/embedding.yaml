{{/*
  embedding OPEA orchestrator: two endpoint envs (EMBEDDING_MODEL_ENDPOINT and
  TEI_EMBEDDING_ENDPOINT) that resolve to the same gpu-path; HF_TOKEN +
  VLLM_API_KEY from the vllm-api-key Secret; OPEA_SSL_SKIP_VERIFY from
  the explicit opea.gpu.skipTlsVerify knob (NOT inferred from the node
  URL scheme — see the opeaSslSkipVerify helper). Container/listen port
  6000; healthcheck hits /health on that port.
*/}}
{{- if .Values.opea.enabled -}}
{{- $vals := deepCopy .Values -}}
{{- $embeddingEndpoint := include "genieai-umbrella.opeaGpuEndpoint" (dict "root" . "path" "embedding") -}}
{{- $urls := list
    (dict "name" "EMBEDDING_MODEL_ENDPOINT" "value" $embeddingEndpoint)
    (dict "name" "TEI_EMBEDDING_ENDPOINT" "value" $embeddingEndpoint)
    (dict "name" "EMBEDDING_MODEL_ID" "value" (.Values.opea.embedding.modelId | default "BAAI/bge-large-en-v1.5"))
    (dict "name" "OPEA_SSL_SKIP_VERIFY" "value" (include "genieai-umbrella.opeaSslSkipVerify" .))
    (dict "name" "ENABLE_OBSERVABILITY" "value" (include "genieai-umbrella.observabilityEnabledFlag" .))
    (dict "name" "OTEL_EXPORTER_OTLP_ENDPOINT" "value" (include "genieai-umbrella.otlpEndpoint" .))
-}}
{{- $secretEnv := include "genieai-umbrella.gpuApiKeyEnv" (dict "keys" (list "HF_TOKEN" "VLLM_API_KEY")) | fromJsonArray -}}
{{- /* opea.embedding.env — the same operator-facing map the other five
orchestrators carry. Without it an overlay setting
opea.embedding.env was silently dropped: the value merged into
.Values, no template read it, and the rendered Deployment was
byte-identical to one without it. */ -}}
{{- $opeaEnvRows := include "genieai-umbrella.envMapRows" (.Values.opea.embedding.env | default dict) | fromJsonArray -}}
{{- $svcVals := dict
    "image" (dict "repository" "genie-ai-embedding" "tag" "main")
    "port" 6000
    "resources" (dict "requests" (dict "cpu" "100m" "memory" "256Mi") "limits" (dict "cpu" "1" "memory" "1Gi"))
    "env" (concat $urls $secretEnv $opeaEnvRows)
    "probes" (dict
      "readiness" (dict "httpGet" (dict "path" "/health" "port" 6000) "initialDelaySeconds" 30 "periodSeconds" 15)
      "liveness"  (dict "httpGet" (dict "path" "/health" "port" 6000) "initialDelaySeconds" 60 "periodSeconds" 30)
      "startup"   (dict "httpGet" (dict "path" "/health" "port" 6000) "failureThreshold" 30 "periodSeconds" 10)
    )
-}}
{{- $_ := set $vals.services "embedding" $svcVals -}}
{{- $ctx := dict "name" "embedding" "component" "embedding" "Values" $vals "Chart" .Chart "Release" .Release -}}
{{- include "genieai-umbrella.serviceDeployment" $ctx }}
---
apiVersion: v1
kind: Service
metadata:
  name: embedding
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "embedding") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 6000
      targetPort: 6000
  selector:
    {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "embedding") | nindent 4 }}
{{- end -}}
