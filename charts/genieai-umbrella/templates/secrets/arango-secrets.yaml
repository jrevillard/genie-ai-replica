{{- if and .Values.secrets.sealedSecrets.enabled .Values.data.arangodb.enabled -}}
{{- /*
  SealedSecret templates for the ArangoDeployment bootstrap credentials.
  kube-arangodb expects a specific key per reference: the root-password
  Secret (spec.bootstrap.passwordSecretNames.root) must carry `password`
  (basic-auth secret), and the JWT Secret (spec.auth.jwtSecretName) must
  carry `token` — each encryptedData below carries the key its operator
  reference requires.

  The encryptedData values are the base64 sentinel `UExBQ0VIT0xERVIr`
  (decodes to the string "PLACEHOLDER+"). The sealed-secrets controller
  cannot decrypt a sentinel — it marks the SealedSecret
  `status.conditions[type=Synced].status=False` (reason ErrorDecrypt) —
  so the underlying K8s Secret never materializes until an operator
  re-seals real values with kubeseal against the cluster's public cert:
      1. kubeseal --fetch-cert --context <cluster> > pub-cert.pem
      2. Write a plain Secret manifest with the real values (or encrypt
         individual values with `kubeseal --raw`), then:
         kubeseal --cert pub-cert.pem --scope cluster-wide \
           --name <secret-name> < secret.yaml > sealed.yaml
  Paste the encryptedData entries from sealed.yaml here before
  `helm install` — a still-sentinel release fails the pre-upgrade drift
  hook and the helm-test materialization check at runtime.
*/ -}}
{{- range $secretName := list "arango-root-secret" "arango-jwt-secret" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" $.Chart "Release" $.Release "Values" $.Values "component" "sealed-secret") | nindent 4 }}
spec:
  {{- if eq $secretName "arango-root-secret" }}
  encryptedData:
    username: UExBQ0VIT0xERVIr     # PLACEHOLDER+ — RE-SEAL before helm install
    password: UExBQ0VIT0xERVIr     # PLACEHOLDER+ — RE-SEAL before helm install
  {{- else if eq $secretName "arango-jwt-secret" }}
  encryptedData:
    token: UExBQ0VIT0xERVIr         # PLACEHOLDER+ — RE-SEAL before helm install
  {{- end }}
{{- end -}}
{{- end -}}
