{{- /* REGULAR resource — do NOT add any helm.sh/hook:* annotation; a future
       Hook annotation would implicitly enable before-hook-creation and delete
       this Namespace before every reinstall (Helm 4). */ -}}
{{- /* Component label context — pass the per-template component name
       ("namespace" here) into the labels helper so both
       app.kubernetes.io/component and genieai.io/component pick it up
       from a single .component lookup. */ -}}
{{- $componentValues := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "namespace" -}}
{{- /* The release namespace is authoritative: resources install where the
       release lives, and a values-side namespace that diverges from it
       would label the wrong namespace and strand the release Secret.
       `namespace` in values exists for templates that must SPELL OUT a
       target namespace; it must equal the release namespace. */ -}}
{{- $ns := .Release.Namespace -}}
{{- /* Fail fast when the legacy values key diverges from the release
       namespace: later-tier templates still read .Values.namespace, and a
       divergence silently splits the install across two namespaces.
       this guard fires only when the values key is explicitly set AND
       mismatched — values.yaml ships a default so default installs never
       trip it. */ -}}
{{- if and .Values.namespace (ne .Values.namespace .Release.Namespace) -}}
{{- fail (printf "values 'namespace' (%s) must equal the release namespace (%s) — set namespace: %s in your values-override, OR install with -n %s" .Values.namespace .Release.Namespace .Release.Namespace .Release.Namespace) -}}
{{- end -}}
{{- /* Each data tier declares the Secret names it needs in its
       `secrets:` list (e.g. arango-root-secret, keycloak-db-credentials).
       The chart does not materialize these Secrets — operators bring them
       in the target namespace via their preferred secret backend. */ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  # A REGULAR resource, not a helm hook: Helm 4 applies implicit
  # before-hook-creation semantics to hooks, deleting any pre-existing
  # object with the hook identity before applying — including the
  # namespace `--create-namespace` just provisioned and the release
  # Secret stored inside it. As a regular resource this manifest
  # server-side-applies onto the namespace `--create-namespace` creates,
  # merging the labels below. Install therefore requires
  # `helm install -n <ns> --create-namespace`; other pre-install hooks
  # in the chart then find the namespace already present.
  labels:
    {{- include "genieai-common.labels" $componentValues | nindent 4 }}
    genieai.io/cluster-profile: {{ .Values.clusterProfile | default "dev" | quote }}
    app.kubernetes.io/part-of: genieai
    # Advertise K8s Pod Security Standards at the namespace level so admission
    # controllers refuse pods without required securityContext.
    pod-security.kubernetes.io/enforce: restricted
    # Pin to a specific version rather than `latest`. Across cluster upgrades
    # `latest` silently changes the policy version and may start rejecting
    # pods that previously scheduled without warning.
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.33
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.33
