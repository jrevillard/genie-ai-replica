---
# The BFF's OKF hop and the agent's OKF capability both dial okf-server on
# 3002. The chart's backend NetworkPolicy carries that egress row ONLY when
# okf.enabled=true — and the DEPLOYED release (the baseline this campaign
# repoints) has the OKF tier off, so the row is absent and the flow is
# denied by the default-deny policy. NetworkPolicy egress is a UNION of the
# rules of every policy that selects the pod, so this run-scoped policy adds
# the two missing edges without touching the chart's policy. It is deleted
# with the run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2170-okf-egress
  namespace: genieai
  labels:
    e2170.genieai.io/run: "2170"
spec:
  podSelector:
    matchExpressions:
      - key: genieai.io/component
        operator: In
        values:
          - backend
      - key: app.kubernetes.io/name
        operator: In
        values:
          - e2170-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: okf-server
      ports:
        - protocol: TCP
          port: 3002
---
# The OKF publish path stores the minted bundle in the document-repository
# (the okf-server's own "bundle store failed (doc-repo status n/a): connect
# ECONNREFUSED" on the live publish). The chart's document-repository
# NetworkPolicy trusts the proxy / backend / dataprep / chatqna pods on
# 3001 — the okf-server pod is none of them, so the flow is denied. Ingress
# is a UNION of the rules of every policy that selects the pod, so this
# run-scoped policy adds the missing edge (okf-server -> doc-repo:3001)
# without touching the chart's policy. It is deleted with the run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2170-okf-docrepo-ingress
  namespace: genieai
  labels:
    e2170.genieai.io/run: "2170"
spec:
  podSelector:
    matchLabels:
      genieai.io/component: documentRepository
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: okf-server
      ports:
        - protocol: TCP
          port: 3001
