# Diagnostic bench (throwaway branch): isolate WHY a CI job's trace upload is
# refused with 403. No image builds, no lint/test stages: only the probes.
stages: [probe]

.probe:
  image: alpine:3.22
  tags: [docker]
  allow_failure: true
  timeout: 15m
  variables:
    GIT_DEPTH: "0"

# P1: silence — 240 s with no output at all
probe:silent:
  extends: .probe
  stage: probe
  script:
    - echo "P1 silent start $(date -u +%T)"
    - sleep 240
    - echo "P1 silent end $(date -u +%T)"

# P2: a line every 10 s for 240 s
probe:chatty:
  extends: .probe
  stage: probe
  script:
    - |
      for i in $(seq 1 24); do echo "P2 chatty $i $(date -u +%T)"; sleep 10; done

# P3: one burst of ~300 KB, then silence (the git-clean / buildx pattern)
probe:burst:
  extends: .probe
  stage: probe
  script:
    - echo "P3 burst start $(date -u +%T)"
    - seq 1 20000
    - echo "P3 burst done $(date -u +%T)"
    - sleep 180
    - echo "P3 burst end $(date -u +%T)"

# P4: the burst, then a line every 10 s (does output afterwards save it?)
probe:burst-chatty:
  extends: .probe
  stage: probe
  script:
    - echo "P4 burst start $(date -u +%T)"
    - seq 1 20000
    - echo "P4 burst done $(date -u +%T)"
    - |
      for i in $(seq 1 18); do echo "P4 tick $i $(date -u +%T)"; sleep 10; done

# P5: a much larger burst (~3 MB) — the 1 MB chunk limit / trace size limit
probe:huge:
  extends: .probe
  stage: probe
  script:
    - echo "P5 huge start $(date -u +%T)"
    - seq 1 200000
    - echo "P5 huge done $(date -u +%T)"
    - sleep 120
    - echo "P5 huge end $(date -u +%T)"
