    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: "0.2.182"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: "okf-server"
    genieai.io/component: "okf-server"
    genieai.io/managed-by: helm
spec:
  replicas: 1
  progressDeadlineSeconds: 2400
  selector:
    matchLabels:
      app.kubernetes.io/name: genieai-umbrella
      app.kubernetes.io/instance: genieai
      app.kubernetes.io/component: "okf-server"
      genieai.io/component: "okf-server"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: genieai-umbrella
        app.kubernetes.io/instance: genieai
        app.kubernetes.io/component: "okf-server"
        genieai.io/component: "okf-server"
    spec:
      # Pod-level securityContext: seccompProfile is part of the
      # `restricted` profile the services opt into (the namespace itself
      # enforces `baseline` — see _model-deployment.tpl for why it cannot
      # go stricter). The
      # runAsUser/runAsNonRoot defaults that previously sat here
      # are removed: each service declares its own identity via
      # `securityContext` (container level) in values.yaml, pinned to
      # the USER its image ships (frontend 101, clamav 1000, backend
      # 1000, the OPEA wrappers' `user`). Some OPEA wrapper images
      # ship no USER directive and run as root — the container-level
      # drop below is safe on them (bare interpreters, no
      # cap-dependent entrypoints); the non-root posture of the
      # operator-managed tiers is tracked separately.
      #
      # `podSecurityContext` (e.g. fsGroup on documentRepository) is
      # merged into the same `securityContext:` block — emitting two
      # sibling `securityContext:` keys is invalid YAML and the helm
      # post-render unmarshaller rejects it with 'mapping key
      # "securityContext" already defined'.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: okf-server
          image: registry.opensource.unicc.org/un/itu/genie-ai/genie-ai-okf-server:feat-agentic-foundations-prd-820fc9d7
