apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "vllm" "tier" "gpu" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "genieai.selectorLabels" (dict "name" "vllm" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.gpu.vllm.port }}
      targetPort: {{ .Values.gpu.vllm.port }}
      protocol: TCP
      name: http
