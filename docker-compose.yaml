      RETRIEVER_HYBRID_RETRIEVAL_ENABLED: ${RETRIEVER_HYBRID_RETRIEVAL_ENABLED:-true}
      RETRIEVER_HYBRID_RRF_K: ${RETRIEVER_HYBRID_RRF_K:-60}
      RETRIEVER_SUMMARIZER_ENABLED: ${RETRIEVER_SUMMARIZER_ENABLED:-false}
      TEI_EMBEDDING_ENDPOINT: ${EMBEDDING_SERVICE_URL:-http://tei:80}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://vllm:8000}
    healthcheck:
      interval: 15s
      retries: 10
      start_period: 120s
      test:
      - CMD-SHELL
      - curl -sf http://localhost:7000/health || exit 1
      timeout: 10s
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genie-ai-retriever-arango:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - opea
    restart: unless-stopped
  tei:
    deploy:
      placement:
        constraints:
        - node.labels.gpu == true
      replicas: ${GPU_MODEL_REPLICAS:-${DEPLOY_OPEA:-1}}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 30
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${EMBEDDING_MODEL_ID:-BAAI/bge-base-en-v1.5} --auto-truncate"
    environment:
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
