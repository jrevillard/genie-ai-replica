# CareLink V1 pipeline for Health-Innov8AI-branch.
#
# Same conventions as the .gitlab-ci.yml on main: stages lint / test / build,
# node:20-alpine and python:3.11-slim, untagged runners, `npm ci` with a cache
# keyed on the lockfile, interruptible jobs. It runs only the checks this code
# base passes. The pipeline on main is written for main's tree (mobile app,
# contract tests, release documents, image builds), which this branch does not
# have, so most of its jobs would fail here for missing files.
#
# These are the same checks as the blocking jobs in .github/workflows/ci.yml.
# Not run, because the V1 code does not pass them yet: backend lint and tests,
# Ruff on genie-ai-overlay, frontend type-check, Prettier on the backend.

stages:
  - lint
  - test
  - build

# Every push to a branch, every merge request, tags, and manual runs.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.node_base:
  image: node:20-alpine
  interruptible: true

.lint_node:
  extends: .node_base
  stage: lint

.test_node:
  extends: .node_base
  stage: test
  variables:
    NODE_ENV: test

lint:doc-repo:
  extends: .lint_node
  before_script:
    - cd components/document-repository && npm ci --no-audit --no-fund
  script:
    - npm run lint
    - npm run format:check
  cache:
    - key:
        files:
          - components/document-repository/package-lock.json
        prefix: lint-doc-repo
      paths:
        - components/document-repository/node_modules/

lint:shared-lib:
  extends: .lint_node
  before_script:
    - cd components/shared/lib && npm ci --no-audit --no-fund
  script:
    - npm run lint
    - npm run format:check
  cache:
    - key:
        files:
          - components/shared/lib/package-lock.json
        prefix: lint-shared-lib
      paths:
        - components/shared/lib/node_modules/

test:doc-repo:
  extends: .test_node
  before_script:
    - cd components/document-repository && npm ci --no-audit --no-fund
  script:
    - npx jest --ci
  cache:
    - key:
        files:
          - components/document-repository/package-lock.json
        prefix: test-doc-repo
      paths:
        - components/document-repository/node_modules/

test:python:
  image: python:3.11-slim
  stage: test
  interruptible: true
  # Stub-based suites: OPEA is stubbed in the tests, so nothing is installed.
  script:
    - >-
      python3 -m unittest -v
      tests.test_reranker_threshold_floor
      tests.test_strict_grounding
      tests.test_kb_scope_filter
      tests.test_appointment_guard
      tests.test_style_echo_guard

# Install alone is a real gate: `npm ci` fails when the lockfile and
# package.json disagree.
install:backend:
  extends: .node_base
  stage: build
  before_script:
    - cd components/gov-chat-backend
  script:
    - npm ci --no-audit --no-fund
  cache:
    - key:
        files:
          - components/gov-chat-backend/package-lock.json
        prefix: install-backend
      paths:
        - components/gov-chat-backend/node_modules/

# The web app that is deployed (docker-compose.yaml, service frontend).
build:frontend-v2:
  extends: .node_base
  stage: build
  before_script:
    - cd components/genie-ai-frontend-v2 && npm ci --no-audit --no-fund
  script:
    - npm run build
  cache:
    - key:
        files:
          - components/genie-ai-frontend-v2/package-lock.json
        prefix: build-frontend-v2
      paths:
        - components/genie-ai-frontend-v2/node_modules/
