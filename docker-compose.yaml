    depends_on:
      victoriatraces:
        condition: service_healthy
    deploy:
      placement:
        constraints:
        - node.labels.genieai == true
      replicas: ${ENABLE_OBSERVABILITY:-0}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    environment:
    - VICTORIATRACES_URL=http://victoriatraces:10428
    - PORT=10429
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 5s
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:10429/health
      timeout: 5s
    image: ${SWARM_REGISTRY_URL:-localhost:5000}/genieai/tempo-proxy:${IMAGE_TAG:-latest}
    logging: *id001
    networks:
    - genieai_network
    profiles:
    - observability
    restart: unless-stopped
  textgen:
