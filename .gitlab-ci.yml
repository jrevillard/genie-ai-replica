    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths: ["genie-ai-overlay/reranker/**/*", "genie-ai-overlay/core/**/*", "genie-ai-overlay/contracts/**/*", ".gitlab-ci.yml"]
contract:dataprep-arango:
  <<: *contract_template
  needs:
    - job: build:dataprep-arango
      artifacts: true
  variables:
    IMAGE_NAME: "genie-ai-dataprep-arango"
