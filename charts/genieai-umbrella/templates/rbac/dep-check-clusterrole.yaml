{{- /* Cluster-scoped RBAC for the dep-check SA. HOOK-OWNED
       (pre-install,pre-upgrade, weight -30, before-hook-creation) — the
       pre-install dependency-check job runs BEFORE regular resources
       land, so a regular ClusterRole would not exist yet and the job's
       `kubectl get ns` would 403.

       Teardown, stated honestly: `before-hook-creation` is the only
       delete policy, so uninstall removes nothing here; and both objects
       are cluster-scoped, so deleting the release namespace does not GC
       them either. A removed release leaves a dangling ClusterRole +
       ClusterRoleBinding whose subject SA died with the namespace.
       scripts/local-teardown.sh deletes both (by the Helm ownership
       labels); on any other cluster, remove them by hand — the names
       carry the release name, see the metadata below. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "rbac") | nindent 4 }}
  annotations:
    # Hook, not a regular resource: the clusterprofile-detect hook job
    # runs at weight -10 and reads the namespace label with this SA. A
    # regular ClusterRole lands only AFTER every pre-install hook, so the
    # job's `kubectl get ns` 403s and the drift event is never created.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # Cluster-scoped lookups only — NO Secrets, NO ConfigMaps here.
  # The clusterprofile-detect hook reads the namespace label (get);
  # the helm-test pod reads the same label; both need this verb.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "rbac") | nindent 4 }}
  annotations:
    # Hook, not a regular resource: the clusterprofile-detect hook job
    # runs at weight -10 and reads the namespace label with this SA. A
    # regular ClusterRole lands only AFTER every pre-install hook, so the
    # job's `kubectl get ns` 403s and the drift event is never created.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "genieai-common.fullname" . }}-dep-check
subjects:
  - kind: ServiceAccount
    name: {{ include "genieai-common.fullname" . }}-dep-check
    namespace: {{ .Values.namespace }}
