    <use href="#bc-hook" transform="translate(300 130) scale(-1 1)"/>
    <use href="#bc-hook" transform="translate(256 240) scale(0.8)"/>
    <use href="#bc-hook" transform="translate(344 240) scale(-0.8 0.8)"/>
    <use href="#bc-hook" transform="translate(300 350) scale(0.6)"/>
