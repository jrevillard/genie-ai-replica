{{/*
  TEI embedding server. Renders only when both opea.enabled is true and
  opea.gpu.mode is "in-cluster" — the external mode (the laptop default)
  keeps the chart pointing the orchestrators at a remote GPU node and
  emits no model pods at all.

  Compose parity: docker-compose.yaml gpu-models profile, service `tei`
  (lines ~971-1018). The image, entrypoint (shell wrapping
  text-embeddings-router), env, volumes and healthcheck mirror the
  compose service verbatim. The embedding model id is the only knob
  exposed through values (default BAAI/bge-large-en-v1.5, inherited from
  .Values.opea.embedding.modelId so the orchestrators and the in-cluster
  model stay aligned without a second key to keep in sync).

  Image is pulled from ghcr.io unconditionally — the upstream TEI image
  is not mirrored in the GitLab Container Registry the rest of the stack
  pulls from. Same rationale as the kcc/ArangoDB exception in
  templates/data/keycloak-convergence-job.yaml: a conditional
  global.imageRegistry prefix would 404 the pull. An air-gapped site
  must mirror the image and rewrite the reference via insertAgent.

  Model-cache volume is emptyDir (HF weights are large; an emptyDir
  forces a re-download on every pod restart). Choosing a PVC is an
  operator concern — see templates/opea/models/vllm.yaml for the
  broader rationale.
*/}}
{{- if and .Values.opea.enabled (eq .Values.opea.gpu.mode "in-cluster") -}}
{{- $ns := .Values.namespace -}}
{{- $modelId := .Values.opea.embedding.modelId -}}
{{- $res := .Values.opea.models.resources | default (dict "requests" (dict "nvidia.com/gpu" 1) "limits" (dict "nvidia.com/gpu" 1)) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei
  namespace: {{ $ns }}
  labels:
    app: tei
    app.kubernetes.io/name: tei
    app.kubernetes.io/component: tei
    app.kubernetes.io/part-of: genieai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei
  template:
    metadata:
      labels:
        app: tei
    spec:
      nodeSelector:
        gpu: "true"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              text-embeddings-router
              --json-output
              --model-id {{ $modelId }}
              --auto-truncate false
          ports:
            - name: http
              containerPort: 80
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: HF_TOKEN
            - name: RUST_BACKTRACE
              value: ""
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          resources:
            {{- toYaml $res | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hf-cache
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          startupProbe:
            tcpSocket:
              port: 80
            failureThreshold: 48
            periodSeconds: 6
      volumes:
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tei
  namespace: {{ $ns }}
  labels:
    app: tei
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: tei
{{- end -}}
