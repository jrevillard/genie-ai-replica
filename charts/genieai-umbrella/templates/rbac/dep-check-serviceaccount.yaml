apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "rbac") | nindent 4 }}
  # This used to be a pre-install,pre-upgrade hook with weight -30, but the
  # annotation forces the SA into the release namespace — and that
  # namespace is not guaranteed to exist when the hook runs (helm
  # --create-namespace creates it AFTER hooks, and Flux + ArgoCD have
  # their own ordering on top). Result: `namespaces "X" not found` at
  # the first hook. The SA is consumed by the pre-install dep-check Job,
  # so it must exist by then — but the Helm pipeline applies regular
  # resources BEFORE hooks, so making this a regular resource satisfies
  # the same dependency without the namespace ordering problem.
