suite: NetworkPolicy Tests
templates:
  - networking/networkpolicy-default-deny.yaml
  - networking/networkpolicy-dns.yaml
  - networking/networkpolicy-external.yaml
tests:
  # ==========================================
  # Default-Deny Policy Tests
  # Validates: Requirements 4.1
  # ==========================================
  - it: should render default-deny policy with empty podSelector
    template: networking/networkpolicy-default-deny.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: default-deny-all
      - equal:
          path: spec.podSelector
          value: {}

  - it: should have both Ingress and Egress policyTypes in default-deny
    template: networking/networkpolicy-default-deny.yaml
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress

  - it: should not define any ingress or egress rules in default-deny
    template: networking/networkpolicy-default-deny.yaml
    asserts:
      - notExists:
          path: spec.ingress
      - notExists:
          path: spec.egress

  - it: should set correct namespace for default-deny
    template: networking/networkpolicy-default-deny.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: genieai

  # ==========================================
  # DNS Egress Policy Tests
  # Validates: Requirements 4.6
  # ==========================================
  - it: should render DNS egress policy with empty podSelector (applies to all pods)
    template: networking/networkpolicy-dns.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: allow-dns-egress
      - equal:
          path: spec.podSelector
          value: {}

  - it: should have Egress policyType in DNS policy
    template: networking/networkpolicy-dns.yaml
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Egress

  - it: should target kube-system namespace with kube-dns pod selector
    template: networking/networkpolicy-dns.yaml
    asserts:
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels
          value:
            kubernetes.io/metadata.name: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels
          value:
            k8s-app: kube-dns

  - it: should allow port 53 UDP and TCP for DNS
    template: networking/networkpolicy-dns.yaml
    asserts:
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: UDP
            port: 53
      - contains:
          path: spec.egress[0].ports
          content:
            protocol: TCP
            port: 53

  - it: should set correct namespace for DNS policy
    template: networking/networkpolicy-dns.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: genieai

  # ==========================================
  # External Ingress Policy Tests
  # Validates: Requirements 4.4
  # ==========================================
  - it: should render nginx external ingress policy with correct podSelector
    template: networking/networkpolicy-external.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: allow-external-ingress
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: nginx

  - it: should allow nginx ingress from 0.0.0.0/0 on ports 80 and 443
    template: networking/networkpolicy-external.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: 0.0.0.0/0
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 80
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 443

  - it: should have Ingress policyType for nginx external policy
    template: networking/networkpolicy-external.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress

  - it: should render Kong external ingress policy with correct podSelector
    template: networking/networkpolicy-external.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: allow-external-ingress-kong
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: kong

  - it: should allow Kong ingress from 0.0.0.0/0 on port 8010
    template: networking/networkpolicy-external.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: 0.0.0.0/0
      - contains:
          path: spec.ingress[0].ports
          content:
            protocol: TCP
            port: 8010

  - it: should have Ingress policyType for Kong external policy
    template: networking/networkpolicy-external.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress

  - it: should set correct namespace for external ingress policies
    template: networking/networkpolicy-external.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.namespace
          value: genieai
