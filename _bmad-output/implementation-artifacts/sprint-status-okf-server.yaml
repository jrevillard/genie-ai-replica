  1-8g-y-version-toast: proposed # [PROPOSED 2026-10-11] App-wide 'new version available — reload' toast: redeploys silently fork already-open tabs (old JS executes until manual reload; old-client/new-server mismatches look like §w's report). App-wide scope — David's go pending. Defect log §y.
  1-8g-l-fanout-bound-and-fallback: done # [DONE 2026-10-11, David: 'the 3 queries I just ran pass the head test and are answerable but return AI responses... This is a major problem'] The oversized-graph traversal starved EVERY chat answer (9/9 since the retriever restart; 6+3 of David's queries): the Indonesia head CLAIMED all of them (borobudur IS a tag; rank-1), dense+BM25+RRF fused 20 on-point docs in 0.4-0.5s, then the depth-1 traversal scored a 1024-dim cosine per edge over 1,046,217 LINKS_TO edges with NO limit until full materialization → >8s leg budget → _invoke_leg abandoned the thread AND discarded the leg's fused 20 docs (asyncio.wait pending → return []) → fused=0 → honest abstention. Fix: graph-size gate ARANGO_TRAVERSAL_MAX_LINKS=300000 (indonesia skips; gov-uk 80k/ncd 8.5k/slaughterhouse 1.6k keep traversal), per-hop AQL cap ARANGO_TRAVERSAL_MAX_EDGES_PER_NODE=2000 (chunk+node subqueries), traversal sub-budget (wait_for(to_thread) at remaining leg budget -0.75s; overrun/crash → continue WITHOUT enrichment, the leg SUCCEEDS with its fused docs), claimed-leg-empty fallback (supersede-shaped empty fusion → one vector-only retry enable_traversal=false; competition shape doesn't retry), legs= log counts the search set. Tests +7 (fanout 55; suite 909 green — 5 pre-existing env failures). Defect log §l (reactivated from the 2026-10-10 park with 9-trace live proof).
  1-8g-m-label-grounded-suggestions: done # [DONE 2026-10-11, David: 'the tags on the repo head suggested are a very good base for routing queries, whether the repo is large or small' + 'never regress existing features'] suggestTags sampled SORT _key LIMIT 20 (first-20-by-autokey = an alphabetical slice) into ONE LLM call: on the 999-concept Indonesia repo it saw History 14 + Prehistory 5 while the real surface was History 513/Politics 133/Culture 99/Economics 68/Religion 29 — and it FORBIDDENED modern-politics + contemporary-culture for a corpus holding 133 Politics + 99 Culture concepts (a live ROUTE_FORBIDDEN_TAG_MAX veto trap); the prompt never told the LLM what the corpus contains. Fix: ONE COLLECT-by-label query returns the COMPLETE histogram (any repo size) + a bounded per-label sample; label-STRATIFIED sampling (quota + round-robin) so a 20-row budget spans every subject area incl. the 1-concept tail; the distribution rides the prompt with COVERAGE-AS-REQUIREMENT and NEVER-FORBID-WHAT-YOU-CONTAIN; a mechanical zero-LLM forbidden guard (collides a label carrying >=5 concepts; conservative, every drop REPORTED with corpus evidence); coverage + forbidden_rejected ride the response and render in the panel ("derived from 21 of 999 concepts across 7 labels" + why a tag vanished); the dead OKF_FRONTMATTER_SAMPLE_N knob now works. Tests: +12 backend (897/897) +6 frontend (new frontmatter-panel-suggest.test.js — the component had NO test) 1687/1687 + locale parity 14/14. Defect log §m.
