worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stderr;
  sendfile on;
  client_max_body_size 50m;

  server {
    listen ${NGINX_PORT};

    # Security headers (repeated in location blocks — nginx add_header does not inherit)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Cache: immutable for hashed assets (excludes .map source maps)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webmanifest)$ {
      root /app/dist;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }

    # API proxy
    location /api/ {
      proxy_pass ${NGINX_PROXY_TARGET};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }

    # Health endpoint
    location = /health {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      return 200 '{"status":"ok"}';
    }

    # SPA fallback
    location / {
      root /app/dist;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      try_files $uri $uri/ /index.html;
    }
  }
}
