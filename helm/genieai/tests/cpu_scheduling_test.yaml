tests:
  # ============================================================
  # APPLICATION TIER - Deployment Affinity Tests
  # ============================================================
  - it: backend deployment should have CPU node affinity
    template: cpu/backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: cpu-pool
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].operator
          value: In
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: "true"

  - it: backend deployment should NOT have GPU resources
    template: cpu/backend-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].resources.requests.nvidia\.com/gpu
      - isNull:
          path: spec.template.spec.containers[0].resources.limits.nvidia\.com/gpu

  - it: backend deployment should NOT have GPU tolerations
    template: cpu/backend-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.tolerations

