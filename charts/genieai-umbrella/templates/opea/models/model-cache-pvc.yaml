{{/*
  Shared model-weights cache for the in-cluster GPU models (vllm,
  vllm-translation, tei, tei-reranker). Optional — the default is
  emptyDir per pod (fresh HF download on every pod start). Enabling
  the cache mounts one ReadWriteOnce claim on all
  four model Deployments; the single-gpu=true node assumption makes
  RWO sufficient (all model pods co-schedule on that node). Multi-GPU
  clusters need a ReadWriteMany class or one claim per model.
*/}}
{{- $opea := .Values.opea | default dict -}}
{{- $opeaGpu := $opea.gpu | default dict -}}
{{- $opeaModels := $opea.models | default dict -}}
{{- $opeaModelsCache := $opeaModels.cache | default dict -}}
{{- $pluggable := .Values.pluggable | default dict -}}

{{- if and $opea.enabled (eq $opeaGpu.mode "in-cluster") $opeaModelsCache.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: genieai-model-cache
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: genieai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $opeaModelsCache.size | default "100Gi" }}
  # Per-surface override wins, chart-wide pluggable.storageClassName is
  # the fallback — the same precedence every other storage surface uses
  # (the surface key sits beside its storageSize). An empty-string
  # storageClassName inherits the chart-wide value; both empty means the
  # field is omitted and the claim lands on the cluster default class —
  # pinning "" literally would strand the claim, and with it all four
  # model pods that mount it.
  {{- with ($opeaModelsCache.storageClassName | default $pluggable.storageClassName) }}
  storageClassName: {{ . }}
  {{- end }}
{{- end -}}
