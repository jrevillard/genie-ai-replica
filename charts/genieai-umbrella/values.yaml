# GENIE.AI umbrella chart — foundation values.
# The keys below are the ones the current template surface consumes. Service
# tiers (services.*, observability.*, data.*, ingress.*, gpu.*, migration.*)
# and the pluggability surface (secretsBackend / ingressClassName /
# storageClassName / containerRuntime) are added together with the templates
# that consume them — keys no template reads are not declared here.

# Target namespace for tier templates that spell one out. MUST equal the
# release namespace (-n) — the chart fails the render otherwise (the
# Namespace resource and test pod follow .Release.Namespace).
namespace: genieai

global:
  imageRegistry: ""
  imagePullSecrets: []

# Drives chart-derived defaults (replica counts, data-tier topology,
# observability). dev | staging | prod (sovereign is reserved — its branches
# land with the sovereign deployment tier; it is rejected until then).
clusterProfile: dev

# data layer values

# Declared alongside the templates that dereference them:
# the data-tier PVCs read `pluggable.storageClassName`, the realm-import
# redirect URLs read `ingress.host`. Helm nil-pointer-evaluates
# a missing parent map even under `with`/`default` guards — the keys must
# exist in values.yaml before any template reads them.
# Per-environment overrides elaborate both blocks; do not duplicate them here.
pluggable:
  storageClassName: ""                # "" = cluster default storage class

ingress:
  host: genieai.local                 # public hostname for redirect URLs

data:
  # The `enabled` toggles gate the custom resources only; the operator
  # controllers that reconcile them (CNPG, kube-arangodb, keycloak-operator)
  # are cluster bootstrap prerequisites — see the README's Cluster
  # prerequisites section.
  postgres:
    enabled: true
    # CNPG Cluster resources for the keycloak-db (the only Postgres; the edge
    # tier is Envoy Gateway, not Kong).
    instances: 1                       # 3 on prod via clusterProfile (staging keeps 1; the Arango tier promotes to cluster on both prod and staging — Postgres HA is prod-only)
    storageSize: 10Gi
  arangodb:
    enabled: true
    # Arango deployment mode. `clusterProfile` in {prod,staging} IGNORES
    # this value and promotes to cluster — the promotion template runs
    # unconditionally for those profiles. To pin single mode on a
    # staging-like cluster, set data.arangodb.mode=cluster then override
    # the per-group counts out-of-band (not yet exposed) or set
    # clusterProfile=dev.
    mode: single
    storageSize: 50Gi
    agentsStorageSize: 2Gi             # cluster-mode Agency volume — config state (MBs), not document data
  keycloak:
    # Gates the Keycloak + KeycloakRealmImport CRs. The operator
    # itself is a cluster bootstrap prerequisite — NOT a chart dependency.
    enabled: true
    instances: 1                      # 2 on prod via clusterProfile
    realmImport: true
    adminEmail: genie-admin@genieai.local
    # Gates the new-user email-verification flow; requires smtp to be set
    # when true (Keycloak rejects verification emails without a server).
    verifyEmail: false
    # Realm password policy; empty = built-in default rendered in the
    # realm-import template.
    passwordPolicy: ""
    # Login-page locales; empty = default 9-locale list.
    supportedLocales: []
    # Access-token TTL in seconds (compose parity).
    accessTokenLifespan: 300
    # Confidential-client secrets rendered into the realm import — these
    # values feed the KeycloakRealmImport CR directly (it cannot read
    # Kubernetes Secrets; operators supply the real values at install time
    # via values override, never committed). The SealedSecrets carrying
    # the same values for the backend/dataprep/grafana consumers arrive
    # with their service tiers.
    clientSecrets:
      proxyClient: change-me-proxy-client
      dataprep: change-me-dataprep-client
      grafana: change-me-grafana-client
    # Fail the render when any clientSecrets value is still a change-me
    # placeholder. Default is TRUE so a default install with
    # `change-me-*` client secrets now FAILS the render; opt back to
    # false only in dev/kind where the placeholder is acceptable.
    failOnPlaceholderSecrets: true
    # SMTP for email verification — leave null to disable (no smtpServer
    # block renders); set all fields in the environment override when used.
    smtp: null
    mobileClientId: genie-mobile          # Flutter OIDC client (public, PKCE)
    mobileRedirectScheme: genieai         # <scheme>://callback redirect

# service ↔ data dependency graph (used by pre-install hook).
# Read by the dependency-check hook Job; values are intentionally declarative
# to keep the static analysis simple (no chart-template evaluation at
# Job runtime).
#
# Each key maps a component to the list of components it requires. The Job
# fails the install if a service is enabled but any of its listed targets
# is not.
dependencyGraph:
  services:
    backend:
      - keycloak
      - arangodb
    frontend:
      - backend
    documentRepository:
      - backend
    clamav: []
  data:
    postgres:
      - ""                                # no deps; lowest tier
    arangodb:
      - ""
    keycloak:
      - postgres

secrets:
  sealedSecrets:
    enabled: true                      # default; alternative secrets backends plug in here (ESO / SecretProviderClass)
  eso:
    enabled: false                     # plug-point; ESO controller installs separately
  secretProviderClass:
    enabled: false                     # plug-point; SecretProviderClass resources managed externally
