{{/*
NVIDIA Device Plugin DaemonSet
Runs on all GPU node pool nodes to advertise nvidia.com/gpu resources to the Kubernetes scheduler.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "nvidia-device-plugin" "tier" "gpu" "context" .) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "genieai.selectorLabels" (dict "name" "nvidia-device-plugin" "context" .) | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "genieai.componentLabels" (dict "name" "nvidia-device-plugin" "tier" "gpu" "context" .) | nindent 8 }}
    spec:
      nodeSelector:
        {{ .Values.nodePools.gpu.label }}: {{ .Values.nodePools.gpu.labelValue | quote }}
      {{- include "genieai.gpuTolerations" . | nindent 6 }}
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.14.5
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
