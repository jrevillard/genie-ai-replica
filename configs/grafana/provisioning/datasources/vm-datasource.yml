apiVersion: 1

datasources:
  # VictoriaLogs must be first — VictoriaMetrics links reference its UID
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    uid: victoriametrics-logs
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: victoriatraces
          matcherRegex: "/trace_id=\"([^\"]+)\"/"
          name: TraceID
          url: "$${__value.raw}"
        - datasourceUid: victoriatraces
          matcherRegex: "/span_id=\"([^\"]+)\"/"
          name: SpanID
          url: "$${__value.raw}"
  - name: VictoriaTraces
    type: jaeger
    access: proxy
    url: http://tempo-proxy:10429
    uid: victoriatraces
    editable: false
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    uid: victoriametrics
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
