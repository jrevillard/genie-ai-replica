  - pip install --cache-dir .cache/pip "pyyaml==6.0.2"
  cache:
  - key: provisioning-harness-pyyaml
    paths:
    - ".cache/pip/"
    fallback_keys:
    - provisioning-harness-
  script:
  - bash tests/ci-provisioning/run.sh
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
    - tests/ci-provisioning/**/*
    - ".gitlab-ci.yml"
    when: on_success
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\\/*/"
    when: on_success
".api_client_source_changes":
- components/gov-chat-backend/**/*
- package.json
- mobile/genie_ai_mobile/openapi_client/**/*
- mobile/genie_ai_mobile/openapi_client/.openapi-generator-ignore
- scripts/generate-api-client.sh
- scripts/*.js
- openapitools.json
- ".gitlab-ci.yml"
config:api-client:
  extends: ".node_base"
  stage: config
  variables:
    OPENAPI_GENERATOR_CLI_WRAPPER_VERSION: 2.42.0
  needs: []
  before_script:
  - apk add --no-cache bash diffutils openjdk21-jre-headless
  - '[ -x "${CI_PROJECT_DIR}/.openapi-tools/node_modules/.bin/openapi-generator-cli"
    ] || npm install --prefix ${CI_PROJECT_DIR}/.openapi-tools @openapitools/openapi-generator-cli@${OPENAPI_GENERATOR_CLI_WRAPPER_VERSION}'
  - export PATH="${CI_PROJECT_DIR}/.openapi-tools/node_modules/.bin:$PATH"
  - SWAGGER_JSDOC_VERSION=$(node -p "require('./components/gov-chat-backend/package.json').dependencies['swagger-jsdoc']")
  - '[ "$SWAGGER_JSDOC_VERSION" != "undefined" ] || { echo "swagger-jsdoc is no longer
    a production dependency of components/gov-chat-backend — the version pin cannot
    be resolved"; exit 1; }'
  - npm install --no-save --no-package-lock --prefix ${CI_PROJECT_DIR}/.api-spec-tools
    "swagger-jsdoc@${SWAGGER_JSDOC_VERSION}"
  - mkdir -p ${CI_PROJECT_DIR}/node_modules && ln -sfn ${CI_PROJECT_DIR}/.api-spec-tools/node_modules/swagger-jsdoc
    ${CI_PROJECT_DIR}/node_modules/swagger-jsdoc
  script:
  - npm run api-client:check
  cache:
  - key:
      prefix: openapi-tools-${OPENAPI_GENERATOR_CLI_WRAPPER_VERSION}
      files:
      - openapitools.json
    paths:
    - ".openapi-tools/"
  - key:
      files:
      - components/gov-chat-backend/package-lock.json
      - components/gov-chat-frontend/package-lock.json
      prefix: npm-dl
    paths:
    - ".npm/"
    when: always
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
    - components/gov-chat-backend/**/*
    - package.json
    - mobile/genie_ai_mobile/openapi_client/**/*
    - mobile/genie_ai_mobile/openapi_client/.openapi-generator-ignore
    - scripts/generate-api-client.sh
    - scripts/*.js
    - openapitools.json
    - ".gitlab-ci.yml"
    when: on_success
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\\/*/"
    changes:
    - components/gov-chat-backend/**/*
    - package.json
    - mobile/genie_ai_mobile/openapi_client/**/*
    - mobile/genie_ai_mobile/openapi_client/.openapi-generator-ignore
    - scripts/generate-api-client.sh
    - scripts/*.js
    - openapitools.json
    - ".gitlab-ci.yml"
    when: on_success
config:changelog:
  stage: config
  image: alpine:3.21
  script:
  - |
    VERSION="${CI_COMMIT_TAG#v}"
    echo "Checking CHANGELOG.md for version: ${VERSION}"
    if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
      echo "ERROR: CHANGELOG.md has no entry for version ${VERSION}."
      echo "Add a ## [${VERSION}] section before tagging."
      exit 1
    fi
    echo "CHANGELOG.md entry found for ${VERSION}."
  rules:
  - if: "$CI_COMMIT_TAG =~ /^v/"
scheduled:integration:
  extends: ".e2e_integration_base"
  stage: scheduled
  resource_group: e2e-runner
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: on_success
scheduled:e2e-web:
  extends: ".e2e_web_base"
  stage: scheduled
  needs:
  - scheduled:integration
  resource_group: e2e-runner
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: on_success
".cleanup_base":
  image: docker:24
  stage: ".post"
  tags:
  - docker
  script:
  - docker compose -p "ci-${CI_PIPELINE_ID}" down -v --remove-orphans 2>/dev/null
    || true
e2e:cleanup:
  extends: ".cleanup_base"
  rules:
  - if: $E2E_ENABLED == "1" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE
      == "merge_train"
    when: always
scheduled:cleanup:
  extends: ".cleanup_base"
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
manual:rag-quality:
  image: python:3.11-slim
  stage: manual
  rules:
  - if: $CI_PIPELINE_SOURCE == "web"
    when: manual
  allow_failure: true
  tags:
  - gpu
  timeout: 60m
  before_script:
  - cd genie-ai-overlay
  - if [ ! -d .venv ]; then python -m venv .venv; fi
  - ". .venv/bin/activate"
  - pip install -e ".[test]"
  script:
  - ". .venv/bin/activate"
  - |
    if [ -z "$GPU_AVAILABLE" ]; then
      echo "No GPU detected — skipping RAG quality tests"
      exit 0
    fi
  - 'pytest -m rag-quality --junitxml=reports/rag-quality.xml || echo "WARNING: No
    rag-quality tests found (Epic 8 placeholder)"

    '
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: genie-ai-overlay/reports/rag-quality.xml
docs:build:
  stage: lint
  image: docker.io/hugomods/hugo:exts
  variables:
    GIT_SUBMODULE_STRATEGY: none
    HUGO_CACHEDIR: "$CI_PROJECT_DIR/.cache/hugo"
    HUGO_ENVIRONMENT: ci
  cache:
    key: hugo-docs
    paths:
    - ".cache/hugo"
  script:
  - cd site
  - hugo mod tidy
  - hugo --gc --minify --destination "$CI_PROJECT_DIR/.hugo-check"
  - test -f "$CI_PROJECT_DIR/.hugo-check/index.html"
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
    - site/**/*
    - ".gitlab-ci.yml"
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    changes:
    - site/**/*
    - ".gitlab-ci.yml"
pages:
  stage: deploy
  image: docker.io/hugomods/hugo:exts
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
  - cd site
  - hugo mod tidy
  - hugo --gc --minify --baseURL "$CI_PAGES_URL/" --destination "$CI_PROJECT_DIR/public"
  artifacts:
    paths:
    - public
  rules:
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
