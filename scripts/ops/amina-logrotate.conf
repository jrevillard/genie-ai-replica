# /etc/logrotate.d/amina — log rotation for AMINA backend logs
# Picked up automatically by the daily logrotate.timer that ships with
# Ubuntu (see `systemctl list-timers logrotate.timer`).
#
# Rotation policy:
#   * Weekly rotation (so logs are intact within a week of the event)
#   * Keep 4 archives (a month of history)
#   * Compress all but the most recent (saves ~80% on plaintext logs)
#   * Don't rotate empty files (no churn if nothing happened)
#   * 0644 root:root (matches existing /var/log files)

/var/log/amina-*.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
