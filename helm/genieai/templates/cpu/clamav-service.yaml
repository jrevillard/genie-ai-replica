apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "clamav" "tier" "cpu" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "genieai.selectorLabels" (dict "name" "clamav" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.cpu.clamav.port }}
      targetPort: {{ .Values.cpu.clamav.port }}
      protocol: TCP
      name: tcp-clamav
