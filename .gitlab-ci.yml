stages:
  - lint
  - test
  - config
  - e2e
  - scheduled
  - manual

variables:
  FLUTTER_VERSION: "3.41.7"
  FLUTTER_ARCHIVE: "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"

# Prevent duplicate branch+MR pipelines — first match wins
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Hidden job templates (DRY, reusable by Story 1.3 test stage) ---

.node_base:
  image: node:20-alpine
  interruptible: true

.lint_node:
  extends: .node_base
  stage: lint

.test_node:
  extends: .node_base
  stage: test
  variables:
    NODE_ENV: test
  artifacts:
    when: always
    expire_in: 7 days

.flutter_base:
  image: debian:bookworm-slim
  interruptible: true
  variables:
    PUB_CACHE: $CI_PROJECT_DIR/.pub-cache
  cache:
    - key: "flutter-sdk-${FLUTTER_VERSION}"
      paths:
        - flutter-sdk/
    - key:
        files:
          - mobile/genie_ai_mobile/pubspec.lock
      paths:
        - mobile/genie_ai_mobile/.dart_tool/
        - .pub-cache/
      fallback_keys:
        - "flutter-deps-$CI_DEFAULT_BRANCH"
        - "flutter-deps-"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils python3 python3-venv python3-pip
    - |
      if [ ! -d "flutter-sdk/bin" ]; then
        echo "Installing Flutter ${FLUTTER_VERSION}..."
        curl -fsSL "${FLUTTER_ARCHIVE}" | tar -xJ
        mv flutter flutter-sdk
      fi
    - git config --global --add safe.directory "$PWD/flutter-sdk"
    - export PATH="$PWD/flutter-sdk/bin:$PATH"
    - flutter --version
    - cd mobile/genie_ai_mobile
    - cp patrol_test/e2e_secrets.dart.example patrol_test/e2e_secrets.dart
    - flutter pub get

# --- E2E integration base (shared by e2e:integration + scheduled:integration) ---

.e2e_integration_base:
  image: docker:24
  variables:
    COMPOSE_PROJECT_NAME: "ci-$CI_PIPELINE_ID"
  allow_failure: false
  tags: [docker]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  before_script:
    - apk add --no-cache docker-cli-compose curl
    - |
      for p in $(docker compose ls -q 2>/dev/null | grep '^ci-'); do
        echo "Cleaning up previous project: $p"
        docker compose -p "$p" down -v --remove-orphans 2>/dev/null || true
      done
    - docker network prune -f 2>/dev/null || true
  script:
    - cp env .env
    - |
      while IFS='=' read -r var _; do
        case "$var" in ''|[!A-Z_]*) continue ;; esac
        eval "val=\${$var:-}"
        if [ -n "$val" ]; then
          sed -i "s|^${var}=.*|${var}=${val}|" .env
        fi
      done < env
    - |
      for var in EMAIL_FROM EMAIL_HOST KEYCLOAK_VERIFY_EMAIL; do
        if grep -q "^${var}=$" .env; then
          case "$var" in
            EMAIL_FROM) sed -i "s|^${var}=.*|${var}=noreply@ci-genie-ai.local|" .env ;;
            EMAIL_HOST) sed -i "s|^${var}=.*|${var}=localhost|" .env ;;
            KEYCLOAK_VERIFY_EMAIL) sed -i "s|^${var}=.*|${var}=false|" .env ;;
          esac
        fi
      done
    - |
      # CI runs inside the Docker network — use the nginx service name so
      # Keycloak advertises URLs resolvable from the CI runner container.
      # Mobile tests bypass OIDC discovery (direct token injection) so this
      # only matters for Playwright web E2E.
      echo "NGINX_PUBLIC_DOMAIN=nginx" >> .env
      # Backend must verify JWTs via JWKS at https://nginx/auth/... which uses
      # a self-signed certificate.  Safe for CI — never use in production.
      echo "NODE_TLS_REJECT_UNAUTHORIZED=0" >> .env
    # Build frontend from source so E2E tests run against the current branch
    # (pre-built images from the registry don't include pending changes).
    # DOCKER_BUILDKIT=0 avoids privileged-mode requirement on CI runners.
    - DOCKER_BUILDKIT=0 docker compose build frontend
    - docker compose up -d || (docker compose logs --tail=50 > docker-compose-logs.txt 2>&1; cat docker-compose-logs.txt; exit 1)
    - |
      for i in $(seq 1 60); do
        if docker exec "ci-${CI_PIPELINE_ID}-backend-1" curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
          echo "Backend healthy"
          break
        fi
        echo "Waiting for backend... ($i/60)"
        sleep 5
      done
    - docker exec "ci-${CI_PIPELINE_ID}-backend-1" curl -sf http://localhost:3000/api/health || (docker compose logs --tail=50 > docker-compose-logs.txt 2>&1; cat docker-compose-logs.txt; exit 1)
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - docker-compose-logs.txt

# --- Shared: Docker compose network connection + NGINX IP discovery ---
# Used by .e2e_mobile_base and .e2e_web_base to mutualize networking logic.
.connect_compose_network: &connect_compose_network
  - |
    COMPOSE_NET=$(docker network ls --filter "label=com.docker.compose.project=ci-${CI_PIPELINE_ID}" --format '{{.Name}}' | head -1)
    if [ -z "$COMPOSE_NET" ]; then
      COMPOSE_NET="ci-${CI_PIPELINE_ID}_default"
    fi
    echo "Compose network: $COMPOSE_NET"
    CI_CONTAINER_ID=$(docker ps --filter "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" --format '{{.ID}}' | head -1)
    if [ -z "$CI_CONTAINER_ID" ]; then
      CI_CONTAINER_ID=$(docker ps --filter "name=runner" --format '{{.Names}}' | grep "concurrent" | head -1 | sed 's/-predefined$//')
    fi
    echo "CI container: $CI_CONTAINER_ID"
    if docker network inspect "$COMPOSE_NET" >/dev/null 2>&1; then
      docker network connect "$COMPOSE_NET" "$CI_CONTAINER_ID" 2>/dev/null || true
      echo "CI container connected to compose network: $COMPOSE_NET"
    else
      echo "WARNING: Compose network $COMPOSE_NET not found — tests may fail"
    fi
    NGINX_CONTAINER=$(docker ps --filter "name=nginx" --format "{{.Names}}" | grep "ci-" | head -1)
    if [ -n "$NGINX_CONTAINER" ]; then
      NGINX_IP=$(docker inspect "$NGINX_CONTAINER" --format "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}" | awk '{print $1}')
      echo "Nginx container: $NGINX_CONTAINER at $NGINX_IP"
    else
      echo "WARNING: No nginx container found in compose stack"
    fi

# --- E2E mobile base (shared by patrol:e2e + scheduled:e2e-mobile) ---

.e2e_mobile_base:
  extends: .flutter_base
  allow_failure: true
  tags: [kvm]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  variables:
    EMULATOR_IMAGE: "us-docker.pkg.dev/android-emulator-268719/images/30-google-x64:30.1.2"
    EMULATOR_EXTRA_ARGS: "-memory 2048 -no-snapshot"
  cache:
    - key: "flutter-sdk-${FLUTTER_VERSION}"
      paths:
        - flutter-sdk/
    - key: "android-sdk-36"
      paths:
        - android-sdk/
    - key:
        files:
          - mobile/genie_ai_mobile/android/gradle-wrapper.properties
          - mobile/genie_ai_mobile/pubspec.lock
        prefix: gradle-build
      paths:
        - mobile/genie_ai_mobile/android/.gradle/
        - mobile/genie_ai_mobile/build/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils adb docker.io python3 default-jdk-headless unzip socat
    - |
      if [ ! -d "flutter-sdk/bin" ]; then
        echo "Installing Flutter ${FLUTTER_VERSION}..."
        curl -fsSL "${FLUTTER_ARCHIVE}" | tar -xJ
        mv flutter flutter-sdk
      fi
    - git config --global --add safe.directory "$PWD/flutter-sdk"
    - export PATH="$PWD/flutter-sdk/bin:$PATH"
    - flutter --version
    - cd mobile/genie_ai_mobile
    - flutter pub get
  script:
    - |
      for var in KEYCLOAK_ADMIN_PASSWORD KC_MOBILE_CLIENT_ID KC_MOBILE_REDIRECT_SCHEME; do
        eval "val=\${$var:-}"
        if [ -z "$val" ]; then
          echo "ERROR: Missing CI variable: $var"
          echo "Set it in Settings > CI/CD > Variables"
          exit 1
        fi
      done
    - |
      export JAVA_HOME=$(readlink -f $(which java) | sed 's:/bin/java::')
      echo "JAVA_HOME=$JAVA_HOME"
      if [ ! -d "${CI_PROJECT_DIR}/android-sdk/cmdline-tools/latest/bin" ]; then
        echo "Installing Android SDK command-line tools..."
        ANDROID_SDK="${CI_PROJECT_DIR}/android-sdk"
        mkdir -p "$ANDROID_SDK/cmdline-tools"
        cd /tmp
        curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools "$ANDROID_SDK/cmdline-tools/latest"
        rm -f cmdline-tools.zip
        cd "${CI_PROJECT_DIR}/mobile/genie_ai_mobile"
      else
        echo "Android SDK command-line tools cached"
      fi
      export ANDROID_HOME="${CI_PROJECT_DIR}/android-sdk"
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
      echo "sdkmanager at: $(which sdkmanager)"
      yes | sdkmanager --licenses || true
      echo "Installing Android SDK components..."
      sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      echo "Android SDK ready"
    - *connect_compose_network
    - export PATH="$PATH:$PUB_CACHE/bin:${CI_PROJECT_DIR}/android-sdk/cmdline-tools/latest/bin:${CI_PROJECT_DIR}/android-sdk/platform-tools"
    - export ANDROID_HOME="${CI_PROJECT_DIR}/android-sdk"
    - export GRADLE_OPTS="-Xmx1024m -XX:+HeapDumpOnOutOfMemoryError"
    - |
      cat > "${CI_PROJECT_DIR}/mobile/genie_ai_mobile/android/gradle.properties" << 'GRADLE_PROPS'
      org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
      org.gradle.workers.max=2
      android.useAndroidX=true
      android.enableJetifier=false
      org.gradle.daemon=false
      kotlin.incremental=true
      kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=128m
      GRADLE_PROPS
    - |
      echo "🔑 Generating e2e_secrets.dart from CI variables..."
      KC_PWD="${KEYCLOAK_ADMIN_PASSWORD}"
      cat > patrol_test/e2e_secrets.dart << SECRETS
      // E2E test secrets — generated from CI variables. DO NOT COMMIT.
      class E2eSecrets {
        const E2eSecrets({required this.keycloakAdminPassword});
        final String keycloakAdminPassword;
      }
      const e2eSecrets = E2eSecrets(
        keycloakAdminPassword: r'$KC_PWD',
      );
      SECRETS
    - |
      dart pub global activate patrol_cli 4.3.1
      export PATH="$PATH:$HOME/.pub-cache/bin"
    - |
      EMULATOR_NAME="emulator-${CI_PIPELINE_ID}"
      echo "Starting Android emulator on compose network..."
      docker run -d --name "$EMULATOR_NAME" \
        --device /dev/kvm \
        --network "$COMPOSE_NET" \
        --tmpfs /root:mode=1777 \
        -e EMULATOR_ARGS="$EMULATOR_EXTRA_ARGS" \
        "$EMULATOR_IMAGE"
      EMULATOR_IP=$(docker inspect "$EMULATOR_NAME" --format "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}" | awk '{print $1}')
      EMULATOR_ADDR="${EMULATOR_IP}:5555"
      echo "Emulator at $EMULATOR_ADDR"
      for i in $(seq 1 60); do
        EMU_STATUS=$(docker inspect "$EMULATOR_NAME" --format '{{.State.Status}}' 2>/dev/null || echo "gone")
        if [ "$EMU_STATUS" = "exited" ] || [ "$EMU_STATUS" = "dead" ] || [ "$EMU_STATUS" = "gone" ]; then
          echo "Emulator container crashed (status: $EMU_STATUS)"
          docker logs "$EMULATOR_NAME" --tail 50 2>&1 || true
          exit 1
        fi
        if adb connect "$EMULATOR_ADDR" 2>/dev/null && adb -s "$EMULATOR_ADDR" shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
          echo "Emulator ready"
          break
        fi
        echo "Waiting for emulator... ($i/60)"
        sleep 5
      done
      adb -s "$EMULATOR_ADDR" shell getprop sys.boot_completed | grep -q 1 || {
        echo "Emulator failed to boot"
        docker inspect "$EMULATOR_NAME" --format '{{.State.Status}} (exit code: {{.State.ExitCode}})' 2>/dev/null || true
        docker logs "$EMULATOR_NAME" --tail 50 2>&1 || true
        exit 1
      }
    - |
      if [ -z "$NGINX_IP" ]; then
        echo "❌ Cannot set up port forwarding — NGINX_IP not discovered"
        exit 1
      fi
      echo "🔗 Setting up port forwarding: emulator:8443 → CI runner:18443 → nginx (${NGINX_IP}):443"
      socat TCP-LISTEN:18443,fork,reuseaddr TCP:${NGINX_IP}:443 &
      SOCAT_PID=$!
      sleep 1
      if ! kill -0 "$SOCAT_PID" 2>/dev/null; then
        echo "❌ socat failed to start — cannot forward traffic to nginx"
        exit 1
      fi
      echo "✅ socat forwarding 0.0.0.0:18443 → ${NGINX_IP}:443"
      SOCAT_TEST=$(curl -sk -o /dev/null -w "%{http_code}" https://localhost:18443/auth/realms/genie 2>/dev/null || echo "000")
      echo "socat → nginx test: HTTP ${SOCAT_TEST}"
      adb disconnect "${EMULATOR_ADDR}" 2>/dev/null || true
      sleep 1
      adb connect "${EMULATOR_ADDR}"
      adb -s "${EMULATOR_ADDR}" reverse tcp:8443 tcp:18443
      echo "✅ adb reverse: emulator 127.0.0.1:8443 → host:18443"
      adb -s "${EMULATOR_ADDR}" reverse --list
    - |
      export ADB_DEVICE="$EMULATOR_ADDR"
      echo "ADB_DEVICE=$ADB_DEVICE"

      adb -s "$ADB_DEVICE" shell getprop sys.boot_completed 2>/dev/null | grep -q 1 || {
        echo "❌ Device $ADB_DEVICE not online"
        exit 1
      }
      echo "✅ Device $ADB_DEVICE online and verified"

      adb -s "$ADB_DEVICE" reverse tcp:8443 tcp:18443 2>/dev/null || {
        echo "⚠️  adb reverse failed — reconnecting..."
        adb disconnect "$ADB_DEVICE" 2>/dev/null || true
        sleep 1
        adb connect "$ADB_DEVICE"
        adb -s "$ADB_DEVICE" reverse tcp:8443 tcp:18443
      }
      echo "✅ adb reverse re-confirmed before tests"
      adb -s "$ADB_DEVICE" reverse --list

      export CI_NGINX_URL="https://${NGINX_IP}"
      export ADB_DEVICE="$ADB_DEVICE"
      export EXTRA_DART_DEFINES=$'E2E_KEYCLOAK_URL=https://127.0.0.1:8443/auth\nE2E_REALM=genie\nE2E_CLIENT_ID=genie-mobile-e2e\nE2E_REDIRECT_SCHEME=com.itu.genieai.e2e\nE2E_BACKEND_URL=https://127.0.0.1:8443'
      cd "$CI_PROJECT_DIR"

      # Delegate test execution to patrol-wrapper.sh
      # (keepalive is managed internally — auto-stops after 5 min, during Gradle build only)
      ./mobile/genie_ai_mobile/patrol-wrapper.sh --flavor e2e -d "$ADB_DEVICE"
      exit $?
  after_script:
    - mkdir -p e2e-logs
    - docker inspect "emulator-${CI_PIPELINE_ID}" > e2e-logs/emulator-status.json 2>&1 || true
    - docker logs "emulator-${CI_PIPELINE_ID}" > e2e-logs/emulator.log 2>&1 || true
    - docker rm -f "emulator-${CI_PIPELINE_ID}" 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - e2e-logs/

# --- E2E web base (shared by e2e:playwright + scheduled:e2e-web) ---

.e2e_web_base:
  extends: .node_base
  image: node:20-bookworm-slim
  allow_failure: false
  tags: [docker]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  cache:
    - key:
        files:
          - package-lock.json
        prefix: e2e-playwright
      paths:
        - node_modules/
      fallback_keys:
        - "e2e-playwright-$CI_DEFAULT_BRANCH"
        - "e2e-playwright-"
    - key:
        files:
          - package-lock.json
        prefix: e2e-playwright-browsers
      paths:
        - .cache/ms-playwright/
  before_script:
    - apt-get update && apt-get install -y docker.io curl python3
    - mkdir -p reports
    - npm ci
    - npx playwright install --with-deps chromium
  script:
    - *connect_compose_network
    - |
      # Use Docker service name for Keycloak OIDC compatibility.
      if curl -sk -o /dev/null -w "%{http_code}" https://nginx/api/health 2>/dev/null | grep -qE "^[23]"; then
        echo "Nginx reachable via service name"
        E2E_BASE_URL="https://nginx"
      elif [ -n "$NGINX_IP" ]; then
        echo "Falling back to NGINX_IP: ${NGINX_IP}"
        E2E_BASE_URL="https://${NGINX_IP}"
      else
        echo "ERROR: Cannot reach nginx - neither service name nor IP"
        exit 1
      fi
      for var in KEYCLOAK_ADMIN_PASSWORD; do
        eval "val=\${$var:-}"
        if [ -z "$val" ]; then
          echo "ERROR: Missing CI variable: $var"
          exit 1
        fi
      done
    - |
      # ROPC setup (required by conversation-history tests via getUserToken)
      # All requests go through nginx/Kong — same path as production traffic.
      KC_URL="${E2E_BASE_URL}/auth"
      KC_PWD="${KEYCLOAK_ADMIN_PASSWORD}"
      ADMIN_TOKEN=""
      CLIENT_UUID=""
      for i in $(seq 1 90); do
        if [ -z "$ADMIN_TOKEN" ]; then
          ADMIN_TOKEN=$(curl -sk -X POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
            -d "client_id=admin-cli" -d "username=admin" -d "password=${KC_PWD}" -d "grant_type=password" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" 2>/dev/null)
        fi
        if [ -n "$ADMIN_TOKEN" ]; then
          CLIENT_UUID=$(curl -sk "${KC_URL}/admin/realms/genie/clients?clientId=genie-app" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id']) if d else ''" 2>/dev/null || true)
        fi
        if [ -n "$CLIENT_UUID" ]; then
          echo "Keycloak ready after ${i}s — client UUID: ${CLIENT_UUID}"
          break
        fi
        echo "Waiting for Keycloak via nginx/Kong... ($i/90)"
        sleep 2
      done
      if [ -z "$CLIENT_UUID" ]; then
        echo "ERROR: genie-app client not found via nginx/Kong after 180s"
        exit 1
      fi
      curl -sk -X PUT "${KC_URL}/admin/realms/genie/clients/${CLIENT_UUID}" \
        -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
        -d '{"directAccessGrantsEnabled": true}'
      echo "ROPC enabled for genie-app client"
      # Create test user for E2E tests (required by loginViaUI and getUserToken)
      EXISTING=$(curl -sk "${KC_URL}/admin/realms/genie/users?username=testuser" \
        -H "Authorization: Bearer $ADMIN_TOKEN" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null)
      if [ "${EXISTING:-0}" -eq 0 ]; then
        CREATE_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X POST "${KC_URL}/admin/realms/genie/users" \
          -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
          -d '{"username":"testuser","email":"testuser@e2e.test","emailVerified":true,"firstName":"Test","lastName":"User","enabled":true,"credentials":[{"type":"password","value":"TestPass123!","temporary":false}]}')
        if [ "$CREATE_STATUS" -ne 201 ]; then
          echo "ERROR: testuser creation failed (HTTP $CREATE_STATUS)"
          exit 1
        fi
        echo "testuser created (HTTP $CREATE_STATUS)"
      else
        echo "testuser already exists"
      fi
      # Assign admin realm role to test user (required for document upload/delete)
      USER_ID=$(curl -sk "${KC_URL}/admin/realms/genie/users?username=testuser" \
        -H "Authorization: Bearer $ADMIN_TOKEN" \
        | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])" || true)
      ADMIN_ROLE=$(curl -sk "${KC_URL}/admin/realms/genie/roles" \
        -H "Authorization: Bearer $ADMIN_TOKEN" \
        | python3 -c "import sys,json; roles=[r for r in json.load(sys.stdin) if r['name']=='admin']; print(roles[0]['id'] if roles else '')" || true)
      if [ -n "$ADMIN_ROLE" ] && [ -n "$USER_ID" ]; then
        curl -sk -X POST "${KC_URL}/admin/realms/genie/users/${USER_ID}/role-mappings/realm" \
          -H "Authorization: Bearer $ADMIN_TOKEN" \
          -H "Content-Type: application/json" \
          -d "[{\"id\":\"${ADMIN_ROLE}\",\"name\":\"admin\"}]" && echo "Assigned admin role to testuser" || echo "WARNING: admin role assignment failed"
      else
        echo "WARNING: Could not assign admin role (role or user not found). Document tests may fail."
      fi
      # Save vars for cleanup in after_script
      echo "E2E_BASE_URL=${E2E_BASE_URL}" > .e2e-ropc-env
      echo "ADMIN_TOKEN=${ADMIN_TOKEN}" >> .e2e-ropc-env
      echo "CLIENT_UUID=${CLIENT_UUID}" >> .e2e-ropc-env
    - BASE_URL="${E2E_BASE_URL}" npx playwright test tests/e2e/chatbot/ tests/e2e/documents/ --project=chromium
  after_script:
    - |
      # ROPC cleanup - CRITICAL: always revert, even on test failure
      if [ -f .e2e-ropc-env ]; then
        . ./.e2e-ropc-env
        KC_URL="${E2E_BASE_URL}/auth"
        curl -sk -X PUT "${KC_URL}/admin/realms/genie/clients/${CLIENT_UUID}" \
          -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
          -d '{"directAccessGrantsEnabled": false}' 2>/dev/null && echo "ROPC disabled" || echo "WARNING: ROPC cleanup failed"
        rm -f .e2e-ropc-env
      fi

    - mkdir -p e2e-logs
    - docker compose -p "ci-${CI_PIPELINE_ID}" logs > e2e-logs/docker-compose.log 2>&1 || true
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - e2e-logs/
      - reports/
    reports:
      junit: reports/playwright-report.xml

# --- Lint jobs ---

lint:backend:
  extends: .lint_node
  before_script:
    - cd components/gov-chat-backend && npm ci
  script:
    - npm run lint
    - npm run format:check
  cache:
    - key:
        files:
          - components/gov-chat-backend/package-lock.json
        prefix: lint-backend
      paths:
        - components/gov-chat-backend/node_modules/
      fallback_keys:
        - "lint-backend-$CI_DEFAULT_BRANCH"
        - "lint-backend-"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/gov-chat-backend/**/*"
        - ".gitlab-ci.yml"
      when: on_success
