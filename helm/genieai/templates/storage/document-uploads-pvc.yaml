apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-uploads-pvc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-uploads-storage
    genieai/tier: cpu
spec:
  storageClassName: {{ .Values.storage.documentUploads.storageClass }}
  accessModes:
    - {{ .Values.storage.documentUploads.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storage.documentUploads.size }}
