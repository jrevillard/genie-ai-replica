{{- /* Namespace-scoped RBAC the chart's workloads and the per-environment
kube-arangodb operator rely on. The namespace itself is owned by the
deploy-repo Kustomization (namespace-genieai.yaml) — see the note
below the release-namespace guard. */ -}}
{{- $ns := .Release.Namespace -}}
{{- /* Fail fast when the legacy values key diverges from the release
       namespace: later-tier templates still read .Values.namespace, and a
       divergence silently splits the install across two namespaces.
       This guard fires only when the values key is explicitly set AND
       mismatched — values.yaml ships a default so default installs never
       trip it. */ -}}
{{- /* The comparison needs no truthiness guard: `namespace: ""` made
the old `and .Values.namespace` term false, the mismatch check never
ran, and 58 of the chart's objects rendered with an EMPTY namespace
while the release-namespace ones (hooks, the Namespace family) carried
the real one — the exact divergence this guard exists to prevent. */ -}}
{{- if ne .Values.namespace .Release.Namespace -}}
{{- fail (printf "values 'namespace' (%q) must equal the release namespace (%q) — set namespace: %s in your values-override, OR install with -n %s" (toString .Values.namespace) .Release.Namespace .Release.Namespace .Release.Namespace) -}}
{{- end -}}
{{- /* The namespace itself is NOT rendered by the chart. It is owned by
       the deploy-repo Kustomization (namespace-genieai.yaml), which
       applies it before the SealedSecrets and HelmReleases that target
       it. A chart-owned Namespace made every failed install → uninstall
       remediation DELETE the namespace (helm deletes its regular
       resources on uninstall), cascading away the SealedSecrets, the
       per-environment kube-arangodb operator and every PVC, and
       deadlocking the Kustomization (it cannot apply SealedSecrets into
       a terminating namespace). */ -}}
# ArgoDB operator in-cluster RBAC. The kube-arangodb operator installed
# by scripts/install-prereqs.sh runs in arango-system with `legacy`
# scope: cluster-wide for core K8s resources (deployments, services,
# PVCs, configmaps) but namespace-scoped for the ArangoDeployment
# custom resource itself. Without an in-namespace RoleBinding the
# operator's informer NEVER sees the ArangoDeployment rendered by
# templates/data/arangodb-deployment.yaml and the deployment stays
# in `Phase: Pending` indefinitely.
#
# The bootstrap operator's `legacy` scope grants CRD-definition
# rights cluster-wide but not the CR instances — that's by design, so
# the operator can be shared across namespaces without each tenant
# getting cluster-wide CR-write access. The fix lives in the chart
# that owns the namespace, not in the bootstrap script: each chart
# that wants ArangoDeployment reconciled in its namespace declares
# this Role+RoleBinding.
#
# The RoleBinding's subject is the operator's ServiceAccount in
# arango-system — that SA exists ONLY if the bootstrap ran. On a
# cluster without kube-arangodb, this binding is harmless (the SA
# is unknown and the role grants nothing).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arango-operator-crd-access
  namespace: {{ $ns }}
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ["database.arangodb.com"]
    resources:
      - arangodeployments
      - arangodeployments/scale
      - arangodeployments/status
      - arangomembers
      - arangomembers/status
      - arangotasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["database.arangodb.com"]
    resources: ["arangodeployments/finalizers"]
    verbs: ["update"]
  # The operator also writes the per-member TLS / JWT plumbing; without
  # secrets + configmaps the member pod never bootstraps.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The operator manages the headless services + member StatefulSets
  # for the ArangoDeployment (and rotates the JWT secret in the
  # auth path). The cluster-wide deployment CRD from the bootstrap
  # covers Deployments; the StatefulSet + Service rules are
  # in-namespace because legacy scope bundles them per-namespace.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arango-operator-crd-access
  namespace: {{ $ns }}
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: arango-kube-arangodb-operator
    namespace: arango-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arango-operator-crd-access
{{- $data := .Values.data | default dict -}}
{{- $arangodb := $data.arangodb | default dict -}}
{{- if $arangodb.enabled }}
---
# Cluster-wide ClusterRole + ClusterRoleBinding for the bootstrap
# kube-arangodb operator. The in-namespace Role+RoleBinding above
# is necessary but NOT sufficient: the operator's informers are
# configured at startup from the SA's existing cluster-wide
# permissions, and the legacy-scope ClusterRole the chart ships
# (the one the operator uses to watch CRD *definitions*) does NOT
# include `database.arangodb.com` resources. Without cluster-wide
# cluster-scoped instance access, the operator's deployment
# controller never starts an informer for ArangoDeployment CRs,
# regardless of per-namespace Role grants.
#
# The fix: render a ClusterRole + ClusterRoleBinding here that
# grants the operator SA `get/list/watch/create/update/patch/delete`
# on the ArangoDeployment-family CRs cluster-wide. The legacy
# scope's "limited cluster access" design restricts this; we
# deliberately expand it because the umbrella chart manages
# ArangoDeployment in a namespace the operator was started
# before, so the informer's startup RBAC miss is permanent
# without an explicit cluster-scoped grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arango-operator-crd-access-{{ .Release.Name }}
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
rules:
  - apiGroups: ["database.arangodb.com"]
    resources:
      - arangodeployments
      - arangodeployments/scale
      - arangodeployments/status
      - arangomembers
      - arangomembers/status
      - arangotasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["database.arangodb.com"]
    resources: ["arangodeployments/finalizers"]
    verbs: ["update"]
# No core-resource rules here on purpose. The operator's per-member
# plumbing (the JWT Secret, the cluster ConfigMap, the ServiceAccounts,
# the headless Service and its Endpoints, the member StatefulSets) is
# granted by the namespaced Role+RoleBinding above — the same six kinds,
# the same verbs, in the one namespace this release owns. Granting them
# cluster-wide as well was redundant under the legacy install scope and
# an over-grant under the two namespaced ones, and it meant uninstalling
# a namespaced application release removed RBAC the shared operator used
# across every other namespace on the cluster.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arango-operator-crd-access-{{ .Release.Name }}
  labels:
    {{- include "genieai-common.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: arango-kube-arangodb-operator
    namespace: arango-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: arango-operator-crd-access-{{ .Release.Name }}
{{- end }}
# The cluster-scoped RBAC above is gated on data.arangodb.enabled like
# every other arango resource: a release that does not run ArangoDB (or
# a second GENIE release that does not use it) must neither install the
# grant nor remove it on uninstall — deleting ClusterRole/Binding a
# surviving release's operator informers were started with breaks that
# release's reconciliation, the exact second-release hazard the sweep
# and the cluster-scope gate exist to prevent.
