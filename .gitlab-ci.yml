  script:
    - cd genie-ai-overlay/contracts
    - mkdir -p ../../reports
    - python -m pytest test_contract_harness.py test_contract_telemetry.py test_contract_http_budget.py test_contract_e2e_pipeline.py::test_streaming_metadata_event_shape test_contract_e2e_pipeline.py::test_label_filter_contract_roundtrip test_contract_e2e_pipeline.py::test_label_filter_contract_empty_is_noop -p no:cacheprovider --junitxml=../../reports/contract-report.xml
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: reports/contract-report.xml
    paths:
      - reports/contract-report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: ["genie-ai-overlay/contracts/**/*", "docker-compose.yaml", "genie-ai-overlay/dataprep/**/*", ".gitlab-ci.yml"]
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: ["genie-ai-overlay/contracts/**/*", "docker-compose.yaml", "genie-ai-overlay/dataprep/**/*", ".gitlab-ci.yml"]
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths: ["genie-ai-overlay/contracts/**/*", "docker-compose.yaml", "genie-ai-overlay/dataprep/**/*", ".gitlab-ci.yml"]

