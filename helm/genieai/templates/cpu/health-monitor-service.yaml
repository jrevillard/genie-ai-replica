{{/*
Health Monitor Service - Monitoring (CPU Node Pool)
Exposes the health-monitor /health-status endpoint within the cluster.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: health-monitor
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "health-monitor" "tier" "cpu" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "genieai.selectorLabels" (dict "name" "health-monitor" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.cpu.healthMonitor.port }}
      targetPort: {{ .Values.cpu.healthMonitor.port }}
      protocol: TCP
      name: http
