contract:chatqna-server:
  <<: *contract_template
  needs:
    - job: build:chatqna-server
  variables:
    IMAGE_NAME: "genie-ai-chatqna-server"
    # Chatqna-shaped wire contract, run in the chatqna image. The retriever job
    # runs the same file, but against the RETRIEVER's vendored comps — this one
