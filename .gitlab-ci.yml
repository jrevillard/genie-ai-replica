    if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
      CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
    else
      CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
    fi
    REGISTRY_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:${CANDIDATE_TAG}"
    CACHE_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:cache-${CI_COMMIT_REF_SLUG}"
    echo "Building $IMAGE_NAME → ${REGISTRY_REF}"
    # The frontend bakes a build marker (#1851): /build-info.json carries
    # the commit the image was built from, and the e2e pre-flight reads
    # it so a stale venue cannot file misleading spec-defect issues.
    # Other images do not declare the ARG — buildx ignores it there, so
    # the arg is passed only where it is consumed.
    BUILD_ARGS=""
    case "$DOCKERFILE" in
      *gov-chat-frontend*)
        BUILD_ARGS="--build-arg GIT_SHA=${CI_COMMIT_SHA:-unknown}"
        ;;
    esac
    docker buildx build \
      --pull \
      --push \
      -t "$REGISTRY_REF" \
      -f "$DOCKERFILE" \
      $BUILD_ARGS \
      --cache-from "type=registry,ref=$CACHE_REF" \
      --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
      "$CONTEXT"
  variables:
    IMAGE_NAME: genie-ai-tempo-proxy
    CONTEXT: tools/tempo-proxy/
    DOCKERFILE: tools/tempo-proxy/Dockerfile
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE
      == "merge_train"
    when: never
  - if: $FORCE_IMAGE_REBUILD == "true"
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "web"
    when: never
  - if: "$CI_COMMIT_TAG"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      paths:
      - tools/tempo-proxy/**/*
      - ".gitlab-ci.yml"
      compare_to: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    changes:
      paths:
      - tools/tempo-proxy/**/*
      - ".gitlab-ci.yml"
  - if: "$CI_COMMIT_BRANCH =~ /^release\\//"
    changes:
      paths:
      - tools/tempo-proxy/**/*
      - ".gitlab-ci.yml"
scan:tempo-proxy:
