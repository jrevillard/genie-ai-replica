{{- /* Component label context, same pattern as templates/namespace.yaml. */ -}}
{{- $componentValues := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "test" -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "genieai-common.fullname" . }}-test-namespace
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" $componentValues | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  # The hook-owned dep-check SA (read-only ClusterRole grant on
  # `namespaces`/get) — the same SA the pre-upgrade hooks and the
  # data-deps test pod use. Reused here because the new assertion
  # queries `kubectl get ns`, which is NOT a noop: it requires both
  # the kubectl binary (alpine lacks it) and an SA-bound RBAC grant.
  serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # The full `restricted`-profile set. The namespace enforces `baseline`
  # (the GPU model tier cannot run non-root), and a test pod can carry the
  # stricter posture for free — it keeps passing if the namespace tightens.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  # `registry.k8s.io/kubectl` is distroless (no /bin/sh), so this Pod
  # ships kubectl via an init container that downloads the static binary
  # into the shared `tools` emptyDir. The main container is alpine
  # (sh is built in); kubectl is picked up via the PATH env, which
  # prepends /tools/bin.
  volumes:
    - name: tools
      emptyDir: {}
  initContainers:
    {{- include "genieai-umbrella.toolsInitContainer" . | nindent 4 }}
  containers:
    - name: test
      # SA = the hook-owned dep-check SA (read-only ClusterRole on namespaces).
      image: "{{ .Values.global.toolingImageRegistry | default "docker.io" }}/alpine:3.20"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      env:
        - name: PATH
          # Prepend /tools/bin so kubectl (downloaded by the `tools` init
          # container) is discoverable by the script.
          value: /tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: tools
          mountPath: /tools
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          ns="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
          echo "test Pod running in namespace: $ns"
          # Read-only assertion via kubectl (read-only RBAC in
          # charts/genieai-umbrella/templates/rbac/): the release namespace
          # must exist and carry A pod-security enforce label. The namespace
          # is created by the installer (helm --create-namespace / HelmRelease),
          # not by the chart — the chart deliberately does not own it, so
          # neither the exact PSA level nor genieai.io/* labels are asserted
          # here: nothing in this chart guarantees them, and this test must
          # pass on every supported install shape.
          enforce=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}' 2>/dev/null || true)
          [ -n "$enforce" ] \
            || echo "WARN: pod-security.kubernetes.io/enforce not set on $ns (admission defaults apply)"
          echo "PASS"
{{- /* Gated on at least one data tier rendering against a required
       Secret. The test asserts the operator-provided Secret exists in
       the namespace — the chart does not materialize the Secret itself
       (operator brings it via their secret backend of choice), so a
       release with all data tiers disabled has nothing to check. */ -}}
{{- if or .Values.data.arangodb.enabled .Values.data.keycloak.enabled .Values.data.postgres.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "genieai-common.fullname" . }}-test-data-deps
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  # `registry.k8s.io/kubectl` is distroless (no /bin/sh), so this Pod
  # ships kubectl via an init container that downloads the static binary
  # into the shared `tools` emptyDir. The main container is alpine
  # (sh is built in); kubectl is picked up via the PATH env, which
  # prepends /tools/bin.
  volumes:
    - name: tools
      emptyDir: {}
  initContainers:
    {{- include "genieai-umbrella.toolsInitContainer" . | nindent 4 }}
  containers:
    - name: t
      # SA = the hook-owned dep-check SA (persists between hook fires via
      # before-hook-creation).
      image: "{{ .Values.global.toolingImageRegistry | default "docker.io" }}/alpine:3.20"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      env:
        - name: PATH
          # Prepend /tools/bin so kubectl (downloaded by the `tools` init
          # container) is discoverable by the script.
          value: /tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      volumeMounts:
        - name: tools
          mountPath: /tools
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          ns="{{ .Values.namespace }}"
          echo "test Pod checking required Secrets in namespace"
          # The chart does not render any Secret — operators bring each
          # one by their preferred secret backend. The whole list is
          # polled at once (one 60 s budget, not one per Secret): the
          # per-Secret budget ran past helm's 5-minute test timeout once
          # the list grew, and the FAIL line that NAMES the missing
          # Secret is exactly what the operator needs.
          required_secrets=""
          {{- if .Values.data.arangodb.enabled }}
          required_secrets="$required_secrets arango-jwt-secret arango-root-secret"
          {{- end }}
          {{- if or .Values.data.keycloak.enabled .Values.data.postgres.enabled }}
          # The CNPG/Keycloak SharedSecret, named by
          # data.keycloak.db.secretName — the same knob the CNPG Cluster
          # bootstrap and the Keycloak CR read, so an operator who
          # renamed it is tested against the Secret the deployment
          # actually consumes, not the default name.
          required_secrets="$required_secrets {{ .Values.data.keycloak.db.secretName }}"
          {{- end }}
          {{- if .Values.services.redisCache.enabled }}
          # redis runs with --requirepass from a NON-optional secretKeyRef,
          # but the backend consumes the same Secret through an optional
          # envFrom — a missing Secret therefore starts both pods and
          # breaks the translation cache silently (every read/write gets
          # NOAUTH) while the TCP probe still passes.
          required_secrets="$required_secrets translation-cache-password"
          {{- end }}
          {{- if and .Values.data.keycloak.enabled (not .Values.data.keycloak.convergence.enabled) }}
          # Without the convergence Job the realm carries no client secrets,
          # so this one is never injected anywhere.
          required_secrets="$required_secrets keycloak-proxy-client-secret"
          {{- end }}
          {{- if .Values.opea.enabled }}
          # The OPEA tier mounts both through NON-optional secretKeyRefs
          # (gpuApiKeyEnv for every GPU consumer, the KC_DATAPREP row on
          # dataprep) — a missing Secret is a CreateContainerConfigError
          # at first pod start, so the install must fail here instead.
          required_secrets="$required_secrets vllm-api-key kc-dataprep-client-secret"
          {{- else if .Values.services.backend.translation.endpoint }}
          # OPEA off but a translation endpoint EXPLICITLY named: the
          # backend Deployment still carries a NON-optional secretKeyRef
          # on vllm-api-key (the named API is mandatory and authenticated),
          # so the Secret is required whatever the tier toggle says — the
          # gate that checks it must not be narrower than the render that
          # needs it.
          required_secrets="$required_secrets vllm-api-key"
          {{- end }}
          missing=""
          for name in $required_secrets; do
            kubectl get secret "$name" -n "$ns" >/dev/null 2>&1 || missing="$missing $name"
          done
          i=0
          while [ -n "$missing" ] && [ "$i" -lt 30 ]; do
            i=$((i+1))
            sleep 2
            missing=""
            for name in $required_secrets; do
              kubectl get secret "$name" -n "$ns" >/dev/null 2>&1 || missing="$missing $name"
            done
          done
          for name in $required_secrets; do
            case " $missing " in
              *" $name "*) echo "FAIL: K8s Secret never materialized: $name (operator must provide via their secret backend)" ;;
              *) echo "OK: K8s Secret materialized: $name" ;;
            esac
          done
          failed=0
          if [ -n "$missing" ]; then
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "FAIL: required K8s Secrets did not materialize in 60s"
            exit 1
          fi
          echo "PASS"
{{- end }}
