---
# GENIE.AI - GPU Node configuration
# Non-secret variables for the dedicated GPU node deployment.

# =============================================================================
# DEPLOYMENT PATHS
# =============================================================================
gpu_deploy_dir: /opt/genieai-gpu
gpu_data_dir: ./data
gpu_generated_dir: configs/nginx-gpu

# =============================================================================
# DOMAIN & PORTS
# =============================================================================
gpu_public_domain: gpu.example.com

gpu_llm_port: "9400"
gpu_translation_port: "9401"
gpu_embedding_port: "9402"
gpu_reranker_port: "9403"
gpu_docling_port: "9404"

# =============================================================================
# GPU ENVIRONMENT OVERRIDES
# =============================================================================
# GPU-specific env file (e.g. env.t4, env.rtx6000) for memory utilization.
# Leave empty to use defaults in docker-compose.gpu.yaml.
gpu_env_file: ""

# =============================================================================
# NVIDIA
# =============================================================================
nvidia_version_pin: "1.18.*"
nvidia_visible_devices: "all"

# =============================================================================
# IMAGE TAGS (must match app node compose — Decision 2 in architecture)
# =============================================================================
vllm_llm_image: vllm/vllm-openai:latest
vllm_translation_image: vllm/vllm-openai:v0.10.0
tei_embedding_image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
tei_reranker_image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
docling_serve_image: ghcr.io/institute-of-data-science/docling-serve:latest
nginx_image: nginx:1.28-alpine

# =============================================================================
# MODEL IDS (must match app node — Decision 2 in architecture)
# =============================================================================
vllm_llm_model_id: meta-llama/Meta-Llama-3.1-8B-Instruct
vllm_translation_model_id: google/gemma-3-4b-it
embedding_model_id: BAAI/bge-base-en-v1.5
reranker_model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
