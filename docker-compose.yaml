# Ports Overview:
# 8090 - gov chat frontend
# 3000 - gov chat backend
# 3001 - doc repo dev
# 3310 - clamav
# 80 - default OPEA UI nginx server (chatqna-xeon-nginx-server)
# 5173 - default OPEA UI frontend (chatqna-xeon-ui-server)
# 6000 - embedding wrapper
# 6007 - dataprep API endpoint
# 6100 - reranker wrapper
# 7000 - TEI (embedding inference server)
# 7025 - retriever-arango-dev
# 7100 - TEI reranker (inference server)
# 8000 - vLLM (main LLM server)
# 8888 - chatqna backend server
# 9000 - textgen wrapper
# 9030 - translation wrapper
# 9031 - vllm-translation-guardrail (guarded LLM)
# 9090 - guardrail (guard logic endpoint)
# 6666 - http-service (for auth token retrieval)

name: genieai_mvp

volumes:
  kong_data:
  mongo_data:
  nginx_certs:
  nginx_conf:
  redis_data:
  doc_repo_uploads: {}
  drought_reports: {}
  geo_inference_models: {}   # SAM + Prithvi-EO-2.0 checkpoints — persisted across container restarts
  keycloak_db_data: {}       # Keycloak PostgreSQL data (dedicated DB, separate from kong-database)

services:

  # Note: after starting this service, execute the following commands:
  #       docker compose exec kong-database psql -U kong postgres
  #       CREATE DATABASE kong;
  #       ALTER USER kong WITH PASSWORD '${KONG_PG_PASSWORD}';
  #       GRANT ALL PRIVILEGES ON DATABASE kong TO kong;
  kong-database:
    image: postgres:13
    restart: unless-stopped
    networks:
      - genieai_network
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    env_file:
      - .env
    ports:
      - "5432:5432" # Leave the standard PostGres port unchanged as Kong connects to it by default
    volumes:
      - kong_data:/var/lib/postgresql/data
      - ./api-gateway-solution/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Note: before starting up kong you need to create the schema with this command:
  #       docker compose run --rm kong kong migrations bootstrap
  kong:
    image: kong:latest
    restart: unless-stopped
    networks:
      - genieai_network
    depends_on:
      kong-database:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8010:8010"  # Note that we had to change this port to 8010 because vLLM runs on 8000
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ./api-gateway-solution/kong_logs:/var/log/kong

  # --- Keycloak Identity Provider (only addition to this legacy compose) ---
  # Dedicated PostgreSQL for Keycloak. Kept separate from kong-database (postgres:13,
  # host port 5432) so neither stack's data or init flow is touched.
  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    networks:
      - genieai_network
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_DB=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build: configs/keycloak/
    restart: unless-stopped
    networks:
      - genieai_network
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      # Behind nginx at /auth: nginx strips the prefix and sends X-Forwarded-Prefix: /auth
      # (this stack's Kong has no Keycloak route, so nginx proxies Keycloak directly)
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=${NGINX_PUBLIC_DOMAIN:-localhost}
      - KC_HTTP_ENABLED=true
      # SMTP (reuses EMAIL_*; empty EMAIL_HOST effectively disables email)
      - KC_SMTP_HOST=${EMAIL_HOST:-}
      - KC_SMTP_PORT=${EMAIL_PORT:-587}
      - KC_SMTP_SSL=${EMAIL_SECURE:-false}
      - KC_SMTP_AUTH=${EMAIL_USER:+true}
      - KC_SMTP_STARTTLS=true
      - KC_SMTP_USER=${EMAIL_USER:-}
      - KC_SMTP_PASSWORD=${EMAIL_PASSWORD:-}
      - KC_SMTP_FROM=${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Realm configuration via keycloak-config-cli (runs once after Keycloak is healthy)
  keycloak-config:
    build:
      context: configs/keycloak/
      dockerfile: Dockerfile.config-cli
    restart: unless-stopped
    networks:
      - genieai_network
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - IMPORT_FILES=/config/genie-realm.yaml
      - IMPORT_VARSUBSTITUTION_ENABLED=true
      - IMPORT_CACHE_ENABLED=true
      # Variables referenced in genie-realm.yaml via $(env:VAR) substitution
      - KC_REALM=${KEYCLOAK_REALM:-genie}
      - KC_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-genie-app}
      - GENIE_ADMIN_USERNAME=${GENIE_ADMIN_USERNAME:-genie-admin}
      - GENIE_ADMIN_PASSWORD=${GENIE_ADMIN_PASSWORD}
      - GENIE_ADMIN_EMAIL=${GENIE_ADMIN_EMAIL}
      - KC_PROXY_CLIENT_SECRET=${KEYCLOAK_PROXY_CLIENT_SECRET}
      - KC_DATAPREP_CLIENT_SECRET=${KC_DATAPREP_CLIENT_SECRET}
      - KC_GRAFANA_CLIENT_ID=${KC_GRAFANA_CLIENT_ID:-grafana}
      - KC_GRAFANA_CLIENT_SECRET=${KC_GRAFANA_CLIENT_SECRET}
      - KC_MOBILE_CLIENT_ID=${KC_MOBILE_CLIENT_ID}
      - KC_MOBILE_REDIRECT_SCHEME=${KC_MOBILE_REDIRECT_SCHEME}
      - KC_PUBLIC_ORIGIN=https://${NGINX_PUBLIC_DOMAIN:-localhost}${NGINX_HTTPS_PORT:+:${NGINX_HTTPS_PORT}}
      # Realm properties (registration, email, security, localization, tokens)
      - KEYCLOAK_REGISTRATION_ENABLED=${KEYCLOAK_REGISTRATION_ENABLED:-true}
      - KEYCLOAK_VERIFY_EMAIL=${KEYCLOAK_VERIFY_EMAIL:-true}
      - KEYCLOAK_RESET_PASSWORD=${KEYCLOAK_RESET_PASSWORD:-true}
      - KEYCLOAK_LOGIN_WITH_EMAIL=${KEYCLOAK_LOGIN_WITH_EMAIL:-true}
      - KEYCLOAK_DUPLICATE_EMAILS=${KEYCLOAK_DUPLICATE_EMAILS:-false}
      - KEYCLOAK_BRUTE_FORCE=${KEYCLOAK_BRUTE_FORCE:-true}
      - KEYCLOAK_PASSWORD_POLICY=${KEYCLOAK_PASSWORD_POLICY:-length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)}
      - KEYCLOAK_THEME=${KEYCLOAK_THEME:-genie}
      - KEYCLOAK_I18N_ENABLED=${KEYCLOAK_I18N_ENABLED:-true}
      - KEYCLOAK_LOCALE=${KEYCLOAK_LOCALE:-en}
      - KEYCLOAK_SUPPORTED_LOCALES=${KEYCLOAK_SUPPORTED_LOCALES:-["ar","de","en","es","fr","pt","ru","th","zh-Hans"]}
      - KEYCLOAK_ACCESS_TOKEN_LIFESPAN=${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:-300}
      # SMTP (reuses EMAIL_* — realm smtpServer overrides server-level KC_SMTP_*)
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_SMTP_AUTH=${EMAIL_USER:+true}
      - EMAIL_SMTP_STARTTLS=true
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /tmp/config-done"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Note: before firing up all the other services, the kong configuration needs to be adapted and loaded
  #       1) Modify the addresses of the node:
  #          vi api-gateway-solution/new-config/kong_config.json
  #            -- modify the "host": "e2e-109-51" for the "express-api" service to "host": "backend"
  #            -- it still runs on port 3000 so no problem
  #            -- modify the "host": "e2e-109-51" for the document-repository service to "host": "document-repository"i
  #            -- it still runs on port 3001 so no problem
  #       2) Prepare to apply the configuration to Kong
  #          cd api-gateway-solution/new-config/
  #          chmod +x manage-kong-config.sh
  #          vi manage-kong-config.sh
  #            -- modify the KONG_PUBLIC_URL to match the config change KONG_PUBLIC_URL="http://localhost:8010"
  #       3) Install jq
  #          apt update
  #          apt install jq
  #       4) Apply the configuration to Kong
  #          ./manage-kong-config.sh -a
  frontend:
    build:
      context: ./components/gov-chat-frontend
      dockerfile: Dockerfile-single-node # Specify the Dockerfile name
      args:
        - VUE_APP_API_URL=${VUE_APP_API_URL}
        - VUE_PROXY_HOST=${VUE_PROXY_HOST}
        - VUE_APP_CSP_CONNECT_SRC=${VUE_APP_CSP_CONNECT_SRC}
        - VUE_APP_MAPBOX_TOKEN=${MAPBOX_ACCESS_TOKEN}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    networks:
      - genieai_network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "${TRANSLATION_CACHE_PORT}:${TRANSLATION_CACHE_PORT}"
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "${TRANSLATION_CACHE_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genieai_network

  backend:
    build:
      context: ./components
      dockerfile: gov-chat-backend/Dockerfile-single-node 
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./database_backups:/app/database_backups
      - ./logs:/app/logs
      - ./data:/app/data
      - ./components/gov-chat-backend/Uploads:/app/Uploads
      - ./secrets:/opt/genie:ro
    env_file:
      - .env
    depends_on:
      arango-vector-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      # Database config
      - ARANGO_URL=${ARANGO_URL}
      - ARANGO_PORT=${ARANGO_PORT}
      - ARANGO_DB=${ARANGO_DB}
      - ARANGO_DB_NAME=${ARANGO_DB_NAME}
      - ARANGO_USER=${ARANGO_USER}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET:-default-session-secret}
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC}
      - PORT=${BACKEND_PORT}
      # Firebase Admin / FCM notifications
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - NOTIFICATION_BROADCAST_SECRET=${NOTIFICATION_BROADCAST_SECRET:-}
      # Translation Service Configuration
      - TRANSLATION_BACKEND=${TRANSLATION_BACKEND:-cpu}
      - TRANSLATION_CPU_MODEL_ID=${TRANSLATION_CPU_MODEL_ID:-Xenova/nllb-200-distilled-600M}
      - TRANSLATION_THREADS=${TRANSLATION_THREADS:-4}
      - TRANSLATION_BATCHES=${TRANSLATION_BATCHES:-5}
      - TRANSLATION_CACHE=${TRANSLATION_CACHE:-on}
      - TRANSLATION_CACHE_HOST=${TRANSLATION_CACHE_HOST:-redis-cache}
      - TRANSLATION_CACHE_PORT=${TRANSLATION_CACHE_PORT:-6379}
      - TRANSLATION_CACHE_PASSWORD=${TRANSLATION_CACHE_PASSWORD}
      # GPU Translation Configuration (vLLM)
      - VLLM_TRANSLATION_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
      - VLLM_TRANSLATION_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT}
      - VLLM_TRANSLATION_SERVICE_PORT=${VLLM_TRANSLATION_SERVICE_PORT:-9031}
    networks:
      - genieai_network

  document-repository:
    build:
      context: ./components
      dockerfile: document-repository/Dockerfile
    container_name: doc-repo-dev
    environment:
      # Database config
      - ARANGO_URL=${ARANGO_URL}
      - ARANGO_PORT=${ARANGO_PORT}
      - ARANGO_DB=${ARANGO_DB}
      - ARANGO_DB_NAME=${ARANGO_DB_NAME}
      - ARANGO_USER=${ARANGO_USER}
      - ARANGO_USERNAME=${ARANGO_USERNAME}
      - PORT=${DOC_REPO_PORT}
    env_file:
      - .env
    depends_on:
      - clamav
    ports:
      - "${DOC_REPO_PORT}:${DOC_REPO_PORT}"
    networks:
      - genieai_network
    volumes:
      - ./logs:/app/logs
      - doc_repo_uploads:/app/uploads

  clamav:
    image: clamav/clamav
    container_name: clamav
    ports:
      - "3310:3310"
    networks:
      - genieai_network
  
  drought-monitoring:
    build:
      context: ./components/drought_monitoring
      dockerfile: dockerfile
    container_name: drought-monitoring
    volumes:
      - ./secrets:/app/secrets:ro
      - drought_reports:/app/reports
    environment:
      - GEE_PROJECT=${GEE_PROJECT:-mewa-493916}
      - DROUGHT_REPORTS_DIR=/app/reports
      - ARANGO_URL=${ARANGO_URL}
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-genie-ai}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      arango-vector-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - genieai_network

  warning-system-engine:
    build:
      context: ./components/warning_system_engine
      dockerfile: Dockerfile
    container_name: warning-system-engine
    env_file:
      - .env
      - ./components/warning_system_engine/.env
    environment:
      - DROUGHT_MONITORING_URL=http://drought-monitoring:8001
      - ARANGO_URL=${ARANGO_URL}
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-genie-ai}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
    depends_on:
      arango-vector-db:
        condition: service_healthy
      drought-monitoring:
        condition: service_started
    restart: unless-stopped
    networks:
      - genieai_network

  geo-inference-worker:
    build:
      context: ./components/geo-inference-worker
      dockerfile: Dockerfile
    container_name: geo-inference-worker
    runtime: nvidia
    volumes:
      - ./secrets:/app/secrets:ro              # GEE service account JSON
      - geo_inference_models:/app/models       # SAM + Prithvi-EO-2.0 cached models
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GEE_PROJECT_ID=${GEE_PROJECT_ID:-mewa-493916}
      - GPU_INFERENCE=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    env_file:
      - .env
    networks:
      - genieai_network
    restart: unless-stopped

  weather-mcp-standalone:
    build:
      context: ./components/weather-mcp-service
      dockerfile: Dockerfile
    container_name: weather-mcp-standalone
    ports:
      - "${WEATHER_MCP_PORT}:8000"
    volumes:
      - ./components/warning_system_engine:/warning_system_engine:ro
      - drought_reports:/app/drought_reports:ro
    environment:
      - PYTHONUNBUFFERED=1
      - WARNING_SYSTEM_ENGINE_DIR=/warning_system_engine
      - DROUGHT_REPORTS_DIR=/app/drought_reports
      - DROUGHT_MONITORING_URL=http://drought-monitoring:8001
      - GEO_INFERENCE_URL=http://geo-inference-worker:8001
      - PORT=${WEATHER_MCP_PORT}
      - VLLM_TRANSLATION_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT}
      - VLLM_TRANSLATION_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
    env_file:
      - .env
    depends_on:
      - geo-inference-worker
    networks:
      - genieai_network
    restart: unless-stopped

  arango-vector-db:
    image: arangodb/arangodb:3.12.4
    container_name: arango-vector-db
    ports:
      - "${ARANGO_PORT}:${ARANGO_PORT}"
    volumes:
      - /root/arango_data:/var/lib/arangodb3
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    command: ["--experimental-vector-index=true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.username root --server.password \"${ARANGO_PASSWORD}\" --javascript.execute-string \"db._version();\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - genieai_network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443" # This will always run on port 443 as port 80 is taken by the OPEA nginx and we only want a https listener
    volumes:
      - ./api-gateway-solution/nginx/conf:/etc/nginx/conf.d
      - ./api-gateway-solution/nginx/certs:/etc/nginx/certs
      - nginx_conf:/etc/nginx
      - nginx_certs:/etc/ssl/private
    networks:
      - genieai_network
    depends_on:
      - kong

  http-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/http-service/Dockerfile-http-service_genie-ai
    container_name: http-service
    env_file:
      - .env
    environment:
      # Mapped variables using shell substitution from .env
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_SERVICE_USERNAME: ${AUTH_SERVICE_USERNAME}
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    networks:
      - genieai_network
    restart: "no"

  dataprep-arango-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/dataprep/Dockerfile-dataprep_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_GENAI_COMPS_URL}
        HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    image: genie-ai-dataprep-arango:${OPEA_VERSION:-latest}
    container_name: genie-ai-dataprep-arango
    depends_on:
      arango-vector-db:
        condition: service_started
      embedding:
        condition: service_started
      vllm:
        condition: service_healthy
      guardrail:
        condition: service_started
    ports:
      - "${DATAPREP_PORT}:5000" # Wondering why the container port is 5000
    env_file:
      - .env
    environment:
      DATAPREP_COMPONENT_NAME: ${DATAPREP_COMPONENT_NAME}
      VLLM_LLM_MODEL_ID: ${VLLM_LLM_MODEL_ID}
      VLLM_MODEL_ID: ${VLLM_MODEL_ID}
      VLLM_ENDPOINT: ${VLLM_ENDPOINT}
      TEI_EMBEDDING_ENDPOINT: ${TEI_EMBEDDING_ENDPOINT}
      GUARDRAIL_URL: ${GUARDRAIL_URL}
      E2E_CPU_URL: ${E2E_CPU_URL}
      ARANGO_URL: ${ARANGO_URL}
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME}
      GET_AUTH_TOKEN_URL: ${GET_AUTH_TOKEN_URL}
      DOCUMENT_REPOSITORY_URL: ${DOCUMENT_REPOSITORY_URL}
      BACKEND_SERVICE_URL: ${BACKEND_SERVICE_URL}
      LABELING_STRATEGY: ${LABELING_STRATEGY}
      EMBEDDING_LABEL_THRESHOLD: ${EMBEDDING_LABEL_THRESHOLD}
      BM25_LABEL_THRESHOLD: ${BM25_LABEL_THRESHOLD}
      CONTENT_EXTRACTION_METHOD: ${CONTENT_EXTRACTION_METHOD}
      LABEL_SELECTOR_SYSTEM_PROMPT: ${LABEL_SELECTOR_SYSTEM_PROMPT}
      MAX_CONCURRENT_BATCHES: ${MAX_CONCURRENT_BATCHES}
      DOCLING_DEVICE: ${DOCLING_DEVICE}
      DATAPREP_CHUNK_SIZE_PDF: ${DATAPREP_CHUNK_SIZE_PDF}
      DATAPREP_CHUNK_SIZE_DOCX: ${DATAPREP_CHUNK_SIZE_DOCX}
      DATAPREP_CHUNK_SIZE_XLSX: ${DATAPREP_CHUNK_SIZE_XLSX}
      DATAPREP_CHUNK_SIZE_PPTX: ${DATAPREP_CHUNK_SIZE_PPTX}
      DATAPREP_CHUNK_SIZE_HTML: ${DATAPREP_CHUNK_SIZE_HTML}
      DATAPREP_CHUNK_SIZE_TXT: ${DATAPREP_CHUNK_SIZE_TXT}
      DATAPREP_CHUNK_SIZE_MD: ${DATAPREP_CHUNK_SIZE_MD}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"

  retriever-arango-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/retriever/Dockerfile-retriever_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_GENAI_COMPS_URL}
    image: genie-ai-retriever-arango:${OPEA_VERSION:-latest}
    container_name: genie-ai-retriever-arango
    depends_on:
      arango-vector-db:
        condition: service_started
      embedding:
        condition: service_started
    ports:
      - "${RETRIEVER_SERVICE_PORT}:${RETRIEVER_SERVICE_PORT}"
    ipc: host
    env_file:
      - .env
    environment:
      RETRIEVER_COMPONENT_NAME: ${RETRIEVER_COMPONENT_NAME}
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME}
      VLLM_ENDPOINT: ${VLLM_ENDPOINT}
      ARANGO_URL: ${ARANGO_URL}
      TEI_EMBEDDING_ENDPOINT: ${TEI_EMBEDDING_ENDPOINT}
    networks:
      - genieai_network
    restart: "no"

  chatqna-xeon-backend-server:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_EXAMPLES_URL}
    image: genie-ai-chatqna-server:${OPEA_VERSION:-latest}
    container_name: genie-ai-chatqna-server
    working_dir: /app/ChatQnA
    depends_on:
      vllm:
        condition: service_healthy
      embedding:
        condition: service_started
      retriever-arango-service:
        condition: service_started
      reranker:
        condition: service_started
    ports:
      - "${OPEA_PORT}:${OPEA_PORT}"
    env_file:
      - .env
    environment:
      CHATQNA_TYPE: ${CHATQNA_TYPE}
      MEGA_SERVICE_HOST_IP: ${MEGA_SERVICE_HOST_IP}
      EMBEDDING_SERVER_HOST_IP: ${EMBEDDING_SERVER_HOST_IP}
      EMBEDDING_SERVER_PORT: ${EMBEDDING_SERVER_PORT}
      RETRIEVER_SERVICE_HOST_IP: ${RETRIEVER_SERVICE_HOST_IP}
      RETRIEVER_SERVICE_PORT: ${RETRIEVER_SERVICE_PORT}
      RERANK_SERVER_HOST_IP: ${RERANK_SERVER_HOST_IP}
      RERANK_SERVER_PORT: ${RERANK_SERVER_PORT}
      LLM_SERVER_HOST_IP: ${LLM_SERVER_HOST_IP}
      LLM_SERVER_PORT: ${LLM_SERVER_PORT}
      CHATQNA_SYSTEM_PROMPT: ${CHATQNA_SYSTEM_PROMPT}
      GUARDRAIL_SERVICE_HOST_IP: ${GUARDRAIL_SERVICE_HOST_IP}
      GUARDRAIL_SERVICE_PORT: ${GUARDRAIL_SERVICE_PORT}
      TRANSLATION_SERVICE_HOST_IP: vllm-translation-guardrail
      TRANSLATION_SERVICE_PORT: ${VLLM_TRANSLATION_SERVICE_PORT}
      DOC_REPO_URL: ${DOC_REPO_URL}
      GET_AUTH_TOKEN_URL: ${GET_AUTH_TOKEN_URL}
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"

  chatqna-xeon-ui-server:
    image: opea/chatqna-ui:latest
    container_name: chatqna-xeon-ui-server
    depends_on:
      - chatqna-xeon-backend-server
    ports:
      - "${FRONTEND_SERVICE_PORT}:${FRONTEND_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      UPLOAD_FILE_BASE_URL: http://localhost:6007/v1/dataprep/ingest
    ipc: "host"
    networks:
      - genieai_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chatqna-xeon-nginx-server:
    image: opea/nginx:latest
    container_name: chatqna-xeon-nginx-server
    depends_on:
      chatqna-xeon-backend-server:
        condition: service_started
      chatqna-xeon-ui-server:
        condition: service_healthy
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    env_file:
      - .env
    environment:
      FRONTEND_SERVICE_IP: ${FRONTEND_SERVICE_IP}
      FRONTEND_SERVICE_PORT: ${FRONTEND_SERVICE_PORT}
      BACKEND_SERVICE_NAME: ${BACKEND_SERVICE_NAME}
      BACKEND_SERVICE_IP: ${BACKEND_SERVICE_IP}
      BACKEND_SERVICE_PORT: ${BACKEND_SERVICE_PORT}
      DATAPREP_SERVICE_IP: ${DATAPREP_SERVICE_IP}
      DATAPREP_SERVICE_PORT: ${DATAPREP_SERVICE_PORT}
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  vllm:
    container_name: vllm-vllm-2
    image: vllm/vllm-openai:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${LLM_SERVER_PORT}:${LLM_SERVER_PORT}"
    command: >
      --model ${VLLM_LLM_MODEL_ID}
      --gpu_memory_utilization ${VLLM_GPU_UTIL:-0.6}
      --served-model-name ${VLLM_LLM_MODEL_ID}
      --max_model_len ${VLLM_MAX_MODEL_LEN:-4096}
      --max_num_seqs 1024
      --kv-cache-dtype auto
      --dtype=${VLLM_DTYPE:-auto}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
      - VLLM_USE_FLASHINFER_SAMPLER=0
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  textgen:
    container_name: llm-textgen
    image: opea/llm-textgen:latest
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - LLM_ENDPOINT=${VLLM_ENDPOINT}
      - LLM_MODEL_ID=${VLLM_LLM_MODEL_ID}
    ports:
      - "${TEXTGEN_PORT}:${TEXTGEN_PORT}"
    ipc: "host"
    networks:
      - genieai_network
    restart: unless-stopped

  vllm-translation-guardrail:
    container_name: vllm-vllm-translation-guardrail
    image: vllm/vllm-openai:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${VLLM_TRANSLATION_SERVICE_PORT}:${VLLM_TRANSLATION_SERVICE_PORT}"
    command: >
      --model ${VLLM_TRANSLATION_MODEL_ID}
      --gpu_memory_utilization ${VLLM_TRANSLATION_GPU_UTIL:-0.3}
      --served-model-name ${VLLM_TRANSLATION_MODEL_ID}
      --max_model_len ${VLLM_TRANSLATION_MAX_MODEL_LEN:-2048}
      --kv-cache-dtype=${VLLM_TRANSLATION_KV_CACHE_DTYPE:-auto}
      --dtype=${VLLM_TRANSLATION_DTYPE:-auto}
      --port ${VLLM_TRANSLATION_SERVICE_PORT}
      --no-enable-chunked-prefill
      --max-num-seqs 16
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9031/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

  translation:
    image: opea/translation:latest
    container_name: translation-microservice
    environment:
      - LLM_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT}  
      - LLM_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
    ports:
      - "${TRANSLATION_SERVICE_PORT}:${TRANSLATION_SERVICE_PORT}"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  guardrail:
    container_name: llm-guardrail
    image: opea/guardrails:latest
    environment:
      - LLM_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT}
      - LLM_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
      - SAFETY_GUARD_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
      - GUARDRAILS_COMPONENT_NAME=OPEA_LLM_GUARD
    ports:
      - "${GUARDRAIL_SERVICE_PORT}:${GUARDRAIL_SERVICE_PORT}"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"
  
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    # image: ghcr.io/huggingface/text-embeddings-inference:turing-1.7
    container_name: tei-embedding-serving
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${EMBEDDING_MODEL_ID} --auto-truncate"
    runtime: nvidia
    ports:
      - "7000:80"
    volumes:
      - "${DATA_PATH:-./data}:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=${RUST_BACKTRACE}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    depends_on:
      vllm-translation-guardrail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 6s
      retries: 48
    networks:
      - genieai_network
    restart: "no"

  embedding:
    container_name: embedding
    image: opea/embedding:latest
    depends_on:
      tei:
        condition: service_healthy
    environment:
      - EMBEDDING_MODEL_ENDPOINT=${EMBEDDING_MODEL_ENDPOINT}
      - TEI_EMBEDDING_ENDPOINT=${TEI_EMBEDDING_ENDPOINT}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID}
    ports:
      - "6000:6000"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  tei_reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    # image: ghcr.io/huggingface/text-embeddings-inference:turing-1.7
    container_name: tei-reranker-serving
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${RERANKER_MODEL_ID} --max-batch-tokens 32768 --max-concurrent-requests 256 --auto-truncate"
    runtime: nvidia
    ports:
      - "7100:80"
    volumes:
      - "${DATA_PATH:-./data}:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=1${RUST_BACKTRACE}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    depends_on:
      vllm-translation-guardrail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 6s
      retries: 48
    networks:
      - genieai_network
    restart: "no"

  reranker:
    build:
      context: .
      dockerfile: ./genie-ai-overlay/reranker/Dockerfile-reranker_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_GENAI_COMPS_URL}
    image: genie-ai-reranker:${OPEA_VERSION:-latest}
    container_name: genie-ai-reranker
    depends_on:
      tei_reranker:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - RERANKER_MODEL_ENDPOINT=${RERANKER_MODEL_ENDPOINT}
      - TEI_RERANKING_ENDPOINT=${TEI_RERANKING_ENDPOINT}
      - RERANK_COMPONENT_NAME=${RERANK_COMPONENT_NAME:-GENIE_TEI_RERANKING}
      - RERANKING_STRATEGY=${RERANKING_STRATEGY}
      - RERANKING_THRESHOLD=${RERANKING_THRESHOLD}
    ports:
      - "6100:8000"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

networks:
  genieai_network:
    name: genieai_mvp_genieai_network
    driver: bridge
