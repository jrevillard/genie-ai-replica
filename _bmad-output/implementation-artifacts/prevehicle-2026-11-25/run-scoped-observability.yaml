# Run-scoped observability tier for the #2170 pre-vehicle validation campaign.
# Extracted from charts/genieai-umbrella (helm template, all three storage tiers + grafana on)
# with ONE correction: spec.storage.className -> spec.storage.storageClassName. The chart renders
# the field vm-operator v0.75.0 rejects (see issue #2172); the run-scoped copy carries the field
# the operator decodes (corev1.PersistentVolumeClaimSpec).
# Every object carries e2170.genieai.io/run: "2170" and no Helm ownership annotations, so the
# release can never adopt them and the cleanup can delete them by label.
# Source: genieai-umbrella/templates/observability/networkpolicies.yaml
# Collector gateway: receives OTLP from app SDKs and from the
# filelog agent; ships to VLSingle / VMSingle / VTSingle.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-gateway
  namespace: genieai
  labels:
    e2170.genieai.io/run: "2170"
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: "0.2.184"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: "observability"
    genieai.io/component: "observability"
    genieai.io/managed-by: helm
spec:
  podSelector:
    # The operator owns the workload pods' labels; the stable selector
    # is the managed-by label (OTC pods for both CRs carry it — the
    # gateway and agent policies then differ only by ports).
    matchLabels:
      app.kubernetes.io/managed-by: opentelemetry-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OTLP/HTTP + OTLP/gRPC from any pod in the namespace. App
    # SDKs dial the gateway at 4318 (HTTP) and 4317 (gRPC); the
    # filelog agent dials 4318 from the same namespace too.
    #
    # `podSelector: {}` is DELIBERATE and is the one place in this chart
    # where a policy is not default-deny: it is the OTLP intake, and the
    # set of instrumented workloads is whatever the release happens to
    # run — the collector cannot enumerate its own clients, and a
    # component list here would silently drop telemetry the moment a
    # service is added. The trade-off is explicit: any pod in this
    # namespace can push arbitrary metrics, logs or traces into the
    # collector. That is the same trust boundary as the metrics
    # ingress, and it is why the gateway's own egress stays restrictive.
    #
    # The kubelet probe on the health extension (13133) is NOT listed:
    # it originates from the node, which no peer selector can name, so
    # it rides the CNI's host-to-pod default. A CNI that denies that
    # by default leaves this collector un-Ready — see the CNI note in
    # charts/README.md ("Cluster prerequisites").
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: genieai-obs
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
  egress:
    # DNS resolution to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # VLSingle OTLP ingest (VL default OTLP port 9428).
    - to:
        - podSelector:
            matchLabels:
              managed-by: vm-operator
              app.kubernetes.io/instance: victorialogs
      ports:
        - protocol: TCP
          port: 9428
    # VMSingle Prometheus remote-write. The port is 8429, NOT the 8428
    # the collector's endpoint names: the vm-operator Service publishes
    # 8428 as an ALIAS that DNATs to the pod's 8429, and a
    # NetworkPolicy is evaluated after that translation. A rule on 8428
    # therefore admits nothing, and the failure is silent — the
    # collector's prometheusremotewrite exporter just times out
    # ("context deadline exceeded") and drops every batch, while logs
    # and traces keep flowing because VictoriaLogs and VictoriaTraces
    # map their Service port straight through. Verified on the laptop:
    # deleting this policy took otelcol_exporter_sent_metric_points from
    # 0 to 556 in under a minute.
    # Same trap as every other pod-to-pod peer in this chart: use the
    # container port, not the Service port.
    - to:
        - podSelector:
            matchLabels:
              managed-by: vm-operator
              app.kubernetes.io/instance: vmetrics
      ports:
        - protocol: TCP
          port: 8429
    # VTSingle is single-port (-httpListenAddr=:10428): the Jaeger query
    # API AND the OTLP ingest (/insert/opentelemetry) both live there —
    # the collector's exporter dials 10428 (see otel-collector.yaml).
    - to:
        - podSelector:
            matchLabels:
              managed-by: vm-operator
              app.kubernetes.io/instance: vtraces
      ports:
        - protocol: TCP
          port: 10428
---
# Source: genieai-umbrella/templates/observability/grafana.yaml
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: genieai-grafana
  namespace: genieai
  labels:
    e2170.genieai.io/run: "2170"
    # component "grafana" (not "observability"): every grafana-operator CR
    # in this chart selects its instance via
    # instanceSelector.matchLabels app.kubernetes.io/component: grafana —
    # any other component label leaves datasources/folders/dashboards/
    # alert rules silently unimported.
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: "0.2.184"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: "grafana"
    genieai.io/component: "grafana"
    genieai.io/managed-by: helm
spec:
  # Explicit image version. Without it the operator substitutes its
  # built-in default — 13.1.3 on v5.25.0 — and that Docker Hub tag's
  # amd64 /run.sh is 0 bytes: the pod crashloops with `exec /run.sh:
  # exec format error` on every fresh pull (#1420). Default 12.4 = the
  # version docker-compose pins, one Grafana across both paths.
  version: "12.4"
  # Resource overrides: the operator's own defaults are 100m/256Mi
  # request and 1024Mi limit. The container-level block is what the
  # CRD accepts (see the note below) and the operator merges it by
  # container name.
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              resources:
                limits:
                  cpu: 500m
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 128Mi
  # Service spec the operator MUST materialise for the edge route to
  # resolve. Two contracts live here:
  #   - the port: grafana-operator defaults the Service to Grafana's own
  #     3000 (config.GrafanaHTTPPort), so a backendRef on 80 has no
  #     matching ServicePort and every request 503s.
  #   - the selector: pinning it makes the route's Service independent of
  #     the operator's pod labels.
  # spec.service.metadata.name is NOT in the CRD schema (annotations and
  # labels only) — the apiserver prunes it silently, so the Service name
  # is the operator's own convention: "<cr-name>-service", i.e.
  # genieai-grafana-service. That is the name gateway/httproute.yaml
  # routes /grafana to; the two must not drift.
  service:
    spec:
      type: ClusterIP
      # The operator labels the Grafana pods with EXACTLY {app: <cr-name>}
      # (reconcilers/grafana/deployment_reconciler.go, getSelectorLabels) and
      # selects them with the same label. A selector on
      # app.kubernetes.io/* matches nothing here: the Service gets zero
      # endpoints and every request 503s at the edge.
      selector:
        app: genieai-grafana
      ports:
        - name: http
          port: 80
          targetPort: 3000
          protocol: TCP
  # Admin credentials: the operator owns them. It creates
  # "<cr-name>-admin-credentials" (resources.GetGrafanaAdminSecret, the
  # name is built as "%s-admin-credentials") and uses it when it already
  # exists — so an operator-provided Secret named
  # "genieai-grafana-admin-credentials" pins the password, and without
  # one the operator generates it. The CR has no field for it: the
  # grafana-operator v5 CRD decodes strictly, and an unknown
  # `credentialsEx` field makes the API server reject the WHOLE Grafana
  # resource.
  # Resource block: the operator sets its own defaults (100m/256Mi
  # request, 1024Mi limit) and the CR cannot override them at the top
  # level either — `spec.resources` is not in the CRD, and the same
  # strict decoding rejects the whole resource. The container-level
  # block below is the only place the CRD accepts one: the operator
  # merges `spec.deployment` over its generated Deployment with a
  # STRATEGIC merge patch, whose container list merges by name, so the
  # operator keeps its image and args and only the resources change.
  config:
    # The edge mounts this tier at /grafana (see gateway/httproute.yaml).
    # root_url + serve_from_sub_path are what make that work: without
    # them Grafana emits absolute asset URLs at the domain root
    # (/public/*), which the SPA catch-all answers with index.html and
    # the UI renders blank. Same shape the compose path gets from Kong's
    # strip-prefix location.
    server:
      # Through the shared helper, not a raw values chain: the helper
      # normalizes a cleared ingress block (failing by name, as every
      # consumer of the public host does) and validates the host:port
      # shape this URL feeds to the browser. The else-branch the raw
      # chain carried was unreachable — no render passes the guards
      # with ingress.host unset — and advertised a degrade path nothing
      # could take.
      root_url: https://genieai-forge.local:4443/grafana
      # spec.config is a map[string]string (the ini-file form): every
      # value must be a STRING. A YAML boolean is rejected by the API
      # server with "must be of type string: boolean" — the whole Grafana
      # resource goes with it.
      serve_from_sub_path: "true"
    log:
      mode: console
    security:
      # The operator's own default user is "admin"; a literal here is
      # what the admin secret reconciler writes into
      # genieai-grafana-admin-credentials on every reconcile — it wins
      # over whatever user an operator-provided Secret carried.
      # Quoted: spec.config is a map[string]string — an unquoted YAML
      # boolean (an operator writing `adminUser: true`) is rejected by
      # the API server and takes the whole Grafana CR — datasources,
      # folders, dashboards, alert rules — with it.
      admin_user: "admin"
---
# Source: genieai-umbrella/templates/observability/grafana-dashboards.yaml
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  # RFC 1123: lowercase alphanumerics and "-", no underscore. The group
  # names carry both a dot and an underscore ("observability.vm_storage"),
  # so both have to be replaced — a name with an underscore is rejected
  # by the API server, and every GrafanaAlertRuleGroup in the release
  # would fail to apply (no alerting at all).
  name: observability-pipeline-health
  namespace: genieai
  labels:
    e2170.genieai.io/run: "2170"
    helm.sh/chart: genieai-umbrella-0.2.184
    app.kubernetes.io/name: genieai-umbrella
    app.kubernetes.io/instance: genieai
    app.kubernetes.io/version: "0.2.184"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: "alerts"
    genieai.io/component: "alerts"
    genieai.io/managed-by: helm
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  folderRef: genieai-observability
  allowCrossNamespaceImport: true
  interval: 60s
  rules:
    - annotations:
        description: OTel Collector is not ingesting data. VictoriaMetrics received zero
          rows for over 2 minutes. Check Collector health and pipeline connectivity.
        summary: OTel Collector pipeline is broken
      condition: C
      data:
      - datasourceUid: victoriametrics
        model:
          expr: rate(vm_rows_inserted_total{type="promremotewrite"}[2m])
          instant: false
          intervalMs: 1000
          maxDataPoints: 43200
          refId: A
          type: math
        refId: A
        relativeTimeRange:
          from: 600
          to: 0
      - datasourceUid: __expr__
        model:
          conditions:
          - evaluator:
              params:
              - 0
              type: lt
            operator:
              type: and
            query:
              params:
              - B
              type: ref
            reducer:
              type: last
            type: query
          datasource:
            type: __expr__
            uid: __expr__
          expression: A
          instant: true
          intervalMs: 1000
          maxDataPoints: 43200
          reducer: last
          refId: B
          type: reduce
        refId: B
        relativeTimeRange:
          from: 600
          to: 0
      - datasourceUid: __expr__
        model:
          conditions:
          - evaluator:
              params:
              - 0.5
              type: lt
            operator:
              type: and
            query:
              params:
              - C
              type: ref
            reducer:
              type: last
            type: query
          datasource:
            type: __expr__
            uid: __expr__
          expression: B
          instant: true
          intervalMs: 1000
          maxDataPoints: 43200
          refId: C
          type: threshold
        refId: C
        relativeTimeRange:
          from: 600
          to: 0
      execErrState: Alerting
      for: 2m
      labels:
        component: otel-collector
        severity: critical
      noDataState: Alerting
      title: OTel Collector Down
      uid: otel_collector_down
---
