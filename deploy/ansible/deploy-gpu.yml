---
# GENIE.AI - GPU Node Deployment Playbook (NVIDIA and AMD ROCm vendors)
#
# One playbook, two inventory groups, one GPU-node compose template. The
# vendor axis is a VARIABLE, not a file set:
#
#   - [itu_rtx_gpu_api] hosts run the NVIDIA plays (Container Toolkit,
#     daemon.json). They never set gpu_vendor.
#   - [rocm_gpu_nodes] hosts run the ROCm plays (amdgpu + /dev/kfd
#     verification). Their vars load from vars/rocm_gpu_nodes.yml +
#     vars/vault-rocm-gpu.yml (per-GPU-node secrets, never committed),
#     NOT from group_vars/ — a directory there must match an inventory
#     group name, and a second GPU playbook is exactly the file-set
#     drift this collapse removed.
#
# The compose template (templates/docker-compose.gpu.yaml.j2) renders the
# same service graph for both vendors: the ROCm-only bits (image pins,
# entrypoint, device rows, the rocm-models pooling services) sit behind
# `gpu_vendor == 'rocm'` conditionals and render NOTHING on NVIDIA.
#
# Usage:
#   ansible-playbook -i inventory/gpu.ini deploy-gpu.yml --vault-id gpu@prompt
#
# Tagged re-runs:
#   ansible-playbook -i inventory/gpu.ini deploy-gpu.yml --tags install --vault-id gpu@prompt
#   ansible-playbook -i inventory/gpu.ini deploy-gpu.yml --tags prepare --vault-id gpu@prompt
#   ansible-playbook -i inventory/gpu.ini deploy-gpu.yml --tags deploy --vault-id gpu@prompt
#
# Tags:
#   install  - Docker; NVIDIA Container Toolkit (itu_rtx_gpu_api) or
#              ROCm device verification (rocm_gpu_nodes)
#   prepare  - Directories, template rendering (nginx config, API keys,
#              compose, sizing env)
#   deploy   - Compose up, smoke tests
#
#   The served-model preflight plays (first in the file) run on EVERY
#   invocation regardless of --tags: a missing vllm_llm_model_id /
#   vllm_translation_model_id fails the run before any task touches the
#   node (#2119).

- name: GPU Node - Served-model preflight (fail before any node change, #2119)
  hosts: itu_rtx_gpu_api
  gather_facts: false
  tags: [always]
  tasks:
    - name: Assert the served model ids are defined
      ansible.builtin.assert:
        that:
          - vllm_llm_model_id is defined and vllm_llm_model_id | length > 0
          - vllm_translation_model_id is defined and vllm_translation_model_id | length > 0
        fail_msg: >-
          vllm_llm_model_id and vllm_translation_model_id are MANDATORY on the GPU node.
          The GPU overlay serves exactly these ids (--model / --served-model-name) and the
          tool-calling pin keys on vllm_llm_model_id; there is NO template default, so a
          missing value would otherwise silently substitute a smaller model (issue #2119).
          Define both in group_vars/itu_rtx_gpu_api/vars.yml (or vault.yml) and re-run.

- name: ROCm GPU Node - Served-model preflight (fail before any node change, #2119)
  hosts: rocm_gpu_nodes
  gather_facts: false
  tags: [always]
  vars_files:
    - vars/rocm_gpu_nodes.yml
    - vars/vault-rocm-gpu.yml
  tasks:
    - name: Assert the served model ids are defined
      ansible.builtin.assert:
        that:
          - vllm_llm_model_id is defined and vllm_llm_model_id | length > 0
          - vllm_translation_model_id is defined and vllm_translation_model_id | length > 0
        fail_msg: >-
          vllm_llm_model_id and vllm_translation_model_id are MANDATORY on the GPU node.
          The GPU overlay serves exactly these ids (--model / --served-model-name) and the
          tool-calling pin keys on vllm_llm_model_id; there is NO template default, so a
          missing value would otherwise silently substitute a smaller model (issue #2119).
          Define both in vars/rocm_gpu_nodes.yml (or vars/vault-rocm-gpu.yml) and re-run.

- name: GPU Node - Detect environment
  hosts: itu_rtx_gpu_api
  gather_facts: false
  tasks:
    - name: Display GPU node deployment target
      ansible.builtin.debug:
        msg: "GPU Node: {{ inventory_hostname }} ({{ ansible_host }})"

- name: GPU Node - Docker installation (both vendors)
  hosts: itu_rtx_gpu_api,rocm_gpu_nodes
  tags: [install]
  become: true
  roles:
    - role: docker

- name: GPU Node - NVIDIA Container Toolkit
  hosts: itu_rtx_gpu_api
  tags: [install]
  become: true
  tasks:
    - name: Ensure NVIDIA Container Toolkit GPG key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        mode: '0644'
        force: true

    - name: Ensure NVIDIA Container Toolkit repository (DEB822 format)
      ansible.builtin.copy:
        content: |
          Types: deb
          URIs: https://nvidia.github.io/libnvidia-container/stable/deb/amd64
          Suites: /
          Components:
          Signed-By: /etc/apt/keyrings/nvidia-container-toolkit.asc
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.sources
        mode: '0644'

    - name: Pin NVIDIA toolkit package versions
      ansible.builtin.copy:
        content: |
          Package: nvidia-container-toolkit nvidia-container-toolkit-base libnvidia-container-tools libnvidia-container1
          Pin: version {{ nvidia_version_pin | default('1.18.*') }}
          Pin-Priority: 900
        dest: /etc/apt/preferences.d/nvidia-toolkit-pin
        mode: '0644'

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        update_cache: true
        state: latest

    - name: Hold NVIDIA toolkit packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - nvidia-container-toolkit
        - nvidia-container-toolkit-base
        - libnvidia-container-tools
        - libnvidia-container1

    - name: Configure Docker daemon for NVIDIA runtime
      block:
        - name: Read existing daemon.json
          ansible.builtin.slurp:
            src: /etc/docker/daemon.json
          register: daemon_json_existing
          failed_when: false

        - name: Set daemon.json content (merge NVIDIA config)
          ansible.builtin.set_fact:
            daemon_json_final: >-
              {{ (daemon_json_existing.content | b64decode | from_json
                  if daemon_json_existing is succeeded else {})
                | combine({'runtimes': {'nvidia': {
                  'path': 'nvidia-container-runtime',
                  'runtimeArgs': []
                }}, 'default-runtime': 'nvidia'}) }}

        - name: Write merged daemon.json
          ansible.builtin.copy:
            content: "{{ daemon_json_final | to_nice_json }}"
            dest: /etc/docker/daemon.json
            mode: '0644'
          notify: Restart Docker

    - name: Enable NVIDIA GPU access for unprivileged containers
      ansible.builtin.lineinfile:
        path: /etc/nvidia-container-runtime/config.toml
        regexp: '^#?accept-nvidia-visible-devices-envvar-when-unprivileged'
        line: accept-nvidia-visible-devices-envvar-when-unprivileged = true
        state: present
      notify: Restart Docker

    - name: Apply daemon.json + NVIDIA config before verifying runtime
      ansible.builtin.meta: flush_handlers

    - name: Verify NVIDIA runtime
      ansible.builtin.command: docker info --format '{{ "{{" }}.Runtimes{{ "}}" }}'
      register: nvidia_verify
      failed_when: "'nvidia' not in nvidia_verify.stdout"
      changed_when: false

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

- name: GPU Node - Project preparation and template rendering
  hosts: itu_rtx_gpu_api
  tags: [prepare]
  become: true
  tasks:
    - name: Validate required vault variables
      ansible.builtin.assert:
        that:
          - hugging_face_hub_token is defined and hugging_face_hub_token | length > 0
          - gpu_api_keys is defined and gpu_api_keys | length > 0
        fail_msg: >-
          Missing required vault variable(s).
          Edit group_vars/itu_rtx_gpu_api/vault.yml and set:
          hugging_face_hub_token, gpu_api_keys.
        quiet: true

    - name: Ensure project directories exist
      ansible.builtin.file:
        path: "{{ gpu_deploy_dir }}/{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      loop:
        - "{{ gpu_data_dir }}"
        - "{{ gpu_data_dir }}/huggingface"
        - "{{ gpu_generated_dir }}"
        - ssl

    - name: Generate self-signed SSL certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout {{ gpu_deploy_dir }}/ssl/server.key
          -out {{ gpu_deploy_dir }}/ssl/server.crt
          -subj "/CN={{ gpu_public_domain }}"
          -addext "subjectAltName={{ gpu_public_domain | regex_search('^(\\d+\\.){3}\\d+$') | ternary('IP', 'DNS') }}:{{ gpu_public_domain }}"
        creates: "{{ gpu_deploy_dir }}/ssl/server.crt"
      register: gpu_self_signed
      when: gpu_self_signed_certs | default(true)

    - name: Copy SSL certificates to Docker volume
      ansible.builtin.copy:
        src: "{{ gpu_deploy_dir }}/ssl/{{ item }}"
        dest: "{{ gpu_deploy_dir }}/ssl/{{ item }}"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        remote_src: true
      loop:
        - server.crt
        - server.key

    - name: Render nginx proxy configuration
      ansible.builtin.template:
        src: templates/gpu-proxy.conf.j2
        dest: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/gpu-proxy.conf"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      notify: Reload nginx-gpu

    - name: Render API keys map
      ansible.builtin.template:
        src: templates/api_keys.map.j2
        dest: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/api_keys.map"
        mode: '0600'
        owner: root
        group: root
      notify: Reload nginx-gpu
      no_log: true

    - name: Render docker-compose.gpu.yaml from template
      ansible.builtin.template:
        src: templates/docker-compose.gpu.yaml.j2
        dest: "{{ gpu_deploy_dir }}/docker-compose.gpu.yaml"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

  handlers:
    - name: Reload nginx-gpu
      ansible.builtin.shell: >
        docker compose -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml exec -T nginx-gpu nginx -s reload
      changed_when: true
      # Silently skip if container not running yet (first deploy)
      failed_when: false

- name: GPU Node - Deploy services
  hosts: itu_rtx_gpu_api
  tags: [deploy]
  become: true
  tasks:
    - name: Validate GPU compose configuration
      ansible.builtin.shell: >
        docker compose
        {% if gpu_env_file is defined and gpu_env_file | length > 0 %}--env-file {{ gpu_deploy_dir }}/{{ gpu_env_file }}{% endif %}
        -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml config --quiet
      args:
        chdir: "{{ gpu_deploy_dir }}"
      register: compose_validate
      changed_when: false
      failed_when: compose_validate.rc != 0

    - name: Deploy GPU node services
      ansible.builtin.shell: >
        docker compose
        {% if gpu_env_file is defined and gpu_env_file | length > 0 %}--env-file {{ gpu_deploy_dir }}/{{ gpu_env_file }}{% endif %}
        -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml
        up -d
      args:
        chdir: "{{ gpu_deploy_dir }}"
      register: compose_deploy
      changed_when: "'Started' in compose_deploy.stdout or 'Created' in compose_deploy.stdout"


    - name: Stat GPU node SSL and api_keys files before normalization
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: gpu_node_files_pre
      loop:
        - { path: "{{ gpu_deploy_dir }}/ssl/server.crt" }
        - { path: "{{ gpu_deploy_dir }}/ssl/server.key" }
        - { path: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/api_keys.map" }
      failed_when: false

    # The cap-dropped nginx-gpu container (root with no DAC_OVERRIDE) can
    # only read files it owns. Re-owning here keeps the fix idempotent
    # and self-healing across re-runs.
    - name: Normalize GPU node file ownership for the cap-dropped nginx-gpu container
      become: true
      become_user: root
      become_method: sudo
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: file
        owner: root
        group: root
        mode: >-
          {{ '0644' if (item.item.path.endswith('server.crt') or item.item.path.endswith('api_keys.map')) else '0600' }}
      loop: "{{ gpu_node_files_pre.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when:
        - item.stat.exists
        - (item.stat.pw_name != 'root')

    - name: Deploy output
      ansible.builtin.debug:
        var: compose_deploy.stdout_lines

- name: GPU Node - Smoke tests (path-based routing on port {{ gpu_https_port | default('443') }})
  hosts: itu_rtx_gpu_api
  tags: [deploy]
  become: true
  tasks:
    - name: Wait for vLLM LLM health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/llm/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: health_llm
      until: health_llm.status == 200
      retries: 30
      delay: 15

    - name: Wait for vLLM Translation health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/translation/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: health_translation
      until: health_translation.status == 200
      retries: 30
      delay: 15

    - name: Wait for TEI Embedding health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/embed/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: health_embedding
      until: health_embedding.status == 200
      retries: 30
      delay: 15

    - name: Wait for TEI Reranker health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/rerank/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: health_reranker
      until: health_reranker.status == 200
      retries: 30
      delay: 15

    - name: Wait for docling-serve health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/docling/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: health_docling
      until: health_docling.status == 200
      retries: 30
      delay: 15

    - name: Verify 401 rejection without API key
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/llm/health"
        method: GET
        validate_certs: false
      register: auth_reject
      failed_when: auth_reject.status != 401

    - name: Deployment summary
      ansible.builtin.shell: |
        echo ""
        echo "============================================="
        echo "GPU Node deployment complete"
        echo "============================================="
        echo "vLLM LLM:         {{ health_llm.status }}"
        echo "vLLM Translation: {{ health_translation.status }}"
        echo "TEI Embedding:    {{ health_embedding.status }}"
        echo "TEI Reranker:     {{ health_reranker.status }}"
        echo "docling-serve:    {{ health_docling.status }}"
        echo "Auth (401 test):  {{ auth_reject.status }}"
        echo "Domain:           {{ gpu_public_domain }}"
        echo "============================================="
        echo ""
      changed_when: false

# =============================================================================
# AMD ROCm GPU node (Strix Halo / gfx1151 class) — same playbook, second
# vendor. NO NVIDIA Container Toolkit plays, NO daemon.json changes run on
# this group: ROCm containers need no host userland — the in-tree kernel
# driver (/dev/kfd + /dev/dri) plus container-side device passthrough and
# group_add are everything. The GPU tier runs via `docker compose up` (NOT
# `docker stack deploy`: Swarm ignores compose `devices:` — see the ROCm
# spike results) with the sizing env and the rocm-models profile.
# =============================================================================

- name: ROCm GPU Node - Detect environment
  hosts: rocm_gpu_nodes
  gather_facts: false
  vars_files:
    - vars/rocm_gpu_nodes.yml
    - vars/vault-rocm-gpu.yml
  tasks:
    - name: Display ROCm GPU node deployment target
      ansible.builtin.debug:
        msg: "ROCm GPU Node: {{ inventory_hostname }} ({{ ansible_host | default('localhost') }})"

- name: ROCm GPU Node - Device access verification
  hosts: rocm_gpu_nodes
  tags: [install]
  become: true
  vars_files:
    - vars/rocm_gpu_nodes.yml
    - vars/vault-rocm-gpu.yml
  tasks:
    - name: Assert amdgpu kernel module loaded
      ansible.builtin.stat:
        path: /sys/module/amdgpu
      register: amdgpu_module
      failed_when: not amdgpu_module.stat.exists

    - name: Assert /dev/kfd present
      ansible.builtin.stat:
        path: /dev/kfd
      register: kfd_dev
      failed_when: not kfd_dev.stat.exists

    - name: Assert /dev/dri/renderD128 present
      ansible.builtin.stat:
        path: /dev/dri/renderD128
      register: render_dev
      failed_when: not render_dev.stat.exists

    - name: Read render and video group GIDs
      ansible.builtin.command: "getent group {{ item }}"
      loop: [render, video]
      register: gpu_groups
      changed_when: false
      # NO custom failed_when: inside a loop, `register` binds the PER-ITEM
      # result to the variable, so `gpu_groups.results` does not exist yet —
      # the old expression raised "object of type 'dict' has no attribute
      # 'results'" and failed this task on EVERY host, whatever getent
      # returned (and `item.item` was invalid for the same reason: `item`
      # IS the group name). `ansible.builtin.command` already fails the task
      # on a non-zero rc — getent exits 2 for an unknown group — and the
      # reporting task below reads `gpu_groups.results` correctly once the
      # loop has finished.

    - name: Report measured GIDs (must match RENDER_GID/VIDEO_GID in the sizing env)
      ansible.builtin.debug:
        msg: "{{ item.item }}={{ item.stdout.split(':')[2] }}"
      loop: "{{ gpu_groups.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: ROCm GPU Node - Project preparation and template rendering
  hosts: rocm_gpu_nodes
  tags: [prepare]
  become: true
  vars_files:
    - vars/rocm_gpu_nodes.yml
    - vars/vault-rocm-gpu.yml
  tasks:
    - name: Validate required vault variables
      ansible.builtin.assert:
        that:
          - hugging_face_hub_token is defined and hugging_face_hub_token | length > 0
          - gpu_api_keys is defined and gpu_api_keys | length > 0
          # The certificate task renders `-subj "/CN={{ gpu_public_domain }}"`
          # — an empty value makes openssl exit 1 without writing server.crt
          # and the SAN render as `DNS:` (empty). Without this assert the
          # operator gets an opaque openssl error instead of the remedy.
          - gpu_public_domain is defined and gpu_public_domain | length > 0
        fail_msg: >-
          Missing required variable(s).
          This ROCm node's secrets are per-GPU-node and never committed, so
          the vault is created by the operator:
          ansible-vault create vars/vault-rocm-gpu.yml
          In it set: hugging_face_hub_token, gpu_api_keys.
          In vars/rocm_gpu_nodes.yml set gpu_public_domain (the host's
          public domain — the TLS certificate task writes
          /CN={{ gpu_public_domain }}).
        quiet: true

    - name: Ensure project directories exist
      ansible.builtin.file:
        path: "{{ gpu_deploy_dir }}/{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      loop:
        - "{{ gpu_data_dir }}"
        - "{{ gpu_data_dir }}/huggingface"
        - "{{ gpu_generated_dir }}"
        - ssl

    - name: Generate self-signed SSL certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout {{ gpu_deploy_dir }}/ssl/server.key
          -out {{ gpu_deploy_dir }}/ssl/server.crt
          -subj "/CN={{ gpu_public_domain }}"
          -addext "subjectAltName={{ gpu_public_domain | regex_search('^(\\d+\\.){3}\\d+$') | ternary('IP', 'DNS') }}:{{ gpu_public_domain }}"
        creates: "{{ gpu_deploy_dir }}/ssl/server.crt"
      register: rocm_self_signed
      when: gpu_self_signed_certs | default(true)

    - name: Copy SSL certificates to Docker volume path
      ansible.builtin.copy:
        src: "{{ gpu_deploy_dir }}/ssl/{{ item }}"
        dest: "{{ gpu_deploy_dir }}/ssl/{{ item }}"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        remote_src: true
      loop:
        - server.crt
        - server.key

    - name: Render nginx proxy configuration
      ansible.builtin.template:
        src: templates/gpu-proxy.conf.j2
        dest: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/gpu-proxy.conf"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      notify: Reload nginx-gpu

    - name: Render API keys map
      ansible.builtin.template:
        src: templates/api_keys.map.j2
        dest: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/api_keys.map"
        mode: '0600'
        owner: root
        group: root
      notify: Reload nginx-gpu
      no_log: true

    # ONE compose template for both vendors (the ROCm-only service
    # definitions and device rows render behind `gpu_vendor == 'rocm'`).
    # No overlay file is copied: the compose file set is vendor-free.
    - name: Render docker-compose.gpu.yaml from template (vendor-conditioned)
      ansible.builtin.template:
        src: templates/docker-compose.gpu.yaml.j2
        dest: "{{ gpu_deploy_dir }}/docker-compose.gpu.yaml"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy the Strix Halo sizing env from the repo checkout
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../env.strixhalo"
        dest: "{{ gpu_deploy_dir }}/env.strixhalo"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Render host-specific env overrides (GIDs, ports)
      ansible.builtin.copy:
        content: |
          RENDER_GID={{ rocm_render_gid | default(990) }}
          VIDEO_GID={{ rocm_video_gid | default(44) }}
        dest: "{{ gpu_deploy_dir }}/rocm-host.env"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

  handlers:
    - name: Reload nginx-gpu
      ansible.builtin.shell: >
        docker compose
        --env-file {{ gpu_deploy_dir }}/env.strixhalo
        --env-file {{ gpu_deploy_dir }}/rocm-host.env
        -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml
        exec -T nginx-gpu nginx -s reload
      changed_when: true
      # Silently skip if container not running yet (first deploy)
      failed_when: false

- name: ROCm GPU Node - Deploy services
  hosts: rocm_gpu_nodes
  tags: [deploy]
  become: true
  vars_files:
    - vars/rocm_gpu_nodes.yml
    - vars/vault-rocm-gpu.yml
  vars:
    # The pooling toggle assembles the --profile argument (there is no
    # COMPOSE_PROFILES shortcut — it is a CLI-level variable that
    # --env-file does not set). rocm_pooling=true (the default, and the
    # documented single-server topology) starts the two pooling vLLM
    # instances (vllm-reranker, vllm-embedding). rocm_pooling=false is
    # the split venue: the gpu-proxy routes /rerank and /v1/embeddings
    # to the node-side TEI instances (unset RERANKER_BACKEND /
    # EMBEDDING_BACKEND in env.strixhalo the same way), so the pooling
    # services do not render and their ~4.6 GiB of GTT stays unclaimed.
    rocm_pooling_profile_args: "{{ '--profile rocm-models' if (rocm_pooling | default(true)) else '' }}"
  tasks:
    - name: Validate ROCm GPU compose configuration
      ansible.builtin.shell: >
        docker compose
        --env-file {{ gpu_deploy_dir }}/env.strixhalo
        --env-file {{ gpu_deploy_dir }}/rocm-host.env
        {{ rocm_pooling_profile_args }}
        -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml
        config --quiet
      args:
        chdir: "{{ gpu_deploy_dir }}"
      register: rocm_compose_validate
      changed_when: false
      failed_when: rocm_compose_validate.rc != 0

    - name: Deploy ROCm GPU node services
      ansible.builtin.shell: >
        docker compose
        --env-file {{ gpu_deploy_dir }}/env.strixhalo
        --env-file {{ gpu_deploy_dir }}/rocm-host.env
        {{ rocm_pooling_profile_args }}
        -f {{ gpu_deploy_dir }}/docker-compose.gpu.yaml
        up -d
      args:
        chdir: "{{ gpu_deploy_dir }}"
      register: rocm_compose_deploy
      changed_when: "'Started' in rocm_compose_deploy.stdout or 'Created' in rocm_compose_deploy.stdout"

    - name: Stat ROCm GPU node SSL and api_keys files before normalization
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: rocm_node_files_pre
      loop:
        - { path: "{{ gpu_deploy_dir }}/ssl/server.crt" }
        - { path: "{{ gpu_deploy_dir }}/ssl/server.key" }
        - { path: "{{ gpu_deploy_dir }}/{{ gpu_generated_dir }}/api_keys.map" }
      failed_when: false

    # Same cap-dropped nginx container constraint as the NVIDIA plays:
    # re-own so the container (root, no DAC_OVERRIDE) can read them.
    - name: Normalize ROCm GPU node file ownership for the cap-dropped nginx-gpu container
      become: true
      become_user: root
      become_method: sudo
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: file
        owner: root
        group: root
        mode: >-
          {{ '0644' if (item.item.path.endswith('server.crt') or item.item.path.endswith('api_keys.map')) else '0600' }}
      loop: "{{ rocm_node_files_pre.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when:
        - item.stat.exists
        - (item.stat.pw_name != 'root')

    - name: Deploy output
      ansible.builtin.debug:
        var: rocm_compose_deploy.stdout_lines

- name: ROCm GPU Node - Smoke tests (path-based routing on port {{ gpu_https_port | default('443') }})
  hosts: rocm_gpu_nodes
  tags: [deploy]
  become: true
  vars_files:
    - vars/rocm_gpu_nodes.yml
    - vars/vault-rocm-gpu.yml
  tasks:
    - name: Wait for vLLM LLM health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/llm/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_llm
      until: rocm_health_llm.status == 200
      retries: 30
      delay: 15

    - name: Wait for vLLM Translation health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/translation/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_translation
      until: rocm_health_translation.status == 200
      retries: 30
      delay: 15

    - name: Wait for TEI Embedding health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/embed/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_embedding
      until: rocm_health_embedding.status == 200
      retries: 30
      delay: 15

    - name: Wait for TEI Reranker health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/rerank/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_reranker
      until: rocm_health_reranker.status == 200
      retries: 30
      delay: 15

    - name: Wait for docling-serve health
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/docling/health"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ gpu_api_keys[0].name }}"
      register: rocm_health_docling
      until: rocm_health_docling.status == 200
      retries: 30
      delay: 15

    - name: Verify 401 rejection without API key
      ansible.builtin.uri:
        url: "https://localhost:{{ gpu_https_port | default('443') }}/llm/health"
        method: GET
        validate_certs: false
      register: rocm_auth_reject
      failed_when: rocm_auth_reject.status != 401

    - name: Deployment summary
      ansible.builtin.shell: |
        echo ""
        echo "============================================="
        echo "ROCm GPU Node deployment complete"
        echo "============================================="
        echo "vLLM LLM:         {{ rocm_health_llm.status }}"
        echo "vLLM Translation: {{ rocm_health_translation.status }}"
        echo "TEI Embedding:    {{ rocm_health_embedding.status }}"
        echo "TEI Reranker:     {{ rocm_health_reranker.status }}"
        echo "docling-serve:    {{ rocm_health_docling.status }}"
        echo "Auth (401 test):  {{ rocm_auth_reject.status }}"
        echo "Domain:           {{ gpu_public_domain }}"
        echo "============================================="
        echo ""
      changed_when: false
