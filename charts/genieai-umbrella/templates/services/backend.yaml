{{- if .Values.services.backend.enabled -}}
{{- $ns := .Values.namespace -}}
{{- $arangoHost := include "genieai-umbrella.arangoHost" . -}}
{{- $backendVals := deepCopy .Values -}}
{{- /* Remote translation API (OpenAI-compatible vLLM). Unset endpoint:
the backend's auto mode probes the in-cluster translation service
(gpu-models tier) and, finding none here, falls back to an in-process
CPU model (~6 Gi and a core of steady inference). Setting the endpoint
targets a GPU node's translation API directly. Consumers of the other
GPU endpoints (VLLM_ENDPOINT, EMBEDDING/RERANKER/DOCLING) are the OPEA
services — wired when that tier joins the chart. */ -}}
{{- $translationEnv := list -}}
{{- $translationSecrets := list -}}
{{- if .Values.services.backend.translation.endpoint }}
{{- $translationEnv = list
    (dict "name" "VLLM_TRANSLATION_ENDPOINT" "value" .Values.services.backend.translation.endpoint)
    (dict "name" "VLLM_TRANSLATION_MODEL_ID" "value" (.Values.services.backend.translation.modelId | default "google/gemma-3-4b-it"))
-}}
{{- $translationSecrets = list
    (dict "name" "VLLM_API_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" "vllm-api-key" "key" "VLLM_API_KEY")))
-}}
{{- end }}
{{- /* OPEA chat pipeline (chatqna). Unset = the code default
(chatqna-xeon-backend-server) — no ChatQnA service exists in
this chart yet; chat streaming fails fast until the OPEA tier joins
and the overlay points opeaHost at the in-cluster Service. */ -}}
{{- if .Values.services.backend.opeaHost }}
{{- $translationEnv = concat $translationEnv (list (dict "name" "OPEA_HOST" "value" .Values.services.backend.opeaHost)) -}}
{{- end }}
{{- /* STREAMING_TRANSLATION_ENABLED is a strict YAML boolean. Non-bool
values (0, "0", "false") fail at render time: Sprig's default/coalesce
treat false as empty and a non-empty string flips ternary to its true
branch, so a lenient coercion would silently stream translated output
against an operator's explicit off switch. */ -}}
{{- $streamingTranslation := .Values.services.backend.translation.streamingEnabled -}}
{{- if not (kindIs "bool" $streamingTranslation) -}}
{{- fail "services.backend.translation.streamingEnabled must be a YAML boolean (true or false)" -}}
{{- end -}}
{{- $urls := list
    (dict "name" "KEYCLOAK_URL" "value" (include "genieai-umbrella.keycloakInternalURL" .))
    (dict "name" "KEYCLOAK_REALM" "value" "genie")
    (dict "name" "KEYCLOAK_CLIENT_ID" "value" "genie-app")
    (dict "name" "ARANGO_URL" "value" (include "genieai-umbrella.arangoURL" .))
    (dict "name" "ARANGO_DB" "value" "_system")
    (dict "name" "ARANGO_USER" "value" "root")
    (dict "name" "OTEL_EXPORTER_OTLP_ENDPOINT" "value" (include "genieai-umbrella.otlpEndpoint" .))
    (dict "name" "TRANSLATION_CACHE" "value" "on")
    (dict "name" "TRANSLATION_CACHE_HOST" "value" (printf "redis-cache.%s.svc.cluster.local" $ns))
    (dict "name" "TRANSLATION_CACHE_PORT" "value" "6379")
    (dict "name" "STREAMING_TRANSLATION_ENABLED" "value" (ternary "1" "0" $streamingTranslation))
-}}
{{- $urls = concat $urls $translationEnv -}}
{{- $secretEnv := list (include "genieai-umbrella.secretKeyRefEnv" (dict "var" "ARANGO_PASSWORD" "secret" "arango-root-secret" "key" "password" "optional" true) | fromJson) -}}
{{- $secretEnv = concat $secretEnv $translationSecrets -}}
{{- $existing := index $backendVals.services.backend "env" | default list -}}
{{- $_ := set $backendVals.services.backend "env" (concat $existing $urls $secretEnv) -}}
{{- $ctx := dict "name" "backend" "component" "backend" "Values" $backendVals "Chart" .Chart "Release" .Release -}}
{{- include "genieai-umbrella.serviceDeployment" $ctx }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
---
# Default-deny with ingress allowlist and egress scoped to the data tier.
# Egress uses port-scoped ipBlock rules because the operator-managed peers
# (kube-arangodb, CloudNative-PG, Keycloak operator) expose their real pod
# labels only at runtime; guessed labels silently block traffic. A
# follow-up that inspects live pod labels can tighten these to
# namespaceSelector / podSelector peers when the operator label shape
# is known.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Same-namespace pods on the app port. AuthN/AuthZ is enforced at the
    # edge (Envoy Gateway); the gateway's data-plane pods live in their
    # own namespace and reach backend via a routed path rather than a
    # direct pod-to-pod peer in this namespace. The `podSelector: {}`
    # below is a placeholder for the gateway-tier selector (Plan 6/ingress
    # will tighten it to a specific peer label once the edge gateway's
    # data-plane label shape is known).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Data tier: ArangoDB (8529), CNPG keycloak-db (5432), Keycloak (8080),
    # Redis cache (6379). Port-scoped any-destination pending verified
    # peer labels — see header note above. Operators tightening to
    # specific peers should override this rule via the pluggable
    # `networkPolicy.peers` surface (Plan 6) rather than editing the
    # rendered NetworkPolicy in place.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8529
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 6379
        # OTLP exporter: required for the observability pipeline. Without
        # this port the default-deny policy drops all traces at the source.
        - protocol: TCP
          port: 4318
    # document-repository (file references) — post-DNAT pod port 3001;
    # the doc-repo ingress rule already permits backend as a peer.
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: documentRepository
      ports:
        - protocol: TCP
          port: 3001
    {{- if .Values.opea.enabled }}
    # Chat stream: the backend dials the chatqna orchestrator directly
    # (OPEA_HOST:8888) when the OPEA tier is enabled. query-service.js
    # builds the URL with no nginx hop; this egress rule is the only
    # path that lets the chat stream reach chatqna under default-deny.
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: chatqna
      ports:
        - protocol: TCP
          port: 8888
    {{- end }}
    {{- if and .Values.opea.enabled (eq .Values.opea.gpu.mode "external") }}
    # External GPU node — VLLM_TRANSLATION_ENDPOINT when the operator
    # routes the BFF's translation path at the same GPU node the OPEA
    # orchestrators reach. Port family (443 + 444) is intentionally
    # broad because services.backend.translation.endpoint is a free
    # string; a future tightening can derive the port from the URL.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 444
    {{- end }}
{{- end -}}
