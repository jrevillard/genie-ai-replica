{{- /*
  documentRepository depends on:
    - the ArangoDB Service from the data tier (kube-arangodb operator owns
      the Service name — the hostname comes from the arangoHost helper
      which honors .Values.data.arangodb.mode)
    - the `arango-root-secret` Secret in this namespace, operator-provided
      via their secret backend of choice; supplies ARANGO_PASSWORD via
      secretKeyRef below
  Both prerequisites are required for this Deployment's pods to schedule
  and become ready.
*/ -}}
{{- if .Values.services.documentRepository.enabled -}}
{{- $ns := .Values.namespace -}}
{{- $arangoHost := include "genieai-umbrella.arangoHost" . -}}
{{- $vals := deepCopy .Values -}}
{{- $urls := list
    (dict "name" "KEYCLOAK_URL" "value" (printf "http://keycloak-service.%s.svc.cluster.local:8080/auth" $ns))
    (dict "name" "KC_REALM" "value" "genie")
    (dict "name" "KC_CLIENT_ID" "value" "dataprep-service-client")
    (dict "name" "ARANGO_URL" "value" (printf "http://%s.%s.svc.cluster.local:8529" $arangoHost $ns))
    (dict "name" "ARANGO_DB" "value" "_system")
    (dict "name" "BACKEND_URL" "value" (printf "http://backend.%s.svc.cluster.local:80" $ns))
    (dict "name" "CLAMSCAN_HOST" "value" .Values.services.documentRepository.clamavHost)
    (dict "name" "CLAMSCAN_PORT" "value" (.Values.services.documentRepository.clamavPort | toString))
    (dict "name" "OTEL_EXPORTER_OTLP_ENDPOINT" "value" (include "genieai-umbrella.otlpEndpoint" .))
-}}
{{- $secretEnv := list
    (dict "name" "ARANGO_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" "arango-root-secret" "key" "password" "optional" true)))
-}}
{{- $_ := set $vals.services.documentRepository "env" (concat $urls $secretEnv) -}}
{{- $ctx := dict "name" "documentRepository" "component" "documentRepository" "Values" $vals "Chart" .Chart "Release" .Release -}}
{{- include "genieai-umbrella.serviceDeployment" $ctx }}
---
apiVersion: v1
kind: Service
metadata:
  name: document-repository
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "documentRepository") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3001
  selector:
    {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "documentRepository") | nindent 4 }}
---
# Default-deny with ingress from the BFF and egress scoped to the
# BFF, the ClamAV scanner, and the OTLP collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: document-repository
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "documentRepository") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: documentRepository
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Backend (file references) plus same-namespace peers on the
    # container port (post-DNAT). The `podSelector: {}` below is a
    # placeholder for the gateway-tier selector (Plan 6/ingress will
    # tighten it to a specific peer label once the edge gateway's
    # data-plane label shape is known).
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: backend
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # DNS resolution to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Backend BFF. Post-DNAT pod port (3000).
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: backend
      ports:
        - protocol: TCP
          port: 3000
    # ClamAV scanner. Post-DNAT pod port (3310); the Service port is
    # identical, but pod-to-pod peers must use the container port.
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: clamav
      ports:
        - protocol: TCP
          port: 3310
    # Data tier: ArangoDB (8529) — pending verified peer labels.
    # Same port-scoped pattern as the backend's data-tier egress.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8529
    # OTLP exporter. Required for the observability pipeline; without
    # this port the default-deny policy drops document-repository
    # telemetry.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 4318
{{- end -}}
