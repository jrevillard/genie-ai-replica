# Validates Ansible playbooks (syntax) and YAML linting for deployment docs.
# Covers MRs that only modify deploy/ansible/, docs/, or root-level files
# where no component lint/test job would otherwise trigger.
docs:validate:
  image: python:3.11-slim
  stage: lint
  before_script:
    - pip install ansible-core yamllint
    - ansible-galaxy collection install -r deploy/ansible/requirements.yml
