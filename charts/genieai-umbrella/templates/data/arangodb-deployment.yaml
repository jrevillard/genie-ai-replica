{{- if .Values.data.arangodb.enabled -}}
{{- /* Honor .Values.data.arangodb.mode ONLY — no auto-promotion.
       Switching mode requires a fresh uninstall+install (kube-arangodb
       cannot mutate an ArangoDeployment's spec.mode in place; the prior
       ArangoDeployment becomes orphaned on a Helm upgrade because Helm
       only manages resources in the current render). See
       docs/charts/arangodb-mode-migration.md. */ -}}
{{- $mode := .Values.data.arangodb.mode | default "single" -}}
{{- if eq $mode "single" -}}
apiVersion: database.arangodb.com/v1
kind: ArangoDeployment
metadata:
  # metadata.name MUST match the DNS name used by the chart + Swarm migration
  # paths. Swarm service is arango-vector-db; we render as arangodb-single to
  # match the chart's existing service consumer namespace, which is
  # downstream-of-here stable.
  name: arangodb-single
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "data-arangodb") | nindent 4 }}
    genieai.io/data-tier: arangodb
spec:
  mode: Single
  # Hardcoded `arangodb/arangodb:3.12.4` (no registry prefix) — the
  # mirror at registry.opensource.unicc.org does not carry this image
  # (`docker manifest inspect <mirror>/arangodb/arangodb:3.12.4`
  # returns "no such manifest"). Same pattern as the CNPG template's
  # hardcoded `ghcr.io/cloudnative-pg/postgresql:16`. The upstream
  # docker.io path is reachable; we don't pretend the mirror covers
  # the data tier.
  image: arangodb/arangodb:3.12.4
  externalAccess:
    type: None
  single:
    args:
      # Vector indexes are required by the ingestion/retrieval pipeline
      # (dataprep creates them; hybrid retrieval returns nothing without
      # the flag). Flag name per ArangoDB 3.12.4.
      - --experimental-vector-index=true
      # NO --server.endpoint: `arangodb://` is not a valid endpoint scheme
      # (arangod accepts tcp:// / ssl://). The operator sets endpoint+advertising
      # itself from the CR; hand-rolling it here breaks pod startup.
    volumeClaimTemplate:
      spec:
        # Render storageClass ONLY when set: empty-string pins
        # storageClassName: "" = "no default SC" and strands the PVC
        # (same trap the CNPG template guards against).
        {{- with .Values.pluggable.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.data.arangodb.storageSize | default "50Gi" }}
  auth:
    jwtSecretName: arango-jwt-secret
  # Plain HTTP on 8529. The operator enables TLS by default (per-deployment
  # self-signed CA); every in-cluster consumer (backend, doc-repo, dataprep)
  # connects with http:// URLs and carries no CA trust store, so TLS would
  # require distributing the CA secret to each client. `caSecretName: None`
  # is the operator's documented off-switch (kube-arangodb docs/tls.html).
  tls:
    caSecretName: None
  # Root password bootstrap: passwordSecretNames is a map of username to
  # Secret name (kube-arangodb 1.4.5 BootstrapSpec). The referenced Secret
  # must carry basic-auth keys (`username`, `password`); without this wiring
  # the operator leaves the root password EMPTY (default `None`).
  bootstrap:
    passwordSecretNames:
      root: arango-root-secret
  imagePullPolicy: IfNotPresent
{{- else if eq $mode "cluster" -}}
apiVersion: database.arangodb.com/v1
kind: ArangoDeployment
metadata:
  name: arangodb-cluster
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "data-arangodb") | nindent 4 }}
    genieai.io/data-tier: arangodb
spec:
  mode: Cluster
  # Hardcoded `arangodb/arangodb:3.12.4` (no registry prefix) — see
  # the `Single` branch above for the mirror-coverage rationale.
  image: arangodb/arangodb:3.12.4
  externalAccess:
    type: None
  agents:
    count: 3
    args:
      # Vector indexes are required by the ingestion/retrieval pipeline
      # (flag name per ArangoDB 3.12.4; same flag as the single branch).
      - --experimental-vector-index=true
    # Agency state MUST persist across restarts — on emptyDir every pod
    # reschedule loses the cluster configuration.
    volumeClaimTemplate:
      spec:
        {{- with .Values.pluggable.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # Agency holds cluster-configuration state only (MBs), not
            # document data — sized independently of the dbservers volume.
            storage: {{ .Values.data.arangodb.agentsStorageSize | default "2Gi" }}
  dbservers:
    count: 3
    args:
      # Vector indexes are required by the ingestion/retrieval pipeline
      # (flag name per ArangoDB 3.12.4; same flag as the single branch).
      - --experimental-vector-index=true
    volumeClaimTemplate:
      spec:
        {{- with .Values.pluggable.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.data.arangodb.storageSize | default "50Gi" }}
  coordinators:
    count: 2
    args:
      # Vector indexes are required by the ingestion/retrieval pipeline
      # (flag name per ArangoDB 3.12.4; same flag as the single branch).
      - --experimental-vector-index=true
  auth:
    jwtSecretName: arango-jwt-secret
  # Plain HTTP — see the `Single` branch for the rationale.
  tls:
    caSecretName: None
  bootstrap:
    passwordSecretNames:
      root: arango-root-secret
  imagePullPolicy: IfNotPresent
{{- else -}}
{{- fail (printf "data.arangodb.mode must be \"single\" or \"cluster\", got %q" $mode) -}}
{{- end -}}
{{- end -}}
