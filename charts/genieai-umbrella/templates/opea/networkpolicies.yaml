apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reranker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "reranker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: reranker
  policyTypes:
    - Ingress
