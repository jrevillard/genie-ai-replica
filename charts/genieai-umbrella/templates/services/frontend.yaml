{{- if .Values.services.frontend.enabled -}}
{{- $vals := deepCopy .Values -}}
{{- /* The SPA resolves its OIDC issuer at RUNTIME from
   window.APP_CONFIG.keycloak.url, which docker-entrypoint.sh generates
   from VUE_APP_KEYCLOAK_URL (no image rebuild). Unset, it falls back to
   `${origin}/auth` in oidcConfig.js — a hardcoded context path the chart
   cannot reach. Setting it from keycloakPublicIssuer is what keeps
   data.keycloak.httpRelativePath authoritative for the browser too. */ -}}
{{- $urls := list
    (dict "name" "VUE_APP_API_URL" "value" "/api")
    (dict "name" "VUE_APP_KEYCLOAK_URL" "value" (include "genieai-umbrella.keycloakPublicIssuer" .))
    (dict "name" "VUE_APP_CSP_CONNECT_SRC" "value" (.Values.services.frontend.cspConnectSrc | default ""))
    (dict "name" "OTEL_EXPORTER_OTLP_ENDPOINT" "value" (include "genieai-umbrella.otlpEndpoint" .))
-}}
{{- $existing := index $vals.services.frontend "env" | default list -}}
{{- $_ := set $vals.services.frontend "env" (concat $existing $urls) -}}
{{- $ctx := dict "name" "frontend" "component" "frontend" "Values" $vals "Chart" .Chart "Release" .Release -}}
{{- include "genieai-umbrella.serviceDeployment" $ctx }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend") | nindent 4 }}
---
# Default-deny with ingress allowlist from the edge proxy and egress
# scoped to the BFF plus the OTLP collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      genieai.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The SPA is served by the frontend container; the only network peer
    # is the Envoy Gateway data plane (the edge tier routes `/` here).
    # With the ingress tier disabled there is no exposure at all —
    # dev port-forwarding relies on the cluster's CNI not enforcing
    # NetworkPolicy (minikube kubenet), documented with the dev workflow.
    {{- if .Values.ingress.enabled }}
    - from:
        {{- include "genieai-umbrella.ingressDataPlanePeer" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8090
    {{- end }}
    # helm-test reachability probe (component "test").
    - from:
        - podSelector:
            matchLabels:
              genieai.io/component: test
      ports:
        - protocol: TCP
          port: 8090
  {{- if .Values.observability.metrics.enabled }}
  # Prometheus scrape peer (VMServiceScrape targets this Service).
  # VictoriaMetrics runs as a vm-operator-managed pod in this namespace;
  # without this peer its scrapes are dropped by the default-deny.
    - from:
        - podSelector:
            matchLabels:
              managed-by: vm-operator
              app.kubernetes.io/instance: vmetrics
      ports:
        - protocol: TCP
          port: 8090
  {{- end }}
  egress:
    # DNS resolution to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Backend BFF. Post-DNAT pod port (3000), not the Service port (80).
    - to:
        - podSelector:
            matchLabels:
              genieai.io/component: backend
      ports:
        - protocol: TCP
          port: 3000
    # OTLP exporter. Required for the observability pipeline; without
    # this port the default-deny policy drops frontend telemetry.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.observability.collectorPort | default 4318 }}
{{- end -}}
