<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- M.12: interactive-widget=resizes-content — Android Chrome resizes
         the layout viewport when the keyboard opens, so the bottom-anchored
         input rises above it; iOS rides the visualViewport CSS var chain -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">

    <!-- Primary Meta Tags -->
    <title>Agrivisory — AI Agriculture Advisory for Lesotho</title>
    <meta name="title" content="Agrivisory — AI Agriculture Advisory for Lesotho">
    <meta name="description" content="Agrivisory is an AI-powered agriculture advisory service for smallholder farmers in Lesotho. Built on GENIE.AI RAG framework by ITU and FAO.">
    <meta name="keywords" content="agriculture, AI, advisory, Lesotho, farming, smallholder, ITU, FAO, RAG, GENIE.AI, agrivisory">
    <meta name="author" content="International Telecommunication Union (ITU)">
    <meta name="application-name" content="Agrivisory">

    <!-- Robots / AI Crawlers -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="GPTBot" content="noindex, nofollow">
    <meta name="ChatGPT-User" content="noindex, nofollow">
    <meta name="CCBot" content="noindex, nofollow">
    <meta name="anthropic-ai" content="noindex, nofollow">
    <meta name="Google-Extended" content="noindex, nofollow">
    <meta name="PerplexityBot" content="noindex, nofollow">
    <meta name="Bytespider" content="noindex, nofollow">
    <meta name="ClaudeBot" content="noindex, nofollow">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://agriconnect.site/">
    <meta property="og:title" content="Agrivisory — AI Agriculture Advisory for Lesotho">
    <meta property="og:description" content="AI-powered agriculture advisory service for smallholder farmers in Lesotho. An ITU/FAO initiative.">
    <meta property="og:site_name" content="Agrivisory">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Agrivisory — AI Agriculture Advisory for Lesotho">
    <meta name="twitter:description" content="AI-powered agriculture advisory service for smallholder farmers in Lesotho. An ITU/FAO initiative.">

    <!-- Security -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Favicon -->
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <noscript>
      <strong>We're sorry but Agrivisory doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <!-- Runtime configuration (cloud-native: written at container startup by docker-entrypoint.sh) -->
    <script src="/config.js"></script>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
