{{/*
  translation OPEA orchestrator. Image is the UNCONDITIONAL docker.io upstream image
  opea/translation:1.3, NOT the registry-prefixed genie-ai-* convention.
  Same treatment as the keycloak-config-cli image in data/keycloak-
  convergence-job.yaml: the upstream image is not mirrored in the genie-ai
  CI registry, and the imageRegistry prefix would 404 the pull.
  Air-gapped sites must mirror docker.io/opea/translation and rewrite via
  insertAgent, not via the registry value. Hand-rendered instead of going
  through genieai-umbrella.serviceDeployment because the factory
  unconditionally prefixes the image with .Values.imageRegistry.
  The image listens on 8888 (its own default; nothing maps the
  port). The Service exposes 9031 -> 8888 because chatqna dials
  TRANSLATION_SERVICE_PORT 9031; the tcpSocket probe targets the real
  listener (8888).
*/}}
{{- if .Values.opea.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "translation") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "translation") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "translation") | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: translation
          # Pulled from docker.io unconditionally: opea/translation is
          # not mirrored in the registries deployments pull their other
          # images from (verified 2026-10-15), and the
          # imageRegistry prefix would 404 the pull. An air-gapped
          # site must mirror docker.io/opea/translation and rewrite via
          # insertAgent, not via the registry value.
          image: docker.io/opea/translation:1.3
          imagePullPolicy: {{ include "genieai-umbrella.imagePullPolicy" (dict "tag" "1.3" "pullPolicy" .Values.global.imagePullPolicy) }}
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: LLM_ENDPOINT
              value: {{ include "genieai-umbrella.opeaGpuEndpoint" (dict "root" . "path" "translation") }}
            - name: LLM_MODEL_ID
              value: {{ .Values.opea.translation.modelId }}
            # Observability exporter — derived from the umbrella
            # observability flags (any signal on → SDK initialises)
            # rather than a per-service knob.
            - name: ENABLE_OBSERVABILITY
              value: {{ ternary "1" "0" (or .Values.observability.logs.enabled .Values.observability.metrics.enabled .Values.observability.traces.enabled) | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "genieai-umbrella.otlpEndpoint" . }}
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 2, memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["NET_RAW"]
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: translation
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "translation") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 9031
      targetPort: 8888
  selector:
    {{- include "genieai-common.serviceSelector" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "translation") | nindent 4 }}
{{- end -}}
