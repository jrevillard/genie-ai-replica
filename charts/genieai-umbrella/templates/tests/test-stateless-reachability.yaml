{{- /* Stateless-tier service reachability smoke test. Probes each Service's
       /health endpoint (or TCP-open for clamd / redis-cache) and asserts
       the response. Skips disabled services. */ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "genieai-common.fullname" . }}-test-stateless-reach
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: t
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          failures=0
          # Each pair: <expected-status> <host:port> <path>
          check() {
            host=$1
            port=$2
            path=${3:-/health}
            expected=$4
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://${host}:${port}${path}" 2>/dev/null || echo 000)
            if [ "$code" = "$expected" ]; then
              echo "PASS: ${host}:${port}${path} -> ${code}"
            else
              echo "FAIL: ${host}:${port}${path} expected ${expected}, got ${code}"
              failures=$((failures+1))
            fi
          }
          # TCP-open probe for binary-protocol services (clamav, redis-cache).
          # The test image (curlimages/curl) ships no bash, so /dev/tcp is
          # unavailable; probe with curl's telnet:// scheme instead:
          # connection refused exits 7, DNS failure exits 6; a timeout
          # (exit 28) or clean close means the TCP port answered.
          check_tcp() {
            host=$1
            port=$2
            curl_code=$(curl -s -o /dev/null --max-time 3 "telnet://${host}:${port}" </dev/null; echo $?)
            case "$curl_code" in
              6|7)
                echo "FAIL: ${host}:${port} tcp closed (curl exit $curl_code)"
                failures=$((failures+1))
                ;;
              *)
                echo "PASS: ${host}:${port} tcp open (curl exit $curl_code)"
                ;;
            esac
          }
          {{- /* Checks hit the SERVICE ports (80; non-HTTP probes use their
                 configured port), NOT the container ports — Services are
                 the stable in-cluster contract. */ -}}
          {{- if .Values.services.backend.enabled }}
          check backend 80 /api/health 200
          {{- end }}
          {{- if .Values.services.frontend.enabled }}
          check frontend 80 /health 200
          {{- end }}
          {{- if .Values.services.documentRepository.enabled }}
          check document-repository 80 /health 200
          {{- end }}
          {{- if .Values.services.nginx.enabled }}
          check nginx 80 /healthz 200
          {{- end }}
          {{- if .Values.services.clamav.enabled }}
          check_tcp clamav 3310
          {{- end }}
          {{- if .Values.services.redisCache.enabled }}
          check_tcp redis-cache 6379
          {{- end }}
          if [ "$failures" -gt 0 ]; then
            echo "FAIL: $failures service(s) unreachable"
            exit 1
          fi
          echo "PASS: all stateless-tier services reachable"
