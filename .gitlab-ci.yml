# Unit tests — runs on every PR touching mobile/
# Downloads Flutter SDK from official archive with caching
test:flutter:
  extends: .flutter_base
  stage: test
  script:
    - export PATH="$PWD/../../flutter-sdk/bin:$PATH"
    # Pinned: the guard gates below grep the XML shape tojunit emits; an
    # unpinned bump that serialized skips differently would silence them.
    - dart pub global activate junitreport_maintained 2.0.5
    - export PATH="$PATH:$PUB_CACHE/bin"
    - mkdir -p reports
    - flutter test --machine --coverage > reports/flutter-machine.json 2>&1
    - cat reports/flutter-machine.json | tojunit --output reports/flutter-report.xml
    # Release-build control: getConfig() resolves the flavor from the FLAVOR
    # dart-define and fails at startup in a release or profile build made
    # without it (#1099). Running the config test with the define proves the
    # release recipe — itu selected, trust-all client off — instead of only
    # asserting it in prose.
    - flutter test --machine --dart-define=FLAVOR=itu test/config/keycloak_config_test.dart > reports/flutter-flavor-machine.json 2>&1
    - cat reports/flutter-flavor-machine.json | tojunit --output reports/flutter-flavor-report.xml
    # The same control, from the other side: the release guard test asserts
    # that a release or profile compilation WITHOUT the define fails at
    # startup. kReleaseMode is the dart.vm.product compile-time constant and
    # kProfileMode the dart.vm.profile one, so each mode is exercised by
    # defining it; the test skips itself outside those modes. The assertion
    # after each run exists because flutter test exits 0 on a skipped test:
    # a green job must mean the guard EXECUTED, not that it skipped.
    - flutter test --machine --dart-define=dart.vm.product=true test/config/keycloak_config_release_guard_test.dart > reports/flutter-release-guard-machine.json 2>&1
    - cat reports/flutter-release-guard-machine.json | tojunit --output reports/flutter-release-guard-report.xml
    - grep -q '<testcase' reports/flutter-release-guard-report.xml && ! grep -q '<skipped' reports/flutter-release-guard-report.xml
    - flutter test --machine --dart-define=dart.vm.profile=true test/config/keycloak_config_release_guard_test.dart > reports/flutter-profile-guard-machine.json 2>&1
    - cat reports/flutter-profile-guard-machine.json | tojunit --output reports/flutter-profile-guard-report.xml
    - grep -q '<testcase' reports/flutter-profile-guard-report.xml && ! grep -q '<skipped' reports/flutter-profile-guard-report.xml
    # The flavor run re-runs test/config/keycloak_config_test.dart, so it
    # produces the same suite name and the same testcase names as the full
    # run above. tojunit (junitreport_maintained) has no --suite-name, so the
    # suite and class names are marked here: without this the two reports
    # collide in the merged JUnit view and it is impossible to tell which run
    # a failure came from.
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[flavor=itu] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[flavor=itu] ${2}${3}}' reports/flutter-flavor-report.xml
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=release] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=release] ${2}${3}}' reports/flutter-release-guard-report.xml
    - grep -q '\[mode=release\]' reports/flutter-release-guard-report.xml
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=profile] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=profile] ${2}${3}}' reports/flutter-profile-guard-report.xml
    - grep -q '\[mode=profile\]' reports/flutter-profile-guard-report.xml
    - perl -pi -e 's/&#x1[bB];\[[0-9;]*m//g; s/&#27;\[[0-9;]*m//g; s/\x1b\[[0-9;]*m//g; s/&#x1[bB];//g; s/&#27;//g; s/[\x00-\x08\x0b\x0c\x0e-\x1f]//g' reports/flutter-report.xml reports/flutter-flavor-report.xml reports/flutter-release-guard-report.xml reports/flutter-profile-guard-report.xml
    - 'sed -i ''/lib\/i18n\//d'' coverage/lcov.info'
    - 'COV=$(awk ''/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{if(lf>0) printf "%.1f",lh/lf*100}'' FS=: coverage/lcov.info) && echo "Lines: ${COV}%" || echo "No coverage data"'
    - python3 -m venv /tmp/lcov-cov && . /tmp/lcov-cov/bin/activate && pip install lcov-cobertura && lcov_cobertura coverage/lcov.info --output reports/coverage-cobertura.xml
  coverage: '/^Lines:\s+(\d+\.?\d*)%/'
  artifacts:
    reports:
      junit:
        - mobile/genie_ai_mobile/reports/flutter-report.xml
        - mobile/genie_ai_mobile/reports/flutter-flavor-report.xml
        - mobile/genie_ai_mobile/reports/flutter-release-guard-report.xml
        - mobile/genie_ai_mobile/reports/flutter-profile-guard-report.xml
      coverage_report:
        coverage_format: cobertura
        path: mobile/genie_ai_mobile/reports/coverage-cobertura.xml
    paths:
      - mobile/genie_ai_mobile/coverage/
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Helm chart lint + render-validate — fast (~30s), runs on shared runners.
# Pin a Helm image that ships kubectl + bash so kubeconform can validate
# the rendered API manifest. kubeconform is shipped as a tarball so install
# directly from stdin.
chart:lint:
  image: dtzar/helm-kubectl:3.16.0
  stage: test
  interruptible: true
  before_script:
    - apk add --no-cache curl bash tar python3 py3-yaml
    - |
      cat > /tmp/strict-yaml.py <<'PY'
      # Helm's rendered output can concatenate documents (a stray `{{- if }}`
      # trims the newline before a `---`) or emit duplicate mapping keys;
      # both are invalid Kubernetes YAML and both pass Helm's own parser and
      # a default YAML load. This checks both, for every render the job made.
      import re
      import sys
      import yaml

      class Strict(yaml.SafeLoader):
          pass

      def no_dup(loader, node, deep=False):
          keys = set()
          for key_node, _ in node.value:
              key = loader.construct_object(key_node, deep=deep)
              if key in keys:
                  raise ValueError("duplicate key %r at line %s" % (key, key_node.start_mark.line + 1))
              keys.add(key)
          return yaml.SafeLoader.construct_mapping(loader, node, deep)

      Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_dup)

      for path in sys.argv[1:]:
          docs = [d for d in yaml.load_all(open(path), Loader=Strict) if d]
          print("%s: %d documents, strict parse OK" % (path, len(docs)))
      PY
    - |
      cat > /tmp/cluster-scope-check.py <<'PY'
      # Cluster-scoped resources are the only thing that can make two
      # GENIE releases collide on one cluster: a cluster-scoped name that
      # does not carry the release name means release B fails its install
      # with "already exists" (and release A's uninstall removes a class
      # or role the other still needs).
      #
      # A name may carry EITHER the release name (chart-owned resources) or
      # the namespace (the gateway-helm subchart names its topology-injector
      # webhook after the namespace it installs into) — both are stable
      # across a second release in a different namespace / under a different
      # release name.
      #
      # Usage: cluster-scope-check.py <release> <namespace> <n-allowed> <allowed>... <render>...
      import re
      import sys
      import yaml

      CLUSTER_SCOPED = {
          "ClusterRole", "ClusterRoleBinding", "GatewayClass",
          "CustomResourceDefinition", "PriorityClass", "APIService",
          "MutatingWebhookConfiguration", "ValidatingWebhookConfiguration",
          "StorageClass", "CSIDriver", "IngressClass", "Node",
      }

      release, namespace, n_allowed = sys.argv[1], sys.argv[2], int(sys.argv[3])
      allowed = set(sys.argv[4:4 + n_allowed])
      paths = sys.argv[4 + n_allowed:]
      for path in paths:
          for doc in yaml.safe_load_all(open(path)):
              if not doc or doc.get("kind") not in CLUSTER_SCOPED:
                  continue
              name = doc["metadata"]["name"]
              # Segment match, not substring: "latest" contains "test",
              # so a bare `in` would wave through names that a second
              # release would collide with.
              # The release/namespace may appear as any DELIMITED segment
              # (some names are suffixed, some prefixed, some joined with
              # ":" or "."), but never merely as a substring — "latest"
              # contains "test".
              segments = set(re.split(r"[-:.]", name))
              qualified = release in segments or namespace in segments
              # The GatewayClass is a deliberate per-cluster singleton
              # (ingress.createGatewayClass defaults to false precisely so
              # no release owns it) — its name comes from
              # ingress.className, so allow it by KIND, not by a literal
              # that would go stale on an override.
              singleton = doc["kind"] == "GatewayClass"
              if singleton or name in allowed or qualified:
                  print("ok cluster-scoped %s/%s%s" % (
                      doc["kind"], name, " (singleton)" if singleton else ""))
                  continue
              raise SystemExit(
                  "cluster-scoped %s/%s carries neither the release name (%s), the "
                  "namespace (%s) nor an explicit allow-list entry — a second GENIE "
                  "release on this cluster would fail with 'already exists'"
                  % (doc["kind"], name, release, namespace))
      PY
    - helm dependency update charts/genieai-umbrella
  script:
    # The realm file is duplicated: this copy is for the chart's
    # convergence Job, configs/keycloak/genie-realm.yaml is COPYed into
    # the compose image. They must stay byte-identical or the two
    # delivery paths deploy different realms.
    - cmp -s charts/genieai-umbrella/files/genie-realm.yaml configs/keycloak/genie-realm.yaml || { echo "realm file drift between the chart copy and the compose copy - update both"; exit 1; }
    # Same contract for the Keycloak theme tarball, content-compared:
    # regenerate to a temp file and hash the member listing + the
    # concatenated member contents. Byte-comparing the .tgz itself would
    # be flaky — gzip output differs a few bytes across gzip versions.
    - ./scripts/regen-keycloak-theme.sh /tmp/themes-check.tgz >/dev/null
    - |
      [ "$(tar -tzf /tmp/themes-check.tgz | sha256sum)" = "$(tar -tzf charts/genieai-umbrella/files/keycloak-themes.tgz | sha256sum)" ] \
      && [ "$(tar -xzOf /tmp/themes-check.tgz | sha256sum)" = "$(tar -xzOf charts/genieai-umbrella/files/keycloak-themes.tgz | sha256sum)" ] \
      || { echo "keycloak theme tarball content drift - run 'make keycloak-theme' and commit the result"; exit 1; }
    # Same contract for the Grafana dashboards and the alert rules: the
    # chart inlines them into GrafanaDashboard / GrafanaAlertRule CRs, so
    # it carries a copy of configs/grafana/provisioning. The check also
    # compares the template's dashboard list against the files on disk —
    # a copied file the template does not list is never rendered, and a
    # listed file that is missing inlines as an empty dashboard.
    - ./scripts/sync-chart-dashboards.sh --check || { echo "grafana dashboard drift - run 'make chart-dashboards' and commit the result"; exit 1; }
    - helm lint charts/genieai-umbrella --strict
    # Base tier render. charts/ci/render-base-flags is the shared render
    # fixture (required deployment data + placeholder-secret off + an
    # smtp that answers nothing — see the file and the chart README's
    # "Mail is not optional"): SHAPE values, nothing here reaches a
    # cluster.
    - >-
      helm template test charts/genieai-umbrella -n genieai $(cat charts/ci/render-base-flags)
      --set ingress.enabled=true
      --set ingress.createGatewayClass=true
      --set 'data.keycloak.clientSecrets.proxyClient=lint-dummy'
      --set 'data.keycloak.clientSecrets.dataprep=lint-dummy'
      --set 'data.keycloak.clientSecrets.grafana=lint-dummy'
      > /tmp/rendered.yaml
    # Full-surface render (render-only, no install cost): with defaults
    # opea.enabled / observability.metrics / traces / grafana are all OFF,
    # so ~half the templates never render and a typo in any of them
    # merges green. This is the gate that catches the class of defect the
    # base render cannot see.
    - >-
      helm template test charts/genieai-umbrella -n genieai $(cat charts/ci/render-base-flags)
      --set ingress.enabled=true
      --set ingress.createGatewayClass=true
      --set 'data.keycloak.clientSecrets.proxyClient=lint-dummy'
      --set 'data.keycloak.clientSecrets.dataprep=lint-dummy'
      --set 'data.keycloak.clientSecrets.grafana=lint-dummy'
      --set opea.enabled=true
      --set opea.gpu.nodeHost=https://gpu.ci-render.local:444
      --set observability.metrics.enabled=true
      --set observability.traces.enabled=true
      --set observability.grafana.enabled=true
      --set data.arangodb.mode=cluster
      > /tmp/rendered-full.yaml
    # Production topology render. clusterProfile=prod is enum-legal and
    # nothing else in CI ever selects it, so the whole prod surface was
    # unvalidated: it is the only configuration that emits a
    # PodDisruptionBudget, it multiplies the backend to 3 and the
    # document-repository and frontend to 2, and it puts the Keycloak
    # database at 3 CNPG instances. ingress.tls.enabled adds the
    # cert-manager Certificate, which no other render emits either.
    - >-
      helm template test charts/genieai-umbrella -n genieai $(cat charts/ci/render-base-flags)
      --set ingress.enabled=true
      --set ingress.createGatewayClass=true
      --set 'data.keycloak.clientSecrets.proxyClient=lint-dummy'
      --set 'data.keycloak.clientSecrets.dataprep=lint-dummy'
      --set 'data.keycloak.clientSecrets.grafana=lint-dummy'
      --set clusterProfile=prod
      --set ingress.tls.enabled=true
      --set ingress.tls.issuerName=selfsigned
      --set observability.metrics.enabled=true
      --set observability.traces.enabled=true
      > /tmp/rendered-prod.yaml
    # Same render with the in-cluster GPU tier: every orchestrator's
    # endpoint, model Deployment, NetworkPolicy port and model-cache PVC
    # differs between the two modes.
    - >-
      helm template test charts/genieai-umbrella -n genieai $(cat charts/ci/render-base-flags)
      --set ingress.enabled=true
      --set ingress.createGatewayClass=true
      --set 'data.keycloak.clientSecrets.proxyClient=lint-dummy'
      --set 'data.keycloak.clientSecrets.dataprep=lint-dummy'
      --set 'data.keycloak.clientSecrets.grafana=lint-dummy'
      --set opea.enabled=true
      --set opea.gpu.mode=in-cluster
      --set observability.metrics.enabled=true
      --set observability.traces.enabled=true
      --set observability.grafana.enabled=true
      --set data.arangodb.mode=cluster
      > /tmp/rendered-incluster.yaml
    - >-
      curl -fsSL
      https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
      | tar -xz -C /usr/local/bin kubeconform
    - kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.33.0 /tmp/rendered.yaml /tmp/rendered-full.yaml /tmp/rendered-prod.yaml /tmp/rendered-incluster.yaml
    # values.yaml goes through the same duplicate-key check as the renders:
    # Helm resolves a repeated key last-wins BEFORE anything downstream sees
    # it, so a `services.<svc>.env` declared twice renders identically whether
    # one copy or two are present — and an operator editing the copy Helm
    # ignores gets no error anywhere.
    - python3 /tmp/strict-yaml.py charts/genieai-umbrella/values.yaml /tmp/rendered.yaml /tmp/rendered-full.yaml /tmp/rendered-prod.yaml /tmp/rendered-incluster.yaml
    # NetworkPolicy cross-check: the chart renders an ingress and an egress
    # side for every component, in different templates, edited
    # independently. A flow declared on one side and absent from the other
    # renders fine, passes kubeconform, and only times out at runtime — and
    # only on a CNI that enforces NetworkPolicy (the default minikube and
    # kind CNIs store the objects and drop them, so a laptop cluster looks
    # healthy while carrying a broken egress graph).
    - python3 scripts/networkpolicy-crosscheck.py /tmp/rendered.yaml /tmp/rendered-full.yaml /tmp/rendered-prod.yaml /tmp/rendered-incluster.yaml
    # The schema types every boolean leaf of values.yaml so a wrongly-typed
    # knob fails with the operator's path instead of "wrong type for value;
    # expected bool". This check keeps the two lists from drifting.
    - python3 scripts/values-schema-bools-check.py charts/genieai-umbrella/values.yaml charts/genieai-umbrella/values.schema.json
    - >-
      python3 /tmp/cluster-scope-check.py test genieai 1 envoy
      /tmp/rendered.yaml /tmp/rendered-full.yaml /tmp/rendered-prod.yaml /tmp/rendered-incluster.yaml
  rules:
    # First-match semantics: a bare second merge_request_event rule would
    # make this job run on every MR and render the changes filter dead.
    # configs/grafana is in the filter because the chart vendors a copy of
    # the dashboards and the alert rules: a change to the source must
    # trigger the gate that checks the copy, or the drift it is meant to
    # catch reaches the cluster unnoticed.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - charts/**/*
        - scripts/**/*
        - configs/keycloak/**/*
        - configs/grafana/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - charts/**/*
        - scripts/**/*
        - configs/keycloak/**/*
        - configs/grafana/**/*
        - .gitlab-ci.yml

# Chart contract gate — proves the CHART-RENDERED observability config,
# not just the compose copy. The PII-redaction OTTL lives twice (compose
# configs/otel/ + the chart's collector template); run-pii-smoke.sh only
# tests the compose copy by default. Here the chart is rendered, the
# gateway collector's spec.config is extracted, the VictoriaLogs exporter
# endpoint is rewritten to the smoke's docker-network placeholder, and the
# SAME smoke suite runs against it. A regex fix landing in compose but not
# in the chart fails this job instead of leaking PII on k8s deployments.
chart:contract:
  image: docker:28
  stage: test
  tags: [docker]
  # No dind sidecar: the [docker] runner exposes its daemon via the socket
  # (the pattern the promote:* jobs use — and the docker:28 client is the
  # one proven to reach it; an alpine docker-cli in another image did not).
  # Shares the chart-dind resource group with chart:crd-validate — runner
  # capacity, not daemon mutual exclusion: crd-validate drives its own
  # in-container daemon while this job drives the runner's shared one.
  resource_group: chart-dind
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, script_failure]
  interruptible: true
  before_script:
    # python3 + py3-yaml: the config-extraction step below parses the
    # rendered collector CR with pyyaml.
    - apk add --no-cache bash tar curl python3 py3-yaml
    - curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar -xz -C /tmp
    - install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
    - helm dependency update charts/genieai-umbrella
  script:
    - >-
      helm template test charts/genieai-umbrella -n genieai $(cat charts/ci/render-base-flags)
      > /tmp/rendered.yaml
    # Extract the gateway OpenTelemetryCollector's inline config map and
    # swap the in-cluster VL endpoint for the smoke's container placeholder.
    - |
      python3 - <<'PY'
      import yaml
      docs = list(yaml.safe_load_all(open('/tmp/rendered.yaml')))
      cr = next(d for d in docs if d and d.get('kind') == 'OpenTelemetryCollector'
                and d['metadata']['name'] == 'genieai-collector')
      cfg = yaml.safe_dump(cr['spec']['config'], default_flow_style=False, sort_keys=False)
      cfg = cfg.replace('vlsingle-victorialogs.genieai.svc.cluster.local',
                        'genie-pii-vl-HOSTPLACEHOLDER')
      open('/tmp/contract-collector-config.yaml', 'w').write(cfg)
      assert 'pii_redact' in cfg, 'pii_redact processor missing from the rendered gateway config'
      assert 'fluent_forward' not in cfg, 'fluent_forward receiver is compose-only; it must not render on k8s'
      print('extracted gateway config:', len(cfg), 'bytes')
      PY
    # The app SDKs must point at the operator-derived collector Service
    # (<cr-name>-collector), not a hand-written name.
    #
    # Scoped to the app Deployments on purpose. A whole-file grep is
    # vacuous here: the filelog agent's OpenTelemetryCollector CR carries
    # the same URL, so every app Deployment could be pointed at a
    # Service that does not exist and this assertion would still pass —
    # a green pipeline over a total loss of trace export. Parsed, not
    # grepped, and every app workload must carry it.
    - |
      python3 - <<'PY'
      import sys, yaml

      EXPECTED = 'http://genieai-collector-collector.genieai.svc.cluster.local:4318'
      # Deployments the chart owns and whose SDK exports over OTLP.
      APPS = ('backend', 'documentrepository', 'frontend')

      found = {}
      for doc in yaml.safe_load_all(open('/tmp/rendered.yaml')):
          if not doc or doc.get('kind') != 'Deployment':
              continue
          name = doc['metadata']['name']
          slug = name.rsplit('-', 1)[-1]
          if slug not in APPS:
              continue
          for c in doc['spec']['template']['spec']['containers']:
              for e in c.get('env', []):
                  if e.get('name') == 'OTEL_EXPORTER_OTLP_ENDPOINT':
                      found.setdefault(slug, e.get('value'))

      missing = [a for a in APPS if a not in found]
      wrong = {a: v for a, v in found.items() if v != EXPECTED}
      if missing:
          sys.exit(f'app Deployments with no OTEL_EXPORTER_OTLP_ENDPOINT: {missing}')
      if wrong:
          sys.exit(f'OTEL_EXPORTER_OTLP_ENDPOINT drifted from the operator Service name: {wrong}')
      print('OTLP endpoint on every app Deployment:', ', '.join(sorted(found)))
      PY
    - PII_SMOKE_CONFIG=/tmp/contract-collector-config.yaml ./tests/otel-collector/run-pii-smoke.sh
  rules:
    # Generic (not branch-pinned): the job validates the chart at its own
    # commit SHA, so contract coverage follows chart/otel changes wherever
    # they land — release/* cherry-picks, other feature branches, main.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - charts/**/*
        - scripts/**/*
        - configs/otel/**/*
        - tests/otel-collector/**/*
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - charts/**/*
        - scripts/**/*
        - configs/otel/**/*
        - tests/otel-collector/**/*
        - .gitlab-ci.yml
      when: on_success

# Helm chart end-to-end — kind cluster inside DinD, install 4 cluster
# operators via scripts/install-prereqs.sh, then install + helm-test the
# genie-ai umbrella chart. allow_failure because the operator + chart
# fan-out is resource-sensitive on the shared docker runner pool.
# CRD strict-decoding gate.
#
# kubeconform runs with `-ignore-missing-schemas`, so every Custom
# Resource in this chart is UNVALIDATED by chart:lint — it has no schema
# to check against. That blind spot is not theoretical: the
# grafana-operator decodes its CRs strictly, and `spec.credentialsEx` /
# `spec.resources` (neither is a CRD field) rejected the whole Grafana
# object with `helm lint` and kubeconform both green. The only thing
# that catches this class is a real API server asked to validate the
# object against the installed CRD's OpenAPI schema.
#
# So: kind + the operator CRDs + `kubectl apply --dry-run=server`. No
# images are pulled and no workload is scheduled — this is a schema
# check, not an install, which is why it can afford to run on every
# chart push where chart:install cannot (that one needs >30m).
# Configuration parity gate: the chart and Docker Compose must configure
# the same applications the same way.
#
# The two surfaces deploy the same services, and nothing else in the
# pipeline compares them: `helm lint` checks the chart against itself, the
# Compose file against itself, and the tests run with whatever environment
# the CI job happens to have. A variable added to one surface and forgotten
# in the other is a green pipeline that deploys differently depending on
# where it runs — which is exactly what a rebase brings in when upstream
# adds a variable to Compose.
#
# The gate compares the rendered chart against docker-compose.yaml, service
# pair by service pair. The differences that ARE the Kubernetes adaptation
# (the addresses each surface reaches) are declared in
# scripts/config-parity-allowlist.json, each with its reason; everything
# else — timeouts, retries, feature flags, log level, identity — must
# carry the same value.
chart:parity:
  # No [docker] tag and no chart-dind group: this job never touches the
  # Docker daemon (helm + python only). In the group it parked a 17 s
  # render-and-compare behind the two kind boots and delayed the
  # merge-gating crd-validate with it.
  image: dtzar/helm-kubectl:3.16.0
  stage: test
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, script_failure]
  interruptible: true
  before_script:
    # The image carries helm, kubectl, curl and bash; only python3 +
    # pyyaml need installing.
    - apk add --no-cache python3 py3-yaml
    - helm dependency update charts/genieai-umbrella
  script:
    # The OPEA tier must be ON: the gate compares the AI services too, and
    # they only exist when the tier is enabled. A GPU node host is needed
    # because the external mode refuses to render without one.
    - >
      helm template test charts/genieai-umbrella -n genieai $(cat charts/ci/render-base-flags)
      --set opea.enabled=true
      --set opea.gpu.nodeHost=https://gpu-node:444
      > /tmp/rendered.yaml
    # --min-compared is the floor on variables actually compared (171 at
    # the time of writing; secretProvided and mayDiffer rows are excluded
    # from the count, so growing EITHER category now drops the number and
    # trips the floor instead of quietly greening the gate).
    - python3 scripts/config-parity-check.py /tmp/rendered.yaml --min-compared=171
  rules:
    # The gate verifies its `notRead` claims against the APPLICATION
    # source: a commit under components/ or genie-ai-overlay/ that starts
    # reading a claimed-unread variable falsifies the claim. Without
    # those paths in `changes`, the job is not even added to the
    # pipeline and the claim stays unverified while the pipeline stays
    # green.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - charts/**/*
        - scripts/**/*
        - docker-compose.yaml
        - env
        - .gitlab-ci.yml
        - components/**/*
        - genie-ai-overlay/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - charts/**/*
        - scripts/**/*
        - docker-compose.yaml
        - env
        - .gitlab-ci.yml
        - components/**/*
        - genie-ai-overlay/**/*
      when: on_success

chart:crd-validate:
  image: docker:28-dind
  stage: test
  tags: [docker]
  resource_group: chart-dind
  allow_failure: false
  variables:
    KUBECONFIG: /tmp/kubeconfig
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, script_failure]
  interruptible: true
  before_script:
    - apk add --no-cache bash curl python3 py3-yaml
    - curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar -xz -C /tmp
    - install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
    - curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl
    - install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
    - install -m 0755 /tmp/kind /usr/local/bin/kind
    - helm dependency update charts/genieai-umbrella
  script:
    - trap 'kind delete cluster --name genieai-crd 2>/dev/null || true' EXIT
    - trap 'exit 130' INT
    - trap 'exit 143' TERM
    # Same daemon-address derivation as chart:install: the kind API must
    # bind the DOCKER DAEMON's docker0 address, not the job container's
    # 127.0.0.1 (the runner socket-proxy setup), and it must land in the
    # API cert's SANs so kubectl needs no rewrite.
    - |
      case "${DOCKER_HOST:-}" in
        tcp://*)
          DAEMON_HOST="${DOCKER_HOST#tcp://}"; DAEMON_HOST="${DAEMON_HOST%%:*}" ;;
        "")
          DAEMON_HOST="127.0.0.1" ;;
        *)
          echo "ERROR: chart:crd-validate needs DOCKER_HOST=tcp://<host>:<port> (got '${DOCKER_HOST}')" >&2
          exit 1 ;;
      esac
      cat > /tmp/kind-config.yaml <<EOF
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      networking:
        apiServerAddress: "${DAEMON_HOST}"
        apiServerPort: 36444
      EOF
    # Purged only once the daemon address is known to be usable: the
    # runner's docker socket is shared with every other job on the host,
    # and a job that cannot even address its daemon has no business
    # deleting a cluster on it first. The cluster is named `genieai-crd`,
    # not `kind` — and NOT the name chart:install uses — so a leftover
    # from another project, or from a concurrent manual install run on
    # the other port, is never in the blast radius either.
    - kind delete cluster --name genieai-crd 2>/dev/null || true
    - kind create cluster --name genieai-crd --config /tmp/kind-config.yaml --image kindest/node:v1.33.0 --wait 5m
    - kind get kubeconfig --name genieai-crd > "$KUBECONFIG"
    - export KUBECONFIG
    # The CRDs only — the operators never need to be Ready, and waiting on
    # them would only add minutes. --with-grafana covers the grafana CRs,
    # which the default render leaves out.
    - ./scripts/install-prereqs.sh --with-grafana
    - |
      set -e
      helm template test charts/genieai-umbrella -n genieai $(cat charts/ci/render-base-flags) \
        --set ingress.enabled=true \
        --set ingress.createGatewayClass=true \
        --set 'data.keycloak.clientSecrets.proxyClient=lint-dummy' \
        --set 'data.keycloak.clientSecrets.dataprep=lint-dummy' \
        --set 'data.keycloak.clientSecrets.grafana=lint-dummy' \
        --set opea.enabled=true \
        --set opea.gpu.mode=in-cluster \
        --set observability.metrics.enabled=true \
        --set observability.traces.enabled=true \
        --set observability.grafana.enabled=true \
        --set data.arangodb.mode=cluster \
        > /tmp/crd-validate.yaml
    # The second render exists because the first one is not the deployment
    # that ships: clusterProfile=prod multiplies the replicas and puts the
    # Keycloak database at 3 CNPG instances, and ingress.tls.enabled adds
    # the cert-manager Certificate. Both are custom resources, and a
    # custom resource is exactly what `kubeconform -ignore-missing-schemas`
    # skips — so without a render that includes them, the only objects a
    # real API server ever validated are the ones the laptop profile emits.
    # A typo in a CRD field is rejected by the operator's strict decoder
    # with helm lint, kubeconform and the CI YAML parse all green.
    - |
      set -e
      helm template test charts/genieai-umbrella -n genieai $(cat charts/ci/render-base-flags) \
        --set ingress.enabled=true \
        --set ingress.createGatewayClass=true \
        --set 'data.keycloak.clientSecrets.proxyClient=lint-dummy' \
        --set 'data.keycloak.clientSecrets.dataprep=lint-dummy' \
        --set 'data.keycloak.clientSecrets.grafana=lint-dummy' \
        --set clusterProfile=prod \
        --set ingress.tls.enabled=true \
        --set ingress.tls.issuerName=selfsigned \
        --set opea.enabled=true \
        --set opea.gpu.nodeHost=https://gpu-node:444 \
        --set observability.metrics.enabled=true \
        --set observability.traces.enabled=true \
        --set observability.grafana.enabled=true \
        --set data.arangodb.mode=cluster \
        > /tmp/crd-validate-prod.yaml
      ./scripts/validate-crds.sh /tmp/crd-validate.yaml /tmp/crd-validate-prod.yaml
  rules:
    # scripts/validate-crds.sh is the job's last step and its whole
    # assertion: a change to the script must re-run the job, or a relaxed
    # grep ships with no pipeline ever having exercised it.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - charts/**/*
        - scripts/install-prereqs.sh
        - scripts/validate-crds.sh
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - charts/**/*
        - scripts/install-prereqs.sh
        - scripts/validate-crds.sh
        - .gitlab-ci.yml
      when: on_success

chart:install:
  image: docker:28-dind
  stage: test
  tags: [docker]
  # Own group, not chart-dind: this is a MANUAL 30-minute install. In the
  # shared group one click parks the two per-push kind gates for its
  # whole duration. Its kind cluster is also named differently
  # (genieai-install) and its API port distinct (36443 vs 36444), so
  # nothing about its runtime depends on the group for safety.
  resource_group: chart-install-dind
  # Manual + allow_failure: a `when: manual` job WITHOUT allow_failure
  # leaves the pipeline blocked on a pending manual action — the MR
  # pipeline never goes green and merge gating never passes. With it,
  # the pipeline succeeds without this job and it stays runnable by hand
  # (same posture as the compose E2E suite below).
  allow_failure: true
  # No dind sidecar — the [docker] runner exposes its daemon via the
  # socket (promote:* pattern). The image is only used as the docker CLI.
  variables:
    KUBECONFIG: /tmp/kubeconfig
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, script_failure]
  interruptible: true
  before_script:
    - apk add --no-cache curl bash
    - curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar -xz -C /tmp
    - install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
    - curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl
    - install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
    - install -m 0755 /tmp/kind /usr/local/bin/kind
    - helm dependency update charts/genieai-umbrella
    - helm version --short
    - kubectl version --client
    - kind version
  script:
    # Shared daemon hygiene: the kind cluster lives on the runner HOST
    # (via the socket proxy), NOT under the runner's job-container
    # lifecycle — GitLab never cleans it. Purge on entry AND on every exit
    # path, or a failed job leaves node containers + pulled images
    # (multi-GB) on the shared host forever (observed: 'node(s) already
    # exist' caused by the previous run's debris). The INT/TERM traps make
    # a GitLab cancel/timeout (SIGTERM to the process group) exit through
    # the EXIT trap — bash does NOT run EXIT traps on unhandled signals.
    - trap 'kind delete cluster --name genieai-install 2>/dev/null || true' EXIT
    - trap 'exit 130' INT
    - trap 'exit 143' TERM
    - kind delete cluster --name genieai-install 2>/dev/null || true
    # Bind the API server on the DAEMON's docker0 address (kind's default
    # 127.0.0.1 is unreachable from the job container when the daemon is
    # remote — the runner socket-proxy setup). Using the real address (not
    # 0.0.0.0) also puts it in the API cert's SANs, so kubectl needs no
    # rewrite. Fixed port is safe — the chart-install-dind resource group
    # serializes successive runs of this job (its only member). unix://
    # sockets are rejected outright: the
    # derivation would yield apiServerAddress "unix" and kind create would
    # fail far from the cause.
    - |
      case "${DOCKER_HOST:-}" in
        tcp://*)
          DAEMON_HOST="${DOCKER_HOST#tcp://}"; DAEMON_HOST="${DAEMON_HOST%%:*}" ;;
        "")
          DAEMON_HOST="127.0.0.1" ;;
        *)
          echo "ERROR: chart:install needs DOCKER_HOST=tcp://<host>:<port> (got '${DOCKER_HOST}')" >&2
          exit 1 ;;
      esac
      cat > /tmp/kind-config.yaml <<EOF
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      networking:
        apiServerAddress: "${DAEMON_HOST}"
        apiServerPort: 36443
      EOF
      echo "kind API on ${DAEMON_HOST}:36443"
    # Purged only once the daemon address is known to be usable (see the
    # note in chart:crd-validate).
    - kind delete cluster --name genieai-install 2>/dev/null || true
    - kind create cluster --name genieai-install --config /tmp/kind-config.yaml --image kindest/node:v1.33.0 --wait 5m
    # KUBECONFIG first, THEN anything that speaks to the cluster: the
    # variable points at a file nothing creates until this step, and
    # kubectl with a KUBECONFIG naming a missing file falls back to
    # http://localhost:8080 — "connection refused" as the job's only
    # symptom.
    - kind get kubeconfig --name genieai-install > "$KUBECONFIG"
    - export KUBECONFIG
    # kind ships no default StorageClass: every PVC stays Pending and
    # `helm install --wait` blocks on it until the job timeout — a
    # storage gap indistinguishable from a chart defect. local-path gives
    # the install real volumes.
    - kubectl apply -f
      https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.26/deploy/local-path-storage.yaml
    - kubectl wait --for=condition=Ready pod -l app=local-path-provisioner
      -n local-path-storage --timeout=120s
    - ./scripts/install-prereqs.sh
    # The operator-provided Secrets the release mounts. The chart renders
    # none, and every one below is mounted through a NON-optional
    # secretKeyRef: without them the db-migrations and realm-convergence
    # hook Jobs land in CreateContainerConfigError, never start, and
    # `helm install --wait` fails on the hooks with a message that names
    # a pod rather than the missing Secret. Throwaway values — this
    # cluster is deleted at the end of the job.
    - |
      set -e
      kubectl create namespace genieai --dry-run=client -o yaml | kubectl apply -f -
      kubectl create secret generic arango-root-secret -n genieai \
        --from-literal=username=root --from-literal=password=ci-arango-password
      kubectl create secret generic arango-jwt-secret -n genieai \
        --from-literal=token=ci-jwt-token
      kubectl create secret generic keycloak-db-credentials -n genieai \
        --from-literal=username=keycloak --from-literal=password=ci-db-password
      kubectl create secret generic keycloak-admin-credentials -n genieai \
        --from-literal=username=admin --from-literal=password=ci-admin-password
      kubectl create secret generic translation-cache-password -n genieai \
        --from-literal=password=ci-cache-password \
        --from-literal=TRANSLATION_CACHE_PASSWORD=ci-cache-password
      kubectl create secret generic keycloak-proxy-client-secret -n genieai \
        --from-literal=KEYCLOAK_PROXY_CLIENT_SECRET=ci-proxy-secret
      kubectl create secret generic kc-dataprep-client-secret -n genieai \
        --from-literal=KC_DATAPREP_CLIENT_SECRET=ci-dataprep-secret
      kubectl create secret generic kc-grafana-client-secret -n genieai \
        --from-literal=KEYCLOAK_GRAFANA_CLIENT_SECRET=ci-grafana-secret
      kubectl create secret generic keycloak-convergence-credentials -n genieai \
        --from-literal=GENIE_ADMIN_PASSWORD=ci-admin-password \
        --from-literal=EMAIL_PASSWORD=ci-email-password
    # The convergence Job reads the realm's client secrets and the admin
    # password from those Secrets — without these rows it exports empty
    # values and the realm is imported with clients whose secret nobody
    # holds.
    - |
      cat > /tmp/ci-values.yaml <<'EOF'
      data:
        keycloak:
          convergence:
            envSecrets:
              - { envVar: KC_PROXY_CLIENT_SECRET, secretName: keycloak-proxy-client-secret, secretKey: KEYCLOAK_PROXY_CLIENT_SECRET }
              - { envVar: KC_DATAPREP_CLIENT_SECRET, secretName: kc-dataprep-client-secret, secretKey: KC_DATAPREP_CLIENT_SECRET }
              - { envVar: KC_GRAFANA_CLIENT_SECRET, secretName: kc-grafana-client-secret, secretKey: KEYCLOAK_GRAFANA_CLIENT_SECRET }
              - { envVar: GENIE_ADMIN_PASSWORD, secretName: keycloak-convergence-credentials, secretKey: GENIE_ADMIN_PASSWORD }
              - { envVar: EMAIL_PASSWORD, secretName: keycloak-convergence-credentials, secretKey: EMAIL_PASSWORD }
      EOF
    # KNOWN INCOMPLETE (manual job): the operator images (ArangoDB,
    # Keycloak, the model pulls) are multi-GB and this cluster is a cold
    # kind node on a shared runner — the install needs far more than the
    # 30-minute budget. The Secrets ARE created above, so the job
    # exercises a real install (hook ordering, data tier, realm
    # convergence) rather than failing on a missing Secret.
    #
    # The CRD surface IS covered per push by chart:crd-validate, which
    # validates every rendered object against the installed CRDs without
    # scheduling anything — that is the half of installability a cold
    # kind cluster is not needed for.
    - >-
      helm install test charts/genieai-umbrella -n genieai --create-namespace
      $(cat charts/ci/render-base-flags)
      -f /tmp/ci-values.yaml
      --set "data.keycloak.clientSecrets.proxyClient=${CI_JOB_ID}-proxy"
      --set "data.keycloak.clientSecrets.dataprep=${CI_JOB_ID}-dataprep"
      --set "data.keycloak.clientSecrets.grafana=${CI_JOB_ID}-grafana"
      --wait --timeout 30m
    # Wait on Deployments, NOT pods: pre-install hook pods (dependency
    # check) are Succeeded-phase and never become Ready — `kubectl wait
    # pods --all` times out on them even on a healthy install (empirically
    # confirmed).
    - kubectl wait --for=condition=Available deploy --all -n genieai --timeout=10m
    - helm test test -n genieai --logs
    - mkdir -p chart-test-logs
    - >-
      for r in $(kubectl get deploy -n genieai -o name); do
      kubectl logs -n genieai "$r" --all-containers
      > "chart-test-logs/${r##*/}.log" 2>&1 || true;
      done
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - chart-test-logs/
  # Manual-only (2026-10-19): a cold full-stack install on the shared
  # runner pool needs >30m (multi-GB pulls inside the kind node + shared
  # CPU) — not tenable as a per-push gate. Same posture as the compose E2E
  # jobs: the fast gates (chart:lint, chart:contract) run per push;
  # installability is proven continuously on the live laptop cluster; this
  # job stays available on demand (click to run, e.g. before a release).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # A pipeline started from the UI/API has source "web" — first-match
    # semantics, so `when: never` here would DROP the job from exactly the
    # pipeline whose purpose is to run it by hand.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - charts/**/*
        - scripts/**/*
        - .gitlab-ci.yml
      when: manual
    - if: '$CI_COMMIT_BRANCH == "feat/k8s-migration"'
      changes:
        - charts/**/*
        - scripts/**/*
        - .gitlab-ci.yml
      when: manual

# Patrol E2E tests — DinD emulator (shared with scheduled:e2e-mobile)
e2e:integration:
  extends: .e2e_integration_base
  stage: e2e
  resource_group: e2e-runner
  allow_failure: true  # per-image skip: not all images build on a given MR;
                        # e2e needs ALL → can fail if unchanged images not in tmp/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      changes:
        - mobile/genie_ai_mobile/**/*
        - tests/e2e/chatbot/**/*
        - components/gov-chat-frontend/**/*
        - components/gov-chat-backend/**/*
        - .gitlab-ci.yml

# Playwright E2E — runs on merge trains
e2e:playwright:
  extends: .e2e_web_base
  stage: e2e
  resource_group: e2e-runner
  needs: [e2e:integration]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      changes:
        - tests/e2e/chatbot/**/*
        - tests/e2e/documents/**/*
        - tests/e2e/okf/**/*
        - components/gov-chat-frontend/**/*
        - components/gov-chat-backend/**/*
        - components/document-repository/**/*
        - .gitlab-ci.yml

# --- Configuration validation ---

# Verify each overlay module's requirements-cpu.txt is in sync with its
# requirements.in (retriever/reranker). Fails if someone edited a
# requirements.in (or bumped OPEA, or changed the Dockerfile base/apt layer)
# without running `make lock-<module>`. Catches silent lock drift before it
# reaches a build. Split into per-module parallel jobs so a transient PyPI
# failure in one module's tag-pipeline check does not block the other
# (reduced blast radius — DW-29). Dockerfile-* paths are included because
# OPEA_VERSION / apt / base-image bumps are canonical lock-regen triggers.
# Note: dataprep retired from this check (issue-834 lock pipeline retired
# on the v1.5 bump — dataprep no longer ships a requirements.in).
.verify-overlay-lock-base:
  stage: config
  image: python:3.11-slim
  interruptible: true
  # The lock check is self-contained (uv sync --dry-run + grep against the
  # checked-out files) — it must not pull upstream artifacts. Without this,
  # GitLab's default makes the job download EVERY test-stage artifact (scan
  # reports, JUnit XML), so an unrelated artifact-download failure kills the
  # lock check before its script even runs (2026-09-02: instance artifact
  # downloads 403'd pipeline-wide while uploads succeeded).
  dependencies: []
  variables:
    UV_VERSION: "0.10.6"
  before_script:
    - pip install --no-cache-dir "uv==${UV_VERSION}"
  script:
    - |
      set -e
      cd "${CI_PROJECT_DIR}/genie-ai-overlay/${MOD}"
      # Verify lock is consistent and installable without re-resolving.
      # uv pip sync --dry-run checks every package+hash exists on PyPI;
      # it does NOT re-resolve, so upstream version bumps don't cause
      # spurious failures (only removed packages do).
      uv pip sync requirements-cpu.txt --dry-run --system
      # Cross-check: verify requirements.in is covered by the lock.
      # greps top-level non-comment lines from requirements.in and
      # checks each package name appears in the lock. Missing = user
      # added a dep without regenerating the lock.
      while IFS= read -r line; do
        pkg=$(echo "$line" | sed 's/[<>=!~].*//;s/\[.*//;s/#.*//' | xargs)
        [ -z "$pkg" ] && continue
        norm=$(echo "$pkg" | tr '[:upper:]_' '[:lower:]-')
        if ! grep -q "^${norm}==" requirements-cpu.txt; then
          echo "MISSING from ${MOD} lock: $pkg — run 'make lock-${MOD}'"
          exit 1
        fi
      done < requirements.in
      echo "genie-ai-overlay/${MOD}/requirements-cpu.txt in sync"

verify:overlay-locks:retriever:
  extends: .verify-overlay-lock-base
  variables:
    MOD: retriever
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"

verify:overlay-locks:reranker:
  extends: .verify-overlay-lock-base
  variables:
    MOD: reranker
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"


config:validate:
  extends: .node_base
  stage: config
  # Self-contained env-coverage checks (npm test on the checkout) — no
  # upstream artifacts needed. Same rationale as verify:dataprep-lock:
  # the default artifact coupling made this job 403-flake with the
  # 2026-09-02/03 instance artifact-download problem.
  dependencies: []
  before_script:
    - cd tests/config-validator && npm ci
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm ci
    - cd ${CI_PROJECT_DIR}/components/gov-chat-frontend && npm ci
  script:
    - cd ${CI_PROJECT_DIR}/tests/config-validator && npm test
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm run test:ci
    # Each shipped config is validated against the schema it embeds. The
    # frontend's parity suite checks the asset keys agree across the seven
    # files; it never checks a file's data against its own schema, so a
    # mistyped value or a dropped required key ships otherwise.
    - cd ${CI_PROJECT_DIR}/components/gov-chat-frontend && npm run validate:config
  cache:
    - key:
        files:
          - tests/config-validator/package-lock.json
        prefix: config-validate
      paths:
        - tests/config-validator/node_modules/
      fallback_keys:
        - "config-validate-$CI_DEFAULT_BRANCH"
        - "config-validate-"
    - key:
        files:
          - api-gateway-solution/new-config/package-lock.json
        prefix: config-kong
      paths:
        - api-gateway-solution/new-config/node_modules/
      fallback_keys:
        - "config-kong-$CI_DEFAULT_BRANCH"
        - "config-kong-"
    - key:
        files:
          - components/gov-chat-frontend/package-lock.json
        prefix: config-frontend
      paths:
        - components/gov-chat-frontend/node_modules/
      fallback_keys:
        - "config-frontend-$CI_DEFAULT_BRANCH"
        - "config-frontend-"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - tests/config-validator/reports/jest-config.xml
        - api-gateway-solution/new-config/reports/jest-kong-config.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "env"
        - "env.*"
        - "docker-compose.yaml"
        - "docker-compose.gpu.yaml"
        - "genie-ai-overlay/retriever/**/*"
        - "genie-ai-overlay/chatqna/**/*"
        - "deploy/ansible/**/*"
        - "tests/config-validator/**/*"
        - "tests/fixtures/config/**/*"
        - "api-gateway-solution/new-config/**/*"
        - "components/gov-chat-frontend/public/config/genie-ai-config*.json"
        - "components/gov-chat-frontend/scripts/validate-config-schema.js"
        - "configs/keycloak/themes/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Validate the internal links of the documentation site.
#
# Hugo rewrites Markdown links that point at a content path, but never
# rewrites raw-HTML href attributes, and it keeps the old URL of a moved page
# alive as a redirect.  A link that only resolves through a redirect still
# works, but the reader lands on a redirect hop and the URL bar shows a path
# that is not the page's address -- the defect this guard was written for.
# The checker also refuses a `slug:` on a section, because Hugo's handling of
# a section slug depends on the Hugo version and the site is built from a
# floating Hugo image.
config:docs-links:
  extends: .node_base
  stage: config
  script:
    - cd ${CI_PROJECT_DIR}/site && node --test scripts/check-links.test.mjs
    - cd ${CI_PROJECT_DIR}/site && node scripts/check-links.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "site/content/**/*"
        - "site/scripts/**/*"
        - "site/hugo.toml"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Validate CHANGELOG.md has an entry for the version being released
config:changelog:
  stage: config
  image: alpine:3.21
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Checking CHANGELOG.md for version: ${VERSION}"
      if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
        echo "ERROR: CHANGELOG.md has no entry for version ${VERSION}."
        echo "Add a ## [${VERSION}] section before tagging."
        exit 1
      fi
      echo "CHANGELOG.md entry found for ${VERSION}."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# --- Scheduled jobs (nightly via pipeline schedule) ---

# Integration smoke test — runs full core stack via Docker Compose
# Enhanced by stories 1-8, 1-9 (Playwright E2E)
#
# REQUIRED CI Variables (Settings → CI/CD → Variables):
#   ARANGO_PASSWORD, POSTGRES_PASSWORD, KONG_DB_PASSWORD,
#   KEYCLOAK_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD,
#   KEYCLOAK_CLIENT_SECRET, GENIE_ADMIN_PASSWORD,
#   GENIE_ADMIN_EMAIL, KEYCLOAK_PROXY_CLIENT_SECRET,
#   KC_DATAPREP_CLIENT_SECRET, TRANSLATION_CACHE_PASSWORD
#
# CI variables override empty values from the env template (shell env > .env file).
# The env template provides non-secret config (KEYCLOAK_URL, KEYCLOAK_REALM, etc.).
scheduled:integration:
  extends: .e2e_integration_base
  stage: scheduled
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# Web frontend E2E tests (Playwright)
# Runs against the Docker stack started by scheduled:integration
scheduled:e2e-web:
  extends: .e2e_web_base
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# Teardown: clean up compose stack after E2E jobs finish (success or failure).
# Uses .post — GitLab's built-in final stage (always runs, even on failure).
.cleanup_base:
  image: docker:24
  stage: .post
  tags: [docker]
  script:
    - docker compose -p "ci-${CI_PIPELINE_ID}" down -v --remove-orphans 2>/dev/null || true

e2e:cleanup:
  extends: .cleanup_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      when: always

scheduled:cleanup:
  extends: .cleanup_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# --- Manual jobs (on-demand via Run Pipeline → click play) ---

# RAG quality regression — requires GPU runner
# Enhanced by Epic 8 (RAG Quality)
manual:rag-quality:
  image: python:3.11-slim
  stage: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  tags: [gpu]
  timeout: 60m
  before_script:
    - cd genie-ai-overlay
    - if [ ! -d .venv ]; then python -m venv .venv; fi
    - . .venv/bin/activate
    - pip install -e ".[test]"
  script:
    - . .venv/bin/activate
    - |
      if [ -z "$GPU_AVAILABLE" ]; then
        echo "No GPU detected — skipping RAG quality tests"
        exit 0
      fi
    - |
      pytest -m rag-quality --junitxml=reports/rag-quality.xml || echo "WARNING: No rag-quality tests found (Epic 8 placeholder)"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: genie-ai-overlay/reports/rag-quality.xml


# --- Documentation site build check ---
# The pages job below publishes on main ONLY, so a docs change on a merge
# request is never built until it lands — and a broken front-matter block,
# shortcode or relref then fails the PUBLISH rather than the merge, on the
# default branch, where it is most expensive to notice.
#
# This is the same build with no publish step, run on MRs. It exists so nobody
# has to install Hugo locally to find out whether a markdown edit compiles —
# which is the only reason this job is worth its runner minutes.
docs:build:
  stage: lint
  image: docker.io/hugomods/hugo:exts
  variables:
    GIT_SUBMODULE_STRATEGY: none
    HUGO_CACHEDIR: "$CI_PROJECT_DIR/.cache/hugo"
    HUGO_ENVIRONMENT: ci
  cache:
    key: hugo-docs
    paths:
      - .cache/hugo
  script:
    - cd site
    - hugo mod tidy
    # No --baseURL override: a relref that cannot resolve fails the build, which
    # is the whole point of running this before merge rather than after.
    - hugo --gc --minify --destination "$CI_PROJECT_DIR/.hugo-check"
    # Prove the build actually produced pages — a silent empty output would
    # otherwise read as success.
    - test -f "$CI_PROJECT_DIR/.hugo-check/index.html"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - site/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - site/**/*
        - .gitlab-ci.yml

# --- Documentation site -> GitLab Pages ---
# Builds the Hugo + Docsy site in site/ and publishes to GitLab Pages.
# Docsy is a Hugo Module (needs Go); assets need Node. hugomods/hugo:exts
# provides all three (latest stable).
pages:
  stage: deploy
  image: docker.io/hugomods/hugo:exts
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - cd site
    - hugo mod tidy
    - hugo --gc --minify --baseURL "$CI_PAGES_URL/" --destination "$CI_PROJECT_DIR/public"
  artifacts:
    paths:
      - public
