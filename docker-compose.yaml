# Ports Overview:
# 8090 - gov chat frontend
# 3000 - gov chat backend
# 3001 - doc repo dev
# 3310 - clamav
# 80 - default OPEA UI nginx server (chatqna-xeon-nginx-server)
# 5173 - default OPEA UI frontend (chatqna-xeon-ui-server)
# 6000 - embedding wrapper
# 6007 - dataprep API endpoint
# 6100 - reranker wrapper
# 7000 - TEI (embedding inference server)
# 7025 - retriever-arango-dev
# 7100 - TEI reranker (inference server)
# 8000 - vLLM (main LLM server)
# 8888 - chatqna backend server
# 9000 - textgen wrapper
# 9030 - translation wrapper
# 9031 - vllm-translation-guardrail (guarded LLM)
# 9090 - guardrail (guard logic endpoint)
# 6666 - http-service (for auth token retrieval)

name: genieai_mvp

volumes:
  kong_data:
  nginx_conf:
  redis_data:
  doc_repo_uploads: {}
  arango_data:
    driver: local

secrets:
  server_cert:
    file: ./secrets/ssl/server.crt
  server_key:
    file: ./secrets/ssl/server.key
  chatqna_system_prompt:
    file: ./config/prompts/chatqna-system.txt
  chatqna_abstention_instructions:
    file: ./config/prompts/chatqna-abstention.txt
  label_selector_system_prompt:
    file: ./config/prompts/label-selector.txt

services:

  kong-database:
    image: postgres:13
    restart: unless-stopped
    networks:
      - genieai_network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-kong}
      - POSTGRES_DB=${POSTGRES_DB:-kong}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    # PostgreSQL internal only - no external access needed
    # ports:
    #   - "5432:5432"
    volumes:
      - kong_data:/var/lib/postgresql/data
      - ./api-gateway-solution/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kong database migrations (runs automatically on first start, idempotent)
  kong-migrations:
    image: kong:latest
    restart: "no"
    networks:
      - genieai_network
    environment:
      - KONG_DATABASE=${KONG_DATABASE:-postgres}
      - KONG_PG_HOST=${KONG_PG_HOST:-kong-database}
      - KONG_PG_USER=${KONG_PG_USER:-kong}
      - KONG_PG_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      kong-database:
        condition: service_healthy
    command: >
      bash -c "
        kong migrations bootstrap 2>/dev/null ||
        kong migrations up &&
        kong migrations finish
      "

  kong:
    image: kong:latest
    restart: unless-stopped
    environment:
      - KONG_DATABASE=${KONG_DATABASE:-postgres}
      - KONG_PG_HOST=${KONG_PG_HOST:-kong-database}
      - KONG_PG_USER=${KONG_PG_USER:-kong}
      - KONG_PG_PASSWORD=${POSTGRES_PASSWORD}
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=${KONG_ADMIN_LISTEN:-127.0.0.1:8001, 127.0.0.1:8444 ssl}
      - KONG_DNS_RESOLVER=${KONG_DNS_RESOLVER:-127.0.0.11}
      - KONG_DNS_ORDER=${KONG_DNS_ORDER:-LAST,A,AAAA,CNAME}
      - KONG_NGINX_DAEMON=off
    networks:
      - genieai_network
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    # Kong proxy - internal only. All external traffic routes through nginx:80/443.
    # Uncomment for debugging direct Kong access (bypasses nginx security):
    # ports:
    #   - "${KONG_PROXY_PORT:-8000}:8000"
    #   - "${KONG_HTTPS_PORT:-8443}:8443"
    # Kong admin API - internal only (accessible via kong-config container sharing network)
    # ports:
    #   - "8001:8001"
    volumes:
      - ./api-gateway-solution/kong_logs:/var/log/kong

  frontend:
    build:
      context: ./components/gov-chat-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8090
      - VUE_APP_API_URL=${VUE_APP_API_URL:-/api}
      - VUE_PROXY_HOST=${VUE_PROXY_HOST:-localhost}
      - VUE_APP_CSP_CONNECT_SRC=${VUE_APP_CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
    # Port 8090 is internal only — outer nginx on 80/443 is the public entry point
    # ports:
    #   - "${FRONTEND_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - genieai_network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    # Internal only - no host port mapping needed
    # ports:
    #   - "${TRANSLATION_CACHE_PORT:-6379}:6379"
    environment:
      - REDISCLI_AUTH=${TRANSLATION_CACHE_PASSWORD}
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${TRANSLATION_CACHE_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genieai_network

  backend:
    build:
      context: ./components
      dockerfile: gov-chat-backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./database_backups:/app/database_backups
      - ./logs:/app/logs
      - ./data:/app/data
      - ./components/gov-chat-backend/Uploads:/app/Uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      arango-vector-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      # Database config
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-genie-ai}
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_USER=${ARANGO_USER:-root}
      # Security configuration (required, no defaults in code)
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      # Translation cache (required, no default in code)
      - TRANSLATION_BACKEND=${TRANSLATION_BACKEND:-cpu}
      - TRANSLATION_CPU_MODEL_ID=${TRANSLATION_CPU_MODEL_ID:-Xenova/nllb-200-distilled-600M}
      - TRANSLATION_THREADS=${TRANSLATION_THREADS:-4}
      - TRANSLATION_BATCHES=${TRANSLATION_BATCHES:-5}
      - TRANSLATION_CACHE=${TRANSLATION_CACHE:-on}
      - TRANSLATION_CACHE_HOST=${TRANSLATION_CACHE_HOST:-redis-cache}
      - TRANSLATION_CACHE_PORT=${TRANSLATION_CACHE_PORT:-6379}
      - TRANSLATION_CACHE_PASSWORD=${TRANSLATION_CACHE_PASSWORD}
      # Email configuration (required)
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # OPEA AI/ML service override (code default is deployment-specific: 'e2e-109-198')
      - OPEA_HOST=${OPEA_HOST:-chatqna-xeon-backend-server}
      # CORS (deployment-specific, localhost defaults)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8090,http://127.0.0.1:8090,https://localhost,http://localhost}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
    networks:
      - genieai_network
    dns:
      - 8.8.8.8
      - 8.8.4.4

  document-repository:
    build:
      context: ./components
      dockerfile: document-repository/Dockerfile
    container_name: doc-repo-dev
    environment:
      # Secrets (required, no defaults in code)
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ARANGO_DB=${ARANGO_DB:-genie-ai}
    depends_on:
      clamav:
        condition: service_started
      arango-vector-db:
        condition: service_healthy
    # Internal only - no host port mapping needed
    # ports:
    #   - "${DOC_REPO_PORT:-3001}:3001"
    networks:
      - genieai_network
    volumes:
      - ./logs:/app/logs
      - doc_repo_uploads:/app/uploads

  clamav:
    image: clamav/clamav
    container_name: clamav
    restart: unless-stopped
    #ports: #   - "3310:3310"  # Uncomment to expose
    networks:
      - genieai_network

  arango-vector-db:
    image: arangodb/arangodb:3.12.4
    container_name: arango-vector-db
    # Internal only - no host port mapping needed
    # ports:
    #   - "${ARANGO_PORT:-8529}:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    command: ["--experimental-vector-index=true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:${ARANGO_PORT:-8529} --server.username root --server.password \"${ARANGO_PASSWORD}\" --javascript.execute-string \"db._version();\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - genieai_network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80" # HTTP public access (redirects to HTTPS)
      - "${NGINX_HTTPS_PORT:-443}:443" # HTTPS public access
    environment:
      - NGINX_PUBLIC_DOMAIN=${NGINX_PUBLIC_DOMAIN:-localhost}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-'self' http://localhost:3000 http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://localhost:8090}
      - KONG_PROXY_HOST=${KONG_PROXY_HOST:-kong}
      - NGINX_FRONTEND_HOST=${NGINX_FRONTEND_HOST:-frontend}
      - NGINX_FRONTEND_PORT=${NGINX_FRONTEND_PORT:-8090}
    volumes:
      - ./api-gateway-solution/nginx/conf:/etc/nginx/conf.d
      - ./api-gateway-solution/nginx/entrypoint.sh:/scripts/entrypoint.sh:ro
      - nginx_conf:/etc/nginx
    secrets:
      - server_cert
      - server_key
    entrypoint:
      - /scripts/entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - genieai_network
    depends_on:
      - kong

  http-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our custom Dockerfile
      dockerfile: ./genie-ai-overlay/http-service/Dockerfile
    container_name: http-service
    environment:
      # Internal service URL - hardcoded for Docker network
      AUTH_SERVICE_URL: http://backend:3000/api/auth
      AUTH_SERVICE_USERNAME: ${AUTH_SERVICE_USERNAME:-admin}
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8090,http://127.0.0.1:8090}
    depends_on:
      backend:
        condition: service_healthy
    #ports: #   - "6666:6666"  # Uncomment to expose
    networks:
      - genieai_network
    restart: "no"

  dataprep-arango-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/dataprep/Dockerfile-dataprep_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_GENAI_COMPS_URL:-https://github.com/opea-project/GenAIComps.git}
        HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    image: genie-ai-dataprep-arango:${OPEA_VERSION:-latest}
    container_name: genie-ai-dataprep-arango
    depends_on:
      arango-vector-db:
        condition: service_started
      embedding:
        condition: service_started
      vllm:
        condition: service_healthy
      guardrail:
        condition: service_started
    #ports: #   - "5000:5000"  # Uncomment to expose
    environment:
      DATAPREP_COMPONENT_NAME: GENIE_DATAPREP_ARANGODB
      VLLM_MODEL_ID: ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      VLLM_ENDPOINT: http://vllm:8000
      TEI_EMBEDDING_ENDPOINT: http://tei:80
      GUARDRAIL_URL: http://guardrail:9090/v1/guardrails
      ARANGO_URL: http://arango-vector-db:8529
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME:-GRAPH_TEST}
      GET_AUTH_TOKEN_URL: http://http-service:6666/get-token
      DOCUMENT_REPOSITORY_URL: http://document-repository:3001
      BACKEND_SERVICE_URL: http://backend:3000
      LABELING_STRATEGY: ${LABELING_STRATEGY:-llm}
      EMBEDDING_LABEL_THRESHOLD: ${EMBEDDING_LABEL_THRESHOLD:-0.75}
      BM25_LABEL_THRESHOLD: ${BM25_LABEL_THRESHOLD:-2.00}
      CONTENT_EXTRACTION_METHOD: ${CONTENT_EXTRACTION_METHOD:-docling}
      DATAPREP_MAX_CONCURRENT_BATCHES: ${DATAPREP_MAX_CONCURRENT_BATCHES:-5}
      DOCLING_DEVICE: ${DOCLING_DEVICE:-cpu}
      DATAPREP_CHUNK_SIZE_PDF: ${DATAPREP_CHUNK_SIZE_PDF:-500}
      DATAPREP_CHUNK_SIZE_DOCX: ${DATAPREP_CHUNK_SIZE_DOCX:-1000}
      DATAPREP_CHUNK_SIZE_XLSX: ${DATAPREP_CHUNK_SIZE_XLSX:-1500}
      DATAPREP_CHUNK_SIZE_PPTX: ${DATAPREP_CHUNK_SIZE_PPTX:-500}
      DATAPREP_CHUNK_SIZE_HTML: ${DATAPREP_CHUNK_SIZE_HTML:-500}
      DATAPREP_CHUNK_SIZE_TXT: ${DATAPREP_CHUNK_SIZE_TXT:-500}
      DATAPREP_CHUNK_SIZE_MD: ${DATAPREP_CHUNK_SIZE_MD:-500}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"

  retriever-arango-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/retriever/Dockerfile-retriever_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_GENAI_COMPS_URL:-https://github.com/opea-project/GenAIComps.git}
    image: genie-ai-retriever-arango:${OPEA_VERSION:-latest}
    container_name: genie-ai-retriever-arango
    depends_on:
      arango-vector-db:
        condition: service_started
      embedding:
        condition: service_started
    #ports: #   - "7025:7025"  # Uncomment to expose
    ipc: host
    environment:
      RETRIEVER_COMPONENT_NAME: GENIE_RETRIEVER_ARANGODB
      ARANGO_GRAPH_NAME: ${ARANGO_GRAPH_NAME:-GRAPH_TEST}
      VLLM_ENDPOINT: http://vllm:8000
      ARANGO_URL: http://arango-vector-db:8529
      TEI_EMBEDDING_ENDPOINT: http://tei:80
    networks:
      - genieai_network
    restart: "no"

  chatqna-xeon-backend-server:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_EXAMPLES_URL:-https://github.com/opea-project/GenAIExamples.git}
    image: genie-ai-chatqna-server:${OPEA_VERSION:-latest}
    container_name: genie-ai-chatqna-server
    working_dir: /app/ChatQnA
    depends_on:
      vllm:
        condition: service_healthy
      embedding:
        condition: service_started
      retriever-arango-service:
        condition: service_started
      reranker:
        condition: service_started
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${OPEA_PORT}:${OPEA_PORT}"
    secrets:
      - chatqna_system_prompt
      - chatqna_abstention_instructions
    environment:
      CHATQNA_TYPE: ${CHATQNA_TYPE:-ChatQnA}
      MEGA_SERVICE_HOST_IP: chatqna-xeon-backend-server
      EMBEDDING_SERVER_HOST_IP: embedding
      EMBEDDING_SERVER_PORT: 6000
      RETRIEVER_SERVICE_HOST_IP: retriever-arango-service
      RETRIEVER_SERVICE_PORT: 7025
      RERANK_SERVER_HOST_IP: reranker
      RERANK_SERVER_PORT: 8000
      LLM_SERVER_HOST_IP: vllm
      LLM_SERVER_PORT: 8000
      GUARDRAIL_SERVICE_HOST_IP: guardrail
      GUARDRAIL_SERVICE_PORT: 9090
      TRANSLATION_SERVICE_HOST_IP: vllm-translation-guardrail
      TRANSLATION_SERVICE_PORT: 9031
      DOC_REPO_URL: http://document-repository:3001
      GET_AUTH_TOKEN_URL: http://http-service:6666/get-token
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"

  chatqna-xeon-ui-server:
    image: opea/chatqna-ui:latest
    container_name: chatqna-xeon-ui-server
    depends_on:
      - chatqna-xeon-backend-server
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${FRONTEND_SERVICE_PORT}:${FRONTEND_SERVICE_PORT}"
    environment:
      UPLOAD_FILE_BASE_URL: http://dataprep-arango-service:6007/v1/dataprep/ingest
    ipc: "host"
    networks:
      - genieai_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chatqna-xeon-nginx-server:
    image: opea/nginx:latest
    container_name: chatqna-xeon-nginx-server
    depends_on:
      chatqna-xeon-backend-server:
        condition: service_started
      chatqna-xeon-ui-server:
        condition: service_healthy
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${NGINX_PORT}:${NGINX_PORT}"
    environment:
      FRONTEND_SERVICE_IP: chatqna-xeon-ui-server
      FRONTEND_SERVICE_PORT: 5173
      BACKEND_SERVICE_NAME: chatqna-xeon-backend-server
      BACKEND_SERVICE_IP: chatqna-xeon-backend-server
      BACKEND_SERVICE_PORT: 8888
      DATAPREP_SERVICE_IP: dataprep-arango-service
      DATAPREP_SERVICE_PORT: 6007
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  vllm:
    container_name: vllm-vllm-2
    image: vllm/vllm-openai:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${LLM_SERVER_PORT:-8000}:8000"
    command: >
      --model ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      --gpu_memory_utilization ${VLLM_GPU_UTILIZATION:-0.4}
      --served-model-name ${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      --max_model_len ${VLLM_MAX_MODEL_LEN:-2048}
      --max_num_seqs ${VLLM_MAX_NUM_SEQS:-64}
      --dtype=${VLLM_DTYPE:-half}
      --enforce-eager
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
      - VLLM_USE_FLASHINFER_SAMPLER=0
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  textgen:
    container_name: llm-textgen
    image: opea/llm-textgen:latest
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - LLM_ENDPOINT=http://vllm:8000
      - LLM_MODEL_ID=${VLLM_LLM_MODEL_ID:-meta-llama/Meta-Llama-3.1-8B-Instruct}
    #ports: #   - "9000:9000"  # Uncomment to expose
    ipc: "host"
    networks:
      - genieai_network
    restart: unless-stopped

  vllm-translation-guardrail:
    container_name: vllm-vllm-translation-guardrail
    image: vllm/vllm-openai:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    #ports: #   - "9031:9031"  # Uncomment to expose
    command: >
      --model ${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      --gpu_memory_utilization ${VLLM_TRANSLATION_GPU_UTILIZATION:-0.3}
      --served-model-name ${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      --max_model_len ${VLLM_TRANSLATION_MAX_MODEL_LEN:-2048}
      --kv-cache-dtype=${VLLM_TRANSLATION_KV_CACHE_DTYPE:-fp8}
      --dtype=${VLLM_TRANSLATION_DTYPE:-half}
      --port ${VLLM_TRANSLATION_SERVICE_PORT:-9031}
      --no-enable-chunked-prefill
      --max-num-seqs ${VLLM_TRANSLATION_MAX_NUM_SEQS:-16}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9031/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

  translation:
    image: opea/translation:latest
    container_name: translation-microservice
    environment:
      - LLM_ENDPOINT=http://vllm-translation-guardrail:9031
      - LLM_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
    #ports: #   - "9030:9030"  # Uncomment to expose
    depends_on:
      vllm-translation-guardrail:
        condition: service_healthy
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  guardrail:
    container_name: llm-guardrail
    image: opea/guardrails:latest
    environment:
      - LLM_ENDPOINT=http://vllm-translation-guardrail:9031
      - LLM_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      - SAFETY_GUARD_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID:-google/gemma-3-4b-it}
      - GUARDRAILS_COMPONENT_NAME=OPEA_LLM_GUARD
    # Internal OPEA service - no host port needed
    # ports:
    #   - "${GUARDRAIL_SERVICE_PORT}:${GUARDRAIL_SERVICE_PORT}"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"
  
  tei:
    image: ${TEI_EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:1.9.3}
    container_name: tei-embedding-serving
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${EMBEDDING_MODEL_ID:-BAAI/bge-base-en-v1.5} --auto-truncate"
    runtime: nvidia
    # Internal only - no host port mapping needed
    # ports:
    #   - "${TEI_EMBEDDING_PORT:-7000}:80"
    volumes:
      - "${DATA_PATH:-./data}:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    depends_on:
      vllm-translation-guardrail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 6s
      retries: 48
    networks:
      - genieai_network
    restart: "no"

  embedding:
    container_name: embedding
    image: opea/embedding:latest
    depends_on:
      tei:
        condition: service_healthy
    environment:
      - EMBEDDING_MODEL_ENDPOINT=http://tei:80
      - TEI_EMBEDDING_ENDPOINT=http://tei:80
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID:-BAAI/bge-base-en-v1.5}
    #ports: #   - "6000:6000"  # Uncomment to expose
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  tei_reranker:
    image: ${TEI_RERANKING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:1.9.3}
    container_name: tei-reranker-serving
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${RERANKER_MODEL_ID:-cross-encoder/ms-marco-MiniLM-L-6-v2} --max-batch-tokens ${TEI_RERANKING_MAX_BATCH_TOKENS:-1024} --max-concurrent-requests ${TEI_RERANKING_MAX_CONCURRENT_REQUESTS:-8} --auto-truncate"
    runtime: nvidia
    #ports: #   - "7100:80"  # Uncomment to expose
    volumes:
      - "${DATA_PATH:-./data}:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    depends_on:
      vllm-translation-guardrail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 6s
      retries: 48
    networks:
      - genieai_network
    restart: "no"

  reranker:
    build:
      context: .
      dockerfile: ./genie-ai-overlay/reranker/Dockerfile-reranker_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_GENAI_COMPS_URL:-https://github.com/opea-project/GenAIComps.git}
    image: genie-ai-reranker:${OPEA_VERSION:-latest}
    container_name: genie-ai-reranker
    depends_on:
      tei_reranker:
        condition: service_healthy
    environment:
      - RERANKER_MODEL_ENDPOINT=http://tei_reranker:80
      - TEI_RERANKING_ENDPOINT=http://tei_reranker:80
      - RERANK_COMPONENT_NAME=GENIE_TEI_RERANKING
      - RERANKING_STRATEGY=${RERANKING_STRATEGY:-threshold}
      - RERANKING_THRESHOLD=${RERANKING_THRESHOLD:-0.5}
    #ports: #   - "6100:8000"  # Uncomment to expose
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

networks:
  genieai_network:
    name: genieai_mvp_genieai_network
    driver: bridge
