{{- $global := .Values.global | default dict -}}
{{- $services := .Values.services | default dict -}}
{{- $servicesBackend := $services.backend | default dict -}}
{{- $data := .Values.data | default dict -}}
{{- $dataArangodb := $data.arangodb | default dict -}}
{{- if $servicesBackend.enabled -}}
{{- /*
The migrations image (components/gov-chat-backend/Dockerfile.migrations)
creates the ArangoDB collections the backend's user provisioning writes
to. The helm hook ordering gates the backend on this Job's success
(the equivalent of a depends_on condition) — this Job (weight 5) runs before
the Keycloak convergence Job (weight 10) on install and upgrade, and
the backend starts unconditionally but fails its first authenticated
request without the collections, which is what this Job prevents.
*/ -}}
{{- $ns := .Values.namespace -}}
{{- /* Same precedence as the service factory: the documented install
knob global.imageRegistry wins over the top-level imageRegistry — a
divergence here would move every service image to an air-gapped mirror
while this hook kept pulling from the default registry. */ -}}
{{- $registry := $global.imageRegistry | default .Values.imageRegistry -}}
{{- $img := $servicesBackend.migrationsImage | default dict -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "genieai-common.fullname" . }}-db-migrations
  namespace: {{ $ns }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,post-rollback
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        # component "migrate-db", NOT "backend": a pod labeled like the
        # backend Service's own selector joins its EndpointSlice, so during
        # the post-install hook window real /api traffic load-balances to a
        # migrations process that exits when it finishes. The egress this
        # loses is granted back by migrate/db-migrations-networkpolicy.yaml.
        {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "migrate-db") | nindent 8 }}
    spec:
      restartPolicy: Never
      # Same contract as the service factory and the convergence Job: a
      # registry that needs a pull secret (an air-gapped mirror, a private
      # GitLab registry) would leave THIS hook in ImagePullBackOff, and
      # the hook blocks the whole install — with a message naming a
      # component the operator is not looking at.
      {{- with $global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65534
      {{- /* Helm's --wait tracks BUILT-IN kinds only: the ArangoDeployment
      is a custom resource, so the hook Job starts while the ArangoDB
      pods are still pulling their image and bootstrapping. The
      migration script connects with no retry, the Job exhausts
      backoffLimit and the install fails on the hook — a message that
      points nowhere near the real cause. This initContainer waits for
      the database to answer before the migration container starts (the
      sibling convergence Job does the same for Keycloak with
      KEYCLOAK_AVAILABILITYCHECK). */ -}}
      {{- if $dataArangodb.enabled }}
      initContainers:
        - name: wait-for-arango
          image: "{{ $global.toolingImageRegistry | default "docker.io" }}/curlimages/curl:8.10.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              url="{{ include "genieai-umbrella.arangoURL" . }}/_api/version"
              i=0
              while [ "$i" -lt 100 ]; do
                if curl -sf "$url" >/dev/null 2>&1; then
                  echo "arangodb is up: $url"
                  exit 0
                fi
                i=$((i+1))
                sleep 3
              done
              echo "arangodb did not answer $url within 300s" >&2
              exit 1
      {{- end }}
      containers:
        - name: db-migrations
          image: {{ if $registry }}{{ $registry }}/{{ end }}{{ $img.repository | default "genie-ai-db-migrations" }}:{{ $img.tag | default "main" }}
          imagePullPolicy: {{ include "genieai-umbrella.imagePullPolicy" (dict "tag" ($img.tag | default "main") "pullPolicy" $global.imagePullPolicy) }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Mirrors the backend's data-tier wiring: same URL, database
            # and credentials, so the collections land in the database
            # the backend actually reads.
            - name: ARANGO_URL
              value: {{ include "genieai-umbrella.arangoURL" . | quote }}
            - name: ARANGO_DB
              value: {{ $dataArangodb.database | default "_system" | quote }}
            - name: ARANGO_USER
              value: "root"
            - name: ARANGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arango-root-secret
                  key: password
{{- end -}}
