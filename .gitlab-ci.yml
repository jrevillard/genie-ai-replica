  script:
    - mkdir -p reports
    - OPEA_SSL_SKIP_VERIFY=1 pytest tests/config/ssl/test_genie_ssl_patch.py -v --junitxml=reports/pytest-sitecustomize.xml --cov=configs.ssl.genie_ssl_patch --cov-report=term --cov-report=xml:reports/coverage.xml
  coverage: '/^TOTAL\s+\S+\s+\S+\s+(\d+)%/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/pytest-sitecustomize.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "configs/ssl/**/*"
        - "tests/config/ssl/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# --- Existing jobs (unchanged) ---

# Unit tests — runs on every PR touching mobile/
# Downloads Flutter SDK from official archive with caching
test:flutter:
  extends: .flutter_base
  stage: test
  script:
    - export PATH="$PWD/../../flutter-sdk/bin:$PATH"
    - dart pub global activate junitreport_maintained
    - export PATH="$PATH:$PUB_CACHE/bin"
    - mkdir -p reports
    - flutter test --machine --coverage > reports/flutter-machine.json 2>&1
    - cat reports/flutter-machine.json | tojunit --output reports/flutter-report.xml
    - perl -pi -e 's/&#x1[bB];\[[0-9;]*m//g; s/&#27;\[[0-9;]*m//g; s/\x1b\[[0-9;]*m//g; s/&#x1[bB];//g; s/&#27;//g; s/[\x00-\x08\x0b\x0c\x0e-\x1f]//g' reports/flutter-report.xml
    - 'sed -i ''/lib\/i18n\//d'' coverage/lcov.info'
    - 'COV=$(awk ''/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{if(lf>0) printf "%.1f",lh/lf*100}'' FS=: coverage/lcov.info) && echo "Lines: ${COV}%" || echo "No coverage data"'
    - python3 -m venv /tmp/lcov-cov && . /tmp/lcov-cov/bin/activate && pip install lcov-cobertura && lcov_cobertura coverage/lcov.info --output reports/coverage-cobertura.xml
  coverage: '/^Lines:\s+(\d+\.?\d*)%/'
  artifacts:
    reports:
      junit: mobile/genie_ai_mobile/reports/flutter-report.xml
      coverage_report:
        coverage_format: cobertura
        path: mobile/genie_ai_mobile/reports/coverage-cobertura.xml
    paths:
      - mobile/genie_ai_mobile/coverage/
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "mobile/genie_ai_mobile/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Patrol E2E tests — DinD emulator (shared with scheduled:e2e-mobile)
e2e:integration:
  extends: .e2e_integration_base
  stage: e2e
  resource_group: e2e-runner
  # Wait for all candidate images before pulling them. e2e:integration is not a
  # matrix job, so referencing build:image without a matrix sub-key depends on
  # every parallel build instance.
  needs:
    - job: build:image
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      changes:
        - mobile/genie_ai_mobile/**/*
        - tests/e2e/chatbot/**/*
        - components/gov-chat-frontend/**/*
        - components/gov-chat-backend/**/*
        - .gitlab-ci.yml

patrol:e2e:
  extends: .e2e_mobile_base
  stage: e2e
  resource_group: e2e-runner
  needs: [e2e:integration, lint:dart, test:flutter]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      changes:
        - mobile/genie_ai_mobile/**/*

# Playwright E2E — runs on merge trains (same pattern as patrol:e2e)
e2e:playwright:
  extends: .e2e_web_base
  stage: e2e
  resource_group: e2e-runner
  needs: [e2e:integration]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      changes:
        - tests/e2e/chatbot/**/*
        - tests/e2e/documents/**/*
        - components/gov-chat-frontend/**/*
        - components/gov-chat-backend/**/*
        - components/document-repository/**/*
        - .gitlab-ci.yml

# --- Configuration validation ---

config:validate:
  extends: .node_base
  stage: config
  before_script:
    - cd tests/config-validator && npm ci
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm ci
  script:
    - cd ${CI_PROJECT_DIR}/tests/config-validator && npm test
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm run test:ci
  cache:
    - key:
        files:
          - tests/config-validator/package-lock.json
        prefix: config-validate
      paths:
        - tests/config-validator/node_modules/
      fallback_keys:
        - "config-validate-$CI_DEFAULT_BRANCH"
        - "config-validate-"
    - key:
        files:
          - api-gateway-solution/new-config/package-lock.json
        prefix: config-kong
      paths:
        - api-gateway-solution/new-config/node_modules/
      fallback_keys:
        - "config-kong-$CI_DEFAULT_BRANCH"
        - "config-kong-"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - tests/config-validator/reports/jest-config.xml
        - api-gateway-solution/new-config/reports/jest-kong-config.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "env"
        - "env.*"
        - "docker-compose.yaml"
        - "docker-compose.gpu.yaml"
        - "tests/config-validator/**/*"
        - "tests/fixtures/config/**/*"
        - "api-gateway-solution/new-config/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# --- Scheduled jobs (nightly via pipeline schedule) ---

# Integration smoke test — runs full core stack via Docker Compose
# Enhanced by stories 1-8, 1-9 (Playwright E2E)
#
# REQUIRED CI Variables (Settings → CI/CD → Variables):
#   ARANGO_PASSWORD, POSTGRES_PASSWORD, KONG_DB_PASSWORD,
#   KEYCLOAK_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD,
#   KEYCLOAK_CLIENT_SECRET, GENIE_ADMIN_PASSWORD,
#   GENIE_ADMIN_EMAIL, KEYCLOAK_PROXY_CLIENT_SECRET,
#   KC_DATAPREP_CLIENT_SECRET, TRANSLATION_CACHE_PASSWORD
#
# CI variables override empty values from the env template (shell env > .env file).
# The env template provides non-secret config (KEYCLOAK_URL, KEYCLOAK_REALM, etc.).
scheduled:integration:
  extends: .e2e_integration_base
  stage: scheduled
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# Mobile E2E tests (Patrol) — shared logic with patrol:e2e via .e2e_mobile_base
# Depends on scheduled:integration (running Docker stack)
# Uses Google's official Android emulator via Docker (requires KVM)
# Networking: socat + adb reverse routes emulator's 127.0.0.1:8443 → nginx:443
scheduled:e2e-mobile:
  extends: .e2e_mobile_base
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# Web frontend E2E tests (Playwright)
# Runs against the Docker stack started by scheduled:integration
scheduled:e2e-web:
  extends: .e2e_web_base
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# MELT correlation tests (Story 7-10)
# Validates observability pipeline: traces, metrics, logs correlation across Victoria* backends.
# Scheduled tier — runs only when ENABLE_OBSERVABILITY=1 (requires observability stack).
# Depends on scheduled:integration for Docker stack + observability profile.
scheduled:melt-correlation:
  image: node:20-alpine
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  variables:
    PROPAGATION_DELAY: "20"
  script:
    - apk add --no-cache bash curl
    - cd tests/melt-correlation
    - bash run-melt-test.sh --skip-chaos --skip-playwright
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/melt-*.xml
    reports:
      junit:
        - reports/melt-correlation-report.xml
        - reports/melt-grafana-report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ENABLE_OBSERVABILITY == "1"
      when: on_success

# MELT chaos resilience tests (Story 7-10, AC#4/#5)
# Separate job — stops/restarts Victoria* backends, requires isolation.
# Runs after melt-correlation (needs baseline data).
scheduled:melt-chaos:
  image: docker:24
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  variables:
    PROPAGATION_DELAY: "20"
    RESTART_TIMEOUT: "90"
  script:
    - apk add --no-cache bash curl nodejs npm
    - npm ci --no-audit --no-fund 2>/dev/null || npm install
    - cd tests/melt-correlation
    - bash run-melt-test.sh --skip-playwright --correlation-only || true
    - node chaos-resilience.test.js
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/melt-chaos-report.xml
    reports:
      junit:
        - reports/melt-chaos-report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ENABLE_OBSERVABILITY == "1"
      when: on_success

# Teardown: clean up compose stack after E2E jobs finish (success or failure).
# Uses .post — GitLab's built-in final stage (always runs, even on failure).
.cleanup_base:
  image: docker:24
  stage: .post
  tags: [docker]
  script:
    - docker compose -p "ci-${CI_PIPELINE_ID}" down -v --remove-orphans 2>/dev/null || true

e2e:cleanup:
  extends: .cleanup_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      when: always

scheduled:cleanup:
  extends: .cleanup_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# --- Manual jobs (on-demand via Run Pipeline → click play) ---

# RAG quality regression — requires GPU runner
# Enhanced by Epic 8 (RAG Quality)
manual:rag-quality:
  image: python:3.10-slim
  stage: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  tags: [gpu]
  timeout: 60m
  before_script:
    - cd genie-ai-overlay
    - if [ ! -d .venv ]; then python -m venv .venv; fi
    - . .venv/bin/activate
    - pip install -e ".[test]"
  script:
    - . .venv/bin/activate
    - |
      if [ -z "$GPU_AVAILABLE" ]; then
        echo "No GPU detected — skipping RAG quality tests"
        exit 0
      fi
    - |
      pytest -m rag-quality --junitxml=reports/rag-quality.xml || echo "WARNING: No rag-quality tests found (Epic 8 placeholder)"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: genie-ai-overlay/reports/rag-quality.xml
