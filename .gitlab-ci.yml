# Smoke-test the dataprep candidate image: import the docling stack + the
# GENIE overlay module. Catches runtime ImportErrors that a green build does
# NOT surface (issue #834: docling-core>=2.83.0 removed legacy_doc.BaseText,
# imported by docling==2.30.0 at startup). Build green != service alive.
smoke:dataprep-arango:
  stage: scan
  image: docker:28
  tags: [docker]
  interruptible: true
  needs:
    - job: build:dataprep-arango
  variables:
    IMAGE_NAME: "genie-ai-dataprep-arango"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      REGISTRY_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:${CANDIDATE_TAG}"
      echo "Smoke-testing imports in $REGISTRY_REF"
      docker run --rm --entrypoint python "$REGISTRY_REF" -c "import docling; from docling_core.types.legacy_doc.base import BaseText; print('docling legacy_doc OK'); import comps.dataprep.src.integrations.genieai_dataprep_arangodb; print('genieai_dataprep_arangodb import OK')"
  rules:
    - *train_skip
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *dataprep_source_changes
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: *dataprep_source_changes
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths: *dataprep_source_changes


scan:dataprep-arango:
  <<: *scan_template
  needs:
