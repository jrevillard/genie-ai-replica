{{- if .Values.observability.grafana.enabled }}
{{- /*
  GrafanaFolders + GrafanaDashboard + GrafanaAlertRuleGroup CRs.
  GrafanaFolders group dashboards into a UI tree: General for the
  application-facing dashboards, Observability for the stack
  dashboards.

  Dashboards: configs/grafana/provisioning/dashboards/*.json +
  dashboards/observability/*.json. JSON content is inlined via
  `.Files.Get` (the largest is ~263 KiB, well under the 1 MiB
  ConfigMap threshold where the spec.url+ConfigMap fallback would be
  safer). Helm's `toString` keeps the raw JSON intact in a block
  scalar.

  Alert rules: configs/grafana/provisioning/alerting/alert-rules.yml
  is the only file with `groups:` (contact-points and
  notification-policies are separate Grafana resources — the
  bitnami/grafana-operator 4.9.x does not yet ship CRs for them
  under the same stable API; provisioning them via Helm is deferred
  to a follow-up).

  One GrafanaAlertRuleGroup per `groups[]` entry: the bitnami
  operator's GrafanaAlertRuleGroup CR takes spec.rules (not nested
  groups), so the file's `groups[].rules[]` is split per group.
*/}}
{{- $dashboardsGeneral := list
  "application-metrics.json"
  "rag-pipeline-trace-waterfall.json"
  "service-health.json"
  "service-logs.json"
  "trace-explorer.json" -}}
{{- $dashboardsObservability := list
  "observability-stack-health.json"
  "victorialogs-single-node.json"
  "victoriametrics-single-node.json"
  "victoriatraces-single-node.json" -}}
---
# Folders. General holds the application-facing dashboards.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: genieai-general
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "observability") | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  title: General
  allowCrossNamespaceImport: true
---
# Observability folder mirrors `dashboards/observability/`.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: genieai-observability
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "observability") | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  title: Observability
  allowCrossNamespaceImport: true
---
{{- range $dashboardsGeneral }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  # Strip `.json` so the metadata.name stays DNS-label-compatible
  # (operator's name = UID by default; the original filename's `.`
  # would fail the 253-char label rule).
  name: {{ trimSuffix ".json" . | replace "/" "-" }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" $.Chart "Release" $.Release "Values" $.Values "component" "observability") | nindent 4 }}
    app.kubernetes.io/component: dashboards
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  folderRef: genieai-general
  allowCrossNamespaceImport: true
  resyncInterval: 30s
  json: |-
{{ $.Files.Get (printf "files/observability/dashboards/%s" . ) | indent 4 }}
{{- end }}
{{- range $dashboardsObservability }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ trimSuffix ".json" . | replace "/" "-" }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" $.Chart "Release" $.Release "Values" $.Values "component" "observability") | nindent 4 }}
    app.kubernetes.io/component: dashboards
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  folderRef: genieai-observability
  allowCrossNamespaceImport: true
  resyncInterval: 30s
  json: |-
{{ $.Files.Get (printf "files/observability/dashboards/observability/%s" .) | indent 4 }}
{{- end }}
{{- $alertFile := $.Files.Get "files/observability/alerting/alert-rules.yml" }}
{{- range $group := ($alertFile | fromYaml).groups }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: {{ $group.name | replace "." "-" }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" $.Chart "Release" $.Release "Values" $.Values "component" "observability") | nindent 4 }}
    app.kubernetes.io/component: alerts
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/component: grafana
  folderRef: genieai-observability
  allowCrossNamespaceImport: true
  interval: {{ $group.interval }}
  rules:
{{ toYaml $group.rules | indent 4 }}
{{- end }}
{{- end }}
