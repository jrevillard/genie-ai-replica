server {
    listen 80;
    listen [::]:80;
    server_name _;

    # include the security headers
    include conf.d/security-headers.conf;

    # Block hidden files access
    location ~ /\. {
      deny all;
      return 404;
    }

    # Prevent access to sensitive paths
    location = /BitKeeper {
        deny all;
        return 404;
    }

    # Handle robots.txt to prevent 404s
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\nDisallow: /uploads/";
    }

    # Handle sitemap.xml to prevent 404s
    location = /sitemap.xml {
        add_header Content-Type application/xml;
        return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n</urlset>";
    }

    # Frontend Vue.js application 
    location / {
        # Try direct connection with original host header
        proxy_pass http://e2e-109-51:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Critical: Set the exact Host header the Vue.js dev server expects
        # Try with the target's exact hostname and port
        proxy_set_header Host e2e-109-51:8090;
        
        # Don't buffer so we get errors right away
        proxy_buffering off;

        # Updated CSP for frontend - removed unsafe directives
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' cdn.jsdelivr.net; connect-src 'self' https://e2e-82-109.ssdcloudindia.net; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    }

    # Backend API through Kong
    location /api/ {
        if ($request_method = 'OPTIONS') {
          add_header 'Access-Control-Allow-Origin' 'https://e2e-82-109.ssdcloudindia.net';
          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
          add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
          add_header 'Access-Control-Allow-Credentials' 'true';
          add_header 'Access-Control-Max-Age' 86400;
          return 204;
        }
        proxy_pass http://kong:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Updated CSP for backend API
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'" always;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
