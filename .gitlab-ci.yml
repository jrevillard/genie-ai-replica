# Diagnostic bench (throwaway branch): isolate WHY a CI job's trace upload is
# refused with 403. No image builds, no lint/test stages: only the probes.
stages: [probe]

.probe:
  image: alpine:3.22
  tags: [docker]
  allow_failure: true
  timeout: 15m
  variables:
    GIT_DEPTH: "0"

# P1: silence — 240 s with no output at all
probe:silent:
  extends: .probe
  stage: probe
  script:
    - echo "P1 silent start $(date -u +%T)"
    - sleep 240
    - echo "P1 silent end $(date -u +%T)"

# P2: a line every 10 s for 240 s
probe:chatty:
  extends: .probe
  stage: probe
  script:
    - |
      for i in $(seq 1 24); do echo "P2 chatty $i $(date -u +%T)"; sleep 10; done

# P3: one burst of ~300 KB, then silence (the git-clean / buildx pattern)
probe:burst:
  extends: .probe
  stage: probe
  script:
    - echo "P3 burst start $(date -u +%T)"
    - seq 1 20000
    - echo "P3 burst done $(date -u +%T)"
    - sleep 180
    - echo "P3 burst end $(date -u +%T)"

# P4: the burst, then a line every 10 s (does output afterwards save it?)
probe:burst-chatty:
  extends: .probe
  stage: probe
  script:
    - echo "P4 burst start $(date -u +%T)"
    - seq 1 20000
    - echo "P4 burst done $(date -u +%T)"
    - |
      for i in $(seq 1 18); do echo "P4 tick $i $(date -u +%T)"; sleep 10; done

# P5: a much larger burst (~3 MB) — the 1 MB chunk limit / trace size limit
probe:huge:
  extends: .probe
  stage: probe
  script:
    - echo "P5 huge start $(date -u +%T)"
    - seq 1 200000
    - echo "P5 huge done $(date -u +%T)"
    - sleep 120
    - echo "P5 huge end $(date -u +%T)"

# P6: the runner's own request, reproduced from inside a job: PATCH the
# trace endpoint with a valid job token at growing body sizes, and print
# the RESPONSE HEADERS (no token is ever printed). This tells us who
# answers 403: GitLab (x-gitlab-meta / x-request-id), the edge (cf-ray),
# or something else (neither).
probe:patch-size:
  extends: .probe
  stage: probe
  script:
    - |
      offset=0
      for size in 1000 64000 150000 300000 1000000; do
        head -c "$size" /dev/zero | tr '\0' 'a' > /tmp/payload
        code=$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' \
          -X PATCH "$CI_API_V4_URL/jobs/$CI_JOB_ID/trace" \
          -H "JOB-TOKEN: $CI_JOB_TOKEN" \
          -H "Content-Range: ${offset}-$((offset + size - 1))" \
          -H "Content-Type: text/plain" \
          --data-binary @/tmp/payload)
        echo "size=$size code=$code"
        grep -iE '^(x-request-id|x-gitlab-meta|cf-ray|job-status|range|x-gitlab-trace-update-interval|server)' /tmp/h | sed 's/^/    /' || true
        newoff=$(grep -i '^range:' /tmp/h | sed -E 's/.*-([0-9]+).*/\1/')
        [ -n "$newoff" ] && offset=$newoff
        sleep 3
      done
