<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 920" role="img" aria-label="Belarus rushnik corner ornament">
  <defs>
    <g id="bc-diamond">
      <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" fill="#4a6fd8"/>
      <rect x="-6.5" y="-6.5" width="13" height="13" transform="rotate(45)" fill="#ffffff"/>
      <rect x="-3.5" y="-3.5" width="7" height="7" transform="rotate(45)" fill="#d3455b"/>
    </g>
    <g id="bc-hook">
      <path d="M0 0 Q 22 -26 44 0 Q 22 -10 0 0 Z" fill="#9db8f0"/>
    </g>
  </defs>
  <g opacity="0.95">
