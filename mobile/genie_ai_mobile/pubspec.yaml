name: genie_ai_mobile
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core networking & utilities
  http: ^1.6.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  connectivity_plus: ^7.0.0 # Added for Online/Offline features

  # Markdown rendering for chatbot messages
  flutter_markdown: ^0.7.7

  # PDF generation and printing/export
  pdf: ^3.11.1
  printing: ^5.13.1

  # File system access for saving PDF
  path_provider: ^2.1.4

  # URL launching for opening documents in right sidebar
  url_launcher: ^6.3.1

  cached_network_image: ^3.3.1

  flutter_svg: ^2.1.0
  # Profile icon upload from gallery/camera
  image_picker: ^1.1.2     

  # Document uploads (birth cert, ID, etc.)
  file_picker: ^10.3.10      

  # Country picker 
  country_picker: ^2.0.26

  # App Package Info (Version, Build Number)
  package_info_plus: ^9.0.0

  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    - assets/images/
    - assets/images/genie-ai-icon-light.svg
    - assets/config/
    - assets/config/genie-ai-config.json
    - assets/config/quickhelp/
    - assets/FAQ.md
    - assets/icons/
    #- assets/i18n/en.json
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf

flutter_launcher_icons:
  android: "ic_launcher" # This generates the Android icons
  ios: true              # This generates the iOS icons
  image_path: "assets/images/genie_ai_icon.png" # YOUR custom icon path
  min_sdk_android: 21