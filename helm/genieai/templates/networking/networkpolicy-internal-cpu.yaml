{{/*
Internal CPU-to-CPU NetworkPolicy: allows communication between CPU services
that need to talk to each other.

Communication paths:
- nginx → kong (8010)
- kong → backend (3000), document-repository (3001)
- backend → arango-vector-db (8529), redis-cache (6379), keycloak (8080)
- document-repository → arango-vector-db (8529), redis-cache (6379)
- keycloak → keycloak-db (5432)
- kong → kong-database (5432)
- chatqna-xeon-backend-server → embedding (6000), reranker (6100), retriever-arango-service (7025), textgen (9000)
- retriever-arango-service → arango-vector-db (8529)
- embedding → tei (handled in cpu-to-gpu)
- guardrail → vllm (handled in cpu-to-gpu)
*/}}

# --- Egress: nginx → kong ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-to-kong-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: 8010
---
# --- Egress: kong → backend, document-repository ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kong-to-services-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: document-repository
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong-database
      ports:
        - protocol: TCP
          port: 5432
---
