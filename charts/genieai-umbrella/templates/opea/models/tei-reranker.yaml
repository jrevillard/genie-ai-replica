{{/*
  TEI reranker server. Renders only when both opea.enabled is true and
  opea.gpu.mode is "in-cluster" — the external mode (the laptop default)
  keeps the chart pointing the orchestrators at a remote GPU node and
  emits no model pods at all.

  Compose parity: docker-compose.yaml gpu-models profile, service
  `tei_reranker` (lines ~1067-1115). The image, entrypoint (shell
  wrapping text-embeddings-router), env, volumes and healthcheck mirror
  the compose service verbatim. The reranker model id is exposed through
  .Values.opea.models.reranker.modelId (default BAAI/bge-reranker-v2-m3,
  matching compose).

  Image is pulled from ghcr.io unconditionally — same rationale as
  templates/opea/models/tei.yaml and the kcc/ArangoDB exception in
  templates/data/keycloak-convergence-job.yaml.

  Model-cache volume is emptyDir — see templates/opea/models/vllm.yaml
  for the broader rationale on PVC-as-operator-concern.
*/}}
{{- if and .Values.opea.enabled (eq .Values.opea.gpu.mode "in-cluster") -}}
{{- $ns := .Values.namespace -}}
{{- $modelId := .Values.opea.models.reranker.modelId -}}
{{- $res := .Values.opea.models.resources | default (dict "requests" (dict "nvidia.com/gpu" 1) "limits" (dict "nvidia.com/gpu" 1)) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-reranker
  namespace: {{ $ns }}
  labels:
    app: tei-reranker
    app.kubernetes.io/name: tei-reranker
    app.kubernetes.io/component: tei-reranker
    app.kubernetes.io/part-of: genieai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei-reranker
  template:
    metadata:
      labels:
        app: tei-reranker
    spec:
      nodeSelector:
        gpu: "true"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tei-reranker
          image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              text-embeddings-router
              --json-output
              --model-id {{ $modelId }}
              --max-batch-tokens 8192
              --max-concurrent-requests 32
              --auto-truncate false
          ports:
            - name: http
              containerPort: 80
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: HF_TOKEN
            - name: RUST_BACKTRACE
              value: ""
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          resources:
            {{- toYaml $res | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hf-cache
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health
              port: 80
            failureThreshold: 48
            periodSeconds: 6
      volumes:
        {{- if .Values.opea.models.cache.enabled }}
        # Shared model-weights cache (see templates/opea/models/model-cache-pvc.yaml).
        # ReadWriteOnce on the single gpu=true node; all four model pods
        # share the claim.
        - name: hf-cache
          persistentVolumeClaim:
            claimName: genieai-model-cache
        {{- else }}
        - name: hf-cache
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: tei-reranker
  namespace: {{ $ns }}
  labels:
    app: tei-reranker
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: tei-reranker
{{- end -}}
