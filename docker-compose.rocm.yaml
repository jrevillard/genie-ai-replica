# ROCm overlay for the GPU service tier (docker-compose.yaml, single-server).
#
# Layer it ON TOP of the base files — base files are never edited:
#   docker compose --env-file env.strixhalo \
#     -f docker-compose.yaml -f docker-compose.rocm.yaml \
#     --profile opea --profile gpu-models up -d
#
# `-f` order matters: this file must come last. Only the keys a ROCm host
# needs change: the image pins (env.strixhalo), GPU device access for the
# two vLLM instances, and neutralization of the NVIDIA env var — compose
# merges `environment:` BY KEY, so omitting NVIDIA_VISIBLE_DEVICES would
# NOT remove it from the base definition; it is set to `void` instead,
# which ROCm containers ignore and which claims no GPU even on an NVIDIA
# host. Everything else (command flags, healthchecks, networks, profiles,
# swarm placement) merges from the base files.
#
# The TEI services run the CPU image (the ROCm TEI build fails on gfx1151;
# see the spike results) and therefore need NO device access.
#
# THE RULE THIS FILE FOLLOWS: restate a key only when the VENDOR changes
# it. Two merge facts drive that:
#   - `environment:` merges BY KEY, so restating a key with the same
#     value is duplication, not override (the base's
#     HUGGING_FACE_HUB_TOKEN / RUST_BACKTRACE / TEI_*_AUTO_TRUNCATE
#     already carry exactly these values);
#   - `entrypoint` and `command` are SEPARATE keys, so the ROCm image's
#     missing serving entrypoint (`ENTRYPOINT=null, CMD=/bin/bash`) is
#     fixed by restating the ENTRYPOINT alone — the base file's flag
#     block then merges in unchanged and stays the single source of
#     truth for the flags (no drift between the two files).
#
# Later vendor paths (e.g. Apple Metal) follow this same shape: one
# overlay file + one sizing env file, base untouched. The rationale —
# including what a parameter cannot express — is in
# site/content/en/docs/deploy/gpu.md § "Why one overlay file per vendor"
# and docs/superpowers/specs/2026-11-11-rocm-gpu-tier-design.md §
# "Why the overlay file set is the cleanest shape".
#
# WHAT A PARAMETER CAN AND CANNOT EXPRESS (measured, MR !968 review —
# the earlier wording here overclaimed; the probes below replace it):
#
#   - `devices:` — the earlier note said it "cannot be interpolated at
#     all". MEASURED: interpolating the two scalar PATHS INSIDE the list
#     parses fine (`devices: ["${KFD_DEV:-/dev/null}:${KFD_DEV:-/dev/null}"]`
#     → compose renders it as a device entry); the error people hit
#     ("services.x.devices must be a array") is about interpolating the
#     LIST as a whole, which is a different thing. And on this Docker
#     version a device path that does not exist on the host is TOLERATED —
#     the container starts (probe: `PROBE_DEV=/dev/kfd docker compose up`
#     → "Container probe-probe-1 Started"). So the vendor axis CAN be
#     expressed as values in the base file.
#
#   - It is still not done there, for two reasons that are about SAFETY,
#     not capability: (1) the base file is the NVIDIA deployment — putting
#     `devices: [/dev/null:/dev/null]` and a parameterized image row on its
#     vLLM service changes the NVIDIA render (new keys on the production
#     service) for a deployment that never asks for a GPU device; (2) the
#     vendor-only services (vllm-reranker, vllm-embedding) would have to
#     live in the base file under a vendor-specific `profiles:` key, which
#     is the file-count reduction this MR was asked to make — but it moves
#     ROCm-only services into the file the NVIDIA deployment renders.
#     The bind-mount alternative (`volumes: - /dev/kfd:/dev/kfd`) is worse:
#     compose merges volumes by key (so it composes), but a bind mount of
#     a path that does not exist CREATES a root-owned directory on the host
#     — inside /dev.
#
#   - `ports:` — the base file's rows are now BOTH parameterized
#     ("${GPU_HTTPS_PORT:-443}:443" and "${GPU_HTTP_PORT:-80}:80"), so an
#     overlay that restates them interpolates to the SAME entries and
#     compose's union collapses them. That removed the `ports: !override`
#     this path used to need — and with it the Compose >= 2.24.4 floor the
#     merge tag imposed on a repo that documents 2.20+ (MR !968 review).
#
# The file count is driven by the BASE files, not by the vendor: main
# already ships two (the app stack, docker-compose.yaml, and the GPU-node
# stack, docker-compose.gpu.yaml), and each ROCm overlay sits on one of
# them. One vendor overlay per base is what that means.

services:
  vllm:
    image: ${VLLM_ROCM_IMAGE}
    # The ROCm image has NO serving entrypoint (its CMD is /bin/bash), while
    # the NVIDIA image's entrypoint is `vllm serve` — so the base file's
    # `command: > --model ...` (flags only) has nothing to attach to.
    # `entrypoint` and `command` are SEPARATE compose keys, so restating
    # only the entrypoint lets the base file's flag block merge in
    # unchanged: one source of truth for the flags (no drift), and the
    # overlay carries nothing but what the vendor actually changes.
    entrypoint: ["vllm", "serve"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=void
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-990}" # render — GID is distro-specific; measure with `getent group render`
      - "${VIDEO_GID:-44}"   # video

  vllm-translation-guardrail:
    image: ${VLLM_ROCM_IMAGE}
    # Same entrypoint-only restatement as `vllm` above — the base file's
    # flag block (including its --port and the chat-template format)
    # merges in unchanged.
    entrypoint: ["vllm", "serve"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=void
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-990}" # render
      - "${VIDEO_GID:-44}"   # video

  tei:
    image: ${TEI_ROCM_EMBEDDING_IMAGE}
    # Only what the vendor changes: the image pin and the NVIDIA var
    # neutralization. The base's HUGGING_FACE_HUB_TOKEN / RUST_BACKTRACE /
    # TEI_EMBEDDING_AUTO_TRUNCATE merge in unchanged (environment merges
    # BY KEY, so restating them here would be duplication, not override).
    environment:
      - NVIDIA_VISIBLE_DEVICES=void

  tei_reranker:
    image: ${TEI_ROCM_RERANKING_IMAGE}
    environment:
      - NVIDIA_VISIBLE_DEVICES=void

  # Task 14 — GPU reranker: the TEI ROCm image cannot run on gfx1151
  # (Instinct-only kernels; see the spike results), so this third vLLM
  # instance serves the same cross-encoder on the GPU. The `reranker`
  # wrapper selects it with RERANKER_BACKEND=vllm below; TEI stays the
  # default backend on every other deployment (this file is the only place
  # the switch flips). vLLM's rerank API is the Cohere shape
  # (POST /v1/rerank {model, query, documents} → results[].relevance_score);
  # the wrapper normalizes it to its internal {index, score} contract.
  # GPU embedder (ROCm venue): the same spike-proven mechanism as the
  # GPU reranker — the TEI ROCm image cannot run on gfx1151, and the CPU
  # TEI embedder saturates ~24 cores under concurrent ingest. vLLM serves
  # bge-large-en-v1.5 as a pooling model (--task embed) and answers the
  # OpenAI shape (POST /v1/embeddings {model, input} → data[].embedding).
  # The `embedding` wrapper selects it with EMBEDDING_BACKEND=vllm; TEI
  # stays the default backend on every other deployment.
  vllm-embedding:
    image: ${VLLM_ROCM_IMAGE}
    profiles: [gpu-models]
    # A NEW service in an overlay does NOT inherit the base service's
    # restart policy either — without this, an OOM kill (exit 137, live:
    # 2026-11-18 GTT pressure during a heavy drain) leaves the container
    # dead until a human notices (code review finding follow-up).
    restart: unless-stopped
    # Overlay-ONLY service (no base counterpart to inherit from), so the
    # entrypoint is restated here — in the SAME shape as the base file:
    # entrypoint carries the binary, `command` carries only the flags.
    entrypoint: ["vllm", "serve"]
    command: >
      --model ${VLLM_EMBEDDING_MODEL_ID:-BAAI/bge-large-en-v1.5}
      --gpu_memory_utilization ${VLLM_EMBEDDING_GPU_UTILIZATION:-0.05}
      --served-model-name ${VLLM_EMBEDDING_MODEL_ID:-BAAI/bge-large-en-v1.5}
      --max_model_len ${VLLM_EMBEDDING_MAX_MODEL_LEN:-512}
      --enforce-eager
      --port 8000
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=void
    # Base-file discipline (kics scan wave, 2026-11-19): the base `vllm`
    # runs cap_drop: ALL + no-new-privileges and a curl /health probe; this
    # is an OVERLAY-ONLY service (no base counterpart to merge from), so it
    # restates them here. The ROCm image ships curl (the merged base
    # healthcheck already passes on the venue's two vLLM instances).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-990}" # render — GID is distro-specific; measure with `getent group render`
      - "${VIDEO_GID:-44}"   # video
    volumes:
      # Same cache as the base vLLM services — without it every recreate
      # re-downloads the model from HF.
      - hf_cache:/root/.cache/huggingface
    networks:
      - genieai_network

  vllm-reranker:
    image: ${VLLM_ROCM_IMAGE}
    # Same restart gap as vllm-embedding: a NEW overlay service does not
    # inherit the base restart policy — live OOM kill (exit 137, 2026-11-18
    # GTT pressure) stayed dead for an hour. unless-stopped self-heals.
    restart: unless-stopped
    # Same profile gate as the other vLLM instances (base `vllm` uses
    # [gpu-models]) — a new service in an overlay does NOT inherit the
    # base service's profiles.
    profiles: [gpu-models]
    # Same explicit-command pattern as the two vLLM instances above: the
    # ROCm image has no serving entrypoint.
    # Same shape as the base file: entrypoint carries the binary, `command`
    # only the flags (overlay-only service — no base counterpart to
    # inherit the entrypoint from).
    entrypoint: ["vllm", "serve"]
    command: >
      --model ${VLLM_RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      --gpu_memory_utilization ${VLLM_RERANKER_GPU_UTILIZATION:-0.05}
      --served-model-name ${VLLM_RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      --max_model_len ${VLLM_RERANKER_MAX_MODEL_LEN:-8192}
      --enforce-eager
      --port 8000
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=void
    # Base-file discipline (kics scan wave, 2026-11-19): same as the
    # vllm-embedding block above — overlay-only service, no base
    # counterpart to merge from, so it restates cap_drop / security_opt /
    # healthcheck. The ROCm image ships curl.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-990}" # render — GID is distro-specific; measure with `getent group render`
      - "${VIDEO_GID:-44}"   # video
    # A NEW service in an overlay does NOT inherit the base service's
    # networks — without this it lands on compose's default network, where
    # the `reranker` wrapper (genieai_network) cannot resolve its name.
    volumes:
      # Same cache as the base vLLM services — without it every recreate
      # re-downloads the ~1.2 GB cross-encoder from HF.
      - hf_cache:/root/.cache/huggingface
    networks:
      - genieai_network

  # Split-URL auth knobs (the JWKS/firewall blocker fix): the backend's
  # token verification fetches discovery + JWKS IN-NETWORK (keycloak:8080,
  # plain HTTP inside the compose network), while KEYCLOAK_URL stays the
  # browser-facing https://localhost/auth for CSP/admin-proxy. The accepted
  # issuer comes FROM the discovery document; tokens minted through the
  # browser edge carry the 8443 issuer, which KEYCLOAK_PUBLIC_URL adds to
  # the trusted allow-list. DISCOVERY override is the fetch-host BASE (the
  # auth service appends /realms/<realm>/.well-known itself); JWKS is the
  # full certificates URL. NVIDIA venue: this overlay is not loaded —
  # behavior unchanged there.
  backend:
    environment:
      - KEYCLOAK_DISCOVERY_URL=${KEYCLOAK_DISCOVERY_URL:-http://keycloak:8080}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-genie}/protocol/openid-connect/certs}
      # Keycloak reflects the request Host into the token iss, so tokens
      # minted through the browser edge carry iss https://<domain>:<port>/auth
      # while the in-network discovery (keycloak:8080 view) names the 8080
      # issuer. The PUBLIC_URL alias adds the browser issuer to the trusted
      # allow-list without moving the JWKS fetch out of the network.
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-https://${NGINX_PUBLIC_DOMAIN}:${NGINX_HTTPS_PORT:-443}/auth}

  # Same split-URL trio as the backend: okf-server verifies the same
  # dataprep-service-client tokens the ingest path mints, and its base
  # definition derives KEYCLOAK_URL from the public edge (self-signed on
  # this venue), which breaks both the discovery fetch (TLS) and the
  # issuer match (8080 view vs 8443 tokens). NVIDIA venue: overlay not
  # loaded — behavior unchanged there.
  okf-server:
    environment:
      - KEYCLOAK_DISCOVERY_URL=${KEYCLOAK_DISCOVERY_URL:-http://keycloak:8080}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-genie}/protocol/openid-connect/certs}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-https://${NGINX_PUBLIC_DOMAIN}:${NGINX_HTTPS_PORT:-443}/auth}
      # NOTE (rules audit F4): NO TLS-skip knobs here — an earlier attempt
      # rendered OPEA_SSL_SKIP_VERIFY/NODE_TLS_REJECT_UNAUTHORIZED for the
      # serve-leg mint; both are dead weight (OPEA_SSL_SKIP_VERIFY patches
      # PYTHON services only and okf-server is Node; NODE_TLS was irrelevant
      # because the public endpoint is UNREACHABLE from containers on this
      # class of host — a routing fact, not a certificate one). The real fix
      # is the deployment-level KEYCLOAK_HOSTNAME pin (base compose): the
      # in-network mint then stamps the PUBLIC issuer and chatqna accepts
      # every token regardless of route.

  # Same split-URL trio as backend/okf-server: document-repository verifies
  # tokens and (on the OKF publish path) authenticates its side of the
  # bundle-store handoff; its base KEYCLOAK_URL points at the public edge,
  # whose self-signed cert times the discovery fetch out on this venue.
  document-repository:
    environment:
      - KEYCLOAK_DISCOVERY_URL=${KEYCLOAK_DISCOVERY_URL:-http://keycloak:8080}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-genie}/protocol/openid-connect/certs}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-https://${NGINX_PUBLIC_DOMAIN}:${NGINX_HTTPS_PORT:-443}/auth}

  # Switch the wrapper to the GPU reranker. environment merges BY KEY: these
  # three keys are additive to the base definition; TEI_RERANKING_ENDPOINT
  # stays (unused by the vllm backend, harmless to keep).
  reranker:
    environment:
      - RERANKER_BACKEND=${RERANKER_BACKEND:-tei}
      - RERANKER_VLLM_ENDPOINT=${RERANKER_VLLM_ENDPOINT:-http://vllm-reranker:8000}
      # Paired name (code review, 2026-11-18): the instance above serves
      # --served-model-name ${VLLM_RERANKER_MODEL_ID:-...}; the client must
      # send the SAME name or vLLM 404s per request. Inherit the pair.
      - RERANKER_VLLM_MODEL=${RERANKER_VLLM_MODEL:-${VLLM_RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}}
      # The window the instance above is started with (--max_model_len).
      # The client enforces the input-length contract against it (vLLM
      # truncates an over-long input instead of refusing it, so the
      # wrapper measures the pair itself — MR !968 review). Same value,
      # same source: client and server agree by construction.
      - RERANKER_VLLM_MAX_MODEL_LEN=${RERANKER_VLLM_MAX_MODEL_LEN:-${VLLM_RERANKER_MAX_MODEL_LEN:-8192}}

  # Same switch for the EMBEDDING path (Task-14 mirror): dataprep embeds the
  # corpus and the retriever embeds the query, and both swap their TEI client
  # for the vLLM pooling instance above when EMBEDDING_BACKEND=vllm. The two
  # consumers MUST move together — a retriever answering vLLM vectors against
  # a dataprep that still writes TEI vectors poisons the corpus (mismatched
  # vector spaces in one collection). environment merges BY KEY: additive to
  # the base definition. TEI stays the default (the ${EMBEDDING_BACKEND:-tei}
  # guard) — env.strixhalo is the only place the switch flips.
  dataprep-arango-service:
    environment:
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-tei}
      - EMBEDDING_VLLM_ENDPOINT=${EMBEDDING_VLLM_ENDPOINT:-http://vllm-embedding:8000}
      # Paired model name (code review N1): the instance above serves
      # ${VLLM_EMBEDDING_MODEL_ID}; the client sends the SAME name.
      - VLLM_EMBEDDING_MODEL_ID=${VLLM_EMBEDDING_MODEL_ID:-}

  retriever-arango-service:
    environment:
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-tei}
      - EMBEDDING_VLLM_ENDPOINT=${EMBEDDING_VLLM_ENDPOINT:-http://vllm-embedding:8000}
      # Paired model name — same rationale as dataprep's row above (N1).
      - VLLM_EMBEDDING_MODEL_ID=${VLLM_EMBEDDING_MODEL_ID:-}

  # The QUERY encoder moves too (MR !968 review, Jerome: "only two embedding
  # consumers move to vLLM — the query encoder stays on the CPU TEI").
  # chatqna's RAG graph encodes the query through its `embedding` node,
  # which the base definition points at the OPEA `embedding` microservice —
  # and THAT service fronts the CPU TEI container. So on this venue the
  # GPU embedder served ingestion only, while every chat query was encoded
  # by the CPU image the sizing file caps at 8 TEI workers.
  #
  # EMBEDDING_VLLM_ENDPOINT is the same base URL the retriever's and
  # dataprep's vLLM branch use: chatqna derives the node's host/port/
  # protocol/endpoint from it (genieai_chatqna.py) and posts the SAME
  # OpenAI-shaped body to {base}/v1/embeddings that the vLLM pooling
  # instance serves. The response shape is identical, so the parse path
  # (align_outputs) is unchanged, and the bge query instruction is applied
  # by chatqna BEFORE the text leaves the service.
  #
  # NVIDIA-inert: the base file never sets this variable, so the NVIDIA
  # path keeps the microservice (TEI) exactly as before.
  chatqna-xeon-backend-server:
    environment:
      - EMBEDDING_VLLM_ENDPOINT=${EMBEDDING_VLLM_ENDPOINT:-http://vllm-embedding:8000}

  # The otel-collector service is deliberately NOT restated here.
  #
  # The base publishes its fluentforward receiver on the HOST
  # (127.0.0.1:24224, mode: host) — that is where the Docker daemon's
  # fluentd log driver delivers every container's stdout. An overlay
  # `ports: !override []` dropped that publish, which left the driver
  # with no endpoint on a dedicated ROCm host: `docker logs` still works
  # (dual logging) but every container's stdout is silently dropped
  # from VictoriaLogs and the admin UI (MR !968 review — the default was
  # wrong for this file's own primary topology).
  #
  # Shared-host note: exactly one collector can hold the host port, so
  # two GENIE stacks on one host cannot both ship container logs. The
  # operator stops the other stack's collector (or accepts that both
  # stacks' stdout flows to whichever collector holds the port) — a
  # deployment decision, not a default this overlay should make.
