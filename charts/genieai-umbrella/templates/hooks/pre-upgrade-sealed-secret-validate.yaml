{{- if and .Values.secrets.sealedSecrets.enabled (or .Values.data.arangodb.enabled (or .Values.data.keycloak.enabled .Values.data.postgres.enabled)) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "genieai-common.fullname" . }}-sealed-secret-validate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "sealed-secret-validate") | nindent 4 }}
  annotations:
    # Pre-upgrade ONLY. A pre-install leg would be vacuous: SealedSecrets
    # are REGULAR resources, applied AFTER every hook — `kubectl get
    # sealedsecret` during pre-install returns an empty list and the
    # hook would exit 0 having checked nothing. Fresh-install sentinel
    # detection instead lives in the chart's helm test, which runs
    # post-install and waits for the K8s Secrets to materialize
    # (sentinel blobs never do — the controller marks the SealedSecret
    # status.conditions[type=Synced].status=False (reason ErrorDecrypt)
    # and CNPG/ArangoDeployment pods hang in `Waiting for secret`; the
    # test's materialization timeout catches it).
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      # `registry.k8s.io/kubectl` is distroless (no /bin/sh, no jq),
      # so this Pod ships kubectl + jq via an init container that downloads
      # the static binaries into the shared `tools` emptyDir. The main
      # container is alpine (sh is built in); kubectl/jq are picked up via
      # the PATH env, which prepends /tools/bin. The `tmp` emptyDir
      # remains because the command below redirects kubectl stderr there
      # and the container runs readOnlyRootFilesystem.
      volumes:
        - name: tools
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      initContainers:
        {{- include "genieai-umbrella.toolsInitContainer" . | nindent 8 }}
      containers:
        - name: validate
          # Drift check via the K8s API. The bitnami sealed-secrets
          # controller signals an undecryptable SealedSecret via
          # `conditions[type=Synced].status="False"` (reason ErrorDecrypt)
          # — NOT via the `sealedsecrets.bitnami.com/invalid` annotation
          # (that annotation does not exist in the upstream controller).
          # Reading the right field is the difference between a real
          # drift check and a decorative hook that always passes.
          image: "{{ .Values.global.imageRegistry | default "docker.io" }}/library/alpine:3.20"
          imagePullPolicy: IfNotPresent
          env:
            - name: PATH
              # Prepend /tools/bin so kubectl + jq (downloaded by the
              # `tools` init container) are discoverable by the script.
              value: /tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tools
              mountPath: /tools
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ns="{{ .Values.namespace }}"
              drift=0
              rbac_err=0
              total=0
              # Scope to THIS release's SealedSecrets: the selector label
              # (app.kubernetes.io/instance) is applied to every resource
              # via genieai-common.labels. An unscoped list would sweep in
              # SealedSecrets owned by other releases in the namespace and
              # fail this upgrade for drift this chart cannot fix.
              # -o name yields `sealedsecret.secret.bitnami.com/<name>` —
              # resource-qualified identifiers. The while-read loop
              # strips the `<resource>/` prefix via the shell parameter
              # expansion `${qualified##*/}`, sidestepping the word-split
              # fragility of `for name in $names` (K8s names disallow
              # spaces today, but a future-fragile iteration would break
              # the first time a name contains a hyphen-dense substring
              # that some shell misbehaves on). The Synced-condition
              # lookup below accepts the full qualified form, so the
              # bare name is used only for the operator-facing log.
              # stderr goes to a file, NOT into the loop input: capturing
              # it with 2>&1 mixes diagnostics into the loop body, and a
              # word-split iteration would treat them as secret names.
              if ! kubectl get sealedsecret -n "$ns" \
                  -l app.kubernetes.io/instance={{ .Release.Name }} \
                  -o name 2>/tmp/ss.err > /tmp/ss.names; then
                echo "FAIL: cannot list SealedSecrets in namespace $ns"
                cat /tmp/ss.err >&2
                exit 1
              fi
              # A failed `kubectl get sealedsecret` list must not degrade
              # into a vacuous PASS — the branch above is the hard gate for
              # that. An empty-but-successful list, by contrast, is handled
              # below as WARN: SealedSecrets are regular resources applied
              # AFTER hooks, so a first-time tier enable finds none yet.
              # The controller signals an undecryptable SealedSecret via
              # conditions[type=Synced].status=False (reason ErrorDecrypt)
              # — the `sealedsecrets.bitnami.com/invalid` annotation does
              # not exist upstream and grepping it matches nothing.
              while IFS= read -r qualified; do
                # `qualified` looks like `sealedsecret.secret.bitnami.com/<name>`;
                # kubectl accepts the qualified form directly (it is a
                # resource/name pair) so the Synced-condition lookup
                # below uses $qualified unchanged. The bare name (the
                # substring after the last `/`) is what the operator-
                # facing log lines print — the resource prefix is
                # noise in a hook whose subject is unambiguously
                # SealedSecret.
                name="${qualified##*/}"
                total=$((total+1))
                # Read the full object once, then parse with jq:
                #  - exit-code non-zero: RBAC denial / API error (the
                #    dep-check SA's Role grant on `sealedsecrets` is
                #    missing or the API is unreachable). Masking the
                #    exit code via `2>/dev/null || true` (a common
                #    kubectl-error-suppression pattern) would let a
                #    misconfigured cluster pass with a vacuous green,
                #    so we count it as `invalid` and abort at the end.
                #  - exit-code 0 + no Synced conditions: controller has
                #    not processed this resource yet (fresh install,
                #    controller restart, slow CRD registration). Healthy
                #    secrets hit this branch transiently — the post-loop
                #    summary treats it as advisory, not drift.
                #  - exit-code 0 + at least one Synced=False: drift.
                #    ANY Synced=False is enough (some operators add
                #    additional conditions; we only care that one of
                #    them is False).
                #  - exit-code 0 + all Synced=True: healthy, silent.
                # `kubectl get -o json` + jq decouples the per-iteration
                # exit code from the per-iteration output. A bare
                # `kubectl get -o jsonpath=...` mixes them: a non-zero
                # exit with a partial path is read as an empty path,
                # which falls into the (advisory) "not processed"
                # branch — the RBAC failure is invisible.
                raw_json=$(kubectl get "$qualified" -n "$ns" \
                  -o json 2>/tmp/ss.err) || {
                  cat /tmp/ss.err >&2
                  echo "FAIL: cannot read SealedSecret $qualified (RBAC/API error); the drift check is unreliable; fix the dep-check SA before continuing"
                  rbac_err=$((rbac_err+1))
                  continue
                }
                # Per-condition classification: one status value per
                # line, in the order the controller wrote them. The
                # earlier `{range ...}{.status}{end}` jsonpath concat is
                # fragile when there are multiple Synced conditions —
                # `TrueTrueFalse` would have read as a single "True"
                # string and missed the drift.
                status_lines=$(printf '%s' "$raw_json" \
                  | jq -r '.status.conditions[]? | select(.type=="Synced") | .status' 2>/dev/null || true)
                has_false=0
                cond_count=0
                if [ -n "$status_lines" ]; then
                  # Iterate the per-line statuses via a here-string
                  # (`<<<` is shell, not YAML — the literal `|` block
                  # above passes it through verbatim to /bin/sh). A
                  # `<<EOF` heredoc inside the YAML literal is fragile
                  # because YAML's `<<` merge-key syntax is
                  # indistinguishable at parse time. `printf` + `read`
                  # sidesteps the issue with no behaviour change.
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    cond_count=$((cond_count+1))
                    case "$line" in
                      False) has_false=1 ;;
                    esac
                  done <<< "$status_lines"
                fi
                if [ "$cond_count" -eq 0 ]; then
                  # No Synced condition: the controller has not
                  # processed this SealedSecret since it was applied.
                  # Advisory only — a slow or just-started controller
                  # hits this on healthy secrets too.
                  echo "WARN: $name has no Synced condition yet (controller has not processed it)"
                elif [ "$has_false" -eq 1 ]; then
                  echo "DRIFT: $name undecryptable (cluster key rotated or sentinel blob; re-encrypt with current public key)"
                  drift=$((drift+1))
                fi
                # cond_count > 0 with all True: healthy, silent.
              done < /tmp/ss.names
              if [ "$total" -eq 0 ]; then
                # Zero matches is not drift: SealedSecrets are regular
                # resources applied AFTER hooks, so an upgrade that ENABLES
                # a data tier for the first time legitimately finds none to
                # validate (they apply with this very upgrade). Only the
                # API-list failure above is a hard FAIL.
                echo "WARN: no SealedSecrets matching app.kubernetes.io/instance={{ .Release.Name }} in namespace $ns yet — nothing to validate"
                exit 0
              fi
              if [ "$drift" -gt 0 ] || [ "$rbac_err" -gt 0 ]; then
                # Split drift vs RBAC summary lines so operators address
                # each failure mode independently. The kubeseal workflow
                # only cures drift; an unreadable SealedSecret is an
                # SA grant gap, not an undecryptable key.
                echo "FAIL: $drift drifted SealedSecret resources (of $total) — kubeseal --fetch-cert + re-encrypt + commit + push + re-upgrade required"
                echo "FAIL: $rbac_err SealedSecret resources unreadable (RBAC/API failure; the dep-check SA likely lost the bitnami.com/sealedsecrets get grant — restore before re-running)"
                exit 1
              fi
              echo "PASS: no drift detected across $total SealedSecret resources"
{{- end -}}
