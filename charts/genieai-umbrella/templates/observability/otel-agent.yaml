{{- if .Values.observability.logs.enabled }}
{{- /*
  OTel Collector filelog agent — DaemonSet mode. One pod per node,
  tails kubelet's pod-log path under /var/log/pods (one symlinked log
  file per container, targets owned by the container runtime), strips
  the runtime envelope (docker-json or CRI), runs the
  log transform pipeline (PII redaction, envelope trace lift, severity
  stamp, body normalisation, Python prefix strip), and forwards to the
  gateway via OTLP.

  Pod/namespace/label enrichment comes from the k8sattributes
  processor (kubelet API), not from log-line re-parsing — the
  service.name stamp reads the container name the file path and the
  processor provide.

  PII redaction: pii_redact statements ported VERBATIM from
  configs/otel/otel-collector-config.yaml. The double-escape trap
  (\\s, \\. inside YAML single-quoted scalars) is preserved as-is —
  the test/otel-collector/run-pii-smoke.sh harness validates the
  ported copy before this chart ships. The in-process
  PIIRedactionProcessor (backend + document-repository tracing.js)
  remains the structured-log coverage; this collector regex is the
  cross-cutting string-value defence.

  Tolerations: standard node-toleration set so the agent runs on
  control-plane nodes too (single-node minikube has no separate
  control plane, but multi-node clusters need it).

  runAsUser 0: host log files at the containerd pod-log path are owned
  by root (containerd default). Non-root UIDs see EACCES on the
  open() call; the operator's default non-root securityContext is
  overridden here to keep the filelog tail functional.
*/}}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: genieai-agent
  namespace: {{ .Values.namespace }}-obs
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "observability") | nindent 4 }}
spec:
  mode: daemonset
  tolerations:
    - operator: Exists
  # config as a map (otel-operator v1beta1 rejects string configs)
  config:
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: end
        include_file_path: true
        operators:
          # kubelet's /var/log/pods/<...>/N.log is a symlink to the
          # runtime's real file: docker (minikube, *-json.log, JSON
          # envelope) or containerd (CRI "<time> <stream> <F|P> <log>"
          # envelope). Unwrap either envelope via a sequential fallback
          # chain — no router: the CRI regex is anchored on a leading
          # RFC3339 timestamp (docker-JSON lines start with '{' and can
          # never match it), and json_parser then catches the docker
          # lines. on_error (send) keeps every entry flowing with body
          # intact, so plain lines pass through untouched.
          - type: regex_parser
            id: parse-cri
            regex: '^(?P<time>[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[FP]) (?P<log>.*)$'
            parse_from: body
            parse_to: attributes
            on_error: send
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          - type: json_parser
            id: parse-docker
            parse_from: body
            parse_to: attributes
            on_error: send
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          - type: move
            id: move-log
            from: attributes.log
            to: body
          # Downstream transforms inspect the raw app line (JSON winston
          # lines, Python prefixes), so the un-wrapped log becomes body.
          # Pod identity comes from the kubelet-controlled file path
          # (/var/log/pods/<ns>_<pod>_<uid>/<container>/N.log) — no API
          # call, no ambiguity. k8sattributes then associates by these
          # resource attributes to add pod labels and node name.
          - type: regex_parser
            id: parse-metadata
            regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(?P<container>[^/]+)/[^/]+[.]log$'
            parse_from: attributes["log.file.path"]
            parse_to: attributes
          - type: move
            from: attributes.pod
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.container
            to: resource["k8s.container.name"]
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        # Watch only the stack's namespace — the processor's RBAC needs
        # are then namespaced (Role), not cluster-scoped.
        filter:
          namespace: {{ .Values.namespace }}
        # Associate entries by the pod identity parsed from the log
        # file path (set as resource attributes by the filelog
        # operators above).
        pod_association:
          # Sources within one entry are ANDed: pod name + namespace.
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.ip
            - k8s.node.name
          labels:
            - key: app.kubernetes.io/component
            - key: app.kubernetes.io/name
            - key: app.kubernetes.io/instance
            - key: app.kubernetes.io/part-of
      transform/pii_redact:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - 'replace_pattern(body, "(?i)\"((?:password|api[_-]?key|apikey|session[_-]?id|user[_-]?id|email|mail|auth[_-]?token|bearer[_-]?token|authorization|token|secret|api[_-]?secret|credential(?:_id|s|)|openai[_-]?api[_-]?key|anthropic[_-]?api[_-]?key|private[_-]?key|secret[_-]?value|user[_-]?query|llm[_-]?response|document[_-]?text))\"\\s*[:=]\\s*\"[^\"]*\"", "\"$1\":\"[REDACTED]\"") where IsString(body)'
              - 'replace_pattern(body, "(?i)bearer\\s+[a-z0-9\\-_]{20,}", "bearer [REDACTED_BEARER]") where IsString(body)'
              - 'replace_pattern(body, "sk-[a-z0-9]{20,}", "[REDACTED_APIKEY]") where IsString(body)'
              - 'replace_pattern(body, "eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+", "[REDACTED_JWT]") where IsString(body)'
          - context: log
            statements:
              - 'replace_all_patterns(attributes, "value", "(?i)(?<p>(?:^|[^A-Za-z0-9]))(?<t>eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+|sk-[A-Za-z0-9]{16,}|pk-[A-Za-z0-9]{16,}|gho_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{16,}|xox[abprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}|[A-Za-z0-9_=-]{40,})(?<s>(?:$|[^A-Za-z0-9]))", "${p}[REDACTED]${s}") where IsMap(attributes)'
      transform/extract_envelope_trace_context:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - 'set(trace_id, ExtractPatterns(body, "trace_id[\": ]+(?P<tid>[0-9a-f]{32})")["tid"]) where IsString(body) and IsMatch(body, "trace_id[\": ]+[0-9a-f]{32}")'
              - 'set(span_id, ExtractPatterns(body, "span_id[\": ]+(?P<sid>[0-9a-f]{16})")["sid"]) where IsString(body) and IsMatch(body, "span_id[\": ]+[0-9a-f]{16}")'
      transform/stamp_service_name_from_container:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              # k8sattributes enriches RESOURCE attributes; derive
              # service.name from the container name only when unset.
              - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil and resource.attributes["k8s.container.name"] != "" and (resource.attributes["service.name"] == nil or resource.attributes["service.name"] == "")
      transform/stamp_log_metadata_from_msg:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - 'set(severity_text, ToUpperCase(ParseJSON(body)["level"])) where IsString(body) and Substring(body, 0, 1) == "{"'
              - 'set(severity_text, ToUpperCase(ExtractPatterns(body, "(?i)^(?P<sev>info|warn|warning|error|debug|fatal|trace)[: ]")["sev"])) where IsString(body) and IsMatch(body, "(?i)^(info|warn|warning|error|debug|fatal|trace)[: ]")'
              - 'set(severity_text, ToUpperCase(body["level"])) where IsMap(body) and IsString(body["level"])'
              - 'set(body, ParseJSON(body)["message"]) where IsString(body) and Substring(body, 0, 1) == "{" and IsString(ParseJSON(body)["message"])'
              - 'set(body, body["message"]) where IsMap(body) and IsString(body["message"])'
              - 'set(severity_number, 9) where severity_text == "INFO"'
              - 'set(severity_number, 13) where severity_text == "WARN"'
              - 'set(severity_number, 13) where severity_text == "WARNING"'
              - 'set(severity_number, 17) where severity_text == "ERROR"'
              - 'set(severity_number, 5) where severity_text == "DEBUG"'
              - 'set(severity_number, 21) where severity_text == "FATAL"'
              - 'set(severity_number, 1) where severity_text == "TRACE"'
      transform/normalize_log_body:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - 'set(severity_text, "INFO") where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
              - 'set(severity_number, 9) where severity_text == "INFO" and severity_number == 0'
              - 'set(attributes["http.method"], ExtractPatterns(body, "^HTTP_REQUEST: (?P<m>[A-Z]+) ")["m"]) where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
              - 'set(attributes["http.path"], ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ (?P<p>[^ ?]+)")["p"]) where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
              - 'set(attributes["http.status_code"], ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? (?P<s>[0-9]+) ")["s"]) where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
              - 'set(attributes["http.response_time_ms"], ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? [0-9]+ (?P<ms>[0-9.]+) ms")["ms"]) where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
              - 'set(attributes["http.user_agent"], ExtractPatterns(body, "Headers:[ ](?:-|[^ ]+)[ ](?P<ua>.+)$")["ua"]) where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
              - 'set(body, Concat([ExtractPatterns(body, "^HTTP_REQUEST: (?P<m>[A-Z]+) ")["m"], " ", ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ (?P<p>[^ ?]+)")["p"], " ", ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? (?P<s>[0-9]+) ")["s"], " ", ExtractPatterns(body, "^HTTP_REQUEST: [A-Z]+ [^ ]+( [?] [^ ]*)? [0-9]+ (?P<ms>[0-9.]+) ms")["ms"], " ms"], "")) where IsString(body) and Substring(body, 0, 13) == "HTTP_REQUEST:"'
              - 'set(attributes["http.client_ip"], ExtractPatterns(body, "(?P<ip>[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+):[0-9]+")["ip"]) where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
              - 'set(attributes["http.method"], ExtractPatterns(body, "\" (?P<m>[A-Z]+) (?P<p>[^ ?\"]+)")["m"]) where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
              - 'set(attributes["http.path"], ExtractPatterns(body, "\" (?P<m>[A-Z]+) (?P<p>[^ ?\"]+)")["p"]) where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
              - 'set(attributes["http.status_code"], ExtractPatterns(body, "\" (?P<s>[0-9]{3}) ")["s"]) where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
              - 'set(body, Concat([ExtractPatterns(body, "\" (?P<m>[A-Z]+) ")["m"], " ", ExtractPatterns(body, "\" (?P<m>[A-Z]+) (?P<p>[^ ?\"]+)")["p"], " ", ExtractPatterns(body, "\" (?P<s>[0-9]{3}) ")["s"]], "")) where IsString(body) and Substring(body, 0, 5) == "INFO:" and IsMatch(body, "^[A-Z]+:[ ]+[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+:")'
              - 'set(body, ExtractPatterns(body, "^\\[[^]]+\\][ ](?P<m>.+)$")["m"]) where IsString(body) and IsMatch(body, "^\\[[0-9]{4}-[0-9]{2}-[0-9]{2}[ ][0-9]{2}:[0-9]{2}:[0-9]{2}\\][ ]")'
      transform/strip_python_log_prefix:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - 'set(body, ExtractPatterns(body, "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)[: ]+(?P<m>.*)$")["m"]) where IsString(body) and IsMatch(body, "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)[: ]+")'
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      # otlphttp speaks OTLP/HTTP+protobuf — the gateway's 4318 port.
      # (The `otlp` exporter is gRPC-only on 4317; both work, this
      # matches the gateway's own downstream exporter type.)
      otlphttp/gateway:
        endpoint: http://{{ .Values.observability.collectorCRName }}-collector.{{ .Values.namespace }}.svc.cluster.local:4318
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          receivers: [filelog]
          processors:
            - k8sattributes
            - transform/pii_redact
            - transform/extract_envelope_trace_context
            - transform/stamp_service_name_from_container
            - transform/stamp_log_metadata_from_msg
            - transform/normalize_log_body
            - transform/strip_python_log_prefix
            - memory_limiter
            - batch
          exporters: [otlphttp/gateway]
  volumes:
    - name: pods-log
      hostPath:
        path: /var/log/pods
        type: ""
    # Runtime-backed symlink targets: kubelet's pod-log files point
    # into the container runtime's storage, so both runtimes' roots
    # must be visible or every open() fails with ENOENT.
    - name: docker-containers
      hostPath:
        path: /var/lib/docker/containers
        type: ""
    - name: containerd-root
      hostPath:
        path: /var/lib/containerd
        type: ""
  # The operator wires spec.volumes into the DaemonSet pod only when a
  # matching volumeMount exists — without this the filelog glob watches
  # an empty directory.
  volumeMounts:
    - name: pods-log
      mountPath: /var/log/pods
      readOnly: true
    - name: docker-containers
      mountPath: /var/lib/docker/containers
      readOnly: true
    - name: containerd-root
      mountPath: /var/lib/containerd
      readOnly: true
  securityContext:
    runAsUser: 0
    runAsGroup: 0
---
# Namespaced watch rights for the agent's k8sattributes processor.
# The SA lives in the agent's own namespace (<namespace>-obs, created
# by the otel-operator as <cr-name>-collector); the Role lives in the
# stack namespace where the watched pods run.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: genieai-agent-collector-pod-watch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "observability") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: genieai-agent-collector-pod-watch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "observability") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: genieai-agent-collector-pod-watch
subjects:
  - kind: ServiceAccount
    name: genieai-agent-collector
    namespace: {{ .Values.namespace }}-obs
{{- end }}
