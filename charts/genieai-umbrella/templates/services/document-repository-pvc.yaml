{{- /* The PVC block is OPTIONAL (the per-service shape block says so): a cleared block means "no chart-owned claim", not a nil-pointer crash. */ -}}{{- $services := .Values.services | default dict -}}
{{- $servicesDocumentRepository := $services.documentRepository | default dict -}}
{{- $pluggable := .Values.pluggable | default dict -}}

{{- $svcDocRepo := $services.documentRepository | default dict -}}
{{- $pvc := $svcDocRepo.pvc | default dict -}}
{{- if and $servicesDocumentRepository.enabled $pvc.enabled -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-repository-uploads
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $pluggable.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pvc.storageSize | default "20Gi" }}
{{- end -}}
