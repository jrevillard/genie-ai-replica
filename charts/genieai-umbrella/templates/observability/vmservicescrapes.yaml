{{- if .Values.observability.metrics.enabled }}
{{- /*
  VMServiceScrapes — one per Service the chart renders that exposes a
  Prometheus-friendly metrics surface. Reconciled by vmoperator; the
  CRD group is operator.victoriametrics.com/v1beta1.

  selector.matchLabels targets `genieai.io/component: <slug>` — the
  label every chart-rendered Service emits via the
  genieai-common.labels helper. Endpoints reference the Service port
  by NAME (the `http` / `redis` port name in each Service spec), not
  the numeric Service port — the operator resolves the name against
  the target Service.

  Scope: the eleven Services the chart renders today (stateless tier
  + OPEA orchestrators). GPU model Deployments are EXCLUDED by
  default — vLLM / TEI / vllm-translation carry `app: <name>` labels
  rather than the genieai.io/component convention, and their
  self-metrics are rarely scraped. Operators that want GPU self-
  metrics add a custom VMServiceScrape out of band.

  MEASURED 2026-10-20 on the laptop: every one of these endpoints
  answers 404. /metrics was probed on each Service's own port —
  backend:80, document-repository:80, frontend:80, redis-cache:80,
  chatqna:8888, dataprep:5000, retriever:7000, reranker:8000,
  translation:9031, embedding:6000 — and none serves a Prometheus
  surface. The application services export metrics over OTLP instead
  (their SDKs push to the collector, which forwards to VictoriaMetrics
  with prometheusremotewrite), so the charts that matter get their
  data that way.

  These CRs are therefore inert today, and they are kept because the
  shape is right the moment an image does expose /metrics. Two traps
  to know about before trusting one:

  1. They do nothing unless VMSingle has ingestOnlyMode: false AND a
     serviceScrapeSelector that MATCHES them (see vmsingle.yaml). An
     ABSENT selector matches nothing — a nil LabelSelector is the
     "match nothing" selector — so with no selector on the VMSingle
     these CRs are inert today, exactly as stated above. Both gates are
     silent: the CRs still report `operational`, which only proves the
     CR is valid.
  2. `selector.matchLabels` here selects the TARGET Service, not the
     VMSingle. Pairing the CR with the VMSingle is
     VMSingle.spec.serviceScrapeSelector, a label selector on the
     VMServiceScrape object's OWN labels.
*/}}
{{- if .Values.services.backend.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "metrics") | nindent 4 }}
spec:
  selector:
    matchLabels:
      genieai.io/component: backend
  endpoints:
    - port: http
      interval: 30s
{{- end }}
{{- if .Values.services.frontend.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "metrics") | nindent 4 }}
spec:
  selector:
    matchLabels:
      genieai.io/component: frontend
  endpoints:
    - port: http
      interval: 30s
{{- end }}

{{- if .Values.services.documentRepository.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: document-repository
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "metrics") | nindent 4 }}
spec:
  selector:
    matchLabels:
      genieai.io/component: documentRepository
  endpoints:
    - port: http
      interval: 30s
{{- end }}
{{- if .Values.services.redisCache.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: redis-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "metrics") | nindent 4 }}
spec:
  selector:
    matchLabels:
      genieai.io/component: redis-cache
  # redis-cache Service port name is `redis`, not `http` — verified
  # in templates/services/redis-cache.yaml.
  endpoints:
    - port: redis
      interval: 30s
{{ end }}
