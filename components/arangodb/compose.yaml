# # docker-compose up -d

services:

  arango-vector-db:
    # least-privilege hardening: same capabilities as the main-stack arango service
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    image: arangodb/arangodb:3.12.4
    container_name: arango-vector-db
    ports:
      - "8529:8529"
    volumes:
      # Named volume by default (data survives without writing to the host
      # user's home); bind a host directory explicitly via ARANGO_DATA_DIR if
      # you need to reuse an existing /root/arango_data from before this change.
      - ${ARANGO_DATA_DIR:-arango_data}:/var/lib/arangodb3
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    # https://docs.arangodb.com/3.12/components/arangodb-server/options/
    command: ["--experimental-vector-index=true"]
    restart: unless-stopped
    networks:
      - chatqna_default

volumes:
  arango_data:

networks:
  chatqna_default:
    driver: bridge
    name: chatqna_default
    external: true

volumes:
  arango_data: