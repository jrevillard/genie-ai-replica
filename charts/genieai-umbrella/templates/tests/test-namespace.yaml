{{- /* Component label context, same pattern as templates/namespace.yaml. */ -}}
{{- $componentValues := dict "Chart" .Chart "Release" .Release "Values" .Values "component" "test" -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "genieai-common.fullname" . }}-test-namespace
  labels:
    {{- include "genieai-common.labels" $componentValues | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  # The hook-owned dep-check SA (read-only ClusterRole grant on
  # `namespaces`/get) — the same SA the pre-upgrade hooks and the
  # data-deps test pod use. Reused here because the new assertion
  # queries `kubectl get ns`, which is NOT a noop: it requires both
  # the kubectl binary (alpine lacks it) and an SA-bound RBAC grant.
  serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # Required by PSA restricted.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      # registry.k8s.io/kubectl: kubectl is NOT in alpine base (the
      # bitnami/kubectl version tags were purged from Docker Hub). SA =
      # the hook-owned dep-check SA (read-only ClusterRole on namespaces).
      image: "{{ .Values.global.imageRegistry | default "registry.k8s.io" }}/kubectl:v1.33.0"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          ns="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
          echo "test Pod running in namespace: $ns"
          # Read-only assertion via kubectl (read-only RBAC in
          # charts/genieai-umbrella/templates/rbac/): the release namespace
          # must carry the chart's PSA labels and MUST NOT carry the
          # genieai.io/cluster-profile label (the cluster-profile label
          # lives on the host namespace, not on the release namespace).
          enforce=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}' 2>/dev/null || true)
          enforce_ver=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce-version}' 2>/dev/null || true)
          cluster_profile=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.genieai\.io/cluster-profile}' 2>/dev/null || true)
          [ "$enforce" = "restricted" ] \
            || { echo "FAIL: pod-security.kubernetes.io/enforce missing or != restricted (got: '$enforce')"; exit 1; }
          [ -n "$enforce_ver" ] \
            || { echo "FAIL: pod-security.kubernetes.io/enforce-version missing (got: '$enforce_ver')"; exit 1; }
          [ -z "$cluster_profile" ] \
            || { echo "FAIL: genieai.io/cluster-profile label should live on the host namespace, not on the release namespace (got: '$cluster_profile')"; exit 1; }
          echo "PASS"
{{- /* Gated on SealedSecrets AND at least one data tier rendering them —
       the test asserts the tier-specific Secrets exist, so a release with
       secrets (or all data tiers) disabled has nothing to check. */ -}}
{{- if and .Values.secrets.sealedSecrets.enabled (or .Values.data.arangodb.enabled (or .Values.data.keycloak.enabled .Values.data.postgres.enabled)) }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "genieai-common.fullname" . }}-test-data-deps
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "test") | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: t
      # registry.k8s.io/kubectl: kubectl is NOT in alpine base (the
      # bitnami/kubectl version tags were purged from Docker Hub). SA = the
      # hook-owned dep-check SA (persists between hook fires via
      # before-hook-creation).
      image: "{{ .Values.global.imageRegistry | default "registry.k8s.io" }}/kubectl:v1.33.0"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          ns="{{ .Values.namespace }}"
          echo "test Pod checking SealedSecret materialization"
          # SealedSecret → Secret is eventually consistent: the controller
          # unseals asynchronously after the SealedSecret is applied. A
          # still-encrypted sentinel NEVER materializes (controller marks
          # the SealedSecret Synced=False, reason ErrorDecrypt) and runs out
          # of retries below. Poll each expected Secret up to 30 × 2s.
          check_secret() {
            name="$1"
            i=0
            while [ "$i" -lt 30 ]; do
              if kubectl get secret "$name" -n "$ns" >/dev/null 2>&1; then
                echo "OK: K8s Secret materialized: $name"
                return 0
              fi
              i=$((i+1))
              sleep 2
            done
            echo "FAIL: K8s Secret never materialized: $name (SealedSecret sentinel not re-sealed, or controller down)"
            return 1
          }
          failed=0
          {{- if .Values.data.arangodb.enabled }}
          check_secret arango-jwt-secret || failed=1
          check_secret arango-root-secret || failed=1
          {{- end }}
          {{- if or .Values.data.keycloak.enabled .Values.data.postgres.enabled }}
          # keycloak-db-credentials is rendered by the Postgres tier (the
          # Keycloak CR consumes it); either tier enabled means it must exist.
          check_secret keycloak-db-credentials || failed=1
          {{- end }}
          if [ "$failed" -ne 0 ]; then
            echo "FAIL: expected K8s Secrets did not materialize in 60s"
            exit 1
          fi
          echo "PASS"
{{- end }}
