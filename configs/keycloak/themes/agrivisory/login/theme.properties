# Agrivisory login theme (DEC-32c) — CSS-only child of keycloak.v2.
# Pattern ported from upstream GenieAI v2.0.1 configs/keycloak/themes/genie
# (S-2 attribution), WITHOUT upstream's template.ftl override: we keep the
# stock KC 26.7.2 markup so a KC upgrade cannot break the page structure.
# `styles` REPLACES the parent's list — replicate keycloak.v2's own css
# (pinned 26.7.2: css/styles.css) then append ours. stylesCommon (PatternFly
# vendor css) and darkMode inherit untouched.
parent=keycloak.v2
styles=css/styles.css css/agrivisory.css
