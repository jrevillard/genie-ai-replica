{{- if .Values.services.nginx.enabled -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-override
  namespace: {{ .Values.namespace }}
data:
  # The genie-ai-nginx entrypoint envsubst-renders /etc/nginx/conf.d/default.conf
  # FROM its baked template AT STARTUP. Mounting a read-only subPath OVER the
  # rendered file makes the redirect fail with EROFS and the container exits.
  # The TEMPLATE is mounted instead: the rendered content has no ${...}
  # placeholders, so envsubst copies it through verbatim and the upstream
  # image's baked-in Kong-based default.conf never reaches the listener.
  default.conf.template: |
    upstream genieai_frontend { server frontend:80; }
    upstream genieai_backend  { server backend:80; }
    upstream genieai_docrepo  { server document-repository:80; }
    server {
      listen 8080;
      # Exact-match /healthz beats the catch-all `location /` below, so
      # the readiness/liveness probe and helm-test pod validate nginx
      # itself rather than proxying through to the frontend index page.
      location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
      location /api/      { proxy_pass http://genieai_backend; }
      location /api-docs/ { proxy_pass http://genieai_backend; }
      location /uploads/  { proxy_pass http://genieai_docrepo; }
      location /          { proxy_pass http://genieai_frontend; }
    }
{{- end -}}
