{{- $ns := .Values.namespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  namespace: {{ $ns }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "rbac") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # Exactly what the hook Jobs + test pods consume — re-add verbs/resources
  # together with the consumer that needs them, never speculatively.
  # Secrets: the test-data-deps pod's materialization check (get only).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Events for the clusterprofile-detect hook's Event create
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  # Keycloak 26 official operator (k8s.keycloak.org/v2beta1) ships 4 CRDs.
  # This chart renders `Keycloak` only; the realm is converged by
  # keycloak-config-cli, not by the operator's create-only import CR.
  # The OIDC/SAML client CRDs are listed for completeness (operators may
  # add them).
  - apiGroups: ["k8s.keycloak.org"]
    resources:
      - keycloaks
      - keycloakoidcclients
      - keycloaksamlclients
    verbs: ["get", "list"]
