# Create GitLab Release with changelog content for the tagged version
# Uses GitLab's native `release` keyword — no token/scope setup needed.
# Pin the official release-cli image: the runner does not inject the
# release-cli binary into job containers (observed "release-cli: not found").
release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      VERSION_ESC=$(echo "${VERSION}" | sed 's/\./\\./g')
      echo "Extracting changelog for version ${VERSION}..."
      awk "/^## \[${VERSION_ESC}\]/{p=1; next} /^## \[/{p=0} p" CHANGELOG.md | sed '/^\[/,$d' > release-notes.md
      if [ ! -s release-notes.md ]; then
        echo "WARNING: No changelog content found for ${VERSION}, creating release with tag only."
        echo "Release ${CI_COMMIT_TAG}" > release-notes.md
      fi
    - echo "GitLab Release created for ${CI_COMMIT_TAG}."
  release:
    tag_name: $CI_COMMIT_TAG
    description: release-notes.md
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# --- Lint jobs ---

# Shared body for the component lint jobs (#1414): the jobs used to hand-copy
# a ~30-line block (before_script/script/cache/rules) that differed only in
# directory. What remains per job is the component directory, its trigger
# paths and any job-specific env; the run body lives here once.
#
# No cache (#1413): `npm ci` deletes node_modules before installing, and the
# npm download cache (~/.npm) was never among the cached paths — every run
# restored the archive, deleted it, and re-downloaded all tarballs. The cache
# bought zero reuse and cost archive+extract time each run.
#
# Workspace residue (2026-10-19 incident): a reused runner workspace once
# served stale bytes of keycloak-auth-service.js / tracing.js to prettier —
# lint failed on content that was not this ref's (branch pipeline green,
# docker repro red). The pipeline-global GIT_DEPTH: "0" full fetch is the
# standing mitigation; if lint ever checks the wrong copy of a file, suspect
# workspace residue first.
.lint_component:
  extends: .lint_node
  script:
    - cd "$COMPONENT_DIR" && npm ci
    - npm run lint
    - npm run format:check

lint:backend:
  extends: .lint_component
  variables:
    COMPONENT_DIR: components/gov-chat-backend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/gov-chat-backend/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

lint:frontend:
  extends: .lint_component
  variables:
    COMPONENT_DIR: components/gov-chat-frontend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/gov-chat-frontend/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

lint:doc-repo:
  extends: .lint_component
  variables:
    COMPONENT_DIR: components/document-repository
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/document-repository/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

lint:okf-server:
  extends: .lint_component
  # Companion to test:okf-server (2026-10-16 review finding): the component
  # had no lint coverage in CI either — eslint/prettier ran only locally.
  variables:
    COMPONENT_DIR: components/okf-server
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "components/okf-server/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

lint:config-validator:
  extends: .lint_component
  # Companion to config:validate (#1408): the package ships its own
  # lint/format scripts but no CI job ran them — new validators (the
  # #1306/#1322 shell gate, and anything after) could ship with ESLint
  # violations and Prettier drift behind a green pipeline.
  variables:
    COMPONENT_DIR: tests/config-validator
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "tests/config-validator/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Format the scripts of the documentation site.  They live outside every
# component directory, so no component's own lint job covers them; the
# checker is CI-critical code, so it gets the same Prettier gate as the rest
# of the repository.  Prettier comes from components/shared/lib, which
# already pins it -- no second copy to keep in sync. Stays outside
# .lint_component: it runs shared/lib's pinned prettier over site/scripts,
# not the component's own lint/format scripts.
lint:site-scripts:
  extends: .lint_node
  before_script:
    - cd components/shared/lib && npm ci
  script:
