apiVersion: v2
name: genieai-umbrella
description: |
  Single-install umbrella chart for GENIE.AI. Renders the entire 28-service
  stack with one `helm install` — typically consumed via per-env Kustomize
  overlays at `deploy/environments/<env>/`.
type: application
version: 0.1.0
# `appVersion` mirrors the chart version deliberately: it tracks the chart
# layout, not the GENIE.AI product release (the two version on independent
# axes; deployed image tags are governed by values, not by appVersion).
# Never "latest" — OCI registries reject it for immutable promotion.
appVersion: "0.1.0"
keywords:
  - genie-ai
  - umbrella
  - sovereign
  - rag
home: https://opensource.unicc.org/un/itu/genie-ai
sources:
  - https://opensource.unicc.org/un/itu/genie-ai.git
maintainers:
  - name: GENIE.AI
    email: maintainers@example.invalid
dependencies:
  # Local library chart — re-rendered on every umbrella install.
  # No `import-values`: it exports values only (template definitions are
  # always callable via {{ include "genieai-common.*" . }} without it), and
  # importing the library's values tree would carry Helm's reserved `global`
  # key into a schema-validated subtree the library rejects.
  - name: genieai-common
    version: "0.1.0"
    repository: "file://../genieai-common"

  # data layer operators
  - name: cloudnative-pg
    version: "~> 0.29.0"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: data.postgres.enabled
  - name: kube-arangodb
    version: "~> 1.4.5"
    repository: "https://arangodb.github.io/kube-arangodb"
    condition: data.arangodb.enabled
  # keycloak-operator is deliberately NOT a Helm dependency: its advertised
  # chart repo (https://keycloak.github.io/keycloak-operator-helm) serves no
  # index (301 -> 404; verified 2026-10-08). It is a cluster bootstrap
  # prerequisite installed via OLM or the static YAML from keycloak.org.
  # The chart renders only the CRs it manages.
  - name: sealed-secrets
    version: "~> 2.20.0"
    repository: "https://bitnami.github.io/sealed-secrets"
    condition: secrets.sealedSecrets.enabled
# Operator chart dependencies for later tiers (victoria-metrics,
# opentelemetry, gpu, cert-manager, envoy-gateway) are added here as
# their tiers land. keycloak-operator is never a chart dependency; see
# its note above.
