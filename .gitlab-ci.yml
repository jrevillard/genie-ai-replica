stages:
  - lint
  - test
  - config      # env-var coverage + changelog validation + dependency-lock freshness (fail-fast before build)
  - build       # publish candidate images to GitLab Container Registry (tmp/ namespace)
  - scan        # GitLab official Container Scanning template (advisory + dashboard)
  - contract-in-image   # contract tests vs REAL vendored comps, run inside the built image (D3)
  - e2e
  - promote     # retag tested digests to deployable tags (main/tags only)
  - release     # create GitLab Release from changelog (tag pipelines only)
  - scheduled
  - manual
  - deploy

variables:
  FLUTTER_VERSION: "3.41.7"
  FLUTTER_ARCHIVE: "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
  # --- Container build/scan/promote pipeline (see docs/adr/0001-gitlab-registry-build-scan-pipeline.md) ---
  GIT_DEPTH: "0"  # full history needed for CI_COMMIT_SHORT_SHA stability across matrix jobs
  TRIVY_IMAGE_TAG: "aquasec/trivy:0.57.0"
  SYFT_VERSION: "v1.26.0"
  # --- OKF content-only chunking (Story 4.8-amend) ---
  # The okf-server internal concept-status callback is fail-closed: any test
  # that exercises the live dataprep → okf-server path needs this same value on
  # both ends. Unit tests mock it; the CI default is a non-prod sentinel.
  OKF_INTERNAL_SECRET: "ci-okf-internal-secret-not-for-production"
  DATAPREP_URL: "http://dataprep-arango-service:5000"
  # --- SAST exclusions: dev/test-only paths and known-not-relevant targets ---
  # Variable consumed by both semgrep-sast and kics-iac-sast (both honor
  # SAST_EXCLUDED_PATHS). Do NOT use SEARCH_IGNORED — it is not honored by
  # any official GitLab SAST template and will be silently dropped.
  # - mobile/**/windows/: Windows desktop CMake runner, not deployed to Docker Swarm prod
  # - mobile/genie_ai_mobile/flutter_appauth/**: the vendored checkout of the
  #   flutter_appauth plugin (a `path:` dependency in
  #   mobile/genie_ai_mobile/pubspec.yaml, which resolves to the
  #   flutter_appauth/flutter_appauth package inside it). The checkout is a melos
  #   monorepo: the app compiles only that one package, and the rest of the
  #   checkout (the platform-interface package, the upstream GitHub Actions
  #   workflows) is upstream code we do not run. The glob covers the whole
  #   checkout on purpose: narrowing it to the compiled package was tried and
  #   measured, and the fork's upstream workflows then produced 9 kics findings
  #   that nobody owns (docs/security/cve-triage-2026q3.md, wave-6).
  #
  #   Why the tree is excluded: it carries TLS-verification-disabling code —
  #   Android InsecureConnectionBuilder, iOS InsecureURLProtocol — that no
  #   analyzer should keep reporting on every run. Both are reachable only when
  #   KeycloakConfig.allowInsecureConnections is true.
  #
  #   Provenance: the trust-all code is partly ours. Upstream ignores
  #   allowInsecureConnections on iOS (MaikuB/flutter_appauth#386), so the fork
  #   adds the NSURLProtocol interception, and GENIE.AI adds the
  #   allowInsecureConnections gate in FlutterAppauthPlugin.java.
  #
  #   What makes the exclusion safe: the flag is off in the itu, staging and
  #   per-institution flavor configs (the per-institution template leaves it at
  #   its safe default) — asserted by
  #   mobile/genie_ai_mobile/test/config/keycloak_config_test.dart, which the
  #   test:flutter job also runs a second time with --dart-define=FLAVOR=itu
  #   (the release recipe, exercised rather than asserted). The gates inside the
  #   fork itself are asserted by
  #   mobile/genie_ai_mobile/test/config/flutter_appauth_insecure_gate_test.dart:
  #   once the tree is out of the scan nothing else checks them, and the fork is
  #   rebased onto upstream from time to time.
  #
  #   The FLAVOR gap is closed: the documented build commands set both
  #   selectors — see mobile/genie_ai_mobile/README.md (§ Build Flavors),
  #   mobile/genie_ai_mobile/CLAUDE.md (§ Build & Run) and
  #   site/content/en/docs/mobile/mobile-deployment-guide.md (§ Build) — and
  #   getConfig() fails at startup in a release or profile build made without
  #   the define (#1099), so the missing-define fallback cannot reach a
  #   release artifact any more. An explicit FLAVOR=dev release fails at
  #   startup too — getConfig() refuses any configuration with
  #   allowInsecureConnections on in a release artifact (#1099), and
  #   build-release.ps1 refuses dev/e2e on the artifact path as well.
  # - genie-ai-overlay/contracts/: real-comps contract tests (test code, NOT shipped in image)
  # - **/scripts/**: dev/migration scripts NOT shipped in container. We list specific
  #   sub-patterns (rather than the broad **/scripts/) so the production entrypoint
  #   `components/document-repository/scripts/clamav-node.sh` stays scanned.
  # - scripts/okf-testing-lab/**: RAGAS testing-lab CLI helpers, run by hand —
  #   NOT shipped in a container. CAVEAT (review 2026-10-29): two of these
  #   modules are REQUIRED by CI-run okf-server Jest suites since commit
  #   c40e9ea03 (ragas-compare-runs.js, ragas-regenerate-entry.js), so their
  #   SAST findings are invisible by construction — and any future lab helper
  #   a test needs lands in the same blind spot. Moving the shared helpers to
  #   a scanned location belongs to the post-train slimming pass.
  # - **/seed-*.js: synthetic data generators, never executed at runtime
  # - **/__tests__/, **/__mocks__/, **/tests/, **/coverage/: test code + generated reports
  # - .claude/**: Claude Code agent skills, hooks, BMAD orchestration YAML. Not
  #   production code; YAML files use BMAD-specific syntax that semgrep can't
  #   parse, generating "Parsing errors" UI noise in the security dashboard.
  #   NOTE: the BMAD skills under .claude/skills/ (bmad, bmad-*, …) are symlinks
  #   into .agents/skills/*, so excluding .claude/** alone does NOT exclude the
  #   real sources — .agents/** below is what actually keeps the agent tooling
  #   out of the scan. (.claude/skills/test-audit is a real directory, not a
  #   symlink, and is covered by .claude/** itself.)
  # - .agents/**: source tree of the BMAD agent skills that .claude/skills/* points
  #   at. Agent tooling for AI assistants: never copied into a container image,
  #   never executed in production. Same rationale as _bmad/** below.
  # - _bmad/**: BMAD/WDS agent framework modules (build tooling for AI agents,
  #   never shipped or executed in production).
  # - _bmad-output/**: generated BMAD planning/implementation/spec artifacts.
  # - update_quickhelp.js: repo-root dev script (hardcoded locale paths), never shipped.
  # NOTE: gemnasium (dependency scanning) does NOT honor this var — see DS_EXCLUDED_PATHS
  # below. Secret Detection is intentionally NOT excluded (SECRET_DETECTION_EXCLUDED_PATHS
  # stays unset) so secrets in any BMAD sample content still surface in the dashboard.
  SAST_EXCLUDED_PATHS: >-
    mobile/**/windows/**,
    mobile/genie_ai_mobile/flutter_appauth/**,
    genie-ai-overlay/contracts/**,
    **/seed-*.js,
    **/scripts/seed-*.js,
    **/scripts/migrations/**,
    scripts/okf-testing-lab/**,
    **/scripts/new-schema-scripts/**,
    **/__tests__/**,
    **/__mocks__/**,
    **/tests/**,
    **/coverage/**,
    .claude/**,
    .agents/**,
    _bmad/**,
    _bmad-output/**,
    update_quickhelp.js
  # --- Dependency Scanning exclusions (gemnasium + gemnasium-python) ---
  # Comma-separated pathspec list, honored by both analyzers. Without these
  # excludes, gemnasium-python entered _bmad/scripts/setup.py on job 93669
  # (pipeline 7575, MR 343) and exited 1 with no report written — gemnasium-
  # python analyzes one dep-dir per run, so picking up a BMAD script blocks
  # the whole pipeline. Scope kept narrow on purpose: do NOT add tests/** —
  # gemnasium reads manifests (pyproject.toml, setup.py, requirements*.txt,
  # package.json), and a test fixture declaring its own deps is a real dep
  # signal we want surfaced.
  # Secret Detection is intentionally NOT excluded (see SAST comment above).
  # NOTE: separator is comma, NOT semicolon — semicolon-separated values are
  # silently ignored by gemnasium v6 (verified on job 93734).
  # .agents/** mirrors the SAST exclusion above. Measured on pipeline 14093
  # (main, before this exclusion): the python analyzer reported exactly one
  # dependency root ("Detected supported dependency files in
  # 'genie-ai-overlay'"), never listed .agents among the directories it
  # skipped, and produced a single SBOM (genie-ai-overlay/gl-sbom-pypi-uv.cdx.json)
  # — the tree's only manifest (.agents/skills/bmad/scripts/setup.py) was not
  # scanned. The exclusion is therefore insurance against a future skill
  # dropping a manifest where the analyzer would pick it up as a dependency
  # root and block the whole dependency-scanning job; it is not a fix for an
  # observed failure.
  DS_EXCLUDED_PATHS: "_bmad/**,_bmad-output/**,.claude/**,.agents/**"

# Prevent duplicate branch+MR pipelines — first match wins
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//

# --- Hidden job templates (DRY, reusable by Story 1.3 test stage) ---

.node_base:
  image: node:20-alpine
  interruptible: true

.lint_node:
  extends: .node_base
  stage: lint

.test_node:
  extends: .node_base
  stage: test
  variables:
    NODE_ENV: test
  artifacts:
    when: always
    expire_in: 7 days

.flutter_base:
  image: debian:bookworm-slim
  interruptible: true
  variables:
    PUB_CACHE: $CI_PROJECT_DIR/.pub-cache
  cache:
    - key: "flutter-sdk-${FLUTTER_VERSION}"
      paths:
        - flutter-sdk/
    - key:
        files:
          - mobile/genie_ai_mobile/pubspec.lock
      paths:
        - mobile/genie_ai_mobile/.dart_tool/
        - .pub-cache/
      fallback_keys:
        - "flutter-deps-$CI_DEFAULT_BRANCH"
        - "flutter-deps-"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils python3 python3-venv python3-pip
    - |
      if [ ! -d "flutter-sdk/bin" ]; then
        echo "Installing Flutter ${FLUTTER_VERSION}..."
        curl -fsSL "${FLUTTER_ARCHIVE}" | tar -xJ
        mv flutter flutter-sdk
      fi
    - git config --global --add safe.directory "$PWD/flutter-sdk"
    - export PATH="$PWD/flutter-sdk/bin:$PATH"
    - flutter --version
    - cd mobile/genie_ai_mobile
    - flutter pub get

# --- E2E integration base (shared by e2e:integration + scheduled:integration) ---

.e2e_integration_base:
  image: docker:24
  variables:
    COMPOSE_PROJECT_NAME: "ci-$CI_PIPELINE_ID"
    # Pull candidate images from the tmp/ quarantine namespace (where build:image
    # pushes pre-promote candidates). GENIE_AI_GLOBAL_TAG matches the candidate tag.
    GENIE_AI_REGISTRY: "$CI_REGISTRY_IMAGE/tmp"  # e2e pulls candidates from tmp/ namespace
  allow_failure: false
  tags: [docker]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  before_script:
    - apk add --no-cache docker-cli-compose curl
    # Authenticate to the GitLab registry so `docker compose pull` succeeds
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - if [ -n "$DOCKER_HUB_USER" ]; then echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin docker.io; fi  # avoid anonymous Docker Hub rate limits
    - |
      for p in $(docker compose ls -q 2>/dev/null | grep '^ci-'); do
        echo "Cleaning up previous project: $p"
        docker compose -p "$p" down -v --remove-orphans 2>/dev/null || true
      done
    - docker network prune -f 2>/dev/null || true
  script:
    - cp env .env
    - sed -i '/^GENIE_AI_[A-Z0-9_]*_IMAGE=/ s|^|# |' .env
    - |
      while IFS='=' read -r var _; do
        case "$var" in ''|[!A-Z_]*) continue ;; esac
        eval "val=\${$var:-}"
        if [ -n "$val" ]; then
          sed -i "s|^${var}=.*|${var}=${val}|" .env
        fi
      done < env
    - |
      for var in EMAIL_FROM EMAIL_HOST KEYCLOAK_VERIFY_EMAIL; do
        if grep -q "^${var}=$" .env; then
          case "$var" in
            EMAIL_FROM) sed -i "s|^${var}=.*|${var}=noreply@ci-genie-ai.local|" .env ;;
            EMAIL_HOST) sed -i "s|^${var}=.*|${var}=localhost|" .env ;;
            KEYCLOAK_VERIFY_EMAIL) sed -i "s|^${var}=.*|${var}=false|" .env ;;
          esac
        fi
      done
    - |
      # CI runs inside the Docker network — use the nginx service name so
      # Keycloak advertises URLs resolvable from the CI runner container.
      # Mobile tests bypass OIDC discovery (direct token injection) so this
      # only matters for Playwright web E2E.
      echo "NGINX_PUBLIC_DOMAIN=nginx" >> .env
      # Backend must verify JWTs via JWKS at https://nginx/auth/... which uses
      # a self-signed certificate.  Safe for CI — never use in production.
      echo "NODE_TLS_REJECT_UNAUTHORIZED=0" >> .env
    # Pull pre-built candidate images from the GitLab registry so E2E tests run
    # against the exact artifact produced by build:image (not a local rebuild).
    # Candidate tag matches build:image's CANDIDATE_TAG logic.
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        E2E_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        E2E_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      sed -i "s|^GENIE_AI_GLOBAL_TAG=.*|GENIE_AI_GLOBAL_TAG=${E2E_TAG}|" .env
      echo "E2E pulling candidate images tagged :${E2E_TAG}"
    # Pull all custom services from the registry. `up --no-build` below fails
    # loudly if a build:image job didn't publish its candidate, surfacing the
    # breakage here instead of silently rebuilding a different artifact.
    - docker compose pull frontend backend document-repository nginx kong-config db-migrations keycloak keycloak-config postgres-init || true
    - docker compose up -d --no-build || (docker compose logs --tail=50 > docker-compose-logs.txt 2>&1; cat docker-compose-logs.txt; exit 1)
    - |
      for i in $(seq 1 60); do
        if docker exec "ci-${CI_PIPELINE_ID}-backend-1" curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
          echo "Backend healthy"
          break
        fi
        echo "Waiting for backend... ($i/60)"
        sleep 5
      done
    - docker exec "ci-${CI_PIPELINE_ID}-backend-1" curl -sf http://localhost:3000/api/health || (docker compose logs --tail=50 > docker-compose-logs.txt 2>&1; cat docker-compose-logs.txt; exit 1)
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - docker-compose-logs.txt

# --- Shared: Docker compose network connection + NGINX IP discovery ---
# Used by .e2e_web_base to mutualize networking logic.
.connect_compose_network: &connect_compose_network
  - |
    COMPOSE_NET=$(docker network ls --filter "label=com.docker.compose.project=ci-${CI_PIPELINE_ID}" --format '{{.Name}}' | head -1)
    if [ -z "$COMPOSE_NET" ]; then
      COMPOSE_NET="ci-${CI_PIPELINE_ID}_default"
    fi
    echo "Compose network: $COMPOSE_NET"
    CI_CONTAINER_ID=$(docker ps --filter "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" --format '{{.ID}}' | head -1)
    if [ -z "$CI_CONTAINER_ID" ]; then
      CI_CONTAINER_ID=$(docker ps --filter "name=runner" --format '{{.Names}}' | grep "concurrent" | head -1 | sed 's/-predefined$//')
    fi
    echo "CI container: $CI_CONTAINER_ID"
    if docker network inspect "$COMPOSE_NET" >/dev/null 2>&1; then
      docker network connect "$COMPOSE_NET" "$CI_CONTAINER_ID" 2>/dev/null || true
      echo "CI container connected to compose network: $COMPOSE_NET"
    else
      echo "WARNING: Compose network $COMPOSE_NET not found — tests may fail"
    fi
    NGINX_CONTAINER=$(docker ps --filter "name=nginx" --format "{{.Names}}" | grep "ci-" | head -1)
    if [ -n "$NGINX_CONTAINER" ]; then
      NGINX_IP=$(docker inspect "$NGINX_CONTAINER" --format "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}" | awk '{print $1}')
      echo "Nginx container: $NGINX_CONTAINER at $NGINX_IP"
    else
      echo "WARNING: No nginx container found in compose stack"
    fi

# --- E2E web base (shared by e2e:playwright + scheduled:e2e-web) ---

.e2e_web_base:
  extends: .node_base
  image: node:20-bookworm-slim
  allow_failure: false
  tags: [docker]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  cache:
    - key:
        files:
          - package-lock.json
        prefix: e2e-playwright
      paths:
        - node_modules/
      fallback_keys:
        - "e2e-playwright-$CI_DEFAULT_BRANCH"
        - "e2e-playwright-"
    - key:
        files:
          - package-lock.json
        prefix: e2e-playwright-browsers
      paths:
        - .cache/ms-playwright/
  before_script:
    - apt-get update && apt-get install -y docker.io curl python3
    - mkdir -p reports
    - npm ci
    - npx playwright install --with-deps chromium
  script:
    - *connect_compose_network
    - |
      # Use Docker service name for Keycloak OIDC compatibility.
      if curl -sk -o /dev/null -w "%{http_code}" https://nginx/api/health 2>/dev/null | grep -qE "^[23]"; then
        echo "Nginx reachable via service name"
        E2E_BASE_URL="https://nginx"
      elif [ -n "$NGINX_IP" ]; then
        echo "Falling back to NGINX_IP: ${NGINX_IP}"
        E2E_BASE_URL="https://${NGINX_IP}"
      else
        echo "ERROR: Cannot reach nginx - neither service name nor IP"
        exit 1
      fi
      for var in KEYCLOAK_ADMIN_PASSWORD; do
        eval "val=\${$var:-}"
        if [ -z "$val" ]; then
          echo "ERROR: Missing CI variable: $var"
          exit 1
        fi
      done
    - |
      # ROPC setup (required by conversation-history tests via getUserToken)
      # All requests go through nginx/Kong — same path as production traffic.
      KC_URL="${E2E_BASE_URL}/auth"
      KC_PWD="${KEYCLOAK_ADMIN_PASSWORD}"
      ADMIN_TOKEN=""
      CLIENT_UUID=""
      for i in $(seq 1 90); do
        if [ -z "$ADMIN_TOKEN" ]; then
          ADMIN_TOKEN=$(curl -sk -X POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
            -d "client_id=admin-cli" -d "username=admin" -d "password=${KC_PWD}" -d "grant_type=password" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" 2>/dev/null)
        fi
        if [ -n "$ADMIN_TOKEN" ]; then
          CLIENT_UUID=$(curl -sk "${KC_URL}/admin/realms/genie/clients?clientId=genie-app" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id']) if d else ''" 2>/dev/null || true)
        fi
        if [ -n "$CLIENT_UUID" ]; then
          echo "Keycloak ready after ${i}s — client UUID: ${CLIENT_UUID}"
          break
        fi
        echo "Waiting for Keycloak via nginx/Kong... ($i/90)"
        sleep 2
      done
      if [ -z "$CLIENT_UUID" ]; then
        echo "ERROR: genie-app client not found via nginx/Kong after 180s"
        exit 1
      fi
      curl -sk -X PUT "${KC_URL}/admin/realms/genie/clients/${CLIENT_UUID}" \
        -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
        -d '{"directAccessGrantsEnabled": true}'
      echo "ROPC enabled for genie-app client"
      # Create test user for E2E tests (required by loginViaUI and getUserToken)
      EXISTING=$(curl -sk "${KC_URL}/admin/realms/genie/users?username=testuser" \
        -H "Authorization: Bearer $ADMIN_TOKEN" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null)
      if [ "${EXISTING:-0}" -eq 0 ]; then
        CREATE_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -X POST "${KC_URL}/admin/realms/genie/users" \
          -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
          -d '{"username":"testuser","email":"testuser@e2e.test","emailVerified":true,"firstName":"Test","lastName":"User","enabled":true,"credentials":[{"type":"password","value":"TestPass123!","temporary":false}]}')
        if [ "$CREATE_STATUS" -ne 201 ]; then
          echo "ERROR: testuser creation failed (HTTP $CREATE_STATUS)"
          exit 1
        fi
        echo "testuser created (HTTP $CREATE_STATUS)"
      else
        echo "testuser already exists"
      fi
      # Assign admin realm role to test user (required for document upload/delete)
      USER_ID=$(curl -sk "${KC_URL}/admin/realms/genie/users?username=testuser" \
        -H "Authorization: Bearer $ADMIN_TOKEN" \
        | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])" || true)
      ADMIN_ROLE=$(curl -sk "${KC_URL}/admin/realms/genie/roles" \
        -H "Authorization: Bearer $ADMIN_TOKEN" \
        | python3 -c "import sys,json; roles=[r for r in json.load(sys.stdin) if r['name']=='admin']; print(roles[0]['id'] if roles else '')" || true)
      if [ -n "$ADMIN_ROLE" ] && [ -n "$USER_ID" ]; then
        curl -sk -X POST "${KC_URL}/admin/realms/genie/users/${USER_ID}/role-mappings/realm" \
          -H "Authorization: Bearer $ADMIN_TOKEN" \
          -H "Content-Type: application/json" \
          -d "[{\"id\":\"${ADMIN_ROLE}\",\"name\":\"admin\"}]" && echo "Assigned admin role to testuser" || echo "WARNING: admin role assignment failed"
      else
        echo "WARNING: Could not assign admin role (role or user not found). Document tests may fail."
      fi
      # Save vars for cleanup in after_script
      echo "E2E_BASE_URL=${E2E_BASE_URL}" > .e2e-ropc-env
      echo "ADMIN_TOKEN=${ADMIN_TOKEN}" >> .e2e-ropc-env
      echo "CLIENT_UUID=${CLIENT_UUID}" >> .e2e-ropc-env
    # tests/e2e/okf/ stays OUT until MR2 lands: the OKF Studio UI those specs
    # drive ships in MR 2 (this train is MR1, dark), they hardcode
    # https://localhost while CI serves E2E_BASE_URL=https://nginx, and they
    # need an OKF-enabled deployment (OKF_ENABLED=1). Including them here
    # guaranteed three red specs on every merge train.
    - BASE_URL="${E2E_BASE_URL}" npx playwright test tests/e2e/chatbot/ tests/e2e/documents/ tests/e2e/theme-runtime-config.spec.js --project=chromium
  after_script:
    - |
      # ROPC cleanup - CRITICAL: always revert, even on test failure
      if [ -f .e2e-ropc-env ]; then
        . ./.e2e-ropc-env
        KC_URL="${E2E_BASE_URL}/auth"
        curl -sk -X PUT "${KC_URL}/admin/realms/genie/clients/${CLIENT_UUID}" \
          -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
          -d '{"directAccessGrantsEnabled": false}' 2>/dev/null && echo "ROPC disabled" || echo "WARNING: ROPC cleanup failed"
        rm -f .e2e-ropc-env
      fi

    - mkdir -p e2e-logs
    - docker compose -p "ci-${CI_PIPELINE_ID}" logs > e2e-logs/docker-compose.log 2>&1 || true
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - e2e-logs/
      - reports/
    reports:
      junit: reports/playwright-report.xml

# GitLab official Container Scanning template — produces the correct-schema report
# (GitLab security dashboard + MR widget) + CycloneDX SBOM. Overridden below to
# scan each of the 15 candidate images in tmp/. Blocking on HIGH/CRITICAL is via
# MR approval rules (see docs/adr/0001).
include:
  # --- Security testing suite (GitLab Ultimate) ---
  # All run in the `test` stage, advisory (allow_failure), findings land in the
  # security dashboard + MR widget. Blocking via MR approval rules, same model
  # as container scanning.
  - template: Jobs/Secret-Detection.gitlab-ci.yml   # leaked tokens/passwords in source + history
  - template: Jobs/SAST.gitlab-ci.yml               # source-code vulns (JS/Vue, Python, Dart)
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml # known vulns in npm/pip/pub deps
  - template: Jobs/SAST-IaC.gitlab-ci.yml           # misconfigs in docker-compose / ansible / k8s
  - template: Jobs/Container-Scanning.gitlab-ci.yml # image vulns (uses $CS_IMAGE; schema 15.x.x)
  # GitLab's container-scanning template defines one `container_scanning` job that
  # scans one image (CS_IMAGE). We override it below to run in the `scan` stage
  # (instead of `test`), block promotion on failure, and inherit a per-image
  # anchor (`.container_scanning_per_image_template`) that each `scan:IMAGE`
  # job uses via `extends: container_scanning`. Each scan:IMAGE job sets its
  # own CS_IMAGE to the corresponding `tmp/...` registry tag built in stage
  # `build`. The produced `gl-container-scanning-report.json` artifact conforms
  # to the v15.x.x schema (the previous custom Trivy-only script produced
  # `SchemaVersion: <int>` at the report root instead of `version: "<semver>"`,
  # which the GitLab UI rejected as "Report version not provided").

# Override the security templates' default rules (which run on branch pipelines
# only via `if: $CI_COMMIT_BRANCH`) so they ALSO run on MR + release branches —
# pre-merge coverage. Applied to the jobs active for the GENIE.AI stack
# (JS/Vue + Python + npm/pip deps + IaC + secrets). Other language-specific
# SAST jobs keep template defaults (won't activate for absent languages).
.security_run_rules: &security_run_rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_BRANCH =~ /^release\//

secret_detection:
  rules: *security_run_rules
semgrep-sast:
  rules: *security_run_rules
  # SAST_EXCLUDED_PATHS (set in global variables) is the single source of truth
  # for the scan surface; the list below is a summary of it, not a second copy
  # to maintain. It hides:
  #   mobile/**/windows/** — Windows desktop CMake runner, not deployed
  #   mobile/genie_ai_mobile/flutter_appauth/** — vendored flutter_appauth
  #     checkout (trust-all TLS builder, gated by a config flag)
  #   genie-ai-overlay/contracts/** — real-comps contract tests, not shipped
  #   **/seed-*.js — seed scripts (data fixtures for a fresh database)
  #   **/scripts/{seed-*.js,migrations/**,new-schema-scripts/**} — dev scripts
  #   update_quickhelp.js — generated help text
  #   **/__tests__/**, **/__mocks__/**, **/tests/**, **/coverage/** — test code
  #   .claude/**, .agents/**, _bmad/**, _bmad-output/** — agent tooling and
  #     generated BMAD artifacts, never shipped
  # Production entrypoint components/document-repository/scripts/clamav-node.sh
  # is INTENTIONALLY left scanned (clamav-node.sh is the CMD of the prod image)
  # Re-enable other excluded paths only if they become shipping code
# nodejs-scan-sast is DEPRECATED (GitLab 16.8, removed 17.0) — the template
# ships it as an exit-1 stub. semgrep-sast covers JS. Disable it explicitly.
nodejs-scan-sast:
  rules:
    - when: never
# spotbugs-sast is the Java analyzer. The repo does contain Java — the vendored
# flutter_appauth fork under mobile/genie_ai_mobile/flutter_appauth/, whose
# classes are compiled into every APK — but it is a `path:` dependency, not a
# Gradle project of ours, so the analyzer tries to build a project that does
# not exist and fails (advisory noise). Keeping it disabled also keeps the
# fork out of the SAST report: the fork is on the SAST_EXCLUDED_PATHS list
# (see the exclusion rationale above), so a SpotBugs run would report the
# trust-all TLS builder that the exclusion deliberately removes.
#
# Consequence to keep in mind: the Java surface has semgrep-only coverage, and
# the vendored fork has no static analysis at all — its gates are pinned by
# mobile/genie_ai_mobile/test/config/flutter_appauth_insecure_gate_test.dart
# instead. Re-enabling the analyzer is tracked in #1103.
spotbugs-sast:
  rules:
    - when: never
gemnasium-dependency_scanning:
  rules: *security_run_rules
gemnasium-python-dependency_scanning:
  rules: *security_run_rules
kics-iac-sast:
  rules: *security_run_rules
# Container scanning: override the template's default `test` stage and
# `allow_failure: true` so scans block promotion (the promote:IMAGE job
# `needs:` the scan:IMAGE job and fails if it didn't produce a valid
# container_scanning report). Per-image CS_IMAGE is set by each scan:IMAGE
# job that extends `container_scanning`. Rules follow the security_run_rules
# so scans run on MR + main + release branches.
container_scanning:
  stage: scan
  allow_failure: false
  variables:
    # Trivy scan timeout — some images (e.g. genie-ai-retriever-arango, which
    # carries the full OPEA overlay Python deps tree) hit the default 5m
    # deadline on the GPU runner. Bump to 30m (Trivy's own default if
    # TRIVY_TIMEOUT is unset is 5m per the docs).
    TRIVY_TIMEOUT: "30m"
  rules:
    - when: never
  # The artifact paths override remains so `promote:IMAGE` can still
  # fetch the report and SBOM as paths via
  # `needs: [scan:IMAGE, artifacts: true]`.
  #
  # This overrides the natif template's artifact upload: the natif
  # `container_scanning` job uploads the vulnerability report and
  # `**/gl-sbom-*.cdx.json` (CycloneDX SBOM) as GitLab REPORT artifacts
  # automatically. We re-declare them as PATHS artifacts here so that
  # `promote:IMAGE` can fetch them (`artifacts: true` on the needs entry),
  # rewrite the image reference inside both JSONs
  # (`tmp/IMAGE:cand` → `IMAGE:primary_tag`) and re-upload — so the
  # SBOM/vulnerability tabs track the released image, not the tmp/
  # scratch ref. Without this, users would see a SBOM whose
  # `metadata.component` references `tmp/genie-ai-frontend:mr-123-abc` —
  # a deleted image.
  artifacts:
    paths:
      - gl-container-scanning-report.json
      - "**/gl-sbom-*.cdx.json"

.build_template: &build_template
  stage: build
  image: docker:28
  tags: [docker]
  interruptible: true
  # Builds consume only the checkout (docker buildx) — no upstream artifacts.
  # Without this, GitLab's default makes every build job download ALL
  # test-stage artifacts (scan reports, JUnit XML) — pure waste, and the
  # 2026-09-02/03 instance flake (intermittent 403 on artifact downloads,
  # uploads fine) killed builds before their script ran.
  dependencies: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - if [ -n "$DOCKER_HUB_USER" ]; then echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin docker.io; fi
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      REGISTRY_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:${CANDIDATE_TAG}"
      CACHE_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:cache-${CI_COMMIT_REF_SLUG}"
      echo "Building $IMAGE_NAME → ${REGISTRY_REF}"
      docker buildx build \
        --pull \
        --push \
        -t "$REGISTRY_REF" \
        -f "$DOCKERFILE" \
        --cache-from "type=registry,ref=$CACHE_REF" \
        --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
        "$CONTEXT"


# Per-image container scan anchor. Inherits the GitLab Container-Scanning
# template's `container_scanning` job (defined in Jobs/Container-Scanning.gitlab-ci.yml,
# included above). The template produces gl-container-scanning-report.json
# conforming to schema 15.x.x — the previous custom Trivy-only script produced
# `SchemaVersion: <int>` at the report root instead of the required `version: "<semver>"`,
# which the GitLab UI rejected as "Report version not provided" (security
# dashboard "Parsing errors" in pipelines 6385 and 6402).
#
# Each scan:IMAGE job extends container_scanning via this alias (kept for
# backward compatibility with the 15 existing scan:IMAGE jobs), sets its own
# CS_IMAGE to the corresponding tmp/... image built in stage `build`, and adds
# rules so the scan only runs when relevant files change. The
# global container_scanning override above moves the stage from `test` to
# `scan` and disables allow_failure.
.scan_template: &scan_template
  extends: container_scanning
  # Compute the dynamic CS_IMAGE in before_script. The build_template pushes
  # two possible tag shapes: mr-{iid}-{short} on MR pipelines and
  # pending-{short} on branch/tag pipelines. We resolve which one exists at
  # scan time, falling back to pending-{short} (which always exists post-build).
  # The override is required because GitLab CI variables can't do conditional
  # assignment based on $CI_PIPELINE_SOURCE inline — the natif gtcs scan only
  # reads $CS_IMAGE literally.
  before_script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      export CS_IMAGE="${CI_REGISTRY_IMAGE}/tmp/${IMAGE_NAME}:${CANDIDATE_TAG}"
      echo "Scanning $CS_IMAGE"
  # Drop the natif `reports.container_scanning` + `reports.cyclonedx` uploads.
  # We override each report with an empty string — GitLab CI deep-merges
  # `extends:` artifacts, so an empty `reports: {}` keeps the parent's
  # reports intact (it just adds nothing). Setting each report path to
  # `''` actually neutralizes the corresponding upload. The single
  # GitLab-schema-compliant upload happens in `promote:IMAGE` after the
  # sed rewrite from `tmp/<IMAGE>:cand` → `<IMAGE>:primary_tag`. Paths
  # are preserved (natif) so promote can still fetch via `artifacts: true`.
  artifacts:
    reports:
      container_scanning: ""
      cyclonedx: ""


.promote_template: &promote_template
  stage: promote
  image: docker:28
  tags: [docker]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        SRC="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        SRC="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:pending-${CI_COMMIT_SHORT_SHA}"
      fi
    - DIGEST="sha256:$(docker buildx imagetools inspect --raw "$SRC" | sha256sum | awk '{print $1}')"
    - echo "Promoting $IMAGE_NAME digest ${DIGEST:0:32}... (tmp/ → real namespace)"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Pre-release tags (alpha, beta, rc) must NOT update "latest"
        if echo "$CI_COMMIT_TAG" | grep -qE -- '-(alpha|beta|rc)'; then
          echo "Pre-release tag detected — skipping 'latest' Docker tag"
          FINAL_TAGS="$CI_COMMIT_TAG"
        else
          FINAL_TAGS="$CI_COMMIT_TAG latest"
        fi
      else
        BRANCH_TAG="${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        BRANCH_TAG="${BRANCH_TAG//\//-}"
        # For version release branches (release/X.Y — digits only): tag as vX.Y.
        # Deployment branches (release/el-salvador) keep their full name.
        # See docs/RELEASE.md §2 for branch naming rules.
        case "$BRANCH_TAG" in
          release-[0-9]*.[0-9]*) BRANCH_TAG="v${BRANCH_TAG#release-}" ;;
        esac
        FINAL_TAGS="${BRANCH_TAG}-${CI_COMMIT_SHORT_SHA} ${BRANCH_TAG}"
      fi
    - |
      for t in $FINAL_TAGS; do
        docker buildx imagetools create -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$t" "$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME@${DIGEST}"
      done
    - skopeo delete "docker://$SRC" 2>/dev/null || true
    # Rewrite tmp/ image names → promoted names in the container scanning report.
    # Same digest, correct name → GitLab vulnerability report tracks real images.
    # Uses the first (primary) tag from the promote step (e.g. main-<sha>, v2.1.0, vX.Y-<sha>).
    # Scan failures block promotion (security policy). Promote handles missing reports gracefully
    - |
      # Both the container-scanning report (schema 15.x.x) and the CycloneDX
      # SBOM were produced by the natif gtcs scan in scan:IMAGE with image=
      # `tmp/<IMAGE>:<cand>`. We rewrite BOTH to point at the final promoted
      # image (`<IMAGE>:<primary_tag>`), then upload as the single GitLab-
      # schema-compliant reports. Doing this once (in promote, not in scan)
      # avoids GitLab seeing duplicate vulnerability sets / SBOM entries with
      # different fingerprints per image name.
      PRIMARY_TAG="${FINAL_TAGS%% *}"
      if [ -f gl-container-scanning-report.json ]; then
        sed "s|tmp/${IMAGE_NAME}:[^\"() ]*|${IMAGE_NAME}:${PRIMARY_TAG}|g" \
          gl-container-scanning-report.json > gl-container-scanning-report.json.tmp \
          && mv gl-container-scanning-report.json.tmp gl-container-scanning-report.json
        echo "Rewrote container_scanning report: tmp/${IMAGE_NAME}:* → ${IMAGE_NAME}:${PRIMARY_TAG}"
      else
        echo "ERROR: gl-container-scanning-report.json not found (scan:IMAGE did not produce one) — blocking promotion (NFR-S1 supply-chain integrity)"
        exit 1
      fi
      # CycloneDX SBOMs produced by the natif container-scanning analyzer are
      # named `gl-sbom-<cand>.cdx.json`. The image reference appears in
      # `metadata.component.name` and component purls. We rewrite
      # `tmp/<IMAGE>:<cand>` → `<IMAGE>:<primary_tag>` everywhere.
      SBOM_FILE=$(ls gl-sbom-*.cdx.json 2>/dev/null | head -1)
      if [ -n "$SBOM_FILE" ] && [ -f "$SBOM_FILE" ]; then
        sed "s|tmp/${IMAGE_NAME}:[^\"() ]*|${IMAGE_NAME}:${PRIMARY_TAG}|g" \
          "$SBOM_FILE" > "$SBOM_FILE.tmp" \
          && mv "$SBOM_FILE.tmp" "$SBOM_FILE"
        echo "Rewrote SBOM ${SBOM_FILE}: tmp/${IMAGE_NAME}:* → ${IMAGE_NAME}:${PRIMARY_TAG}"
      else
        echo "WARN: gl-sbom-*.cdx.json not found — SBOM tab will not be populated for ${IMAGE_NAME}"
      fi
  artifacts:
    paths:
      - gl-container-scanning-report.json
      - gl-sbom-*.cdx.json
    reports:
      container_scanning: gl-container-scanning-report.json
      cyclonedx: gl-sbom-*.cdx.json

# ---------------------------------------------------------------------------
# Contract tests vs REAL vendored comps — run INSIDE the built image (D3)
# ---------------------------------------------------------------------------
# The existing `test:op` job runs the OPEA pytest suite against a MOCKED `comps`
# (tests/conftest.py stubs it in sys.modules) — blind to runtime comps API
# changes. These jobs run the `genie-ai-overlay/contracts/` suite against the
# REAL vendored comps inside each built module image. Invocation per
# architecture pattern 3: `docker run <image> pytest /contracts/... -p no:cacheprovider`.
.contract_template: &contract_template
  stage: contract-in-image
  image: docker:28
  tags: [docker]
  interruptible: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      REGISTRY_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:${CANDIDATE_TAG}"
      CID="contract-${CI_JOB_ID}"
      echo "Running contract tests for $IMAGE_NAME (${REGISTRY_REF}) against real vendored comps"
      # docker create + docker cp (NOT -v): under DinD the daemon cannot see the
      # runner's filesystem, so a -v mount of $PWD yields an EMPTY /contracts.
      # docker cp transfers the suite into the container via the daemon instead.
      docker create --name "$CID" --entrypoint sh "$REGISTRY_REF" \
        -c "pip install -q pytest pytest-asyncio && cd /contracts && python -m pytest ${CONTRACT_TEST_PATTERN} -p no:cacheprovider --junitxml=/tmp/contract-report.xml"
      docker cp genie-ai-overlay/contracts/. "$CID":/contracts/
      docker start -a "$CID"
      EXIT=$?
      mkdir -p reports
      docker cp "$CID":/tmp/contract-report.xml reports/contract-report.xml 2>/dev/null || true
      docker rm -f "$CID" >/dev/null 2>&1 || true
      exit $EXIT
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: reports/contract-report.xml
    paths:
      - reports/contract-report.xml

contract:retriever-arango:
  <<: *contract_template
  needs:
    - job: build:retriever-arango
  variables:
    IMAGE_NAME: "genie-ai-retriever-arango"
    # Retriever in-image suite — ONLY tests that run against the retriever
    # image's real comps (no repo-side tests, no dataprep-side tests → no skips).
    # telemetry + streaming moved to `contract:unit` (repo-side); the ingest
    # budget lives in `contract:dataprep-arango`.
    CONTRACT_TEST_PATTERN: "test_contract_orchestrator_wire.py test_contract_label_filter.py test_contract_retriever_fusion.py test_contract_e2e_pipeline.py::test_label_filter_contract_roundtrip test_contract_e2e_pipeline.py::test_label_filter_contract_empty_is_noop test_contract_e2e_pipeline.py::test_e2e_graph_schedules_real_orchestrator test_contract_nfrp_budgets.py::test_wire_latency_within_budget test_contract_nfrp_budgets.py::test_budget_table_present"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: ["genie-ai-overlay/retriever/**/*", "genie-ai-overlay/core/**/*", "genie-ai-overlay/contracts/**/*", ".gitlab-ci.yml"]
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: ["genie-ai-overlay/retriever/**/*", "genie-ai-overlay/core/**/*", "genie-ai-overlay/contracts/**/*", ".gitlab-ci.yml"]
    - if: $CI_COMMIT_BRANCH =~ /^release\//
