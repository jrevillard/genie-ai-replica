apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "rbac") | nindent 4 }}
  annotations:
    # Hook-owned (pre-install,pre-upgrade) so the dep-check Job
    # (weight -5) finds the SA at job-creation time. Regular
    # resources render AFTER all hooks, so a non-hook SA would be
    # absent when the Job tries to schedule — symptom: `serviceaccount
    # "X-dep-check" not found` at the very first Job event.
    #
    # Why this used to fail with 'namespace "X" not found': the SA's
    # target namespace is the release namespace, and `helm install
    # --create-namespace` creates it AFTER hooks, not before, so a
    # hook-owned SA targeting the release namespace failed.
    #
    # What makes it safe is NOT a chart hook — there is no namespace
    # pre-install hook, and templates/namespace.yaml renders the
    # in-namespace ArangoDB RBAC, not a Namespace object. It is the
    # INSTALLER: the HelmRelease sets `install.createNamespace: true`,
    # and Flux creates the namespace before it runs helm at all, so
    # every hook finds it. A plain `helm install --create-namespace`
    # does NOT, which is why the Quickstart's install command has to
    # work for a namespace that already exists.
    #
    # hook-weight -10 sits between the Role/RoleBinding (-30, which
    # also need the namespace to exist) and the dep-check Job (-5,
    # which consumes the SA). The RoleBinding's `subjects:` field is
    # a name string — the API accepts the binding even when the SA
    # doesn't exist yet, so the binding can run first and the SA
    # just needs to exist before the Job schedules.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    # Same delete policy as the Role + RoleBinding: survive past
    # install so the helm-test pod (which reuses this SA after
    # install) can still bind to it. Deleted only on the next
    # install, before the new hook runs.
    "helm.sh/hook-delete-policy": before-hook-creation
