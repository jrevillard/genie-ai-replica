version: '3.8'

volumes:
  redis_data:
services:
  frontend:
    build: ./gov-chat-frontend
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - ./gov-chat-frontend/.env
    depends_on:
      - backend
    networks:
      - chatqna_default

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379" # Optional: Expose on host for debugging
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "!@#$$5678"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatqna_default

  backend:
    build:
      context: .
      dockerfile: gov-chat-backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./database_backups:/app/database_backups
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gov-chat-backend/Uploads:/app/Uploads
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret}
    env_file:
      - ./gov-chat-backend/.env
    depends_on:
      redis-cache:
        condition: service_healthy
    networks:
      - chatqna_default
  
  document-repository:
    build:
      context: .
      dockerfile: document-repository/Dockerfile
    container_name: doc-repo-dev
    environment:
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_PASSWORD=test
      - DOCUMENT_INGESTION_LANGUAGE=en
      - VIRUS_SCANNING=true
    depends_on:
      - clamav
    ports:
      - "3001:3001"
    networks:
      - chatqna_default
    volumes:
      - ./logs:/app/logs
  
  clamav:
    # image: mkodockx/docker-clamav:alpine
    image: clamav/clamav
    container_name: clamav
    ports:
      - "3310:3310" # ClamAV daemon port
    networks:
      - chatqna_default

networks:
  chatqna_default:
    external: true
