{{- if .Values.secrets.sealedSecrets.enabled -}}
{{- /*
  Stateless-tier SealedSecrets.
  grafanaAdminPassword ships with observability services (not here).

  Service-to-K8s mapping (Secret name → encryptedData key = ENV VAR NAME):
    emailPassword              → email-password                   (key EMAIL_PASSWORD)
    huggingFaceHubToken        → huggingface-hub-token            (key HUGGING_FACE_HUB_TOKEN)
    translationCachePassword   → translation-cache-password       (key TRANSLATION_CACHE_PASSWORD)
    keycloakProxyClientSecret  → keycloak-proxy-client-secret     (key KEYCLOAK_PROXY_CLIENT_SECRET)
    kcDataprepClientSecret     → kc-dataprep-client-secret        (key KC_DATAPREP_CLIENT_SECRET)
    kcGrafanaClientSecret      → kc-grafana-client-secret         (key KC_GRAFANA_CLIENT_SECRET)
  The factory consumes each Secret whole via envFrom: every
  encryptedData key becomes an env var verbatim — keys must BE the env
  var names, not "password"/"token".

  The 3 Keycloak client secrets must equal the values rendered into the
  KeycloakRealmImport CR (`data.keycloak.clientSecrets.{proxyClient,
  dataprep, grafana}`) — the realm CR cannot read Kubernetes Secrets, so
  the install-time values-override carries the same string in both
  places. The pre-install drift hook detects a sealed-but-unsealed
  sentinel (`UExBQ0VIT0xERVIr`); the pre-upgrade-sealed-secret-validate
  hook re-checks before upgrades.
*/ -}}
{{- $g5 := dict
      "email-password" "EMAIL_PASSWORD"
      "huggingface-hub-token" "HUGGING_FACE_HUB_TOKEN"
      "translation-cache-password" "TRANSLATION_CACHE_PASSWORD"
      "keycloak-proxy-client-secret" "KEYCLOAK_PROXY_CLIENT_SECRET"
      "kc-dataprep-client-secret" "KC_DATAPREP_CLIENT_SECRET"
      "kc-grafana-client-secret" "KC_GRAFANA_CLIENT_SECRET" -}}
{{- range $secretName, $envKey := $g5 }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" $.Chart "Release" $.Release "Values" $.Values "component" "sealed-secret") | nindent 4 }}
spec:
  encryptedData:
    {{ $envKey }}: UExBQ0VIT0xERVIr     # PLACEHOLDER+ — RE-SEAL before helm install
{{- end -}}
{{- end -}}
