stages:
  - lint
  - test
  - config      # env-var coverage + changelog validation + dependency-lock freshness (fail-fast before build)
  - build       # publish candidate images to GitLab Container Registry (tmp/ namespace)
  - scan        # GitLab official Container Scanning template (advisory + dashboard)
  - contract-in-image   # contract tests vs REAL vendored comps, run inside the built image (D3)
  - e2e
  - promote     # retag tested digests to deployable tags (main/tags only)
  - release     # create GitLab Release from changelog (tag pipelines only)
  - scheduled
  - manual
  - deploy

variables:
  FLUTTER_VERSION: "3.41.7"
  # Anti-drift pins for the Python test lanes (review 84594): one source of
  # truth — a version bump edits these two lines, not three jobs.
  RUFF_VERSION: "0.16.3"
  PYTEST_VERSION: "9.1.1"
  FLUTTER_ARCHIVE: "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
  # --- Container build/scan/promote pipeline (see docs/adr/0001-gitlab-registry-build-scan-pipeline.md) ---
  GIT_DEPTH: "0"  # full history needed for CI_COMMIT_SHORT_SHA stability across matrix jobs
  TRIVY_IMAGE_TAG: "aquasec/trivy:0.57.0"
  SYFT_VERSION: "v1.26.0"
  # --- OKF content-only chunking (Story 4.8-amend) ---
  # The okf-server internal concept-status callback is fail-closed: any test
  # that exercises the live dataprep → okf-server path needs this same value on
  # both ends. Unit tests mock it; the CI default is a non-prod sentinel.
  OKF_INTERNAL_SECRET: "ci-okf-internal-secret-not-for-production"
  DATAPREP_URL: "http://dataprep-arango-service:5000"
  # --- SAST exclusions: dev/test-only paths and known-not-relevant targets ---
  # Variable consumed by both semgrep-sast and kics-iac-sast (both honor
  # SAST_EXCLUDED_PATHS). Do NOT use SEARCH_IGNORED — it is not honored by
  # any official GitLab SAST template and will be silently dropped.
  # - mobile/**/windows/: Windows desktop CMake runner, not deployed to Docker Swarm prod
  # - mobile/genie_ai_mobile/flutter_appauth/**: the vendored checkout of the
  #   flutter_appauth plugin (a `path:` dependency in
  #   mobile/genie_ai_mobile/pubspec.yaml, which resolves to the
  #   flutter_appauth/flutter_appauth package inside it). The checkout is a melos
  #   monorepo: the app compiles only that one package, and the rest of the
  #   checkout (the platform-interface package, the upstream GitHub Actions
  #   workflows) is upstream code we do not run. The glob covers the whole
  #   checkout on purpose: narrowing it to the compiled package was tried and
  #   measured, and the fork's upstream workflows then produced 9 kics findings
  #   that nobody owns (docs/security/cve-triage-2026q3.md, wave-6).
  #
  #   Why the tree is excluded: it carries TLS-verification-disabling code —
  #   Android InsecureConnectionBuilder, iOS InsecureURLProtocol — that no
  #   analyzer should keep reporting on every run. Both are reachable only when
  #   KeycloakConfig.allowInsecureConnections is true.
  #
  #   Provenance: the trust-all code is partly ours. Upstream ignores
  #   allowInsecureConnections on iOS (MaikuB/flutter_appauth#386), so the fork
  #   adds the NSURLProtocol interception, and GENIE.AI adds the
  #   allowInsecureConnections gate in FlutterAppauthPlugin.java.
  #
  #   What makes the exclusion safe: the flag is off in the itu, staging and
  #   per-institution flavor configs (the per-institution template leaves it at
  #   its safe default) — asserted by
  #   mobile/genie_ai_mobile/test/config/keycloak_config_test.dart, which the
  #   test:flutter job also runs a second time with --dart-define=FLAVOR=itu
  #   (the release recipe, exercised rather than asserted). The gates inside the
  #   fork itself are asserted by
  #   mobile/genie_ai_mobile/test/config/flutter_appauth_insecure_gate_test.dart:
  #   once the tree is out of the scan nothing else checks them, and the fork is
  #   rebased onto upstream from time to time.
  #
  #   The FLAVOR gap is closed: the documented build commands set both
  #   selectors — see mobile/genie_ai_mobile/README.md (§ Build Flavors),
  #   mobile/genie_ai_mobile/CLAUDE.md (§ Build & Run) and
  #   site/content/en/docs/mobile/mobile-deployment-guide.md (§ Build) — and
  #   getConfig() fails at startup in a release or profile build made without
  #   the define (#1099), so the missing-define fallback cannot reach a
  #   release artifact any more. An explicit FLAVOR=dev release fails at
  #   startup too — getConfig() refuses any configuration with
  #   allowInsecureConnections on in a release artifact (#1099), and
  #   build-release.ps1 refuses dev/e2e on the artifact path as well.
  # - genie-ai-overlay/contracts/: real-comps contract tests (test code, NOT shipped in image)
  # - **/scripts/**: dev/migration scripts NOT shipped in container. We list specific
  #   sub-patterns (rather than the broad **/scripts/) so the production entrypoint
  #   `components/document-repository/scripts/clamav-node.sh` stays scanned.
  # - scripts/okf-testing-lab/**: RAGAS testing-lab CLI helpers, run by hand —
  #   NOT shipped in a container. CAVEAT (review 2026-10-29): two of these
  #   modules are REQUIRED by CI-run okf-server Jest suites since commit
  #   c40e9ea03 (ragas-compare-runs.js, ragas-regenerate-entry.js), so their
  #   SAST findings are invisible by construction — and any future lab helper
  #   a test needs lands in the same blind spot. Moving the shared helpers to
  #   a scanned location belongs to the post-train slimming pass.
  # - **/seed-*.js: synthetic data generators, never executed at runtime
  # - **/__tests__/, **/__mocks__/, **/tests/, **/coverage/: test code + generated reports
  # - .claude/**: Claude Code agent skills, hooks, BMAD orchestration YAML. Not
  #   production code; YAML files use BMAD-specific syntax that semgrep can't
  #   parse, generating "Parsing errors" UI noise in the security dashboard.
  #   NOTE: the BMAD skills under .claude/skills/ (bmad, bmad-*, …) are symlinks
  #   into .agents/skills/*, so excluding .claude/** alone does NOT exclude the
  #   real sources — .agents/** below is what actually keeps the agent tooling
  #   out of the scan. (.claude/skills/test-audit is a real directory, not a
  #   symlink, and is covered by .claude/** itself.)
  # - .agents/**: source tree of the BMAD agent skills that .claude/skills/* points
  #   at. Agent tooling for AI assistants: never copied into a container image,
  #   never executed in production. Same rationale as _bmad/** below.
  # - _bmad/**: BMAD/WDS agent framework modules (build tooling for AI agents,
  #   never shipped or executed in production).
  # - _bmad-output/**: generated BMAD planning/implementation/spec artifacts.
  # NOTE: gemnasium (dependency scanning) does NOT honor this var — see DS_EXCLUDED_PATHS
  # below. Secret Detection is intentionally NOT excluded (SECRET_DETECTION_EXCLUDED_PATHS
  # stays unset) so secrets in any BMAD sample content still surface in the dashboard.
  SAST_EXCLUDED_PATHS: >-
    mobile/**/windows/**,
    mobile/genie_ai_mobile/flutter_appauth/**,
    genie-ai-overlay/contracts/**,
    **/seed-*.js,
    **/scripts/seed-*.js,
    **/scripts/migrations/**,
    scripts/okf-testing-lab/**,
    **/scripts/new-schema-scripts/**,
    **/__tests__/**,
    **/__mocks__/**,
    **/tests/**,
    **/coverage/**,
    .claude/**,
    .agents/**,
    _bmad/**,
    _bmad-output/**
  # --- Dependency Scanning exclusions (gemnasium + gemnasium-python) ---
  # Comma-separated pathspec list, honored by both analyzers. Without these
  # excludes, gemnasium-python entered _bmad/scripts/setup.py on job 93669
  # (pipeline 7575, MR 343) and exited 1 with no report written — gemnasium-
  # python analyzes one dep-dir per run, so picking up a BMAD script blocks
  # the whole pipeline. Scope kept narrow on purpose: do NOT add tests/** —
  # gemnasium reads manifests (pyproject.toml, setup.py, requirements*.txt,
  # package.json), and a test fixture declaring its own deps is a real dep
  # signal we want surfaced.
  # Secret Detection is intentionally NOT excluded (see SAST comment above).
  # NOTE: separator is comma, NOT semicolon — semicolon-separated values are
  # silently ignored by gemnasium v6 (verified on job 93734).
  # .agents/** mirrors the SAST exclusion above. Measured on pipeline 14093
  # (main, before this exclusion): the python analyzer reported exactly one
  # dependency root ("Detected supported dependency files in
  # 'genie-ai-overlay'"), never listed .agents among the directories it
  # skipped, and produced a single SBOM (genie-ai-overlay/gl-sbom-pypi-uv.cdx.json)
  # — the tree's only manifest (.agents/skills/bmad/scripts/setup.py) was not
  # scanned. The exclusion is therefore insurance against a future skill
  # dropping a manifest where the analyzer would pick it up as a dependency
  # root and block the whole dependency-scanning job; it is not a fix for an
  # observed failure.
  DS_EXCLUDED_PATHS: "_bmad/**,_bmad-output/**,.claude/**,.agents/**"

# Prevent duplicate branch+MR pipelines — first match wins
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\//

# --- Hidden job templates (DRY, reusable by Story 1.3 test stage) ---

.node_base:
  # node:22-alpine: Node 20 reached EOL (2026-04-30) and a stale cached
  # node:20 image older than 20.19 ran every node job below ESLint 10's
  # engines floor (^20.19.0 || ^22.13.0 || >=24) (#1417). Node 22 is
  # maintained into 2027; the floating tag tracks the current 22.x, which
  # sits above that floor.
  image: node:22-alpine
  interruptible: true

.lint_node:
  extends: .node_base
  stage: lint

.test_node:
  extends: .node_base
  stage: test
  # No cache (#1528): npm ci deletes node_modules before installing, so a
  # restored tree is never read — same reasoning as .lint_component (#1413).
  variables:
    NODE_ENV: test
  artifacts:
    when: always
    expire_in: 7 days

.flutter_base:
  image: debian:bookworm-slim
  interruptible: true
  variables:
    PUB_CACHE: $CI_PROJECT_DIR/.pub-cache
  cache:
    - key: "flutter-sdk-${FLUTTER_VERSION}"
      paths:
        - flutter-sdk/
    - key:
        files:
          - mobile/genie_ai_mobile/pubspec.lock
      paths:
        - mobile/genie_ai_mobile/.dart_tool/
        - .pub-cache/
      fallback_keys:
        - "flutter-deps-$CI_DEFAULT_BRANCH"
        - "flutter-deps-"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils python3 python3-venv python3-pip
    - |
      if [ ! -d "flutter-sdk/bin" ]; then
        echo "Installing Flutter ${FLUTTER_VERSION}..."
        curl -fsSL "${FLUTTER_ARCHIVE}" | tar -xJ
        mv flutter flutter-sdk
      fi
    - git config --global --add safe.directory "$PWD/flutter-sdk"
    - export PATH="$PWD/flutter-sdk/bin:$PATH"
    - flutter --version
    - cd mobile/genie_ai_mobile
    - flutter pub get

# --- E2E integration base (shared by e2e:integration + scheduled:integration) ---

.e2e_integration_base:
  image: docker:24
  variables:
    COMPOSE_PROJECT_NAME: "ci-$CI_PIPELINE_ID"
    # Pull candidate images from the tmp/ quarantine namespace (where build:image
    # pushes pre-promote candidates). GENIE_AI_GLOBAL_TAG matches the candidate tag.
    GENIE_AI_REGISTRY: "$CI_REGISTRY_IMAGE/tmp"  # e2e pulls candidates from tmp/ namespace
  allow_failure: false
  tags: [docker]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  before_script:
    # bash: check-runtime.sh is a bash script — docker:24 ships only sh
    # (verified: `command -v bash` empty in the image); without this the
    # gate line exits 127 and the runtime contract is never enforced.
    - apk add --no-cache bash docker-cli-compose curl
    # Authenticate to the GitLab registry so `docker compose pull` succeeds
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - if [ -n "$DOCKER_HUB_USER" ]; then echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin docker.io; fi  # avoid anonymous Docker Hub rate limits
    - |
      for p in $(docker compose ls -q 2>/dev/null | grep '^ci-'); do
        echo "Cleaning up previous project: $p"
        docker compose -p "$p" down -v --remove-orphans 2>/dev/null || true
      done
    - docker network prune -f 2>/dev/null || true
    # No manual pre-create here anymore (#1227): backend-init creates and
    # chowns data/database_backups at first up (both it and the guarded
    # backend mount carry explicit create_host_path:true), secrets-ssl-init
    # does the same for secrets/ssl (root:101) — the root-owned moment
    # lives between CREATE and init completion, never once the gated
    # services run.
  script:
    - cp env .env
    - sed -i '/^GENIE_AI_[A-Z0-9_]*_IMAGE=/ s|^|# |' .env
    - |
      while IFS='=' read -r var _; do
        case "$var" in ''|[!A-Z_]*) continue ;; esac
        eval "val=\${$var:-}"
        if [ -n "$val" ]; then
          sed -i "s|^${var}=.*|${var}=${val}|" .env
        fi
      done < env
    - |
      # KEYCLOAK_VERIFY_EMAIL is deliberately NOT rewritten here (#1330): the
      # env template carries the line commented, so the old grep-guarded
      # rewrite was dead code — and had it ever fired, an uncommented
      # template line would have silently flipped the CI realm to
      # verifyEmail: false. The effective e2e posture is the compose default
      # (true), pinned by the config-validator (the env template must not set
      # the var uncommented) and asserted at provisioning time by the
      # fixture-health gate (fresh accounts ship emailVerified + no required
      # actions).
      for var in EMAIL_FROM EMAIL_HOST; do
        if grep -q "^${var}=$" .env; then
          case "$var" in
            EMAIL_FROM) sed -i "s|^${var}=.*|${var}=noreply@ci-genie-ai.local|" .env ;;
            EMAIL_HOST) sed -i "s|^${var}=.*|${var}=localhost|" .env ;;
          esac
        fi
      done
    - |
      # CI runs inside the Docker network — use the nginx service name so
      # Keycloak advertises URLs resolvable from the CI runner container.
      # Mobile tests bypass OIDC discovery (direct token injection) so this
      # only matters for Playwright web E2E.
      echo "NGINX_PUBLIC_DOMAIN=nginx" >> .env
      # Backend must verify JWTs via JWKS at https://nginx/auth/... which uses
      # a self-signed certificate.  Safe for CI — never use in production.
      echo "NODE_TLS_REJECT_UNAUTHORIZED=0" >> .env
    # Pull pre-built candidate images from the GitLab registry so E2E tests run
    # against the exact artifact produced by build:image (not a local rebuild).
    # Candidate tag matches build:image's CANDIDATE_TAG logic.
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        E2E_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        E2E_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      sed -i "s|^GENIE_AI_GLOBAL_TAG=.*|GENIE_AI_GLOBAL_TAG=${E2E_TAG}|" .env
      echo "E2E pulling candidate images tagged :${E2E_TAG}"
    # Pull all custom services from the registry. `up --no-build` below fails
    # loudly if a build:image job didn't publish its candidate, surfacing the
    # breakage here instead of silently rebuilding a different artifact.
    - docker compose pull frontend backend document-repository nginx kong-config db-migrations keycloak keycloak-config postgres-init || true
    - docker compose up -d --no-build || (docker compose logs --tail=50 > docker-compose-logs.txt 2>&1; cat docker-compose-logs.txt; exit 1)
    - |
      # Bounded curls (#1332): a backend that accepts the TCP connection but
      # never answers would otherwise stall the job to its timeout — a dead
      # call must fall through to the next loop iteration (or fail the hard
      # gate below loudly), which is what the loop structure intends.
      for i in $(seq 1 60); do
        if docker exec "ci-${CI_PIPELINE_ID}-backend-1" curl -sf --connect-timeout 5 --max-time 10 http://localhost:3000/api/health > /dev/null 2>&1; then
          echo "Backend healthy"
          break
        fi
        echo "Waiting for backend... ($i/60)"
        sleep 5
      done
    - docker exec "ci-${CI_PIPELINE_ID}-backend-1" curl -sf --connect-timeout 5 --max-time 10 http://localhost:3000/api/health || (docker compose logs --tail=50 > docker-compose-logs.txt 2>&1; cat docker-compose-logs.txt; exit 1)
    # #1227 runtime contract gate: sweep the LIVE stack — long-term root
    # processes, init one-shot discipline, root-owned files on the host
    # binds. The static suite cannot see any of this; without this call
    # the runtime gate exists but nothing ever runs it. WAIT first: the
    # one-shot root inits are contract-exempt ONLY as completed one-shots —
    # a still-sweeping init container is a running uid-0 process and the
    # gate would flag it. Backend health alone does not imply init
    # convergence (backend-init finishes first; victorialogs-init can run
    # minutes longer), and TESTING.md requires a converged stack.
    - |
      INITS_TIMEOUT=0
      for i in $(seq 1 60); do
        # 'running' AND 'restarting': an init sitting in bounded-restart
        # backoff is not 'running' but the gate still inspects it — the
        # wait covers both or it converges on iteration 1 and the gate
        # reports a phantom UNINSPECTABLE violation.
        RUNNING_INITS=$(docker compose ps --format '{{.Service}} {{.State}}' 2>/dev/null | awk '$2=="running" || $2=="restarting" {print $1}' | grep -- '-init$' || true)
        if [ -z "$RUNNING_INITS" ]; then echo "One-shot inits converged"; break; fi
        echo "Waiting for one-shot inits to converge: $RUNNING_INITS ($i/60)"; sleep 5
        INITS_TIMEOUT=1
      done
      if [ "$INITS_TIMEOUT" = "1" ] && [ -n "$RUNNING_INITS" ]; then
        echo "INIT CONVERGENCE TIMEOUT after 300s: $RUNNING_INITS still active — the gate needs a converged stack (TESTING.md); fix the slow init instead of chasing a phantom root process."
        exit 1
      fi
    - bash tests/compose-non-root/check-runtime.sh "ci-${CI_PIPELINE_ID}"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - docker-compose-logs.txt

# --- Shared: Docker compose network connection + NGINX IP discovery ---
# Used by .e2e_web_base to mutualize networking logic.
.connect_compose_network: &connect_compose_network
  - |
    COMPOSE_NET=$(docker network ls --filter "label=com.docker.compose.project=ci-${CI_PIPELINE_ID}" --format '{{.Name}}' | head -1)
    if [ -z "$COMPOSE_NET" ]; then
      COMPOSE_NET="ci-${CI_PIPELINE_ID}_default"
    fi
    echo "Compose network: $COMPOSE_NET"
    CI_CONTAINER_ID=$(docker ps --filter "label=com.gitlab.gitlab-runner.job.id=$CI_JOB_ID" --format '{{.ID}}' | head -1)
    if [ -z "$CI_CONTAINER_ID" ]; then
      CI_CONTAINER_ID=$(docker ps --filter "name=runner" --format '{{.Names}}' | grep "concurrent" | head -1 | sed 's/-predefined$//')
    fi
    echo "CI container: $CI_CONTAINER_ID"
    if docker network inspect "$COMPOSE_NET" >/dev/null 2>&1; then
      docker network connect "$COMPOSE_NET" "$CI_CONTAINER_ID" 2>/dev/null || true
      echo "CI container connected to compose network: $COMPOSE_NET"
    else
      echo "WARNING: Compose network $COMPOSE_NET not found — tests may fail"
    fi
    NGINX_CONTAINER=$(docker ps --filter "name=nginx" --format "{{.Names}}" | grep "ci-" | head -1)
    if [ -n "$NGINX_CONTAINER" ]; then
      NGINX_IP=$(docker inspect "$NGINX_CONTAINER" --format "{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}" | awk '{print $1}')
      echo "Nginx container: $NGINX_CONTAINER at $NGINX_IP"
    else
      echo "WARNING: No nginx container found in compose stack"
    fi

# --- E2E web base (shared by e2e:playwright + scheduled:e2e-web) ---

.e2e_web_base:
  extends: .node_base
  # bookworm-slim, not alpine: Playwright's browsers need glibc. Kept on the
  # same Node 22 line as .node_base (#1417) — Node 20 is EOL.
  image: node:22-bookworm-slim
  allow_failure: false
  tags: [docker]
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  cache:
    - key:
        files:
          - package-lock.json
        prefix: e2e-playwright
      paths:
        - node_modules/
      fallback_keys:
        - "e2e-playwright-$CI_DEFAULT_BRANCH"
        - "e2e-playwright-"
    - key:
        files:
          - package-lock.json
        prefix: e2e-playwright-browsers
      paths:
        - .cache/ms-playwright/
  before_script:
    - apt-get update && apt-get install -y docker.io curl python3
    - mkdir -p reports
    - npm ci
    - npx playwright install --with-deps chromium
  script:
    - *connect_compose_network
    - |
      # Use Docker service name for Keycloak OIDC compatibility.
      # curl's %{http_code} is 000 when no HTTP answer exists at all (DNS,
      # connection refused, TLS) — labeled in words for the operator. The
      # helper is defined here, before its first use (GitLab concatenates
      # the script items into one shell).
      http_label() {
        case "${1:-}" in
          000) echo "000 (no HTTP response — connection-level failure)" ;;
          "")  echo "none" ;;
          *)   echo "$1" ;;
        esac
      }
      # Shared response parsing, same concatenation contract as http_label
      # (the kc_curl helper below is their only consumer): curl captures the
      # response with -w '\n%{http_code}', so the status is the last line and
      # the body is everything before it.
      resp_status() {
        local s
        s=$(printf '%s' "$1" | tail -n1)
        # If curl died before emitting the -w trailer, the last line is body
        # text — only an all-digit status is a usable signal.
        case "$s" in ''|*[!0-9]*) s="" ;; esac
        printf '%s' "$s"
      }
      resp_body() {
        printf '%s' "$1" | sed '$d' | head -c 200
      }
      # One shared curl for every Keycloak provisioning call (#1334): one
      # capture path, one flag set. Sets STATUS / BODY / CURL_RC / KC_RAW as
      # globals; BODY is the display form (first 200 chars), KC_RAW keeps the
      # untruncated body-with-trailer for machine parsing. curl's exit code
      # is captured OUTSIDE the command substitution — inside $( ), an
      # assignment vanishes into the subshell and every transport failure
      # looks like a clean exit (the real bug the stub-curl harness caught
      # during #1289). A non-zero CURL_RC means the answer may be truncated
      # mid-transfer: the status is only trustworthy on a clean exit, so
      # every caller here is a retry loop that classifies CURL_RC alongside
      # STATUS (a truncated answer retries; it is never read as a verdict).
      kc_curl() {
        local _kc_method=$1 _kc_url=$2
        shift 2
        CURL_RC=0
        KC_RAW=$(curl -sk --connect-timeout 5 --max-time 10 -w '\n%{http_code}' -X "$_kc_method" "$_kc_url" "$@") || CURL_RC=$?
        STATUS=$(resp_status "$KC_RAW")
        BODY=$(resp_body "$KC_RAW")
      }
      # The JSON-member extraction over KC_RAW, stated ONCE: the capture
      # contract (the -w trailer stripped with sed '$d', the member parsed
      # with python3) — the #1334/#1289 churn was exactly this contract
      # drifting between copies. A definitive Keycloak rejection carries an
      # `error` member, while a gateway interception page answers 401 with
      # HTML that parses to nothing (#1319's classifier input).
      kc_json_member() {
        printf '%s' "$KC_RAW" | sed '$d' \
          | python3 -c "import sys,json; d=json.load(sys.stdin); v=d.get('$1',''); print(v if isinstance(v,str) and v else '')" 2>/dev/null || true
      }
      kc_access_token() { kc_json_member access_token; }
      kc_error_detail() { kc_json_member error; }
      # The master admin token mint through admin-cli's password grant,
      # shared by the readiness loop and the realm client read-back: one
      # flag set for one contract. KC_URL and KC_PWD must be set before the
      # call (they are GitLab script-item locals, not arguments).
      kc_mint_master_token() {
        kc_curl POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
          -d "client_id=admin-cli" -d "username=admin" \
          --data-urlencode "password=${KC_PWD}" -d "grant_type=password"
      }
      # True when the captured answer is a DEFINITIVE Keycloak rejection:
      # an OAuth error body over a CLEAN exit on a definitive status
      # (#1319). A truncated answer (curl exit != 0, the #1334 round-6
      # class), an interception page answering 401 with HTML, and a
      # transient status — even one carrying a JSON error body — are all
      # noise that retries; a truncated answer is never read as a verdict
      # (#1320). Takes the kc_error_detail output as its argument and, as
      # the second, ONE definitive status (a caller with a narrower rule
      # passes its own — the readiness loop's #1319 rule is 401-only); with
      # no second argument the set is 400, 401 and 403.
      kc_is_definitive_rejection() {
        local _detail=$1 _status=$2
        [ "$CURL_RC" -eq 0 ] || return 1
        if [ -n "$_status" ]; then
          case "$STATUS" in "$_status") ;; *) return 1 ;; esac
        else
          case "$STATUS" in 400|401|403) ;; *) return 1 ;; esac
        fi
        [ -n "$_detail" ]
      }
      # Bounded, with a cap loose enough for a slow-but-alive backend that is
      # still warming up (a >30s health answer means the fallback is the
      # better path anyway); a hung nginx must fall through to the NGINX_IP
      # fallback instead of stalling the job.
      HEALTH_CODE=$(curl -sk --connect-timeout 5 --max-time 30 -o /dev/null -w "%{http_code}" https://nginx/api/health 2>/dev/null || true)
      case "$HEALTH_CODE" in *[!0-9]*|"") HEALTH_CODE="000" ;; esac
      if printf '%s' "$HEALTH_CODE" | grep -qE "^[23]"; then
        echo "Nginx reachable via service name"
        E2E_BASE_URL="https://nginx"
      elif [ -n "$NGINX_IP" ]; then
        echo "Falling back to NGINX_IP: ${NGINX_IP} (service-name health probe answered $(http_label "$HEALTH_CODE"))"
        E2E_BASE_URL="https://${NGINX_IP}"
      else
        echo "ERROR: Cannot reach nginx - neither service name nor IP"
        exit 1
      fi
      for var in KEYCLOAK_ADMIN_PASSWORD; do
        eval "val=\${$var:-}"
        if [ -z "$val" ]; then
          echo "ERROR: Missing CI variable: $var"
          exit 1
        fi
      done
    - |
      # Keycloak readiness wait (token + genie-app client visibility). The
      # Playwright suites log in through the browser (loginViaUI) and reuse
      # the session token — no suite run by this job mints ROPC tokens, and
      # the committed realm refuses direct access grants by design.
      # All requests go through nginx/Kong — same path as production traffic.
      KC_URL="${E2E_BASE_URL}/auth"
      KC_PWD="${KEYCLOAK_ADMIN_PASSWORD}"
      ADMIN_TOKEN=""
      CLIENT_FOUND=""
      TOKEN_STATUS=""
      CLIENT_STATUS=""
      TOKEN_ATTEMPTS=0
      CLIENT_ATTEMPTS=0
      TOKEN_FIRST_STATUS=""
      TOKEN_BODY=""
      TOKEN_REJECT_RUN=0
      for i in $(seq 1 90); do
        if [ -z "$ADMIN_TOKEN" ]; then
          TOKEN_ATTEMPTS=$((TOKEN_ATTEMPTS+1))
          kc_mint_master_token
          TOKEN_STATUS=$STATUS
          [ "$TOKEN_ATTEMPTS" = 1 ] && TOKEN_FIRST_STATUS="$TOKEN_STATUS"
          TOKEN_BODY=$BODY
          ADMIN_TOKEN=$(kc_access_token)
          # #1319: a 401 carrying an OAuth error body is a deterministic
          # credentials rejection — retrying cannot heal it, and every failed
          # attempt feeds Keycloak's brute-force protector (which can lock
          # the admin account itself, turning a misconfiguration into an
          # admin-lockout incident). Fail fast after 3 consecutive
          # rejections — enough to ride out a one-off proxy hiccup mimicking
          # a 401 — and keep the full 180s budget reserved for transient
          # conditions (no connection yet, 5xx, realm-import 404 races).
          # The error field is parsed from KC_RAW (the full capture, like
          # the token parse above) — the 200-char display BODY can truncate
          # the JSON before the error member and would hide a real
          # rejection. Whether the answer counts as definitive is
          # kc_is_definitive_rejection's single contract, with #1319's own
          # status set (401): a truncated answer — curl exit != 0, the
          # #1334 round-6 class — may carry a status trailer over a cut
          # body, and a truncated answer is never read as a verdict (#1320);
          # it counts as transient noise and the budget rides it out. Other
          # statuses reset the counter. The parse spawn is skipped for
          # answers that cannot qualify (a non-401 or a truncated capture) —
          # up to 90 iterations would otherwise fork python for a verdict
          # the classifier discards anyway; it stays the verdict authority.
          TOKEN_REJECT_DETAIL=""
          if [ "$TOKEN_STATUS" = "401" ] && [ "$CURL_RC" -eq 0 ]; then
            TOKEN_REJECT_DETAIL=$(kc_error_detail)
          fi
          if kc_is_definitive_rejection "$TOKEN_REJECT_DETAIL" 401; then
            TOKEN_REJECT_RUN=$((TOKEN_REJECT_RUN+1))
          else
            TOKEN_REJECT_RUN=0
            TOKEN_REJECT_DETAIL=""
          fi
          if [ "$TOKEN_REJECT_RUN" -ge 3 ]; then
            echo "ERROR: master admin token definitively rejected (HTTP 401, error '${TOKEN_REJECT_DETAIL}') on ${TOKEN_REJECT_RUN} consecutive attempts — a credentials rejection cannot heal on retry and further attempts feed Keycloak's brute-force protector; failing fast instead of burning the readiness budget. Check KEYCLOAK_ADMIN_PASSWORD."
            exit 1
          fi
        fi
        if [ -n "$ADMIN_TOKEN" ]; then
          CLIENT_ATTEMPTS=$((CLIENT_ATTEMPTS+1))
          kc_curl GET "${KC_URL}/admin/realms/genie/clients?clientId=genie-app" \
            -H "Authorization: Bearer $ADMIN_TOKEN"
          CLIENT_STATUS=$STATUS
          # #1320: the admin token was acquired by THIS loop, so a 401 on
          # the client lookup is a definitive authentication failure of that
          # token — the known cause is a master realm Access Token Lifespan
          # shorter than this readiness wait. Retrying with the same token
          # cannot heal it, and silently re-acquiring would mask the
          # configuration drift; fail with the actual answer instead. Only a
          # clean-exit answer is definitive: a non-zero curl rc means the
          # status may sit over a truncated body (the #1334 round-6 class) —
          # the loop retries, and a genuinely expired token answers cleanly
          # on the next attempt.
          if [ "$CLIENT_STATUS" = "401" ] && [ "$CURL_RC" -eq 0 ]; then
            echo "ERROR: master admin token rejected during the genie-app client lookup (HTTP 401, body: ${BODY:-none}) — the token this run acquired is no longer valid (master realm Access Token Lifespan shorter than the readiness wait is the known cause); failing instead of retrying with a dead token."
            exit 1
          fi
          CLIENT_FOUND=$(printf '%s' "$KC_RAW" | sed '$d' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if isinstance(d, list) and d else '')" 2>/dev/null || true)
        fi
        if [ -n "$CLIENT_FOUND" ]; then
          echo "Keycloak ready (iteration ${i}/90) — genie-app client visible"
          break
        fi
        if [ -n "$ADMIN_TOKEN" ]; then
          echo "Waiting for Keycloak via nginx/Kong... ($i/90) — genie-app client not visible yet (client lookup: HTTP $(http_label "$CLIENT_STATUS"))"
        else
          echo "Waiting for Keycloak via nginx/Kong... ($i/90) — admin token not obtained (HTTP $(http_label "$TOKEN_STATUS"))"
        fi
        sleep 2
      done
      if [ -z "$ADMIN_TOKEN" ]; then
        echo "ERROR: master admin token never obtained via nginx/Kong after ${TOKEN_ATTEMPTS} token attempts (last token call: HTTP $(http_label "$TOKEN_STATUS"))."
        if [ -n "$TOKEN_FIRST_STATUS" ] && [ "$TOKEN_FIRST_STATUS" != "$TOKEN_STATUS" ]; then
          echo "The first attempt answered $(http_label "$TOKEN_FIRST_STATUS") — the per-iteration wait lines above show how the status evolved."
        fi
        if [ -n "$TOKEN_BODY" ]; then
          # A 200 whose body was cut mid-transfer leaves a token PREFIX here
          # (the access_token member prints before the cut) — withhold token
          # material from the job log. The pattern requires the member WITH a
          # value start (`"access_token":` plus optional space), so an
          # interception page that merely names the field stays visible — it
          # is the diagnostic itself.
          case "$TOKEN_BODY" in
            *'"access_token":'*|*'"access_token": '*)
              echo "response body: <withheld — token response material>"
              ;;
            *)
              echo "response body: ${TOKEN_BODY}"
              ;;
          esac
        fi
        case "$TOKEN_STATUS" in
          200)
            echo "The endpoint answered HTTP 200 but the body contained no usable access_token — check for a proxy/SSO interception page in front of ${KC_URL}."
            ;;
          000|"")
            echo "No HTTP answer from the auth path — check the Keycloak container and nginx/Kong routing first (credentials cannot be the cause when no response arrived)."
            ;;
          404|3*|5*)
            echo "The auth path answered with a server or routing error (HTTP ${TOKEN_STATUS}) — check the Keycloak container health and the nginx/Kong routing; the credentials are not the first suspect."
            ;;
          429)
            echo "The auth path is rate-limiting or has locked the admin account after repeated attempts (HTTP 429) — check nginx/Kong throttling settings and the Keycloak brute-force protector."
            ;;
          *)
            echo "This is a token-acquisition failure, not a genie-app client problem — check KEYCLOAK_ADMIN_PASSWORD and master-realm reachability."
            ;;
        esac
        exit 1
      fi
      if [ -z "$CLIENT_FOUND" ]; then
        echo "ERROR: genie-app client not found via nginx/Kong after ${CLIENT_ATTEMPTS} client lookups (last client lookup: HTTP $(http_label "$CLIENT_STATUS"))."
        if [ "$CLIENT_STATUS" = "404" ]; then
          echo "The admin API answered 404 — the genie realm import may not have completed or the /auth routing is wrong; the client configuration is not the first suspect."
        fi
        exit 1
      fi
      # The realm's web client must refuse direct access grants — assert it
      # for genie-app. The credentials are deliberately bogus: the refusal
      # verdict precedes credential validation, so it is unaffected, and a
      # drifted realm can never mint a live token through the probe (it
      # answers invalid_grant instead, classified as drift below).
      # Only unauthorized_client greens the probe: it is the one answer
      # that proves the direct-grants gate was consulted for THIS client.
      # Grant-level denials (unsupported_grant_type, access_denied) cannot
      # distinguish a refused grant from a malformed request — a probe that
      # mis-sends its own grant_type would otherwise self-certify any
      # realm — so they fail as unrecognized, loudly, with the body.
      # Keycloak answers unauthorized_client BEFORE credential validation
      # when directAccessGrantsEnabled is false, so a minted token means the
      # posture drifted. Transport failures, 5xx and 429 retry; transport,
      # gateway and rate-limit verdicts stay distinct from posture verdicts
      # — none of them masquerades as a posture answer.
      # Failure verdicts log the response body they saw, except the
      # token-mint drift case: its body IS the token, never logged.
      ROPC_ANSWERED=""
      ROPC_LAST_ANSWERED=""
      for i in 1 2 3 4 5; do
        rm -f /tmp/ropc-probe-body.json
        # Routed through kc_curl (#1334's one guarded capture path): curl's
        # last-flag-wins semantics let the probe override the helper's
        # --max-time, and -o moves the body to the file so the stdout capture
        # carries only the status trailer.
        kc_curl POST "${KC_URL}/realms/genie/protocol/openid-connect/token" \
          -o /tmp/ropc-probe-body.json --max-time 15 \
          -d "client_id=genie-app" -d "grant_type=password" \
          -d "username=ropc-probe-no-such-user" -d "password=ropc-probe-bogus-credentials"
        ROPC_STATUS=$STATUS
        case "$ROPC_STATUS" in
          # Transient statuses retry even with a clean curl exit; any other
          # definitive status with a clean exit classifies immediately, and
          # a non-zero exit (timeout after headers, reset mid-body) means
          # the answer was truncated — retry it like the other faults.
          408|425|429) ;;
          [234][0-9][0-9])
            ROPC_LAST_ANSWERED="$ROPC_STATUS"
            if [ "$CURL_RC" -eq 0 ]; then ROPC_ANSWERED=1; break; fi ;;
          [56][0-9][0-9]) ROPC_LAST_ANSWERED="$ROPC_STATUS" ;;
        esac
        echo "ROPC probe attempt ${i}/5: no usable answer from the token endpoint (HTTP ${ROPC_STATUS:-none}, curl exit ${CURL_RC})"
        { [ "$i" -lt 5 ] && sleep 5; } || true
      done
      # A truncated 200 token response can land in the body of a transport
      # failure, and JSON member order is not guaranteed — a body from a
      # 2xx answer is withheld outright, and any other body carrying a
      # minted token member within the captured 200 bytes. Error pages
      # that merely mention the words keep their evidence.
      ROPC_BODY=$(head -c 200 /tmp/ropc-probe-body.json 2>/dev/null || true)
      case "$ROPC_BODY" in
        *'"access_token"'*) ROPC_BODY="<token response withheld>" ;;
      esac
      case "$ROPC_STATUS" in
        2[0-9][0-9]) ROPC_BODY="<token response withheld>" ;;
      esac
      if [ -z "$ROPC_ANSWERED" ]; then
        rm -f /tmp/ropc-probe-body.json
        case "$ROPC_STATUS" in
          408|425)
            echo "ERROR: the token endpoint kept failing with transport-level HTTP ${ROPC_STATUS} — not a posture verdict; check the Keycloak upstream health; body: ${ROPC_BODY:-none}"
            ;;
          429)
            echo "ERROR: token endpoint rate-limited the probe (HTTP 429) — not a posture verdict; check gateway rate limiting; body: ${ROPC_BODY:-none}"
            ;;
          *)
            echo "ERROR: no usable answer from the genie token endpoint in 5 attempts (last HTTP ${ROPC_STATUS:-none}, curl exit ${CURL_RC:-0}, last retried HTTP ${ROPC_LAST_ANSWERED:-none}) — transport, gateway or upstream failure, not a posture result; last body: ${ROPC_BODY:-none}"
            ;;
        esac
        exit 1
      fi
      ROPC_FIELDS=$(python3 -c "import sys,json; d=json.load(open('/tmp/ropc-probe-body.json')); print(d.get('error','') + '|' + ('yes' if d.get('access_token') else 'no'))" 2>/dev/null || true)
      ROPC_ERROR=${ROPC_FIELDS%|*}
      ROPC_TOKEN=${ROPC_FIELDS#*|}
      rm -f /tmp/ropc-probe-body.json
      ropc_gateway_fail() {
        echo "ERROR: unexpected HTTP ${ROPC_STATUS} from the genie token endpoint whose answer carried no recognizable Keycloak error — not a posture verdict; check gateway routing (nginx/Kong) or the realm import; body: ${ROPC_BODY:-none}"
        exit 1
      }
      case "$ROPC_STATUS" in
        # Only a clean-exit 2xx-4xx answer reaches this point (exhausted
        # retries exited above), so the transport/rate-limit verdicts live
        # in the exhausted path, not here.
        4[0-9][0-9])
          if [ "$ROPC_ERROR" = "unauthorized_client" ]; then
            # No exit here: GitLab concatenates the script items into one
            # shell, so ANY exit would skip the suites — and an exit 0 would
            # end the job green with zero tests run. Fall through instead.
            echo "ROPC refusal verified at the token endpoint (HTTP ${ROPC_STATUS} ${ROPC_ERROR}) — direct access grants rejected"
          elif [ "$ROPC_ERROR" = "invalid_grant" ]; then
            # Verified on Keycloak 26.7: the direct-grants gate runs before
            # credential validation, so invalid_grant here means the grant
            # was accepted and the credentials rejected — i.e. drift. If a
            # Keycloak upgrade ever reverses that order, a healthy realm
            # answers invalid_grant too and this verdict misfires.
            echo "ERROR: genie realm ROPC posture drifted (HTTP ${ROPC_STATUS}, error 'invalid_grant') — credential validation only runs when the direct-access grant was accepted; directAccessGrantsEnabled must stay false on genie-app; body: ${ROPC_BODY:-none}"
            exit 1
          elif [ "$ROPC_ERROR" = "invalid_client" ]; then
            echo "ERROR: client authentication failed (HTTP ${ROPC_STATUS} invalid_client) — is genie-app still a public client? Check publicClient/KEYCLOAK_CLIENT_SECRET; body: ${ROPC_BODY:-none}"
            exit 1
          elif [ -n "$ROPC_ERROR" ]; then
            echo "ERROR: unexpected error '${ROPC_ERROR}' from the genie token endpoint (HTTP ${ROPC_STATUS}) — not a recognized refusal verdict; body: ${ROPC_BODY:-none}"
            exit 1
          else
            ropc_gateway_fail
          fi
          ;;
        2[0-9][0-9]|3[0-9][0-9])
          # Deliberately retained even though the fixed bogus credentials
          # make it unreachable through credential-checked flows (an
          # authenticate-before-gate ordering flip answers invalid_grant
          # above): this branch covers a Keycloak that mints WITHOUT
          # validating credentials at all — a broken authenticator or a
          # realm import that skips the credential step. Without it, a
          # minted token would be misreported as a transport failure.
          if [ "$ROPC_TOKEN" = "yes" ]; then
            echo "ERROR: genie realm ROPC posture drifted: token endpoint returned HTTP ${ROPC_STATUS} with an access token for a direct-access grant — directAccessGrantsEnabled must stay false on genie-app"
          else
            ropc_gateway_fail
          fi
          exit 1
          ;;
        *)
          # Drift protection, not a live path: only clean-exit 2xx-4xx
          # answers set ROPC_ANSWERED, and 4xx/2xx-3xx cover that space. If
          # a future edit to the loop's answered logic widens it, this arm
          # turns the silent-skip class into a loud failure.
          echo "ERROR: the probe reached an unclassified state (HTTP ${ROPC_STATUS:-none}) — failing loudly rather than passing without a verdict; body: ${ROPC_BODY:-none}"
          exit 1
          ;;
      esac
      # #1303 — the refusal above proves the posture of genie-app ONLY. The
      # realm pins directAccessGrantsEnabled: false on six clients
      # (genie-app, genie-proxy-client, dataprep-service-client, okf-server,
      # the mobile client and the Grafana client), and a drift on any of the
      # other five stays invisible to that probe: genie-proxy-client holds the
      # admin-API proxy service account, so a realm that accepts a
      # direct-access grant on it lets the holder of its secret mint a token
      # as any user.
      #
      # The job cannot behaviour-probe those clients — they are confidential
      # and their secret is not in the job, so a token request against them
      # would fail on the secret, not on the grant. What the job CAN observe
      # is the realm CONFIGURATION: the admin API returns each client's
      # directAccessGrantsEnabled flag. So the probe reads the realm back and
      # asserts the shape — no client outside the allowlist carries the
      # direct-access grant. admin-cli is on the allowlist because Keycloak
      # provisions it with direct grants on in every realm, and the readiness
      # loop above mints its admin token through it.
      #
      # The admin listing carries the clients' secrets. Nothing here prints
      # the raw answer: only the client ids and their grant flag are
      # extracted, and the ids are printed only when they ARE the drift.
      #
      # A fresh admin token is minted for the read-back: the token the
      # readiness loop acquired may already have expired (a master realm
      # Access Token Lifespan shorter than the readiness wait is a known
      # cause, #1320), and a 401 here would read as drift rather than as an
      # expired token.
      #
      # Both calls retry, like every other call site in this block: a
      # transient 429/5xx/timeout on the mint or the listing must not fail
      # the job (and with it the suites) on one flaky admin answer. The
      # retry is bounded to three attempts, five seconds apart, and only
      # transient answers retry: a credentials rejection is definitive
      # (#1319 — retrying cannot heal it and every failed attempt feeds
      # Keycloak's brute-force protector), and a drift verdict never
      # retries — it exits. A DEFINITIVE rejection (an OAuth error body over
      # a clean exit on a definitive status) is counted the way #1319 counts
      # the readiness loop's own: three consecutive definitive answers fail
      # the job, one is ridden out as a one-off proxy hiccup. The STATUS SET
      # is deliberately wider than the readiness loop's 401-only parse: by
      # the time this runs, the readiness loop has established the stack, so
      # a clean 400/403 with an OAuth body is a configuration failure, not a
      # convergence race — retrying it burns attempts, not patience.
      ROPC_CLIENT_GRANTS=""
      ROPC_REALM_TOKEN=""
      ROPC_READBACK_REASON=""
      ROPC_DEFINITIVE_RUN=0
      UNVERIFIED_MSG="the direct-access-grant invariant on the genie realm's other clients is UNVERIFIED"
      # Both read-back arms record a failed answer through ONE pair of
      # helpers: the definitive counter, its threshold and the fatal
      # message live here and nowhere else. $1 is the arm's clause for the
      # fatal verdict, $2 its transient retry reason.
      ropc_note_definitive() {
        ROPC_DEFINITIVE_RUN=$((ROPC_DEFINITIVE_RUN+1))
        if [ "$ROPC_DEFINITIVE_RUN" -ge 3 ]; then
          echo "ERROR: the realm client read-back reached 3 consecutive definitive rejections — the last one $1; the counter is shared by the mint and the listing, so an earlier arm may have answered first — ${UNVERIFIED_MSG}."
          exit 1
        fi
        ROPC_READBACK_REASON="$2"
      }
      ropc_note_transient() {
        ROPC_DEFINITIVE_RUN=0
        ROPC_READBACK_REASON="$1"
      }
      for i in 1 2 3; do
        # The token is minted only when the last attempt left none: a
        # listing-only failure keeps the still-valid token instead of
        # spending three admin logins on one flaky listing. Both failure
        # arms fall through to the ONE retry tail at the bottom of the
        # loop; a successful listing breaks past it.
        if [ -z "$ROPC_REALM_TOKEN" ]; then
          kc_mint_master_token
          ROPC_REALM_TOKEN=$(kc_access_token)
          if [ -z "$ROPC_REALM_TOKEN" ]; then
            ROPC_MINT_DETAIL=$(kc_error_detail)
            if kc_is_definitive_rejection "$ROPC_MINT_DETAIL"; then
              ropc_note_definitive \
                "rejected the master admin token (HTTP $(http_label "$STATUS"), error '${ROPC_MINT_DETAIL}')" \
                "the master admin token was rejected (HTTP $(http_label "$STATUS"), error '${ROPC_MINT_DETAIL}')"
            else
              ropc_note_transient "no master admin token (HTTP $(http_label "$STATUS"), curl exit ${CURL_RC})"
            fi
          fi
        fi
        if [ -n "$ROPC_REALM_TOKEN" ]; then
          # max=-1: the admin API's default window would cap the listing,
          # and the verdict below certifies the realm — it must certify
          # everything it read, so the read asks for the full set.
          # --max-time 15: this is the largest answer in the block, and the
          # ROPC probe below already showed the block's 10s default too
          # tight for a smaller call — truncating the certification call
          # three times would fail the job on a healthy realm.
          kc_curl GET "${KC_URL}/admin/realms/genie/clients?max=-1" \
            --max-time 15 \
            -H "Authorization: Bearer $ROPC_REALM_TOKEN"
          if [ "$STATUS" = "200" ] && [ "$CURL_RC" -eq 0 ]; then
            # A client whose directAccessGrantsEnabled member is missing or
            # not a boolean was never READ — Keycloak's default for a new
            # client is the grant ON, so an unread client cannot be assumed
            # disabled: UNREAD fails like any other no-verdict answer. The
            # member must be exactly true to count as drift, exactly false
            # to count as read. An entry that is not a client object at all
            # means the answer was mangled in transit — a drifted client
            # whose entry was mangled away would otherwise vanish from the
            # verdict — so MALFORMED is checked FIRST: a mangled answer is
            # never reported as an empty one. Both concerns report in one
            # answer (UNREAD first, then DRIFT) so one red run names
            # everything the realm got wrong; neither masks the other. The
            # program sits on several lines ON PURPOSE — a
            # verdict-precedence edit inside a one-liner is how the
            # EMPTY/MALFORMED ordering flipped twice under review — at the
            # block-scalar base indent, which the YAML dedent lands at
            # shell column 0.
            ROPC_CLIENT_GRANTS=$(printf '%s' "$KC_RAW" | sed '$d' | python3 -c '
      import sys, json
      allow = {"admin-cli"}
      data = json.load(sys.stdin)
      if not isinstance(data, list):
          print("PARSE_ERROR")
      else:
          clients = [c for c in data if isinstance(c, dict)]
          malformed = len(clients) != len(data)
          if malformed or not clients:
              print("MALFORMED" if malformed else "EMPTY")
          else:
              unread = sorted(
                  c.get("clientId", "?")
                  for c in clients
                  if c.get("directAccessGrantsEnabled") is not True
                  and c.get("directAccessGrantsEnabled") is not False
              )
              drift = sorted(
                  c.get("clientId", "?")
                  for c in clients
                  if c.get("directAccessGrantsEnabled") is True
                  and c.get("clientId") not in allow
              )
              lines = []
              if unread:
                  lines.append("UNREAD:" + ",".join(unread))
              if drift:
                  lines.append("DRIFT:" + ",".join(drift))
              if not lines:
                  lines.append("OK")
              print("\n".join(lines))
      ' 2>/dev/null || echo "PARSE_ERROR")
            ROPC_DRIFT_IDS=$(printf '%s' "$ROPC_CLIENT_GRANTS" | sed -n 's/^DRIFT://p')
            ROPC_UNREAD_IDS=$(printf '%s' "$ROPC_CLIENT_GRANTS" | sed -n 's/^UNREAD://p')
            break
          fi
          ROPC_LIST_DETAIL=$(kc_error_detail)
          if kc_is_definitive_rejection "$ROPC_LIST_DETAIL"; then
            # The listing refused a token this run minted seconds ago: the
            # token is dead (the #1320 class) — drop it so the next attempt
            # mints fresh.
            ROPC_REALM_TOKEN=""
            ropc_note_definitive \
              "refused the realm client list (HTTP $(http_label "$STATUS"), error '${ROPC_LIST_DETAIL}')" \
              "the realm client list was refused (HTTP $(http_label "$STATUS"), error '${ROPC_LIST_DETAIL}')"
          else
            ropc_note_transient "the realm client list was not readable (HTTP $(http_label "$STATUS"), curl exit ${CURL_RC})"
          fi
        fi
        if [ "$i" -lt 3 ]; then
          echo "Realm client read-back attempt ${i}/3: ${ROPC_READBACK_REASON} — retrying"
        else
          echo "Realm client read-back attempt ${i}/3: ${ROPC_READBACK_REASON} — giving up"
        fi
        { [ "$i" -lt 3 ] && sleep 5; } || true
      done
      if [ -z "$ROPC_CLIENT_GRANTS" ]; then
        echo "ERROR: the realm client list could not be read back after 3 attempts ($ROPC_READBACK_REASON) — ${UNVERIFIED_MSG}."
        exit 1
      fi
      # PARSE_ERROR / EMPTY / MALFORMED are whole-value verdicts (the parse
      # emits exactly one), so equality dispatches without spawning greps.
      case "$ROPC_CLIENT_GRANTS" in
        PARSE_ERROR)
          echo "ERROR: the genie realm client list could not be parsed — the raw listing is withheld (it carries client secrets) — ${UNVERIFIED_MSG}; failing rather than passing without a verdict"
          exit 1
          ;;
        EMPTY)
          echo "ERROR: the genie realm client list carries no client entries — ${UNVERIFIED_MSG}; failing rather than passing without a verdict"
          exit 1
          ;;
        MALFORMED)
          echo "ERROR: the genie realm client list carries entries that are not client objects — the answer was mangled in transit and a drifted client could hide behind a mangled entry; the raw listing is withheld (it carries client secrets) — ${UNVERIFIED_MSG}; failing rather than passing without a verdict"
          exit 1
          ;;
      esac
      # Drift first: it is the security-relevant answer, and when the realm
      # got two things wrong the red run names both — the drifted client
      # AND the clients whose grant state was never read.
      if [ -n "$ROPC_DRIFT_IDS" ]; then
        echo "ERROR: genie realm ROPC posture drifted — these clients carry directAccessGrantsEnabled: $ROPC_DRIFT_IDS — direct access grants must stay disabled on every client but admin-cli${ROPC_UNREAD_IDS:+; the grant state was never read for: $ROPC_UNREAD_IDS}"
        exit 1
      fi
      if [ -n "$ROPC_UNREAD_IDS" ]; then
        echo "ERROR: the genie realm client list omits the directAccessGrantsEnabled member for: $ROPC_UNREAD_IDS — ${UNVERIFIED_MSG}; failing rather than passing without a verdict"
        exit 1
      fi
      echo "Direct-access grants verified across the genie realm's clients — none outside the allowlist (admin-cli) carries directAccessGrantsEnabled"
    # All three venue fixtures (testuser, testadmin, testplain) are
    # provisioned through ONE mechanism: the provisioning script
    # (tests/e2e/provision-e2e-fixtures.js) over the ensureUser helper —
    # bounded retry on a transient or unanswered Keycloak call, password
    # convergence on the already-exists path, role assignment, and the
    # admin-granting role removed from every fixture that does not
    # declare it — so a stale account is converged HERE (logged) or fails
    # HERE loudly, instead of surfacing as a login failure minutes later.
    # The fixture definitions (emails, passwords, roles) live in
    # tests/e2e/helpers/e2e-fixtures.js; the specs read their login
    # credentials from the same module.
    - >
      ADMIN_TOKEN="$ADMIN_TOKEN" BASE_URL="${E2E_BASE_URL}" node tests/e2e/provision-e2e-fixtures.js
    # tests/e2e/okf/ stays OUT: every spec in it drives an OKF SURFACE, and
    # the CI deployment runs the core profile with the OKF pillar PARKED
    # (OKF_ENABLED=0) — the Studio tab and the artifacts view do not render
    # there, so the specs would find nothing to drive. (The RAGAS guide specs
    # additionally hardcode https://localhost while CI serves
    # E2E_BASE_URL=https://nginx.) The wave specs that need an OKF-enabled
    # deployment run against the LOCAL build instead — see
    # tests/e2e/okf/artifacts-view.spec.js for the run command.
    #
    # When the CI deployment turns the pillar on, add the directory here AND
    # to the executed-spec set pinned in tests/config-validator (the pin
    # lists the specs the invocation executes; a spec that drifts out of the
    # invocation is not covered by it).
    - BASE_URL="${E2E_BASE_URL}" npx playwright test tests/e2e/chatbot/ tests/e2e/documents/ tests/e2e/admin/ tests/e2e/theme-runtime-config.spec.js tests/e2e/helpers/ --project=chromium
  after_script:
    - mkdir -p e2e-logs
    - docker compose -p "ci-${CI_PIPELINE_ID}" logs > e2e-logs/docker-compose.log 2>&1 || true
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - e2e-logs/
      - reports/
    reports:
      junit: reports/playwright-report.xml

# GitLab official Container Scanning template — produces the correct-schema report
# (GitLab security dashboard + MR widget) + CycloneDX SBOM. Overridden below to
# scan each of the 15 candidate images in tmp/. Blocking on HIGH/CRITICAL is via
# MR approval rules (see docs/adr/0001).
include:
  # --- Security testing suite (GitLab Ultimate) ---
  # All run in the `test` stage, advisory (allow_failure), findings land in the
  # security dashboard + MR widget. Blocking via MR approval rules, same model
  # as container scanning.
  - template: Jobs/Secret-Detection.gitlab-ci.yml   # leaked tokens/passwords in source + history
  - template: Jobs/SAST.gitlab-ci.yml               # source-code vulns (JS/Vue, Python, Dart)
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml # known vulns in npm/pip/pub deps
  - template: Jobs/SAST-IaC.gitlab-ci.yml           # misconfigs in docker-compose / ansible / k8s
  - template: Jobs/Container-Scanning.gitlab-ci.yml # image vulns (uses $CS_IMAGE; schema 15.x.x)
  # GitLab's container-scanning template defines one `container_scanning` job that
  # scans one image (CS_IMAGE). We override it below to run in the `scan` stage
  # (instead of `test`), block promotion on failure, and inherit a per-image
  # anchor (`.container_scanning_per_image_template`) that each `scan:IMAGE`
  # job uses via `extends: container_scanning`. Each scan:IMAGE job sets its
  # own CS_IMAGE to the corresponding `tmp/...` registry tag built in stage
  # `build`. The produced `gl-container-scanning-report.json` artifact conforms
  # to the v15.x.x schema (the previous custom Trivy-only script produced
  # `SchemaVersion: <int>` at the report root instead of `version: "<semver>"`,
  # which the GitLab UI rejected as "Report version not provided").

# Override the security templates' default rules (which run on branch pipelines
# only via `if: $CI_COMMIT_BRANCH`) so they ALSO run on MR + release branches —
# pre-merge coverage. Applied to the jobs active for the GENIE.AI stack
# (JS/Vue + Python + npm/pip deps + IaC + secrets). Other language-specific
# SAST jobs keep template defaults (won't activate for absent languages).
.security_run_rules: &security_run_rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_BRANCH =~ /^release\//

secret_detection:
  rules: *security_run_rules
semgrep-sast:
  rules: *security_run_rules
  # SAST_EXCLUDED_PATHS (set in global variables) is the single source of truth
  # for the scan surface; the list below is a summary of it, not a second copy
  # to maintain. It hides:
  #   mobile/**/windows/** — Windows desktop CMake runner, not deployed
  #   mobile/genie_ai_mobile/flutter_appauth/** — vendored flutter_appauth
  #     checkout (trust-all TLS builder, gated by a config flag)
  #   genie-ai-overlay/contracts/** — real-comps contract tests, not shipped
  #   **/seed-*.js — seed scripts (data fixtures for a fresh database)
  #   **/scripts/{seed-*.js,migrations/**,new-schema-scripts/**} — dev scripts
  #   **/__tests__/**, **/__mocks__/**, **/tests/**, **/coverage/** — test code
  #   .claude/**, .agents/**, _bmad/**, _bmad-output/** — agent tooling and
  #     generated BMAD artifacts, never shipped
  # Production entrypoint components/document-repository/scripts/clamav-node.sh
  # is INTENTIONALLY left scanned (clamav-node.sh is the CMD of the prod image)
  # Re-enable other excluded paths only if they become shipping code
# nodejs-scan-sast is DEPRECATED (GitLab 16.8, removed 17.0) — the template
# ships it as an exit-1 stub. semgrep-sast covers JS. Disable it explicitly.
nodejs-scan-sast:
  rules:
    - when: never
# spotbugs-sast is the Java analyzer. The repo does contain Java — the vendored
# flutter_appauth fork under mobile/genie_ai_mobile/flutter_appauth/, whose
# classes are compiled into every APK — but it is a `path:` dependency, not a
# Gradle project of ours, so the analyzer tries to build a project that does
# not exist and fails (advisory noise). Keeping it disabled also keeps the
# fork out of the SAST report: the fork is on the SAST_EXCLUDED_PATHS list
# (see the exclusion rationale above), so a SpotBugs run would report the
# trust-all TLS builder that the exclusion deliberately removes.
#
# Consequence to keep in mind: the Java surface has semgrep-only coverage, and
# the vendored fork has no static analysis at all — its gates are pinned by
# mobile/genie_ai_mobile/test/config/flutter_appauth_insecure_gate_test.dart
# instead. Re-enabling the analyzer is tracked in #1103.
spotbugs-sast:
  rules:
    - when: never
gemnasium-dependency_scanning:
  rules: *security_run_rules
gemnasium-python-dependency_scanning:
  rules: *security_run_rules
kics-iac-sast:
  rules: *security_run_rules
# Container scanning: override the template's default `test` stage and
# `allow_failure: true` so scans block promotion (the promote:IMAGE job
# `needs:` the scan:IMAGE job and fails if it didn't produce a valid
# container_scanning report). Per-image CS_IMAGE is set by each scan:IMAGE
# job that extends `container_scanning`. Rules follow the security_run_rules
# so scans run on MR + main + release branches.
container_scanning:
  stage: scan
  allow_failure: false
  variables:
    # Trivy scan timeout — some images (e.g. genie-ai-retriever-arango, which
    # carries the full OPEA overlay Python deps tree) hit the default 5m
    # deadline on the GPU runner. Bump to 30m (Trivy's own default if
    # TRIVY_TIMEOUT is unset is 5m per the docs).
    TRIVY_TIMEOUT: "30m"
  rules:
    - when: never
  # The artifact paths override remains so `promote:IMAGE` can still
  # fetch the report and SBOM as paths via
  # `needs: [scan:IMAGE, artifacts: true]`.
  #
  # This overrides the natif template's artifact upload: the natif
  # `container_scanning` job uploads the vulnerability report and
  # `**/gl-sbom-*.cdx.json` (CycloneDX SBOM) as GitLab REPORT artifacts
  # automatically. We re-declare them as PATHS artifacts here so that
  # `promote:IMAGE` can fetch them (`artifacts: true` on the needs entry),
  # rewrite the image reference inside both JSONs
  # (`tmp/IMAGE:cand` → `IMAGE:primary_tag`) and re-upload — so the
  # SBOM/vulnerability tabs track the released image, not the tmp/
  # scratch ref. Without this, users would see a SBOM whose
  # `metadata.component` references `tmp/genie-ai-frontend:mr-123-abc` —
  # a deleted image.
  artifacts:
    paths:
      - gl-container-scanning-report.json
      - "**/gl-sbom-*.cdx.json"

# The chatqna image consumes the language registry from the backend tree
# (COPY in Dockerfile-chatqna_genie-ai), so a registry-only change must
# rebuild it like a chatqna change. build-patches/ is named by FILE, not by
# directory: the image runs exactly two scripts from there (the off-loop
# patcher and install_site_startup.sh), and a directory glob would also
# rebuild this image for dataprep-only patcher edits. tracing.py is COPYed
# into the image too and carries the entrypoint-wired access-log
# middleware, so it is a chatqna source like core/**.
# The five module images follow the same policy (#1233): each names exactly
# the build-patches files its Dockerfile COPYs — install_site_startup.sh in
# all five, docarray_alias_shim.py in retriever/reranker/dataprep,
# unstructured_html_pi_patch.py in dataprep only.
.chatqna_server_source_changes: &chatqna_server_source_changes
  [ "genie-ai-overlay/chatqna/**/*", "components/gov-chat-backend/services/translation/language-maps/language-registry.json", "genie-ai-overlay/core/**/*", "genie-ai-overlay/tracing.py", "genie-ai-overlay/build-patches/comps_llm_stream_offloop_patch.py", "genie-ai-overlay/build-patches/install_site_startup.sh", "genie-ai-overlay/contracts/**/*", "configs/ssl/**/*", ".gitlab-ci.yml" ]

# Same idiom for the five OPEA module images (#1233): one anchor per module,
# referenced by every job of that module — build, smoke, scan, promote and
# contract. A path addition cannot drift between "rebuild the image" and
# "run the contract lane" again.
#
# Every job of a module shares the SAME list — the contract lane included.
# The contract lane validates the image, so an image input (configs/ssl/
# **/*, the SSL patch the images COPY) must re-run it: chatqna's contract
# job has used the build anchor for exactly that reason.
.dataprep_source_changes: &dataprep_source_changes
  [ "genie-ai-overlay/dataprep/**/*", "genie-ai-overlay/core/**/*", "genie-ai-overlay/build-patches/docarray_alias_shim.py", "genie-ai-overlay/build-patches/install_site_startup.sh", "genie-ai-overlay/build-patches/unstructured_html_pi_patch.py", "genie-ai-overlay/contracts/**/*", "configs/ssl/**/*", ".gitlab-ci.yml" ]
.retriever_source_changes: &retriever_source_changes
  [ "genie-ai-overlay/retriever/**/*", "genie-ai-overlay/core/**/*", "genie-ai-overlay/build-patches/docarray_alias_shim.py", "genie-ai-overlay/build-patches/install_site_startup.sh", "genie-ai-overlay/contracts/**/*", "configs/ssl/**/*", ".gitlab-ci.yml" ]
.reranker_source_changes: &reranker_source_changes
  [ "genie-ai-overlay/reranker/**/*", "genie-ai-overlay/core/**/*", "genie-ai-overlay/build-patches/docarray_alias_shim.py", "genie-ai-overlay/build-patches/install_site_startup.sh", "genie-ai-overlay/contracts/**/*", "configs/ssl/**/*", ".gitlab-ci.yml" ]
.embedding_source_changes: &embedding_source_changes
  [ "genie-ai-overlay/embedding/**/*", "genie-ai-overlay/core/**/*", "genie-ai-overlay/build-patches/install_site_startup.sh", "configs/ssl/**/*", ".gitlab-ci.yml" ]
.textgen_source_changes: &textgen_source_changes
  [ "genie-ai-overlay/textgen/**/*", "genie-ai-overlay/core/**/*", "genie-ai-overlay/build-patches/install_site_startup.sh", "configs/ssl/**/*", ".gitlab-ci.yml" ]

.build_template: &build_template
  stage: build
  image: docker:28
  tags: [docker]
  interruptible: true
  # Builds consume only the checkout (docker buildx) — no upstream artifacts.
  # Without this, GitLab's default makes every build job download ALL
  # test-stage artifacts (scan reports, JUnit XML) — pure waste, and the
  # 2026-09-02/03 instance flake (intermittent 403 on artifact downloads,
  # uploads fine) killed builds before their script ran.
  dependencies: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - if [ -n "$DOCKER_HUB_USER" ]; then echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin docker.io; fi
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      REGISTRY_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:${CANDIDATE_TAG}"
      CACHE_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:cache-${CI_COMMIT_REF_SLUG}"
      echo "Building $IMAGE_NAME → ${REGISTRY_REF}"
      docker buildx build \
        --pull \
        --push \
        -t "$REGISTRY_REF" \
        -f "$DOCKERFILE" \
        --cache-from "type=registry,ref=$CACHE_REF" \
        --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
        "$CONTEXT"


# Per-image container scan anchor. Inherits the GitLab Container-Scanning
# template's `container_scanning` job (defined in Jobs/Container-Scanning.gitlab-ci.yml,
# included above). The template produces gl-container-scanning-report.json
# conforming to schema 15.x.x — the previous custom Trivy-only script produced
# `SchemaVersion: <int>` at the report root instead of the required `version: "<semver>"`,
# which the GitLab UI rejected as "Report version not provided" (security
# dashboard "Parsing errors" in pipelines 6385 and 6402).
#
# Each scan:IMAGE job extends container_scanning via this alias (kept for
# backward compatibility with the 15 existing scan:IMAGE jobs), sets its own
# CS_IMAGE to the corresponding tmp/... image built in stage `build`, and adds
# rules so the scan only runs when relevant files change. The
# global container_scanning override above moves the stage from `test` to
# `scan` and disables allow_failure.
.scan_template: &scan_template
  extends: container_scanning
  # Compute the dynamic CS_IMAGE in before_script. The build_template pushes
  # two possible tag shapes: mr-{iid}-{short} on MR pipelines and
  # pending-{short} on branch/tag pipelines. We resolve which one exists at
  # scan time, falling back to pending-{short} (which always exists post-build).
  # The override is required because GitLab CI variables can't do conditional
  # assignment based on $CI_PIPELINE_SOURCE inline — the natif gtcs scan only
  # reads $CS_IMAGE literally.
  before_script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      export CS_IMAGE="${CI_REGISTRY_IMAGE}/tmp/${IMAGE_NAME}:${CANDIDATE_TAG}"
      echo "Scanning $CS_IMAGE"
  # Drop the natif `reports.container_scanning` + `reports.cyclonedx` uploads.
  # We override each report with an empty string — GitLab CI deep-merges
  # `extends:` artifacts, so an empty `reports: {}` keeps the parent's
  # reports intact (it just adds nothing). Setting each report path to
  # `''` actually neutralizes the corresponding upload. The single
  # GitLab-schema-compliant upload happens in `promote:IMAGE` after the
  # sed rewrite from `tmp/<IMAGE>:cand` → `<IMAGE>:primary_tag`. Paths
  # are preserved (natif) so promote can still fetch via `artifacts: true`.
  artifacts:
    reports:
      container_scanning: ""
      cyclonedx: ""


.promote_template: &promote_template
  stage: promote
  image: docker:28
  tags: [docker]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        SRC="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        SRC="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:pending-${CI_COMMIT_SHORT_SHA}"
      fi
    - DIGEST="sha256:$(docker buildx imagetools inspect --raw "$SRC" | sha256sum | awk '{print $1}')"
    - echo "Promoting $IMAGE_NAME digest ${DIGEST:0:32}... (tmp/ → real namespace)"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Pre-release tags (alpha, beta, rc) must NOT update "latest"
        if echo "$CI_COMMIT_TAG" | grep -qE -- '-(alpha|beta|rc)'; then
          echo "Pre-release tag detected — skipping 'latest' Docker tag"
          FINAL_TAGS="$CI_COMMIT_TAG"
        else
          FINAL_TAGS="$CI_COMMIT_TAG latest"
        fi
      else
        BRANCH_TAG="${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        BRANCH_TAG="${BRANCH_TAG//\//-}"
        # For version release branches (release/X.Y — digits only): tag as vX.Y.
        # Deployment branches (release/el-salvador) keep their full name.
        # See docs/RELEASE.md §2 for branch naming rules.
        case "$BRANCH_TAG" in
          release-[0-9]*.[0-9]*) BRANCH_TAG="v${BRANCH_TAG#release-}" ;;
        esac
        FINAL_TAGS="${BRANCH_TAG}-${CI_COMMIT_SHORT_SHA} ${BRANCH_TAG}"
      fi
    - |
      for t in $FINAL_TAGS; do
        docker buildx imagetools create -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$t" "$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME@${DIGEST}"
      done
    - skopeo delete "docker://$SRC" 2>/dev/null || true
    # Rewrite tmp/ image names → promoted names in the container scanning report.
    # Same digest, correct name → GitLab vulnerability report tracks real images.
    # Uses the first (primary) tag from the promote step (e.g. main-<sha>, v2.1.0, vX.Y-<sha>).
    # Scan failures block promotion (security policy). Promote handles missing reports gracefully
    - |
      # Both the container-scanning report (schema 15.x.x) and the CycloneDX
      # SBOM were produced by the natif gtcs scan in scan:IMAGE with image=
      # `tmp/<IMAGE>:<cand>`. We rewrite BOTH to point at the final promoted
      # image (`<IMAGE>:<primary_tag>`), then upload as the single GitLab-
      # schema-compliant reports. Doing this once (in promote, not in scan)
      # avoids GitLab seeing duplicate vulnerability sets / SBOM entries with
      # different fingerprints per image name.
      PRIMARY_TAG="${FINAL_TAGS%% *}"
      if [ -f gl-container-scanning-report.json ]; then
        sed "s|tmp/${IMAGE_NAME}:[^\"() ]*|${IMAGE_NAME}:${PRIMARY_TAG}|g" \
          gl-container-scanning-report.json > gl-container-scanning-report.json.tmp \
          && mv gl-container-scanning-report.json.tmp gl-container-scanning-report.json
        echo "Rewrote container_scanning report: tmp/${IMAGE_NAME}:* → ${IMAGE_NAME}:${PRIMARY_TAG}"
      else
        echo "ERROR: gl-container-scanning-report.json not found (scan:IMAGE did not produce one) — blocking promotion (NFR-S1 supply-chain integrity)"
        exit 1
      fi
      # CycloneDX SBOMs produced by the natif container-scanning analyzer are
      # named `gl-sbom-<cand>.cdx.json`. The image reference appears in
      # `metadata.component.name` and component purls. We rewrite
      # `tmp/<IMAGE>:<cand>` → `<IMAGE>:<primary_tag>` everywhere.
      SBOM_FILE=$(ls gl-sbom-*.cdx.json 2>/dev/null | head -1)
      if [ -n "$SBOM_FILE" ] && [ -f "$SBOM_FILE" ]; then
        sed "s|tmp/${IMAGE_NAME}:[^\"() ]*|${IMAGE_NAME}:${PRIMARY_TAG}|g" \
          "$SBOM_FILE" > "$SBOM_FILE.tmp" \
          && mv "$SBOM_FILE.tmp" "$SBOM_FILE"
        echo "Rewrote SBOM ${SBOM_FILE}: tmp/${IMAGE_NAME}:* → ${IMAGE_NAME}:${PRIMARY_TAG}"
      else
        echo "WARN: gl-sbom-*.cdx.json not found — SBOM tab will not be populated for ${IMAGE_NAME}"
      fi
  artifacts:
    paths:
      - gl-container-scanning-report.json
      - gl-sbom-*.cdx.json
    reports:
      container_scanning: gl-container-scanning-report.json
      cyclonedx: gl-sbom-*.cdx.json

# ---------------------------------------------------------------------------
# Contract tests vs REAL vendored comps — run INSIDE the built image (D3)
# ---------------------------------------------------------------------------
# The existing `test:op` job runs the OPEA pytest suite against a MOCKED `comps`
# (tests/conftest.py stubs it in sys.modules) — blind to runtime comps API
# changes. These jobs run the `genie-ai-overlay/contracts/` suite against the
# REAL vendored comps inside each built module image. Invocation per
# architecture pattern 3: `docker run <image> pytest /contracts/... -p no:cacheprovider`.
.contract_template: &contract_template
  stage: contract-in-image
  image: docker:28
  tags: [docker]
  interruptible: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        CANDIDATE_TAG="mr-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        CANDIDATE_TAG="pending-${CI_COMMIT_SHORT_SHA}"
      fi
      REGISTRY_REF="$CI_REGISTRY_IMAGE/tmp/$IMAGE_NAME:${CANDIDATE_TAG}"
      CID="contract-${CI_JOB_ID}"
      echo "Running contract tests for $IMAGE_NAME (${REGISTRY_REF}) against real vendored comps"
      # docker create + docker cp (NOT -v): under DinD the daemon cannot see the
      # runner's filesystem, so a -v mount of $PWD yields an EMPTY /contracts.
      # docker cp transfers the suite into the container via the daemon instead.
      docker create --name "$CID" --entrypoint sh "$REGISTRY_REF" \
        -c "pip install -q pytest pytest-asyncio && cd /contracts && python -m pytest ${CONTRACT_TEST_PATTERN} -p no:cacheprovider --junitxml=/tmp/contract-report.xml"
      docker cp genie-ai-overlay/contracts/. "$CID":/contracts/
      docker start -a "$CID"
      EXIT=$?
      mkdir -p reports
      docker cp "$CID":/tmp/contract-report.xml reports/contract-report.xml 2>/dev/null || true
      docker rm -f "$CID" >/dev/null 2>&1 || true
      exit $EXIT
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: reports/contract-report.xml
    paths:
      - reports/contract-report.xml

# Merge trains run the LIGHT gate only (lint/test/config on the merged
# result — the train's unique value: validating the merged content BEFORE
# the merge). The heavy families below skip trains entirely: they validated
# the branch tip at the last push, and the post-merge `main` pipeline
# rebuilds+scans the exact merged SHA anyway (it produces the promoted
# images). Running the heavy set on the train tripled every merge — head +
# train + main, three identical runs on the same tree (observed 2026-11-03).
.train_skip: &train_skip
  if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
  when: never

contract:retriever-arango:
  <<: *contract_template
  needs:
    - job: build:retriever-arango
  variables:
    IMAGE_NAME: "genie-ai-retriever-arango"
    # Retriever in-image suite — ONLY tests that run against the retriever
    # image's real comps (no repo-side tests, no dataprep-side tests → no skips).
    # telemetry + streaming moved to `contract:unit` (repo-side); the ingest
    # budget lives in `contract:dataprep-arango`.
    CONTRACT_TEST_PATTERN: "test_contract_orchestrator_wire.py test_contract_label_filter.py test_contract_retriever_fusion.py test_contract_e2e_pipeline.py::test_label_filter_contract_roundtrip test_contract_e2e_pipeline.py::test_label_filter_contract_empty_is_noop test_contract_e2e_pipeline.py::test_e2e_graph_schedules_real_orchestrator test_contract_nfrp_budgets.py::test_wire_latency_within_budget test_contract_nfrp_budgets.py::test_budget_table_present"
  rules:
    - *train_skip
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: *retriever_source_changes
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths: *retriever_source_changes
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths: *retriever_source_changes


