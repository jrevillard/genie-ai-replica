{{- /* Build a per-template Values view so we can override `.component` for label rendering. */ -}}
{{- $componentValues := dict "Chart" .Chart "Release" .Release "Values" (deepCopy .Values | merge (dict "component" "namespace")) -}}
{{- $ns := .Values.namespace -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    # NOT a helm hook. The plan's original design (Namespace as pre-install
    # hook, weight -40, no --create-namespace) relied on Helm 3 semantics;
    # Helm 4 deletes pre-existing hook-identity resources before applying
    # hooks (before-hook-creation became implicit), which deletes the very
    # namespace the release Secret is stored in — install reports deployed,
    # then the release vanishes with the namespace. Correct Helm 4 flow:
    # `helm install -n genieai --create-namespace` creates the bare
    # namespace BEFORE any hook or release record; later pre-install hooks
    # (RBAC -30, dep-graph -20, ...) then find it; this regular resource
    # server-side-applies the labels onto it. Uninstall removes it with the
    # release — acceptable for the foundation tier; data-tier namespaces
    # get the §13.1 pre-delete gate in Plan 7.
  labels:
    {{- include "genieai-common.labels" $componentValues | nindent 4 }}
    genieai.io/cluster-profile: {{ .Values.clusterProfile | default "dev" | quote }}
    app.kubernetes.io/part-of: genieai
    # Advertise K8s Pod Security Standards at the namespace level so admission
    # controllers refuse pods without required securityContext.
    pod-security.kubernetes.io/enforce: restricted
    # Pin to a specific version rather than `latest`. Across cluster upgrades
    # `latest` silently changes the policy version and may start rejecting
    # pods that previously scheduled without warning.
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.33
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.33
