{{/*
Keycloak Deployment - Auth & Utility Tier (CPU Node Pool)
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai.componentLabels" (dict "name" "keycloak" "tier" "cpu" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.cpu.keycloak.replicas }}
  selector:
    matchLabels:
      {{- include "genieai.selectorLabels" (dict "name" "keycloak" "context" .) | nindent 6 }}
  {{- include "genieai.rollingUpdate" . | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "genieai.componentLabels" (dict "name" "keycloak" "tier" "cpu" "context" .) | nindent 8 }}
    spec:
      {{- include "genieai.cpuAffinity" . | nindent 6 }}
      containers:
        - name: keycloak
          image: {{ .Values.cpu.keycloak.image }}
          ports:
            - containerPort: {{ .Values.cpu.keycloak.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cpu-services-config
          {{- include "genieai.cpuResources" .Values.cpu.keycloak.resources | nindent 10 }}
          {{- include "genieai.httpReadinessProbe" (dict "path" .Values.cpu.keycloak.healthPath "port" .Values.cpu.keycloak.port "settings" .Values.cpuProbes.readiness) | nindent 10 }}
          {{- include "genieai.httpLivenessProbe" (dict "path" .Values.cpu.keycloak.healthPath "port" .Values.cpu.keycloak.port "settings" .Values.cpuProbes.liveness) | nindent 10 }}
          {{- include "genieai.cpuSlowStartupProbe" (dict "path" .Values.cpu.keycloak.healthPath "port" .Values.cpu.keycloak.port "settings" .Values.cpuProbes.slowStartup) | nindent 10 }}
