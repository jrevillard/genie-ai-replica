# Ports Overview:
# 8090 - gov chat frontend
# 3000 - gov chat backend
# 3001 - doc repo dev
# 3310 - clamav
# 80 - default OPEA UI nginx server (chatqna-xeon-nginx-server)
# 5173 - default OPEA UI frontend (chatqna-xeon-ui-server)
# 6000 - embedding wrapper
# 6007 - dataprep API endpoint
# 6100 - reranker wrapper
# 7000 - TEI (embedding inference server)
# 7025 - retriever-arango-dev
# 7100 - TEI reranker (inference server)
# 8000 - vLLM (main LLM server)
# 8888 - chatqna backend server
# 9000 - textgen wrapper
# 9030 - translation wrapper
# 9031 - vllm-translation-guardrail (guarded LLM)
# 9090 - guardrail (guard logic endpoint)
# 6666 - http-service (for auth token retrieval)

name: genieai_mvp

volumes:
  kong_data:
  mongo_data:
  nginx_certs:
  nginx_conf:
  redis_data:
  doc_repo_uploads: {}

services:

  # Note: after starting this service, execute the following commands:
  #       docker compose exec kong-database psql -U kong postgres
  #       CREATE DATABASE kong;
  #       ALTER USER kong WITH PASSWORD '${KONG_PG_PASSWORD}';
  #       GRANT ALL PRIVILEGES ON DATABASE kong TO kong;
  kong-database:
    image: postgres:13
    restart: unless-stopped
    networks:
      - genieai_network
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    env_file:
      - .env
    ports:
      - "5432:5432" # Leave the standard PostGres port unchanged as Kong connects to it by default
    volumes:
      - kong_data:/var/lib/postgresql/data
      - ./api-gateway-solution/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Note: before starting up kong you need to create the schema with this command:
  #       docker compose run --rm kong kong migrations bootstrap
  kong:
    image: kong:latest
    restart: unless-stopped
    networks:
      - genieai_network
    depends_on:
      kong-database:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8010:8010"  # Note that we had to change this port to 8010 because vLLM runs on 8000
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ./api-gateway-solution/kong_logs:/var/log/kong

  # Note: before firing up all the other services, the kong configuration needs to be adapted and loaded
  #       1) Modify the addresses of the node:
  #          vi api-gateway-solution/new-config/kong_config.json
  #            -- modify the "host": "e2e-109-51" for the "express-api" service to "host": "backend"
  #            -- it still runs on port 3000 so no problem
  #            -- modify the "host": "e2e-109-51" for the document-repository service to "host": "document-repository"i
  #            -- it still runs on port 3001 so no problem
  #       2) Prepare to apply the configuration to Kong
  #          cd api-gateway-solution/new-config/
  #          chmod +x manage-kong-config.sh
  #          vi manage-kong-config.sh
  #            -- modify the KONG_PUBLIC_URL to match the config change KONG_PUBLIC_URL="http://localhost:8010"
  #       3) Install jq
  #          apt update
  #          apt install jq
  #       4) Apply the configuration to Kong
  #          ./manage-kong-config.sh -a
  frontend:
    build:
      context: ./components/gov-chat-frontend
      dockerfile: Dockerfile-single-node # Specify the Dockerfile name
      args:
        - VUE_APP_API_URL=${VUE_APP_API_URL}
        - VUE_PROXY_HOST=${VUE_PROXY_HOST}
        - VUE_APP_CSP_CONNECT_SRC=${VUE_APP_CSP_CONNECT_SRC}
    restart: unless-stopped
    env_file:
      - .env
    # --- ADDED THIS SECTION ---
    # This injects the $FRONTEND_PORT variable from .env
    # as a variable named $PORT inside the container
    environment:
      - PORT=${FRONTEND_PORT}
    # --- UPDATED THIS SECTION ---
    # This now reads the port from your .env file
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    networks:
      - genieai_network

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "${TRANSLATION_CACHE_PORT}:${TRANSLATION_CACHE_PORT}"
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "${TRANSLATION_CACHE_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genieai_network

  backend:
    build:
      context: ./components
      dockerfile: gov-chat-backend/Dockerfile-single-node 
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./database_backups:/app/database_backups
      - ./logs:/app/logs
      - ./data:/app/data
      - ./components/gov-chat-backend/Uploads:/app/Uploads
    env_file:
      - .env
    depends_on:
      arango-vector-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-default-session-secret}
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC}
      - PORT=${BACKEND_PORT}
    networks:
      - genieai_network

  document-repository:
    build:
      context: ./components
      dockerfile: document-repository/Dockerfile
    container_name: doc-repo-dev
    environment:
      - PORT=${DOC_REPO_PORT}
    env_file:
      - .env
    depends_on:
      - clamav
    ports:
      - "${DOC_REPO_PORT}:${DOC_REPO_PORT}"
    networks:
      - genieai_network
    volumes:
      - ./logs:/app/logs
      - doc_repo_uploads:/app/uploads

  clamav:
    #image: mkodockx/docker-clamav:alpine
    image: clamav/clamav
    container_name: clamav
    ports:
      - "3310:3310"  # ClamAV daemon port
    networks:
      - genieai_network

  arango-vector-db:
    image: arangodb/arangodb:3.12.4
    container_name: arango-vector-db
    ports:
      - "${ARANGO_PORT}:${ARANGO_PORT}"
    volumes:
      - /root/arango_data:/var/lib/arangodb3
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    command: ["--experimental-vector-index=true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:${ARANGO_PORT} --server.username root --server.password \"${ARANGO_PASSWORD}\" --javascript.execute-string \"db._version();\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - genieai_network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443" # This will always run on port 443 as port 80 is taken by the OPEA nginx and we only want a https listener
    volumes:
      - ./api-gateway-solution/nginx/conf:/etc/nginx/conf.d
      - ./api-gateway-solution/nginx/certs:/etc/nginx/certs
      - nginx_conf:/etc/nginx
      - nginx_certs:/etc/ssl/private
    networks:
      - genieai_network
    depends_on:
      - kong

  http-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/http-service/Dockerfile-http-service_genie-ai
    container_name: http-service
    env_file:
      - .env
    environment:
      # Mapped variables using shell substitution from .env
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_SERVICE_USERNAME: ${AUTH_SERVICE_USERNAME}
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    networks:
      - genieai_network
    restart: "no"

  dataprep-arango-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/dataprep/Dockerfile-dataprep_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_GENAI_COMPS_URL}
        HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    image: genie-ai-dataprep-arango:${OPEA_VERSION:-latest}
    container_name: genie-ai-dataprep-arango
    depends_on:
      arango-vector-db:
        condition: service_started
      embedding:
        condition: service_started
      vllm:
        condition: service_healthy
      guardrail:
        condition: service_started
    ports:
      - "${DATAPREP_PORT}:5000"
    env_file:
      - .env
    environment:
      DATAPREP_COMPONENT_NAME: ${DATAPREP_COMPONENT_NAME}
      VLLM_MODEL_ID: $(VLLM_MODEL_ID)
      VLLM_ENDPOINT: ${VLLM_ENDPOINT}
      TEI_EMBEDDING_ENDPOINT: ${TEI_EMBEDDING_ENDPOINT}
      GUARDRAIL_URL: ${GUARDRAIL_URL}
      E2E_CPU_URL: ${E2E_CPU_URL}
      ARANGO_URL: ${ARANGO_URL}
      GET_AUTH_TOKEN_URL: ${GET_AUTH_TOKEN_URL}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"

  retriever-arango-service:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/retriever/Dockerfile-retriever_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_GENAI_COMPS_URL}
    image: genie-ai-retriever-arango:${OPEA_VERSION:-latest}
    container_name: genie-ai-retriever-arango
    depends_on:
      arango-vector-db:
        condition: service_started
      embedding:
        condition: service_started
    ports:
      - "${RETRIEVER_SERVICE_PORT}:${RETRIEVER_SERVICE_PORT}"
    ipc: host
    env_file:
      - .env
    environment:
      RETRIEVER_COMPONENT_NAME: "OPEA_RETRIEVER_ARANGODB"
      VLLM_ENDPOINT: ${VLLM_ENDPOINT}
      ARANGO_URL: ${ARANGO_URL}
      TEI_EMBEDDING_ENDPOINT: ${TEI_EMBEDDING_ENDPOINT}
    networks:
      - genieai_network
    restart: "no"

  chatqna-xeon-backend-server:
    build:
      # Set the context to the root of the GENIE-AI repo
      context: .
      # Point to our new, custom multi-stage Dockerfile
      dockerfile: ./genie-ai-overlay/chatqna/Dockerfile-chatqna_genie-ai
      args:
        OPEA_VERSION: ${OPEA_VERSION:-v1.3}
        OPEA_REPO_URL: ${OPEA_EXAMPLES_URL}
    image: genie-ai-chatqna-server:${OPEA_VERSION:-latest}
    container_name: genie-ai-chatqna-server
    working_dir: /app/ChatQnA
    depends_on:
      vllm:
        condition: service_healthy
      embedding:
        condition: service_started
      retriever-arango-service:
        condition: service_started
      reranker:
        condition: service_started
    ports:
      - "${OPEA_PORT}:${OPEA_PORT}"
    env_file:
      - .env
    environment:
      CHATQNA_TYPE: ${CHATQNA_TYPE}
      MEGA_SERVICE_HOST_IP: ${MEGA_SERVICE_HOST_IP}
      EMBEDDING_SERVER_HOST_IP: ${EMBEDDING_SERVER_HOST_IP}
      EMBEDDING_SERVER_PORT: ${EMBEDDING_SERVER_PORT}
      RETRIEVER_SERVICE_HOST_IP: ${RETRIEVER_SERVICE_HOST_IP}
      RETRIEVER_SERVICE_PORT: ${RETRIEVER_SERVICE_PORT}
      RERANK_SERVER_HOST_IP: ${RERANK_SERVER_HOST_IP}
      RERANK_SERVER_PORT: ${RERANK_SERVER_PORT}
      LLM_SERVER_HOST_IP: ${LLM_SERVER_HOST_IP}
      LLM_SERVER_PORT: ${LLM_SERVER_PORT}
      GUARDRAIL_SERVICE_HOST_IP: ${GUARDRAIL_SERVICE_HOST_IP}
      GUARDRAIL_SERVICE_PORT: ${GUARDRAIL_SERVICE_PORT}
      TRANSLATION_SERVICE_HOST_IP: ${TRANSLATION_SERVICE_HOST_IP}
      TRANSLATION_SERVICE_PORT: ${TRANSLATION_SERVICE_PORT}
      DOC_REPO_URL: ${DOC_REPO_URL}
      GET_AUTH_TOKEN_URL: ${GET_AUTH_TOKEN_URL}
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"

  chatqna-xeon-ui-server:
    image: opea/chatqna-ui:latest
    container_name: chatqna-xeon-ui-server
    depends_on:
      - chatqna-xeon-backend-server
    ports:
      - "${FRONTEND_SERVICE_PORT}:${FRONTEND_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      UPLOAD_FILE_BASE_URL: http://localhost:6007/v1/dataprep/ingest
    ipc: "host"
    networks:
      - genieai_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chatqna-xeon-nginx-server:
    image: opea/nginx:latest
    container_name: chatqna-xeon-nginx-server
    depends_on:
      chatqna-xeon-backend-server:
        condition: service_started
      chatqna-xeon-ui-server:
        condition: service_healthy
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    env_file:
      - .env
    environment:
      FRONTEND_SERVICE_IP: ${FRONTEND_SERVICE_IP}
      FRONTEND_SERVICE_PORT: ${FRONTEND_SERVICE_PORT}
      BACKEND_SERVICE_NAME: ${BACKEND_SERVICE_NAME}
      BACKEND_SERVICE_IP: ${BACKEND_SERVICE_IP}
      BACKEND_SERVICE_PORT: ${BACKEND_SERVICE_PORT}
      DATAPREP_SERVICE_IP: ${DATAPREP_SERVICE_IP}
      DATAPREP_SERVICE_PORT: ${DATAPREP_SERVICE_PORT}
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  vllm:
    container_name: vllm-vllm-2
    image: vllm/vllm-openai:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${LLM_SERVER_PORT}:${LLM_SERVER_PORT}"
    command: 
      --model ${VLLM_LLM_MODEL_ID}
      --gpu_memory_utilization ${VLLM_GPU_UTIL:-0.4}
      --served-model-name ${VLLM_LLM_MODEL_ID}
      --max_model_len ${VLLM_MAX_MODEL_LEN:-2048}
      --max_num_seqs 64
      --dtype=${VLLM_DTYPE:-half}
      --enforce-eager
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ATTENTION_BACKEND=TORCH_SDPA
      - VLLM_USE_FLASHINFER_SAMPLER=0
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  textgen:
    container_name: llm-textgen
    # Corrected: Pulling the pre-built, versioned image
    image: opea/llm-textgen:latest
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - LLM_ENDPOINT=${VLLM_ENDPOINT}
      - LLM_MODEL_ID=${VLLM_LLM_MODEL_ID}
    ports:
      - "${TEXTGEN_PORT}:${TEXTGEN_PORT}"
    ipc: "host"
    networks:
      - genieai_network
    restart: unless-stopped

  vllm-translation-guardrail:
    container_name: vllm-vllm-translation-guardrail
    image: vllm/vllm-openai:v0.10.0
    # image: vllm/vllm-openai:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${VLLM_TRANSLATION_SERVICE_PORT}:${VLLM_TRANSLATION_SERVICE_PORT}"
    command: 
      --model ${VLLM_TRANSLATION_MODEL_ID}
      --gpu_memory_utilization ${VLLM_TRANSLATION_GPU_UTIL:-0.4}
      --served-model-name ${VLLM_TRANSLATION_MODEL_ID}
      --max_model_len ${VLLM_TRANSLATION_MAX_MODEL_LEN:-2048}
      --kv-cache-dtype=${VLLM_TRANSLATION_KV_CACHE_DTYPE:-fp8}
      --dtype=${VLLM_TRANSLATION_DTYPE:-half}
      --port ${VLLM_TRANSLATION_SERVICE_PORT}
      --max_num_seqs 64
      --enforce-eager
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    networks:
      - genieai_network
    ipc: "host"
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9031/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  translation:
    image: opea/translation:latest
    container_name: translation-microservice
    environment:
      - LLM_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT}  
      - LLM_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
    ports:
      - "${TRANSLATION_SERVICE_PORT}:${TRANSLATION_SERVICE_PORT}"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  guardrail:
    container_name: llm-guardrail
    # Corrected: Pulling the pre-built, versioned image
    image: opea/guardrails:latest
    environment:
      - LLM_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT}
      - LLM_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
      - SAFETY_GUARD_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
      - GUARDRAILS_COMPONENT_NAME=OPEA_GEMMA_GUARD
    ports:
      - "${GUARDRAIL_SERVICE_PORT}:${GUARDRAIL_SERVICE_PORT}"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"
  
  tei:
    # image: ghcr.io/huggingface/text-embeddings-inference:latest
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.7
    container_name: tei-embedding-serving
    # ROMAN: updated code (for review)
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${EMBEDDING_MODEL_ID} --dtype float16 --max-batch-tokens 1024 --max-concurrent-requests 8"
    # entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${EMBEDDING_MODEL_ID} --max-batch-tokens 2048 --max-concurrent-requests 64"
    runtime: nvidia
    ports:
      - "7000:80"
    volumes:
      - "${DATA_PATH:-./data}:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=${RUST_BACKTRACE}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    depends_on:
      vllm-translation-guardrail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 6s
      retries: 48
    networks:
      - genieai_network
    restart: "no"

  embedding:
    container_name: embedding
    # Corrected: Pulling the pre-built, versioned image
    image: opea/embedding:latest
    depends_on:
      tei:
        condition: service_healthy
    environment:
      - EMBEDDING_MODEL_ENDPOINT=${EMBEDDING_MODEL_ENDPOINT}
      - TEI_EMBEDDING_ENDPOINT=${TEI_EMBEDDING_ENDPOINT}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID}
    ports:
      - "6000:6000"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

  tei_reranker:
    # image: ghcr.io/huggingface/text-embeddings-inference:latest
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.8
    container_name: tei-reranker-serving
      # entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${RERANKER_MODEL_ID}"
    # ROMAN: updated code (for review)
    entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${RERANKER_MODEL_ID} --max-batch-tokens 1024 --max-concurrent-requests 8 --auto-truncate"
    # entrypoint: /bin/sh -c "text-embeddings-router --json-output --model-id ${RERANKER_MODEL_ID} --max-batch-tokens 2048 --max-concurrent-requests 64 --auto-truncate"
    runtime: nvidia
    ports:
      - "7100:80"
    volumes:
      - "${DATA_PATH:-./data}:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - RUST_BACKTRACE=1${RUST_BACKTRACE}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    depends_on:
      vllm-translation-guardrail:
        condition: service_healthy
      # ROMAN: new code (for review)
      tei:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 6s
      retries: 48
    networks:
      - genieai_network
    restart: "no"

  reranker:
    container_name: reranker
    image: opea/reranking:latest
    depends_on:
      tei_reranker:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - RERANKER_MODEL_ENDPOINT=${RERANKER_MODEL_ENDPOINT}
      - TEI_RERANKING_ENDPOINT=${TEI_RERANKING_ENDPOINT}
    ports:
      - "6100:8000"
    ipc: "host"
    networks:
      - genieai_network
    restart: "no"

networks:
  genieai_network:
    name: genieai_mvp_genieai_network
    driver: bridge