version: '3.8'

volumes:
  redis_data:
  doc_repo_uploads: {}
  arango_data:
  drought_reports: {}

services:
  arango-vector-db:
    image: arangodb/arangodb:3.12.4
    container_name: arango-vector-db
    ports:
      - "8529:8529"
    volumes:
      - /root/arango_data:/var/lib/arangodb3
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD}
    # https://docs.arangodb.com/3.12/components/arangodb-server/options/
    command: ["--experimental-vector-index=true"]
    restart: unless-stopped
    networks:
      - chatqna_default

  frontend:
    build: ./gov-chat-frontend
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - ./gov-chat-frontend/.env
    depends_on:
      - backend
    networks:
      - chatqna_default

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379" # Optional: Expose on host for debugging
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "!@#$$5678"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chatqna_default

  backend:
    build:
      context: .
      dockerfile: gov-chat-backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./database_backups:/app/database_backups
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gov-chat-backend/Uploads:/app/Uploads
      - ./secrets:/opt/genie:ro
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret}
      # Firebase Admin / FCM notifications
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - NOTIFICATION_BROADCAST_SECRET=${NOTIFICATION_BROADCAST_SECRET:-}
      # Translation Service Configuration
      - TRANSLATION_BACKEND=${TRANSLATION_BACKEND:-cpu}
      - TRANSLATION_CPU_MODEL_ID=${TRANSLATION_CPU_MODEL_ID:-Xenova/nllb-200-distilled-600M}
      - TRANSLATION_THREADS=${TRANSLATION_THREADS:-4}
      - TRANSLATION_BATCHES=${TRANSLATION_BATCHES:-5}
      - TRANSLATION_CACHE=${TRANSLATION_CACHE:-on}
      - TRANSLATION_CACHE_HOST=${TRANSLATION_CACHE_HOST:-redis-cache}
      - TRANSLATION_CACHE_PORT=${TRANSLATION_CACHE_PORT:-6379}
      - TRANSLATION_CACHE_PASSWORD=${TRANSLATION_CACHE_PASSWORD:-!@#$$5678}
      # GPU Translation Configuration (vLLM)
      - VLLM_TRANSLATION_MODEL_ID=${VLLM_TRANSLATION_MODEL_ID}
      - VLLM_TRANSLATION_ENDPOINT=${VLLM_TRANSLATION_ENDPOINT}
      - VLLM_TRANSLATION_SERVICE_PORT=${VLLM_TRANSLATION_SERVICE_PORT:-9031}
    env_file:
      - ./gov-chat-backend/.env
    depends_on:
      redis-cache:
        condition: service_healthy
    networks:
      - chatqna_default

  document-repository:
    build:
      context: .
      dockerfile: document-repository/Dockerfile
    container_name: doc-repo-dev
    env_file:
      - ./document-repository/.env
    depends_on:
      - clamav
    ports:
      - "3001:3001"
    networks:
      - chatqna_default
    volumes:
      - ./logs:/app/logs
      - doc_repo_uploads:/app/uploads

  clamav:
    image: clamav/clamav
    container_name: clamav
    ports:
      - "3310:3310" # ClamAV daemon port
    networks:
      - chatqna_default

  drought_monitoring:
    build:
      context: ./drought_monitoring
      dockerfile: dockerfile
    container_name: drought-monitoring
    volumes:
      # GEE credentials — run `earthengine authenticate` on the host first
      - ${HOME}/.config/earthengine:/root/.config/earthengine:ro
      # Shared PDF reports volume — also mounted by weather-mcp-standalone (read-only)
      - drought_reports:/app/reports
    environment:
      - GEE_PROJECT=${GEE_PROJECT:-mewa-493916}
      - DROUGHT_REPORTS_DIR=/app/reports
      - ARANGO_URL=http://arango-vector-db:8529
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-genie-ai}
      - ARANGO_USER=${ARANGO_USER:-root}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - arango-vector-db
    restart: unless-stopped
    networks:
      - chatqna_default
    # No host port — internal service only (called by warning_system_engine)

  warning-system-engine:
    build:
      context: ./warning_system_engine
      dockerfile: Dockerfile
    container_name: warning-system-engine
    env_file:
      - ./warning_system_engine/.env
    environment:
      - DROUGHT_MONITORING_URL=http://drought-monitoring:8001
    depends_on:
      - arango-vector-db
      - drought-monitoring
    restart: unless-stopped
    networks:
      - chatqna_default

  weather-mcp-standalone:
    build:
      context: ./weather-mcp-service
    container_name: weather-mcp-standalone
    ports:
      - "8000:8000"
    volumes:
      - ./warning_system_engine:/warning_system_engine:ro
      # Read-only mount of drought PDF reports for serving via /drought/report/
      - drought_reports:/app/drought_reports:ro
    environment:
      - PYTHONUNBUFFERED=1
      - WARNING_SYSTEM_ENGINE_DIR=/warning_system_engine
      - DROUGHT_REPORTS_DIR=/app/drought_reports
      - DROUGHT_MONITORING_URL=http://drought-monitoring:8001
      # Add these in .env or here
      # - GOOGLE_API_KEY=your_google_api_key
      # - MAPBOX_ACCESS_TOKEN=your_mapbox_token
    networks:
      - chatqna_default
    restart: unless-stopped

networks:
  chatqna_default:
    external: true
