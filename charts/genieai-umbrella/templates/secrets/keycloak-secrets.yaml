{{- if and .Values.secrets.sealedSecrets.enabled .Values.data.keycloak.enabled -}}
{{- /* Keycloak bootstrap secret consumed by the CNPG Cluster
       (keycloak-db-credentials). The remaining Keycloak-connected secrets
       (keycloakClientSecret, keycloakProxyClientSecret,
       kcDataprepClientSecret, kcGrafanaClientSecret) are added together
       with the components that consume them. The Keycloak admin password
       is set out-of-band via kcadm after realm import — the
       KeycloakRealmImport CR cannot read Kubernetes Secrets, so no
       admin-credential SealedSecret is rendered here. */ -}}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-db-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" (deepCopy .Values | merge (dict "component" "sealed-secret"))) | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  encryptedData:
    # CNPG initdb.secret requires BOTH keys. PLACEHOLDER+ sentinels (valid
    # base64 of "PLACEHOLDER+"); a still-sentinel release fails the
    # pre-upgrade drift hook and the helm-test materialization check at
    # runtime. Re-seal with kubeseal before helm install.
    username: UExBQ0VIT0xERVIr
    password: UExBQ0VIT0xERVIr
{{- end -}}
