server {
    listen 80;
    listen [::]:80;
    server_name _;

    # include the security headers
    include conf.d/security-headers.conf;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://e2e-82-109.ssdcloudindia.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # include the security headers
    include conf.d/security-headers.conf;

    # set a 50MB file size limit
    client_max_body_size 50m;

    location ~ /\. {
      deny all;
      return 404;
    }

    # Block access to sensitive files and version control systems
    location ~ /(BitKeeper|\.git|\.svn|\.hg|CVS) {
      deny all;
      return 404;
    }

    # For robots.txt, sitemap.xml and other specific text files
    location ~* \.(txt|xml)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; font-src 'self' data:" always;
        add_header Access-Control-Allow-Origin "https://e2e-82-109.ssdcloudindia.net" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # For the /uploads/ location specifically
    location /Uploads/ {
        # All the security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Complete CSP with all required directives including frame-ancestors and form-action
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; font-src 'self' data:" always;

        add_header Access-Control-Allow-Origin "https://e2e-82-109.ssdcloudindia.net" always;

        try_files $uri =404;
    }

    # Explicit WebSocket location
    location /ws {
        proxy_pass http://e2e-109-51:8090/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host genie-ai.itu.int;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Sec-WebSocket-Extensions ""; # Clear extensions to prevent permessage-deflate
    }

    # Frontend Vue.js application
    location / {
        # Try direct connection with original host header
        proxy_pass http://e2e-109-51:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Use genie-ai.itu.int as Host header
        proxy_set_header Host genie-ai.itu.int;
        
        # Don't buffer so we get errors right away
        proxy_buffering off;

        # Timeout settings for gateway (300 seconds)
        proxy_connect_timeout 300s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Updated CSP for frontend to include WebSocket and Font Awesome
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://e2e-82-109.ssdcloudindia.net wss://genie-ai.itu.int:443 ws://localhost:8090 wss://localhost:8090 ws://e2e-g2-109.ssdcloudindia.net:443 wss://e2e-g2-109.ssdcloudindia.net:443; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; font-src 'self' data:" always;
        
        # Fixed Access-Control-Allow-Origin to use a specific origin
        add_header Access-Control-Allow-Origin "https://e2e-82-109.ssdcloudindia.net" always;
    }

    # Backend API through Kong
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://e2e-82-109.ssdcloudindia.net' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }
    
        # For non-OPTIONS requests, ensure CORS headers are still applied
        add_header 'Access-Control-Allow-Origin' 'https://e2e-82-109.ssdcloudindia.net' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    
        proxy_pass http://kong:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings for gateway (300 seconds)
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Updated CSP for backend API with all required directives
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; font-src 'self' data:" always;
    }
}
