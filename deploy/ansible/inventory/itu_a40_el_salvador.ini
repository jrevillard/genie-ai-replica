# GENIE.AI Docker Swarm - El Salvador Environment
#
# The environment group tells Ansible which group_vars to load:
#   - group_vars/itu_rtx_el_salvador/vars.yml (non-secret config)
#   - group_vars/itu_rtx_el_salvador/vault.yml (encrypted secrets)
#   - group_vars/all.yml is always loaded (shared config)

# --- Environment group ---

[itu_a40_el_salvador]
genieai-sv ansible_host=164.52.198.148

# --- Role groups ---

[swarm_managers]
genieai-sv

[gpu_nodes]
genieai-sv

[all:vars]
ansible_user=root
