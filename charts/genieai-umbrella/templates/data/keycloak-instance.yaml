{{- if .Values.data.keycloak.enabled -}}
{{- $instances := .Values.data.keycloak.instances | default 1 -}}
{{- if eq .Values.clusterProfile "prod" -}}
{{- $instances = 2 -}}
{{- end -}}
{{- $ns := .Values.namespace -}}
{{- $dbHost := printf "%s-rw.%s.svc.cluster.local" (.Values.data.keycloak.cnpgServiceName | default "keycloak-db") $ns -}}
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: {{ $ns }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "identity") | nindent 4 }}
    genieai.io/data-tier: identity
spec:
  # The convergence Job authenticates with these credentials, so they
  # must exist before it runs — otherwise its first token call returns
  # 401 and the release fails. The Secret is operator-provided; the
  # chart references it by name and never reads its contents.
  #
  # Upstream caveat: if a master realm already exists on the cluster,
  # the operator ignores this stanza entirely. The symptom is a 401 on
  # the Job's first authenticated call — not a clearer message.
  bootstrapAdmin:
    user:
      secret: {{ .Values.data.keycloak.bootstrapAdmin.userSecret | default "keycloak-admin-credentials" }}
  instances: {{ $instances }}
  # CNPG hosts the Postgres database; the secret holds both `username` and
  # `password` keys (CNPG bootstrap requirement). The chart does NOT
  # materialize the secret — operators wire it from their secret backend.
  db:
    vendor: {{ .Values.data.keycloak.db.vendor | default "postgres" }}
    host: {{ $dbHost }}
    port: {{ .Values.data.keycloak.db.port | default 5432 }}
    database: {{ .Values.data.keycloak.db.database | default "keycloak" }}
    usernameSecret:
      name: {{ .Values.data.keycloak.db.secretName }}
      key: username
    passwordSecret:
      name: {{ .Values.data.keycloak.db.secretName }}
      key: password
  # TLS terminates at the edge (Envoy Gateway); the pod serves plain HTTP
  # internally. Letting the operator create an Ingress would shadow that.
  http:
    httpEnabled: {{ .Values.data.keycloak.http.httpEnabled | default true }}
  hostname:
    # Fixed frontend URL (issuer base): tokens carry this issuer on every
    # request path, so the browser OIDC flow and the backend validation
    # agree. Full URL including the /auth context path (upstream hostname
    # v2 accepts scheme://host[:port]/path). When ingress.host is unset,
    # falls back to strict:false and derives per-request — fine for
    # throwaway clusters, wrong whenever two clients reach Keycloak
    # through different hostnames.
    strict: {{ .Values.data.keycloak.hostname.strict | default false }}
    {{- if .Values.ingress.host }}
    hostname: {{ printf "%s://%s/auth" (.Values.ingress.scheme | default "https") .Values.ingress.host }}
    {{- end }}
    # Backchannel URLs (JWKS, token, userinfo inside the discovery
    # document) keep deriving from the request host, so in-cluster
    # consumers get keycloak-service URLs they can resolve while the
    # issuer stays pinned to the public hostname.
    backchannelDynamic: true
  ingress:
    enabled: false
  {{- /*
    Optional image override. Unset (default) the operator runs its own
    pinned stock Keycloak image — no GENIE.AI theme in it, and the realm's
    loginTheme falls back to the built-in theme. The theme-baked
    genie-ai-keycloak image (configs/keycloak/Dockerfile: stock + COPY
    themes) is the natural choice wherever the registry is reachable.
    Same convention as the service factory: imageRegistry-prefixed when
    the top-level imageRegistry is set.
  */ -}}
  {{- if .Values.data.keycloak.image.repository }}
  image: {{ printf "%s/%s:%s" (.Values.imageRegistry | default "") .Values.data.keycloak.image.repository (.Values.data.keycloak.image.tag | default "main") }}
  {{- end }}
  # Trust X-Forwarded-* from Envoy. KC_PROXY=edge was removed in KC 24+;
  # spec.proxy.headers is the only path. Misconfiguration manifests as
  # `Invalid parameter: redirect_uri` loops on login.
  proxy:
    headers: {{ .Values.data.keycloak.proxy.headers | default "xforwarded" }}
  # KC 26 prod start mode (--optimized). The stock quay.io/keycloak image
  # has no pre-built server: `start --optimized` on first boot refuses
  # ("Please don't use this flag for the first startup or use kc.sh
  # build"). Default to false; custom pre-built images override to true.
  startOptimized: {{ .Values.data.keycloak.startOptimized | default false }}
  # Image-bump = single-pod recreate (DB migrations need exclusive access).
  # Chart defaults to instances: 1; prod instances: 2 with manual drain on
  # operator image bumps.
  update:
    strategy: {{ .Values.data.keycloak.update.strategy | default "RecreateOnImageChange" }}
  # KC 26 default probe timing is fine (10min startup grace). Memory request
  # is the real knob: lower it and the pod OOMs before becoming ready.
  resources:
    requests:
      cpu: 500m
      memory: 1700Mi
    limits:
      cpu: 2
      memory: 2Gi
  # templates/services/backend.yaml and documentRepository.yaml both dial
  # `.../keycloak-service:8080/auth`. Nothing else configures that prefix
  # on Kubernetes — in the Swarm path NGINX routes /auth/* — so without
  # this option Keycloak serves at / and every authenticated request 404s.
  additionalOptions:
    - name: http-relative-path
      value: /auth
{{- end -}}
