    - ansible-playbook --syntax-check deploy/ansible/deploy-gpu.yml
    - yamllint -c deploy/ansible/.yamllint deploy/ansible/
    # Renders the #1227 payload probe/heal command builders through real
    # ansible and executes the tokenized output — the two layers
    # --syntax-check cannot see (it never templates set_fact values, and
    # shlex splitting decides what find receives). Mutation-proven red on
    # the paren-glue bug this closes.
    - bash tests/ansible-non-root/check-command-render.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "deploy/**/*"
