  1-8a-forbidden-gate: done  # [DONE 2026-10-09 — MERGED into feat/okf-server via merge 2e9be556d (squashed content a1046629c), verified from branch history on fix/story-1-8b-routing-gate-v2; was in-review on fix/story-1-8a-forbidden-gate → MR, 2026-10-09. Note: this key previously sat INLINE inside the 1-8-head-tester comment above and was invisible to YAML — split onto its own line 2026-10-09] David 2026-10-08: "under no circumstances should 'fun in Indonesia' be routed to the NCD Information repo… this should NEVER happen" + "the genetics query is borderline… probably in". The verdict is no longer rank alone: a head CLAIMS a query only when its score clears its own forbidden centroid by ROUTE_HEAD_MARGIN (default 0.01, calibrated 2026-10-08 on NCD: suppressed band avg−forbidden ∈ [−0.062, −0.008] = mental-health/nutrition/exercise/'fun in Indonesia'; selected band ≥ +0.024 = 'genetic risk factors for cancer' and the two cancer/asthma positives at +0.106/+0.122). Same gate in the retriever — a head's pseudo-row is dropped when margin ≤ 0; gate degrades open when per_field.forbidden is null (pre-1.8a rebuild). Evidence: live reproduction with the production TEI endpoint at 15:50 (head math) — every adversarial query (mental-health, nutrition, exercise, fun in Indonesia) sits below the gate, every positive (cancer screening, asthma) above, genetics borderline-IN as David ruled. Files: okf-server/services/head-test-service.js (the gate + head_claimed/forbidden_cosine/head_margin telemetry + provenance="head-suppressed (forbidden/noise)"); okf-server/services/head-suite-service.js (suite rows carry the gate fields; summarizeRun evaluates negatives solo via head_claimed === false, legacy results without the field keep the sibling-gated floor); genie-ai-overlay/retriever/{config.py,genieai_retriever_arangodb.py} (ROUTE_HEAD_MARGIN env + drop-in-the-pool filter); frontend HeadTestDialog.vue (new Claims-query column; verdict distinguishes rank-fail from gate-suppressed; a