{{- if .Values.observability.traces.enabled }}
{{- /*
  VTSingle CR — single-node VictoriaTraces.
  apiVersion: vmoperator v0.75.0 places VTSingle under
  operator.victoriametrics.com/v1 (the same group as VLSingle). Earlier
  releases exposed it under a separate victoriametrics.com/v1beta1
  group that is no longer served by the current CRD. Validation
  deferred to first reconcile — the operator is not installed locally.

  The operator creates the in-cluster Service <kind>-<metadata.name>
  ("vtsingle-vtraces"). VictoriaTraces serves two distinct HTTP
  surfaces on it: OTLP ingest on 4318 (HTTP) + 4317 (gRPC) — what the
  collector gateway exports to — and the Jaeger/Tempo query API on
  10428 — what Grafana's jaeger datasource and the trace UIs read.
  No tempo-proxy needed: the query API is native.
*/}}
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: vtraces
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "observability") | nindent 4 }}
spec:
  retentionPeriod: {{ .Values.observability.traces.retentionPeriod | quote }}
  removePvcAfterDelete: false
  storage:
    resources:
      requests:
        storage: {{ .Values.observability.traces.storageSize | quote }}
  replicaCount: 1
---
{{- /*
  The operator's default Service publishes only the 10428 query port —
  VictoriaTraces also listens on 4318 (OTLP/HTTP) and 4317 (gRPC), which
  the collector gateway exports to, but nothing exposes them (live-hit:
  "no route to host" on svc:4318 with an endpoints list carrying 10428
  only). The CRD's spec is fully x-kubernetes-preserve-unknown-fields, so
  a serviceSpec guess would be silently swallowed instead of rejected —
  this explicit Service is deterministic.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: vtsingle-otlp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "observability") | nindent 4 }}
spec:
  selector:
    managed-by: vm-operator
    app.kubernetes.io/instance: vtraces
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
{{- end }}
