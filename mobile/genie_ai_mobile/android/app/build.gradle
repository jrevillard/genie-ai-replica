plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android" // Changed from "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.itu.genieai"
    ndkVersion = "27.0.12077973"
    compileSdk = 36

    compileOptions {
        // Updated to Java 17 for Gradle 8.5 compatibility
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        // Updated to Java 17
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.itu.genieai.debug"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        testInstrumentationRunner = "pl.leancode.patrol.PatrolJUnitRunner"
    }

    testOptions {
        execution = "ANDROIDX_TEST_ORCHESTRATOR"
    }

    flavorDimensions "environment"

    productFlavors {
        dev {
            dimension "environment"
            applicationId = "com.itu.genieai.dev"
            manifestPlaceholders = [
                appAuthRedirectScheme: "com.itu.genieai.dev"
            ]
        }
        staging {
            dimension "environment"
            applicationId = "com.itu.genieai.staging"
            manifestPlaceholders = [
                appAuthRedirectScheme: "com.itu.genieai.staging"
            ]
        }
        e2e {
            dimension "environment"
            applicationId = "com.itu.genieai.e2e"
            manifestPlaceholders = [
                appAuthRedirectScheme: "com.itu.genieai.e2e"
            ]
        }
        itu {
            dimension "environment"
            applicationId = "com.itu.genieai"
            manifestPlaceholders = [
                appAuthRedirectScheme: "com.itu.genieai"
            ]
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Issue #1009: a release build must NEVER be silently debug-signed.
            // The fallback stays (local test releases have no keystore), but it
            // is loud: the keystore is supplied locally through
            // android/key.properties (gitignored) — never committed.
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            if (!keystorePropertiesFile.exists()) {
                logger.warn("Release build is DEBUG-SIGNED: no ${keystorePropertiesFile.name} found. " +
                    "Copy android/key.properties.example to android/key.properties and fill it in " +
                    "before publishing this artifact.")
            }
            // R8/ProGuard rules — see proguard-rules.pro for the rationale.
            // flutter_secure_storage's bundled Tink library references
            // com.google.errorprone.annotations.* and javax.annotation.*,
            // which are compile-time-only. Without these rules R8 errors
            // on the missing classes during `flutter build apk --release`.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Issue #1009: R8 was OFF (the rules file above was inert) — the
            // release APK shipped unminified. The Flutter engine/plugin keep
            // rules live in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // PatrolJUnitRunner was added to main APK by Flutter via debugApi, but the
    // Gradle subproject no longer exists (patrol removed from dev_dependencies
    // because it auto-registered PatrolPlugin in GeneratedPluginRegistrant.java
    // and broke release builds). Re-add the line below if/when a test that
    // needs the native runner is in scope.
    // androidTestImplementation(project(":patrol"))

    androidTestImplementation("androidx.test:core:1.5.0")
    androidTestImplementation("androidx.test:rules:1.2.0")
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.test.services:test-services:1.4.2")
    androidTestUtil("androidx.test:orchestrator:1.5.1")
}