apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "genieai-common.fullname" . }}-clusterprofile-detect
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "clusterprofile-detect") | nindent 4 }}
    app.kubernetes.io/component: clusterprofile-detect
  annotations:
    # pre-upgrade ONLY: the Namespace carrying genieai.io/cluster-profile is
    # a regular resource, and regular resources apply after every pre-install
    # hook — on a fresh install the label cannot exist while any hook runs.
    # By the time an upgrade starts, the previous revision's Namespace
    # already carries the label, so drift detection has something to read.
    "helm.sh/hook": pre-upgrade
    # Runs before the dependency check (-5) so operators checking upgrade
    # progress see profile drift surfaced alongside dependency failures.
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "clusterprofile-detect") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: detect
          # registry.k8s.io/kubectl is the upstream kubectl image; alpine
          # has no kubectl binary at all. (The bitnami/kubectl version tags
          # were purged from Docker Hub — only `latest` remains, which is
          # not pinnable.)
          image: "{{ .Values.global.imageRegistry | default "registry.k8s.io" }}/kubectl:v1.33.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: RENDERED_PROFILE
              value: {{ .Values.clusterProfile | default "dev" | quote }}
            - name: TARGET_NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: DRIFT_MSG
              # Operator-facing drift text. The detected namespace label
              # value lands in the printed output via a $detected shell
              # substitution at runtime, not via render-time interpolation
              # — rendering $detected here would require double-escaping
              # every shell metacharacter in the field, and a hostile
              # label value (backtick, $, ", newline) would otherwise
              # break the printf-built manifest below. Static text only.
              value: "cluster-profile drift: namespace label does not match the profile this release renders. If unintentional, set clusterProfile to the detected value on the next upgrade; if this upgrade intentionally changes the profile, ignore — the label updates when this upgrade applies."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ns="$TARGET_NAMESPACE"
              # The profile this release actually deploys, baked in at render
              # time: a running Job has no access to Helm values, and Helm
              # never re-renders templates mid-install/upgrade — so the only
              # faithful comparison target is the literal rendered value.
              rendered="$RENDERED_PROFILE"
              # The label is applied by a regular Namespace resource, which
              # can lag hook start; poll a bounded 3 attempts, 2s apart.
              detected=""
              read_failed=0
              for attempt in 1 2 3; do
                if profile=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.genieai\.io/cluster-profile}' 2>/dev/null); then
                  if [ -n "$profile" ]; then
                    detected="$profile"
                    break
                  fi
                else
                  read_failed=1
                fi
                [ "$attempt" -lt 3 ] && sleep 2
              done
              if [ -z "$detected" ] && [ "$read_failed" -eq 1 ]; then
                echo "WARN: namespace label read failed; skipping drift check" >&2
              fi
              if [ -n "$detected" ] && [ "$detected" != "$rendered" ]; then
                # Echo a one-line summary that includes the detected value
                # (echo is shell-quoted, so metacharacters in $detected
                # render as literal text, not as shell control).
                echo "DRIFT: cluster-profile namespace label '${detected}' != rendered '${rendered}'"
                # The Event is the visibility channel (kubectl describe ns).
                # Built from static printf lines so no operator-controlled
                # value (namespace, drift text) is expanded at render
                # time — every dynamic value lands as a shell variable
                # inside the printf body. $DRIFT_MSG is the operator-facing
                # drift text (static, set as a container env); the
                # namespace and detected label flow through $ns and
                # $detected without touching printf's format string.
                printf '%s\n' \
                  "apiVersion: v1" \
                  "kind: Event" \
                  "metadata:" \
                  "  name: genieai-profile-drift-$(date +%s)" \
                  "  namespace: $ns" \
                  "involvedObject:" \
                  "  apiVersion: v1" \
                  "  kind: Namespace" \
                  "  name: $ns" \
                  "reason: ClusterProfileDetected" \
                  "type: Warning" \
                  "message: $DRIFT_MSG" \
                  | kubectl create -f - >/dev/null 2>&1 || echo "WARN: event create failed" >&2
              fi
              # Drift detection is advisory: a mismatch (or an unreadable
              # label) must never block the upgrade itself.
              exit 0
