# --- Existing jobs (unchanged) ---

# Unit tests — runs on every PR touching mobile/
# Downloads Flutter SDK from official archive with caching
test:flutter:
  extends: .flutter_base
  stage: test
  script:
    - export PATH="$PWD/../../flutter-sdk/bin:$PATH"
    # Pinned: the guard gates below grep the XML shape tojunit emits; an
    # unpinned bump that serialized skips differently would silence them.
    - dart pub global activate junitreport_maintained 2.0.5
    - export PATH="$PATH:$PUB_CACHE/bin"
    - mkdir -p reports
    - flutter test --machine --coverage > reports/flutter-machine.json 2>&1
    - cat reports/flutter-machine.json | tojunit --output reports/flutter-report.xml
    # Release-build control: getConfig() resolves the flavor from the FLAVOR
    # dart-define and fails at startup in a release or profile build made
    # without it (#1099). Running the config test with the define proves the
    # release recipe — itu selected, trust-all client off — instead of only
    # asserting it in prose.
    - flutter test --machine --dart-define=FLAVOR=itu test/config/keycloak_config_test.dart > reports/flutter-flavor-machine.json 2>&1
    - cat reports/flutter-flavor-machine.json | tojunit --output reports/flutter-flavor-report.xml
    # The same control, from the other side: the release guard test asserts
    # that a release or profile compilation WITHOUT the define fails at
    # startup. kReleaseMode is the dart.vm.product compile-time constant and
    # kProfileMode the dart.vm.profile one, so each mode is exercised by
    # defining it; the test skips itself outside those modes. The assertion
    # after each run exists because flutter test exits 0 on a skipped test:
    # a green job must mean the guard EXECUTED, not that it skipped.
    - flutter test --machine --dart-define=dart.vm.product=true test/config/keycloak_config_release_guard_test.dart > reports/flutter-release-guard-machine.json 2>&1
    - cat reports/flutter-release-guard-machine.json | tojunit --output reports/flutter-release-guard-report.xml
    - grep -q '<testcase' reports/flutter-release-guard-report.xml && ! grep -q '<skipped' reports/flutter-release-guard-report.xml
    - flutter test --machine --dart-define=dart.vm.profile=true test/config/keycloak_config_release_guard_test.dart > reports/flutter-profile-guard-machine.json 2>&1
    - cat reports/flutter-profile-guard-machine.json | tojunit --output reports/flutter-profile-guard-report.xml
    - grep -q '<testcase' reports/flutter-profile-guard-report.xml && ! grep -q '<skipped' reports/flutter-profile-guard-report.xml
    # The insecure-release refusal — a release compilation of a flavor with
    # allowInsecureConnections on (dev, e2e) fails at startup — and its
    # controls: a release build of a deployment flavor (staging, itu) still
    # resolves its config, and a profile build of dev stays exempt (#1249).
    # FLAVOR is a compile-time constant, so each combination is a dedicated
    # test file invoked with its own defines; the zero-skip gate proves the
    # case EXECUTED, for the same reason as the two runs above. A flavor
    # that turns the flag on needs its own combination file plus one run,
    # gate, marking pair and artifacts entry here — see
    # lib/config/flavors/template.dart for the flavor-side checklist.
    - flutter test --machine --dart-define=dart.vm.product=true --dart-define=FLAVOR=dev test/config/keycloak_config_insecure_release_dev_test.dart > reports/flutter-guard-dev-machine.json 2>&1
    - cat reports/flutter-guard-dev-machine.json | tojunit --output reports/flutter-guard-dev-report.xml
    - grep -q '<testcase' reports/flutter-guard-dev-report.xml && ! grep -q '<skipped' reports/flutter-guard-dev-report.xml
    - flutter test --machine --dart-define=dart.vm.product=true --dart-define=FLAVOR=e2e test/config/keycloak_config_insecure_release_e2e_test.dart > reports/flutter-guard-e2e-machine.json 2>&1
    - cat reports/flutter-guard-e2e-machine.json | tojunit --output reports/flutter-guard-e2e-report.xml
    - grep -q '<testcase' reports/flutter-guard-e2e-report.xml && ! grep -q '<skipped' reports/flutter-guard-e2e-report.xml
    - flutter test --machine --dart-define=dart.vm.product=true --dart-define=FLAVOR=staging test/config/keycloak_config_deployment_release_staging_test.dart > reports/flutter-guard-staging-machine.json 2>&1
    - cat reports/flutter-guard-staging-machine.json | tojunit --output reports/flutter-guard-staging-report.xml
    - grep -q '<testcase' reports/flutter-guard-staging-report.xml && ! grep -q '<skipped' reports/flutter-guard-staging-report.xml
    - flutter test --machine --dart-define=dart.vm.product=true --dart-define=FLAVOR=itu test/config/keycloak_config_deployment_release_itu_test.dart > reports/flutter-guard-itu-machine.json 2>&1
    - cat reports/flutter-guard-itu-machine.json | tojunit --output reports/flutter-guard-itu-report.xml
    - grep -q '<testcase' reports/flutter-guard-itu-report.xml && ! grep -q '<skipped' reports/flutter-guard-itu-report.xml
    - flutter test --machine --dart-define=dart.vm.profile=true --dart-define=FLAVOR=dev test/config/keycloak_config_profile_dev_test.dart > reports/flutter-guard-profile-dev-machine.json 2>&1
    - cat reports/flutter-guard-profile-dev-machine.json | tojunit --output reports/flutter-guard-profile-dev-report.xml
    - grep -q '<testcase' reports/flutter-guard-profile-dev-report.xml && ! grep -q '<skipped' reports/flutter-guard-profile-dev-report.xml
    # The flavor run re-runs test/config/keycloak_config_test.dart, so it
    # produces the same suite name and the same testcase names as the full
    # run above. tojunit (junitreport_maintained) has no --suite-name, so the
    # suite and class names are marked here: without this the two reports
    # collide in the merged JUnit view and it is impossible to tell which run
    # a failure came from.
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[flavor=itu] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[flavor=itu] ${2}${3}}' reports/flutter-flavor-report.xml
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=release] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=release] ${2}${3}}' reports/flutter-release-guard-report.xml
    - grep -q '\[mode=release\]' reports/flutter-release-guard-report.xml
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=profile] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=profile] ${2}${3}}' reports/flutter-profile-guard-report.xml
    - grep -q '\[mode=profile\]' reports/flutter-profile-guard-report.xml
    # The five combination runs above are also collected by the full-suite
    # run (skipped there, executed here), so they get the same marking
    # treatment: one tag per combination.
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=release flavor=dev] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=release flavor=dev] ${2}${3}}' reports/flutter-guard-dev-report.xml
    - grep -q '\[mode=release flavor=dev\]' reports/flutter-guard-dev-report.xml
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=release flavor=e2e] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=release flavor=e2e] ${2}${3}}' reports/flutter-guard-e2e-report.xml
    - grep -q '\[mode=release flavor=e2e\]' reports/flutter-guard-e2e-report.xml
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=release flavor=staging] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=release flavor=staging] ${2}${3}}' reports/flutter-guard-staging-report.xml
    - grep -q '\[mode=release flavor=staging\]' reports/flutter-guard-staging-report.xml
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=release flavor=itu] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=release flavor=itu] ${2}${3}}' reports/flutter-guard-itu-report.xml
    - grep -q '\[mode=release flavor=itu\]' reports/flutter-guard-itu-report.xml
    - perl -pi -e 's{(<testsuite\b[^>]*?\bname=")([^"]*)(")}{${1}[mode=profile flavor=dev] ${2}${3}}; s{(<testcase\b[^>]*?\bclassname=")([^"]*)(")}{${1}[mode=profile flavor=dev] ${2}${3}}' reports/flutter-guard-profile-dev-report.xml
    - grep -q '\[mode=profile flavor=dev\]' reports/flutter-guard-profile-dev-report.xml
    - perl -pi -e 's/&#x1[bB];\[[0-9;]*m//g; s/&#27;\[[0-9;]*m//g; s/\x1b\[[0-9;]*m//g; s/&#x1[bB];//g; s/&#27;//g; s/[\x00-\x08\x0b\x0c\x0e-\x1f]//g' reports/flutter-report.xml reports/flutter-flavor-report.xml reports/flutter-release-guard-report.xml reports/flutter-profile-guard-report.xml reports/flutter-guard-dev-report.xml reports/flutter-guard-e2e-report.xml reports/flutter-guard-staging-report.xml reports/flutter-guard-itu-report.xml reports/flutter-guard-profile-dev-report.xml
    - 'sed -i ''/lib\/i18n\//d'' coverage/lcov.info'
    - 'COV=$(awk ''/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{if(lf>0) printf "%.1f",lh/lf*100}'' FS=: coverage/lcov.info) && echo "Lines: ${COV}%" || echo "No coverage data"'
    - python3 -m venv /tmp/lcov-cov && . /tmp/lcov-cov/bin/activate && pip install lcov-cobertura && lcov_cobertura coverage/lcov.info --output reports/coverage-cobertura.xml
  coverage: '/^Lines:\s+(\d+\.?\d*)%/'
  artifacts:
    reports:
      junit:
        - mobile/genie_ai_mobile/reports/flutter-report.xml
        - mobile/genie_ai_mobile/reports/flutter-flavor-report.xml
        - mobile/genie_ai_mobile/reports/flutter-release-guard-report.xml
        - mobile/genie_ai_mobile/reports/flutter-profile-guard-report.xml
        - mobile/genie_ai_mobile/reports/flutter-guard-dev-report.xml
        - mobile/genie_ai_mobile/reports/flutter-guard-e2e-report.xml
        - mobile/genie_ai_mobile/reports/flutter-guard-staging-report.xml
        - mobile/genie_ai_mobile/reports/flutter-guard-itu-report.xml
        - mobile/genie_ai_mobile/reports/flutter-guard-profile-dev-report.xml
      coverage_report:
        coverage_format: cobertura
        path: mobile/genie_ai_mobile/reports/coverage-cobertura.xml
    paths:
      - mobile/genie_ai_mobile/coverage/
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "mobile/genie_ai_mobile/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# --- Merge-train e2e trigger filters (#1264) ---
# One shared changes: filter for the two merge-train e2e jobs, as a hidden
# anchor — same idiom as .chatqna_server_source_changes above — so a path
# addition cannot drift between e2e:playwright and its needs-partner
# e2e:integration: both jobs alias this one list, which makes the subset
# relation GitLab requires for a hard `needs` (a train whose paths
# instantiate e2e:playwright must also instantiate e2e:integration, or
# pipeline creation fails and the whole train goes red) hold by
# construction. Every DIRECT input the jobs execute or consume must be
# listed here, or e2e silently skips on the train (image-source inputs —
# the trees compiled into the pulled candidate images — are a deliberate
# exception, tracked in #1283):
#   - e2e:playwright runs tests/e2e/chatbot/, tests/e2e/documents/,
#     tests/e2e/admin/ and tests/e2e/theme-runtime-config.spec.js; it reads
#     tests/e2e/helpers/ and tests/e2e/fixtures/ at runtime, and is
#     installed/configured from package.json, package-lock.json and
#     playwright.config.js (see .e2e_web_base before_script + cache keys).
#   - e2e:integration deploys the stack from docker-compose.yaml seeded by
#     the env template (cp env .env); the stack also bind-mounts
#     configs/keycloak/themes/ and configs/otel/otel-collector-config.yaml
#     straight from this checkout (the frontend's public/config checkout
#     mount is already covered by the components/gov-chat-frontend glob).
#   - the rest of the configs/keycloak/ tree: genie-realm.yaml and the
#     import entrypoint are baked into the keycloak-config candidate image
#     (its themes/ subtree is the bind-mount covered by the bullet above) —
#     the ROPC-refusal probe in .e2e_web_base asserts the realm's runtime
#     behaviour, so any change in the tree must instantiate the e2e jobs.
# tests/e2e/okf/ is deliberately NOT listed: the OKF specs are not executed
# until MR2 wires them into the script (see .e2e_web_base script comment),
# and listing unexecuted paths only buys 30-minute train jobs that test
# nothing about the change — re-add the entry in MR2. Enforced by
# tests/config-validator.
.e2e_merge_train_changes: &e2e_merge_train_changes
  - components/gov-chat-frontend/**/*
  - components/gov-chat-backend/**/*
  - components/document-repository/**/*
  - tests/e2e/chatbot/**/*
  - tests/e2e/documents/**/*
  - tests/e2e/admin/**/*
  - tests/e2e/helpers/**/*
  - tests/e2e/provision-e2e-fixtures.js
  - tests/e2e/fixtures/**/*
  - tests/e2e/theme-runtime-config.spec.js
  - playwright.config.js
  - package.json
  - package-lock.json
  - docker-compose.yaml
  - env
  - configs/keycloak/**/*
  - configs/otel/otel-collector-config.yaml
  - .gitlab-ci.yml

# Integration E2E — compose stack from candidate images (merge trains)
# DISABLED BY DEFAULT (E2E_ENABLED gate, 2026-11-03): there is no runner
# capacity for the compose stack + Playwright on the shared docker runner, so
# every rule additionally requires the project CI/CD variable E2E_ENABLED=1.
# Unset (the default) keeps the e2e stage empty in every pipeline while the
# rules, the shared anchor and the hard needs stay in place — re-enabling is
# a variable flip, not a YAML change. Scheduled E2E (scheduled:integration +
# scheduled:e2e-web) is unaffected and keeps running on schedule pipelines.
# Rules union: the two rules below trigger e2e:integration on the shared
# filter PLUS the integration-only mobile entry. The web suite does not test
# the mobile app, so e2e:playwright deliberately does not run on mobile-only
# trains — its single alias rule cannot match there, and its hard needs can
# never dangle.
e2e:integration:
  extends: .e2e_integration_base
  stage: e2e
  resource_group: e2e-runner
  allow_failure: true  # per-image skip: not all images build on a given MR;
                        # e2e needs ALL → can fail if unchanged images not in tmp/
  rules:
    - if: '$E2E_ENABLED == "1" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      changes:
        - mobile/genie_ai_mobile/**/*
    - if: '$E2E_ENABLED == "1" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      changes:
        paths: *e2e_merge_train_changes

# Playwright E2E — runs on merge trains
e2e:playwright:
  extends: .e2e_web_base
  stage: e2e
  resource_group: e2e-runner
  needs: [e2e:integration]
  rules:
    - if: '$E2E_ENABLED == "1" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      changes:
        paths: *e2e_merge_train_changes

# --- Configuration validation ---

# Verify each overlay module's requirements-cpu.txt is in sync with its
# requirements.in (retriever/reranker). Fails if someone edited a
# requirements.in (or bumped OPEA, or changed the Dockerfile base/apt layer)
# without running `make lock-<module>`. Catches silent lock drift before it
# reaches a build. Split into per-module parallel jobs so a transient PyPI
# failure in one module's tag-pipeline check does not block the other
# (reduced blast radius — DW-29). Dockerfile-* paths are included because
# OPEA_VERSION / apt / base-image bumps are canonical lock-regen triggers.
# Note: dataprep retired from this check (issue-834 lock pipeline retired
# on the v1.5 bump — dataprep no longer ships a requirements.in).
.verify-overlay-lock-base:
  stage: config
  image: python:3.11-slim
  interruptible: true
  # The lock check is self-contained (uv sync --dry-run + grep against the
  # checked-out files) — it must not pull upstream artifacts. Without this,
  # GitLab's default makes the job download EVERY test-stage artifact (scan
  # reports, JUnit XML), so an unrelated artifact-download failure kills the
  # lock check before its script even runs (2026-09-02: instance artifact
  # downloads 403'd pipeline-wide while uploads succeeded).
  dependencies: []
  variables:
    UV_VERSION: "0.10.6"
  before_script:
    - pip install --no-cache-dir "uv==${UV_VERSION}"
  script:
    - |
      set -e
      cd "${CI_PROJECT_DIR}/genie-ai-overlay/${MOD}"
      # Verify lock is consistent and installable without re-resolving.
      # uv pip sync --dry-run checks every package+hash exists on PyPI;
      # it does NOT re-resolve, so upstream version bumps don't cause
      # spurious failures (only removed packages do).
      uv pip sync requirements-cpu.txt --dry-run --system
      # Cross-check: verify requirements.in is covered by the lock.
      # greps top-level non-comment lines from requirements.in and
      # checks each package name appears in the lock. Missing = user
      # added a dep without regenerating the lock.
      while IFS= read -r line; do
        pkg=$(echo "$line" | sed 's/[<>=!~].*//;s/\[.*//;s/#.*//' | xargs)
        [ -z "$pkg" ] && continue
        norm=$(echo "$pkg" | tr '[:upper:]_' '[:lower:]-')
        if ! grep -q "^${norm}==" requirements-cpu.txt; then
          echo "MISSING from ${MOD} lock: $pkg — run 'make lock-${MOD}'"
          exit 1
        fi
      done < requirements.in
      echo "genie-ai-overlay/${MOD}/requirements-cpu.txt in sync"

verify:overlay-locks:retriever:
  extends: .verify-overlay-lock-base
  variables:
    MOD: retriever
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"
        compare_to: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths:
          - "genie-ai-overlay/retriever/requirements.*"
          - "genie-ai-overlay/retriever/Dockerfile-*"
          - ".gitlab-ci.yml"

verify:overlay-locks:reranker:
  extends: .verify-overlay-lock-base
  variables:
    MOD: reranker
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes:
        paths:
          - "genie-ai-overlay/reranker/requirements.*"
          - "genie-ai-overlay/reranker/Dockerfile-*"
          - ".gitlab-ci.yml"


config:validate:
  extends: .node_base
  stage: config
  # Self-contained env-coverage checks (npm test on the checkout) — no
  # upstream artifacts needed: the default artifact coupling made this
  # job 403-flake with the 2026-09-02/03 instance artifact-download problem.
  dependencies: []
  before_script:
    # The config-validator suite includes the shell-syntax gate (#1306,
    # #1322): it shell-extracts the .gitlab-ci.yml script blocks and runs
    # `bash -n` on each. The node:22-alpine image ships no bash — without
    # this install the gate throws instead of running.
    - apk add --no-cache bash
    - cd tests/config-validator && npm ci
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm ci
    - cd ${CI_PROJECT_DIR}/components/gov-chat-frontend && npm ci
  script:
    - cd ${CI_PROJECT_DIR}/tests/config-validator && npm test
    - cd ${CI_PROJECT_DIR}/api-gateway-solution/new-config && npm run test:ci
    # Each shipped config is validated against the schema it embeds. The
    # frontend's parity suite checks the asset keys agree across the seven
    # files; it never checks a file's data against its own schema, so a
    # mistyped value or a dropped required key ships otherwise.
    - cd ${CI_PROJECT_DIR}/components/gov-chat-frontend && npm run validate:config
  cache:
    - key:
        files:
          - tests/config-validator/package-lock.json
        prefix: config-validate
      paths:
        - tests/config-validator/node_modules/
      fallback_keys:
        - "config-validate-$CI_DEFAULT_BRANCH"
        - "config-validate-"
    - key:
        files:
          - api-gateway-solution/new-config/package-lock.json
        prefix: config-kong
      paths:
        - api-gateway-solution/new-config/node_modules/
      fallback_keys:
        - "config-kong-$CI_DEFAULT_BRANCH"
        - "config-kong-"
    - key:
        files:
          - components/gov-chat-frontend/package-lock.json
        prefix: config-frontend
      paths:
        - components/gov-chat-frontend/node_modules/
      fallback_keys:
        - "config-frontend-$CI_DEFAULT_BRANCH"
        - "config-frontend-"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - tests/config-validator/reports/jest-config.xml
        - api-gateway-solution/new-config/reports/jest-kong-config.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "env"
        - "env.*"
        - "docker-compose.yaml"
        - "docker-compose.gpu.yaml"
        - "genie-ai-overlay/retriever/**/*"
        - "genie-ai-overlay/chatqna/**/*"
        - "deploy/ansible/**/*"
        - "tests/config-validator/**/*"
        # The e2e handle gate (tests/config-validator/__tests__/e2e-handle-locators.test.js)
        # reads the specs: a spec that reintroduces a class locator must fail
        # the gate in the same pipeline, so a change under tests/e2e/ triggers
        # the job that runs it.
        - "tests/e2e/**/*"
        - "tests/fixtures/config/**/*"
        - "api-gateway-solution/new-config/**/*"
        - "components/gov-chat-frontend/public/config/genie-ai-config*.json"
        - "components/gov-chat-frontend/scripts/validate-config-schema.js"
        - "configs/keycloak/themes/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Validate the internal links of the documentation site.
#
# Hugo rewrites Markdown links that point at a content path, but never
# rewrites raw-HTML href attributes, and it keeps the old URL of a moved page
# alive as a redirect.  A link that only resolves through a redirect still
# works, but the reader lands on a redirect hop and the URL bar shows a path
# that is not the page's address -- the defect this guard was written for.
# The checker also refuses a `slug:` on a section, because Hugo's handling of
# a section slug depends on the Hugo version and the site is built from a
# floating Hugo image.
config:docs-links:
  extends: .node_base
  stage: config
  script:
    - cd ${CI_PROJECT_DIR}/site && node --test scripts/check-links.test.mjs
    - cd ${CI_PROJECT_DIR}/site && node scripts/check-links.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "site/content/**/*"
        - "site/scripts/**/*"
        - "site/hugo.toml"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# The e2e provisioning-block stub-curl harness (#1337): executes the
# Keycloak provisioning/readiness script item of .e2e_web_base under a
# scripted stub curl — the guard semantics (retry classes, honest-status
# echoes, loud failures) become regression-proofed instead of eyeballed.
# Provenance: the scratch version caught a real bug the code review missed
# during #1289 (see tests/ci-provisioning/README.md).
config:provisioning-harness:
  image: python:3.11-slim
  stage: config
  interruptible: true
  dependencies: []
  before_script:
    - pip install --cache-dir .cache/pip "pyyaml==6.0.2"
  cache:
    - key: provisioning-harness-pyyaml
      paths:
        - .cache/pip/
      fallback_keys:
        - provisioning-harness-
  script:
    - bash tests/ci-provisioning/run.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "tests/ci-provisioning/**/*"
        - ".gitlab-ci.yml"
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      when: on_success

# Regenerate the Dart OpenAPI client from the current backend sources and
# diff it against the committed copy (scripts/generate-api-client.sh --check).
# Fails the pipeline when mobile/genie_ai_mobile/openapi_client/ has drifted
# from the backend spec — the drift class of the #1122 incident; the wiring
# of this gate is #1220. The dart generator emits deterministic output
# for the pinned generator version (openapitools.json) and never invokes a
# Dart SDK, so no Flutter tooling is needed here — only a JRE for the
# generator jar plus Node for the spec extraction.
#
# The paths whose change can move the committed client or the gate itself —
# one list for the MR rule and the branch rule so they cannot drift apart.
# The explicit .openapi-generator-ignore entry is belt-and-suspenders: the
# **/* wildcard is documented to match dotfiles under the rules matcher's
# File.fnmatch DOTMATCH dialect, but matcher dialects have differed across
# GitLab subsystems before (see .claude/rules/CVE-REMEDIATION.md) and this
# is the one dotfile a human hand-edits.
.api_client_source_changes: &api_client_source_changes
  [ "components/gov-chat-backend/**/*", "package.json", "mobile/genie_ai_mobile/openapi_client/**/*", "mobile/genie_ai_mobile/openapi_client/.openapi-generator-ignore", "scripts/generate-api-client.sh", "openapitools.json", ".gitlab-ci.yml" ]

config:api-client:
  extends: .node_base
  stage: config
  variables:
    # Single source for the wrapper pin: the install line and the cache key
    # prefix below both expand it, so they cannot drift apart.
    OPENAPI_GENERATOR_CLI_WRAPPER_VERSION: "2.42.0"
  # A drift gate is only useful while the pipeline is still cheap to
  # retry: start at launch instead of after the lint and test stages.
  needs: []
  before_script:
    # openapi-generator-cli is Java-based: a JRE for the generator jar (21 —
    # the LTS with the longer alpine runway), bash (the script is a bash
    # script) and GNU diff (the staleness diff uses --exclude, which busybox
    # diff lacks) for the check itself.
    - apk add --no-cache bash diffutils openjdk21-jre-headless
    # Install into the project dir (not -g) so the wrapper AND the generator
    # jar it downloads land inside the cacheable path below. The wrapper and
    # the generator jar are one version pair: the jar version comes from the
    # tracked openapitools.json, the wrapper pin lives on the install line
    # below AND in the cache key prefix — a wrapper bump that moves one and
    # not the others silently serves a stale wrapper from a warm cache. A
    # cache hit already holds the exact pinned wrapper — skip the install
    # (and its registry roundtrip) when the binary is present.
    - '[ -x "${CI_PROJECT_DIR}/.openapi-tools/node_modules/.bin/openapi-generator-cli" ] || npm install --prefix ${CI_PROJECT_DIR}/.openapi-tools @openapitools/openapi-generator-cli@${OPENAPI_GENERATOR_CLI_WRAPPER_VERSION}'
    - export PATH="${CI_PROJECT_DIR}/.openapi-tools/node_modules/.bin:$PATH"
    # The spec extraction executes only swagger-jsdoc (swagger-definition.js
    # and swagger-schemas.js have no npm requires of their own), so instead
    # of a full backend npm ci (~500 MB of runtime deps) install that one
    # package at the version the backend pins, into a --omit=dev root
    # install (a plain named install also reifies this repo's root
    # package.json dev tree — Playwright included). Node resolves the
    # require from the backend dir up to this root-level node_modules.
    - SWAGGER_JSDOC_VERSION=$(node -p "require('./components/gov-chat-backend/package.json').dependencies['swagger-jsdoc']")
    # node -p prints the literal "undefined" (exit 0) for a moved dependency,
    # so the guard must compare the string, not test emptiness.
    - '[ "$SWAGGER_JSDOC_VERSION" != "undefined" ] || { echo "swagger-jsdoc is no longer a production dependency of components/gov-chat-backend — the version pin cannot be resolved"; exit 1; }'
    - npm install --omit=dev --no-save --no-package-lock --prefix ${CI_PROJECT_DIR} "swagger-jsdoc@${SWAGGER_JSDOC_VERSION}"
  script:
    - npm run api-client:check
  cache:
    # The prefix expands the same wrapper-pin variable as the install line:
    # one bump moves both, and a warm cache can never serve an older
    # wrapper than the pin. Default save-on-success only — a failed run
    # must not persist a half-downloaded jar (the wrapper treats any file
    # in versions/ as downloaded and never re-fetches it).
    - key:
        prefix: openapi-tools-${OPENAPI_GENERATOR_CLI_WRAPPER_VERSION}
        files:
          - openapitools.json
      paths:
        - .openapi-tools/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # The whole backend tree, not just the spec sources: the extraction
      # reads swagger-definition.js's require chain (which grows) and
      # routes/*.js as text — an explicit source list would silently skip
      # exactly the MR that changes the spec.
      changes: *api_client_source_changes
      when: on_success
    # Same filter for branch pipelines (changes compares against the
    # previous SHA on pushes; pipeline sources without one — schedules, web
    # — run the job, which is what keeps validating main between merges).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\/*/'
      changes: *api_client_source_changes
      when: on_success

# Validate CHANGELOG.md has an entry for the version being released
config:changelog:
  stage: config
  image: alpine:3.21
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Checking CHANGELOG.md for version: ${VERSION}"
      if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
        echo "ERROR: CHANGELOG.md has no entry for version ${VERSION}."
        echo "Add a ## [${VERSION}] section before tagging."
        exit 1
      fi
      echo "CHANGELOG.md entry found for ${VERSION}."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# --- Scheduled jobs (nightly via pipeline schedule) ---

# Integration smoke test — runs full core stack via Docker Compose
# Enhanced by stories 1-8, 1-9 (Playwright E2E)
#
# REQUIRED CI Variables (Settings → CI/CD → Variables):
#   ARANGO_PASSWORD, POSTGRES_PASSWORD, KONG_DB_PASSWORD,
#   KEYCLOAK_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD,
#   KEYCLOAK_CLIENT_SECRET, GENIE_ADMIN_PASSWORD,
#   GENIE_ADMIN_EMAIL, KEYCLOAK_PROXY_CLIENT_SECRET,
#   KC_DATAPREP_CLIENT_SECRET, TRANSLATION_CACHE_PASSWORD
#
# CI variables override empty values from the env template (shell env > .env file).
# The env template provides non-secret config (KEYCLOAK_URL, KEYCLOAK_REALM, etc.).
scheduled:integration:
  extends: .e2e_integration_base
  stage: scheduled
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# Web frontend E2E tests (Playwright)
# Runs against the Docker stack started by scheduled:integration
scheduled:e2e-web:
  extends: .e2e_web_base
  stage: scheduled
  needs: [scheduled:integration]
  resource_group: e2e-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success

# Teardown: clean up compose stack after E2E jobs finish (success or failure).
# Uses .post — GitLab's built-in final stage (always runs, even on failure).
.cleanup_base:
  image: docker:24
  stage: .post
  tags: [docker]
  script:
    - docker compose -p "ci-${CI_PIPELINE_ID}" down -v --remove-orphans 2>/dev/null || true

e2e:cleanup:
  extends: .cleanup_base
  rules:
    - if: '$E2E_ENABLED == "1" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      when: always

scheduled:cleanup:
  extends: .cleanup_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# --- Manual jobs (on-demand via Run Pipeline → click play) ---

# RAG quality regression — requires GPU runner
# Enhanced by Epic 8 (RAG Quality)
manual:rag-quality:
  image: python:3.11-slim
  stage: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  tags: [gpu]
  timeout: 60m
  before_script:
    - cd genie-ai-overlay
    - if [ ! -d .venv ]; then python -m venv .venv; fi
    - . .venv/bin/activate
    - pip install -e ".[test]"
  script:
    - . .venv/bin/activate
    - |
      if [ -z "$GPU_AVAILABLE" ]; then
        echo "No GPU detected — skipping RAG quality tests"
        exit 0
      fi
    - |
      pytest -m rag-quality --junitxml=reports/rag-quality.xml || echo "WARNING: No rag-quality tests found (Epic 8 placeholder)"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: genie-ai-overlay/reports/rag-quality.xml


# --- Documentation site build check ---
# The pages job below publishes on main ONLY, so a docs change on a merge
# request is never built until it lands — and a broken front-matter block,
# shortcode or relref then fails the PUBLISH rather than the merge, on the
# default branch, where it is most expensive to notice.
#
# This is the same build with no publish step, run on MRs. It exists so nobody
# has to install Hugo locally to find out whether a markdown edit compiles —
# which is the only reason this job is worth its runner minutes.
docs:build:
  stage: lint
  image: docker.io/hugomods/hugo:exts
  variables:
    GIT_SUBMODULE_STRATEGY: none
    HUGO_CACHEDIR: "$CI_PROJECT_DIR/.cache/hugo"
    HUGO_ENVIRONMENT: ci
  cache:
    key: hugo-docs
    paths:
      - .cache/hugo
  script:
    - cd site
    - hugo mod tidy
    # No --baseURL override: a relref that cannot resolve fails the build, which
    # is the whole point of running this before merge rather than after.
    - hugo --gc --minify --destination "$CI_PROJECT_DIR/.hugo-check"
    # Prove the build actually produced pages — a silent empty output would
    # otherwise read as success.
    - test -f "$CI_PROJECT_DIR/.hugo-check/index.html"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - site/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - site/**/*
        - .gitlab-ci.yml

# --- Documentation site -> GitLab Pages ---
# Builds the Hugo + Docsy site in site/ and publishes to GitLab Pages.
# Docsy is a Hugo Module (needs Go); assets need Node. hugomods/hugo:exts
# provides all three (latest stable).
pages:
  stage: deploy
  image: docker.io/hugomods/hugo:exts
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - cd site
    - hugo mod tidy
    - hugo --gc --minify --baseURL "$CI_PAGES_URL/" --destination "$CI_PROJECT_DIR/public"
  artifacts:
    paths:
      - public
  rules:
    # Publish to GitLab Pages on the default branch only.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
