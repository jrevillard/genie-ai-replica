{{- if and .Values.data.keycloak.enabled .Values.data.keycloak.realmImport -}}
{{- if and .Values.data.keycloak.verifyEmail (or (not (hasKey .Values.data.keycloak "smtp")) (not (eq (kindOf .Values.data.keycloak.smtp) "map")) (not (hasKey .Values.data.keycloak.smtp "host"))) -}}
{{- fail "data.keycloak.verifyEmail=true requires data.keycloak.smtp to be a map containing a 'host' key (smtp may be null OR a map missing 'host' OR a non-map value)" -}}
{{- end -}}
{{- /* failOnPlaceholderSecrets defaults to TRUE in values.yaml; a default
       install with `change-me-*` client secrets fails this render before
       the realm CR is built. The single loop covers all three failure
       modes (missing key / empty value / change-me prefix) for all
       three secrets (proxyClient, dataprep, grafana). Per-key `hasKey`
       fail() checks for the same three keys were previously rendered
       above this block, but empty values used to slip past `change-me-*`
       and a missing key rendered as `secret: ""` — both of which the
       Keycloak operator rejects. */ -}}
{{- $cs := .Values.data.keycloak.clientSecrets | default dict -}}
{{- if and (hasKey .Values.data.keycloak "clientSecrets") (not (eq (kindOf .Values.data.keycloak.clientSecrets) "map")) -}}
{{- fail "data.keycloak.clientSecrets must be a map (set it to {proxyClient, dataprep, grafana} or omit the key entirely; null/missing is fine)" -}}
{{- end -}}
{{- if .Values.data.keycloak.failOnPlaceholderSecrets }}
{{- range $k := list "proxyClient" "dataprep" "grafana" }}
{{- $v := dig $k "" $cs -}}
{{- if or (not $v) (eq $v "") (hasPrefix "change-me" $v) -}}
{{- fail (printf "data.keycloak.clientSecrets.%s is empty or a placeholder (change-me-*); set a real value in the values-override" $k) -}}
{{- end -}}
{{- end -}}
{{- end }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: genieai-realm
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "identity") | nindent 4 }}
    genieai.io/data-tier: identity
spec:
  # References the Keycloak CR above; import runs once the instance is Ready.
  keycloakCRName: keycloak
  realm:
    # realm name MUST match the in-cluster consumers' KC_REALM /
    # KEYCLOAK_REALM value (genie).
    realm: genie
    enabled: true
    # Single derivation of the public origin — every client's
    # rootUrl/redirectUris/webOrigins below uses $origin. A second
    # derivation site drifts and breaks that client's login with
    # invalid_redirect_uri while render gates stay green.
    # KeycloakRealmImport is import-once: the operator ignores later
    # spec.realm changes, so redirect URIs do NOT follow a
    # post-install ingress.host change (re-import or manual client
    # edit required).
    {{- $origin := printf "https://%s" (.Values.ingress.host | default "genieai.local") }}
    # TLS terminates at the edge (Envoy Gateway); the Keycloak pod serves
    # plain HTTP inside the cluster. `external` (the Keycloak default)
    # would reject every internal http:// redirect URI.
    sslRequired: none
    # Boolean fields below are coerced via `eq (val | toString) "true"`
    # so `--set-string key=true` and `--set key=true` both render a YAML
    # `true` boolean (without the cast, a string value from --set-string
    # would render as the literal string and Keycloak would reject it).
    # `default <literal>` preserves the realm's built-in default when the
    # operator leaves the key unset.
    registrationAllowed: {{ eq ((.Values.data.keycloak.registrationAllowed | default false) | toString) "true" }}
    # Drives the new-user email-verification flow — only meaningful when
    # the operator sets data.keycloak.smtp; defaults false (Keycloak's
    # own default) so dev installs without SMTP stay login-able.
    verifyEmail: {{ eq ((.Values.data.keycloak.verifyEmail | default false) | toString) "true" }}
    loginWithEmailAllowed: {{ eq ((.Values.data.keycloak.loginWithEmailAllowed | default true) | toString) "true" }}
    duplicateEmailsAllowed: {{ eq ((.Values.data.keycloak.duplicateEmailsAllowed | default false) | toString) "true" }}
    resetPasswordAllowed: {{ eq ((.Values.data.keycloak.resetPasswordAllowed | default false) | toString) "true" }}
    editUsernameAllowed: {{ eq ((.Values.data.keycloak.editUsernameAllowed | default false) | toString) "true" }}
    bruteForceProtected: {{ eq ((.Values.data.keycloak.bruteForceProtected | default true) | toString) "true" }}
    permanentLockout: false
    maxFailureWaitSeconds: 900
    minimumQuickLoginWaitSeconds: 60
    failureFactor: 30
    {{- with .Values.data.keycloak.passwordPolicy }}
    passwordPolicy: {{ . | quote }}
    {{- end }}
    accessTokenLifespan: {{ .Values.data.keycloak.accessTokenLifespan | default 300 }}
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    internationalizationEnabled: {{ eq ((.Values.data.keycloak.internationalizationEnabled | default true) | toString) "true" }}
    supportedLocales:
{{ toYaml (.Values.data.keycloak.supportedLocales | default (list "ar" "de" "en" "es" "fr" "pt" "ru" "th" "zh-Hans")) | indent 6 }}
    defaultLocale: en
    # SMTP (email verification) is deployment-specific: rendered only
    # when the operator sets data.keycloak.smtp in their values
    # override. Fields mirror the Swarm realm export
    # (configs/keycloak/genie-realm.yaml).
    {{- with .Values.data.keycloak.smtp }}
    smtpServer:
      from: {{ .from | quote }}
      host: {{ .host | quote }}
      # port: int (Keycloak CRD rejects a quoted string). The values file
      # may ship a string (operators using --set-string), so the default +
      # int cast defends against both shapes.
      port: {{ .port | default 587 | int }}
      ssl: {{ eq (.ssl | toString) "true" }}
      starttls: {{ eq (.starttls | toString) "true" }}
      auth: {{ eq (.auth | toString) "true" }}
      user: {{ .user | quote }}
      password: {{ .password | quote }}
    {{- end }}
    # Realm roles — MUST match the Swarm realm export: `admin` is a
    # composite over realm-management so the backend's user-management
    # proxy works, `dataprep-service` authorizes the dataprep service
    # account against document-repository.
    roles:
      realm:
        - name: admin
          description: Administrator role with full access
          composite: true
          composites:
            client:
              realm-management:
                - manage-users
                - query-users
                - view-identity-providers
        - name: dataprep-service
          description: Service account role for Dataprep ingestion pipeline
    users:
      - username: genie-admin
        enabled: true
        firstName: Admin
        lastName: GENIE
        # Keycloak user profile requires `email` + `emailVerified: true` for
        # login to succeed (SERVER-TESTING.md: "Account is not fully set up").
        # Operators override via deploy/environments/<env>/values-override.yaml
        # under `data.keycloak.adminEmail`.
        email: {{ .Values.data.keycloak.adminEmail | default "genie-admin@genieai.local" | quote }}
        emailVerified: true
        realmRoles:
          - admin
        # Full realm-management grant, verbatim from the Swarm export —
        # the composite `admin` role only covers 3 of these; dropping the
        # rest silently 403s admin-console operations (client inspection,
        # realm settings, events, impersonation).
        clientRoles:
          realm-management:
            - view-realm
            - manage-realm
            - query-realms
            - view-users
            - manage-users
            - query-users
            - impersonation
            - query-groups
            - view-clients
            - manage-clients
            - query-clients
            - create-client
            - view-events
            - manage-events
            - view-identity-providers
            - manage-identity-providers
            - view-authorization
            - manage-authorization
        # The user imports without credentials — an empty-string password
        # value would materialize a malformed null-hash credential, so no
        # credentials block is rendered at all. genie-admin cannot
        # authenticate until a password is set out-of-band:
        #   kubectl exec deploy/keycloak -- /opt/keycloak/bin/kcadm.sh \
        #     set-password -r genie --username genie-admin \
        #     --new-password '<password>'
      # No explicit service-account user entries: Keycloak 26+ auto-creates
      # the `service-account-<clientId>` user on first client-credentials
      # grant, and the client-level realm-management / dataprep-service role
      # grants on the `clients:` block below propagate to that auto-created
      # user at grant time. Explicit entries used to duplicate that user and
      # collided with the auto-create.
    clients:
      # Keycloak built-in account console (needs webOrigins for iframe auth)
      - clientId: account
        enabled: true
        webOrigins:
          - {{ $origin }}
      - clientId: account-console
        enabled: true
        webOrigins:
          - {{ $origin }}
      # Web SPA — PUBLIC client with PKCE (browser apps cannot hold client
      # secrets; the Swarm realm ships publicClient: true — rendering it
      # confidential breaks authorization_code login with invalid_client).
      - clientId: genie-app
        enabled: true
        publicClient: true
        directAccessGrantsEnabled: false
        standardFlowEnabled: true
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        rootUrl: {{ $origin }}
        redirectUris:
          - {{ $origin }}/*
          # Dev convenience only: local `npm run dev` servers on arbitrary
          # ports. Widens the OAuth redirect surface otherwise — prod/staging
          # restrict logins to the configured origin. Keycloak allows NO
          # wildcard in the port (`http://localhost:*` is rejected at realm
          # import); the bare host is Keycloak's port-agnostic localhost
          # special case.
          {{- if eq .Values.clusterProfile "dev" }}
          - http://localhost
          {{- end }}
        webOrigins:
          - {{ $origin }}
          # Dev convenience, same gate as redirectUris above: without the
          # browser origin whitelisted here, the token endpoint rejects
          # the CORS preflight and local login dies.
          {{- if eq .Values.clusterProfile "dev" }}
          - http://localhost
          {{- end }}
        attributes:
          pkce.code.challenge.method: S256
          oauth2.device.authorization.grant.enabled: false
          client.credentials.use.refresh.token: false
          require.pushed.authorization.requests: false
      # Service account for the backend's Keycloak Admin API proxy
      # (user/role CRUD on behalf of admin operations; permissions
      # restricted via the realm-management client roles above).
      - clientId: genie-proxy-client
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        # KeycloakRealmImport cannot read Kubernetes Secrets — the secret
        # is supplied at install time via the operator's values override
        # (`data.keycloak.clientSecrets.proxyClient`) and MUST equal the
        # value sealed in the `keycloak-proxy-client-secret` SealedSecret
        # the backend consumes.
        secret: {{ dig "proxyClient" "" $cs | quote }}
        # Client-level realm-management scopes — propagate to the
        # auto-created service-account-<clientId> user at first grant
        # (Keycloak 26+ no longer needs the explicit user entry).
        clientRoles:
          realm-management:
            - query-users
            - view-users
            - manage-users
            - view-realm
      # Service account for the Dataprep ingestion pipeline (client_credentials
      # grant for service-to-service calls into document-repository).
      - clientId: dataprep-service-client
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        # Same rule as proxyClient: must equal the `kc-dataprep-client-secret`
        # SealedSecret value (`data.keycloak.clientSecrets.dataprep`).
        secret: {{ dig "dataprep" "" $cs | quote }}
        # Client-level realm role — propagates to the auto-created
        # service-account-<clientId> user at first grant.
        realmRoles:
          - dataprep-service
      # Mobile OIDC client (Flutter app) — public client with PKCE per
      # RFC 8252; mobile apps cannot hold secrets. Refresh-token rotation
      # on. The chart defaults (client genie-mobile, scheme genieai) are
      # deploy-time placeholders operators override per institution.
      - clientId: {{ .Values.data.keycloak.mobileClientId | default "genie-mobile" | quote }}
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        attributes:
          pkce.code.challenge.method: S256
          client.credentials.use.refresh.token: true
          oauth2.device.authorization.grant.enabled: false
          require.pushed.authorization.requests: false
        redirectUris:
          - {{ .Values.data.keycloak.mobileRedirectScheme | default "genieai" }}://callback
        webOrigins:
          - "+"
      # Grafana OIDC SSO client — confidential, standard flow, redirect
      # under the /grafana/ Kong-route equivalent.
      - clientId: grafana
        enabled: true
        publicClient: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        secret: {{ dig "grafana" "" $cs | quote }}
        attributes:
          pkce.code.challenge.method: S256
          oauth2.device.authorization.grant.enabled: false
          client.credentials.use.refresh.token: false
          require.pushed.authorization.requests: false
        redirectUris:
          - {{ $origin }}/grafana/*
        webOrigins:
          - {{ $origin }}
{{- end -}}
