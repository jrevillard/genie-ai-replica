apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-check
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "pre-install") | nindent 4 }}
    app.kubernetes.io/component: pre-install
  annotations:
    # Helm 3 scans templates/ recursively for hook annotations. Subdirectory
    # name `hooks/` is irrelevant to Helm; the annotations below are what
    # matter.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"          # run after clusterprofile-detect (-10)
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "pre-install") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "genieai-common.fullname" . }}-dep-check
      # The evaluator reads only the two mounted JSON files; it makes no
      # Kubernetes API calls, so it never needs a service account token.
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dep-check
          # Minimal alpine + python base; the evaluator parses only the two
          # JSON mounts and needs no YAML library.
          image: "{{ .Values.global.imageRegistry | default "docker.io" }}/python:3.12-alpine"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          command:
            - python3
            - -c
            - |
              import json, os, sys
              graph_path = "/var/run/genieai/dependency-graph.json"
              if not os.path.exists(graph_path):
                  print(f"FAIL: {graph_path} missing"); sys.exit(1)
              try:
                  with open(graph_path) as f:
                      graph = json.load(f)
              except (FileNotFoundError, json.JSONDecodeError) as e:
                  print(f"FAIL: dependency-graph.json is missing or corrupt: {e}"); sys.exit(1)
              # Enabled toggles come from the enabled.json mount — the
              # chart flattens every `services.<X>.enabled` /
              # `data.<X>.enabled` boolean to JSON at render time. The
              # graph lists only declared deps; enabled.json is the sole
              # source for whether each component is on.
              enabled_json = "/var/run/genieai/enabled.json"
              if not os.path.exists(enabled_json):
                  print(f"FAIL: {enabled_json} missing"); sys.exit(1)
              try:
                  with open(enabled_json) as f:
                      enabled = json.load(f)
              except (FileNotFoundError, json.JSONDecodeError) as e:
                  print(f"FAIL: enabled.json is missing or corrupt: {e}"); sys.exit(1)
              # Dependency names resolve against the graph's own
              # namespaces: a name present under services.* is a service
              # dep, anything else a data dep.
              def dep_enabled(dep):
                  if dep in graph.get("services", {}):
                      return enabled.get(f"services.{dep}.enabled", False)
                  return enabled.get(f"data.{dep}.enabled", False)
              def dep_kind(dep):
                  return "service" if dep in graph.get("services", {}) else "data"
              failures = []
              for tier in ("services", "data"):
                  for svc, deps in graph.get(tier, {}).items():
                      if not enabled.get(f"{tier}.{svc}.enabled", False):
                          continue
                      for dep in deps.get("deps", []):
                          if dep == "":
                              continue
                          if not dep_enabled(dep):
                              failures.append(f"{tier}.{svc} requires {dep_kind(dep)}.{dep}")
              if failures:
                  print("FAIL: unmet dependencies")
                  for f in failures:
                      print(f"  - {f}")
                  sys.exit(1)
              print("PASS: dependency graph satisfied")
          volumeMounts:
            - name: dependency-graph
              mountPath: /var/run/genieai
              readOnly: true
      volumes:
        - name: dependency-graph
          configMap:
            name: {{ include "genieai-common.fullname" . }}-dep-graph
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "genieai-common.fullname" . }}-dep-graph
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "genieai-common.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "pre-install") | nindent 4 }}
  annotations:
    # Hook with weight -20: created after the RBAC (-30) and BEFORE the
    # dep-check Job (-5) mounts it. A regular ConfigMap would not exist on
    # first install (regular resources land after all pre-install hooks).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- /*
    enabled.json flattens the component enabled toggles as JSON so the
    dependency-check Pod reads them without parsing values.yaml. Absent
    keys read FALSE — an unexported toggle disables, never enables, a
    component's edge checks.
  */}}
data:
  dependency-graph.json: |
    {{- include "genieai-umbrella.dependencyGraph.json" . | nindent 4 }}
  enabled.json: |
    {{- /* FAIL-SAFE flat map: every toggle defaults to FALSE when absent —
           a missing export disables a component's checks, never enables
           them. Exported keys derive from the graph itself (the ranges
           below iterate dependencyGraph keys), so a new graph node exports
           its toggle automatically. The round-trip via toRawJson|fromJson
           makes the values tree a plain map[string]interface{} that Sprig's
           `dig` navigates uniformly across Helm versions; inside a literal
           block scalar, dash-closers would trim the newline the `|` pipe
           needs, so every line uses plain `}}` closers. */ -}}
    {{- $vals := $.Values | toRawJson | fromJson }}
    {{- $flat := dict }}
    {{- range $name, $deps := dig "dependencyGraph" "services" dict $vals }}
    {{- $_ := set $flat (printf "services.%s.enabled" $name) (dig "services" $name "enabled" false $vals) }}
    {{- end }}
    {{- range $name, $deps := dig "dependencyGraph" "data" dict $vals }}
    {{- $_ := set $flat (printf "data.%s.enabled" $name) (dig "data" $name "enabled" false $vals) }}
    {{- end }}
    {{ $flat | mustToJson }}
