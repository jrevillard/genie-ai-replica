# chart-testing config — FLAT kebab-case keys only (upstream config schema).
# There is NO `kubeVersion` config key and NO --kube-version CLI flag
# (verified against chart-testing v3.15.0 source): the K8s version is pinned
# solely by the kind node image (kindest/node:v1.33.0) the ct cluster is
# created from.
remote: origin
# Maintainer validation queries the git hosting service over HTTPS to verify
# accounts; our self-hosted GitLab serves a cert the runner does not trust,
# and maintainers use role addresses (example.invalid) that no forge would
# resolve anyway. Chart.yaml authorship is enforced by CODEOWNERS instead.
validate-maintainers: false
# target-branch: omitted — ct derives the MR target branch in CI.
# Hard-coding one branch would block MRs from any other branch.
chart-dirs:
  - charts
chart-repos: []          # only the file:// library dep today;
                         # operator repos are added as their tiers land
excluded-charts: []
helm-extra-args: --timeout 300s
debug: true
