---
# ROCm GPU node (AMD Strix Halo / gfx1151 class) — non-secret variables.
# Secrets (hugging_face_hub_token, gpu_api_keys) live in vault.yml
# (encrypted, never committed) — see deploy/ansible/README.md.
#
# Image pins from the ROCm spike (2026-11-11):
# docs/superpowers/specs/2026-11-11-rocm-gpu-tier-spike-results.md

gpu_deploy_dir: /opt/genieai-rocm-gpu
gpu_data_dir: /opt/genieai-rocm-gpu/data
gpu_generated_dir: configs/nginx-gpu
gpu_public_domain: ""          # set per deployment
gpu_https_port: "443"
gpu_self_signed_certs: true

# The template renders NVIDIA_VISIBLE_DEVICES from this var; `void`
# neutralizes it on the ROCm path (containers ignore it, no GPU claimed
# even on an NVIDIA host).
nvidia_visible_devices: "void"

# ROCm image pins (spike winners)
vllm_llm_image: rocm/vllm:rocm10.1.0_ubuntu24.04_py3.14-pytorch_2.13.0_vllm-0.29.0
vllm_translation_image: rocm/vllm:rocm10.1.0_ubuntu24.04_py3.14-pytorch_2.13.0_vllm-0.29.0
tei_embedding_image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
tei_reranker_image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
docling_serve_image: ghcr.io/docling-project/docling-serve:v1.21.0
nginx_image: nginx:1.28-alpine

# Host-specific device group GIDs (distro-specific; verified in the
# install tag against `getent group render video`)
rocm_render_gid: 990
rocm_video_gid: 44

# Set true ONLY on a single-server ROCm host that co-locates the app
# stack with this GPU-node stack (renders SECTION 18B endpoint overrides
# in the app .env). Undefined/false = no output.
# rocm_gpu_node_local: true

# Task 14 — GPU reranker: the TEI ROCm image cannot run on gfx1151
# (Instinct-only kernels; see the spike results), so the /rerank/ proxy
# route flips to the third vLLM instance added by the
# docker-compose.rocm.gpu.yaml overlay. The app side selects the same
# backend with RERANKER_BACKEND=vllm (rendered in SECTION 18B).
gpu_rerank_upstream: vllm-reranker:8000
vllm_reranker_model_id: BAAI/bge-reranker-v2-m3

# CPU-TEI batch caps (code review finding 3, 2026-11-18): the GPU-node stack
# runs CPU TEI on this class of hardware (the TEI ROCm image cannot run on
# gfx1151), and CPU-TEI inflates candle buffers at the GPU-sized defaults —
# measured 16.3 GiB RSS at 8192/32 on Strix Halo (commit 196bc549 capped the
# compose venue at 2048/8/2048). Mirror the caps here; the template renders
# them only when defined, so NVIDIA renders (which never load this file) stay
# byte-identical.
tei_embedding_max_batch_tokens: "2048"
tei_reranking_max_batch_tokens: "2048"
tei_reranking_max_concurrent_requests: "8"
